# The textbook collection.
#
# One entry point for every book: the landing page, the deployment base URL and
# the order qualifications are presented in. Individual books declare their own
# identity in books/<id>/book.yaml.

title: Interactive Textbooks
description: >-
  Free, interactive textbooks. Every Practise set is checked by a computer. Read
  online, with nothing to install.
# The licence covers the whole collection, so it lives here rather than per book.
# The reader-facing page `About this book` renders it (see scaffold.colophon_page),
# and LICENSE holds the legal code. Content is CC BY 4.0; the engine source is MIT
# (LICENSE-CODE); third-party material keeps its own terms.
licence:
  name: Creative Commons Attribution 4.0 International
  url: https://creativecommons.org/licenses/by/4.0/
# Production domain: open-textbook.org — registered through Cloudflare Registrar,
# with DNS served by Cloudflare. The collection is published as static files to
# Cloudflare's static hosting and served from the apex of that domain. It is also
# intended to be installable as a PWA on phones. See "Deployment and platform
# targets" in SHAPE.md for the constraints that follow from both choices.
#
# This is the production origin: every profile's `site_url`, its canonical links
# and its sitemap are derived from it (see `site_url()` in
# engine/textbook/scaffold.py), so it must match where the site is actually
# served from. Deploying elsewhere means changing this first.
base_url: https://open-textbook.org/

# Theme bundles live in themes/. Each is a full light and dark palette plus its
# typography; a book contributes its subject tint on top. The reader's choice is
# shared across every book and the landing page, and switching subject never
# switches theme.
default_theme: editorial
# Menu order. Any bundle not listed follows, alphabetically. The calm groups come
# first — quiet paper, restrained colour, built for long reading — then the vivid
# groups, chosen when colour is wanted. Every bundle is original work authored in
# this repository; see DECISIONS.md.
themes:
  # calm
  - editorial
  - clean
  - harbour
  # vivid
  - neon
  - phosphor
  - glass
# Animated backgrounds for the landing pages, and the default a book inherits.
# Nothing ships one; the seam is in engine/textbook/backgrounds.py.
backgrounds:
  site: null

# Set to false to withdraw the theme menu from the landing page while keeping the
# reader's choice working. Useful once a default has been settled on.
theme_selector: true

qualifications:
  - id: GCSE
    title: GCSE
    note: Grades 9-1, with Foundation and Higher tier where the board offers it.
  - id: A-level
    title: A level
    note: Full A-level courses.
  # Not a qualification. Proofs are not taught by one course or examined by one
  # board, and a proof book belongs to no subject — so it needs a group of its own
  # rather than being filed under one of the courses that links to it.
  - id: Reference
    title: Reference
    note: Material that belongs to more than one course.

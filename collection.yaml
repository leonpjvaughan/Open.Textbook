# The textbook collection.
#
# One entry point for every book: the landing page, the deployment base URL and
# the order qualifications are presented in. Individual books declare their own
# identity in books/<id>/book.yaml.

title: Interactive Textbooks
description: >-
  Free, interactive textbooks. Every Practise set is checked by a computer. Read
  online, with nothing to install.
# The licence covers the whole collection, so it lives here rather than per book.
# The reader-facing page `About this book` renders it (see scaffold.colophon_page),
# and LICENSE holds the legal code. Content is CC BY 4.0; the engine source is MIT
# (LICENSE-CODE); third-party material keeps its own terms.
licence:
  name: Creative Commons Attribution 4.0 International
  url: https://creativecommons.org/licenses/by/4.0/
# Production domain: open-textbook.org — registered through Cloudflare Registrar,
# with DNS served by Cloudflare. The collection is published as static files to
# Cloudflare's static hosting and served from the apex of that domain. It is also
# intended to be installable as a PWA on phones. See "Deployment and platform
# targets" in SHAPE.md for the constraints that follow from both choices.
#
# This is the production origin: every profile's `site_url`, its canonical links
# and its sitemap are derived from it (see `site_url()` in
# engine/src/textbook/scaffold.py), so it must match where the site is actually
# served from. Deploying elsewhere means changing this first.
base_url: https://open-textbook.org/

# Theme bundles live in themes/. Each is a full light and dark palette plus its
# typography; a book contributes its subject tint on top. The reader's choice is
# shared across every book and the landing page, and switching subject never
# switches theme.
default_theme: editorial
# Menu order. Any bundle not listed follows, alphabetically. The calm groups come
# first — quiet paper, restrained colour, built for long reading — then the vivid
# groups, chosen when colour is wanted. Every bundle is original work authored in
# this repository; see DECISIONS.md.
themes:
  # calm
  - editorial
  - clean
  - harbour
  # vivid
  - neon
  - phosphor
  - glass
# Animated backgrounds for the landing pages, and the default a book inherits.
# Nothing ships one; the seam is in engine/src/textbook/backgrounds.py.
backgrounds:
  site: null

# A layout owns geometry: size, spacing, measure and grid. A theme owns colour and
# type, so the two are chosen separately. Each id needs
# assets/stylesheets/layouts/<id>.css. The reader's Layout choice appears only
# when more than one is listed.
default_layout: matrix
layouts:
  - id: matrix
    title: Matrix
    description: Books sit in a grid under each qualification, so you can compare them at a glance.
  - id: ledger
    title: Ledger
    description: Every book sits on one line, so you can scan the list quickly.
  - id: focus
    title: Focus
    description: One book on each row and larger text, so you can read calmly for longer.
  - id: notebook
    title: Notebook
    description: Big headings and rounded cards, so each page feels like a friendly notebook.
  - id: atlas
    title: Atlas
    description: Short lists side by side in columns, so you can see every book at once.

# Set to false to withdraw the theme menu from the landing page while keeping the
# reader's choice working. Useful once a default has been settled on.
theme_selector: true

qualifications:
  - id: GCSE
    title: GCSE
    note: Grades 9-1, with Foundation and Higher tier where the board offers it.
    region: England · Ages 14–16
  - id: A-level
    title: A level
    note: Full A-level courses.
    region: England · Ages 16–18
  # The Irish qualifications. A qualification is a group on the landing page and a
  # label on a card; it carries no tier behaviour of its own. The levels differ by
  # jurisdiction — Foundation/Higher in England, Ordinary/Higher in Ireland, and
  # Foundation/Ordinary/Higher for Leaving Certificate Mathematics — so each book
  # declares its own axis in `book.yaml` and nothing here assumes one.
  - id: Junior Cycle
    title: Junior Cycle
    note: The Irish lower secondary programme. Ordinary and Higher level.
    region: Ireland · Ages 12–15
    companion:
      kicker: Next in Ireland
      title: Continue to the Leaving Certificate
      body: The Leaving Certificate follows Junior Cycle. It has books for Mathematics, Applied Mathematics and Physics.
      link: See the Leaving Certificate books
      href: "#band-leaving-certificate"
  - id: Leaving Certificate
    title: Leaving Certificate
    note: The Irish upper secondary programme. Ordinary and Higher level, and Foundation level in Mathematics.
    region: Ireland · Ages 16–18
    companion:
      kicker: Shared reference
      title: Proofs and Numerical Methods
      body: The Proofs book shows why formulas work. The Numerical Methods book helps you choose a method for a problem. Leaving Certificate pages link to both.
      link: See the reference books
      href: "#band-reference"
  # Not a qualification. Proofs are not taught by one course or examined by one
  # board, and a proof book belongs to no subject — so it needs a group of its own
  # rather than being filed under one of the courses that links to it.
  - id: Reference
    title: Reference
    note: Material that belongs to more than one course.
    region: Across the collection
  # Also not a qualification. A book about modelling belongs to no subject's
  # syllabus: it is read by anyone interested, at whatever level they come to it.
  # Filing it under a course would make a claim about its reader that is not true.
  - id: Misc
    title: Misc
    note: Material that belongs to no qualification.
    region: Applied and modelling
    companion:
      kicker: Looking for a method?
      title: Methods, A to Z
      body: The Numerical Methods book lists every method with the kind of problem it solves and what it costs.
      link: Open the methods index
      href: numerical-methods/techniques/

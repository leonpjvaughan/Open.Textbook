# Provenance for every claim in a-level-maths-textbooks-and-exams.md.
#
# Same shape as physics-textbooks-and-exams.sources.yaml: a tracked manifest;
# the fetched PDFs and extracted text live outside the build tree, in
# /tmp/pi-delegate/del-25/src and /tmp/pi-delegate/del-27 (this pass). No book
# directory is created here on purpose.
#
# This manifest does NOT duplicate all of the specification-level provenance.
# The DfE subject content, the Ofqual conditions and the three board
# specifications are cited in research/curriculum/a-level-maths.sources.yaml;
# they are repeated here (marked `cross_reference: true`) so that every `[id]`
# used in a-level-maths-textbooks-and-exams.md resolves from this one file.
# What this file adds is the *assessment-material* provenance: the question
# papers, mark schemes, examiner reports, exemplar booklets and the Pearson
# data set, plus the open resources surveyed for structure and voice.
#
# Fetch pattern (mirrors scripts/fetch_sources.sh):
#
#   UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
#   curl -fsSL -m 200 -A "$UA" -L <url> -o <file>.pdf
#   pdftotext -layout <file>.pdf <file>.txt
#
# A browser User-Agent is required: AQA, OCR and Pearson all refuse a bare curl.
# These routes were used and are worth reusing because the plain URL is not
# discoverable:
#   * AQA 2023 mark schemes are at www.aqa.org.uk/files/<repo-path>/<sha>.pdf
#     even though filestore.aqa.org.uk/.../-W-MS-/ 404s.
#   * Pearson's exam materials are enumerated by the public Algolia index its
#     own course-materials page queries (see `pearson-content-api`); the DAM
#     path copied from it downloads freely from qualifications.pearson.com. The
#     June 2026 series is only under /content/dam/secure/silver/... and needs a
#     login; the June 2025 and earlier series are at the non-secure path.
#   * OCR links every paper, mark scheme and examiners' report directly from
#     its JavaScript-rendered assessment page; the DOM must be read to get the
#     Image IDs.
#
# `read: opened` means the document itself was opened (PDF converted with
# pdftotext -layout) and the claim is taken from its text. The two documents
# marked `verified: re-fetched` were downloaded again in the retry pass
# (2026-10-11, /tmp/pi-delegate/del-27) and are byte-identical (sha256) to the
# copies read in the first pass — so the extraction behind the load-bearing
# command-word and mark-scheme claims is confirmed against the live URL, not
# merely against a cached copy.
#
# Copyright: the boards' papers, mark schemes, examiner reports and data set
# are commercial, all-rights-reserved documents and are NOT redistributed here.
# The findings file summarises and cites them; it does not reproduce them.

retrieved: 2026-10-11


  # ---- Open resources surveyed (structure and voice) -----------------------
  - id: openstax-precalculus-2e
    title: "OpenStax, Precalculus 2e"
    url: https://openstax.org/details/books/precalculus-2e
    read: opened (a section rendered)
    license: "CC BY-NC-SA 4.0 per the site footer"
    role: >-
      The open textbook whose section furniture was read: Learning Objectives
      -> narrative -> "Forms of ..." -> "How To" numbered procedure -> worked
      Example -> Solution -> "Try It" clone -> exercises. The model for a
      worked example's furniture; not a model for proof or modelling. Not a
      source of text.

  - id: ck12-calculus
    title: "CK-12 FlexBooks, Calculus"
    url: https://www.ck12.org/book/ck-12-calculus/
    read: opened (a lesson rendered)
    license: "not established; an Attribution guide is linked but a CC statement was not found on the page read — treat as all-rights-reserved"
    role: >-
      A compact lesson: Guidance narrative -> numbered Examples with Solutions
      -> Review set -> Review (Answers). Useful as a model for a single-screen
      "Learn" page; not a chapter model.

  - id: khan-precalculus
    title: "Khan Academy, Precalculus"
    url: https://www.khanacademy.org/math/precalculus
    read: opened (course page rendered)
    role: >-
      Course -> Unit -> lesson -> item (video, article, exercise). Lesson
      headings phrased as skills, including "Verifying inverse functions by
      composition". Described for structure only; nothing about its teaching
      quality is asserted.

  - id: underground-maths
    title: "Underground Mathematics"
    url: https://undergroundmathematics.org/
    read: opened (home page and the Quadratics station)
    license: "not stated on the pages read — check before reuse"
    role: >-
      The closest open resource designed for post-16 UK mathematics. Stations
      -> rich resources (essays, problems, interactives) -> Review questions,
      plus Pervasive ideas and Making connections. The best existing model for
      our guided-investigation (P6) pages: a task that requires a decision,
      with teacher notes rather than a stated answer.

  - id: nrich
    title: "NRICH (University of Cambridge)"
    url: https://nrich.maths.org/
    read: opened (home page and terms of use)
    license: "restrictive: private study and single copies for teaching permitted; text-and-data-mining and AI-training expressly prohibited without written permission"
    role: >-
      Rich problem-solving tasks with teacher notes. Cited for the licence
      warning in §10: do not fetch NRICH content into any pipeline of ours.

  - id: mei
    title: "MEI (Mathematics in Education and Industry)"
    url: https://mei.org.uk/
    read: opened (public pages only)
    role: >-
      The charity behind the MEI specifications and Integral. Its public
      curriculum-support and transition pages are a source of pedagogical
      positions; the A-level question bank (Integral) is subscription-based.

  - id: amsp
    title: "Advanced Mathematics Support Programme (AMSP)"
    url: https://amsp.org.uk/
    read: opened
    role: >-
      DfE-funded, led by MEI. Free teacher CPD and A-level Mathematics support
      materials; a legitimate source for the "where it is used" framing and for
      transition support.

  - id: pmt
    title: "Physics & Maths Tutor — A-level Mathematics"
    url: https://www.physicsandmathstutor.com/past-papers/a-level-maths/
    read: opened
    role: >-
      A third-party index of past papers, questions by topic, notes and
      solution banks. Two signals: it indexes by the DfE strand names (the
      words a student will meet in a topic search), and it treats
      questions-by-topic and notes as separate products — which is what our
      :::problems banks and our Learn pages are. It is a route to materials,
      not a licence; the copyright in any mirrored paper remains the board's.
      No board paper is cited here through this mirror.

  - id: mathsgenie
    title: "Maths Genie — A Level"
    url: https://www.mathsgenie.co.uk/a-level.html
    read: opened
    role: >-
      Cited as a caution: its free "A Level Old Maths" page is the pre-2017
      specification (C1-C4, S1, M1), not the current A-level. A resource that
      says "A-level" may be the previous qualification.

  - id: drfrost
    title: "Dr Frost Maths"
    url: https://www.drfrost.org/
    read: opened (landing page only; lesson resources are registration-gated)
    role: >-
      The landing page advertises "Lesson Resources", "Auto-Marking
      Worksheets", "Real Exam Questions" and "Video Explainers". No claim is
      made about the internal structure of a lesson, because no lesson page
      could be opened.


      stations in the time periods May to October 1987 and May to October
      2015"; the stations are Camborne, Heathrow, Hurn, Leeming and Leuchars
      (UK) and Beijing, Jacksonville and Perth (overseas); the sheet names
      confirm the sixteen station-period tables. The same sheet lists the tasks
      students must carry out and the eleven variables. Closes the open gap in
      a-level-maths.md §9.


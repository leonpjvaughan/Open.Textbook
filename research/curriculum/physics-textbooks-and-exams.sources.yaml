  - id: aqa-8463-p1h-2025
    title: "AQA GCSE Physics 8463/1H Paper 1 Higher Tier, June 2025: question paper, mark scheme, report on the examination"
    url: https://cdn.sanity.io/files/p28bar15/green/c08bff2dd77ec7384f09d3a6db77a4bde9435176.pdf
    page: https://www.aqa.org.uk/subjects/physics/gcse/physics-8463/assessment-resources
    role: >-
      The primary source for the GCSE mark-scheme conventions: the level-of-
      response instructions and the two-marks-per-level structure, the
      "right + wrong = wrong" list principle, the error-carried-forward rule
      (ecf), "full marks … for a correct numerical answer, without any working
      shown", the 6-mark specific-heat-capacity method item tagged RPA1, and the
      "you are reminded of the need for good English" instruction with no QWC
      mark. The report supplies misconceptions (environmental claims needing the
      flow speed; the list principle in practice).


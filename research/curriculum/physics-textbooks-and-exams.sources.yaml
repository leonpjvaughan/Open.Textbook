  # ---- Textbooks and open resources ----------------------------------------
  - id: openstax-physics
    title: "OpenStax, Physics (high-school / Texas Education Agency adaptation)"
    url: https://openstax.org/details/books/physics
    page: https://openstax.org/details/books/physics
    license: "CC BY-NC-SA in the book's own reuse statement (the CMS API reports CC BY 4.0); attributes Texas Education Agency; forbids LLM ingestion without written permission"
    role: >-
      The only full open physics textbook that could be opened. Read for
      structure (Section Learning Objectives, Section Key Terms, Teacher
      Support, Worked Example, Grasp Check / Check Your Understanding, Watch
      Physics, Practice Problems, Conceptual Questions, Problems) and for voice
      and derivation style. NOT a source of text: the reuse statement forbids
      both commercial reuse and LLM ingestion. See the copyright section.

  - id: openstax-cms-api
    title: "OpenStax CMS API — book metadata (title, licence, PDF URL)"
    url: https://openstax.org/apps/cms/api/v2/pages/?type=books.Book&fields=title,slug,license_name,license_version,license_url,book_state,high_resolution_pdf_url&limit=200
    role: >-
      The licence evidence for the three physics books: Physics is reported as
      CC BY 4.0, College Physics 2e and University Physics Volume 1 as CC BY-NC-SA
      4.0. Contradicts the Physics book's own footer, which states NC-SA; the
      footer is the operative caution in the findings.

  - id: openstax-physics-section
    title: "OpenStax, Physics, §2.1 Relative Motion, Distance and Displacement"
    url: https://openstax.org/books/physics/pages/2-1-relative-motion-distance-and-displacement
    role: "The section whose structure and voice the findings describe; read, not copied."

  - id: bbc-bitesize-gcse-physics-aqa
    title: "BBC Bitesize — GCSE Physics (Single Science), AQA"
    url: https://www.bbc.co.uk/bitesize/examspecs/zsc9rdm
    page: https://www.bbc.co.uk/bitesize/subjects/zpm6fg8
    role: >-
      The source for the Bitesize structure: the AQA topic index, video
      playlists per topic, the exam-style quiz by topic, exam-style questions,
      quick-fire questions, "using past papers effectively", flashcards, and the
      outbound links to Isaac Physics. Content is © BBC and is not reusable.

  - id: pmt-past-papers-a-level
    title: "Physics & Maths Tutor — A-level Physics past papers"
    url: https://www.physicsandmathstutor.com/past-papers/a-level-physics/
    role: >-
      A third-party mirror of AQA, OCR and Edexcel past papers with mark schemes
      and some model answers. It is the public route to the gated Edexcel
      materials, and it is a route, not a licence: the copyright in the mirrored
      PDFs remains the boards'.

  - id: isaac-physics
    title: "Isaac Physics / Isaac Science"
    url: https://isaacphysics.org/
    sitemap: https://isaacphysics.org/sitemap.xml
    role: >-
      Described only: a JavaScript single-page application that serves a 3.2 KB
      shell without JavaScript. Its sitemap exposes /concepts/<slug>,
      /books/… (physics_skills_19, phys_book_gcse, solve_physics_problems,
      step_into_phys, step_up_phys, linking_concepts) and
      /<subject>/<level>/question_decks. No claim is made about how it teaches.

  - id: khan-academy-physics
    title: "Khan Academy — Physics"
    url: https://www.khanacademy.org/science/physics
    role: "Described only: a plain fetch returns a JavaScript-disabled notice. Nothing about its content is asserted."

  - id: ck12
    title: "CK-12 — student home"
    url: https://www.ck12.org/student/
    sitemap: https://www.ck12.org/sitemap.xml
    role: "Described only: a plain fetch returns a shell; the sitemap lists marketing and per-state school pages, not lessons."


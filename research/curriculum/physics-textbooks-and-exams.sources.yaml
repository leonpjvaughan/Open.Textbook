# Provenance for every claim in physics-textbooks-and-exams.md.
#
# Same shape as physics.sources.yaml: a tracked manifest, with the fetched PDFs
# and extracted text kept outside the build tree in /tmp (this pass) and
# research/sources/ (where the sibling manifests put theirs). No book directory
# is created here on purpose.
#
# This manifest does NOT duplicate the specification-level provenance. The board
# specifications, the DfE subject content, the Ofqual conditions and the
# equation sheets are in research/curriculum/physics.sources.yaml. This file
# adds the *assessment-material* provenance: question papers, mark schemes,
# examiner reports, command-word guidance and the existing open resources.
#
# Fetch pattern (mirrors scripts/fetch_sources.sh):
#
#   UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
#   curl -fsSL -A "$UA" -m 200 <url> -o <file>.pdf && pdftotext -layout <file>.pdf <file>.txt
#
# AQA pairs a resource title with its PDF URL in an embedded JSON blob on the
# assessment-resources page; OCR links the PDFs directly from the assessment
# page. The extraction commands are in physics-textbooks-and-exams.md.
#
# Edexcel's own copies of its papers and mark schemes are behind examWizard /
# Edexcel Online. The 9PH0 and 1PH0 mark schemes below were read from the
# Physics & Maths Tutor mirror and are marked `retrieved_via: mirror`. No
# Edexcel examiner report was read anywhere in this pass.
#
# Copyright: the boards' papers and mark schemes are commercial,
# all-rights-reserved documents and are NOT redistributed here. See the
# "Copyright and licences" section of the findings.

retrieved: 2026-10-11


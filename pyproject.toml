[project]
name = "gcse-maths-site"
version = "0.0.0"
description = "Interactive, static GCSE Mathematics textbook (marimo markdown + MkDocs)"
requires-python = ">=3.12"
dependencies = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    # Candidate figure-hook mechanism evaluated in test/; drop if not adopted.
    "mkdocs-macros-plugin==1.5.0",
    "pytest==9.1.1",
    "sympy==1.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

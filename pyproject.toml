[project]
name = "textbooks"
version = "0.0.0"
description = "A collection of interactive, static, backend-free textbooks"
requires-python = ">=3.12"
dependencies = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "textbook",
]

[dependency-groups]
dev = [
    # Candidate figure-hook mechanism, kept only while test/run.sh evaluates it.
    "mkdocs-macros-plugin==1.5.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine"]

[tool.uv.sources]
textbook = { workspace = true }

[tool.pytest.ini_options]
# The engine is an installed workspace package; this makes `import textbook`
# work even when the venv has not been synced.
pythonpath = ["engine"]
testpaths = ["tests"]

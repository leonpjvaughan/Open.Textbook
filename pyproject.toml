[project]
name = "textbooks"
version = "0.0.0"
description = "A collection of interactive, static, backend-free textbooks"
requires-python = ">=3.12"
dependencies = [
    "textbook",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine"]

[tool.uv.sources]
textbook = { workspace = true }

[tool.pytest.ini_options]
# The engine is an installed workspace package; this makes `import textbook`
# work even when the venv has not been synced.
pythonpath = ["engine"]
testpaths = ["tests"]

# Arc Blueberry: midnight navy, an electric blueberry accent, a magenta-to-blue
# glow. A **vivid** group.
#
# The dark variation is **Arc Blueberry** as its own repository publishes it,
# read from `colors.toml` (mode = "dark"). The palette began as a VS Code theme —
# the repo's `vscode.json` names the `BeardedBear.beardedtheme` extension — and
# the Omarchy gallery is one of the places it has been ported to. So the
# provenance is the palette repo, and the gallery is how we found it.
#
# The light variation is **derived** here from the same hue set, because the
# palette publishes no light member. It is labelled `observed: false`, not
# presented as something upstream shipped.

id: arc-blueberry
title: Arc Blueberry
description: >-
  Midnight navy, one electric blueberry accent and a cool cyan for links. Deep
  and cool, with a single bright colour carrying the page.

mood: vivid
family: Arc Blueberry
provenance:
  light:
    name: Daybreak
    source: https://github.com/vale-c/omarchy-arc-blueberry
    observed: false
    note: >-
      The palette publishes a dark variation only. This light member is derived
      here from the same hue set, and is not an upstream palette.
  dark:
    name: Arc Blueberry
    source: https://github.com/vale-c/omarchy-arc-blueberry
    observed: true

typography:
  body: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  display: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  mono: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
light:
  paper: "#f5f7fd"
  ink: "#131731"
  ink_soft: "#4a5170"
  ink_lighter: "#7a819f"
  rule: "#d5dbec"
  accent: "#2f5fb5"
  accent_light: "#5a86d4"
  accent_dark: "#22457f"
  accent_ink: "#ffffff"
  link: "#2b57a5"
  code_bg: "#eceff9"
  fig_warn: "#b0331c"
  fig_good: "#166b3a"
  fig_grid: "#7b8199"
dark:
  paper: "#111422"
  ink: "#bcc1dc"
  ink_soft: "#8f97bd"
  ink_lighter: "#6f7594"
  rule: "#313b62"
  # The palette's own accent, #8eb0e6, is used unmodified: it is 8.29:1 on the
  # midnight paper.
  accent: "#8eb0e6"
  accent_light: "#b3c9f2"
  accent_dark: "#5f83c4"
  accent_ink: "#111422"
  link: "#69c3ff"
  code_bg: "#0d101b"
  # Lightened from the palette's #e35535, which is 4.22:1 on the figure panel.
  fig_warn: "#e55f40"
  fig_good: "#3cec85"
  # Lightened from the palette's #424761 "muted", which is 1.73:1 on the panel.
  fig_grid: "#636a93"

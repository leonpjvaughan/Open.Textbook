# Glass: a glassmorphism developer OS — near-black with a cool green cast, lime
# and teal. A **vivid** group. Both members are authored here.
#
# The other vivid direction on the table was a holographic blue-violet with
# violet and cyan. This bundle takes the green-and-teal one instead: Neon already
# owns the violet-magenta-cyan triangle, so a second violet-and-cyan group would
# repeat it, while a cool green page pairs with Phosphor's warm amber as its
# opposite. Lime carries the accent, teal the link.
#
# The dark member is the direction: a near-black page with a cool green cast,
# lime and teal surfaces, and a lighter code panel, like a translucent developer
# shell. The light member is deliberately derived: a mint-white page and a
# teal-green accent, so the daylight page keeps the cool cast without the glow.
#
# Typography carries the shell: the display face is monospace.

id: glass
title: Glass
description: >-
  A glassmorphism developer OS: near-black with a cool green cast, lime and
  teal. Cool and luminous at night, mint and teal by day.

mood: vivid
family: Glass
provenance:
  light:
    name: Daybreak
    source: house
    original: true
    note: >-
      Authored in this repository as the readable light counterpart of the
      Shell member, not an inversion of it. The lime and teal are darkened to
      text inks on a mint-white page.
  dark:
    name: Shell
    source: house
    original: true
    note: >-
      Authored in this repository: a near-black page with a cool green cast, a
      lime accent and a teal link.
typography:
  body: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  display: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
  mono: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'

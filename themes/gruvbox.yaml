# Gruvbox: warm retro earth tones, low blue, comfortable over a long session.
#
# The dark variation is **Dark**, read from Omarchy's copy of the stock gruvbox
# theme (/usr/share/omarchy/themes/gruvbox). Omarchy ships gruvbox dark only, so
# the light variation is **derived** from the same upstream gruvbox hues rather
# than taken from a palette file — derived, not observed, and labelled as such.

id: gruvbox
title: Gruvbox
description: >-
  Warm retro earth tones: low blue, high comfort, gently loud accents. The dark
  page is the family's own; the light one is tuned to match it.

mood: calm
family: Gruvbox
provenance:
  light:
    name: Light
    source: https://github.com/morhetz/gruvbox
    observed: false
    note: >-
      Omarchy ships gruvbox dark only. This light variation is derived from the
      same upstream hues and is not an upstream palette.
  dark:
    name: Dark
    source: https://github.com/morhetz/gruvbox
    observed: true
typography:
  body: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  display: 'Georgia, "Iowan Old Style", "Times New Roman", serif'
  mono: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
light:
  paper: "#fbf1c7"
  ink: "#3c3836"
  ink_soft: "#665c54"
  ink_lighter: "#928374"
  rule: "#ebdbb2"
  # Darkened from the stock #427b58: the stock hue is 4.40:1 on gruvbox's light
  # paper, just under the 4.5:1 the collection holds an accent to. It only shows
  # where no subject tint replaces it — the landing page. Caught by
  # test_every_bundle_is_readable_with_no_subject_tint.
  accent: "#417956"
  accent_light: "#689d6a"
  accent_dark: "#2f5a41"
  # Text on the accent. The paper (#fbf1c7) is 4.40:1 here, below AA.
  accent_ink: "#ffffff"
  # Darkened from the stock #427b58: the stock hue is 4.40:1 on gruvbox's light
  # paper, just under the 4.5:1 a link needs. Caught by the contrast invariant.
  link: "#3d7150"
  code_bg: "#f2e5bc"
  fig_warn: "#9d0006"
  # Darkened from #79740e so the label colour clears 4.5:1 on the figure panel.
  fig_good: "#6b660c"
  # Darkened from #e0d3a8 for the 3:1 a gridline and axis needs.
  fig_grid: "#877f66"
dark:
  paper: "#282828"
  ink: "#d4be98"
  ink_soft: "#a89984"
  ink_lighter: "#7c6f64"
  rule: "#3c3836"
  accent: "#7daea3"
  accent_light: "#a9b665"
  accent_dark: "#5c8a80"
  accent_ink: "#282828"
  link: "#89b482"
  code_bg: "#1d2021"
  # Lightened from #ea6962 so the label colour clears 4.5:1 on the dark panel.
  fig_warn: "#fc7169"
  fig_good: "#a9b665"
  fig_grid: "#877c75"

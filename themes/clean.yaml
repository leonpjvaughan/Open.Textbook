# A deliberately colourless bundle.
#
# `fixed: [accent, accent_light, accent_dark, accent_ink, link]` means the subject tint is
# refused: every book looks the same here. That is the point of a clean group —
# a reader who wants no colour wants it everywhere, not per subject.

id: clean
title: Clean
description: >-
  Black on white, one weight of grey, no hue at all. Maximum contrast and nothing
  to look at but the work.
typography:
  body: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  display: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  mono: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
fixed: [accent, accent_light, accent_dark, accent_ink, link]
light:
  paper: "#ffffff"
  ink: "#101010"
  ink_soft: "#565656"
  ink_lighter: "#8c8c8c"
  rule: "#e3e3e3"
  accent: "#101010"
  accent_light: "#333333"
  accent_dark: "#000000"
  accent_ink: "#ffffff"
  link: "#101010"
  code_bg: "#f4f4f4"
  fig_warn: "#8a1f1f"
  fig_good: "#1f6b3a"
  # Darkened from #dcdcdc: a gridline and axis is a graphical object, and the
  # panel is a touch darker than the paper. Caught by the contrast invariant.
  fig_grid: "#868686"
dark:
  paper: "#0d0d0d"
  ink: "#f2f2f2"
  ink_soft: "#b0b0b0"
  ink_lighter: "#7d7d7d"
  rule: "#262626"
  accent: "#f2f2f2"
  accent_light: "#ffffff"
  accent_dark: "#c9c9c9"
  accent_ink: "#0d0d0d"
  link: "#ffffff"
  code_bg: "#171717"
  fig_warn: "#e08585"
  fig_good: "#86c9a2"
  fig_grid: "#6b6b6b"

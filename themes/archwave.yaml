# Archwave: vaporwave — pastel pinks, lavenders and cyans on deep aubergine. A
# **vivid** group.
#
# The dark variation is **Archwave** as its own repository publishes it. That
# repository predates Omarchy's semantic `colors.toml`: it names the same colours
# in an Alacritty config, a Ghostty config and a Walker stylesheet instead. The
# values here are read from `alacritty.toml` (`background`, `foreground` and the
# 16-colour table) and cross-checked against `walker.css`, which agrees.
#
# The light variation is **derived** here from the same hue set: the theme
# publishes a dark variation only. It is labelled `observed: false`.

id: archwave
title: Archwave
description: >-
  Vaporwave: pastel pink, lavender and cyan on deep aubergine, or the same hues
  held down to a pale lilac page. The softest of the vivid groups.

mood: vivid
family: Archwave
provenance:
  light:
    name: Dawn
    source: https://github.com/davidguttman/archwave
    observed: false
    note: >-
      The theme publishes a dark variation only, and not as `colors.toml` — the
      palette is in its Alacritty and Ghostty configs. This light member is
      derived here from the same hue set.
  dark:
    name: Archwave
    source: https://github.com/davidguttman/archwave
    observed: true

typography:
  body: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  display: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  mono: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
light:
  paper: "#fdf5ff"
  ink: "#2a1240"
  ink_soft: "#5b4372"
  ink_lighter: "#8a739f"
  rule: "#eddaf5"
  accent: "#b01d7e"
  accent_light: "#d94fa6"
  accent_dark: "#8a1462"
  accent_ink: "#ffffff"
  link: "#0f6f7a"
  code_bg: "#f7ecfb"
  fig_warn: "#b02a6a"
  # Darkened from the theme's cyan `#5ffbf1`, which is 1.02:1 on the light panel
  # — a luminous cyan on near-white.
  fig_good: "#106b5e"
  fig_grid: "#8b7a9b"
dark:
  paper: "#1a0d2e"
  ink: "#d4a5ff"
  ink_soft: "#b18ad6"
  ink_lighter: "#8a6bb0"
  rule: "#2d1b4e"
  # The theme's `red` slot is this pink and it is the accent, unmodified: 7.28:1
  # on the aubergine page.
  accent: "#ff6ec7"
  accent_light: "#ff9adc"
  accent_dark: "#e04fa6"
  accent_ink: "#1a0d2e"
  # The theme's `cyan`, 14.51:1 on the page — the palette's second colour, and in
  # the vivid groups a link is the place a second hue deserves to show.
  link: "#5ffbf1"
  code_bg: "#150a26"
  fig_warn: "#ff9adc"
  fig_good: "#5ffbf1"
  # Lifted from the theme's `bright black` #543a6e, which is 1.69:1 on the panel.
  fig_grid: "#746298"

# Tokyo Night: city-at-night blues and violets. A **vivid** group.
#
# The dark variation is **Night**, read from the palette the project publishes in
# `lua/tokyonight/colors/storm.lua` with Night's own page colour
# (`bg = "#1a1b26"`). Night, Storm and Moon share one set of accents; only the
# page and surfaces move.
#
# The light variation is **derived** here from the same hues. The project does
# ship a "day" style, but it is generated by inverting the dark palette at load
# time (`lua/tokyonight/colors/day.lua` calls `Util.invert`), so there is no
# hand-picked light palette to read — an inversion is not a palette, and the
# result is labelled `observed: false`.

id: tokyo-night
title: Tokyo Night
description: >-
  City-at-night blues and violets, deep and low-glare, or the same hues held
  down to a pale blue-grey page. Cool, dense and calm for a vivid palette.

mood: vivid
family: Tokyo Night
provenance:
  light:
    name: Day
    source: https://github.com/folke/tokyonight.nvim
    observed: false
    note: >-
      Upstream's light style is generated by inverting the dark palette, not
      authored as one. This member is derived here from the same hue set.
  dark:
    name: Night
    source: https://github.com/folke/tokyonight.nvim
    observed: true

typography:
  body: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  display: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  mono: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
light:
  paper: "#f4f6fc"
  ink: "#1a1b26"
  ink_soft: "#46506e"
  ink_lighter: "#78819e"
  rule: "#d7dcec"
  accent: "#2c5cc5"
  accent_light: "#4d7fe0"
  accent_dark: "#1f428f"
  accent_ink: "#ffffff"
  link: "#1d6ea8"
  code_bg: "#e9edf8"
  fig_warn: "#b3303f"
  fig_good: "#3f6b18"
  fig_grid: "#7881a0"
dark:
  paper: "#1a1b26"
  ink: "#c0caf5"
  ink_soft: "#a9b1d6"
  ink_lighter: "#737aa2"
  rule: "#2f334d"
  accent: "#7aa2f7"
  accent_light: "#9ab8ff"
  accent_dark: "#5b7fd4"
  accent_ink: "#1a1b26"
  # The palette's cyan, which is lighter than its blue: on a dark page a link
  # needs more luminance than the accent, not the same value as it.
  link: "#7dcfff"
  code_bg: "#16161e"
  fig_warn: "#f7768e"
  fig_good: "#9ece6a"
  # Lightened from the palette's `dark3` #545c7e, which is 2.20:1 on the panel.
  fig_grid: "#68719d"

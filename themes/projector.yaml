id: projector
title: Projector
description: >-
  Sharp and high contrast, made for a classroom screen.

fixed: [accent, accent_light, accent_dark, accent_ink, link]
mood: calm
family: Projector
provenance:
  light:
    name: Screen
    source: house
    original: true
    note: >-
      Authored in this repository for a projected page in a lit room: pure
      white paper, black ink and a deep blue accent, every text token at 7:1
      or more.
  dark:
    name: Blackout
    source: house
    original: true
    note: >-
      Authored in this repository as the dark half of the same pair: black
      paper, white ink and a bright yellow accent.

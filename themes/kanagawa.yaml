# Kanagawa: an ink-brush palette taken from the colours of ukiyo-e prints. A
# **vivid** group, and the only one here whose two members are both the family's
# own.
#
# The dark variation is **Wave**, read from `lua/kanagawa/colors.lua`
# (`sumiInk3` page, `fujiWhite` ink, `crystalBlue` accent). The light variation is
# **Lotus**, from the same file (`lotusWhite3` page, `lotusInk1` ink,
# `lotusBlue4` accent). Both are observed, not derived.
#
# The one adjustment: Lotus's own `lotusInk1` (#545464) is 6.19:1 on its
# `lotusWhite3` paper, under the 7:1 the collection holds body text to, so the
# ink is darkened a step to #4c4c5a (7.03:1). Everything else is upstream.

id: kanagawa
title: Kanagawa
description: >-
  Ink-brush blues and jade on storm-dark grey, or warm parchment in the light.
  A printmaking palette, soft at the edges and unmistakable.

mood: vivid
family: Kanagawa
provenance:
  light:
    name: Lotus
    source: https://github.com/rebelot/kanagawa.nvim
    observed: true
  dark:
    name: Wave
    source: https://github.com/rebelot/kanagawa.nvim
    observed: true

typography:
  body: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  display: 'Georgia, "Iowan Old Style", "Times New Roman", serif'
  mono: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
light:
  paper: "#f2ecbc"
  ink: "#4c4c5a"
  # Darkened from the palette's `lotusInk2`-adjacent #6f6a5f, which is 4.24:1 on
  # the card surface the landing page draws (`color-mix(ink 4%, paper)`), below
  # the 4.5:1 its body text needs. Caught by the soft-ink check.
  ink_soft: "#6a655b"
  ink_lighter: "#8a8980"
  rule: "#d5cea3"
  accent: "#4d699b"
  accent_light: "#6693bf"
  accent_dark: "#3b4f78"
  accent_ink: "#ffffff"
  link: "#4e5d8c"
  code_bg: "#e7dba0"
  fig_warn: "#a13040"
  # Darkened from the palette's `springGreen` #98bb6c, which is 1.61:1 on the
  # light panel.
  fig_good: "#4a6b28"
  fig_grid: "#7f7a5f"
dark:
  paper: "#1f1f28"
  ink: "#dcd7ba"
  ink_soft: "#a9a58c"
  ink_lighter: "#727169"
  rule: "#363646"
  accent: "#7e9cd8"
  accent_light: "#a3bce8"
  accent_dark: "#5a7cb8"
  accent_ink: "#1f1f28"
  link: "#7aa89f"
  code_bg: "#16161d"
  # Lightened from the palette's `waveRed` #e46876, which is 4.20:1 on the panel.
  fig_warn: "#e6717f"
  fig_good: "#98bb6c"
  # Derived, not read: the figure panel is lighter than the page, and every grey
  # the palette publishes is far too close to it (sumiInk6 #54546D is 1.84:1
  # there, katanaGray #717c7c only 3.13:1). This is lifted to a violet-grey.
  fig_grid: "#717690"

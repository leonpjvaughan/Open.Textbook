<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
$build_meta
$prefs_script
<link rel="stylesheet" href="$themes_css">
<link rel="stylesheet" href="$portal_css">
<link rel="stylesheet" href="$settings_css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<script src="$settings_js" defer></script>
<script src="$worker_script" defer></script>
</head>
<body>
<script>
/* Material sets the colour scheme on <body>; the books' bundle rules key off the
 * same attribute, so the landing page matches them. */
document.body.setAttribute(
  "data-md-color-scheme",
  document.documentElement.getAttribute("data-scheme-pref") === "slate" ? "slate" : "default"
);
</script>
<header class="masthead">
  <div class="wrap masthead__inner">
    <div class="masthead__text">
      <h1 class="masthead__title">$title</h1>
      <p class="masthead__lead">$description</p>
    </div>
    <div class="masthead__actions">
      $settings_trigger
    </div>
  </div>
</header>
$settings_dialog

<main class="wrap" id="main">
$groups
</main>

$footer
</body>
</html>

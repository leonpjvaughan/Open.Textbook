<!DOCTYPE html>
<!-- data-background is the resolved animated-background id for this page, or
     empty. Nothing reads it yet: no animation ships (see textbook/backgrounds.py).
     It is the declaration a runtime will mount from, so the mapping is data
     before it is behaviour. -->
<html lang="en" data-background="$background">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title — $site_title</title>
<meta name="description" content="$description">
<meta name="build" content="$build">
<link rel="canonical" href="$canonical">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="${prefix}assets/icons/favicon.svg">
<!-- iOS ignores the manifest's icons and wants a PNG it can size itself, so
     without this an iPhone home screen gets a screenshot of the page. The
     file is committed rather than rasterised at build time: the build has no
     dependable rasteriser, and an icon that silently goes missing is worse
     than 2 kB in git. See assets/icons/README.md. -->
<link rel="apple-touch-icon" href="${prefix}assets/icons/apple-touch-icon.png">
$prefs_script
<link rel="stylesheet" href="${prefix}assets/stylesheets/themes.css">
<link rel="stylesheet" href="${prefix}assets/stylesheets/extra.css">
<link rel="stylesheet" href="${prefix}assets/stylesheets/book.css">
<link rel="stylesheet" href="${prefix}assets/stylesheets/book-local.css">
<link rel="stylesheet" href="${prefix}assets/stylesheets/shell.css">
<link rel="stylesheet" href="${prefix}assets/stylesheets/settings.css">
<script src="/assets/settings/service-worker.js" defer></script>
</head>
<body>
<script>
/* themes.css keys its tokens off body[data-md-color-scheme], which is Material's
 * own convention and which the shared stylesheet still depends on. Set it here,
 * before the body paints, so the scheme never flashes. */
document.body.setAttribute(
  "data-md-color-scheme",
  document.documentElement.getAttribute("data-md-color-scheme") === "slate" ? "slate" : "default"
);
</script>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead" data-pagefind-ignore>
  <div class="wrap masthead__inner">
    <a class="masthead__brand" href="${prefix}">$site_title</a>
    <!-- The search is a sibling of the actions rather than one of them: at phone
         widths it has to be able to take a row of its own, and a flex item cannot
         escape a parent to do that. -->
    <div class="search">
      <input id="search-input" type="search" placeholder="Search" aria-label="Search this book">
      <ul id="search-results" class="search__results"></ul>
    </div>
    <div class="masthead__actions">
      <!-- Root-absolute, like the 404's link and the manifest: a book is served
           from a subpath, so a relative link home would be wrong at every depth.
           The landing page is where a reader changes book or qualification, and
           before this there was no way back to it from inside a book. -->
      <a class="masthead__home" href="/">All books</a>
      $settings_trigger
    </div>
  </div>
</header>

<div class="wrap layout">
  <nav class="sidebar" aria-label="Book contents" data-pagefind-ignore>
    $nav
  </nav>

  <!-- data-pagefind-body scopes the index to the page's own content. Without it
       every page also indexes the whole sidebar, so every search hit would match
       a chapter title that merely appears in the navigation. -->
  <main id="main" class="content md-typeset" data-pagefind-body>
    $content
  </main>
</div>

$settings_dialog
$booklet_script
<script src="${prefix}assets/settings/settings.js"></script>

<script type="module">
/* Search, powered by Pagefind: the index is built over the rendered HTML after
 * the build, so the ranking, stemming and excerpting are not ours to write, and
 * nothing is fetched until the reader actually types.
 *
 * Pagefind stores result URLs from the site root, so every one is re-based onto
 * this book's prefix: the book is served from a subpath. */
const prefix = "${prefix}";
const input = document.getElementById("search-input");
const results = document.getElementById("search-results");
let pagefind = null;
let sequence = 0;

async function load() {
  if (!pagefind) pagefind = await import(prefix + "pagefind/pagefind.js");
  return pagefind;
}

input.addEventListener("input", async () => {
  const term = input.value.trim();
  if (term.length < 2) { results.innerHTML = ""; return; }
  const mine = ++sequence;
  let search;
  try {
    search = await (await load()).search(term);
  } catch (err) {
    results.innerHTML = "<li>Search is unavailable.</li>";
    return;
  }
  const pages = await Promise.all(search.results.slice(0, 20).map((r) => r.data()));
  if (mine !== sequence) return;
  results.innerHTML = pages
    .map((p) => '<li><a href="' + prefix + p.url.replace(/^\//, "") + '">' + p.meta.title + "</a></li>")
    .join("");
});
</script>
</body>
</html>

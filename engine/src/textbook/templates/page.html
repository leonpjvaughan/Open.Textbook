<!DOCTYPE html>
<!-- data-background is the resolved animated-background id for this page, or
     empty. Nothing reads it yet: no animation ships (see textbook/backgrounds.py).
     It is the declaration a runtime will mount from, so the mapping is data
     before it is behaviour. -->
<html lang="en" data-background="$background">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title — $site_title</title>
<meta name="description" content="$description">
<!-- The browser's own interface, not the page's: `color-scheme` lets form
     controls and scrollbars follow the scheme, and `theme-color` paints a phone's
     address bar. The two theme colours are the default bundle's paper per scheme,
     and the preference script repaints them from the resolved --tb-paper, so a
     reader on another bundle or an explicit scheme gets their own. -->
<meta name="color-scheme" content="light dark">
$theme_color_metas
<meta name="build" content="$build">
$pager_head
<link rel="canonical" href="$canonical">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="${prefix}assets/icons/favicon.svg">
<!-- iOS ignores the manifest's icons and wants a PNG it can size itself, so
     without this an iPhone home screen gets a screenshot of the page. The
     file is committed rather than rasterised at build time: the build has no
     dependable rasteriser, and an icon that silently goes missing is worse
     than 2 kB in git. See assets/icons/README.md. -->
<link rel="apple-touch-icon" href="${prefix}assets/icons/apple-touch-icon.png">
$prefs_script
<!-- The cascade, in the one order the build writes it. Content-addressed, so a
     sheet that did not change keeps its URL across a deploy; the build emits these
     links from `pipeline.STYLESHEETS` rather than the template naming them. -->
$stylesheets
<!-- Chromium can reveal a page before the `@view-transition` opt-in has been read
     from the resolved cascade, and then aborts the transition with "ViewTransition
     opt-in disabled". Asking for one computed style resolves the sheets first; the
     value is discarded. It must be a classic inline script after the links and not a
     deferred one, because a deferred script runs after the first chance to reveal.
     Measured in Chrome 153 at 1280 and 390: without it, 0 of 2 navigations started a
     transition and the page logged "ViewTransition opt-in disabled"; with it, every
     navigation started one, between two book pages and through the portal. Remove it
     when the browser no longer needs it; nothing else depends on it. -->
<script>getComputedStyle(document.documentElement).color;</script>
<!-- Root-absolute: one worker for the collection, registered once, scoped to the
     deployment root. Content-addressed like the stylesheets, derived from the same
     source bytes by both this build and the portal, so neither build has to read
     the other's output. -->
<script src="$worker_script" defer></script>
</head>
<body>
<script>
/* themes.css keys its tokens off body[data-md-color-scheme], which is Material's
 * own convention and which the shared stylesheet still depends on. Set it here,
 * before the body paints, so the scheme never flashes. */
document.body.setAttribute(
  "data-md-color-scheme",
  document.documentElement.getAttribute("data-md-color-scheme") === "slate" ? "slate" : "default"
);
</script>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead" data-pagefind-ignore>
  <div class="wrap masthead__inner">
    <a class="masthead__brand" href="${prefix}"><span class="masthead__book">$site_title</span>$masthead_section</a>
    <!-- The search is a sibling of the actions rather than one of them: at phone
         widths it has to be able to take a row of its own, and a flex item cannot
         escape a parent to do that. -->
    <div class="search">
      <!-- `aria-controls` names the list the input fills; the list is hidden by
           the script rather than by `:empty`, so "No results" can be a message.
           The status line is the live region: revealing the list is not an
           announcement on its own. -->
      <input id="search-input" type="search" placeholder="Search"
             aria-label="Search this book" aria-controls="search-results"
             autocomplete="off">
      <ul id="search-results" class="search__results" aria-label="Search results" hidden></ul>
      <p id="search-status" class="visually-hidden" role="status" aria-live="polite"></p>
    </div>
    <div class="masthead__actions">
      <!-- Root-absolute, like the 404's link and the manifest: a book is served
           from a subpath, so a relative link home would be wrong at every depth.
           The landing page is where a reader changes book or qualification, and
           before this there was no way back to it from inside a book. -->
      <a class="masthead__home" href="/">All books</a>
      $settings_trigger
    </div>
  </div>
</header>

<div class="wrap layout">
  <!-- **The drawer.** At 60rem and up this is the sidebar column and nothing about it
       changes. Below that the layout is one column, so without a control the whole book
       is printed above every page: at 390px a `numerical-methods` page began with 614px
       of navigation, 31 links, and its own title sat at y = 798.

       A `<details>` is the collection's progressive-disclosure primitive and a `<summary>`
       is one focus stop that opens with Enter, so the control is native. It is `open` in
       the markup because that is the layout a reader with scripting off has always had;
       the script at the foot of the page closes it at phone width, which is the only way
       to have a different default on each side of one breakpoint from one HTML file. -->
  <details class="nav-drawer" open>
    <summary class="nav-drawer__summary" data-pagefind-ignore>
      <!-- The book and the section are in the masthead row directly above, so the
           summary carries only what the control does. Repeating them made a phone
           reader pass the same two labels three times before the page's own title. -->
      <span class="nav-drawer__label">Contents</span>
    </summary>
    <nav class="sidebar" aria-label="Book contents" data-pagefind-ignore>
      $nav
    </nav>
  </details>

  <!-- data-pagefind-body scopes the index to the page's own content. Without it
       every page also indexes the whole sidebar, so every search hit would match
       a chapter title that merely appears in the navigation. -->
  <main id="main" class="content md-typeset" data-pagefind-body>
    $content
    <!-- Previous/next, from the same reading order as the sidebar. Outside the
         Pagefind index (`data-pagefind-ignore`) so a search excerpt never quotes
         "Next section". -->
    $pager
  </main>
</div>

$settings_dialog
$booklet_script
<script src="$settings_js"></script>
<!-- Keeps the rest of this chapter for a reader who is about to lose the signal.
     Deferred, idle, and inert on a metered connection; see assets/offline/offline.js. -->
<script src="$offline_js" defer></script>

<script type="module">
/* The phone drawer: closed on arrival below 60rem, open and inert above it.
 *
 * One page is built for every width, so CSS cannot set `open` by media query: a drawer
 * that starts closed hides the navigation at desktop, and one that starts open puts 614px
 * of contents above a phone's title. So the markup ships `open` — the layout a reader
 * with scripting off has always had — and this closes it where the layout needs it to be
 * closed. The media query is listened to, so a rotated phone or a resized window leaves
 * the drawer in the state that width calls for. */
const drawer = document.querySelector(".nav-drawer");
if (drawer) {
  const wide = window.matchMedia("(min-width: 60rem)");
  const apply = () => { drawer.open = wide.matches; };
  apply();
  wide.addEventListener("change", apply);
}
</script>

<script type="module">
/* Search, powered by Pagefind: the index is built over the rendered HTML after
 * the build, so the ranking, stemming and excerpting are not ours to write, and
 * nothing is fetched until the reader actually types.
 *
 * Pagefind stores result URLs from the site root, so every one is re-based onto
 * this book's prefix: the book is served from a subpath. */
const prefix = "${prefix}";
const input = document.getElementById("search-input");
const results = document.getElementById("search-results");
const status = document.getElementById("search-status");
let pagefind = null;
let sequence = 0;

async function load() {
  if (!pagefind) pagefind = await import(prefix + "pagefind/pagefind.js");
  return pagefind;
}

/* Every state change goes through here, so the panel is never left showing stale
 * rows and the live region always says what happened. A reader who types a term
 * with no hits used to see the panel vanish in silence. */
function show(html, message) {
  /* The empty case empties the node rather than parsing an empty string: the same
   * rule the under-two-character case has always followed, because Trusted Types
   * refuses `innerHTML` even for "". */
  if (html === "") results.replaceChildren();
  else results.innerHTML = html;
  results.hidden = html === "";
  status.textContent = message;
}

input.addEventListener("input", async () => {
  const term = input.value.trim();
  if (term.length < 2) { show("", ""); return; }
  const mine = ++sequence;
  let search;
  try {
    search = await (await load()).search(term);
  } catch (err) {
    show("<li class=\"search__empty\">Search is unavailable.</li>", "Search is unavailable.");
    return;
  }
  const pages = await Promise.all(search.results.slice(0, 20).map((r) => r.data()));
  if (mine !== sequence) return;
  if (pages.length === 0) {
    show(
      "<li class=\"search__empty\">No results</li>",
      "No results for " + term + ".",
    );
    return;
  }
  show(
    pages
      .map((p) => '<li><a href="' + prefix + p.url.replace(/^\//, "") + '">' + p.meta.title + "</a></li>")
      .join(""),
    pages.length + (pages.length === 1 ? " result." : " results."),
  );
});

/* The results are links, so the keyboard walks them directly: ArrowDown from the
 * input enters the list, ArrowDown/ArrowUp move within it, Escape closes it and
 * returns the reader to the field. Measured before this: ArrowDown left focus in
 * the input and the list could only be reached by clicking. */
function links() {
  return [...results.querySelectorAll("li a")];
}

function close() {
  show("", "");
  input.focus();
}

input.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown" && !results.hidden) {
    const first = links()[0];
    if (first) { event.preventDefault(); first.focus(); }
  } else if (event.key === "Escape" && !results.hidden) {
    event.preventDefault();
    close();
  }
});

results.addEventListener("keydown", (event) => {
  const anchors = links();
  const at = anchors.indexOf(document.activeElement);
  if (event.key === "ArrowDown" && at > -1) {
    event.preventDefault();
    (anchors[at + 1] || anchors[0]).focus();
  } else if (event.key === "ArrowUp" && at > -1) {
    event.preventDefault();
    if (at === 0) input.focus();
    else anchors[at - 1].focus();
  } else if (event.key === "Escape") {
    event.preventDefault();
    close();
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title — $site_title</title>
<meta name="description" content="$description">
$build_meta
$prefs_script
<link rel="stylesheet" href="/assets/stylesheets/themes.css">
<link rel="stylesheet" href="/assets/stylesheets/portal.css">
<link rel="stylesheet" href="/assets/stylesheets/settings.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<script src="/assets/settings/settings.js" defer></script>
<script src="/assets/settings/service-worker.js" defer></script>
</head>
<body>
<script>
/* The landing page and every book paint from the reader's bundle before the
 * first frame. These pages are part of the same collection, so they do too. */
document.body.setAttribute(
  "data-md-color-scheme",
  document.documentElement.getAttribute("data-scheme-pref") === "slate" ? "slate" : "default"
);
</script>
<header class="masthead">
  <div class="wrap masthead__inner">
    <div class="masthead__text">
      <p class="masthead__eyebrow"><a href="/">$site_title</a></p>
      <h1 class="masthead__title">$title</h1>
      <p class="masthead__lead">$description</p>
    </div>
    <div class="masthead__actions">
      $settings_trigger
    </div>
  </div>
</header>
$settings_dialog

<main class="wrap legal" id="main">
$body
</main>

$footer
</body>
</html>

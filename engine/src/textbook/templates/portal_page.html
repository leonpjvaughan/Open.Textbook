<!DOCTYPE html>
<html lang="en" data-style="$style">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title — $site_title</title>
<meta name="description" content="$description">
<meta name="color-scheme" content="light dark">
$theme_color_metas
$build_meta
$prefs_script
<link rel="stylesheet" href="$themes_css">
<link rel="stylesheet" href="$portal_css">
<link rel="stylesheet" href="$layouts_css">
<link rel="stylesheet" href="$settings_css">
<!-- Resolves the cascade before the page can be revealed: Chromium can otherwise
     abort the cross-document transition with "ViewTransition opt-in disabled" because
     it read the opt-in before the style sheets had resolved. The value is discarded,
     and the script is classic and not deferred so it runs before the first reveal. -->
<script>getComputedStyle(document.documentElement).color;</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<script src="$settings_js" defer></script>
<script src="$worker_script" defer></script>
</head>
<body>
<script>
/* The landing page and every book paint from the reader's bundle before the
 * first frame. These pages are part of the same collection, so they do too. */
document.body.setAttribute(
  "data-md-color-scheme",
  document.documentElement.getAttribute("data-scheme-pref") === "slate" ? "slate" : "default"
);
</script>
<header class="masthead">
  <div class="masthead__lead">
    <p class="masthead__eyebrow"><a href="/">$site_title</a></p>
    <h1 class="masthead__title">$title</h1>
    <p class="masthead__description">$description</p>
  </div>
  <div class="masthead__tools">
    <p class="masthead__tools-label">Reader settings</p>
    $settings_trigger
  </div>
</header>
$settings_dialog

<main class="wrap legal" id="main">
$body
</main>

$footer
</body>
</html>

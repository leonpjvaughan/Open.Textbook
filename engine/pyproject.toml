[project]
name = "textbook"
# The collection's tag is the version: `hatch-vcs` reads it from the repository root.
dynamic = ["version"]
description = "Shared engine for the interactive textbook collection"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.2",
    "sympy==1.14.0",
    # Used by textbook.pipeline, which renders Markdown without a site
    # generator. Declaring them here keeps the engine honest about what it
    # imports and lets it be installed on its own.
    "markdown>=3.6",
    "pymdown-extensions>=10.2",
    "antlr4-python3-runtime==4.11",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/textbook/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/textbook"]

[tool.hatch.build]
# Non-Python assets the engine needs at runtime: the KaTeX renderer and the
# portal page template. Present in source, so an editable install finds them.
include = [
    "src/textbook/js/*.mjs",
    "src/textbook/css/*.css",
    "src/textbook/templates/*.html",
]

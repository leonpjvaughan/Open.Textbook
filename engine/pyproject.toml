[project]
name = "textbook"
version = "0.0.0"
description = "Shared engine for the interactive textbook collection"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.2",
    "sympy==1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textbook"]

[tool.hatch.build]
# Non-Python assets the engine needs at runtime: the KaTeX renderer and the
# portal page template. Present in source, so an editable install finds them.
include = [
    "textbook/js/*.mjs",
    "textbook/templates/*.html",
]

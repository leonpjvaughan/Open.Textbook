<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<script>
/* The light/dark preference is shared with every book, under one key.
 * Read before paint, so the landing page never flashes the wrong scheme.
 * See SHAPE.md ("Theme preference"). */
(function () {
  try {
    var scheme = localStorage.getItem("$scheme_key");
    if (scheme === "slate") document.documentElement.setAttribute("data-scheme", "dark");
    else if (scheme === "default") document.documentElement.setAttribute("data-scheme", "light");
  } catch (err) {}
})();
</script>
<link rel="stylesheet" href="assets/stylesheets/portal.css">
</head>
<body>
<header class="masthead">
  <div class="wrap masthead__inner">
    <div class="masthead__text">
      <h1 class="masthead__title">$title</h1>
      <p class="masthead__lead">$description</p>
    </div>
    <button class="scheme" type="button" id="scheme-toggle" hidden>
      <span class="scheme__icon" aria-hidden="true"></span>
      <span class="scheme__label">Dark mode</span>
    </button>
  </div>
</header>

<main class="wrap" id="main">
$groups
</main>

<footer class="footer">
  <div class="wrap">
    <p>
      Every answer in these books is checked by a computer algebra system when the
      book is built, and the questions are printed from the same checked source.
    </p>
    <p class="footer__fine">Built $year · static, no account, nothing to install.</p>
  </div>
</footer>

<script>
/* The landing page writes the same shared preference the books do, so a reader
 * who picks a scheme here gets it inside every book as well. */
(function () {
  var KEY = "$scheme_key";
  var button = document.getElementById("scheme-toggle");
  if (!button) return;

  var store = null;
  try { store = window.localStorage; } catch (err) {}

  function saved() {
    try { return store ? store.getItem(KEY) : null; } catch (err) { return null; }
  }

  function current() {
    var value = saved();
    if (value === "slate") return "dark";
    if (value === "default") return "light";
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function render() {
    var isDark = current() === "dark";
    document.documentElement.setAttribute("data-scheme", isDark ? "dark" : "light");
    button.setAttribute("aria-pressed", String(isDark));
    button.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
    button.querySelector(".scheme__label").textContent = isDark ? "Light mode" : "Dark mode";
  }

  function choose(scheme) {
    try { if (store) store.setItem(KEY, scheme === "dark" ? "slate" : "default"); } catch (err) {}
    render();
  }

  button.hidden = false;
  button.addEventListener("click", function () {
    choose(current() === "dark" ? "light" : "dark");
  });

  /* With no explicit choice, follow the system as it changes. */
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
      if (!saved()) render();
    });
  }

  render();
})();
</script>
</body>
</html>

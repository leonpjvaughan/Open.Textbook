<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
$build_meta
<script>
/* Reader preferences, before the first paint, so neither the colour scheme nor
 * the theme bundle flashes. Both keys are shared with every book, so a choice
 * made here follows the reader, and one made in a book arrives here.
 * See SHAPE.md ("Theme preference" and "Theme bundles"). */
(function () {
  var schemeDefault = $scheme_default;
  var themes = $themes;
  var defaultTheme = "$default_theme";
  var store, scheme = schemeDefault;
  try { store = window.localStorage; } catch (err) {}
  function read(key) {
    try { return store ? store.getItem(key) : null; } catch (err) { return null; }
  }
  function write(key, value) {
    try { if (store) store.setItem(key, value); } catch (err) {}
  }
  function applyTheme(value) {
    var wanted = themes.indexOf(value) >= 0 ? value : defaultTheme;
    if (wanted) document.documentElement.setAttribute("data-theme", wanted);
    return wanted;
  }
  try {
    var saved = read("$scheme_key");
    if (saved) scheme = saved;
  } catch (err) {}
  document.documentElement.setAttribute("data-scheme-pref", scheme);
  applyTheme(read("$theme_key"));
  /* The same interface a book page exposes, so the one shared Settings runtime
   * (assets/settings/settings.js) reads and writes a single store everywhere. */
  window.textbookPrefs = {
    schemeKey: "$scheme_key",
    themeKey: "$theme_key",
    themes: themes.slice(),
    defaultTheme: defaultTheme,
    read: read,
    write: write,
    setTheme: function (value) {
      write("$theme_key", value);
      return applyTheme(value);
    },
    currentTheme: function () { return applyTheme(read("$theme_key")); }
  };
})();
</script>
<link rel="stylesheet" href="assets/stylesheets/themes.css">
<link rel="stylesheet" href="assets/stylesheets/portal.css">
<link rel="stylesheet" href="assets/stylesheets/settings.css">
<link rel="manifest" href="/manifest.webmanifest">
<script src="assets/settings/settings.js" defer></script>
<script src="assets/settings/service-worker.js" defer></script>
</head>
<body>
<script>
/* Material sets the colour scheme on <body>; the books' bundle rules key off the
 * same attribute, so the landing page matches them. */
document.body.setAttribute(
  "data-md-color-scheme",
  document.documentElement.getAttribute("data-scheme-pref") === "slate" ? "slate" : "default"
);
</script>
<header class="masthead">
  <div class="wrap masthead__inner">
    <div class="masthead__text">
      <h1 class="masthead__title">$title</h1>
      <p class="masthead__lead">$description</p>
    </div>
    <div class="masthead__actions">
      $settings_trigger
    </div>
  </div>
</header>
$settings_dialog

<main class="wrap" id="main">
$groups
</main>

<footer class="footer">
  <div class="wrap">
    <p>
      Every answer in these books is checked by a computer algebra system when the
      book is built, and the questions are printed from the same checked source.
    </p>
    <p class="footer__fine">Built $year · static, no account, nothing to install.</p>
  </div>
</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<script>
/* Honour the collection-wide light/dark choice the books record, before paint,
 * so the landing page never flashes the wrong theme. See SHAPE.md. */
(function () {
  try {
    var scheme = localStorage.getItem("$scheme_key");
    if (scheme === "slate") document.documentElement.setAttribute("data-scheme", "dark");
    else if (scheme === "default") document.documentElement.setAttribute("data-scheme", "light");
  } catch (err) {}
})();
</script>
<link rel="stylesheet" href="assets/stylesheets/portal.css">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <h1 class="masthead__title">$title</h1>
    <p class="masthead__lead">$description</p>
  </div>
</header>

<main class="wrap" id="main">
$groups
</main>

<footer class="footer">
  <div class="wrap">
    <p>
      Every answer in these books is checked by a computer algebra system when the
      book is built, and the questions are printed from the same checked source.
    </p>
    <p class="footer__fine">Built $year · static, no account, nothing to install.</p>
  </div>
</footer>
</body>
</html>

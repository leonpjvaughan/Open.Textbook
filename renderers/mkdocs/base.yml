# Shared MkDocs configuration for every book and profile.
#
# Per-book configs (renderers/mkdocs/<book>.<profile>.yml) are generated from
# books/<id>/book.yaml by `python -m textbook.scaffold`, and INHERIT this file.
#
# Everything here is genuinely common: the theme, the shared design system, the
# runtime widgets and the hook entry point. Anything that varies by book — the
# site name, description, URL, docs directory, nav and profile — is generated.
theme:
  name: material
  language: en
  font: false
  # The reader Settings control lives here: partials/header.html adds it to the
  # header, and partials/settings.html is the dialog. Material has no hook for an
  # extra header action, so its header is overridden. The path is relative to the
  # *generated* config in this directory, not to base.yml's own location.
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
  # Both schemes stay configured, because hooks/prefs.py seeds Material's own
  # palette from the shared key before the first paint. Material's header toggle
  # is deliberately absent: light/dark is offered once, inside the Settings
  # dialog, so there are not two controls for one idea. The palette inputs are
  # kept (hidden) and the dialog drives them, so Material still applies the
  # scheme and the bridge still records it.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
hooks:
  - hooks/entry.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_css:
  # In cascade order: the design system, the theme bundles, then the book's own
  # subject tint and overrides. See SHAPE.md ("Per-book theming").
  - assets/stylesheets/extra.css
  - assets/stylesheets/themes.css
  - assets/stylesheets/book.css
  - assets/stylesheets/book-local.css
  - assets/stylesheets/settings.css
# extra_javascript is generated per book: the Settings runtime is on every page,
# and a book without a formulae booklet must not ship a widget that would fetch
# one.

# Shared MkDocs configuration for every book and profile.
#
# Per-book configs (renderers/mkdocs/<book>.<profile>.yml) are generated from
# books/<id>/book.yaml by `python -m textbook.scaffold`, and INHERIT this file.
#
# Everything here is genuinely common: the theme, the shared design system, the
# runtime widgets and the hook entry point. Anything that varies by book — the
# site name, description, URL, docs directory, nav and profile — is generated.
theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
hooks:
  - hooks/entry.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_css:
  # In cascade order: the design system, the theme bundles, then the book's own
  # subject tint and overrides. See SHAPE.md ("Per-book theming").
  - assets/stylesheets/extra.css
  - assets/stylesheets/themes.css
  - assets/stylesheets/book.css
  - assets/stylesheets/book-local.css
# extra_javascript is generated per book: a book without a formulae booklet must
# not ship a widget that would fetch one.

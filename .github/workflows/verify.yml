name: verify

# main verifies, releases and deploys. Any other branch listed here verifies
# only: the release and deploy jobs require refs/heads/main, so everything before
# them runs and neither of them can. `dev` exists to be that place — push work in
# progress and get the whole gate without touching what is live.
#
# To verify every branch rather than named ones, replace the list with '**'.
on:
  push:
    branches: [main, dev]
  pull_request:
  # Manual runs. On main this releases and deploys; on any other branch it
  # verifies only, for the same reason.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One row per book profile, derived from books/*/book.yaml, so adding a book
  # needs no workflow edit.
  plan:
    name: plan
    # A repository variable, so pointing the gate at a self-hosted runner is a
    # setting rather than a commit — and `gh variable delete RUNNER_LABEL` puts it
    # back. See `deploy/runner/README.md`.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - id: matrix
        name: Emit the build matrix
        run: echo "include=$(uv run python -m textbook.plan --github-matrix)" >> "$GITHUB_OUTPUT"

  generated:
    name: generated files are in sync
    needs: plan
    # A repository variable, so pointing the gate at a self-hosted runner is a
    # setting rather than a commit — and `gh variable delete RUNNER_LABEL` puts it
    # back. See `deploy/runner/README.md`.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Verify the otkd bundle
        # Offline by design: the bundle's SHA256SUMS against the committed bytes. The
        # rebuild-and-compare needs the otkd environment and eight minutes, so it is
        # the changed-path `otkd` job below; this step is what a clone can check with
        # no toolchain and no network.
        run: scripts/build-otkd.sh --verify

      - name: Regenerate and check for drift
        run: |
          # The TypeScript compiles first. Its output is committed — the kit's
          # JavaScript and `tools/dist/` — so this job has to rebuild it, or a
          # source change that was never compiled passes `git diff --exit-code`
          # because nothing regenerated the file it should have changed.
          node tools/build.mjs
          uv run python -m textbook.scaffold
          uv run python -m textbook.booklet
          uv run python -m textbook.portal
          git diff --exit-code

  build:
    name: build every profile
    needs: plan
    # A repository variable, so pointing the gate at a self-hosted runner is a
    # setting rather than a commit — and `gh variable delete RUNNER_LABEL` puts it
    # back. See `deploy/runner/README.md`.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    # **One job, every profile, four at a time — not one job per profile.** The matrix
    # this replaces was thirteen rows at about a hundred seconds each: 1300 of the
    # gate's 2600 seconds, half the run, for a build that takes four seconds. Every row
    # paid its own `checkout`, `uv sync` and `npm ci`, and on four self-hosted runners
    # they then queued behind each other.
    #
    # Nothing is lost but the job list: `deploy` builds the site itself, so this job is
    # a check, and a failing profile prints its own log and the job fails on it.
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      # The pipeline is the site now. It replaces `mkdocs build --strict`:
      # check_links() requires every internal link to resolve to a built file, and the
      # build exits non-zero when one does not. Each pipeline writes only under its own
      # `site/<book>/<profile>/`, so they do not collide; the portal writes the
      # deployment root and therefore goes last, alone.
      - name: Build every profile
        env:
          # Two, for the reason above: the machine has eight cores shared by four
          # agents, and four concurrent builds per job made the batch slower than two.
          BUILD_JOBS: 2
        run: scripts/build-all.sh

      - name: No maths rendering errors
        run: |
          if grep -rl 'math-error' site --include='*.html'; then
            echo "KaTeX failed to render at least one expression" >&2
            exit 1
          fi

  content:
    name: banks, tests and voice
    needs: plan
    # A repository variable, so pointing the gate at a self-hosted runner is a
    # setting rather than a commit — and `gh variable delete RUNNER_LABEL` puts it
    # back. See `deploy/runner/README.md`.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # The pipeline tests render real pages, and the maths hook shells out to
      # the Node KaTeX renderer. Without it KaTeX is unavailable and every
      # expression degrades to a .math-error span, so the tests fail on maths
      # that is in fact fine.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Verify the problem banks
        run: uv run python -m textbook.verify

      - name: Lint the books
        run: uv run python -m textbook.lint

      - name: Test
        env:
          # **Two workers, not four, on a shared host.** A runner has the machine's eight
          # cores to itself only when it is the only job running; with four agents the
          # gate is oversubscribed about threefold, and every job parallelising
          # internally makes it worse — measured, `theme preview` is 194 s alone and
          # 432 s under that load. The runners carry the parallelism; a job carrying its
          # own is the same cores counted twice.
          PYTEST_WORKERS: 2
        run: uv run pytest tests/ -q -n "$PYTEST_WORKERS"

  # The Rust kernels. The wasm is committed, so this job's job is to prove the
  # committed bytes are the source: it rebuilds into a temporary directory and fails
  # on any difference. It does not write what ships — the deploy job installs no
  # compiler and reads the committed tree.
  solvers:
    name: solvers
    needs: plan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned to the channel in solvers/rust-toolchain.toml. The .wasm bytes depend
      # on the compiler, so a floating toolchain would make the drift check fail for
      # the wrong reason.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Musl target for the host tools
        run: rustup target add x86_64-unknown-linux-musl

      # **From `solvers/`, not the repository root.** Cargo reads `.cargo/config.toml`
      # from the current directory upwards, not from `--manifest-path`; from the root
      # it would miss the musl target and the `rust-lld` linker and fall back to `cc`.
      - name: Format
        working-directory: solvers
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: solvers
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test the mathematics
        working-directory: solvers
        run: cargo test --locked

      - name: The committed wasm is what the source builds
        run: scripts/build-solvers.sh --check

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Replay every selftest through the page's loader
        run: node scripts/check-solvers.mjs

  # otkd is a project of its own inside solvers/, and its work is expensive: about
  # twelve minutes for the suite and eight for the bundle rebuild. Both are one job,
  # because the host has four runners: splitting them into three made the wall worse
  # and raced on the shared `.venv`. The speed-ups that measured are `-n 2` for the
  # suite and a parallel bundle build (`--jobs 2`); a kernel cache did not move the
  # bundle, whose time is the symbolic derivation. A skip prints why.
  otkd:
    name: otkd
    needs: plan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the parent commit; the version needs the tags.
          fetch-depth: 0
          fetch-tags: true

      - id: changed
        name: Did this push touch solvers/otkd?
        run: |
          base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD -- solvers/otkd scripts/build-otkd.sh | grep -q .; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "NOTE: solvers/otkd unchanged; the suite and bundle rebuild are skipped."
          fi

      - name: Set up uv
        if: steps.changed.outputs.run == 'yes'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Rust toolchain
        if: steps.changed.outputs.run == 'yes'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown

      - name: Musl target for the workspace toolchain
        if: steps.changed.outputs.run == 'yes'
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install
        if: steps.changed.outputs.run == 'yes'
        run: uv sync --project solvers/otkd --frozen

      - name: Test
        if: steps.changed.outputs.run == 'yes'
        # The project's own pytest config applies only when pytest starts here; from
        # the repository root it collects the site's tests against the otkd environment.
        working-directory: solvers/otkd
        run: uv run --frozen pytest -q -n 2

      - name: The committed bundle is what the source builds
        if: steps.changed.outputs.run == 'yes'
        env:
          # Two models at once: the host is shared with the content and browser jobs,
          # and four oversubscribed the eight cores when the tests and the bundle ran
          # together here.
          OTKD_JOBS: 2
        run: scripts/build-otkd.sh --check

  workflows:
    name: lint workflows
    # A repository variable, so pointing the gate at a self-hosted runner is a
    # setting rather than a commit — and `gh variable delete RUNNER_LABEL` puts it
    # back. See `deploy/runner/README.md`.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # A binary, not the Docker action. Two reasons: the Docker action pulls an image,
      # which is the one thing that needs the runner's Docker socket — and a socket is
      # root on the host. Downloading a checksummed binary removes that dependency
      # entirely, and it is faster.
      - name: Install actionlint
        env:
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          ACTIONLINT_VERSION: 1.7.7
        run: |
          # **Into the runner's own directory, and onto `GITHUB_PATH`.** The first
          # attempt unpacked into `/usr/local/bin` and the self-hosted runner, which
          # runs as an unprivileged user, was refused: the checksum passed and the
          # install did not, which is exactly the failure a checksum does not catch.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/actionlint" --version

  # The theme preview: every bundle in both schemes on three built routes, with a
  # full-page contrast audit. It is the only check that measures what the shell
  # actually paints — a token that is declared but never applied, Material's
  # specificity defects, and an accent that only fails without a subject tint —
  # so it runs here rather than only when a human remembers. Chrome is the one
  # thing pytest cannot provide; the runner ships it, so only the Playwright
  # client is installed and no browser is downloaded.
  preview:
    name: theme preview
    # **The one job a run may skip, and the reason is its cost.** It is about fifteen
    # minutes: it builds every profile and then drives Chrome over 490 figure renders,
    # 201 phone viewports and 1465 readouts. Everything else in this file finishes in
    # under three.
    #
    # So it runs where it changes an outcome: on `main`, which tags and deploys, and on
    # a manual dispatch. On `dev` and on a pull request it runs **only when asked** —
    # apply the `browser` label, or set the `CI_BROWSER` variable to `always`. The same
    # script is one command locally (`scripts/preview-themes.sh`), and the release path
    # still runs it before anything is deployed, so a browser defect cannot reach a
    # reader. A skip is **announced by the gate**, so "not run" is never read as
    # "passed".
    if: >
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'browser') ||
      vars.CI_BROWSER == 'always'
    # A repository variable, so pointing the gate at a self-hosted runner is a
    # setting rather than a commit — and `gh variable delete RUNNER_LABEL` puts it
    # back. See `deploy/runner/README.md`.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      # `playwright` is not a package.json dependency: it is only needed here and
      # by the browser commands behind `tools`. Skip the browser download and use the
      # runner's Chrome through the harness's `channel: "chrome"` default.
      - name: Install the Playwright client
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save playwright@1.64.0

      - name: Chrome is available
        run: google-chrome --version || google-chrome-stable --version

      # Builds every profile and the portal, then audits every bundle in both schemes
      # across three routes. The
      # script asserts the route layout first, so a renderer swap fails on a
      # missing route rather than auditing a 404.
      - name: Preview every bundle on the built site
        run: scripts/preview-themes.sh

  # One stable check name for branch protection to require. The build matrix
  # generates per-book job names, so requiring those would mean editing the
  # protection rule every time a book is added; requiring this does not.
  gate:
    name: all checks
    needs: [plan, generated, build, content, solvers, otkd, workflows, preview]
    if: always()
    # A repository variable, so pointing the gate at a self-hosted runner is a
    # setting rather than a commit — and `gh variable delete RUNNER_LABEL` puts it
    # back. See `deploy/runner/README.md`.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Every required job must have succeeded
        env:
          PLAN: ${{ needs.plan.result }}
          GENERATED: ${{ needs.generated.result }}
          BUILD: ${{ needs.build.result }}
          CONTENT: ${{ needs.content.result }}
          SOLVERS: ${{ needs.solvers.result }}
          OTKD: ${{ needs.otkd.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          PREVIEW: ${{ needs.preview.result }}
        run: |
          failed=0
          # Named rather than a joined list, because the preview is allowed to be
          # absent and the others are not — and an index into `needs.*.result` is the
          # kind of thing that silently reorders.
          required() {
            if [ "$2" != "success" ]; then
              echo "required job $1 finished as '$2'"
              failed=1
            fi
          }
          required plan "$PLAN"
          required generated "$GENERATED"
          required build "$BUILD"
          required content "$CONTENT"
          required solvers "$SOLVERS"
          required otkd "$OTKD"
          required workflows "$WORKFLOWS"

          # The browser suite may be skipped on a branch; `main` always runs it before
          # a release. Said out loud so a skip is not mistaken for a pass.
          case "$PREVIEW" in
            success) ;;
            skipped)
              echo "NOTE: theme preview skipped on this run."
              echo "      Run scripts/preview-themes.sh before merging, or apply the"
              echo "      'browser' label. main runs it before anything is released."
              ;;
            *)
              echo "required job preview finished as '$PREVIEW'"
              failed=1
              ;;
          esac

          [ "$failed" = "0" ] || exit 1
          echo "all required jobs succeeded"

  # A dated release per day. Deliberately always succeeds: a second push on the
  # same day has nothing new to tag, and skipping would skip the deploy too.
  release:
    name: tag and release
    needs: gate
    # The tag is published so the deploy job can stamp it into the build: the
    # release happens in this job, and nothing else can recover the tag the
    # release actually created (GITHUB_REF_NAME is still the branch here).
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    # Main only: a branch whose whole purpose is work in progress must not tag.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # A repository variable, so pointing the gate at a self-hosted runner is a
    # setting rather than a commit — and `gh variable delete RUNNER_LABEL` puts it
    # back. See `deploy/runner/README.md`.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - id: release
        name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # A UK textbook dated on the UK calendar, not on the runner's UTC.
          TZ: Europe/London
        run: |
          # yy.<day of year>.<increment>, the increment counting the tags already
          # released today. A plain date cannot survive a second deploy in a day:
          # it either overwrites the tag or, as this used to, silently releases
          # nothing. scripts/next-tag.sh owns the scheme and is tested.
          tag="$(scripts/next-tag.sh)"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Live at https://open-textbook.org/" \
            --generate-notes
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::released $tag"

  deploy:
    name: deploy to production
    # Everything must have verified, and the release must exist: nothing ships
    # that did not verify, and nothing ships unreleased. Main only, which is what
    # keeps a push to any other branch from changing what is live.
    needs: [release]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # A repository variable, so pointing the gate at a self-hosted runner is a
    # setting rather than a commit — and `gh variable delete RUNNER_LABEL` puts it
    # back. See `deploy/runner/README.md`.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment:
      name: production
      url: https://open-textbook.org/
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      # Rebuilt rather than passed between jobs. The toolchain is pinned by
      # uv.lock and package-lock.json and the generated files are checked for
      # drift above, so this reproduces what was verified; the maths guard is
      # re-run here for the same reason.
      - name: Build the site
        env:
          # Stamped into site/version.json and every page's <meta name="build">,
          # so a live site can be traced back to a commit. See textbook.portal.
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_TAG: ${{ needs.release.outputs.tag }}
        run: |
          uv run python -m textbook.scaffold
          uv run python -m textbook.booklet
          uv run python -m textbook.portal
          # The pipeline replaces `mkdocs build --strict`: it checks every
          # internal link and exits non-zero on a broken one. `--configs` emits
          # the pipeline's arguments, not MkDocs config paths.
          while read -r -a build; do
            uv run python -m textbook.pipeline "${build[@]}"
          done < <(uv run python -m textbook.plan --configs)

      - name: Refuse to ship broken maths
        run: |
          if grep -rl 'math-error' site --include='*.html'; then
            echo "KaTeX failed to render at least one expression" >&2
            exit 1
          fi

      # The contact URL is data in the colophon, not a link in the page tree, so
      # the build cannot see it. It was a 404 while the repository was private.
      - name: Check the reader's report route
        run: scripts/check-contact.sh

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

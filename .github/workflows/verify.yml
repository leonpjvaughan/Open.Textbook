name: verify

on:
  push:
    branches: [main]
  pull_request:
  # Manual deploys. Deploying is otherwise gated on every job above passing, on a
  # push to main. To release only from tags instead, change the deploy job's `if:`
  # to start with `startsWith(github.ref, 'refs/tags/')`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One row per book profile, derived from books/*/book.yaml, so adding a book
  # needs no workflow edit.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - id: matrix
        name: Emit the build matrix
        run: echo "include=$(uv run python -m textbook.plan --github-matrix)" >> "$GITHUB_OUTPUT"

  generated:
    name: generated files are in sync
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Regenerate and check for drift
        run: |
          uv run python -m textbook.scaffold
          uv run python -m textbook.booklet
          uv run python -m textbook.portal
          git diff --exit-code

  build:
    name: build ${{ matrix.book }} (${{ matrix.profile }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # `plan` emits the whole {"include": [...]} object, so it is passed to
      # `matrix` directly. Wrapping it in an `include:` key instead makes the job
      # fail to configure, and GitHub then reports a failed run with no job.
      matrix: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Build ${{ matrix.title }} — ${{ matrix.name }}
        run: uv run mkdocs build -f ${{ matrix.config }} --strict

      - name: No maths rendering errors
        run: |
          if grep -rl 'math-error' ${{ matrix.site_dir }} --include='*.html'; then
            echo "KaTeX failed to render at least one expression" >&2
            exit 1
          fi

  content:
    name: banks, tests and voice
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # The pipeline tests render real pages, and the maths hook shells out to
      # the Node KaTeX renderer. Without it KaTeX is unavailable and every
      # expression degrades to a .math-error span, so the tests fail on maths
      # that is in fact fine.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Verify the problem banks
        run: uv run python -m textbook.verify

      - name: Lint the books
        run: uv run python -m textbook.lint

      - name: Test
        run: uv run pytest tests/ -q

      - name: Figure-hook and tier-profile evaluation
        run: test/run.sh

  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

  deploy:
    name: deploy to production
    # Every other job must pass first: nothing ships that did not verify.
    needs: [generated, build, content]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://open-textbook.org/
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      # Rebuilt rather than passed between jobs. The toolchain is pinned by
      # uv.lock and package-lock.json and the generated files are checked for
      # drift above, so this reproduces what was verified; the maths guard is
      # re-run here for the same reason.
      - name: Build the site
        run: |
          uv run python -m textbook.scaffold
          uv run python -m textbook.booklet
          uv run python -m textbook.portal
          while read -r config; do
            uv run mkdocs build -f "$config" --strict
          done < <(uv run python -m textbook.plan --configs)

      - name: Refuse to ship broken maths
        run: |
          if grep -rl 'math-error' site --include='*.html'; then
            echo "KaTeX failed to render at least one expression" >&2
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

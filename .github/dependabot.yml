# Dependency updates.
#
# The build's toolchain is pinned on purpose — `uv.lock` for MkDocs and its
# plugins, `package-lock.json` for build-time KaTeX — so nothing here should move
# on its own. But a pin that is never revisited silently ages out of support,
# which is how a build breaks months later on the day a mirror is retired. A
# weekly pull request is the reminder; the pins stay, because CI still builds
# against the lockfile until the pull request is merged.
#
# Both ecosystems are opened as a small number of grouped pull requests rather
# than one per transitive dependency, so the review stays proportionate to a
# textbook.
version: 2
updates:
  # npm: build-time KaTeX only. See package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-build:
        patterns:
          - "*"

  # Python: the MkDocs toolchain, declared in pyproject.toml and pinned in
  # uv.lock. If GitHub ever rejects the `uv` ecosystem, `pip` reads
  # pyproject.toml but cannot update uv.lock, so this would become a manual job.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python-toolchain:
        patterns:
          - "*"

  # The workflows themselves. A pinned action is a security decision, and one
  # that nobody revisits is a decision to stay on an old one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

# Rounding is not equality, so it gets its own check kind: `rounded` proves the
# stated answer is the nearest multiple of the required step.
chapter: 1
problems:
  - id: ch1-round-pi-2dp
    section: "1.5"
    tier: F
    dfe: [N15]
    statement: "Round $3.14159$ to 2 decimal places."
    check: {kind: rounded, value: "3.14159", rounded: "3.14", to: "0.01"}

  - id: ch1-round-nearest-pound
    section: "1.5"
    tier: F
    dfe: [N15]
    statement: "Round £39.20 to the nearest pound."
    check: {kind: rounded, value: "39.20", rounded: "39", to: "1"}

  - id: ch1-round-1sf
    section: "1.5"
    tier: F
    dfe: [N15]
    statement: "Round $4367$ to 2 significant figures."
    check: {kind: rounded, value: "4367", rounded: "4400", to: "100"}

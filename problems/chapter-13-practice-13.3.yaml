chapter: 13
symbols:
  x: {real: true}
  y: {real: true}
problems:
  - id: vertical-translation
    section: '13.3'
    tier: H
    dfe: [A13]
    statement: 'Translate $y=x^2$ up 4 units. Write its new equation.'
    answer_label: 'Vertical translation'
    check: {kind: evaluate, expression: 0**2+4, answer: '4'}
    answer_text: '$y=x^2+4$.'
  - id: horizontal-translation
    section: '13.3'
    tier: H
    dfe: [A13]
    statement: 'Translate $y=x^2$ 3 units right. Write its new equation.'
    answer_label: 'Horizontal translation'
    check: {kind: evaluate, expression: (3-3)**2, answer: '0'}
    answer_text: '$y=(x-3)^2$.'
  - id: translate-left-and-up
    section: '13.3'
    tier: H
    dfe: [A13]
    statement: 'Translate $y=x^2$ 2 units left and 1 unit up. Give the equation and turning point.'
    answer_label: 'Combined translation'
    check: {kind: evaluate, expression: (-2+2)**2+1, answer: '1'}
    answer_text: '$y=(x+2)^2+1$. The turning point is $(-2,1)$.'
  - id: reflection-x
    section: '13.3'
    tier: H
    dfe: [A13]
    statement: 'Reflect $y=x^3$ in the $x$-axis. Give the new equation.'
    answer_label: '$x$-axis reflection'
    check: {kind: evaluate, expression: -(2**3), answer: '-8'}
    answer_text: '$y=-x^3$.'
  - id: reflection-y
    section: '13.3'
    tier: H
    dfe: [A13]
    statement: 'Reflect $y=x^2+1$ in the $y$-axis. Give the new equation.'
    answer_label: '$y$-axis reflection'
    check: {kind: evaluate, expression: (-3)**2+1, answer: '10'}
    answer_text: '$y=(-x)^2+1=x^2+1$.'
  - id: reflect-point-in-x-axis
    section: '13.3'
    tier: H
    dfe: [A13]
    statement: 'The point $(2,5)$ lies on $y=f(x)$. State its image after reflection in the $x$-axis.'
    answer_label: '$x$-axis reflection of a point'
    check: {kind: evaluate, expression: -5, answer: '-5'}
    answer_text: 'The image is $(2,-5)$: the input stays fixed and the output changes sign.'
  - id: reflect-point-in-y-axis
    section: '13.3'
    tier: H
    dfe: [A13]
    statement: 'The point $(4,3)$ lies on $y=f(x)$. State its image after reflection in the $y$-axis.'
    answer_label: '$y$-axis reflection of a point'
    check: {kind: evaluate, expression: -4, answer: '-4'}
    answer_text: 'The image is $(-4,3)$: the input changes sign and the output stays fixed.'
  - id: point-shift
    section: '13.3'
    tier: H
    dfe: [A13]
    statement: 'The point $(2,5)$ lies on $y=f(x)$. State its image under $y=f(x)-4$.'
    answer_label: 'Point after vertical shift'
    check: {kind: evaluate, expression: 5-4, answer: '1'}
    answer_text: 'The image is $(2,1)$.'
  - id: combined-reflection-translation
    section: '13.3'
    tier: H
    dfe: [A13]
    statement: '**H** Starting with $y=f(x)$, reflect in the $x$-axis, then translate 3 units right and 2 units up. Write the transformed rule.'
    answer_label: 'Combined transformations'
    check: {kind: evaluate, expression: -(2**2)+2, answer: '-2'}
    answer_text: '$y=-f(x-3)+2$.'

chapter: 12
symbols:
  x:
    real: true
  t:
    real: true
problems:
- id: ch12-12.1-expand-a
  section: '12.1'
  tier: F
  dfe:
  - A4
  statement: Expand $(x+3)(x+5).
  answer_label: Expand $(x+3)(x+5).
  check:
    kind: evaluate
    expression: (x+3)*(x+5)
    answer: x**2+8*x+15
  answer_text: $x^2+8x+15$.
- id: ch12-12.1-expand-b
  section: '12.1'
  tier: F
  dfe:
  - A4
  statement: Expand $(2x-1)(x+4).
  answer_label: Expand $(2x-1)(x+4).
  check:
    kind: evaluate
    expression: (2*x-1)*(x+4)
    answer: 2*x**2+7*x-4
  answer_text: $2x^2+7x-4$.
- id: ch12-12.1-factorise-a
  section: '12.1'
  tier: F
  dfe:
  - A4
  statement: Factorise $x^2+8x+15$.
  answer_label: Factorise $x^2+8x+15$.
  check:
    kind: evaluate
    expression: x**2+8*x+15
    answer: (x+3)*(x+5)
  answer_text: $(x+3)(x+5)$.
- id: ch12-12.1-factorise-b
  section: '12.1'
  tier: F
  dfe:
  - A4
  statement: Factorise $x^2-x-12$.
  answer_label: Factorise $x^2-x-12$.
  check:
    kind: evaluate
    expression: x**2-x-12
    answer: (x-4)*(x+3)
  answer_text: $(x-4)(x+3)$.
- id: ch12-12.1-difference
  section: '12.1'
  tier: F
  dfe:
  - A4
  statement: Factorise $x^2-25$.
  answer_label: Factorise $x^2-25$.
  check:
    kind: evaluate
    expression: x**2-25
    answer: (x-5)*(x+5)
  answer_text: $(x-5)(x+5)$.
- id: ch12-12.1-solve-expression
  section: '12.1'
  tier: F
  dfe:
  - A18
  statement: Solve $x^2+6x+8=0$ by factorising.
  answer_label: Solve $x^2+6x+8=0$ by factorising.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: (x+2)*(x+4)
      answer: x**2+6*x+8
    - kind: all
      checks:
      - kind: evaluate
        expression: (-2)**2+6*(-2)+8
        answer: '0'
      - kind: evaluate
        expression: (-4)**2+6*(-4)+8
        answer: '0'
  answer_text: $x=-2$ or $x=-4$.
- id: ch12-12.1-challenge
  section: '12.1'
  tier: F
  dfe:
  - A4
  statement: Factorise $3x^2+12x$.
  answer_label: Factorise $3x^2+12x$.
  check:
    kind: evaluate
    expression: 3*x**2+12*x
    answer: 3*x*(x+4)
  answer_text: $3x(x+4)$.
- id: ch12-12.1-context
  section: '12.1'
  tier: F
  dfe:
  - A4
  statement: A rectangle has sides $(x+2)$ cm and $(x+7)$ cm. Expand an expression for its area.
  answer_label: A rectangle has sides $(x+2)$ cm and $(x+7)$ cm. Expand an expression for its area.
  check:
    kind: evaluate
    expression: (x+2)*(x+7)
    answer: x**2+9*x+14
  answer_text: "$x^2+9x+14\text{ cm}^2$."

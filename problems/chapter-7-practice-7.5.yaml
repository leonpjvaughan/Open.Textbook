chapter: 7
symbols:
  x:
    real: true
problems:
- id: ch7-75-large
  section: '7.5'
  tier: F
  dfe:
  - N9
  statement: Write $6\,320\,000$ in standard form.
  answer_label: Large number in standard form
  check:
    kind: evaluate
    expression: 6.32 * 10**6
    answer: '6320000'
  answer_text: "$6.32\times10^6$."
- id: ch7-75-small
  section: '7.5'
  tier: F
  dfe:
  - N9
  statement: Write $0.000091$ in standard form.
  answer_label: Small number in standard form
  check:
    kind: evaluate
    expression: 9.1 * 10**-5
    answer: '0.000091'
  answer_text: "$9.1\times10^{-5}$."
- id: ch7-75-multiply
  section: '7.5'
  tier: F
  dfe:
  - N9
  statement: "Work out $(2\times10^5)(3\times10^4)$ in standard form."
  answer_label: Multiply standard form
  check:
    kind: evaluate
    expression: 2*10**5*3*10**4
    answer: 6*10**9
  answer_text: "$6\times10^9$."
- id: ch7-75-divide
  section: '7.5'
  tier: F
  dfe:
  - N9
  statement: "Work out $(8\times10^7)\\div(2\times10^3)$ in standard form."
  answer_label: Divide standard form
  check:
    kind: evaluate
    expression: 8*10**7/(2*10**3)
    answer: 4*10**4
  answer_text: "$4\times10^4$."
- id: ch7-75-add
  section: '7.5'
  tier: F
  dfe:
  - N9
  statement: "Work out $4.5\times10^6+2.3\times10^6$."
  answer_label: Add in standard form
  check:
    kind: evaluate
    expression: 4.5*10**6+2.3*10**6
    answer: 6.8*10**6
  answer_text: "$6.8\times10^6$."
- id: ch7-75-subtract
  section: '7.5'
  tier: F
  dfe:
  - N9
  statement: "Work out $5.2\times10^4-3\times10^3$."
  answer_label: Subtract in standard form
  check:
    kind: evaluate
    expression: 5.2*10**4-3*10**3
    answer: 4.9*10**4
  answer_text: "$4.9\times10^4$."
- id: ch7-75-compare
  section: '7.5'
  tier: F
  dfe:
  - N9
  statement: "Which is greater: $7.4\times10^{-3}$ or $6.9\times10^{-2}$?"
  answer_label: Compare standard form values
  check:
    kind: compare
    relation: <
    lhs: 7.4*10**-3
    rhs: 6.9*10**-2
  answer_text: "$6.9\times10^{-2}$."
- id: ch7-75-context
  section: '7.5'
  tier: F
  dfe:
  - N9
  statement: A bacterium is $0.000004$ m long. Write this length in standard form.
  answer_label: Measurement in standard form
  check:
    kind: evaluate
    expression: 4*10**-6
    answer: '0.000004'
  answer_text: "$4\times10^{-6}$ m."
- id: ch7-75-h
  section: '7.5'
  tier: H
  dfe:
  - N9
  statement: "**H** Work out $(6\times10^{-4})(5\times10^8)\\div(3\times10^2)$ in standard form."
  answer_label: Combined standard form calculation
  check:
    kind: evaluate
    expression: (6*10**-4*5*10**8)/(3*10**2)
    answer: 1*10**3
  answer_text: "$1\times10^3$."
- id: ch7-75-estimate
  section: '7.5'
  tier: F
  dfe:
  - N9
  statement: "Which method applies to add $8.2\times10^5$ and $3.7\times10^4$? Then calculate."
  answer_label: Choose a method for addition
  check:
    kind: evaluate
    expression: 8.2*10**5+3.7*10**4
    answer: 8.57*10**5
  answer_text: "Match powers: $8.2\times10^5+0.37\times10^5=8.57\times10^5$."

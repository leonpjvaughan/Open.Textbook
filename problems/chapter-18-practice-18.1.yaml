chapter: 18
problems:
- id: ch18-18.1-reflection
  section: '18.1'
  tier: F
  dfe:
  - G7
  statement: Reflect the point $(3,2)$ in the $y$-axis. Give its image.
  answer_label: Reflect the point $(3,2)$ in the $y$-axis. Give its image.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 3-6
      answer: '-3'
    - kind: evaluate
      expression: '2'
      answer: '2'
  answer_text: (-3,2)
- id: ch18-18.1-rotation
  section: '18.1'
  tier: F
  dfe:
  - G7
  statement: Rotate $(2,1)$ by $90^\circ$ clockwise about the origin.
  answer_label: Rotate $(2,1)$ by $90^\circ$ clockwise about the origin.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: '1'
      answer: '1'
    - kind: evaluate
      expression: '-2'
      answer: '-2'
  answer_text: (1,-2)
- id: ch18-18.1-translation
  section: '18.1'
  tier: F
  dfe:
  - G7
  statement: Translate $(-1,3)$ by the vector $\begin{pmatrix}4\\-2\end{pmatrix}$.
  answer_label: Translate $(-1,3)$ by the vector $\begin{pmatrix}4\\-2\end{pmatrix}$.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: -1+4
      answer: '3'
    - kind: evaluate
      expression: 3-2
      answer: '1'
  answer_text: (3,1)
- id: ch18-18.1-describe
  section: '18.1'
  tier: F
  dfe:
  - G8
  statement: Describe the single transformation taking $(1,2)$ to $(-1,2)$ and $(3,2)$ to $(-3,2)$.
  answer_label: Describe the single transformation taking $(1,2)$ to $(-1,2)$ and $(3,2)$ to $(-3,2)$.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: '1'
      answer: '1'
    - kind: evaluate
      expression: '3'
      answer: '3'
  answer_text: Reflection in the $y$-axis.
- id: ch18-18.1-reflect-line
  section: '18.1'
  tier: F
  dfe:
  - G7
  statement: Reflect $(4,-2)$ in the line $y=x$.
  answer_label: Reflect $(4,-2)$ in the line $y=x$.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: '-2'
      answer: '-2'
    - kind: evaluate
      expression: '4'
      answer: '4'
  answer_text: (-2,4)
- id: ch18-18.1-translate-shape
  section: '18.1'
  tier: F
  dfe:
  - G7
  statement: Triangle vertices are $(0,0),(2,0),(1,3)$. Translate by $\begin{pmatrix}-3\\1\end{pmatrix}$. Give all image vertices.
  answer_label: Triangle vertices are $(0,0),(2,0),(1,3)$. Translate by $\begin{pmatrix}-3\\1\end{pmatrix}$. Give all image vertices.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: '-3'
      answer: '-3'
    - kind: evaluate
      expression: 0+1
      answer: '1'
  answer_text: (-3,1), (-1,1), (-2,4)
- id: ch18-18.1-rotation-centre
  section: '18.1'
  tier: F
  dfe:
  - G7
  statement: Rotate $(4,2)$ by $180^\circ$ about the origin.
  answer_label: Rotate $(4,2)$ by $180^\circ$ about the origin.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: '-4'
      answer: '-4'
    - kind: evaluate
      expression: '-2'
      answer: '-2'
  answer_text: (-4,-2)
- id: ch18-18.1-choose
  section: '18.1'
  tier: F
  dfe:
  - G8
  statement: A shape keeps its size and orientation but moves three left and one up. Which transformation applies, and why?
  answer_label: A shape keeps its size and orientation but moves three left and one up. Which transformation applies, and why?
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: '-3'
      answer: '-3'
    - kind: evaluate
      expression: 2-1
      answer: '1'
  answer_text: Translation by $\begin{pmatrix}-3\\1\end{pmatrix}$; every point moves by the same vector.
- id: ch18-18.1-reflect-x
  section: '18.1'
  tier: F
  dfe:
  - G7
  statement: Reflect $(-5,2)$ in the $x$-axis.
  answer_label: Reflect $(-5,2)$ in the $x$-axis.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: '-5'
      answer: '-5'
    - kind: evaluate
      expression: '-2'
      answer: '-2'
  answer_text: (-5,-2)
- id: ch18-18.1-turn
  section: '18.1'
  tier: F
  dfe:
  - G7
  statement: Rotate $(1,-4)$ by $90^\circ$ anticlockwise about the origin.
  answer_label: Rotate $(1,-4)$ by $90^\circ$ anticlockwise about the origin.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: -(-4)
      answer: '4'
    - kind: evaluate
      expression: '1'
      answer: '1'
  answer_text: (4,1)

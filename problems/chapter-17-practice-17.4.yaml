- id: ch17-17-4-perp-shortest
  section: '17.4'
  tier: F
  dfe:
  - G2
  statement: A sloping segment and perpendicular segment both join a point to a line. Which is shorter?
  answer_label: A sloping segment and perpendicular segment both join a point to a line. Which is shorter?

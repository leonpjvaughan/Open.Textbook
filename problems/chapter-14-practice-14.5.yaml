- id: ch14-14-5-01
  section: '14.5'
  tier: H
  dfe: [A20]
  statement: 'Use $x_{n+1}=\frac12(x_n+6/x_n)$ with $x_0=2$. Find $x_1$.'
  answer_label: 'First iteration'
  check: {kind: evaluate, expression: '(2 + 6/2)/2', answer: '5/2'}
  answer_text: '$x_1=2.5$.'
- id: ch14-14-5-02
  section: '14.5'
  tier: H
  dfe: [A20]
  statement: 'Use $x_{n+1}=\frac12(x_n+6/x_n)$ with $x_0=2$. Find $x_2$.'
  answer_label: 'Second iteration'
  check: {kind: evaluate, expression: '((2 + 6/2)/2 + 6/((2 + 6/2)/2))/2', answer: '49/20'}
  answer_text: '$x_2=2.45$.'
- id: ch14-14-5-03
  section: '14.5'
  tier: H
  dfe: [A20]
  statement: 'Use $x_{n+1}=\frac12(x_n+6/x_n)$ with $x_0=2$. Find $x_3$ to 3 decimal places.'
  answer_label: 'Third iteration, 3 decimal places'
  check:
    kind: rounded
    value: '4801/1960'
    rounded: '2.449'
    to: '0.001'
  answer_text: '$x_3\approx2.449$.'
- id: ch14-14-5-04
  section: '14.5'
  tier: H
  dfe: [A20]
  statement: 'Use $x_{n+1}=2+1/x_n$ with $x_0=2$. Find $x_2$.'
  answer_label: 'Two iterations'
  check: {kind: evaluate, expression: '2 + 1/(2 + 1/2)', answer: '12/5'}
  answer_text: '$x_1=2.5$ and $x_2=2.4$.'
- id: ch14-14-5-05
  section: '14.5'
  tier: H
  dfe: [A20]
  statement: 'Use $x_{n+1}=3+2/x_n$ with $x_0=2$. Find $x_2$.'
  answer_label: 'Iteration with a different rule'
  check: {kind: evaluate, expression: '3 + 2/(3 + 2/2)', answer: '7/2'}
  answer_text: '$x_1=4$ and $x_2=3.5$.'
- id: ch14-14-5-06
  section: '14.5'
  tier: H
  dfe: [A20]
  statement: 'Use $x_{n+1}=\frac12(x_n+6/x_n)$ with $x_0=3$. Find $x_2$.'
  answer_label: 'Iteration from a new start value'
  check: {kind: evaluate, expression: '((3 + 6/3)/2 + 6/((3 + 6/3)/2))/2', answer: '49/20'}
  answer_text: '$x_1=2.5$ and $x_2=2.45$.'
- id: ch14-14-5-07
  section: '14.5'
  tier: H
  dfe: [A20]
  statement: 'Use $x_{n+1}=x_n/2+1$ with $x_0=8$. Find $x_3$.'
  answer_label: 'Three steps of iteration'
  check: {kind: evaluate, expression: '(((8/2+1)/2+1)/2+1)', answer: '11/4'}
  answer_text: '$x_1=5$, $x_2=3.5$, and $x_3=2.75$.'
- id: ch14-14-5-08
  section: '14.5'
  tier: H
  dfe: [A20]
  statement: 'Use $x_{n+1}=1+2/x_n$ with $x_0=2$. Find $x_3$.'
  answer_label: 'Three iterations with fractions'
  check: {kind: evaluate, expression: '1 + 2/(1 + 2/(1 + 2/2))', answer: '2'}
  answer_text: '$x_1=2$, $x_2=2$, and $x_3=2$.'

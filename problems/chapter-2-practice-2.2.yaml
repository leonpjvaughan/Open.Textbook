chapter: 2
symbols: {}
problems:
  - id: c2-22-prime-factor-72
    section: '2.2'
    tier: F
    dfe: [N4]
    statement: 'Write $72$ as a product of prime factors.'
    answer_label: "Prime factors of 72"
    check: {kind: evaluate, expression: "2^3*3^2", answer: "72"}
    steps: [{expr: "72"}, {expr: "2*36"}, {expr: "2*2*18"}, {expr: "2*2*2*9"}, {expr: "2^3*3^2"}]
    answer_text: '$72=2^3\\times3^2$'
  - id: c2-22-prime-factor-90
    section: '2.2'
    tier: F
    dfe: [N4]
    statement: 'Write $90$ as a product of prime factors.'
    answer_label: "Prime factors of 90"
    check: {kind: evaluate, expression: "2*3^2*5", answer: "90"}
    answer_text: '$90=2\\times3^2\\times5$'
  - id: c2-22-hcf-24-40
    section: '2.2'
    tier: F
    dfe: [N4]
    statement: 'Find the HCF of $24$ and $40$.'
    answer_label: "HCF of 24 and 40"
    check: {kind: all, checks: [{kind: evaluate, expression: "24/8", answer: "3"}, {kind: evaluate, expression: "40/8", answer: "5"}, {kind: evaluate, expression: "24/16", answer: "3/2"}]}
    answer_text: '$24=2^3\\times3$ and $40=2^3\\times5$, so the HCF is $2^3=8$.'
  - id: c2-22-lcm-15-20
    section: '2.2'
    tier: F
    dfe: [N4]
    statement: 'Find the LCM of $15$ and $20$.'
    answer_label: "LCM of 15 and 20"
    check: {kind: all, checks: [{kind: evaluate, expression: "60/15", answer: "4"}, {kind: evaluate, expression: "60/20", answer: "3"}]}
    answer_text: '$15=3\\times5$ and $20=2^2\\times5$, so the LCM is $2^2\\times3\\times5=60$.'
  - id: c2-22-hcf-36-60
    section: '2.2'
    tier: F
    dfe: [N4]
    statement: 'Find the HCF of $36$ and $60$.'
    answer_label: "HCF of 36 and 60"
    check: {kind: all, checks: [{kind: evaluate, expression: "36/12", answer: "3"}, {kind: evaluate, expression: "60/12", answer: "5"}]}
    answer_text: '$36=2^2\\times3^2$ and $60=2^2\\times3\\times5$, so HCF $=2^2\\times3=12$.'
  - id: c2-22-lcm-8-18
    section: '2.2'
    tier: F
    dfe: [N4]
    statement: 'Find the LCM of $8$ and $18$.'
    answer_label: "LCM of 8 and 18"
    check: {kind: all, checks: [{kind: evaluate, expression: "72/8", answer: "9"}, {kind: evaluate, expression: "72/18", answer: "4"}]}
    answer_text: '$8=2^3$ and $18=2\\times3^2$, so LCM $=2^3\\times3^2=72$.'
  - id: c2-22-packs
    section: '2.2'
    tier: F
    dfe: [N4]
    statement: 'A teacher has $48$ pencils and $60$ pens. She makes the greatest possible number of identical sets, using all items. How many sets does she make?'
    answer_label: "Identical sets"
    check: {kind: all, checks: [{kind: evaluate, expression: "48/12", answer: "4"}, {kind: evaluate, expression: "60/12", answer: "5"}]}
    answer_text: 'The HCF of 48 and 60 is 12, so she makes 12 sets, each with 4 pencils and 5 pens.'
  - id: c2-22-events
    section: '2.2'
    tier: F
    dfe: [N4]
    statement: 'Two lights flash every $12$ seconds and every $18$ seconds. They flash together now. After how many seconds will they next flash together?'
    answer_label: "Lights flashing together"
    check: {kind: all, checks: [{kind: evaluate, expression: "36/12", answer: "3"}, {kind: evaluate, expression: "36/18", answer: "2"}]}
    answer_text: 'Use the LCM: $36$ seconds.'
  - id: c2-22-prime-factor-150
    section: '2.2'
    tier: F
    dfe: [N4]
    statement: 'Write $150$ as a product of prime factors, then use it to find the HCF of $150$ and $210$.'
    answer_label: "Prime factors and HCF"
    check: {kind: all, checks: [{kind: evaluate, expression: "2*3*5^2", answer: "150"}, {kind: evaluate, expression: "150/30", answer: "5"}, {kind: evaluate, expression: "210/30", answer: "7"}]}
    answer_text: '$150=2\\times3\\times5^2$ and $210=2\\times3\\times5\\times7$, so the HCF is $2\\times3\\times5=30$.'

# Practice set for 24.5. Questions and answers render from these verified records.
chapter: 24
problems:
  - id: ch24-24-5-monthly-rise
    section: "24.5"
    tier: F
    dfe: [S2]
    statement: 'A value rises from 14 in April to 19 in May. Find the increase.'
    answer_label: 'A value rises from 14 in April to 19 in May. Find the increase.'
    check:
      kind: evaluate
      expression: '19-14'
      answer: '5'
    answer_text: 'Increase $=5$.'

  - id: ch24-24-5-monthly-fall
    section: "24.5"
    tier: F
    dfe: [S2]
    statement: 'A temperature falls from 17°C to 12°C. Find the change.'
    answer_label: 'A temperature falls from 17°C to 12°C. Find the change.'
    check:
      kind: evaluate
      expression: '12-17'
      answer: '-5'
    answer_text: 'The change is $-5^\circ$C, a fall of 5°C.'

  - id: ch24-24-5-time-order
    section: "24.5"
    tier: F
    dfe: [S2]
    statement: 'Put these dates in time order: June, April, May.'
    answer_label: 'Put these dates in time order: June, April, May.'
    check:
      kind: evaluate
      expression: '1+2'
      answer: '3'
    answer_text: 'April, May, June.'

  - id: ch24-24-5-line-graph-total-change
    section: "24.5"
    tier: F
    dfe: [S2]
    statement: 'Weekly totals are 21, 18, 24. Find the overall change from week 1 to week 3.'
    answer_label: 'Weekly totals are 21, 18, 24. Find the overall change from week 1 to week 3.'
    check:
      kind: evaluate
      expression: '24-21'
      answer: '3'
    answer_text: 'Overall increase $=3$.'

  - id: ch24-24-5-stable-time-series
    section: "24.5"
    tier: F
    dfe: [S2]
    statement: 'A count is 9, 9, 9 across three months. Describe the trend.'
    answer_label: 'A count is 9, 9, 9 across three months. Describe the trend.'
    check:
      kind: evaluate
      expression: '9-9'
      answer: '0'
    answer_text: 'The count stays constant.'

  - id: ch24-24-5-line-graph-next
    section: "24.5"
    tier: F
    dfe: [S2]
    statement: 'A value is 6, 10, 8 across three days. Describe the changes.'
    answer_label: 'A value is 6, 10, 8 across three days. Describe the changes.'
    check:
      kind: evaluate
      expression: '(10-6)+(8-10)'
      answer: '2'
    answer_text: 'It rises by 4, then falls by 2.'

  - id: ch24-24-5-time-series-difference
    section: "24.5"
    tier: F
    dfe: [S2]
    statement: 'Rainfall is 3 mm then 11 mm. Find the increase.'
    answer_label: 'Rainfall is 3 mm then 11 mm. Find the increase.'
    check:
      kind: evaluate
      expression: '11-3'
      answer: '8'
    answer_text: 'Increase $=8$ mm.'

  - id: ch24-24-5-time-series-mean
    section: "24.5"
    tier: F
    dfe: [S2]
    statement: 'Daily values are 2, 4, 6. Find their mean.'
    answer_label: 'Daily values are 2, 4, 6. Find their mean.'
    check:
      kind: statistic
      data: [2, 4, 6]
      stat: 'mean'
      answer: '4'
    answer_text: 'Mean $=4$.'

  - id: ch24-24-5-compare-change
    section: "24.5"
    tier: F
    dfe: [S2]
    statement: 'Series A changes 10 to 13; series B changes 8 to 12. Which rises more?'
    answer_label: 'Series A changes 10 to 13; series B changes 8 to 12. Which rises more?'
    check:
      kind: compare
      relation: '>'
      lhs: '4'
      rhs: '3'
    answer_text: 'Series B rises by 4; series A rises by 3.'

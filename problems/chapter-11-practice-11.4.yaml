chapter: 11
problems:
- id: p1-parallel
  section: '11.4'
  tier: H
  dfe: &id001
  - A9
  statement: Give the gradient of a line parallel to $y=3x+2$.
  answer_label: Question 1
  check:
    kind: evaluate
    expression: '3'
    answer: '3'
  answer_text: '3'
- id: p2-perpendicular
  section: '11.4'
  tier: H
  dfe: *id001
  statement: Give the gradient of a line perpendicular to $y=2x-1$.
  answer_label: Question 2
  check:
    kind: evaluate
    expression: -1/2
    answer: -1/2
  answer_text: -1/2
- id: p3-parallel-equation
  section: '11.4'
  tier: H
  dfe: *id001
  statement: Find the equation parallel to $y=4x+1$ through $(0,-3)$.
  answer_label: Question 3
  check:
    kind: evaluate
    expression: 4*0-3
    answer: '-3'
  answer_text: $y=4x-3$
- id: p4-perp-equation
  section: '11.4'
  tier: H
  dfe: *id001
  statement: Find the equation perpendicular to $y=x+2$ through $(0,5)$.
  answer_label: Question 4
  check:
    kind: evaluate
    expression: -1*0+5
    answer: '5'
  answer_text: $y=-x+5$
- id: p5-check-parallel
  section: '11.4'
  tier: H
  dfe: *id001
  statement: Are $y=2x+1$ and $y=2x-7$ parallel? Give a reason.
  answer_label: Question 5
  check:
    kind: compare
    relation: '='
    lhs: '2'
    rhs: '2'
  answer_text: Yes; equal gradients
- id: p6-check-perp
  section: '11.4'
  tier: H
  dfe: *id001
  statement: Are gradients $-3$ and $1/3$ perpendicular? Give a reason.
  answer_label: Question 6
  check:
    kind: evaluate
    expression: -3*(1/3)
    answer: '-1'
  answer_text: Yes; product is -1
- id: p7-through-point
  section: '11.4'
  tier: H
  dfe: *id001
  statement: Find the line perpendicular to $y=0.5x+3$ through $(2,1)$.
  answer_label: Question 7
  check:
    kind: evaluate
    expression: -2*2+5
    answer: '1'
  answer_text: $y=-2x+5$
- id: p8-find-intercept
  section: '11.4'
  tier: H
  dfe: *id001
  statement: A line parallel to $y=-2x+1$ passes through $(3,4)$. Find its equation.
  answer_label: Question 8
  check:
    kind: evaluate
    expression: -2*3+10
    answer: '4'
  answer_text: $y=-2x+10$
- id: p9-mix
  section: '11.4'
  tier: H
  dfe: *id001
  statement: Find the gradient between $(0,1)$ and $(2,5)$. Is a line of gradient -2 perpendicular to it?
  answer_label: Question 9
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: (5-1)/(2-0)
      answer: '2'
    - kind: compare
      relation: <
      lhs: '2'
      rhs: 5/2
  answer_text: 2; yes
- id: p10-interleave
  section: '11.4'
  tier: H
  dfe: *id001
  statement: Solve $2x+3=11$, then state the gradient of a parallel line to $y=2x-9$.
  answer_label: Question 10
  check:
    kind: all
    checks:
    - kind: solve
      equation: 2*x+3=11
      variable: x
      answer: '4'
    - kind: evaluate
      expression: '2'
      answer: '2'
  answer_text: x=4; gradient 2
- id: p11-higher
  section: '11.4'
  tier: H
  dfe: *id001
  statement: Find equations of both lines through $(1,2)$ parallel and perpendicular to $y=3x-1$.
  answer_label: Question 11
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 3*1-1
      answer: '2'
    - kind: evaluate
      expression: (-1/3)*1+7/3
      answer: '2'
  answer_text: $y=3x-1$ and $y=-x/3+7/3$
symbols:
  x:
    real: true

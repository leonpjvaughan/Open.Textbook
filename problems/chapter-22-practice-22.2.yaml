chapter: 22
problems:
  - id: ch22-222-add
    section: '22.2'
    tier: H
    dfe: [G25]
    statement: 'Work out $\begin{pmatrix}4\\-3\end{pmatrix}+\begin{pmatrix}-2\\5\end{pmatrix}$.'
    answer_label: 'Vector sum'
    check: {kind: all, checks: [{kind: evaluate, expression: '4 + (-2)', answer: '2'}, {kind: evaluate, expression: '-3 + 5', answer: '2'}]}
    answer_text: '$\begin{pmatrix}2\\2\end{pmatrix}$.'
  - id: ch22-222-subtract
    section: '22.2'
    tier: H
    dfe: [G25]
    statement: 'Work out $\begin{pmatrix}7\\2\end{pmatrix}-\begin{pmatrix}3\\-4\end{pmatrix}$.'
    answer_label: 'Vector difference'
    check: {kind: all, checks: [{kind: evaluate, expression: '7 - 3', answer: '4'}, {kind: evaluate, expression: '2 - (-4)', answer: '6'}]}
    answer_text: '$\begin{pmatrix}4\\6\end{pmatrix}$.'
  - id: ch22-222-scalar
    section: '22.2'
    tier: H
    dfe: [G25]
    statement: 'Work out $-3\begin{pmatrix}2\\-5\end{pmatrix}$.'
    answer_label: 'Scaled vector'
    check: {kind: all, checks: [{kind: evaluate, expression: '-3 * 2', answer: '-6'}, {kind: evaluate, expression: '-3 * (-5)', answer: '15'}]}
    answer_text: '$\begin{pmatrix}-6\\15\end{pmatrix}$.'
  - id: ch22-222-combined
    section: '22.2'
    tier: H
    dfe: [G25]
    statement: 'Work out $2\begin{pmatrix}1\\-3\end{pmatrix}+\begin{pmatrix}-5\\4\end{pmatrix}$.'
    answer_label: 'Combined vector'
    check: {kind: all, checks: [{kind: evaluate, expression: '2 * 1 + (-5)', answer: '-3'}, {kind: evaluate, expression: '2 * (-3) + 4', answer: '-2'}]}
    answer_text: '$\begin{pmatrix}-3\\-2\end{pmatrix}$.'
  - id: ch22-222-scale-difference
    section: '22.2'
    tier: H
    dfe: [G25]
    statement: 'Work out $3\begin{pmatrix}-2\\4\end{pmatrix}-2\begin{pmatrix}1\\-3\end{pmatrix}$.'
    answer_label: 'Vector expression'
    check: {kind: all, checks: [{kind: evaluate, expression: '3 * (-2) - 2 * 1', answer: '-8'}, {kind: evaluate, expression: '3 * 4 - 2 * (-3)', answer: '18'}]}
    answer_text: '$\begin{pmatrix}-8\\18\end{pmatrix}$.'
  - id: ch22-222-route
    section: '22.2'
    tier: H
    dfe: [G25]
    statement: 'A route has vector $\begin{pmatrix}-4\\2\end{pmatrix}$, followed by $\begin{pmatrix}7\\-6\end{pmatrix}$. Find the total vector.'
    answer_label: 'Total vector'
    check: {kind: all, checks: [{kind: evaluate, expression: '-4 + 7', answer: '3'}, {kind: evaluate, expression: '2 + (-6)', answer: '-4'}]}
    answer_text: '$\begin{pmatrix}3\\-4\end{pmatrix}$.'
  - id: ch22-222-reverse
    section: '22.2'
    tier: H
    dfe: [G25]
    statement: 'Find the vector opposite to $\begin{pmatrix}-5\\3\end{pmatrix}$.'
    answer_label: 'Opposite vector'
    check: {kind: all, checks: [{kind: evaluate, expression: '-(-5)', answer: '5'}, {kind: evaluate, expression: '-3', answer: '-3'}]}
    answer_text: '$\begin{pmatrix}5\\-3\end{pmatrix}$.'
  - id: ch22-222-higher-expression
    section: '22.2'
    tier: H
    dfe: [G25]
    statement: 'Given $\mathbf{a}=\begin{pmatrix}2\\-1\end{pmatrix}$ and $\mathbf{b}=\begin{pmatrix}-3\\4\end{pmatrix}$, work out $2\mathbf{a}-3\mathbf{b}$.'
    answer_label: 'Expression value'
    check: {kind: all, checks: [{kind: evaluate, expression: '2 * 2 - 3 * (-3)', answer: '13'}, {kind: evaluate, expression: '2 * (-1) - 3 * 4', answer: '-14'}]}
    answer_text: '$\begin{pmatrix}13\\-14\end{pmatrix}$.'

chapter: 16
problems:
- id: proof-co
  section: '16.5'
  tier: H
  dfe:
  - G6
  statement: Parallel lines give one angle of $64^\circ$. Find and justify the co-interior angle.
  answer_label: Parallel lines give one angle of $64^\circ$. Find and justify the co-interior an
  check:
    kind: evaluate
    expression: 180-64
    answer: '116'
  answer_text: $116^\circ$; co-interior angles sum to $180^\circ$.
- id: proof-triangle
  section: '16.5'
  tier: H
  dfe:
  - G6
  statement: A triangle has angles $52^\circ$, $x^\circ$ and $(x+20)^\circ$. Find $x$, showing the angle fact.
  answer_label: A triangle has angles $52^\circ$, $x^\circ$ and $(x+20)^\circ$. Find $x$, showin
  check:
    kind: solve
    equation: 52+x+(x+20)-180=0
    variable: x
    answer:
    - '54'
  answer_text: $x=54^\circ$; triangle angles sum to $180^\circ$.
- id: proof-quad
  section: '16.5'
  tier: H
  dfe:
  - G6
  statement: Three quadrilateral angles are $88^\circ$, $94^\circ$ and $101^\circ$. Find the fourth and give a reason.
  answer_label: 'Three quadrilateral angles are $88^\circ$, $94^\circ$ and $101^\circ$. Find the '
  check:
    kind: evaluate
    expression: 360-88-94-101
    answer: '77'
  answer_text: $77^\circ$; quadrilateral angles sum to $360^\circ$.
- id: proof-vertical
  section: '16.5'
  tier: H
  dfe:
  - G6
  statement: Two lines cross. One angle is $x+18$ degrees and its opposite is $3x-22$ degrees. Find $x$.
  answer_label: Two lines cross. One angle is $x+18$ degrees and its opposite is $3x-22$ degrees
  check:
    kind: solve
    equation: x+18-(3*x-22)=0
    variable: x
    answer:
    - '20'
  answer_text: $x=20$; vertically opposite angles are equal.
- id: proof-exterior
  section: '16.5'
  tier: H
  dfe:
  - G6
  statement: A triangle has opposite interior angles $x^\circ$ and $(x+30)^\circ$. Its exterior angle is $130^\circ$. Find
    $x$.
  answer_label: A triangle has opposite interior angles $x^\circ$ and $(x+30)^\circ$. Its exteri
  check:
    kind: solve
    equation: x+(x+30)-130=0
    variable: x
    answer:
    - '50'
  answer_text: $x=50$; the exterior angle equals the sum of the opposite interior angles.
- id: proof-poly
  section: '16.5'
  tier: H
  dfe:
  - G6
  statement: A regular polygon has exterior angle $24^\circ$. Find its number of sides and explain the angle sum used.
  answer_label: A regular polygon has exterior angle $24^\circ$. Find its number of sides and ex
  check:
    kind: evaluate
    expression: 360/24
    answer: '15'
  answer_text: 15 sides; exterior angles total $360^\circ$.
- id: mixed-polygon
  section: '16.5'
  tier: H
  dfe:
  - G6
  statement: Find each interior angle of a regular decagon.
  answer_label: Find each interior angle of a regular decagon.
  check:
    kind: evaluate
    expression: (10-2)*180/10
    answer: '144'
  answer_text: $144^\circ$; use $(n-2)180^\circ$ then divide by $n$.
- id: higher-two-step
  section: '16.5'
  tier: H
  dfe:
  - G6
  statement: A triangle sits on a straight line. Its base angles are $x^\circ$ and $(x+20)^\circ$; its exterior angle is $130^\circ$.
    Find all three interior angles.
  answer_label: A triangle sits on a straight line. Its base angles are $x^\circ$ and $(x+20)^\c
  check:
    kind: solve
    equation: x+(x+20)-130=0
    variable: x
    answer:
    - '55'
  answer_text: $x=55$; base angles are $55^\circ$ and $75^\circ$, and the third is $50^\circ$.
symbols:
  x:
    real: true
  n:
    real: true

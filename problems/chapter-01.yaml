# Problem bank — Chapter 1 (Number skills).
#
# One problem per record. `statement` is what the reader sees; `expression` /
# `equation` are the CAS-parseable form used only for verification, so units
# (`£`, `p`) and words stay in `statement`. See PROBLEMS.md.
chapter: 1
problems:
  - id: ch1-add-decimals
    section: "1.2"
    tier: F
    dfe: [N2]
    statement: 'Work out $78 + 14.8$.'
    check: {kind: evaluate, expression: "78 + 14.8", answer: "92.8"}
    steps:
      - expr: "78 + 14.8"
      - expr: "92.8"

  - id: ch1-multiply-decimals
    section: "1.2"
    tier: F
    dfe: [N2]
    statement: 'Work out $3.7 \times 4$.'
    check: {kind: evaluate, expression: "3.7 * 4", answer: "14.8"}
    steps:
      - expr: "3.7 * 4"
      - expr: "14.8"

  - id: ch1-multiply-negatives
    section: "1.3"
    tier: F
    dfe: [N2]
    statement: 'Work out $(-6) \times (-4)$.'
    check: {kind: evaluate, expression: "(-6) * (-4)", answer: "24"}
    steps:
      - expr: "(-6) * (-4)"
      - expr: "24"

  - id: ch1-order-of-operations
    section: "1.4"
    tier: F
    dfe: [N3]
    statement: 'Work out $3 + 2 \times 4$.'
    check: {kind: evaluate, expression: "3 + 2 * 4", answer: "11"}
    steps:
      - expr: "3 + 2 * 4"
      - expr: "3 + 8"
      - expr: "11"

  - id: ch1-anchor-profit
    section: "Review"
    tier: F
    dfe: [N2, N3]
    statement: 'The stall took $95 \\times £1.20 + 6 \\times £3.00$ and spent $120 \\times £0.65 + 8 \\times £1.85$. Work out the profit.'
    check:
      kind: evaluate
      expression: "95 * 1.20 + 6 * 3.00 - (120 * 0.65 + 8 * 1.85)"
      answer: "39.20"
    steps:
      - expr: "95 * 1.20 + 6 * 3.00 - (120 * 0.65 + 8 * 1.85)"
      - expr: "132 - 92.8"
      - expr: "39.2"

  - id: ch1-order-decimals
    section: "1.1"
    tier: F
    dfe: [N1]
    statement: 'Is $0.09$ less than $0.35$?'
    check: {kind: compare, relation: "<", lhs: "0.09", rhs: "0.35"}

  - id: ch1-order-negatives
    section: "1.3"
    tier: F
    dfe: [N1]
    statement: 'Is $-7$ less than $-2$?'
    check: {kind: compare, relation: "<", lhs: "-7", rhs: "-2"}

# Practice set for 5.1 (strand S3, the physical world). Every answer is a
# quantity, so the checks come from the `units` oracle: `dimensions` proves the
# arithmetic *and* the unit together, and a value built on a surd declares a
# tolerance because it is irrational. The `structured` records prove only that a
# model answer contains the declared ideas, in order — not that the physics is
# right.
#
# Honest limit: this proves the arithmetic and the dimensions, not the physics.
# A dimensionally consistent, arithmetically correct, physically absurd answer
# would pass.
chapter: 5
problems:
  - id: am5-1-normal-horizontal-12kg
    section: '5.1'
    tier: O
    refs: [S3]
    statement: >-
      A box of mass $12$ kg rests on a horizontal floor. Taking
      $g = 9.8$ m/s$^2$, calculate the normal reaction from the floor.
    answer_label: Normal reaction
    check:
      kind: dimensions
      expression: m * g
      values:
        m: {value: '12', unit: kg}
        g: {value: '9.8', unit: 'm/s^2'}
      answer: {value: '117.6', unit: N}
    answer_text: >-
      The box does not move vertically, so the vertical forces balance. The
      normal reaction equals the weight: $R = mg = 12 \times 9.8 = 117.6$ N.

  - id: am5-1-normal-slope-30-8kg
    section: '5.1'
    tier: O
    refs: [S3]
    statement: >-
      A block of mass $8$ kg rests on a rough plane inclined at $30^\circ$ to
      the horizontal. Taking $g = 9.8$ m/s$^2$, calculate the normal reaction,
      to $4$ significant figures.
    answer_label: Normal reaction
    check:
      kind: dimensions
      expression: m * g * sqrt(3) / 2
      values:
        m: {value: '8', unit: kg}
        g: {value: '9.8', unit: 'm/s^2'}
      answer: {value: '67.90', unit: N}
      tolerance: '0.01'
    answer_text: >-
      The block does not move perpendicular to the plane, so the forces in that
      direction balance. The component of the weight into the plane is
      $mg\cos 30^\circ$, so $R = 8 \times 9.8 \times 0.8660 = 67.90$ N. The
      normal reaction is smaller than the weight of $78.4$ N, because the plane
      is tilted.

  - id: am5-1-friction-holds-on-slope
    section: '5.1'
    tier: O
    refs: [S3]
    statement: >-
      A block of mass $10$ kg rests on a rough plane inclined at $30^\circ$ to
      the horizontal. A force of $30$ N acts on it up the plane, parallel to the
      surface, and the block stays at rest. Taking $g = 9.8$ m/s$^2$, calculate
      the friction force on the block.
    answer_label: Friction force
    check:
      kind: dimensions
      expression: m * g / 2 - P
      values:
        m: {value: '10', unit: kg}
        g: {value: '9.8', unit: 'm/s^2'}
        P: {value: '30', unit: N}
      answer: {value: '19', unit: N}
    answer_text: >-
      The component of the weight down the plane is
      $mg\sin 30^\circ = 10 \times 9.8 \times 0.5 = 49$ N. The block is at rest,
      so the forces along the plane balance. The $30$ N force acts up the plane,
      so friction must supply the other $49 - 30 = 19$ N up the plane. Friction
      is not at its maximum here; it takes only the value needed to prevent
      sliding.

  - id: am5-1-friction-direction
    section: '5.1'
    tier: O
    refs: [S3]
    statement: >-
      A block slides down a rough plane. State the direction of the friction
      force on the block, and explain why it acts in that direction.
    answer_label: Direction of friction
    check:
      kind: structured
      requires: [opposes-motion, along-surface]
      concepts: [friction]
      points:
        - id: opposes-motion
          text: friction acts up the plane, against the direction of sliding
          concepts: [friction]
        - id: along-surface
          text: >-
            friction acts along the surface, so it is parallel to the plane and
            never perpendicular to it
    answer_text: >-
      The friction force acts up the plane, opposite to the motion. Friction
      always opposes the relative sliding of the two surfaces. It acts along the
      surface, parallel to the plane, so it has no effect on the normal
      reaction.

  - id: am5-1-normal-slope-45-20kg
    section: '5.1'
    tier: O
    refs: [S3]
    statement: >-
      A crate of mass $20$ kg rests on a rough plane inclined at $45^\circ$ to
      the horizontal. Taking $g = 9.8$ m/s$^2$, calculate the normal reaction,
      to $5$ significant figures.
    answer_label: Normal reaction
    check:
      kind: dimensions
      expression: m * g * sqrt(2) / 2
      values:
        m: {value: '20', unit: kg}
        g: {value: '9.8', unit: 'm/s^2'}
      answer: {value: '138.59', unit: N}
      tolerance: '0.01'
    answer_text: >-
      $R = mg\cos 45^\circ = 20 \times 9.8 \times 0.70711 = 138.59$ N. The
      normal reaction is smaller than the weight of $196$ N. On a steeper plane,
      less of the weight presses into the surface.

  - id: am5-1-normal-extra-perpendicular
    section: '5.1'
    tier: O
    refs: [S3]
    statement: >-
      A block of mass $5$ kg rests on a rough plane inclined at $30^\circ$ to
      the horizontal. A force of $15$ N acts on the block perpendicular to the
      plane, pressing it into the surface. Taking $g = 9.8$ m/s$^2$, calculate
      the normal reaction, to $4$ significant figures.
    answer_label: Normal reaction
    check:
      kind: dimensions
      expression: m * g * sqrt(3) / 2 + P
      values:
        m: {value: '5', unit: kg}
        g: {value: '9.8', unit: 'm/s^2'}
        P: {value: '15', unit: N}
      answer: {value: '57.44', unit: N}
      tolerance: '0.01'
    answer_text: >-
      Two forces press the block into the plane: the component of its weight,
      $mg\cos 30^\circ = 5 \times 9.8 \times 0.8660 = 42.44$ N, and the extra
      $15$ N. The normal reaction balances both, so
      $R = 42.44 + 15 = 57.44$ N. An extra force into the surface always
      increases the normal reaction.

  - id: am5-1-normal-less-than-weight
    section: '5.1'
    tier: O
    refs: [S3]
    statement: >-
      A packing case of mass $30$ kg rests on a horizontal floor. A rope pulls
      it with a force of $100$ N at $30^\circ$ above the horizontal. Taking
      $g = 9.8$ m/s$^2$, calculate the normal reaction from the floor.
    answer_label: Normal reaction
    check:
      kind: dimensions
      expression: m * g - P / 2
      values:
        m: {value: '30', unit: kg}
        g: {value: '9.8', unit: 'm/s^2'}
        P: {value: '100', unit: N}
      answer: {value: '244', unit: N}
    answer_text: >-
      The case does not move vertically, so the vertical forces balance. The
      upward part of the rope is $100\sin 30^\circ = 50$ N. The normal reaction
      and this upward part together balance the weight, so
      $R = 30 \times 9.8 - 50 = 294 - 50 = 244$ N. The normal reaction is less
      than the weight, because part of the weight is carried by the rope.

  - id: am5-1-friction-not-always-max
    section: '5.1'
    tier: O
    refs: [S3]
    statement: >-
      A box rests on a rough horizontal floor. A small push does not move it.
      Explain why the friction force is not always equal to its maximum value.
    answer_label: Why friction varies
    check:
      kind: structured
      requires: [balances-push, up-to-limit]
      concepts: [friction]
      points:
        - id: balances-push
          text: >-
            while the box stays at rest, friction takes exactly the value needed
            to balance the push
          concepts: [friction]
        - id: up-to-limit
          text: >-
            friction can only reach a maximum value, and the box starts to slide
            once the push exceeds it
    answer_text: >-
      Friction is a response to a push, not a fixed force. While the box stays
      at rest, friction grows to match the push exactly, so the forces balance.
      It can only grow so far: there is a maximum value that the two surfaces
      can provide. Once the push is larger than that maximum, the forces no
      longer balance and the box starts to slide.

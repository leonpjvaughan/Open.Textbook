# Practice set for 3.4 (strand S3, the physical world). Differentiation is an
# operation, not an equivalence, so every derivative step is `relation: apply`
# with op: diff. The `solve` check proves the time at which a velocity is zero,
# and the `structured` record proves only that a model answer states the chain
# rule in the declared order.
chapter: 3
symbols:
  t: {real: true}
problems:
  - id: am3-4-diff-polynomial
    section: '3.4'
    tier: O
    refs: [S3]
    statement: >-
      The displacement of a particle is $s = 4t^2 + 3t$, where $s$ is in metres
      and $t$ in seconds. Differentiate to find its velocity.
    answer_label: Velocity
    check:
      kind: apply
      expression: "4*t**2 + 3*t"
      apply: {op: diff, args: [t]}
      answer: "8*t + 3"
    answer_text: >-
      Differentiate term by term. The derivative of $4t^2$ is $8t$, and the
      derivative of $3t$ is $3$. So $v = \dfrac{ds}{dt} = 8t + 3$ m/s.

  - id: am3-4-chain-cube
    section: '3.4'
    tier: O
    refs: [S3]
    statement: >-
      Differentiate $s = (2t + 1)^3$ with respect to $t$.
    answer_label: The derivative
    check:
      kind: apply
      expression: "(2*t + 1)**3"
      apply: {op: diff, args: [t]}
      answer: "6*(2*t + 1)**2"
    answer_text: >-
      Use the chain rule. The outer function is a cube, whose derivative is
      $3(2t + 1)^2$. The inner function is $2t + 1$, whose derivative is $2$.
      Multiply them: $3(2t + 1)^2 \times 2 = 6(2t + 1)^2$.

  - id: am3-4-chain-fourth
    section: '3.4'
    tier: O
    refs: [S3]
    statement: >-
      Differentiate $s = (3t - 2)^4$ with respect to $t$.
    answer_label: The derivative
    check:
      kind: apply
      expression: "(3*t - 2)**4"
      apply: {op: diff, args: [t]}
      answer: "12*(3*t - 2)**3"
    answer_text: >-
      The outer derivative is $4(3t - 2)^3$ and the inner derivative is $3$.
      Their product is $4(3t - 2)^3 \times 3 = 12(3t - 2)^3$.

  - id: am3-4-chain-composite
    section: '3.4'
    tier: O
    refs: [S3]
    statement: >-
      Differentiate $s = (t^2 + 1)^3$ with respect to $t$.
    answer_label: The derivative
    check:
      kind: apply
      expression: "(t**2 + 1)**3"
      apply: {op: diff, args: [t]}
      answer: "6*t*(t**2 + 1)**2"
    answer_text: >-
      The outer derivative is $3(t^2 + 1)^2$ and the inner derivative is $2t$.
      Multiplying gives $3(t^2 + 1)^2 \times 2t = 6t(t^2 + 1)^2$.

  - id: am3-4-chain-root
    section: '3.4'
    tier: O
    refs: [S3]
    statement: >-
      Differentiate $s = \sqrt{4t + 1}$ with respect to $t$.
    answer_label: The derivative
    check:
      kind: apply
      expression: "sqrt(4*t + 1)"
      apply: {op: diff, args: [t]}
      answer: "2/sqrt(4*t + 1)"
    answer_text: >-
      Write $s = (4t + 1)^{1/2}$. The outer derivative is
      $\frac{1}{2}(4t + 1)^{-1/2}$ and the inner derivative is $4$. Their
      product is $\frac{1}{2} \times 4 \times (4t + 1)^{-1/2} =
      \dfrac{2}{\sqrt{4t + 1}}$.

  - id: am3-4-velocity-zero
    section: '3.4'
    tier: O
    refs: [S3]
    statement: >-
      A ball is kicked upwards. Its height is $y = 10t - 4.9t^2$ metres after
      $t$ seconds. Differentiate to find its vertical velocity, then find the
      time at which that velocity is zero.
    answer_label: Vertical velocity, then the time
    check:
      kind: all
      checks:
        - kind: apply
          expression: "10*t - 4.9*t**2"
          apply: {op: diff, args: [t]}
          answer: "10 - 9.8*t"
        - kind: solve
          equation: "10 - 9.8*t = 0"
          variable: t
          answer: ['50/49']
    answer_text: >-
      Differentiating gives $v = \dfrac{dy}{dt} = 10 - 9.8t$. Set the velocity
      to zero: $10 - 9.8t = 0$, so $t = \dfrac{10}{9.8} = \dfrac{50}{49}$
      seconds, about $1.02$ s. At that moment the ball is at its highest point.

  - id: am3-4-gradient-at-point
    section: '3.4'
    tier: O
    refs: [S3]
    statement: >-
      A particle has displacement $s = t^3 - 6t^2 + 9t$. Find its velocity at
      $t = 4$ s.
    answer_label: Velocity at t = 4
    check:
      kind: all
      checks:
        - kind: apply
          expression: "t**3 - 6*t**2 + 9*t"
          apply: {op: diff, args: [t]}
          answer: "3*t**2 - 12*t + 9"
        - kind: evaluate
          expression: "3*4**2 - 12*4 + 9"
          answer: "9"
    answer_text: >-
      Differentiate: $v = 3t^2 - 12t + 9$. Substitute $t = 4$:
      $v = 3 \times 16 - 12 \times 4 + 9 = 48 - 48 + 9 = 9$ m/s. The velocity
      is positive, so the particle is moving in the positive direction.

  - id: am3-4-chain-rule
    section: '3.4'
    tier: O
    refs: [S3]
    statement: >-
      State the chain rule, and describe how you would use it to differentiate
      $s = (3t + 1)^2$.
    answer_label: The chain rule
    check:
      kind: structured
      requires: [state-rule, outer-inner, multiply]
      concepts: [chain-rule]
      points:
        - id: state-rule
          text: >-
            if $s$ depends on $u$ and $u$ depends on $t$, then
            $\dfrac{ds}{dt} = \dfrac{ds}{du} \times \dfrac{du}{dt}$
          concepts: [chain-rule]
        - id: outer-inner
          text: >-
            take $u = 3t + 1$ as the inner function, so $s = u^2$ is the outer
            function
          concepts: [chain-rule]
        - id: multiply
          text: >-
            differentiate each part to get $2u$ and $3$, then multiply:
            $6u = 6(3t + 1)$
          concepts: [chain-rule]
    answer_text: >-
      The chain rule says that if $s$ depends on $u$ and $u$ depends on $t$,
      then $\dfrac{ds}{dt} = \dfrac{ds}{du} \times \dfrac{du}{dt}$. For
      $s = (3t + 1)^2$, take the inner function $u = 3t + 1$, so the outer
      function is $s = u^2$. Then $\dfrac{ds}{du} = 2u$ and
      $\dfrac{du}{dt} = 3$. Multiplying gives $6u = 6(3t + 1)$.

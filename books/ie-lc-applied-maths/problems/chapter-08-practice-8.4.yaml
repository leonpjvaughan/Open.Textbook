# Practice set for 8.4 (strand S4, changing world). First-order difference
# equations: the fixed point, the closed form, and whether the sequence settles.
# A closed form is proved by `rsolve` with the initial value pinned; a fixed
# point is proved by solving the equation it satisfies. The `structured` record
# checks the presence and order of the ideas in a model answer, and nothing more.
chapter: 8
symbols:
  n: {integer: true}
  u: {real: true}
  L: {real: true}
  a: {real: true}
  b: {real: true}
problems:
  - id: am8-4-rsolve-three-two
    section: '8.4'
    tier: O
    refs: [S4]
    statement: >-
      Solve the difference equation $u_{n+1} = 3u_n + 2$ with $u_0 = 1$, giving
      $u_n$ in terms of $n$.
    answer_label: The closed form
    check:
      kind: apply
      expression: "u(n+1) = 3*u(n) + 2"
      apply: {op: rsolve, dependent: u, independent: n, initial: [[0, "1"]]}
      answer: "2*3**n - 1"
    answer_text: >-
      The fixed point solves $L = 3L + 2$, so $L = -1$. Then
      $u_n = (u_0 - L)3^n + L = 2 \times 3^n - 1$. Check: $u_0 = 1$ and
      $u_1 = 5$.

  - id: am8-4-rsolve-feedback
    section: '8.4'
    tier: O
    refs: [S4]
    statement: >-
      Solve the difference equation $u_{n+1} = 0.8u_n + 10$ with $u_0 = 0$,
      giving $u_n$ in terms of $n$.
    answer_label: The closed form
    check:
      kind: apply
      expression: "u(n+1) = 0.8*u(n) + 10"
      apply: {op: rsolve, dependent: u, independent: n, initial: [[0, "0"]]}
      answer: "50 - 50*(4/5)**n"
    answer_text: >-
      The fixed point solves $L = 0.8L + 10$, so $L = 50$. Then
      $u_n = 50 - 50(0.8)^n$. The sequence rises towards $50$ and never passes
      it.

  - id: am8-4-fixed-point
    section: '8.4'
    tier: O
    refs: [S4]
    statement: >-
      Find the fixed point of the difference equation $u_{n+1} = 0.6u_n + 12$,
      that is the value $L$ with $L = 0.6L + 12$.
    answer_label: The fixed point
    check:
      kind: solve
      equation: "L = 0.6*L + 12"
      variable: "L"
      answer: ["30"]
    answer_text: >-
      $L = 0.6L + 12$, so $0.4L = 12$ and $L = 30$. A sequence that starts at
      $30$ stays at $30$; any other start moves towards it because $0.6$ is
      between $-1$ and $1$.

  - id: am8-4-loan-iterate
    section: '8.4'
    tier: O
    refs: [S4]
    statement: >-
      A loan of €10\,000 is charged $1\%$ interest a month, and €300 is repaid at
      the end of each month. The balance satisfies $u_{n+1} = 1.01u_n - 300$ with
      $u_0 = 10\,000$. Find the balance after three months.
    answer_label: The balance after three months
    check:
      kind: apply
      expression: "1.01*u - 300"
      apply: {op: iterate, args: [10000, 3], variable: u}
      answer: "9393.98"
    answer_text: >-
      $u_1 = 9800$, $u_2 = 9598$, $u_3 = 9393.98$ euro. The interest each month
      is charged on the balance before the repayment.

  - id: am8-4-loan-rsolve
    section: '8.4'
    tier: O
    refs: [S4]
    statement: >-
      For the loan $u_{n+1} = 1.01u_n - 300$ with $u_0 = 10\,000$, find the
      closed form for $u_n$.
    answer_label: The closed form
    check:
      kind: apply
      expression: "u(n+1) = 1.01*u(n) - 300"
      apply: {op: rsolve, dependent: u, independent: n, initial: [[0, "10000"]]}
      answer: "30000 - 20000*1.01**n"
    answer_text: >-
      The fixed point solves $L = 1.01L - 300$, so $L = 30\,000$. Then
      $u_n = 30\,000 - 20\,000(1.01)^n$. The balance falls towards zero, but it
      reaches zero only when the repayment clears it.

  - id: am8-4-arithmetic
    section: '8.4'
    tier: O
    refs: [S4]
    statement: >-
      Solve the difference equation $u_{n+1} = u_n + 5$ with $u_0 = 2$, giving
      $u_n$ in terms of $n$.
    answer_label: The closed form
    check:
      kind: apply
      expression: "u(n+1) = u(n) + 5"
      apply: {op: rsolve, dependent: u, independent: n, initial: [[0, "2"]]}
      answer: "2 + 5*n"
    answer_text: >-
      Each step adds $5$, so after $n$ steps the value is $u_n = 2 + 5n$. This is
      an arithmetic sequence, and it has no fixed point because the graph of
      $y = x + 5$ never meets the line $y = x$.

  - id: am8-4-limit
    section: '8.4'
    tier: O
    refs: [S4]
    statement: >-
      For the difference equation $u_{n+1} = 0.9u_n + 20$, find the value that
      $u_n$ approaches as $n$ grows.
    answer_label: The limiting value
    check:
      kind: solve
      equation: "L = 0.9*L + 20"
      variable: "L"
      answer: ["200"]
    answer_text: >-
      At the limit $L = 0.9L + 20$, so $0.1L = 20$ and $L = 200$. Since $0.9$ is
      between $-1$ and $1$, the sequence approaches this value from any start.

  - id: am8-4-convergence
    section: '8.4'
    tier: O
    refs: [S4]
    statement: >-
      Explain when the sequence defined by $u_{n+1} = au_n + b$ settles to a
      fixed point, and when it does not.
    answer_label: When the sequence settles
    check:
      kind: structured
      requires: [fixed-point, condition, behaviour]
      concepts: [convergence]
      points:
        - {id: fixed-point, text: "The fixed point is $L = \\dfrac{b}{1 - a}$, found from $L = aL + b$.", concepts: [fixed-point]}
        - {id: condition, text: "The sequence settles when $-1 < a < 1$, because then $a^n$ tends to zero.", concepts: [convergence]}
        - {id: behaviour, text: "If $|a| > 1$ the sequence moves away from the fixed point and grows without limit."}
    answer_text: >-
      The fixed point is $L = \dfrac{b}{1 - a}$. The sequence settles to it when
      $-1 < a < 1$, because $a^n \to 0$. If $|a| > 1$ the sequence moves away
      from the fixed point instead.

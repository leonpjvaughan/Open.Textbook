# Leaving Certificate Applied Mathematics — the SEC Formulae and Tables booklet,
# mechanics sections.
#
# One national booklet, not a board's own sheet: the State Examinations Commission
# publishes it and the superintendent issues it to every candidate. The same document
# serves Mathematics, Physics, Chemistry and Applied Mathematics.
#
# **What is here, and what is not.** Applied Mathematics is examined with the whole
# booklet, but the strands it teaches — projectiles, pulleys, collisions, circular
# motion, oscillation, centres of gravity, moments of inertia — are the mechanics half.
# The heat, light, electricity and radioactivity sections are printed in the same booklet
# and are not transcribed here, because no page in this book is allowed to need them, and
# `textbook.verify` fails a record that plays an item this file does not hold.
#
# The physics half of the same document is `books/ie-lc-physics/booklet/`. The two are
# separate files because a book is self-contained: `scaffold` copies per book.
meta:
  title: Leaving Certificate Physics — formulae and tables
  year: state examinations
  note: The State Examinations Commission publishes one booklet for the state examinations, and it is
    the same for Foundation, Ordinary and Higher level. The superintendent issues it at the start of the
    examination and collects it at the end; a candidate may not bring their own copy. Everything printed
    here is therefore given to you, which is why every item is in the `given` group.
  provenance:
    sec: Foirmlí agus Táblaí / Formulae and Tables, approved for use in the state examinations. Coimisiún
      na Scrúduithe Stáit / State Examinations Commission, SEC567/14-V5-Dec2014, ISBN 978 1 4064 2862
      9.
  basis: The booklet is published by the Stationery Office for the State Examinations Commission and is
    issued to every candidate. The physics sections reproduced here are pages 47 to 63 of the booklet
    — the constants table, particle physics, mechanics, collisions, motion in a circle, centres of gravity,
    moments of inertia, rotating bodies, simple harmonic motion, energy and work, gravitation, forces
    and materials, heat and temperature, light and sound, geometric optics, electricity and radioactivity.
    The mathematics sections are pages 8 to 44 and are carried by the Mathematics book.
  boards:
    sec:
      name: SEC
      code: State Examinations Commission
  groups:
    given: Printed in the booklet issued to every candidate.

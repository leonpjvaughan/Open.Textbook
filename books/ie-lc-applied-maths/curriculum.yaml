# Leaving Certificate Applied Mathematics (Ireland) — chapter and section plan
#
# Source of truth for the docs scaffold and for per-chapter authoring briefs.
#
# Tier: O = Ordinary and Higher level; H = Higher level only.
# refs: the specification's own strand, S1–S4. The document is
#       Leaving-Certificate-Specification-Applied-Mathematics_EN.pdf (2019).
#
# WHY THE REFERENCES ARE COARSE. This specification does not number its learning
# outcomes or its topics. Each strand is set out as an unnumbered two-column table —
# "students learn about" against "students should be able to" — and the topics in
# the left column carry no identifier of any kind. Rather than invent numbers and
# present them as the document's, every section here references the strand it
# belongs to, which is the finest level the specification itself supports. The
# coverage check therefore verifies that all four strands are taught, and cannot
# verify anything finer. Recorded rather than papered over.
#
# Strand 1 is not content. It is the modelling process — formulate, translate,
# compute, evaluate, refine — and Strands 2–4 apply it. It is delivered by the
# chapter formula and by chapter 13, not as a strand of chapters.
#
# Assessment: written examination 80%, modelling project 20% on an annual SEC brief
# common to both levels with differentiated marking. 180 hours of class contact.
#
# See research/curriculum/ie-curriculum.md §5 and §7.4.

meta:
  title: Leaving Certificate Applied Mathematics
  jurisdiction: Ireland
  awarding_bodies: [SEC]
  tiers: [Ordinary, Higher]
  retrieved: 2026-10-13
  assessment: >-
    Assessment, measured off the SEC papers: ONE paper of 400 marks at both Higher
    and Ordinary. Ten questions at 50 marks each, answer any eight. The modelling
    project is worth 20% of the final mark and is set on an annual SEC brief.
    See research/curriculum/ie-curriculum.md section 8a.

  # Where this book is for, the word that jurisdiction uses for its levels, and who
  # publishes the curriculum it follows. Ireland calls its levels levels, not tiers.
  #
  # There is no `curriculum_licence`: the NCCA's re-use terms could not be read while
  # this book was planned (ncca.ie is behind a bot challenge), and a licence claim
  # that has not been verified must not be written. The About page says the material
  # belongs to the NCCA and is referred to rather than reproduced.
  level_word: level
  curriculum_body: National Council for Curriculum and Assessment (NCCA)
  # Who owns the specification and who examines it. In Ireland these are two
  # different bodies — the NCCA writes the specification, the SEC sets and marks the
  # examination — so this cannot be composed from the awarding bodies.
  specification_note: >-
    The specification content, and any wording taken from a specification, belongs
    to the National Council for Curriculum and Assessment, which publishes it. The
    State Examinations Commission sets and marks the examinations.
  note: >-
    The specification numbers its strands and nothing else, so `refs` names a strand
    and the coverage check reaches no finer than that.

# One group, because the specification numbers one thing: its strands. The label is
# prose rather than a strand id, because the four references are four different
# strands and a heading naming only one of them would be false.
coverage:
  - prefix: "S"
    strand: all four specification strands
    items: 4

strands:
  - id: modelling
    title: Mathematical Modelling
  - id: networks
    title: Modelling with Networks and Graphs
  - id: physical-world
    title: Modelling the Physical World
  - id: changing-world
    title: Modelling a Changing World

chapters:
  - id: 1
    title: What mathematical modelling is
    strand: modelling
    summary: >-
      The problem-solving cycle: formulating a problem, translating it into
      mathematics, computing a solution, evaluating it, and going round again.
    anchor:
      title: How long is the queue?
      brief: >-
        You will model a queue — how fast people arrive, how fast they are served —
        and predict how long the wait gets. By the end of the chapter you can say
        which assumption your answer depends on most.
    application: Every other chapter in this book, and the 20% modelling project.
    relevance_prompt: What queue or delay in your own week would you like to be able to predict?
    sections:
      - {id: "1.1", title: "The problem-solving cycle", tier: O, refs: ["S1"]}
      - {id: "1.2", title: "Formulating a problem and decomposing it", tier: O, refs: ["S1"]}
      - {id: "1.3", title: "Assumptions and what they cost you", tier: O, refs: ["S1"]}
      - {id: "1.4", title: "Translating a situation into mathematics", tier: O, refs: ["S1"]}
      - {id: "1.5", title: "Computing and interpreting a solution", tier: O, refs: ["S1"]}
      - {id: "1.6", title: "Evaluating, refining and reporting", tier: O, refs: ["S1"]}
      - {id: "1.7", title: "How to write a modelling report", tier: O, refs: ["S1"]}

  - id: 2
    title: Networks and graphs
    strand: networks
    summary: >-
      Networks as models of connection — vertices, edges, weights — and the graphs,
      matrices and algorithms used to reason about them.
    anchor:
      title: Wiring the new building
      brief: >-
        You will connect a set of rooms with the least total length of cable, then
        find the shortest route between two of them. By the end of the chapter you
        can say which algorithm answers which question.
    application: Transport, delivery routes, cabling, broadband and utility networks.
    relevance_prompt: Which journey you take, or which network reaches your area, is decided by a problem like this one.
    sections:
      - {id: "2.1", title: "Networks and their terminology", tier: O, refs: ["S2"]}
      - {id: "2.2", title: "Connected, disconnected, directed and undirected graphs", tier: O, refs: ["S2"]}
      - {id: "2.3", title: "Representing a network: adjacency matrices", tier: O, refs: ["S2"]}
      - {id: "2.4", title: "Matrix algebra and the product of adjacency matrices", tier: O, refs: ["S2"]}
      - {id: "2.5", title: "Trees and spanning trees", tier: O, refs: ["S2"]}
      - {id: "2.6", title: "Minimum spanning trees: Kruskal's algorithm", tier: O, refs: ["S2"]}
      - {id: "2.7", title: "Minimum spanning trees: Prim's algorithm", tier: O, refs: ["S2"]}
      - {id: "2.8", title: "Shortest paths and Dijkstra's algorithm", tier: O, refs: ["S2"]}
      - {id: "2.9", title: "Multi-stage problems and dynamic programming", tier: O, refs: ["S2"]}
      - {id: "2.10", title: "Bellman's principle of optimality", tier: O, refs: ["S2"]}
      - {id: "2.11", title: "Comparing the algorithms and choosing one", tier: H, refs: ["S2"]}

  - id: 3
    title: Describing motion
    strand: physical-world
    summary: Kinematics in one dimension, the calculus that generalises it, and projectile motion.
    sections:
      - {id: "3.1", title: "Displacement, velocity and acceleration", tier: O, refs: ["S3"]}
      - {id: "3.2", title: "Motion with constant acceleration", tier: O, refs: ["S3"]}
      - {id: "3.3", title: "Motion graphs", tier: O, refs: ["S3"]}
      - {id: "3.4", title: "Differentiation and the chain rule", tier: O, refs: ["S3"]}
      - {id: "3.5", title: "The fundamental theorem of calculus", tier: O, refs: ["S3"]}
      - {id: "3.6", title: "Deriving the equations of motion by calculus", tier: O, refs: ["S3"]}
      - {id: "3.7", title: "Projectile motion", tier: O, refs: ["S3"]}
      - {id: "3.8", title: "Time of flight and range", tier: O, refs: ["S3"]}
      - {id: "3.9", title: "Projectiles launched at an angle", tier: H, refs: ["S3"]}

  - id: 4
    title: Forces and Newton's laws
    strand: physical-world
    summary: Newton's laws as models of motion, applied to particles on planes and to connected objects.
    sections:
      - {id: "4.1", title: "Forces and Newton's laws", tier: O, refs: ["S3"]}
      - {id: "4.2", title: "Resultant force and equilibrium", tier: O, refs: ["S3"]}
      - {id: "4.3", title: "Motion on a smooth horizontal plane", tier: O, refs: ["S3"]}
      - {id: "4.4", title: "Motion on an inclined plane", tier: O, refs: ["S3"]}
      - {id: "4.5", title: "Tension and connected particles", tier: O, refs: ["S3"]}
      - {id: "4.6", title: "Pulleys", tier: O, refs: ["S3"]}
      - {id: "4.7", title: "Newton's laws in vector form", tier: H, refs: ["S3"]}

  - id: 5
    title: Friction and resistance
    strand: physical-world
    summary: The friction model, the coefficient of friction, and drag that depends on speed.
    sections:
      - {id: "5.1", title: "Friction and the normal reaction", tier: O, refs: ["S3"]}
      - {id: "5.2", title: "The coefficient of friction", tier: O, refs: ["S3"]}
      - {id: "5.3", title: "Motion on rough planes", tier: O, refs: ["S3"]}
      - {id: "5.4", title: "Statics on a rough plane", tier: H, refs: ["S3"]}
      - {id: "5.5", title: "Drag proportional to a power of speed", tier: O, refs: ["S3"]}
      - {id: "5.6", title: "Terminal velocity", tier: H, refs: ["S3"]}

  - id: 6
    title: Momentum, impulse and collisions
    strand: physical-world
    summary: Momentum, impulse, conservation of momentum, and modelling collisions as elastic or inelastic.
    anchor:
      title: What the crash test measures
      brief: >-
        You will model a collision using conservation of momentum, work out the
        impulse, and compare what an elastic model predicts with what an inelastic
        one does. By the end of the chapter you can say which model fits a real
        crash better and why.
    application: Crash testing, sport, ballistics, and any impact you want to survive.
    relevance_prompt: Where would knowing what happens in a collision change how you design or do something?
    sections:
      - {id: "6.1", title: "Momentum and impulse", tier: O, refs: ["S3"]}
      - {id: "6.2", title: "Conservation of momentum", tier: O, refs: ["S3"]}
      - {id: "6.3", title: "Collisions in one dimension", tier: O, refs: ["S3"]}
      - {id: "6.4", title: "Newton's experimental law of restitution", tier: O, refs: ["S3"]}
      - {id: "6.5", title: "Elastic and inelastic collisions", tier: O, refs: ["S3"]}
      - {id: "6.6", title: "Collisions in two dimensions", tier: H, refs: ["S3"]}
      - {id: "6.7", title: "Successive collisions and rebounds", tier: H, refs: ["S3"]}

  - id: 7
    title: Circular motion and oscillation
    strand: physical-world
    summary: Motion in a circle, the forces that produce it, and Hooke's law for springs.
    sections:
      - {id: "7.1", title: "Angular velocity and period", tier: O, refs: ["S3"]}
      - {id: "7.2", title: "Centripetal acceleration and force", tier: O, refs: ["S3"]}
      - {id: "7.3", title: "Circular motion in context", tier: O, refs: ["S3"]}
      - {id: "7.4", title: "Conical pendulum and banked tracks", tier: H, refs: ["S3"]}
      - {id: "7.5", title: "Hooke's law and elastic strings", tier: O, refs: ["S3"]}
      - {id: "7.6", title: "Simple harmonic motion", tier: H, refs: ["S3"]}

  - id: 8
    title: Modelling a changing world
    strand: changing-world
    summary: >-
      Difference and differential equations as models of change — growth, decay,
      recurrence and feedback.
    anchor:
      title: Will the lake ever clear?
      brief: >-
        A pollutant enters a lake and is washed out at a rate proportional to how
        much is there. You will model it, solve the model, and say how long the
        lake takes to reach a safe level — and what the model assumes that might
        not hold.
    application: Population, disease, pollution, cooling, radioactive decay and finance.
    relevance_prompt: What changes in your life or your area at a rate set by how much of it there already is?
    sections:
      - {id: "8.1", title: "Rates of change and differential equations", tier: O, refs: ["S4"]}
      - {id: "8.2", title: "Exponential growth and decay", tier: O, refs: ["S4"]}
      - {id: "8.3", title: "Recurrence relations as discrete models", tier: O, refs: ["S4"]}
      - {id: "8.4", title: "First-order difference equations", tier: O, refs: ["S4"]}
      - {id: "8.5", title: "Feedback and limited growth", tier: O, refs: ["S4"]}
      - {id: "8.6", title: "The logistic model", tier: H, refs: ["S4"]}
      - {id: "8.7", title: "Solving separable differential equations", tier: H, refs: ["S4"]}
      - {id: "8.8", title: "Comparing a discrete and a continuous model", tier: H, refs: ["S4"]}

  - id: 9
    title: The modelling project
    strand: modelling
    summary: >-
      The 20% component: choosing a problem, building and testing a model, and
      reporting it against the SEC brief.
    anchor:
      title: Your own model
      brief: >-
        You will choose a real situation, build a mathematical model of it, test it
        against data, and report honestly on where it fails. This chapter is the
        guide, and the project it describes is worth a fifth of your mark.
    application: The modelling project, and every real problem after school.
    relevance_prompt: What situation in your own life would a model help you decide about?
    sections:
      - {id: "9.1", title: "Reading the brief and choosing a problem", tier: O, refs: ["S1"]}
      - {id: "9.2", title: "Building the model and stating assumptions", tier: O, refs: ["S1"]}
      - {id: "9.3", title: "Testing the model against data", tier: O, refs: ["S1"]}
      - {id: "9.4", title: "Iterating and improving", tier: O, refs: ["S1"]}
      - {id: "9.5", title: "Communicating the result", tier: O, refs: ["S1"]}
      - {id: "9.6", title: "Critical evaluation of models", tier: O, refs: ["S1"]}

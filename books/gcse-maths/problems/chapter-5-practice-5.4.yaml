- 'id': 'ch5-5-4-mixed-direct-inverse'
  'tier': 'F'
  'dfe':
  - 'R10'
  - 'R13'
  - 'R14'
  'statement': 'Choose the direct or inverse model for each relationship: $y=8x$ and $z=8/x$. Work out both values when $x=4$. Which value halves when $x$ doubles, and why?'
  'check':
    'kind': 'all'
    'checks':
    - 'kind': 'evaluate'
      'expression': '8*4'
      'answer': '32'
    - 'kind': 'evaluate'
      'expression': '8/4'
      'answer': '2'
  'answer_text': '$y=32$ and $z=2$. The inverse model halves because doubling $x$ doubles the denominator.'

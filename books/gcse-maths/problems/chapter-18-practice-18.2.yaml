chapter: 18
problems:
- id: 'ch18-18.2-scale2'
  section: '18.2'
  tier: 'F'
  refs:
  - 'G7'
  statement: 'Enlarge point $(2,3)$ by scale factor $2$ about the origin.'
  answer_label: 'Enlarge point $(2,3)$ by scale factor $2$ about the origin.'
  check:
    kind: 'all'
    checks:
    - kind: 'evaluate'
      expression: '2*2'
      answer: '4'
    - kind: 'evaluate'
      expression: '3*2'
      answer: '6'
  answer_text: '(4,6)'
- id: 'ch18-18.2-scale3'
  section: '18.2'
  tier: 'F'
  refs:
  - 'G7'
  statement: 'A triangle has vertices $(1,1),(3,1),(1,2)$. Enlarge by scale factor $3$ about the origin. Give image vertices.'
  answer_label: 'A triangle has vertices $(1,1),(3,1),(1,2)$. Enlarge by scale factor $3$ about the origin. Give image vertices.'
  check:
    kind: 'all'
    checks:
    - kind: 'evaluate'
      expression: '1*3'
      answer: '3'
    - kind: 'evaluate'
      expression: '1*3'
      answer: '3'
    - kind: 'evaluate'
      expression: '3*3'
      answer: '9'
    - kind: 'evaluate'
      expression: '1*3'
      answer: '3'
    - kind: 'evaluate'
      expression: '1*3'
      answer: '3'
    - kind: 'evaluate'
      expression: '2*3'
      answer: '6'
  answer_text: '(3,3), (9,3), (3,6)'
- id: 'ch18-18.2-find-length'
  section: '18.2'
  tier: 'F'
  refs:
  - 'G7'
  statement: 'A side of $4$ cm becomes $10$ cm. Work out the scale factor.'
  answer_label: 'A side of $4$ cm becomes $10$ cm. Work out the scale factor.'
  check:
    kind: 'evaluate'
    expression: '10/4'
    answer: '5/2'
  answer_text: '5/2'
- id: 'ch18-18.2-find-original'
  section: '18.2'
  tier: 'F'
  refs:
  - 'G7'
  statement: 'A length becomes $18$ cm under scale factor $3$. Work out its original length.'
  answer_label: 'A length becomes $18$ cm under scale factor $3$. Work out its original length.'
  check:
    kind: 'evaluate'
    expression: '18/3'
    answer: '6'
  answer_text: '6 cm'
- id: 'ch18-18.2-distance'
  section: '18.2'
  tier: 'F'
  refs:
  - 'G7'
  statement: 'A point $(3,-2)$ is enlarged by factor $4$ about the origin. Give its image.'
  answer_label: 'A point $(3,-2)$ is enlarged by factor $4$ about the origin. Give its image.'
  check:
    kind: 'all'
    checks:
    - kind: 'evaluate'
      expression: '3*4'
      answer: '12'
    - kind: 'evaluate'
      expression: '-2*4'
      answer: '-8'
  answer_text: '(12,-8)'
- id: 'ch18-18.2-factor'
  section: '18.2'
  tier: 'F'
  refs:
  - 'G7'
  statement: 'A length of $7$ cm becomes $21$ cm. Find the scale factor.'
  answer_label: 'A length of $7$ cm becomes $21$ cm. Find the scale factor.'
  check:
    kind: 'evaluate'
    expression: '21/7'
    answer: '3'
  answer_text: '3'
- id: 'ch18-18.2-centre'
  section: '18.2'
  tier: 'F'
  refs:
  - 'G7'
  statement: 'A point $(4,2)$ maps to $(8,4)$ under an enlargement centred at the origin. State the scale factor.'
  answer_label: 'A point $(4,2)$ maps to $(8,4)$ under an enlargement centred at the origin. State the scale factor.'
  check:
    kind: 'evaluate'
    expression: '8/4'
    answer: '2'
  answer_text: 'Scale factor $2$.'
- id: 'ch18-18.2-describe'
  section: '18.2'
  tier: 'F'
  refs:
  - 'G7'
  statement: 'A triangle is enlarged by scale factor $1.5$ about the origin. What happens to every side length?'
  answer_label: 'A triangle is enlarged by scale factor $1.5$ about the origin. What happens to every side length?'
  check:
    kind: 'evaluate'
    expression: '1.5*2'
    answer: '3'
  answer_text: 'Each side length is multiplied by $1.5$.'
- id: 'ch18-18.2-image'
  section: '18.2'
  tier: 'F'
  refs:
  - 'G7'
  statement: 'Enlarge $(-2,5)$ by scale factor $0.5$ about the origin.'
  answer_label: 'Enlarge $(-2,5)$ by scale factor $0.5$ about the origin.'
  check:
    kind: 'all'
    checks:
    - kind: 'evaluate'
      expression: '-2*0.5'
      answer: '-1'
    - kind: 'evaluate'
      expression: '5*0.5'
      answer: '2.5'
  answer_text: '(-1,2.5)'
- id: 'ch18-18.2-context'
  section: '18.2'
  tier: 'F'
  refs:
  - 'G7'
  statement: 'A map length of $3$ cm represents $12$ km. A copied map is enlarged by factor $2$. What length represents the same distance on the copy?'
  answer_label: 'A map length of $3$ cm represents $12$ km. A copied map is enlarged by factor $2$. What length represents the same distance on the copy?'
  check:
    kind: 'evaluate'
    expression: '3*2'
    answer: '6'
  answer_text: '6 cm'

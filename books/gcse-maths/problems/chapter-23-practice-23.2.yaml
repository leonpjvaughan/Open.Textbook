chapter: 23
problems:
- id: p1-relative-frequency
  section: '23.2'
  tier: 'F'
  refs:
  - 'P1'
  statement: 'A player scores 21 times in 35 attempts. Find the relative frequency of scoring.'
  answer_label: 'A player scores 21 times in 35 attempts. Find the relative frequency of scoring.'
  check:
    kind: 'evaluate'
    expression: '21/35'
    answer: '3/5'
  answer_text: '$\frac{21}{35}=\frac35$.'
- id: p2-estimate-from-frequency
  section: '23.2'
  tier: 'F'
  refs:
  - 'P2'
  statement: 'A spinner lands on green 42 times in 70 spins. Use this to estimate the probability of green.'
  answer_label: 'A spinner lands on green 42 times in 70 spins. Use this to estimate the probability of green.'
  check:
    kind: 'evaluate'
    expression: '42/70'
    answer: '3/5'
  answer_text: '$\frac{42}{70}=0.6$.'
- id: p3-sample-not-certainty
  section: '23.2'
  tier: 'F'
  refs:
  - 'P3'
  statement: 'A fair coin lands on heads 7 times in 10 tosses. Is this result impossible for a fair coin?'
  answer_label: 'A fair coin lands on heads 7 times in 10 tosses. Is this result impossible for a fair coin?'
  check:
    kind: 'compare'
    relation: '>'
    lhs: 'binomial(10,7)/2**10'
    rhs: '0'
  answer_text: 'No. A short sample can differ from the theoretical probability.'
- id: p4-expected-dice
  section: '23.2'
  tier: 'F'
  refs:
  - 'P5'
  statement: 'A fair die is rolled 300 times. Find the expected number of sixes.'
  answer_label: 'A fair die is rolled 300 times. Find the expected number of sixes.'
  check:
    kind: 'evaluate'
    expression: '300/6'
    answer: '50'
  answer_text: '$300\times\frac16=50$.'
- id: p5-expected-spinner
  section: '23.2'
  tier: 'F'
  refs:
  - 'P5'
  statement: 'A spinner has probability $0.3$ of landing on red. Find the expected red results in 80 spins.'
  answer_label: 'A spinner has probability $0.3$ of landing on red. Find the expected red results in 80 spins.'
  check:
    kind: 'evaluate'
    expression: '0.3*80'
    answer: '24'
  answer_text: '$0.3\times80=24$.'
- id: p6-relative-percent
  section: '23.2'
  tier: 'F'
  refs:
  - 'P1'
  statement: 'A team wins 16 of 40 games. Find the relative frequency as a percentage.'
  answer_label: 'A team wins 16 of 40 games. Find the relative frequency as a percentage.'
  check:
    kind: 'evaluate'
    expression: '16/40*100'
    answer: '40'
  answer_text: '$40\%$.'
- id: p7-expected-fractional
  section: '23.2'
  tier: 'F'
  refs:
  - 'P5'
  statement: 'An event has probability $\frac{2}{5}$. Find its expected frequency in 12 trials.'
  answer_label: 'An event has probability $\frac{2}{5}$. Find its expected frequency in 12 trials.'
  check:
    kind: 'evaluate'
    expression: '2/5*12'
    answer: '24/5'
  answer_text: '$\frac{24}{5}=4.8$; this is an expectation.'
- id: p8-estimate-200
  section: '23.2'
  tier: 'F'
  refs:
  - 'P2'
  statement: 'A sample suggests probability $0.62$. Estimate the number of successes in 200 trials.'
  answer_label: 'A sample suggests probability $0.62$. Estimate the number of successes in 200 trials.'
  check:
    kind: 'evaluate'
    expression: '0.62*200'
    answer: '124'
  answer_text: '$124$.'
- id: p9-relative-frequency-fail
  section: '23.2'
  tier: 'F'
  refs:
  - 'P1'
  statement: 'A shot misses 9 times in 30 attempts. Find the relative frequency of a miss.'
  answer_label: 'A shot misses 9 times in 30 attempts. Find the relative frequency of a miss.'
  check:
    kind: 'evaluate'
    expression: '9/30'
    answer: '3/10'
  answer_text: '$\frac3{10}$.'
- id: p10-compare-theory-data
  section: '23.2'
  tier: 'F'
  refs:
  - 'P3'
  statement: 'A fair die shows a 1 on 14 of 60 rolls. Compare the observed relative frequency with the theoretical probability.'
  answer_label: 'A fair die shows a 1 on 14 of 60 rolls. Compare the observed relative frequency with the theoretical probability.'
  check:
    kind: 'compare'
    relation: '>'
    lhs: '14/60'
    rhs: '1/6'
  answer_text: '$\frac{14}{60}>\frac16$ for this sample.'

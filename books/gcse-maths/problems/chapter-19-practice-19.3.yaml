- id: 'ch19-19-3-01'
  section: '19.3'
  tier: 'F'
  dfe: &id001
  - 'G18'
  statement: 'A sector has radius 6 cm and angle 60°. Work out its arc length in terms of π.'
  answer_label: 'Arc length'
  check:
    kind: 'evaluate'
    expression: '60/360*2*pi*6'
    answer: '2*pi'
  answer_text: '$2\pi\text{ cm}$'

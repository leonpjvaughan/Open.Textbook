chapter: 11
problems:
- id: p1-coordinate
  section: '11.1'
  tier: F
  dfe: &id001
  - A8
  - A9
  - G11
  statement: Plot the point $(3,-2)$ on a coordinate grid. State its horizontal and vertical coordinates.
  answer_label: Question 1
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: '3'
      answer: '3'
    - kind: evaluate
      expression: '-2'
      answer: '-2'
  answer_text: (3,-2)
- id: p2-quadrants
  section: '11.1'
  tier: F
  dfe: *id001
  statement: State the quadrant containing $(-4,5)$.
  answer_label: Question 2
  check:
    kind: evaluate
    expression: '2'
    answer: '2'
  answer_text: II
- id: p3-table
  section: '11.1'
  tier: F
  dfe: *id001
  statement: Complete the table for $y=2x+1$ when $x=-1,0,2$.
  answer_label: Question 3
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 2*(-1)+1
      answer: '-1'
    - kind: evaluate
      expression: 2*0+1
      answer: '1'
    - kind: evaluate
      expression: 2*2+1
      answer: '5'
  answer_text: -1, 1, 5
- id: p4-points
  section: '11.1'
  tier: F
  dfe: *id001
  statement: For $y=x+2$, find $y$ when $x=-2,1,3$.
  answer_label: Question 4
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: -2+2
      answer: '0'
    - kind: evaluate
      expression: 1+2
      answer: '3'
    - kind: evaluate
      expression: 3+2
      answer: '5'
  answer_text: 0, 3, 5
- id: p5-plot-points
  section: '11.1'
  tier: F
  dfe: *id001
  statement: Give three points on the line $y=3x$ for $x=-1,0,2$.
  answer_label: Question 5
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 3*(-1)
      answer: '-3'
    - kind: evaluate
      expression: 3*0
      answer: '0'
    - kind: evaluate
      expression: 3*2
      answer: '6'
  answer_text: (-1,-3), (0,0), (2,6)
- id: p6-x-intercept
  section: '11.1'
  tier: F
  dfe: *id001
  statement: The graph $y=x-4$ crosses the horizontal axis at which point?
  answer_label: Question 6
  check:
    kind: solve
    equation: x-4=0
    variable: x
    answer: '4'
  answer_text: (4,0)
- id: p7-line-table
  section: '11.1'
  tier: F
  dfe: *id001
  statement: For $y=5-x$, complete the values when $x=0,2,5$.
  answer_label: Question 7
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 5-0
      answer: '5'
    - kind: evaluate
      expression: 5-2
      answer: '3'
    - kind: evaluate
      expression: 5-5
      answer: '0'
  answer_text: 5, 3, 0
- id: p8-reflection
  section: '11.1'
  tier: F
  dfe: *id001
  statement: A point $(a,b)$ is reflected in the $x$-axis. State the image coordinates.
  answer_label: Question 8
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: a
      answer: a
    - kind: evaluate
      expression: -b
      answer: -b
  answer_text: (a,-b)
- id: p9-plot-rule
  section: '11.1'
  tier: F
  dfe: *id001
  statement: Does $(2,7)$ lie on $y=3x+1$? Show a substitution check.
  answer_label: Question 9
  check:
    kind: compare
    relation: '='
    lhs: 3*2+1
    rhs: '7'
  answer_text: 'Yes'
- id: p10-higher
  section: '11.1'
  tier: H
  dfe: *id001
  statement: Find the midpoint of $(2,5)$ and $(8,-1)$.
  answer_label: Question 10
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: (2+8)/2
      answer: '5'
    - kind: evaluate
      expression: (5-1)/2
      answer: '2'
  answer_text: (5,2)
symbols:
  x:
    real: true

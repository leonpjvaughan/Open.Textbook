    answer: '1.03'
  answer_text: '1.03'
- id: p5-compare
  section: '6.4'
  tier: F
  dfe: *id001
  statement: Find the final amount for £1000 at 6% for 2 years using simple interest, then compound interest.
  answer_label: Compare interest types
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 1000*(1+0.06*2)
      answer: '1120'
    - kind: evaluate
      expression: 1000*1.06**2
      answer: '1123.6'
  answer_text: 'Simple: £1,120. Compound: £1,123.60.'

chapter: 6
problems:
- id: p1-simple
  section: '6.4'
  tier: F
  dfe: &id001
  - R9
  - R16
  statement: £500 is invested at 4% simple interest each year for 3 years. Work out the interest.
  answer_label: Simple interest

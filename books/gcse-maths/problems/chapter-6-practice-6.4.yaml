- id: p2-total-simple
  section: '6.4'
  tier: F
  dfe: *id001
  statement: £750 is invested at 2% simple interest each year for 5 years. Work out the final amount.
  answer_label: Final amount
  check:
    kind: evaluate
    expression: 750*(1+0.02*5)

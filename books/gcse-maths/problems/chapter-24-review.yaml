# Mixed practice for the Chapter 24 Review (Statistics: representing and analysing data).
#
# SymPy verifies the sample estimate, both averages, the range, the probability and
# the area. Question 2 asks which chart suits categorical data and question 5 asks
# the reader to describe a pattern over time; the verifier cannot prove either
# judgement (a `structured` check confirms only that the declared points and
# concepts are present in order).
chapter: 24
oracles: [sympy, units]
problems:
  - id: r1-sample-proportion
    section: Review
    tier: F
    refs: [S1, S5]
    statement: 'A club asks a random sample of 40 members; 10 cycle. Estimate the proportion of all 360 members who cycle. **Method:** sample proportion.'
    answer_label: 'Estimated number of members who cycle'
    check: {kind: evaluate, expression: '360*10/40', answer: '90'}
    answer_text: 'The sample proportion is $\frac{10}{40}=\frac14$. Scale it to the whole club: $\frac14\times360=90$, so about $90$ members cycle. A random sample gives an estimate, so the true number may differ.'

  - id: r2-choose-a-chart
    section: Review
    tier: F
    refs: [S2]
    statement: 'A tally records 12 red, 8 blue and 10 green counters. Choose a chart to compare category counts. **Method:** bar chart.'
    answer_label: 'Chart for the counter counts and the reason'
    check:
      kind: structured
      requires: [choose-bar-chart, compare-counts]
      concepts: [categorical-data, bar-chart]
      points:
        - id: choose-bar-chart
          text: 'A bar chart suits the data, because red, blue and green are categories and the height of each bar shows the count.'
          concepts: [categorical-data, bar-chart]
        - id: compare-counts
          text: 'The bars for 12, 8 and 10 stand side by side, so the tallest bar shows the most common colour and the shortest the least common.'
          concepts: [bar-chart]
    answer_text: 'A bar chart, with one bar for each colour. The bars are $12$ red, $8$ blue and $10$ green, so red is the most common and blue the least. A pie chart would also work, but a bar chart compares counts more directly.'

  - id: r3-mean-and-range
    section: Review
    tier: F
    refs: [S4]
    statement: 'Find the mean and range of $4, 5, 5, 6, 10$. **Method:** summary measures.'
    answer_label: 'Mean and range of the five values'
    check:
      kind: all
      checks:
        - {kind: statistic, data: ['4', '5', '5', '6', '10'], stat: mean, answer: '6'}
        - {kind: statistic, data: ['4', '5', '5', '6', '10'], stat: range, answer: '6'}
    answer_text: 'The total is $4+5+5+6+10=30$ and there are $5$ values, so the mean is $30\div5=6$. The range is $10-4=6$. Both happen to be $6$, which is a coincidence, not a rule.'

  - id: r4-mean-from-frequency-table
    section: Review
    tier: F
    refs: [S4]
    statement: 'Values 1, 2 and 4 have frequencies 3, 2 and 1. Find the mean. **Method:** weighted mean.'
    answer_label: 'Mean of the frequency table'
    check: {kind: evaluate, expression: '(1*3 + 2*2 + 4*1)/(3 + 2 + 1)', answer: '11/6'}
    answer_text: 'The total of the values is $1(3)+2(2)+4(1)=3+4+4=11$, and there are $3+2+1=6$ values. The mean is $\frac{11}{6}\approx1.83$. Use the frequencies as weights, not as extra values.'

  - id: r5-temperature-pattern
    section: Review
    tier: F
    refs: [S2]
    statement: 'A temperature record is 12°C, 15°C, 13°C over three days. Describe its time pattern. **Method:** read consecutive changes on a line graph.'
    answer_label: 'Pattern in the temperature record'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '15 - 12', answer: '3'}
        - {kind: evaluate, expression: '13 - 15', answer: '-2'}
        - kind: structured
          requires: [first-change, second-change]
          concepts: [time-series, change]
          points:
            - id: first-change
              text: 'From day 1 to day 2 the temperature rises by 3 degrees, from 12 to 15.'
              concepts: [change]
            - id: second-change
              text: 'From day 2 to day 3 it falls by 2 degrees, from 15 to 13, so the line graph rises and then falls.'
              concepts: [time-series, change]
    answer_text: 'The temperature rises by $15-12=3$ degrees, then falls by $15-13=2$ degrees. On a line graph the line climbs from day 1 to day 2 and then drops to day 3. The record does not show a steady trend.'

  - id: r6-probability-of-red
    section: Review
    tier: F
    refs: [P2, P3]
    statement: 'A bag contains 3 red and 5 blue counters. Find the probability of red. **Method:** favourable outcomes over total outcomes.'
    answer_label: 'Probability of a red counter'
    check: {kind: evaluate, expression: '3/(3 + 5)', answer: '3/8'}
    answer_text: 'There are $3$ red counters out of $3+5=8$ counters, so the probability is $\frac38=0.375$. The red counters are the favourable outcomes and all the counters are the total.'

  - id: r7-rectangle-area
    section: Review
    tier: F
    refs: [G16]
    statement: 'A rectangle has length 8 cm and width 3 cm. Find its area. **Method:** area of a rectangle.'
    answer_label: 'Area of the rectangle'
    check: {kind: evaluate, expression: '8*3', answer: '24'}
    answer_text: 'Area $=\text{length}\times\text{width}=8\times3=24\text{ cm}^2$. The perimeter would be $2(8+3)=22\text{ cm}$, which is a different measurement.'

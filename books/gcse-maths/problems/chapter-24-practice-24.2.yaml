# Practice set for 24.2. Questions and answers render from these verified records.
chapter: 24
problems:
  - id: 'ch24-24-2-frequency-total'
    section: '24.2'
    tier: 'F'
    dfe: ['S2']
    statement: 'A table has frequencies 7, 11 and 6. Find the total.'
    answer_label: 'A table has frequencies 7, 11 and 6. Find the total.'
    check:
      kind: 'evaluate'
      expression: '7+11+6'
      answer: '24'
    answer_text: 'Total $=24$.'

  - id: 'ch24-24-2-bar-chart-choice'
    section: '24.2'
    tier: 'F'
    dfe: ['S2']
    statement: 'A class records these favourite fruits: 5 choose apples, 8 choose bananas and 3 choose pears. Name a suitable chart to compare the categories and work out the total responses.'
    answer_label: 'A class records these favourite fruits: 5 choose apples, 8 choose bananas and 3 choose pears. Name a suitable chart to compare the categories and work out the total responses.'
    check:
      kind: 'evaluate'
      expression: '5+8+3'
      answer: '16'
    answer_text: 'A bar chart compares the separate categories. The total is $5+8+3=16$ responses.'

  - id: 'ch24-24-2-pie-angle'
    section: '24.2'
    tier: 'F'
    dfe: ['S2']
    statement: 'A category has frequency 15 in a total of 60. Find its pie-chart angle.'
    answer_label: 'A category has frequency 15 in a total of 60. Find its pie-chart angle.'
    check:
      kind: 'evaluate'
      expression: '15/60*360'
      answer: '90'
    answer_text: '$90^\circ$.'

  - id: 'ch24-24-2-pictogram-value'
    section: '24.2'
    tier: 'F'
    dfe: ['S2']
    statement: 'One pictogram symbol represents 5 votes. How many votes do 6 symbols represent?'
    answer_label: 'One pictogram symbol represents 5 votes. How many votes do 6 symbols represent?'
    check:
      kind: 'evaluate'
      expression: '5*6'
      answer: '30'
    answer_text: '30 votes.'

  - id: 'ch24-24-2-pie-angle-second'
    section: '24.2'
    tier: 'F'
    dfe: ['S2']
    statement: 'A group of 20 out of 80 choose walking. Find the sector angle.'
    answer_label: 'A group of 20 out of 80 choose walking. Find the sector angle.'
    check:
      kind: 'evaluate'
      expression: '20/80*360'
      answer: '90'
    answer_text: '$90^\circ$.'

  - id: 'ch24-24-2-vertical-line-chart'
    section: '24.2'
    tier: 'F'
    dfe: ['S2']
    statement: 'The ungrouped discrete data are 2, 5, 5, 7. Name a suitable chart and find the median.'
    answer_label: 'The ungrouped discrete data are 2, 5, 5, 7. Name a suitable chart and find the median.'
    check:
      kind: 'statistic'
      data: [2, 5, 5, 7]
      stat: 'median'
      answer: '5'
    answer_text: 'A vertical line chart is suitable for ungrouped discrete numerical data. The median is $5$.'

  - id: 'ch24-24-2-pictogram-half'
    section: '24.2'
    tier: 'F'
    dfe: ['S2']
    statement: 'Each symbol represents 4 pupils. What does 2.5 symbols represent?'
    answer_label: 'Each symbol represents 4 pupils. What does 2.5 symbols represent?'
    check:
      kind: 'evaluate'
      expression: '2.5*4'
      answer: '10'
    answer_text: '10 pupils.'

  - id: 'ch24-24-2-interpret-bar'
    section: '24.2'
    tier: 'F'
    dfe: ['S2']
    statement: 'A bar chart shows 12 votes for red and 8 for blue. How many more chose red?'
    answer_label: 'A bar chart shows 12 votes for red and 8 for blue. How many more chose red?'
    check:
      kind: 'evaluate'
      expression: '12-8'
      answer: '4'
    answer_text: '4 more chose red.'

  - id: 'ch24-24-2-table-to-pie'
    section: '24.2'
    tier: 'F'
    dfe: ['S2']
    statement: 'Frequencies are 9, 6 and 5. Find the pie angle for frequency 6.'
    answer_label: 'Frequencies are 9, 6 and 5. Find the pie angle for frequency 6.'
    check:
      kind: 'evaluate'
      expression: '6/(9+6+5)*360'
      answer: '108'
    answer_text: '$108^\circ$.'

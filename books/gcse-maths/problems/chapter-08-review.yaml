# Mixed practice for the Chapter 8 Review.
#
# Seven questions, one record each, in the order they appear on the Review page.
# They collect like terms, expand a single bracket, take out a common factor,
# substitute a negative value, change the subject of a formula, expand a product
# of three binomials, and estimate then calculate an expression.
#
# Honest limit: `evaluate` proves that the two expressions are equal for every
# value of the symbols, and `solve` proves the solution set of the formula for t.
# Neither proves that an answer is fully factorised or in the form the question
# asked for; the answer text says what that form is. Question 7 asks the reader to
# estimate first, so it carries a `structured` component, which proves only that a
# model answer contains its declared steps and concepts, in order.
oracles: [sympy, units]
chapter: 8
symbols:
  a: {real: true, nonzero: true}
  n: {real: true}
  t: {real: true}
  u: {real: true}
  v: {real: true}
  x: {real: true}
  y: {real: true}
problems:
  - id: r1-collect-terms
    section: Review
    tier: F
    refs: [A4]
    statement: 'Simplify $4a+3-2a+6$.'
    answer_label: 'The simplified expression'
    check:
      kind: evaluate
      expression: '4*a + 3 - 2*a + 6'
      answer: '2*a + 9'
    answer_text: '$4a - 2a = 2a$ and $3 + 6 = 9$, so the expression is $2a + 9$. Collect like terms only: the $a$ terms add together and the numbers add together, and they do not mix. A check is to substitute a value for $a$, such as $a = 1$, into both forms.'

  - id: r2-expand-bracket
    section: Review
    tier: F
    refs: [A4]
    statement: 'Expand $3(2x-5)$.'
    answer_label: 'The expanded expression'
    check:
      kind: evaluate
      expression: '3*(2*x - 5)'
      answer: '6*x - 15'
    answer_text: '$3(2x - 5) = 6x - 15$. The $3$ multiplies both terms inside the bracket, not only the first. Expanding is the reverse of taking out a common factor, so $6x - 15$ factorises back to $3(2x - 5)$.'

  - id: r3-common-factor
    section: Review
    tier: F
    refs: [A4]
    statement: 'Factorise $12y+18$.'
    answer_label: 'The factorised expression'
    check:
      kind: evaluate
      expression: '12*y + 18'
      answer: '6*(2*y + 3)'
    answer_text: '$12y + 18 = 6(2y + 3)$. The highest common factor of $12$ and $18$ is $6$, and both terms divide by it. The bracket is checked by expanding: $6 \times 2y = 12y$ and $6 \times 3 = 18$, so the factorisation returns the original expression.'

  - id: r4-substitute-negative
    section: Review
    tier: F
    refs: [A2]
    statement: 'Find $2n^2+1$ when $n=-3$.'
    answer_label: 'The value of the expression'
    check:
      kind: evaluate
      expression: '2*(-3)**2 + 1'
      answer: '19'
    answer_text: '$2n^2 + 1$ with $n = -3$ is $2 \times (-3)^2 + 1 = 2 \times 9 + 1 = 19$. Square the $-3$ before multiplying, because the index binds more tightly than the multiplication. The square is positive, so the answer is positive.'

  - id: r5-change-subject
    section: Review
    tier: F
    refs: [A5]
    statement: 'Make $t$ the subject of $v=u+at$.'
    answer_label: 'The formula with t as the subject'
    check:
      kind: solve
      equation: 'v = u + a*t'
      variable: t
      answer: '-1/a*(u - v)'
    answer_text: 'Subtract $u$ from both sides: $v - u = at$. Then divide both sides by $a$, which is not zero: $t = \dfrac{v - u}{a}$. Each step undoes one operation, and the division is the last because $a$ multiplies $t$.'

  - id: r6-three-binomials
    section: Review
    tier: H
    refs: [A4]
    statement: 'Expand $(x-1)(x+2)(x+4)$.'
    answer_label: 'The expanded expression'
    check:
      kind: evaluate
      expression: '(x - 1)*(x + 2)*(x + 4)'
      answer: 'x**3 + 5*x**2 + 2*x - 8'
    answer_text: 'Multiply two brackets first: $(x - 1)(x + 2) = x^2 + x - 2$. Then multiply by $(x + 4)$: $x(x^2 + x - 2) + 4(x^2 + x - 2) = x^3 + x^2 - 2x + 4x^2 + 4x - 8 = x^3 + 5x^2 + 2x - 8$. Take the brackets in any order; the product is the same.'

  - id: r7-estimate-then-calculate
    section: Review
    tier: F
    refs: [A2]
    statement: 'Estimate then calculate the value of $8x+24$ when $x=5$.'
    answer_label: 'The value of the expression'
    check:
      kind: all
      checks:
        - kind: evaluate
          expression: '8*5 + 24'
          answer: '64'
        - kind: structured
          requires: [estimate, calculate]
          concepts: [substitution, estimation]
          points:
            - id: estimate
              text: 'Estimate first: 8x is about 8 x 5 = 40, and adding 24 gives about 64.'
              concepts: [estimation]
            - id: calculate
              text: 'Now calculate exactly: 8 x 5 = 40, and 40 + 24 = 64. The exact value agrees with the estimate.'
              concepts: [substitution]
    answer_text: 'With $x = 5$, $8x + 24 = 8 \times 5 + 24 = 40 + 24 = 64$. Estimating first gives the same two steps with round numbers, so the exact answer can be checked against it. Substitution means replacing $x$ by its value and then following the order of operations.'

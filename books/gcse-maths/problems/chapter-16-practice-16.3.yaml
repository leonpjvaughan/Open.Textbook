  statement: A quadrilateral has angles $90^\circ$, $90^\circ$, $90^\circ$ and $x^\circ$. Find $x$ and explain the sum.
  answer_label: A quadrilateral has angles $90^\circ$, $90^\circ$, $90^\circ$ and $x^\circ$. Fin
  check:

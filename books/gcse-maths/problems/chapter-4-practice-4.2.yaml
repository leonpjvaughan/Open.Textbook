chapter: '4'
symbols: {}
problems:
- id: 'ch4-add-same'
  section: '4.2'
  tier: 'F'
  dfe:
  - 'N2'
  statement: 'Work out $\frac{3}{11}+\frac{5}{11}$.'
  answer_label: 'Answer 1'
  check:
    'kind': 'evaluate'
    'expression': '3/11+5/11'
    'answer': '8/11'
  answer_text: '$\frac{3}{11}+\frac{5}{11}=\frac{8}{11}.$'
- id: 'ch4-subtract-common'
  section: '4.2'
  tier: 'F'
  dfe:
  - 'N2'
  statement: 'Work out $\frac{5}{6}-\frac{1}{4}$.'
  answer_label: 'Answer 2'
  check:
    'kind': 'evaluate'
    'expression': '5/6-1/4'
    'answer': '7/12'
  answer_text: '$\frac{5}{6}-\frac{1}{4}=\frac{10}{12}-\frac{3}{12}=\frac{7}{12}.$'
- id: 'ch4-mixed-add'
  section: '4.2'
  tier: 'F'
  dfe:
  - 'N2'
  statement: 'Work out $1\frac{2}{3}+2\frac{3}{4}$.'
  answer_label: 'Answer 3'
  check:
    'kind': 'evaluate'
    'expression': '5/3+11/4'
    'answer': '53/12'
  answer_text: '$\frac{5}{3}+\frac{11}{4}=\frac{20}{12}+\frac{33}{12}=\frac{53}{12}=4\frac{5}{12}.$'
- id: 'ch4-fraction-word'
  section: '4.2'
  tier: 'F'
  dfe:
  - 'N2'
  statement: 'A jug is $\frac{7}{8}$ full. You pour out $\frac{1}{3}$ of the jug capacity. What fraction remains?'
  answer_label: 'Answer 4'
  check:
    'kind': 'evaluate'
    'expression': '7/8-1/3'
    'answer': '13/24'
  answer_text: '$\frac{7}{8}-\frac{1}{3}=\frac{21}{24}-\frac{8}{24}=\frac{13}{24}.$'
- id: 'ch4-add-three'
  section: '4.2'
  tier: 'F'
  dfe:
  - 'N2'
  statement: 'Work out $\frac{1}{2}+\frac{2}{3}-\frac{1}{4}$.'
  answer_label: 'Answer 5'
  check:
    'kind': 'evaluate'
    'expression': '1/2+2/3-1/4'
    'answer': '11/12'
  answer_text: '$\frac{6}{12}+\frac{8}{12}-\frac{3}{12}=\frac{11}{12}$.'
- id: 'ch4-add-tenths'
  section: '4.2'
  tier: 'F'
  dfe:
  - 'N2'
  statement: 'Work out $\frac{7}{10}+\frac{2}{5}$.'
  answer_label: 'Answer 6'
  check:
    'kind': 'evaluate'
    'expression': '7/10+2/5'
    'answer': '11/10'
  answer_text: '$\frac{7}{10}+\frac{4}{10}=\frac{11}{10}=1\frac{1}{10}.$'
- id: 'ch4-subtract-quarters'
  section: '4.2'
  tier: 'F'
  dfe:
  - 'N2'
  statement: 'Work out $\frac{3}{4}-\frac{2}{5}$.'
  answer_label: 'Answer 7'
  check:
    'kind': 'evaluate'
    'expression': '3/4-2/5'
    'answer': '7/20'
  answer_text: '$\frac{15}{20}-\frac{8}{20}=\frac{7}{20}.$'
- id: 'ch4-add-mixed-numbers'
  section: '4.2'
  tier: 'F'
  dfe:
  - 'N2'
  statement: 'Work out $2\frac{1}{6}+1\frac{1}{2}$.'
  answer_label: 'Answer 8'
  check:
    'kind': 'evaluate'
    'expression': '13/6+3/2'
    'answer': '11/3'
  answer_text: '$\frac{13}{6}+\frac{9}{6}=\frac{22}{6}=\frac{11}{3}=3\frac{2}{3}.$'
- id: 'ch4-add-recipe'
  section: '4.2'
  tier: 'F'
  dfe:
  - 'N2'
  statement: 'A recipe needs $\frac{3}{4}$ kg of flour and $\frac{2}{3}$ kg of sugar. Work out the total mass.'
  answer_label: 'Answer 9'
  check:
    'kind': 'evaluate'
    'expression': '3/4+2/3'
    'answer': '17/12'
  answer_text: '$\frac{9}{12}+\frac{8}{12}=\frac{17}{12}=1\frac{5}{12}$ kg.'

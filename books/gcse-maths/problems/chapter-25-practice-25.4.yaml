chapter: 25
problems:
  - id: scat1-direction
    section: '25.4'
    tier: F
    dfe: [S6]
    statement: 'On two days, sunshine rises from $2$ hours to $5$ hours and ice cream sales rise from $12$ to $18$. State the direction of correlation.'
    answer_label: 'Correlation direction'
    check: {kind: compare, relation: '<', lhs: '12', rhs: '18'}
    answer_text: 'Positive correlation.'
  - id: scat2-coordinate
    section: '25.4'
    tier: F
    dfe: [S6]
    statement: 'A pupil studies for $3$ hours and scores $65$. Write the coordinate pair if hours are plotted first.'
    answer_label: 'Coordinate pair'
    check: {kind: all, checks: [{kind: evaluate, expression: '3', answer: '3'}, {kind: evaluate, expression: '65', answer: '65'}]}
    answer_text: '$(3,65)$.'
  - id: scat3-negative
    section: '25.4'
    tier: F
    dfe: [S6]
    statement: 'During a journey, time rises from $2$ minutes to $5$ minutes while distance remaining falls from $10$ km to $4$ km. State the direction of correlation.'
    answer_label: 'Correlation direction'
    check: {kind: compare, relation: '<', lhs: '4', rhs: '10'}
    answer_text: 'Negative correlation.'
  - id: scat4-line-estimate
    section: '25.4'
    tier: F
    dfe: [S6]
    statement: 'A line of best fit passes through $(0,20)$ and $(8,60)$. Estimate $y$ when $x=5$.'
    answer_label: 'Estimate from the line'
    check: {kind: evaluate, expression: '20 + 5 * (60 - 20) / 8', answer: '45'}
    answer_text: 'Gradient $=40/8=5$; estimate $20+5\times5=45$.'
  - id: scat5-correlation-cause
    section: '25.4'
    tier: F
    dfe: [S6]
    statement: 'In a sample, shoe size rises from $4$ to $6$ as reading age rises from $10$ to $12$. Does this prove that larger shoes cause higher reading ages?'
    answer_label: 'Interpret a correlation'
    check: {kind: compare, relation: '<', lhs: '10', rhs: '12'}
    answer_text: 'No. Correlation alone does not show that one variable causes the other.'
  - id: scat6-no-pattern
    section: '25.4'
    tier: F
    dfe: [S6]
    statement: 'A scatter graph contains $(1,3),(2,5),(3,2),(4,4)$, with no clear upward or downward pattern. Describe its correlation.'
    answer_label: 'Describe the pattern'
    check: {kind: all, checks: [{kind: compare, relation: '>', lhs: '5', rhs: '3'}, {kind: compare, relation: '<', lhs: '2', rhs: '5'}, {kind: compare, relation: '>', lhs: '4', rhs: '2'}]}
    answer_text: 'There is no correlation, or no clear correlation.'
  - id: scat7-interpolation
    section: '25.4'
    tier: F
    dfe: [S6]
    statement: 'The observed $x$ values range from $2$ to $12$. Is an estimate at $x=8$ interpolation or extrapolation?'
    answer_label: 'Name the estimate type'
    check: {kind: between, value: '8', low: '2', high: '12'}
    answer_text: 'Interpolation, because 8 is within the observed range.'
  - id: scat8-extrapolation
    section: '25.4'
    tier: F
    dfe: [S6]
    statement: 'The observed $x$ values range from $2$ to $12$. Is an estimate at $x=16$ interpolation or extrapolation?'
    answer_label: 'Name the estimate type'
    check: {kind: compare, relation: '>', lhs: '16', rhs: '12'}
    answer_text: 'Extrapolation, because 16 is outside the observed range.'
  - id: scat9-strength
    section: '25.4'
    tier: F
    dfe: [S6]
    statement: 'A scatter graph contains $(1,2),(2,4),(3,6),(4,8)$. Describe the direction and strength of the correlation.'
    answer_label: 'Describe correlation'
    check: {kind: all, checks: [{kind: evaluate, expression: '2 - 2 * 1', answer: '0'}, {kind: evaluate, expression: '4 - 2 * 2', answer: '0'}, {kind: evaluate, expression: '6 - 2 * 3', answer: '0'}, {kind: evaluate, expression: '8 - 2 * 4', answer: '0'}]}
    answer_text: 'Strong positive correlation.'

- 'id': 'ch15-15-2-simplify-diff'
  'section': '15.2'
  'tier': 'H'
  'dfe':
  - 'A4'
  'statement': 'Simplify $\frac{x^2-16}{x^2+8x+16}$ and state the excluded value.'
  'answer_label': 'Simplify $\frac{x^2-16}{x^2+8x+16}$ and state the excluded value.'
  'check':
    'kind': 'evaluate'
    'expression': '(x**2-16)/(x**2+8*x+16)'
    'answer': '(x-4)/(x+4)'
  'answer_text': '$\frac{x-4}{x+4}$, $x\neq-4$'
- 'id': 'ch15-15-2-simplify-common'
  'section': '15.2'
  'tier': 'H'
  'dfe':
  - 'A4'
  'statement': 'Simplify $\frac{6x^2}{9x}$ and state the excluded value.'
  'answer_label': 'Simplify $\frac{6x^2}{9x}$ and state the excluded value.'
  'check':
    'kind': 'evaluate'
    'expression': '6*x**2/(9*x)'
    'answer': '2*x/3'
  'answer_text': '$\frac{2x}{3}$, $x\neq0$'
- 'id': 'ch15-15-2-simplify-factor'

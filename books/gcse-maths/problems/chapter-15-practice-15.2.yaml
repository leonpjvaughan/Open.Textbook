  'tier': 'H'
  'dfe':
  - 'A4'
  'statement': 'Simplify $\frac{x^2+5x+6}{x^2+4x+3}$.'
  'answer_label': 'Simplify $\frac{x^2+5x+6}{x^2+4x+3}$.'
  'check':
    'kind': 'evaluate'
    'expression': '(x**2+5*x+6)/(x**2+4*x+3)'
    'answer': '(x+2)/(x+1)'
  'answer_text': '$\frac{x+2}{x+1}$, $x\neq-1,-3$'

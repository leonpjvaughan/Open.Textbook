- id: 'ch4-multiply'
  section: '4.3'
  tier: 'F'
  refs:
  - 'N2'
  statement: 'Work out $\frac{3}{7}\times\frac{14}{15}$.'
  answer_label: 'Answer 1'
  check:
    'kind': 'evaluate'
    'expression': '3/7*14/15'
    'answer': '2/5'
  answer_text: '$\frac{3}{7}\times\frac{14}{15}=\frac{42}{105}=\frac{2}{5}.$'
- id: 'ch4-divide'
  section: '4.3'
  tier: 'F'
  refs:
  - 'N2'
  statement: 'Work out $\frac{5}{6}\div\frac{10}{9}$.'
  answer_label: 'Answer 2'
  check:
    'kind': 'evaluate'
    'expression': '5/6/(10/9)'
    'answer': '3/4'
  answer_text: '$\frac{5}{6}\times\frac{9}{10}=\frac{45}{60}=\frac{3}{4}.$'
- id: 'ch4-fraction-of'
  section: '4.3'
  tier: 'F'
  refs:
  - 'N2'
  statement: 'Work out $\frac{3}{5}$ of $40$.'
  answer_label: 'Answer 3'
  check:
    'kind': 'evaluate'
    'expression': '3/5*40'
    'answer': '24'
  answer_text: '$\frac{3}{5}\times40=24.$'
- id: 'ch4-mixed-mult'
  section: '4.3'
  tier: 'F'
  refs:
  - 'N2'
  statement: 'Work out $2\frac{1}{4}\times\frac{2}{3}$.'
  answer_label: 'Answer 4'
  check:
    'kind': 'evaluate'
    'expression': '9/4*2/3'
    'answer': '3/2'
  answer_text: '$\frac{9}{4}\times\frac{2}{3}=\frac{18}{12}=1\frac{1}{2}.$'
- id: 'ch4-share-fraction'
  section: '4.3'
  tier: 'F'
  refs:
  - 'N2'
  statement: 'A ribbon $\frac{5}{6}$ metre long is cut into pieces each $\frac{1}{12}$ metre long. How many pieces are made?'
  answer_label: 'Answer 5'
  check:
    'kind': 'evaluate'
    'expression': '5/6/(1/12)'
    'answer': '10'
  answer_text: '$\frac{5}{6}\div\frac{1}{12}=\frac{5}{6}\times12=10$.'
- id: 'ch4-mult-fractions'
  section: '4.3'
  tier: 'F'
  refs:
  - 'N2'
  statement: 'Work out $\frac{4}{9}\times\frac{3}{8}$.'
  answer_label: 'Answer 6'
  check:
    'kind': 'evaluate'
    'expression': '4/9*3/8'
    'answer': '1/6'
  answer_text: '$\frac{4}{9}\times\frac{3}{8}=\frac{12}{72}=\frac{1}{6}.$'
- id: 'ch4-divide-fractions'
  section: '4.3'
  tier: 'F'
  refs:
  - 'N2'
  statement: 'Work out $\frac{7}{8}\div\frac{7}{4}$.'
  answer_label: 'Answer 7'
  check:
    'kind': 'evaluate'
    'expression': '7/8/(7/4)'
    'answer': '1/2'
  answer_text: '$\frac{7}{8}\times\frac{4}{7}=\frac{28}{56}=\frac{1}{2}.$'
- id: 'ch4-fraction-of-amount'
  section: '4.3'
  tier: 'F'
  refs:
  - 'N2'
  statement: 'Work out $\frac{2}{3}$ of $45$.'
  answer_label: 'Answer 8'
  check:
    'kind': 'evaluate'
    'expression': '2/3*45'
    'answer': '30'
  answer_text: '$\frac{2}{3}\times45=30.$'
- id: 'ch4-plank-pieces'
  section: '4.3'
  tier: 'F'
  refs:
  - 'N2'
  statement: 'A plank $\frac{3}{4}$ metre long is cut into pieces each $\frac{3}{16}$ metre long. How many pieces are made?'
  answer_label: 'Answer 9'
  check:
    'kind': 'evaluate'
    'expression': '3/4/(3/16)'
    'answer': '4'
  answer_text: '$\frac{3}{4}\div\frac{3}{16}=\frac{3}{4}\times\frac{16}{3}=4$ pieces.'

chapter: 3
symbols:
  x: {real: true}
problems:
  - id: ch3-31-square-power
    section: '3.1'
    tier: F
    dfe: [N6]
    statement: 'Work out $4^3$.'
    answer_label: 'Work out $4^3$'
    check: {kind: evaluate, expression: '4**3', answer: '64'}
    steps: [{expr: '4**3'}, {expr: '4*4*4'}, {expr: '64'}]
    answer_text: '$64$'
  - id: ch3-31-power-product
    section: '3.1'
    tier: F
    dfe: [N6]
    statement: 'Write $5\times5\times5\times5$ as a power, then work it out.'
    answer_label: 'Write a repeated product as a power'
    check: {kind: evaluate, expression: '5**4', answer: '625'}
    answer_text: '$5^4=625$'
  - id: ch3-31-square-root
    section: '3.1'
    tier: F
    dfe: [N6]
    statement: 'Work out $\\sqrt{196}$. '
    answer_label: 'Work out $\\sqrt{196}$'
    check: {kind: evaluate, expression: 'sqrt(196)', answer: '14'}
    answer_text: '$14$, because $14^2=196$.'
  - id: ch3-31-cube-root
    section: '3.1'
    tier: F
    dfe: [N6]
    statement: 'Work out $\\sqrt[3]{-125}$.'
    answer_label: 'Work out the cube root'
    check: {kind: evaluate, expression: '-5', answer: '-5'}
    answer_text: '$-5$, because $(-5)^3=-125$.'
  - id: ch3-31-power-equation
    section: '3.1'
    tier: F
    dfe: [N6]
    statement: 'Solve $x^2=121$.'
    answer_label: 'Solve the square equation'
    check: {kind: solve, equation: 'x**2=121', variable: x, answer: ['-11', '11']}
    answer_text: '$x=-11$ or $x=11$.'
  - id: ch3-31-power-context
    section: '3.1'
    tier: F
    dfe: [N6]
    statement: 'A square has area $225\\text{ cm}^2$. Work out its side length.'
    answer_label: 'Find the side from the area'
    check: {kind: evaluate, expression: 'sqrt(225)', answer: '15'}
    answer_text: '$15\\text{ cm}$.'
  - id: ch3-31-higher-root
    section: '3.1'
    tier: H
    dfe: [N6]
    statement: 'Work out $\\sqrt[4]{625}$.'
    answer_label: 'Find a fourth root'
    check: {kind: evaluate, expression: '625**(1/4)', answer: '5'}
    answer_text: '$5$, because $5^4=625$.'
  - id: ch3-31-higher-equation
    section: '3.1'
    tier: H
    dfe: [N6]
    statement: 'Solve $x^3=-216$.'
    answer_label: 'Solve the cube equation'
    check: {kind: solve, equation: 'x**3=-216', variable: x, answer: ['-6']}
    answer_text: '$x=-6$.'

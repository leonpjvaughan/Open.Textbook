chapter: 12
symbols:
  x:
    real: true
  t:
    real: true
problems:
  -
    id: 'ch12-12.5-formula-1'
    section: '12.5'
    tier: 'H'
    dfe:
      - 'A18'
    statement: 'Solve $x^2-5x+2=0$ using the quadratic formula.'
    answer_label: 'Solve $x^2-5x+2=0$ using the quadratic formula.'
    check:
      kind: 'solve'
      equation: 'x**2-5*x+2 = 0'
      variable: 'x'
      answer:
        - '(5+sqrt(17))/2'
        - '(5-sqrt(17))/2'
    answer_text: '$x=(5+\sqrt{17})/2$ or $x=(5-\sqrt{17})/2$.'
  -
    id: 'ch12-12.5-formula-2'
    section: '12.5'
    tier: 'H'
    dfe:
      - 'A18'
    statement: 'Solve $2x^2+3x-2=0$ using the quadratic formula.'
    answer_label: 'Solve $2x^2+3x-2=0$ using the quadratic formula.'
    check:
      kind: 'solve'
      equation: '2*x**2+3*x-2 = 0'
      variable: 'x'
      answer:
        - '1/2'
        - '-2'
    answer_text: '$x=1/2$ or $x=-2$.'
  -
    id: 'ch12-12.5-disc-positive'
    section: '12.5'
    tier: 'H'
    dfe:
      - 'A18'
    statement: 'State the number of real roots of $x^2+2x-3=0$.'
    answer_label: 'State the number of real roots of $x^2+2x-3=0$.'
    check:
      kind: 'evaluate'
      expression: '2**2-4*1*(-3)'
      answer: '16'
    answer_text: 'Two real roots because the discriminant is positive.'
  -
    id: 'ch12-12.5-disc-zero'
    section: '12.5'
    tier: 'H'
    dfe:
      - 'A18'
    statement: 'State the number of real roots of $x^2-6x+9=0$.'
    answer_label: 'State the number of real roots of $x^2-6x+9=0$.'
    check:
      kind: 'evaluate'
      expression: '(-6)**2-4*1*9'
      answer: '0'
    answer_text: 'One repeated real root because the discriminant is zero.'
  -
    id: 'ch12-12.5-disc-negative'
    section: '12.5'
    tier: 'H'
    dfe:
      - 'A18'
    statement: 'State the number of real roots of $x^2+1=0$.'
    answer_label: 'State the number of real roots of $x^2+1=0$.'
    check:
      kind: 'evaluate'
      expression: '0**2-4*1*1'
      answer: '-4'
    answer_text: 'No real roots because the discriminant is negative.'
  -
    id: 'ch12-12.5-formula-6'
    section: '12.5'
    tier: 'H'
    dfe:
      - 'A18'
    statement: 'Solve $3x^2-2x-1=0$ using the quadratic formula.'
    answer_label: 'Solve $3x^2-2x-1=0$ using the quadratic formula.'
    check:
      kind: 'solve'
      equation: '3*x**2-2*x-1 = 0'
      variable: 'x'
      answer:
        - '1'
        - '-1/3'
    answer_text: '$x=1$ or $x=-1/3$.'
  -
    id: 'ch12-12.5-formula-7'
    section: '12.5'
    tier: 'H'
    dfe:
      - 'A18'
    statement: 'Solve $x^2+4x-1=0$ using the quadratic formula.'
    answer_label: 'Solve $x^2+4x-1=0$ using the quadratic formula.'
    check:
      kind: 'solve'
      equation: 'x**2+4*x-1 = 0'
      variable: 'x'
      answer:
        - '-2+sqrt(5)'
        - '-2-sqrt(5)'
    answer_text: '$x=-2+\sqrt5$ or $x=-2-\sqrt5$.'
  -
    id: 'ch12-12.5-formula-8'
    section: '12.5'
    tier: 'H'
    dfe:
      - 'A18'
    statement: 'Find the discriminant of $2x^2-4x+5=0$ and state the number of real roots.'
    answer_label: 'Find the discriminant of $2x^2-4x+5=0$ and state the number of real roots.'
    check:
      kind: 'evaluate'
      expression: '(-4)**2-4*2*5'
      answer: '-24'
    answer_text: 'The discriminant is $-24$, so there are no real roots.'

  -
    id: ch12-125-method-formula
    section: '12.5'
    tier: H
    dfe: [A18]
    statement: 'Solve $x^2-5x+6=0$. Which method fits better: factorising or the quadratic formula? Give a reason. Then solve it, and state the discriminant.'
    answer_label: 'Method choice: factorise or use the formula'
    check:
      kind: all
      checks:
        - kind: solve
          equation: x**2-5*x+6 = 0
          variable: x
          answer:
          - '2'
          - '3'
        - {kind: evaluate, expression: '(-5)**2-4*1*6', answer: '1'}
    answer_text: 'Factorising is quicker here: $(x-2)(x-3)=0$, so $x=2$ or $x=3$. The discriminant is $(-5)^2-4(1)(6)=1$, which is a perfect square, so the roots are rational.'

  answer_text: '$\frac{7}{20}=\frac{35}{100}=0.35.$'
- id: 'ch4-terminating'
  section: '4.4'
  tier: 'F'
  refs:
  - 'N10'
  statement: 'Work out $\frac{13}{40}$ as a decimal.'
  answer_label: 'Answer 3'
  check:
    'kind': 'evaluate'
    'expression': '13/40'
    'answer': '0.325'
  answer_text: '$\frac{13}{40}=\frac{325}{1000}=0.325.$'
- id: 'ch4-nonterm-check'
  section: '4.4'
  tier: 'F'
  refs:
  - 'N10'
  statement: 'Which fraction has a terminating decimal: $\frac{5}{12}$ or $\frac{7}{40}$? Give the decimal.'
  answer_label: 'Answer 4'
  check:
    'kind': 'evaluate'
    'expression': '7/40'
    'answer': '0.175'
  answer_text: '$\frac{7}{40}=0.175$; the denominator $40=2^3\times5$ gives a terminating decimal.'
- id: 'ch4-order-rep'
  section: '4.4'
  tier: 'F'
  refs:
  - 'N10'
  statement: 'Write $\frac{5}{8}$ and $0.61$ in order, smallest first.'
  answer_label: 'Answer 5'
  check:
    'kind': 'compare'
    'relation': '<'
    'lhs': '0.61'
    'rhs': '5/8'
  answer_text: '$\frac{5}{8}=0.625$, so $0.61<\frac{5}{8}$.'

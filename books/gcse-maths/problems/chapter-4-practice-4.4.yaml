- id: 'ch4-decimal-frac'
  section: '4.4'
  tier: 'F'
  refs:
  - 'N10'
  statement: 'Write $0.48$ as a fraction in its simplest form.'
  answer_label: 'Answer 1'
  check:
    'kind': 'evaluate'
    'expression': '48/100'
    'answer': '12/25'
  answer_text: '$0.48=\frac{48}{100}=\frac{12}{25}.$'
- id: 'ch4-fraction-dec'
  section: '4.4'
  tier: 'F'
  refs:
  - 'N10'
  statement: 'Write $\frac{7}{20}$ as a decimal.'
  answer_label: 'Answer 2'
  check:

# Identity and build metadata for this book.
#
# Everything a build needs that is not the content itself. The scaffold reads
# this to generate the docs tree and the book's tint; the portal reads it to build the landing
# page card; the hooks read the paths through the build's config.

id: gcse-maths
title: GCSE Mathematics (9-1)
qualification: GCSE
subject: Mathematics
order: 1
description: >-
  A complete, interactive GCSE Mathematics book for England, covering both
  Foundation and Higher tier.

boards: [AQA, Pearson Edexcel, OCR]

# One build per profile. `tier_filter` selects the tier hook's behaviour;
# `default` marks the profile the landing page links to first.
profiles:
  - id: higher
    name: Higher
    tier_filter: higher
    default: true
  - id: foundation
    name: Foundation
    tier_filter: foundation

# The tier axis for this book, for documentation and for the scaffold's stubs.
tier_axis:
  F: Foundation and Higher
  H: Higher only

# Verification oracles the banks in this book may use.
oracles: [sympy]

# This book's own theme, one variation per colour scheme. Set only what makes
# this book itself; everything else stays the house default in
# assets/stylesheets/extra.css. `accent` also tints the book's landing-page card
# in both schemes. Themable tokens: accent, accent_light, accent_dark,
# accent_ink, paper, ink, ink_soft, rule, link, code_bg, fig_warn, fig_good, fig_grid.
theme:
  light:
    accent: "#2f6690"
    accent_light: "#4a7fae"
    accent_dark: "#24506f"
  dark:
    accent: "#6ea8d8"
    accent_light: "#8cc0e8"
    accent_dark: "#4a7fae"

# Paths, relative to this directory.
curriculum: curriculum.yaml
banks: problems
booklet: booklet/gcse-maths.yaml
sources: sources.yaml

# Animated backgrounds: which one runs where. Nothing ships one — see
# engine/textbook/backgrounds.py for the scopes and the measured reasons — so
# every value here is null and the page merely declares what applies.
#
# The narrowest scope wins, so a chapter can set one for its sections and a
# section can switch it off again. An id that is not registered in
# `textbook.backgrounds.ANIMATIONS` fails the build rather than rendering
# nothing in production.
#
# backgrounds:
#   default: field            # every page of this book
#   chapters:
#     "5": field
#   sections:
#     "5.3": field            # ...and this one turns it off
#     "5.4": null

# A-level Physics (England) — chapter and section plan
#
# Single source of truth for the docs tree and for the scaffold.
#
# Shape follows books/a-level-maths/curriculum.yaml, with one structural
# feature — the TIER STORY: A-level has no Foundation/Higher axis. The chapters
# are a single body of content, so:
#   book.yaml → tier_axis: {}        (empty; there is no F/H distinction)
#   book.yaml → profiles: one entry   (a single build; no tier_filter)
#   section `tier:` is omitted everywhere.
# `tier` is optional in the curriculum schema for exactly this case: a book with
# no tier axis omits it, and a section that declares no tier belongs to every
# reader of that book.
#
# References: the DfE subject content is *GCE AS and A level subject content for
# biology, chemistry, physics and psychology* (April 2014), Appendix 3 (physics
# knowledge and understanding). Its areas are numbered paragraphs 37–45, so the
# coverage prefixes below index those paragraphs in order:
#
#   AP1  §37 common requirements (SI units, Newton's laws, estimation,
#            limitations of measurement)
#   AP2  §38 vectors and scalars
#   AP3  §39 mechanics
#   AP4  §40 mechanical properties of matter
#   AP5  §41 electric circuits
#   AP6  §42 waves
#   AP7  §43 matter
#   AP8  §44 quantum and nuclear physics
#   AP9  §45 fields
#
# There is no `year:` tag. The DfE marks the AS subset in the appendix in
# *non-bold* type, which a text extraction cannot recover, and the boards' own
# AS/A-level divisions differ; asserting a year would be a guess. The DfE does
# not number the individual statements of an area, so a reference such as `AP3`
# means the whole of the mechanics area. See sources.yaml for the document and
# the date it was checked.
#
# Board-specific *option* topics (AQA 3.9–3.13 Astrophysics, Medical physics,
# Engineering physics, Turning points in physics, Electronics) sit outside the
# common DfE core. They are deliberately out of scope for this board-neutral
# book and its shared booklet: a single common booklet must not present one
# board's option as another's. The limit is stated in this file, in the
# booklet's `meta.note` and in the reader-visible provenance strings, so the
# reader knows to use their own board's insert for an option. The boards'
# required practicals and the Practical Endorsement are documented in AGENTS.md.
#
# Anchors, learner-constructed relevance prompts and guided investigations are
# per-chapter authoring decisions (see AGENT-BRIEF.md) and are deliberately not
# fixed here; this file fixes coverage and sequence.

meta:
  title: A-level Physics
  jurisdiction: England
  awarding_bodies: [AQA 7408, Pearson Edexcel 9PH0, OCR H556]
  tiers: []                      # A-level has no tier axis; see the tier story above
  retrieved: 2026-10-11
  note: >-
    The DfE A-level physics content is a framework: Appendix 3 is nine numbered
    areas, and each board adds its own depth, breadth, contexts and optional
    topics. The chapter sequence here follows the DfE areas and is
    board-neutral. AQA's optional topics (3.9–3.13) and every board-only item
    are deliberately out of scope; the booklet carries the common core only, and
    says so in its `meta.note` and provenance. No `year` tag is asserted, because
    the DfE marks the AS subset in non-bold type and the boards' AS/A-level
    divisions differ. The DfE's 40% quantitative-skills weighting (physics) and
    the 15% practical weighting are assessment rules, not content; they are
    recorded in sources.yaml and AGENTS.md.

# Coverage: the reference ranges the scaffold checks and maps to sections.
# Each group is a DfE Appendix 3 paragraph number and its area.
coverage:
  - {prefix: AP, strand: physics, items: 9}

strands:
  - {id: foundations, title: Foundations of physics}
  - {id: mechanics, title: Mechanics}
  - {id: materials, title: Materials}
  - {id: electricity, title: Electricity}
  - {id: waves, title: Waves}
  - {id: matter, title: Thermal physics and matter}
  - {id: quantum, title: Quantum and nuclear physics}
  - {id: fields, title: Fields}

chapters:
  - id: 1
    title: Working scientifically and measurements
    strand: foundations
    summary: SI units and prefixes, estimation, the limits of measurement, and the treatment of readings and uncertainties.
    sections:
      - {id: "1.1", title: "SI units and prefixes", dfe: [AP1]}
      - {id: "1.2", title: "Estimation and the limitations of measurement", dfe: [AP1]}
      - {id: "1.3", title: "Measurements and uncertainties", dfe: [AP1]}

  - id: 2
    title: Vectors and scalars
    strand: mechanics
    summary: The vector-scalar distinction, resolving a vector into perpendicular components, and adding two vectors.
    sections:
      - {id: "2.1", title: "Scalars and vectors", dfe: [AP2]}
      - {id: "2.2", title: "Resolving and adding vectors", dfe: [AP2]}

  - id: 3
    title: Mechanics
    strand: mechanics
    summary: Kinematics and motion graphs, Newton's laws, work, energy and power, momentum, circular motion, and oscillations.
    sections:
      - {id: "3.1", title: "Kinematics and motion graphs", dfe: [AP3]}
      - {id: "3.2", title: "Dynamics and Newton's laws of motion", dfe: [AP3]}
      - {id: "3.3", title: "Work, energy and power", dfe: [AP3]}
      - {id: "3.4", title: "Momentum", dfe: [AP3]}
      - {id: "3.5", title: "Circular motion", dfe: [AP3]}
      - {id: "3.6", title: "Oscillations and simple harmonic motion", dfe: [AP3]}

  - id: 4
    title: Materials
    strand: materials
    summary: Stress, strain and the Young modulus, force-extension graphs, and the energy stored in a stretched material.
    sections:
      - {id: "4.1", title: "Stress, strain and the Young modulus", dfe: [AP4]}
      - {id: "4.2", title: "Force-extension graphs and stored energy", dfe: [AP4]}

  - id: 5
    title: Electric circuits
    strand: electricity
    summary: Current and charge, emf and internal resistance, resistance and resistivity, direct-current circuits, and capacitance.
    sections:
      - {id: "5.1", title: "Current, charge and emf", dfe: [AP5]}
      - {id: "5.2", title: "Resistance and resistivity", dfe: [AP5]}
      - {id: "5.3", title: "Direct-current circuits", dfe: [AP5]}
      - {id: "5.4", title: "Capacitance", dfe: [AP5]}

  - id: 6
    title: Waves
    strand: waves
    summary: Superposition and interference, path difference and coherence, diffraction and polarisation, and stationary waves.
    sections:
      - {id: "6.1", title: "Superposition and interference", dfe: [AP6]}
      - {id: "6.2", title: "Diffraction and polarisation", dfe: [AP6]}
      - {id: "6.3", title: "Stationary waves", dfe: [AP6]}

  - id: 7
    title: Thermal physics and matter
    strand: matter
    summary: Internal energy and specific heat capacity, changes of state, and the molecular kinetic theory of ideal gases.
    sections:
      - {id: "7.1", title: "Internal energy and specific heat capacity", dfe: [AP7]}
      - {id: "7.2", title: "Ideal gases and molecular kinetic theory", dfe: [AP7]}

  - id: 8
    title: Quantum and nuclear physics
    strand: quantum
    summary: The photon model and the photoelectric effect, wave-particle duality, radioactive decay and half-life, and nuclear energy.
    sections:
      - {id: "8.1", title: "Photons and the photoelectric effect", dfe: [AP8]}
      - {id: "8.2", title: "Wave-particle duality", dfe: [AP8]}
      - {id: "8.3", title: "Radioactive decay and half-life", dfe: [AP8]}
      - {id: "8.4", title: "Nuclear energy and E = mc²", dfe: [AP8]}

  - id: 9
    title: Fields
    strand: fields
    summary: Gravitational fields, electric fields and capacitors, magnetic fields, and electromagnetic induction.
    sections:
      - {id: "9.1", title: "Gravitational fields", dfe: [AP9]}
      - {id: "9.2", title: "Electric fields", dfe: [AP9]}
      - {id: "9.3", title: "Magnetic fields", dfe: [AP9]}
      - {id: "9.4", title: "Electromagnetic induction", dfe: [AP9]}

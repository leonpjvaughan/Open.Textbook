# A-level Physics data and formulae — source of truth.
#
# The three boards all provide a data-and-formulae booklet; no equation or
# constant must be memorised. `group` is one of:
#   given    - printed on the board's data-and-formulae booklet or data sheet
#   question - supplied inside the relevant question rather than on the sheet
#   know     - not given; the reader must have it (units, prefixes, symbols,
#              definitions, and the derivations the specification names)
#
# TRANSCRIPTION SCOPE. This file transcribes the CORE: the DfE Appendix 3 areas
# common to all three boards, plus the constants and particle data they all
# supply. Core equations are `given` for all three boards where the booklet or
# data sheet prints the same relationship. It does **not** yet transcribe the
# board-specific option-topic formulae (AQA 3.9–3.13, Edexcel topics 9–12 where
# they differ, OCR Modules 5–6 extras) or every board-only item; the board
# booklets are larger than the common core. That gap is recorded in meta.note and
# in todo.md, and must be closed before this booklet is presented as complete.
#
# Evidence: research/curriculum/physics-equations-and-data.md, the AQA insert
# (version 1.5), Edexcel specification Appendices 8 and 9 ("Students need not
# memorise formulae … supplied in each examination"), and OCR H556 Appendix 5c.
# See sources.yaml. The documents are all-rights-reserved; the booklet reproduces
# only what every candidate is given, which is the one use BOOKLETS.md requires.
meta:
  title: A-level Physics — data and formulae
  panel_title: Data & formulae
  short: Formulae
  tab_label: Formulae
  item_label: formulae
  search_placeholder: Search formulae…
  series: exams from 2026
  default_board: aqa
  tiered: false
  note: >-
    A-level physics has no national booklet: each board supplies its own data and
    formulae, and the boards' sets share a large common core. This booklet
    transcribes that core and the constants; it does not yet cover the
    board-specific option-topic formulae, which is a known gap rather than a
    claim that the boards provide only this much.
  provenance:
    aqa: "AQA A-level Physics data and formulae, version 1.5 (from the June 2017 series)"
    edexcel: "Pearson Edexcel 9PH0 specification, Appendices 8 (formulae) and 9 (data), Issue 3"
    ocr: "OCR A Level Physics A H556 specification, Appendix 5c (data sheet), Version 3.0"
  basis: >-
    No A-level physics equation or constant has to be memorised. AQA supplies its
    data-and-formulae insert with every paper; Edexcel states "Students need not
    memorise formulae for this qualification. The formulae below will be supplied
    in each examination."; OCR's Appendix 5c states the data sheet "will be
    printed for distribution with the examination papers". OCR additionally marks
    some printed equations, such as F = ma and E_k = ½mv², "Learners will also be
    expected to recall this equation"; those items carry that note. The 2026
    DfE/Ofqual decisions about memorising equations are GCSE-only and do not
    apply here.
  boards:
    aqa: {name: AQA, code: "7407/7408"}
    edexcel: {name: Edexcel, code: "9PH0"}
    ocr: {name: OCR, code: "H556"}
  groups:
    given: {label: "On your data and formulae", chip: Given, tone: accent}
    question: {label: "May be given in the question", chip: In question, tone: muted}
    know: {label: "You must know", chip: Must know, tone: warn}


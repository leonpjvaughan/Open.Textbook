# Practice set for 8.2 (Wave-particle duality).
#
# Both the questions and the answers on the page are rendered from these records:
# `:::problems` prints the numbered list, `:::answers` the solutions. The book
# declares `oracles: [sympy, units]`, so a check may use either.
#
# The de Broglie chain has a square root in it, and the units oracle does not
# evaluate function calls, so a wavelength that comes from sqrt(2mE) is proved by
# `approx` with a stated tolerance. A division with exact SI units (h / lambda) is
# proved by `dimensions`. A reason is a `structured` record: presence, order and
# coverage only, never physics.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): this proves the
# arithmetic and the dimensions, not the physics. A dimensionally consistent,
# arithmetically correct, physically absurd answer would pass.
chapter: 8
problems:
  - id: p1-electron-speed
    section: '8.2'
    dfe: [AP8]
    statement: 'An electron moves at 2.0e6 m/s. Find its de Broglie wavelength. The mass of an electron is 9.11e-31 kg.'
    answer_label: 'The de Broglie wavelength'
    check: {kind: approx, value: "6.63e-34 / (9.11e-31 * 2.0e6)", target: "3.64e-10", tolerance: "5e-12"}
    answer_text: '$p = mv = 1.82 \times 10^{-24}\,\text{kg}\,\text{m}\,\text{s}^{-1}$, so $\lambda = \dfrac{h}{p} = 3.6 \times 10^{-10}\,\text{m}$.'

  - id: p2-momentum-from-wavelength
    section: '8.2'
    dfe: [AP8]
    statement: 'An electron has a de Broglie wavelength of 1.0e-10 m. Find its momentum.'
    answer_label: 'The momentum'
    check:
      kind: dimensions
      expression: "h / lam"
      values:
        h: {value: "6.63e-34", unit: "J s"}
        lam: {value: "1.0e-10", unit: "m"}
      answer: {value: "6.63e-24", unit: "kg m s^-1"}
    answer_text: '$p = \dfrac{h}{\lambda} = \dfrac{6.63 \times 10^{-34}}{1.0 \times 10^{-10}} = 6.6 \times 10^{-24}\,\text{kg}\,\text{m}\,\text{s}^{-1}$.'

  - id: p3-electron-accelerated
    section: '8.2'
    dfe: [AP8]
    statement: 'An electron is accelerated through 500 V. Find its de Broglie wavelength.'
    answer_label: 'The de Broglie wavelength'
    check: {kind: approx, value: "6.63e-34 / sqrt(2 * 9.11e-31 * 500 * 1.60e-19)", target: "5.49e-11", tolerance: "5e-13"}
    answer_text: '$E_k = 8.0 \times 10^{-17}\,\text{J}$, then $p = \sqrt{2mE_k} = 1.21 \times 10^{-23}\,\text{kg}\,\text{m}\,\text{s}^{-1}$, so $\lambda = \dfrac{h}{p} = 5.5 \times 10^{-11}\,\text{m}$.'

  - id: p4-speed-from-wavelength
    section: '8.2'
    dfe: [AP8]
    statement: 'Find the speed of an electron whose de Broglie wavelength is 2.0e-10 m.'
    answer_label: 'The speed'
    check: {kind: approx, value: "6.63e-34 / (9.11e-31 * 2.0e-10)", target: "3.64e6", tolerance: "5e4"}
    answer_text: 'From $\lambda = \dfrac{h}{mv}$, $v = \dfrac{h}{m\lambda} = \dfrac{6.63 \times 10^{-34}}{9.11 \times 10^{-31} \times 2.0 \times 10^{-10}} = 3.6 \times 10^{6}\,\text{m}\,\text{s}^{-1}$.'

  - id: p5-everyday-object
    section: '8.2'
    dfe: [AP8]
    statement: 'Find the de Broglie wavelength of a 0.050 kg ball moving at 20 m/s.'
    answer_label: 'The de Broglie wavelength'
    check: {kind: approx, value: "6.63e-34 / (0.050 * 20)", target: "6.63e-34", tolerance: "1e-36"}
    answer_text: '$\lambda = \dfrac{h}{p} = \dfrac{6.63 \times 10^{-34}}{0.050 \times 20} = 6.6 \times 10^{-34}\,\text{m}$. This is far smaller than an atom, so it is never observed.'

  - id: p6-electron-diffraction-evidence
    section: '8.2'
    dfe: [AP8]
    statement: 'Describe the electron diffraction experiment, and explain how it shows that electrons have wave properties.'
    check:
      kind: structured
      requires: [electron-beam, graphite-target, rings, wavelength-matches]
      concepts: [de-broglie, diffraction]
      points:
        - id: electron-beam
          text: 'A beam of electrons is fired through a thin film of graphite, or at a crystal of nickel.'
          concepts: [de-broglie]
        - id: graphite-target
          text: 'The regular spacing of the atoms in the target acts like a diffraction grating.'
          concepts: [diffraction]
        - id: rings
          text: 'A pattern of concentric rings is recorded on a screen, which only waves can produce.'
          concepts: [diffraction]
        - id: wavelength-matches
          text: 'The ring spacing matches the de Broglie wavelength, $\lambda = h/p$, so electrons behave as waves.'
          concepts: [de-broglie]

  - id: p7-rings-and-voltage
    section: '8.2'
    dfe: [AP8]
    statement: 'In an electron diffraction tube, the rings move closer together when the accelerating voltage is increased. Explain why.'
    check:
      kind: structured
      requires: [higher-voltage, more-kinetic-energy, more-momentum, shorter-wavelength, smaller-angle]
      concepts: [de-broglie]
      points:
        - id: higher-voltage
          text: 'A larger accelerating voltage gives each electron more kinetic energy, because $E_k = eV$.'
          concepts: [de-broglie]
        - id: more-kinetic-energy
          text: 'More kinetic energy means more momentum, since $p = \sqrt{2mE_k}$.'
          concepts: [de-broglie]
        - id: more-momentum
          text: 'The de Broglie wavelength is $\lambda = h/p$, so a larger momentum gives a shorter wavelength.'
          concepts: [de-broglie]
        - id: shorter-wavelength
          text: 'A shorter wavelength diffracts through a smaller angle.'
          concepts: [de-broglie]
        - id: smaller-angle
          text: 'The rings therefore move closer together.'
          concepts: [de-broglie]

  - id: p8-proton-wavelength
    section: '8.2'
    dfe: [AP8]
    statement: 'Find the de Broglie wavelength of a proton moving at 1.0e6 m/s. The mass of a proton is 1.67e-27 kg.'
    answer_label: 'The de Broglie wavelength'
    check: {kind: approx, value: "6.63e-34 / (1.67e-27 * 1.0e6)", target: "3.97e-13", tolerance: "5e-15"}
    answer_text: '$\lambda = \dfrac{h}{mv} = \dfrac{6.63 \times 10^{-34}}{1.67 \times 10^{-27} \times 1.0 \times 10^{6}} = 4.0 \times 10^{-13}\,\text{m}$. It is much shorter than an electron wavelength at the same speed, because the proton is heavier.'

  - id: p9-photon-momentum
    section: '8.2'
    dfe: [AP8]
    statement: 'Find the momentum of a photon of wavelength 500 nm.'
    answer_label: 'The momentum'
    check:
      kind: dimensions
      expression: "h / lam"
      values:
        h: {value: "6.63e-34", unit: "J s"}
        lam: {value: "5.00e-7", unit: "m"}
      answer: {value: "1.326e-27", unit: "kg m s^-1"}
    answer_text: '$p = \dfrac{h}{\lambda} = \dfrac{6.63 \times 10^{-34}}{5.00 \times 10^{-7}} = 1.3 \times 10^{-27}\,\text{kg}\,\text{m}\,\text{s}^{-1}$.'

  - id: p10-voltage-from-wavelength
    section: '8.2'
    dfe: [AP8]
    statement: 'An electron has a de Broglie wavelength of 5.0e-11 m. Find the accelerating potential difference.'
    answer_label: 'The potential difference'
    check: {kind: approx, value: "(6.63e-34 / 5.0e-11)**2 / (2 * 9.11e-31 * 1.60e-19)", target: "603", tolerance: "5"}
    answer_text: '$p = \dfrac{h}{\lambda} = 1.33 \times 10^{-23}\,\text{kg}\,\text{m}\,\text{s}^{-1}$, then $E_k = \dfrac{p^2}{2m} = 9.65 \times 10^{-17}\,\text{J}$, so $V = \dfrac{E_k}{e} = 6.0 \times 10^{2}\,\text{V}$.'

  - id: p11-sigfigs
    section: '8.2'
    dfe: [AP8]
    statement: 'A de Broglie wavelength is calculated as 5.492e-11 m. Write it to three significant figures.'
    answer_label: 'The wavelength'
    check: {kind: sigfigs, value: "5.492e-11", figures: 3, answer: "5.49e-11", convention: round-once}
    answer_text: 'To three significant figures the wavelength is $5.49 \times 10^{-11}\,\text{m}$.'

  - id: p12-momentum-uncertainty
    section: '8.2'
    dfe: [AP8]
    statement: 'The mass of an electron is known to 0.10% and its speed to 3.0%. Find the percentage uncertainty in its momentum.'
    answer_label: 'The percentage uncertainty'
    check:
      kind: uncertainty
      combine: add-percentages
      terms:
        - {value: "9.11e-31", percentage: "0.10", power: 1}
        - {value: "2.0e6", percentage: "3.0", power: 1}
      result: "1.822e-24"
      uncertainty: "5.6482e-26"
    answer_text: 'Momentum is $p = mv$, a product. The percentage uncertainties add: $0.10\% + 3.0\% = 3.1\%$. With a momentum of $1.822 \times 10^{-24}\,\text{kg}\,\text{m}\,\text{s}^{-1}$, the absolute uncertainty is $5.6 \times 10^{-26}\,\text{kg}\,\text{m}\,\text{s}^{-1}$.'

  - id: p13-method-choice
    section: '8.2'
    dfe: [AP8]
    statement: 'A student must find the de Broglie wavelength of an electron. State which two quantities you would find first, and give the equations you would use.'
    check:
      kind: structured
      requires: [kinetic-energy, momentum, de-broglie]
      concepts: [de-broglie, method-choice]
      points:
        - id: kinetic-energy
          text: 'Find the kinetic energy first, from the accelerating voltage with $E_k = eV$.'
          concepts: [method-choice]
        - id: momentum
          text: 'Then find the momentum from $p = \sqrt{2mE_k}$.'
          concepts: [method-choice]
        - id: de-broglie
          text: 'Then use the de Broglie equation, $\lambda = h/p$, to find the wavelength.'
          concepts: [de-broglie]
    answer_text: 'Find the kinetic energy with $E_k = eV$, then the momentum with $p = \sqrt{2mE_k}$, then the wavelength with $\lambda = \dfrac{h}{p}$.'

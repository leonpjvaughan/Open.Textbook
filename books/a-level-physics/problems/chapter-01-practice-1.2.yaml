# Practice set for 1.2 (Estimation and the limitations of measurement).
#
# Both the questions and the answers on the page are rendered from these records.
# The arithmetic of an estimate is checked by `dimensions` or `evaluate`, and the
# rounding to the figures the estimate supports by `sigfigs`. Nothing here uses
# the uncertainty propagation of 1.3: the percentage rules come after this
# section, so this set compares raw uncertainties and divisions instead.
#
# The `structured` records prove only that a model answer contains the declared
# ideas in order and covers the declared concepts. Whether the reasoning is
# physically right is not something a computer can check, and the page says so.
chapter: 1
problems:
  - id: p1-estimate-air
    section: '1.2'
    refs: [AP1]
    statement: 'A classroom is $10\,\text{m}$ long, $6.0\,\text{m}$ wide and $2.5\,\text{m}$ high. The density of air is $1.2\,\text{kg}\,\text{m}^{-3}$. Estimate the mass of air in the room to one significant figure.'
    answer_label: 'The estimated mass of air'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "rho * V"
          values:
            rho: {value: "1.2", unit: "kg m^-3"}
            V: {value: "150", unit: "m^3"}
          answer: {value: "180", unit: "kg"}
        - {kind: sigfigs, value: "180", figures: 1, answer: "2e2", convention: round-once}
    answer_text: 'Volume $= 10 \times 6.0 \times 2.5 = 150\,\text{m}^3$. Mass $= \rho V = 1.2 \times 150 = 180\,\text{kg}$, which is $2 \times 10^2\,\text{kg}$ to one significant figure.'

  - id: p2-estimate-heartbeats
    section: '1.2'
    refs: [AP1]
    statement: 'Estimate the number of times a person heart beats in 70 years. Take the rate as 70 beats per minute, and give your answer to one significant figure.'
    answer_label: 'The estimated number of heartbeats'
    check:
      kind: all
      checks:
        - kind: evaluate
          expression: "70 * 60 * 24 * 365 * 70"
          answer: "2575440000"
        - {kind: sigfigs, value: "2575440000", figures: 1, answer: "3e9", convention: round-once}
    answer_text: '$70 \times 60 \times 24 \times 365 \times 70 = 2.6 \times 10^9$, so about $3 \times 10^9$ heartbeats to one significant figure. The estimate is only as good as the rate and the length of a year, so one figure is enough.'

  - id: p3-page-thickness
    section: '1.2'
    refs: [AP1]
    statement: 'A stack of 100 sheets of paper is $12\,\text{mm}$ thick. Find the thickness of one sheet, and say why a direct measurement of one sheet would be unreliable.'
    answer_label: 'The thickness of one sheet'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "d / n"
          values:
            d: {value: "12", unit: "mm"}
            n: {value: "100"}
          answer: {value: "0.12", unit: "mm"}
    answer_text: 'The thickness is $\dfrac{12}{100} = 0.12\,\text{mm}$. One sheet is thinner than the smallest division of a metre rule, so a direct reading would be dominated by the resolution of the rule. Measuring 100 sheets divides the reading uncertainty by 100.'

  - id: p4-resolution
    section: '1.2'
    refs: [AP1]
    statement: 'A metre rule has a smallest division of $1\,\text{mm}$. State the uncertainty in a single reading and explain why it is not zero.'
    answer_label: 'The uncertainty in one reading'
    check:
      kind: structured
      requires: [state-resolution, state-uncertainty, explain-why]
      concepts: [resolution, reading-uncertainty]
      points:
        - id: state-resolution
          text: 'The resolution of the rule is the smallest division, 1 mm.'
          concepts: [resolution]
        - id: state-uncertainty
          text: 'The uncertainty in a single reading is half the smallest division, so 0.5 mm.'
          concepts: [reading-uncertainty]
        - id: explain-why
          text: 'The true value could lie on either side of the mark, within half a division of it, so the reading has a limit.'
          concepts: [reading-uncertainty]

  - id: p5-accuracy-precision
    section: '1.2'
    refs: [AP1]
    statement: 'Two students each measure the diameter of the same wire five times. Student A gets readings that are all close together but about $0.20\,\text{mm}$ too large. Student B gets readings spread over $0.10\,\text{mm}$ that average the true value. Which student is more precise, and which is more accurate? Give a reason for each answer.'
    answer_label: 'Precision and accuracy'
    check:
      kind: structured
      requires: [precision, accuracy]
      concepts: [precision, accuracy, systematic-error]
      points:
        - id: precision
          text: 'Student B is more precise, because the repeated readings are closer together than Student A readings.'
          concepts: [precision]
        - id: accuracy
          text: 'Student B is also more accurate, because the mean is close to the true value. Student A has a systematic error of about 0.20 mm, so every reading is too large.'
          concepts: [accuracy, systematic-error]

  - id: p6-systematic-random
    section: '1.2'
    refs: [AP1]
    statement: 'Classify each error as systematic or random, and state one way to reduce it. (a) A top-pan balance reads $0.05\,\text{g}$ when the pan is empty. (b) A student reaction time when a stopwatch is started and stopped. (c) A thermometer is calibrated $0.5\,^\circ\text{C}$ too high.'
    answer_label: 'The type of each error'
    check:
      kind: structured
      requires: [zero-error, reaction-time, calibration]
      concepts: [systematic-error, random-error]
      points:
        - id: zero-error
          text: 'The empty balance error is systematic. Set the balance to read zero before the measurement, or subtract 0.05 g from every reading.'
          concepts: [systematic-error]
        - id: reaction-time
          text: 'The reaction time is random. Repeat the timing several times and use the mean.'
          concepts: [random-error]
        - id: calibration
          text: 'The thermometer calibration error is systematic. Check the thermometer against a known fixed point and correct every reading.'
          concepts: [systematic-error]

  - id: p7-timing-oscillations
    section: '1.2'
    refs: [AP1]
    statement: 'A stopwatch can be started and stopped with an uncertainty of about $0.2\,\text{s}$. A student times 20 oscillations in one measurement and divides by 20 to find the period. Work out the uncertainty in the period.'
    answer_label: 'The uncertainty in the period'
    check:
      kind: evaluate
      expression: "1/5 / 20"
      answer: "1/100"
    answer_text: 'The uncertainty in the total time is $0.2\,\text{s}$. Dividing the total time by 20 also divides its uncertainty by 20, so the uncertainty in the period is $\dfrac{0.2}{20} = 0.010\,\text{s}$.'

  - id: p8-instrument-choice
    section: '1.2'
    refs: [AP1]
    statement: 'You must measure the diameter of a wire that is about $0.30\,\text{mm}$ across. The instruments available are a metre rule (smallest division $1\,\text{mm}$), a vernier caliper (smallest division $0.1\,\text{mm}$) and a micrometer (smallest division $0.01\,\text{mm}$). Choose the instrument you would use, give a reason, and state the uncertainty in one reading.'
    answer_label: 'The instrument and its uncertainty'
    check:
      kind: structured
      requires: [choose-micrometer, reason-resolution, state-uncertainty]
      concepts: [resolution, instrument-choice]
      points:
        - id: choose-micrometer
          text: 'Use the micrometer, because its smallest division is much smaller than the diameter of the wire.'
          concepts: [instrument-choice]
        - id: reason-resolution
          text: 'The metre rule and caliper have a resolution that is too coarse for a 0.30 mm wire, so the percentage uncertainty would be large.'
          concepts: [resolution]
        - id: state-uncertainty
          text: 'The uncertainty in one micrometer reading is half the smallest division, 0.005 mm.'
          concepts: [resolution]

  - id: p9-earth-sun
    section: '1.2'
    refs: [AP1]
    statement: 'Estimate how many Earth diameters would fit across the Sun. The radius of the Earth is $6.4 \times 10^3\,\text{km}$ and the radius of the Sun is $7.0 \times 10^5\,\text{km}$. Give your answer to one significant figure.'
    answer_label: 'The estimate to one significant figure'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "700000 / 6400", answer: "875/8"}
        - {kind: sigfigs, value: "875/8", figures: 1, answer: "1e2", convention: round-once}
    answer_text: 'A diameter is twice a radius, and the factor of 2 cancels in the ratio. So $\dfrac{7.0 \times 10^5}{6.4 \times 10^3} = 1.09 \times 10^2$, which is about $1 \times 10^2$ to one significant figure.'

  - id: p10-bathtub-estimate
    section: '1.2'
    refs: [AP1]
    statement: 'You want to estimate the mass of water in a full bath. State the measurements you would take, estimate each one, and say which estimate is likely to give the largest percentage uncertainty in the mass.'
    answer_label: 'The measurements and the weakest estimate'
    check:
      kind: structured
      requires: [measure-dimensions, use-density, identify-dominant]
      concepts: [estimation, uncertainty]
      points:
        - id: measure-dimensions
          text: 'Estimate the length, the width and the depth of the water, and multiply them to get the volume.'
          concepts: [estimation]
        - id: use-density
          text: 'Multiply the volume by the density of water, 1000 kg m^-3, to get the mass.'
          concepts: [estimation]
        - id: identify-dominant
          text: 'The depth is the hardest to estimate, because the bath is not a simple rectangular box and the water level is not a clean edge, so it carries the largest percentage uncertainty.'
          concepts: [uncertainty]

  - id: p11-significant-figures
    section: '1.2'
    refs: [AP1]
    statement: 'A student calculates a speed as $2.876\,18\,\text{m}\,\text{s}^{-1}$ from measurements that are each known to two significant figures. Write the speed to the correct number of significant figures.'
    answer_label: 'The speed to the correct figures'
    check:
      kind: sigfigs
      value: "2.87618"
      figures: 2
      answer: "2.9"
      convention: round-once
    answer_text: 'The result can only be as precise as the least precise measurement, so the speed is $2.9\,\text{m}\,\text{s}^{-1}$ to two significant figures.'

  - id: p12-limits
    section: '1.2'
    refs: [AP1]
    statement: 'Explain why a measurement can never be exact. Use the words resolution, systematic error and random error.'
    answer_label: 'Why no measurement is exact'
    check:
      kind: structured
      requires: [resolution-limit, systematic-limit, random-limit]
      concepts: [resolution, systematic-error, random-error]
      points:
        - id: resolution-limit
          text: 'Every instrument has a resolution, so a reading can only be located to within part of the smallest division.'
          concepts: [resolution]
        - id: systematic-limit
          text: 'A systematic error shifts every reading in the same direction, so it is not removed by repeating the measurement.'
          concepts: [systematic-error]
        - id: random-limit
          text: 'A random error scatters the readings, so a single reading may be too high or too low. Repeating and averaging reduces its effect but does not remove it.'
          concepts: [random-error]

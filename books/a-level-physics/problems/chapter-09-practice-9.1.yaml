# Practice set for 9.1 (Gravitational fields).
#
# Both the questions and the answers on the page are rendered from these records:
# `:::problems` prints the numbered list, `:::answers` the solutions. The book
# declares `oracles: [sympy, units]`, so a check may use either.
#
# A value that uses G, a square root or a standard-form constant is proved by
# `approx` against a stated tolerance. A unit conversion is proved exactly by
# `convert`, a rounding by `sigfigs`, a propagation by `uncertainty`, and a reason
# by `structured` (presence, order and coverage only, never physics).
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): this proves the
# arithmetic and the dimensions, not the physics. A dimensionally consistent,
# arithmetically correct, physically absurd answer would pass.
chapter: 9
problems:
  - id: p1-force-two-masses
    section: '9.1'
    dfe: [AP9]
    statement: 'Two spheres, each of mass 1000 kg, are 2.0 m apart. Find the gravitational force between them.'
    answer_label: 'The gravitational force'
    check:
      kind: all
      checks:
        - {kind: approx, value: "6.67e-11 * 1000 * 1000 / 2.0**2", target: "1.67e-5", tolerance: "1e-7"}
        - kind: dimensions
          consistency: "F = G * M * m / r**2"
          units: {F: N, G: "m^3 kg^-1 s^-2", M: kg, m: kg, r: m}
    answer_text: '$F = \dfrac{GMm}{r^{2}} = \dfrac{6.67 \times 10^{-11} \times 1000 \times 1000}{2.0^{2}} = 1.7 \times 10^{-5}\,\text{N}$.'

  - id: p2-field-strength-mars
    section: '9.1'
    dfe: [AP9]
    statement: 'Mars has a mass of 6.42e23 kg and a radius of 3.39e6 m. Find the gravitational field strength at its surface.'
    answer_label: 'The field strength'
    check: {kind: approx, value: "6.67e-11 * 6.42e23 / 3.39e6**2", target: "3.73", tolerance: "0.02"}
    answer_text: '$g = \dfrac{GM}{r^{2}} = \dfrac{6.67 \times 10^{-11} \times 6.42 \times 10^{23}}{(3.39 \times 10^{6})^{2}} = 3.7\,\text{N}\,\text{kg}^{-1}$.'

  - id: p3-field-strength-ratio
    section: '9.1'
    dfe: [AP9]
    statement: 'The gravitational field strength at the Earth''s surface is 9.81 N/kg. Find its value at a distance of 3R from the centre, where R is the Earth''s radius.'
    answer_label: 'The field strength'
    check: {kind: approx, value: "9.81 / 3**2", target: "1.09", tolerance: "0.01"}
    answer_text: '$g \propto \dfrac{1}{r^{2}}$, so tripling the distance divides the field strength by 9: $g = \dfrac{9.81}{9} = 1.09\,\text{N}\,\text{kg}^{-1}$.'

  - id: p4-potential-mars
    section: '9.1'
    dfe: [AP9]
    statement: 'Using the mass and radius of Mars in question 2, find the gravitational potential at its surface.'
    answer_label: 'The gravitational potential'
    check: {kind: approx, value: "-6.67e-11 * 6.42e23 / 3.39e6", target: "-1.26e7", tolerance: "1e5"}
    answer_text: '$V = -\dfrac{GM}{R} = -\dfrac{4.28 \times 10^{13}}{3.39 \times 10^{6}} = -1.3 \times 10^{7}\,\text{J}\,\text{kg}^{-1}$.'

  - id: p5-orbital-speed
    section: '9.1'
    dfe: [AP9]
    statement: 'A satellite orbits the Earth in a circle of radius 7.0e6 m. Find its orbital speed.'
    answer_label: 'The orbital speed'
    check: {kind: approx, value: "sqrt(6.67e-11 * 5.97e24 / 7.0e6)", target: "7.54e3", tolerance: "10"}
    answer_text: '$v = \sqrt{\dfrac{GM}{r}} = \sqrt{\dfrac{3.98 \times 10^{14}}{7.0 \times 10^{6}}} = 7.5 \times 10^{3}\,\text{m}\,\text{s}^{-1}$.'

  - id: p6-orbital-period
    section: '9.1'
    dfe: [AP9]
    statement: 'Find the orbital period of the satellite in question 5.'
    answer_label: 'The period'
    check: {kind: approx, value: "2 * pi * 7.0e6 / sqrt(6.67e-11 * 5.97e24 / 7.0e6)", target: "5.83e3", tolerance: "20"}
    answer_text: '$T = \dfrac{2\pi r}{v} = \dfrac{2\pi \times 7.0 \times 10^{6}}{7.54 \times 10^{3}} = 5.8 \times 10^{3}\,\text{s}$, about 97 minutes.'

  - id: p7-kepler-ratio
    section: '9.1'
    dfe: [AP9]
    statement: 'Two satellites orbit the same planet. Their orbital radii are in the ratio 4:1. Find the ratio of their periods.'
    answer_label: 'The ratio of the periods'
    check:
      kind: all
      checks:
        - {kind: approx, value: "sqrt(4**3)", target: "8", tolerance: "0.01"}
        - kind: dimensions
          consistency: "r**3 / T**2 = G * M"
          units: {r: m, T: s, G: "m^3 kg^-1 s^-2", M: kg}
    answer_text: 'Since $\dfrac{r^{3}}{T^{2}}$ is constant, $T \propto r^{3/2}$. The ratio is $4^{3/2} = 8$, so the periods are in the ratio 8:1.'

  - id: p8-escape-speed-mars
    section: '9.1'
    dfe: [AP9]
    statement: 'Find the escape speed from the surface of Mars. Use its mass 6.42e23 kg and radius 3.39e6 m.'
    answer_label: 'The escape speed'
    check: {kind: approx, value: "sqrt(2 * 6.67e-11 * 6.42e23 / 3.39e6)", target: "5.03e3", tolerance: "20"}
    answer_text: '$v_{\text{esc}} = \sqrt{\dfrac{2GM}{R}} = \sqrt{\dfrac{8.56 \times 10^{13}}{3.39 \times 10^{6}}} = 5.0 \times 10^{3}\,\text{m}\,\text{s}^{-1}$.'

  - id: p9-energy-between-potentials
    section: '9.1'
    dfe: [AP9]
    statement: 'A 500 kg probe moves from a point where the gravitational potential is -4.0e7 J/kg to a point where it is -2.0e7 J/kg. Find the energy needed.'
    answer_label: 'The energy needed'
    check: {kind: approx, value: "500 * ((-2.0e7) - (-4.0e7))", target: "1.0e10", tolerance: "1e8"}
    answer_text: '$\Delta V = (-2.0 \times 10^{7}) - (-4.0 \times 10^{7}) = 2.0 \times 10^{7}\,\text{J}\,\text{kg}^{-1}$, so $E = m\Delta V = 500 \times 2.0 \times 10^{7} = 1.0 \times 10^{10}\,\text{J}$.'

  - id: p10-method-orbital-speed
    section: '9.1'
    dfe: [AP9]
    statement: 'A satellite moves in a circular orbit of radius r around a planet of mass M. State which equation you would use to find its speed, and why.'
    check:
      kind: structured
      requires: [gravitational-force, centripetal-force, cancel-mass, square-root]
      concepts: [orbital-motion, gravitational-force]
      points:
        - id: gravitational-force
          text: 'The gravitational force on the satellite is $\dfrac{GMm}{r^{2}}$.'
          concepts: [gravitational-force]
        - id: centripetal-force
          text: 'The centripetal force needed for the circular orbit is $\dfrac{mv^{2}}{r}$.'
          concepts: [orbital-motion]
        - id: cancel-mass
          text: 'Set the two forces equal. The mass of the satellite cancels, so the speed does not depend on it.'
          concepts: [orbital-motion]
        - id: square-root
          text: 'Rearranging gives $v = \sqrt{\dfrac{GM}{r}}$.'
          concepts: [orbital-motion]

  - id: p11-uncertainty-potential-difference
    section: '9.1'
    dfe: [AP9]
    statement: 'The gravitational potential at the surface of the Earth is -6.25e7 J/kg with an uncertainty of 5.0e5 J/kg. At the orbit it is -5.88e7 J/kg with an uncertainty of 5.0e5 J/kg. Find the potential difference and its absolute uncertainty.'
    answer_label: 'The potential difference and its uncertainty'
    check:
      kind: uncertainty
      combine: add-absolutes
      terms:
        - {value: "-5.88e7", absolute: "5.0e5"}
        - {value: "6.25e7", absolute: "5.0e5"}
      result: "3.7e6"
      uncertainty: "1.0e6"
    answer_text: 'The difference is $(-5.88 \times 10^{7}) - (-6.25 \times 10^{7}) = 3.7 \times 10^{6}\,\text{J}\,\text{kg}^{-1}$. For a difference the absolute uncertainties add: $5.0 \times 10^{5} + 5.0 \times 10^{5} = 1.0 \times 10^{6}\,\text{J}\,\text{kg}^{-1}$. So the difference is $(3.7 \pm 1.0) \times 10^{6}\,\text{J}\,\text{kg}^{-1}$.'

  - id: p12-escape-speed-2sf
    section: '9.1'
    dfe: [AP9]
    statement: 'The escape speed from Mars is 5026 m/s. Write it to two significant figures.'
    answer_label: 'The escape speed to two significant figures'
    check:
      kind: sigfigs
      convention: round-once
      value: "5026"
      figures: 2
      answer: "5.0e3"
    answer_text: '$5026\,\text{m}\,\text{s}^{-1}$ is $5.0 \times 10^{3}\,\text{m}\,\text{s}^{-1}$ to two significant figures. The trailing zero is shown in scientific notation so that the two figures are clear.'

  - id: p13-convert-height
    section: '9.1'
    dfe: [AP9]
    statement: 'The spacecraft orbits at a height of 400 km. Write this height in metres.'
    answer_label: 'The height in metres'
    check: {kind: convert, value: "400", from: "km", to: "m", answer: "4.0e5"}
    answer_text: '$400\,\text{km} = 400 \times 10^{3}\,\text{m} = 4.0 \times 10^{5}\,\text{m}$.'

  - id: p14-energy-lift-satellite
    section: '9.1'
    dfe: [AP9]
    statement: 'A 1200 kg satellite is lifted from the Earth''s surface, where the potential is -6.25e7 J/kg, to a higher orbit where the potential is -5.88e7 J/kg. Find the energy needed.'
    answer_label: 'The energy needed'
    check: {kind: approx, value: "1200 * ((-5.88e7) - (-6.25e7))", target: "4.44e9", tolerance: "1e8"}
    answer_text: '$\Delta V = 3.7 \times 10^{6}\,\text{J}\,\text{kg}^{-1}$, so $E = m\Delta V = 1200 \times 3.7 \times 10^{6} = 4.4 \times 10^{9}\,\text{J}$. This is the energy to lift the satellite against gravity. The extra energy to give it orbital speed is not included.'

# Practice set for 2.2 (Resolving and adding vectors).
#
# Both the questions and the answers on the page are rendered from these records:
# `:::problems` prints the numbered list, `:::answers` the solutions. The book
# declares `oracles: [sympy, units]` in book.yaml, so a check may use either.
#
# A single vector resolved into two perpendicular components is checked by
# `resolve` with `components-from-magnitude-and-angle`; two perpendicular vectors
# combined are checked by the inverse relation. `resolve` compares each answer
# against the exact trigonometric value with a stated tolerance. The mathematical
# vocabulary also fits here: a scalar multiple of a vector uses the SymPy `vector`
# kind, a magnitude uses its `norm`, and a non-exact direction uses `approx`.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): this proves the
# arithmetic and the dimensions, not the physics. A dimensionally consistent,
# arithmetically correct, physically absurd answer would pass. The `structured`
# records at the end prove only that a model answer contains the declared ideas,
# not that the reasoning is right, and the page says so.
chapter: 2
problems:
  - id: p1-resolve-50n-30
    section: '2.2'
    refs: [AP2]
    statement: 'A force of $50\,\text{N}$ acts at $30^\circ$ to the horizontal. Find its horizontal and vertical components.'
    answer_label: 'The two perpendicular components'
    check:
      kind: resolve
      relation: components-from-magnitude-and-angle
      magnitude: "50"
      angle_deg: "30"
      components: {x: "43.3", y: "25.0"}
    answer_text: 'The horizontal component is $50\cos 30^\circ = 43.3\,\text{N}$. The vertical component is $50\sin 30^\circ = 25.0\,\text{N}$.'

  - id: p2-resolve-100-75
    section: '2.2'
    refs: [AP2]
    statement: 'A projectile is launched at $100\,\text{m}\,\text{s}^{-1}$ at $75^\circ$ above the horizontal. Find the horizontal and vertical components of its velocity.'
    answer_label: 'The two components of the velocity'
    check:
      kind: resolve
      relation: components-from-magnitude-and-angle
      magnitude: "100"
      angle_deg: "75"
      components: {x: "25.9", y: "96.6"}
    answer_text: 'Horizontal component $= 100\cos 75^\circ = 25.9\,\text{m}\,\text{s}^{-1}$. Vertical component $= 100\sin 75^\circ = 96.6\,\text{m}\,\text{s}^{-1}$.'

  - id: p3-components-to-vector
    section: '2.2'
    refs: [AP2]
    statement: 'A vector has an $x$-component of $-5.0\,\text{m}$ and a $y$-component of $-12.0\,\text{m}$. Find its magnitude and its direction, measured anticlockwise from the positive $x$-axis.'
    answer_label: 'The magnitude and direction'
    check:
      kind: resolve
      relation: magnitude-and-angle-from-components
      components: {x: "-5.0", y: "-12.0"}
      magnitude: "13.0"
      angle_deg: "247.4"
    answer_text: 'Magnitude $= \sqrt{(-5.0)^2 + (-12.0)^2} = 13.0\,\text{m}$. Both components are negative, so the vector points into the third quadrant: $\theta = 180^\circ + \tan^{-1}\!\left(\dfrac{12.0}{5.0}\right) = 247.4^\circ$.'

  - id: p4-resultant-9-40
    section: '2.2'
    refs: [AP2]
    statement: 'Two forces act at right angles. One force is $9.0\,\text{N}$ and the other is $40\,\text{N}$. Find the magnitude and direction of the resultant force.'
    answer_label: 'The resultant force'
    check:
      kind: resolve
      relation: magnitude-and-angle-from-components
      components: {x: "9.0", y: "40"}
      magnitude: "41"
      angle_deg: "77.3"
    answer_text: 'Magnitude $= \sqrt{9.0^2 + 40^2} = 41\,\text{N}$. Direction $= \tan^{-1}\!\left(\dfrac{40}{9.0}\right) = 77.3^\circ$ from the $9.0\,\text{N}$ force.'

  - id: p5-slope-600n
    section: '2.2'
    refs: [AP2]
    statement: 'A block of weight $600\,\text{N}$ rests on a slope that makes $15^\circ$ with the horizontal. Resolve the weight into a component along the slope and a component perpendicular to the slope.'
    answer_label: 'The two components of the weight'
    check:
      kind: resolve
      relation: components-from-magnitude-and-angle
      magnitude: "600"
      angle_deg: "75"
      components: {x: "155.3", y: "579.6"}
    answer_text: 'The weight makes $75^\circ$ with the along-slope direction, so the component along the slope is $600\cos 75^\circ = 155.3\,\text{N}$, which equals $600\sin 15^\circ$. The perpendicular component is $600\sin 75^\circ = 579.6\,\text{N}$, which equals $600\cos 15^\circ$.'

  - id: p6-resolve-200-135
    section: '2.2'
    refs: [AP2]
    statement: 'A force of $200\,\text{N}$ acts at $135^\circ$ from the positive $x$-axis. Find its $x$-component and its $y$-component, including the sign of each.'
    answer_label: 'The two components, with signs'
    check:
      kind: resolve
      relation: components-from-magnitude-and-angle
      magnitude: "200"
      angle_deg: "135"
      components: {x: "-141.4", y: "141.4"}
    answer_text: 'The $x$-component is $200\cos 135^\circ = -141.4\,\text{N}$. The $y$-component is $200\sin 135^\circ = +141.4\,\text{N}$. The force points into the second quadrant, so the $x$-component is negative.'

  - id: p7-ferry-resultant
    section: '2.2'
    refs: [AP2]
    statement: 'A ferry points straight across a river at $4.0\,\text{m}\,\text{s}^{-1}$. The current flows at $3.0\,\text{m}\,\text{s}^{-1}$ at right angles to the crossing. Find the ferry velocity over the ground, as a magnitude and a direction.'
    answer_label: 'The velocity over the ground'
    check:
      kind: resolve
      relation: magnitude-and-angle-from-components
      components: {x: "4.0", y: "3.0"}
      magnitude: "5.0"
      angle_deg: "36.9"
    answer_text: 'Magnitude $= \sqrt{4.0^2 + 3.0^2} = 5.0\,\text{m}\,\text{s}^{-1}$. Direction $= \tan^{-1}\!\left(\dfrac{3.0}{4.0}\right) = 36.9^\circ$ from the line straight across, on the downstream side.'

  - id: p8-find-the-angle
    section: '2.2'
    refs: [AP2]
    statement: 'A force of $12\,\text{N}$ has a horizontal component of $8.0\,\text{N}$ and an upward vertical component. Find the angle the force makes with the horizontal, and the vertical component.'
    answer_label: 'The angle and the vertical component'
    check:
      kind: resolve
      relation: components-from-magnitude-and-angle
      magnitude: "12"
      angle_deg: "48.19"
      components: {x: "8.0", y: "8.9"}
    answer_text: 'From $\cos\theta = \dfrac{8.0}{12} = 0.667$, the angle is $\theta = 48.2^\circ$. The vertical component is $12\sin 48.2^\circ = 8.9\,\text{N}$.'

  - id: p9-plane-ground-velocity
    section: '2.2'
    refs: [AP2]
    statement: 'A plane flies due east through the air at $60\,\text{m}\,\text{s}^{-1}$. A wind blows due north at $20\,\text{m}\,\text{s}^{-1}$. Find the velocity of the plane over the ground, as a magnitude and a direction.'
    answer_label: 'The velocity over the ground'
    check:
      kind: resolve
      relation: magnitude-and-angle-from-components
      components: {x: "60", y: "20"}
      magnitude: "63.2"
      angle_deg: "18.4"
    answer_text: 'The two velocities are at right angles. Magnitude $= \sqrt{60^2 + 20^2} = 63.2\,\text{m}\,\text{s}^{-1}$. Direction $= \tan^{-1}\!\left(\dfrac{20}{60}\right) = 18.4^\circ$ north of east.'

  - id: p10-scalar-multiple
    section: '2.2'
    refs: [AP2]
    statement: 'A displacement is $(4.0, -2.0)\,\text{m}$. Find the displacement $3.0$ times larger in the same direction.'
    answer_label: 'The scaled displacement'
    check:
      kind: vector
      op: scale
      args: ["3.0", "Matrix([4.0, -2.0])"]
      answer: "Matrix([12.0, -6.0])"
    answer_text: 'Multiplying a vector by a positive scalar multiplies each component by that scalar: $3.0 \times (4.0, -2.0) = (12.0, -6.0)\,\text{m}$. The direction is unchanged, and the magnitude is three times larger.'

  - id: p11-method-choice
    section: '2.2'
    refs: [AP2]
    statement: 'Two forces act on a point at $50^\circ$ to each other. Explain which method you would use to find the resultant, and why a calculation with Pythagoras on its own is not enough.'
    answer_label: 'The method and its reason'
    check:
      kind: structured
      requires: [angle-not-right, scale-drawing]
      concepts: [resultant, scale-drawing]
      points:
        - id: angle-not-right
          text: 'The two forces are not at right angles, so the resultant cannot be found from Pythagoras alone. The triangle formed by the two forces has no right angle.'
          concepts: [resultant]
        - id: scale-drawing
          text: 'Draw the two forces head to tail as a scale drawing, choose a scale such as 1 cm to 10 N, and measure the resultant with a ruler and a protractor.'
          concepts: [scale-drawing]
    answer_text: 'The forces are not at right angles, so Pythagoras does not apply directly. Draw them head to tail to scale and measure the resultant. A calculation by resolving each force into components also works, but it is longer than a careful scale drawing for two forces.'

  - id: p12-magnitude-direction
    section: '2.2'
    refs: [AP2]
    statement: 'A displacement has components $5.0\,\text{m}$ east and $12.0\,\text{m}$ north. Find its magnitude and the angle it makes with the eastward direction.'
    answer_label: 'The magnitude and the angle'
    check:
      kind: all
      checks:
        - kind: vector
          op: norm
          args: ["Matrix([5.0, 12.0])"]
          answer: "13.0"
        - {kind: approx, value: "atan(12/5) * 180 / pi", target: "67.4", tolerance: "0.05"}
    answer_text: 'Magnitude $= \sqrt{5.0^2 + 12.0^2} = 13.0\,\text{m}$. The angle from the eastward direction is $\tan^{-1}\!\left(\dfrac{12}{5.0}\right) = 67.4^\circ$ north of east.'

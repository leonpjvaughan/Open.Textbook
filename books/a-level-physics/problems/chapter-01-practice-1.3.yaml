# Practice set for 1.3 (Measurements and uncertainties).
#
# Both the questions and the answers on the page are rendered from these records.
# The uncertainty rules are the ones the pages teach, and the check names the rule
# it enforces: a mean of repeats uses `convention: half-range`; a sum or a
# difference uses `combine: add-absolutes`; a product, a quotient or a power uses
# `combine: add-percentages`. A record that named no rule would be unverifiable,
# so the verifier rejects it.
#
# Honest limit (physics-verifier-gaps.md §6): the verifier proves the arithmetic
# against the declared convention. It does not prove that the convention matches a
# board mark scheme, because no machine-readable mark scheme exists.
chapter: 1
problems:
  - id: p1-mean-half-range
    section: '1.3'
    refs: [AP1]
    statement: 'A student measures the diameter of a wire four times and records $2.14\,\text{mm}$, $2.16\,\text{mm}$, $2.15\,\text{mm}$ and $2.12\,\text{mm}$. Find the mean and the uncertainty using the half-range convention.'
    answer_label: 'The mean and its uncertainty'
    check:
      kind: uncertainty
      mean_of: ["2.14", "2.16", "2.15", "2.12"]
      convention: half-range
      answer: "2.1425"
      uncertainty: "0.02"
    answer_text: 'The mean is $\dfrac{2.14 + 2.16 + 2.15 + 2.12}{4} = 2.1425\,\text{mm}$. The range is $2.16 - 2.12 = 0.04\,\text{mm}$, so the uncertainty is half the range, $0.02\,\text{mm}$. The uncertainty is quoted to one significant figure and the value to the same decimal place, so the diameter is $2.14 \pm 0.02\,\text{mm}$.'

  - id: p2-percentage-uncertainty
    section: '1.3'
    refs: [AP1]
    statement: 'A length is measured as $0.542\,\text{m}$ with an uncertainty of $0.001\,\text{m}$. Calculate the percentage uncertainty.'
    answer_label: 'The percentage uncertainty'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "100 / 542", answer: "50/271"}
        - {kind: sigfigs, value: "50/271", figures: 2, answer: "0.18", convention: round-once}
    answer_text: 'The percentage uncertainty is $\dfrac{0.001}{0.542} \times 100\% = 0.18\%$ to two significant figures.'

  - id: p3-add-absolutes
    section: '1.3'
    refs: [AP1]
    statement: 'The length of a pendulum is found from two metre-rule readings: $0.000\,\text{m}$ at the pivot and $0.800\,\text{m}$ at the centre of the bob. Each reading has an uncertainty of $0.0005\,\text{m}$. Find the length and the uncertainty in the length.'
    answer_label: 'The length and its uncertainty'
    check:
      kind: uncertainty
      combine: add-absolutes
      terms:
        - {value: "0.800", absolute: "0.0005"}
        - {value: "0.000", absolute: "0.0005"}
      result: "0.800"
      uncertainty: "0.001"
    answer_text: 'The length is $0.800 - 0.000 = 0.800\,\text{m}$. A difference adds the absolute uncertainties, so the uncertainty is $0.0005 + 0.0005 = 0.001\,\text{m}$. The length is $0.800 \pm 0.001\,\text{m}$.'

  - id: p4-percentage-cylinder
    section: '1.3'
    refs: [AP1]
    statement: 'A cylinder has radius $r = 2.50\,\text{cm}$ with a percentage uncertainty of $1.2\%$, and height $h = 6.00\,\text{cm}$ with a percentage uncertainty of $0.8\%$. Find the percentage uncertainty in the volume $V = \pi r^2 h$.'
    answer_label: 'The percentage uncertainty in the volume'
    check:
      kind: uncertainty
      combine: add-percentages
      terms:
        - {value: "2.50", percentage: "1.2", power: 2}
        - {value: "6.00", percentage: "0.8"}
      result: "37.5"
      uncertainty: "1.2"
    answer_text: 'The constant $\pi$ has no uncertainty, so it does not add any. The radius appears squared, so its percentage uncertainty is doubled: $2 \times 1.2\% = 2.4\%$. Add the height: $2.4\% + 0.8\% = 3.2\%$.'

  - id: p5-percentage-quotient
    section: '1.3'
    refs: [AP1]
    statement: 'The density of a liquid is found from $\rho = \dfrac{m}{V}$. The mass is $25.6 \pm 0.1\,\text{g}$ and the volume is $10.0 \pm 0.2\,\text{cm}^3$. Find the density and its absolute uncertainty.'
    answer_label: 'The density and its absolute uncertainty'
    check:
      kind: uncertainty
      combine: add-percentages
      terms:
        - {value: "25.6", percentage: "0.390625"}
        - {value: "1/10", percentage: "2.0"}
      result: "2.56"
      uncertainty: "0.0612"
    answer_text: 'The percentage uncertainty in the mass is $\dfrac{0.1}{25.6} \times 100\% = 0.39\%$. In the volume it is $\dfrac{0.2}{10.0} \times 100\% = 2.0\%$. For a quotient, add the percentages: $0.39\% + 2.0\% = 2.4\%$. The density is $\dfrac{25.6}{10.0} = 2.56\,\text{g}\,\text{cm}^{-3}$, so its absolute uncertainty is $2.56 \times 0.024 = 0.06\,\text{g}\,\text{cm}^{-3}$. The density is $2.56 \pm 0.06\,\text{g}\,\text{cm}^{-3}$.'

  - id: p6-quote-a-result
    section: '1.3'
    refs: [AP1]
    statement: 'A measurement gives $E = 12.345\,\text{J}$ with an uncertainty of $0.2\,\text{J}$. Write the result in the correct form.'
    answer_label: 'The result in the correct form'
    check:
      kind: sigfigs
      value: "12.345"
      figures: 3
      answer: "12.3"
      convention: round-once
    answer_text: 'The uncertainty is $0.2\,\text{J}$ to one significant figure. The value is quoted to the same decimal place, so $E = 12.3 \pm 0.2\,\text{J}$.'

  - id: p7-agreement
    section: '1.3'
    refs: [AP1]
    statement: 'A student measures the acceleration due to gravity as $9.80 \pm 0.04\,\text{m}\,\text{s}^{-2}$. The accepted value is $9.81\,\text{m}\,\text{s}^{-2}$. Does the measurement agree with the accepted value? Give a reason.'
    answer_label: 'Whether the results agree'
    check:
      kind: structured
      requires: [state-interval, state-conclusion]
      concepts: [uncertainty-interval, agreement]
      points:
        - id: state-interval
          text: 'The measured value could lie between 9.76 and 9.84 m s^-2.'
          concepts: [uncertainty-interval]
        - id: state-conclusion
          text: 'The accepted value 9.81 m s^-2 lies inside that range, so the measurement agrees with it within the stated uncertainty.'
          concepts: [agreement]

  - id: p8-short-pendulum
    section: '1.3'
    refs: [AP1]
    statement: 'A pendulum has length $0.400\,\text{m}$. Its period is measured as $1.27\,\text{s}$. Use $g = \dfrac{4\pi^2 L}{T^2}$ to find the acceleration due to gravity.'
    answer_label: 'The value of g'
    check:
      kind: approx
      value: "4 * pi**2 * (2/5) / ((127/100)**2)"
      target: "9.79"
      tolerance: "0.01"
    answer_text: '$g = \dfrac{4\pi^2 \times 0.400}{1.27^2} = 9.79\,\text{m}\,\text{s}^{-2}$ to three significant figures.'

  - id: p9-stone-density-method
    section: '1.3'
    refs: [AP1]
    statement: 'You must find the density of a small irregular stone. State which measurements you would take, which instrument you would use for each, and how you would obtain the uncertainty in the density.'
    answer_label: 'The measurements and the uncertainty'
    check:
      kind: structured
      requires: [measure-mass, measure-volume, combine-uncertainties]
      concepts: [instrument-choice, uncertainty-propagation]
      points:
        - id: measure-mass
          text: 'Measure the mass on a top-pan balance, and use the balance resolution to find the uncertainty in the mass.'
          concepts: [instrument-choice]
        - id: measure-volume
          text: 'Find the volume from the volume of water displaced in a measuring cylinder, reading the level before and after the stone is added. The two readings each carry half the smallest division, and the uncertainties add.'
          concepts: [instrument-choice]
        - id: combine-uncertainties
          text: 'The density is mass divided by volume, so find the percentage uncertainty in each and add them to get the percentage uncertainty in the density.'
          concepts: [uncertainty-propagation]

  - id: p10-timing-percentage
    section: '1.3'
    refs: [AP1]
    statement: 'A student times 20 oscillations three times and records $35.90\,\text{s}$, $35.85\,\text{s}$ and $35.95\,\text{s}$. Find the mean time, its uncertainty, and the percentage uncertainty in the mean.'
    answer_label: 'The mean time and its percentage uncertainty'
    check:
      kind: all
      checks:
        - kind: uncertainty
          mean_of: ["35.90", "35.85", "35.95"]
          convention: half-range
          answer: "35.90"
          uncertainty: "0.05"
        - {kind: evaluate, expression: "100 * (1/20) / (359/10)", answer: "50/359"}
        - {kind: sigfigs, value: "50/359", figures: 2, answer: "0.14", convention: round-once}
    answer_text: 'The mean is $\dfrac{35.90 + 35.85 + 35.95}{3} = 35.90\,\text{s}$. The range is $0.10\,\text{s}$, so the uncertainty is half the range, $0.05\,\text{s}$. The percentage uncertainty is $\dfrac{0.05}{35.90} \times 100\% = 0.14\%$ to two significant figures.'

  - id: p11-small-percentage
    section: '1.3'
    refs: [AP1]
    statement: 'A student says: "A smaller percentage uncertainty always means a more accurate result." Explain why this is not always true.'
    answer_label: 'Why a small uncertainty is not the same as accuracy'
    check:
      kind: structured
      requires: [uncertainty-random, systematic-not-shown]
      concepts: [percentage-uncertainty, systematic-error, accuracy]
      points:
        - id: uncertainty-random
          text: 'Percentage uncertainty measures the random scatter in the readings, so repeating the measurement can make it smaller.'
          concepts: [percentage-uncertainty, accuracy]
        - id: systematic-not-shown
          text: 'A systematic error shifts every reading in the same direction and is not reduced by repeating. A precise set of readings can therefore still be a long way from the true value.'
          concepts: [systematic-error, accuracy]

  - id: p12-sum-uncertainty
    section: '1.3'
    refs: [AP1]
    statement: 'The mass of an empty beaker is $52.4 \pm 0.1\,\text{g}$. The mass of the beaker and the water is $128.7 \pm 0.1\,\text{g}$. Find the mass of the water and its uncertainty.'
    answer_label: 'The mass of water and its uncertainty'
    check:
      kind: uncertainty
      combine: add-absolutes
      terms:
        - {value: "128.7", absolute: "0.1"}
        - {value: "-52.4", absolute: "0.1"}
      result: "76.3"
      uncertainty: "0.2"
    answer_text: 'The mass of water is $128.7 - 52.4 = 76.3\,\text{g}$. A difference adds the absolute uncertainties, so the uncertainty is $0.1 + 0.1 = 0.2\,\text{g}$. The mass is $76.3 \pm 0.2\,\text{g}$.'

# Support bank for Chapter 7 (Thermal physics and matter).
#
# This bank holds the records behind the Learn worked examples, the Practise with
# help problems, the warm-up recalls, the Progress checks and the chapter
# problem. It is not printed by a marker: the pages hand-write the teaching, and
# every final answer here is checked independently, so a wrong worked step cannot
# ship unnoticed.
#
# The book declares `oracles: [sympy, units]`. A value that is exact and carries
# a unit is checked by `dimensions`, which keeps the unit arithmetic exact. A
# value that needs a square root or another irrational step is checked by
# `approx` against a stated tolerance. A reason is a `structured` record:
# presence, order and coverage only, never physics.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): this proves the
# arithmetic and the dimensions, not the physics. A dimensionally consistent,
# arithmetically correct, physically absurd answer would pass.
chapter: 7
problems:
  # --- Section 7.1, the Learn worked examples --------------------------------
  - id: w1-heating-water
    plays: thermal-energy
    section: '7.1'
    dfe: [AP7]
    statement: 'A pressure cooker holds 1.50 kg of water at 20 C. The specific heat capacity of water is 4200 J/kg/K. Find the energy needed to heat the water to 121 C.'
    answer_label: 'The energy supplied'
    check:
      kind: dimensions
      expression: "m * c * dtheta"
      values:
        m: {value: "1.50", unit: "kg"}
        c: {value: "4200", unit: "J kg^-1 K^-1"}
        dtheta: {value: "101", unit: "K"}
      answer: {value: "636300", unit: "J"}
    answer_text: '$E = mc\Delta\theta = 1.50 \times 4200 \times 101 = 6.36 \times 10^{5}\,\text{J}$.'

  - id: w2-vaporisation
    plays: latent-heat
    section: '7.1'
    dfe: [AP7]
    statement: 'The specific latent heat of vaporisation of water is 2.26e6 J/kg. Find the energy needed to turn 0.050 kg of boiling water into steam at the same temperature.'
    answer_label: 'The energy supplied'
    check:
      kind: dimensions
      expression: "m * L"
      values:
        m: {value: "0.050", unit: "kg"}
        L: {value: "2.26e6", unit: "J kg^-1"}
      answer: {value: "113000", unit: "J"}
    answer_text: '$E = mL = 0.050 \times 2.26 \times 10^{6} = 1.13 \times 10^{5}\,\text{J}$.'

  - id: w3-two-stage
    section: '7.1'
    dfe: [AP7]
    statement: 'Find the total energy to heat 1.50 kg of water from 20 C to 121 C and then turn 0.050 kg of it into steam. Use c = 4200 J/kg/K and L = 2.26e6 J/kg.'
    answer_label: 'The total energy'
    check:
      kind: dimensions
      expression: "m * c * dtheta + m2 * L"
      values:
        m: {value: "1.50", unit: "kg"}
        c: {value: "4200", unit: "J kg^-1 K^-1"}
        dtheta: {value: "101", unit: "K"}
        m2: {value: "0.050", unit: "kg"}
        L: {value: "2.26e6", unit: "J kg^-1"}
      answer: {value: "749300", unit: "J"}
    answer_text: '$E = mc\Delta\theta + mL = 6.36 \times 10^{5} + 1.13 \times 10^{5} = 7.49 \times 10^{5}\,\text{J}$.'

  - id: w4-practical-c
    plays: thermal-energy
    section: '7.1'
    dfe: [AP7]
    statement: 'An aluminium block of mass 1.0 kg is heated by a 12 V, 2.0 A heater for 300 s. Its temperature rises by 8.0 K. Find the specific heat capacity of the aluminium.'
    answer_label: 'The specific heat capacity'
    check:
      kind: dimensions
      expression: "I * V * t / (m * dtheta)"
      values:
        I: {value: "2.0", unit: "A"}
        V: {value: "12", unit: "V"}
        t: {value: "300", unit: "s"}
        m: {value: "1.0", unit: "kg"}
        dtheta: {value: "8.0", unit: "K"}
      answer: {value: "900", unit: "J kg^-1 K^-1"}
    answer_text: 'The energy supplied is $E = IVt = 2.0 \times 12 \times 300 = 7200\,\text{J}$. Then $c = \dfrac{E}{m\Delta\theta} = \dfrac{7200}{1.0 \times 8.0} = 900\,\text{J}\,\text{kg}^{-1}\,\text{K}^{-1}$.'

  - id: w5-temperature-rise
    plays: thermal-energy
    section: '7.1'
    dfe: [AP7]
    statement: 'A 700 W heater warms 2.0 kg of water for 300 s. Find the temperature rise. The specific heat capacity of water is 4200 J/kg/K.'
    answer_label: 'The temperature rise'
    check:
      kind: dimensions
      expression: "P * t / (m * c)"
      values:
        P: {value: "700", unit: "W"}
        t: {value: "300", unit: "s"}
        m: {value: "2.0", unit: "kg"}
        c: {value: "4200", unit: "J kg^-1 K^-1"}
      answer: {value: "25", unit: "K"}
    answer_text: 'The energy supplied is $E = Pt = 700 \times 300 = 2.1 \times 10^{5}\,\text{J}$. Then $\Delta\theta = \dfrac{E}{mc} = \dfrac{2.1 \times 10^{5}}{2.0 \times 4200} = 25\,\text{K}$.'

  # --- Section 7.1, the Practise with help problems --------------------------
  - id: g1-copper-block
    plays: thermal-energy
    section: '7.1'
    dfe: [AP7]
    statement: 'A 0.80 kg copper block is heated from 20 C to 45 C. The specific heat capacity of copper is 390 J/kg/K. Find the energy supplied.'
    answer_label: 'The energy supplied'
    check:
      kind: dimensions
      expression: "m * c * dtheta"
      values:
        m: {value: "0.80", unit: "kg"}
        c: {value: "390", unit: "J kg^-1 K^-1"}
        dtheta: {value: "25", unit: "K"}
      answer: {value: "7800", unit: "J"}
    answer_text: '$E = mc\Delta\theta = 0.80 \times 390 \times 25 = 7800\,\text{J}$.'

  - id: g2-melt-ice
    plays: latent-heat
    section: '7.1'
    dfe: [AP7]
    statement: 'Find the energy needed to melt 0.20 kg of ice at 0 C. The specific latent heat of fusion of ice is 3.34e5 J/kg.'
    answer_label: 'The energy supplied'
    check:
      kind: dimensions
      expression: "m * L"
      values:
        m: {value: "0.20", unit: "kg"}
        L: {value: "3.34e5", unit: "J kg^-1"}
      answer: {value: "66800", unit: "J"}
    answer_text: '$E = mL = 0.20 \times 3.34 \times 10^{5} = 6.68 \times 10^{4}\,\text{J}$.'

  - id: g3-find-c
    plays: thermal-energy
    section: '7.1'
    dfe: [AP7]
    statement: 'A 2.0 kg block gains 45000 J of energy and its temperature rises by 50 K. Find its specific heat capacity.'
    answer_label: 'The specific heat capacity'
    check:
      kind: dimensions
      expression: "E / (m * dtheta)"
      values:
        E: {value: "45000", unit: "J"}
        m: {value: "2.0", unit: "kg"}
        dtheta: {value: "50", unit: "K"}
      answer: {value: "450", unit: "J kg^-1 K^-1"}
    answer_text: '$c = \dfrac{E}{m\Delta\theta} = \dfrac{45000}{2.0 \times 50} = 450\,\text{J}\,\text{kg}^{-1}\,\text{K}^{-1}$.'

  - id: g4-heat-then-boil
    section: '7.1'
    dfe: [AP7]
    statement: 'A pan heats 0.50 kg of water from 20 C to 100 C, then boils 0.10 kg of it into steam. Use c = 4200 J/kg/K and L = 2.26e6 J/kg. Find the total energy supplied.'
    answer_label: 'The total energy'
    check:
      kind: dimensions
      expression: "m1 * c * dtheta + m2 * L"
      values:
        m1: {value: "0.50", unit: "kg"}
        c: {value: "4200", unit: "J kg^-1 K^-1"}
        dtheta: {value: "80", unit: "K"}
        m2: {value: "0.10", unit: "kg"}
        L: {value: "2.26e6", unit: "J kg^-1"}
      answer: {value: "394000", unit: "J"}
    answer_text: 'Heating the water needs $E_1 = mc\Delta\theta = 0.50 \times 4200 \times 80 = 1.68 \times 10^{5}\,\text{J}$. Boiling needs $E_2 = mL = 0.10 \times 2.26 \times 10^{6} = 2.26 \times 10^{5}\,\text{J}$. The total is $E_1 + E_2 = 3.94 \times 10^{5}\,\text{J}$.'

  - id: g5-practical-c
    plays: thermal-energy
    section: '7.1'
    dfe: [AP7]
    statement: 'A heater of 6.0 V and 3.0 A runs for 200 s in 1.5 kg of liquid. The temperature of the liquid rises by 4.0 K. Find the specific heat capacity of the liquid.'
    answer_label: 'The specific heat capacity'
    check:
      kind: dimensions
      expression: "I * V * t / (m * dtheta)"
      values:
        I: {value: "3.0", unit: "A"}
        V: {value: "6.0", unit: "V"}
        t: {value: "200", unit: "s"}
        m: {value: "1.5", unit: "kg"}
        dtheta: {value: "4.0", unit: "K"}
      answer: {value: "600", unit: "J kg^-1 K^-1"}
    answer_text: 'The energy supplied is $E = IVt = 3.0 \times 6.0 \times 200 = 3600\,\text{J}$. Then $c = \dfrac{E}{m\Delta\theta} = \dfrac{3600}{1.5 \times 4.0} = 600\,\text{J}\,\text{kg}^{-1}\,\text{K}^{-1}$.'

  - id: g6-state-reason
    section: '7.1'
    dfe: [AP7]
    statement: 'Explain why the temperature of ice does not change while it is melting, even though energy is being supplied.'
    check:
      kind: structured
      requires: [energy-supplied, bonds-broken, potential-energy, temperature-constant]
      concepts: [internal-energy, latent-heat, change-of-state]
      points:
        - id: energy-supplied
          text: 'Energy is being supplied, so the internal energy of the ice is increasing.'
          concepts: [internal-energy]
        - id: bonds-broken
          text: 'The energy is used to break the bonds that hold the particles in the solid lattice, not to speed them up.'
          concepts: [latent-heat]
        - id: potential-energy
          text: 'The potential energy of the particles increases as the solid turns into a liquid.'
          concepts: [internal-energy]
        - id: temperature-constant
          text: 'Temperature measures the average random kinetic energy of the particles. That stays the same, so the temperature stays at 0 C.'
          concepts: [change-of-state]
    answer_text: 'The energy goes into breaking the bonds between the particles, so their potential energy rises while their average kinetic energy stays the same. Temperature measures the average random kinetic energy, so it does not change.'

  # --- Section 7.1, the warm-up recalls --------------------------------------
  - id: warmup-7-1-power
    section: '7.1'
    dfe: [AP7]
    statement: 'A heater transfers 3600 J of energy in 120 s. Find its power.'
    answer_label: 'The power'
    check: {kind: evaluate, expression: "3600 / 120", answer: "30"}
    answer_text: '$P = \dfrac{E}{t} = \dfrac{3600}{120} = 30\,\text{W}$.'

  - id: warmup-7-1-mass
    section: '7.1'
    dfe: [AP7]
    statement: 'Write 500 g in kilograms.'
    answer_label: 'The mass'
    check: {kind: convert, value: "500", from: "g", to: "kg", answer: "0.5"}
    answer_text: '500 g $= 0.50\,\text{kg}$.'

  - id: warmup-7-1-temperature
    section: '7.1'
    dfe: [AP7]
    statement: 'The temperature of a liquid rises from 18 C to 45 C. Find the temperature change in kelvin.'
    answer_label: 'The temperature change'
    check: {kind: evaluate, expression: "45 - 18", answer: "27"}
    answer_text: '$\Delta\theta = 45 - 18 = 27\,\text{K}$. A change of one degree Celsius is the same as a change of one kelvin.'

  # --- Section 7.2, the Learn worked examples --------------------------------
  - id: w6-kelvin
    section: '7.2'
    dfe: [AP7]
    statement: 'Write 121 C in kelvin.'
    answer_label: 'The temperature'
    check: {kind: evaluate, expression: "121 + 273", answer: "394"}
    answer_text: '$T = 121 + 273 = 394\,\text{K}$.'

  - id: w7-boyle
    plays: ideal-gas-n
    section: '7.2'
    dfe: [AP7]
    statement: 'A gas at a pressure of 1.0e5 Pa occupies a volume of 200 cm3. It is compressed at constant temperature to 50 cm3. Find the new pressure.'
    answer_label: 'The new pressure'
    check:
      kind: dimensions
      expression: "p1 * V1 / V2"
      values:
        p1: {value: "1.0e5", unit: "Pa"}
        V1: {value: "200", unit: "cm^3"}
        V2: {value: "50", unit: "cm^3"}
      answer: {value: "4.0e5", unit: "Pa"}
    answer_text: 'For a fixed mass of gas at constant temperature, $p_1V_1 = p_2V_2$. So $p_2 = \dfrac{p_1V_1}{V_2} = \dfrac{1.0 \times 10^{5} \times 200}{50} = 4.0 \times 10^{5}\,\text{Pa}$.'

  - id: w8-moles
    section: '7.2'
    dfe: [AP7]
    statement: 'Steam in a pressure cooker is at a pressure of 2.00e5 Pa and a temperature of 121 C, in a space of volume 2.00e-3 m3. Treat the steam as an ideal gas and find the number of moles. R = 8.31 J/K/mol.'
    answer_label: 'The number of moles'
    check:
      kind: all
      checks:
        - kind: dimensions
          consistency: "p * V = n * R * T"
          units: {p: Pa, V: "m^3", n: mol, R: "J K^-1 mol^-1", T: K}
        - {kind: approx, value: "2.00e5 * 2.00e-3 / (8.31 * 394)", target: "0.1222", tolerance: "0.0005"}
    answer_text: '$n = \dfrac{pV}{RT} = \dfrac{2.00 \times 10^{5} \times 2.00 \times 10^{-3}}{8.31 \times 394} = 0.122\,\text{mol}$.'

  - id: w9-molecules
    section: '7.2'
    dfe: [AP7]
    statement: 'Use pV = NkT to find the number of steam molecules in the space in Worked example 4. Use p = 2.00e5 Pa, V = 2.00e-3 m3, T = 394 K and k = 1.38e-23 J/K.'
    answer_label: 'The number of molecules'
    check: {kind: approx, value: "2.00e5 * 2.00e-3 / (1.38e-23 * 394)", target: "7.36e22", tolerance: "0.05e22"}
    answer_text: '$N = \dfrac{pV}{kT} = \dfrac{2.00 \times 10^{5} \times 2.00 \times 10^{-3}}{1.38 \times 10^{-23} \times 394} = 7.36 \times 10^{22}$.'

  - id: w10-average-ke
    section: '7.2'
    dfe: [AP7]
    statement: 'Find the average random kinetic energy of a steam molecule at 121 C. Use k = 1.38e-23 J/K.'
    answer_label: 'The average kinetic energy'
    check: {kind: approx, value: "1.5 * 1.38e-23 * 394", target: "8.16e-21", tolerance: "0.05e-21"}
    answer_text: '$\tfrac{1}{2}m(c_{\text{rms}})^2 = \tfrac{3}{2}kT = 1.5 \times 1.38 \times 10^{-23} \times 394 = 8.16 \times 10^{-21}\,\text{J}$.'

  - id: w11-rms-speed
    section: '7.2'
    dfe: [AP7]
    statement: 'Find the rms speed of a steam molecule at 121 C. The molar mass of water is 0.018 kg/mol, k = 1.38e-23 J/K and N_A = 6.02e23 /mol.'
    answer_label: 'The rms speed'
    check: {kind: approx, value: "sqrt(3 * 1.38e-23 * 394 / (0.018 / 6.02e23))", target: "739", tolerance: "2"}
    answer_text: 'The mass of one molecule is $m = \dfrac{0.018}{6.02 \times 10^{23}} = 2.99 \times 10^{-26}\,\text{kg}$. Then $c_{\text{rms}} = \sqrt{\dfrac{3kT}{m}} = \sqrt{\dfrac{3 \times 1.38 \times 10^{-23} \times 394}{2.99 \times 10^{-26}}} = 739\,\text{m}\,\text{s}^{-1}$.'

  - id: w12-kinetic-theory
    section: '7.2'
    dfe: [AP7]
    statement: 'A gas contains 5.0e22 molecules, each of mass 4.8e-26 kg, in a volume of 2.0e-3 m3. The rms speed is 500 m/s. Use pV = (1/3)Nm(c_rms)^2 to find the pressure.'
    answer_label: 'The pressure'
    check:
      kind: dimensions
      expression: "N * m * c**2 / (3 * V)"
      values:
        N: {value: "5.0e22", unit: ""}
        m: {value: "4.8e-26", unit: "kg"}
        c: {value: "500", unit: "m s^-1"}
        V: {value: "2.0e-3", unit: "m^3"}
      answer: {value: "1.0e5", unit: "Pa"}
    answer_text: '$p = \dfrac{Nm(c_{\text{rms}})^2}{3V} = \dfrac{5.0 \times 10^{22} \times 4.8 \times 10^{-26} \times 500^{2}}{3 \times 2.0 \times 10^{-3}} = 1.0 \times 10^{5}\,\text{Pa}$.'

  - id: w13-charles
    plays: ideal-gas-n
    section: '7.2'
    dfe: [AP7]
    statement: 'A fixed mass of gas occupies 300 cm3 at 300 K. It is heated at constant pressure to 450 K. Find its new volume.'
    answer_label: 'The new volume'
    check:
      kind: dimensions
      expression: "V1 * T2 / T1"
      values:
        V1: {value: "300", unit: "cm^3"}
        T2: {value: "450", unit: "K"}
        T1: {value: "300", unit: "K"}
      answer: {value: "450", unit: "cm^3"}
    answer_text: 'At constant pressure $\dfrac{V_1}{T_1} = \dfrac{V_2}{T_2}$, so $V_2 = \dfrac{V_1T_2}{T_1} = \dfrac{300 \times 450}{300} = 450\,\text{cm}^{3}$.'

  # --- Section 7.2, the Practise with help problems --------------------------
  - id: g7-boyle
    plays: ideal-gas-n
    section: '7.2'
    dfe: [AP7]
    statement: 'A gas occupies 4.0e-3 m3 at a pressure of 1.0e5 Pa. It is compressed at constant temperature to 1.0e-3 m3. Find the new pressure.'
    answer_label: 'The new pressure'
    check:
      kind: dimensions
      expression: "p1 * V1 / V2"
      values:
        p1: {value: "1.0e5", unit: "Pa"}
        V1: {value: "4.0e-3", unit: "m^3"}
        V2: {value: "1.0e-3", unit: "m^3"}
      answer: {value: "4.0e5", unit: "Pa"}
    answer_text: '$p_2 = \dfrac{p_1V_1}{V_2} = \dfrac{1.0 \times 10^{5} \times 4.0 \times 10^{-3}}{1.0 \times 10^{-3}} = 4.0 \times 10^{5}\,\text{Pa}$.'

  - id: g8-charles
    plays: ideal-gas-n
    section: '7.2'
    dfe: [AP7]
    statement: 'A fixed mass of gas at 290 K occupies 2.0e-3 m3. At constant pressure it is warmed to 348 K. Find its new volume.'
    answer_label: 'The new volume'
    check:
      kind: dimensions
      expression: "V1 * T2 / T1"
      values:
        V1: {value: "2.0e-3", unit: "m^3"}
        T2: {value: "348", unit: "K"}
        T1: {value: "290", unit: "K"}
      answer: {value: "2.4e-3", unit: "m^3"}
    answer_text: '$V_2 = \dfrac{V_1T_2}{T_1} = \dfrac{2.0 \times 10^{-3} \times 348}{290} = 2.4 \times 10^{-3}\,\text{m}^{3}$.'

  - id: g9-moles
    section: '7.2'
    dfe: [AP7]
    statement: 'Find the number of moles in 0.020 m3 of gas at 1.0e5 Pa and 300 K. R = 8.31 J/K/mol.'
    answer_label: 'The number of moles'
    check: {kind: approx, value: "1.0e5 * 0.020 / (8.31 * 300)", target: "0.802", tolerance: "0.002"}
    answer_text: '$n = \dfrac{pV}{RT} = \dfrac{1.0 \times 10^{5} \times 0.020}{8.31 \times 300} = 0.802\,\text{mol}$.'

  - id: g10-molecules
    section: '7.2'
    dfe: [AP7]
    statement: 'Find the number of molecules in the gas in the previous problem. Use n = 0.802 mol and N_A = 6.02e23 /mol.'
    answer_label: 'The number of molecules'
    check: {kind: approx, value: "0.802 * 6.02e23", target: "4.83e23", tolerance: "0.02e23"}
    answer_text: '$N = nN_A = 0.802 \times 6.02 \times 10^{23} = 4.83 \times 10^{23}$.'

  - id: g11-average-ke
    section: '7.2'
    dfe: [AP7]
    statement: 'Find the average random kinetic energy of a gas molecule at 300 K. Use k = 1.38e-23 J/K.'
    answer_label: 'The average kinetic energy'
    check: {kind: approx, value: "1.5 * 1.38e-23 * 300", target: "6.21e-21", tolerance: "0.05e-21"}
    answer_text: '$\tfrac{1}{2}m(c_{\text{rms}})^2 = \tfrac{3}{2}kT = 1.5 \times 1.38 \times 10^{-23} \times 300 = 6.21 \times 10^{-21}\,\text{J}$.'

  - id: g12-rms-nitrogen
    section: '7.2'
    dfe: [AP7]
    statement: 'Find the rms speed of nitrogen molecules at 300 K. The molar mass of nitrogen is 0.028 kg/mol and R = 8.31 J/K/mol.'
    answer_label: 'The rms speed'
    check: {kind: approx, value: "sqrt(3 * 8.31 * 300 / 0.028)", target: "517", tolerance: "2"}
    answer_text: '$c_{\text{rms}} = \sqrt{\dfrac{3RT}{M}} = \sqrt{\dfrac{3 \times 8.31 \times 300}{0.028}} = 517\,\text{m}\,\text{s}^{-1}$.'

  - id: g13-pressure-reason
    section: '7.2'
    dfe: [AP7]
    statement: 'Explain, in terms of the molecules, how a gas exerts a pressure on the walls of its container.'
    check:
      kind: structured
      requires: [random-motion, collide-walls, momentum-change, force-on-wall, many-collisions]
      concepts: [pressure, kinetic-theory, momentum]
      points:
        - id: random-motion
          text: 'The molecules move quickly and at random.'
          concepts: [kinetic-theory]
        - id: collide-walls
          text: 'They collide with the walls of the container.'
          concepts: [kinetic-theory]
        - id: momentum-change
          text: 'When a molecule hits a wall it rebounds, so its momentum changes.'
          concepts: [momentum]
        - id: force-on-wall
          text: 'The change in momentum means the wall feels a force from that molecule.'
          concepts: [momentum]
        - id: many-collisions
          text: 'There are very many molecules hitting the wall every second, so the total force is spread over the area as a steady pressure.'
          concepts: [pressure]
    answer_text: 'The molecules move at random and hit the walls. Each impact changes a molecule''s momentum, so the wall feels a force. Very many impacts each second give a steady force on the wall, and pressure is force divided by area.'

  # --- Section 7.2, the warm-up recalls --------------------------------------
  - id: warmup-7-2-kinetic-energy
    section: '7.2'
    dfe: [AP7]
    statement: 'A molecule of mass 4.8e-26 kg moves at 500 m/s. Find its kinetic energy.'
    answer_label: 'The kinetic energy'
    check: {kind: evaluate, expression: "0.5 * 4.8e-26 * 500**2", answer: "6.0e-21"}
    answer_text: '$E_k = \tfrac{1}{2}mv^{2} = \tfrac{1}{2} \times 4.8 \times 10^{-26} \times 500^{2} = 6.0 \times 10^{-21}\,\text{J}$.'

  - id: warmup-7-2-momentum
    section: '7.2'
    dfe: [AP7]
    statement: 'A molecule of mass 4.8e-26 kg strikes a wall at 500 m/s and rebounds at 500 m/s. Find the change in its momentum.'
    answer_label: 'The change in momentum'
    check: {kind: evaluate, expression: "2 * 4.8e-26 * 500", answer: "4.8e-23"}
    answer_text: 'The speed reverses, so the change in momentum is $2mv = 2 \times 4.8 \times 10^{-26} \times 500 = 4.8 \times 10^{-23}\,\text{kg}\,\text{m}\,\text{s}^{-1}$.'

  - id: warmup-7-2-prefix
    section: '7.2'
    dfe: [AP7]
    statement: 'Write 200 cm3 in cubic metres.'
    answer_label: 'The volume'
    check: {kind: convert, value: "200", from: "cm^3", to: "m^3", answer: "2.0e-4"}
    answer_text: '$200\,\text{cm}^{3} = 200 \times 10^{-6}\,\text{m}^{3} = 2.0 \times 10^{-4}\,\text{m}^{3}$.'

  # --- Chapter problem, the Progress checks and the Review -------------------
  - id: anchor-heat-water
    plays: thermal-energy
    section: '7.1'
    dfe: [AP7]
    statement: 'The pressure cooker holds 1.50 kg of water at 20 C. It boils at 121 C. Find the energy needed to heat the water to boiling. c = 4200 J/kg/K.'
    answer_label: 'The energy supplied'
    check:
      kind: dimensions

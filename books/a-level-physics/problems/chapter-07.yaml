          text: 'The temperature of the water and the steam inside rises as energy is supplied.'
          concepts: [ideal-gas]
        - id: pressure-rises
          text: 'The volume is fixed and the temperature rises, so pV = NkT means the pressure rises.'
          concepts: [ideal-gas]
        - id: boiling-point-rises
          text: 'Water boils when its saturated vapour pressure equals the pressure above it, so a higher pressure means a higher boiling temperature.'
          concepts: [pressure]
    answer_text: 'The temperature rises, and at constant volume the pressure rises with it. Water boils when its vapour pressure matches the pressure above it, so a higher pressure raises the boiling temperature. That is why the cooker reaches 121 C.'

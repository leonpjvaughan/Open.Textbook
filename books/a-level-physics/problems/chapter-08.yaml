# Support bank for Chapter 8 (Quantum and nuclear physics).
#
# This bank holds the records behind the Learn worked examples, the Practise with
# help problems and the warm-up recalls. It is not printed by a marker: the pages
# hand-write the teaching, and every final answer here is checked independently,
# so a wrong worked step cannot ship unnoticed.
#
# The book declares `oracles: [sympy, units]`. A quantity whose unit arithmetic is
# exact in SI (J, m, Hz, kg, Bq, kg m s^-1) is proved by `dimensions`. A value
# that depends on the electronvolt, on the atomic mass unit, or on a square root
# or exponential is proved by `approx` against a stated tolerance, because the
# units oracle keeps the exact constants while the book teaches the rounded ones.
# A reason is a `structured` record: presence, order and coverage only, never
# physics.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): this proves the
# arithmetic and the dimensions, not the physics. A dimensionally consistent,
# arithmetically correct, physically absurd answer would pass.
chapter: 8
problems:
  # --- Section 8.1, the Learn worked examples --------------------------------
  - id: w1-gamma-photon
    section: '8.1'
    refs: [AP8]
    statement: 'A 511 keV gamma photon: find its energy in joules, its frequency and its wavelength.'
    answer_label: 'The energy, frequency and wavelength'
    check:
      kind: all
      checks:
        - {kind: approx, value: "511e3 * 1.60e-19", target: "8.18e-14", tolerance: "1e-16"}
        - {kind: approx, value: "511e3 * 1.60e-19 / 6.63e-34", target: "1.23e20", tolerance: "1e18"}
        - {kind: approx, value: "6.63e-34 * 3.00e8 / (511e3 * 1.60e-19)", target: "2.43e-12", tolerance: "1e-14"}
    answer_text: '$E = 8.18 \times 10^{-14}\,\text{J}$, $f = 1.23 \times 10^{20}\,\text{Hz}$, $\lambda = 2.43 \times 10^{-12}\,\text{m}$.'

  - id: w2-hydrogen-transition
    section: '8.1'
    refs: [AP8]
    statement: 'An electron falls from -3.40 eV to -13.6 eV. Find the photon energy, frequency and wavelength.'
    answer_label: 'The energy, frequency and wavelength'
    check:
      kind: all
      checks:
        - {kind: approx, value: "-3.40 - (-13.6)", target: "10.2", tolerance: "0.05"}
        - {kind: approx, value: "10.2 * 1.60e-19 / 6.63e-34", target: "2.46e15", tolerance: "1e13"}
        - {kind: approx, value: "6.63e-34 * 3.00e8 / (10.2 * 1.60e-19)", target: "1.22e-7", tolerance: "1e-9"}
    answer_text: '$E = 10.2\,\text{eV}$, $f = 2.46 \times 10^{15}\,\text{Hz}$, $\lambda = 1.22 \times 10^{-7}\,\text{m}$.'

  - id: w3-photoelectric-kinetic
    section: '8.1'
    refs: [AP8]
    statement: '250 nm light falls on a 2.00 eV photocathode. Find the photon energy and the maximum kinetic energy, in eV.'
    answer_label: 'The photon energy and the maximum kinetic energy'
    check:
      kind: all
      checks:
        - {kind: approx, value: "6.63e-34 * 3.00e8 / 250e-9 / 1.60e-19", target: "4.97", tolerance: "0.02"}
        - {kind: approx, value: "6.63e-34 * 3.00e8 / 250e-9 / 1.60e-19 - 2.00", target: "2.97", tolerance: "0.02"}
    answer_text: 'The photon energy is 4.97 eV, so $E_{k(\text{max})} = 4.97 - 2.00 = 2.97\,\text{eV}$.'

  - id: w4-threshold-wavelength
    section: '8.1'
    refs: [AP8]
    statement: 'Find the threshold wavelength for a photocathode of work function 2.00 eV.'
    answer_label: 'The threshold wavelength'
    check: {kind: approx, value: "6.63e-34 * 3.00e8 / (2.00 * 1.60e-19)", target: "6.22e-7", tolerance: "5e-9"}
    answer_text: '$\lambda_0 = \dfrac{hc}{\phi} = 6.22 \times 10^{-7}\,\text{m}$, or 622 nm.'

  # --- Section 8.1, warm-ups and guided problems -----------------------------
  - id: g1-wave-wavelength
    section: '8.1'
    refs: [AP8]
    statement: 'A wave of frequency 6.0e14 Hz: find its wavelength.'
    answer_label: 'The wavelength'
    check: {kind: approx, value: "3.00e8 / 6.0e14", target: "5.0e-7", tolerance: "1e-9"}
    answer_text: '$\lambda = \dfrac{c}{f} = 5.0 \times 10^{-7}\,\text{m}$.'

  - id: g2-ev-to-joules
    section: '8.1'
    refs: [AP8]
    statement: 'Write 2.0 eV in joules.'
    answer_label: 'The energy'
    check: {kind: approx, value: "2.0 * 1.60e-19", target: "3.2e-19", tolerance: "1e-21"}
    answer_text: '$2.0 \times 1.60 \times 10^{-19} = 3.2 \times 10^{-19}\,\text{J}$.'

  - id: g3-electron-50v
    section: '8.1'
    refs: [AP8]
    statement: 'An electron is accelerated through 50 V. Find its kinetic energy in joules.'
    answer_label: 'The kinetic energy'
    check: {kind: approx, value: "1.60e-19 * 50", target: "8.0e-18", tolerance: "1e-20"}
    answer_text: '$E_k = eV = 8.0 \times 10^{-18}\,\text{J}$.'

  - id: g4-photon-energy-frequency
    plays: photon-energy
    section: '8.1'
    refs: [AP8]
    statement: 'A photon has a frequency of 5.0e14 Hz. Find its energy.'
    answer_label: 'The photon energy'
    check:
      kind: dimensions
      expression: "h * f"
      values:
        h: {value: "6.63e-34", unit: "J s"}
        f: {value: "5.0e14", unit: "Hz"}
      answer: {value: "3.315e-19", unit: "J"}
    answer_text: '$E = hf = 3.3 \times 10^{-19}\,\text{J}$.'

  - id: g5-photon-400nm
    plays: photon-energy
    section: '8.1'
    refs: [AP8]
    statement: 'Find the energy of a photon of wavelength 400 nm.'
    answer_label: 'The photon energy'
    check:
      kind: dimensions
      expression: "h * c / lam"
      values:
        h: {value: "6.63e-34", unit: "J s"}
        c: {value: "3.00e8", unit: "m s^-1"}
        lam: {value: "4.00e-7", unit: "m"}
      answer: {value: "4.9725e-19", unit: "J"}
    answer_text: '$E = 4.97 \times 10^{-19}\,\text{J} = 3.11\,\text{eV}$.'

  - id: g6-max-kinetic-300nm
    section: '8.1'
    refs: [AP8]
    statement: '300 nm light falls on a metal of work function 2.30 eV. Find the maximum kinetic energy in eV.'
    answer_label: 'The maximum kinetic energy'
    check: {kind: approx, value: "6.63e-34 * 3.00e8 / 300e-9 / 1.60e-19 - 2.30", target: "1.84", tolerance: "0.02"}
    answer_text: 'The photon energy is 4.14 eV, so $E_{k(\text{max})} = 4.14 - 2.30 = 1.84\,\text{eV}$.'

  - id: g7-threshold-200ev
    section: '8.1'
    refs: [AP8]
    statement: 'A metal has a work function of 2.00 eV. Find its threshold wavelength.'
    answer_label: 'The threshold wavelength'
    check: {kind: approx, value: "6.63e-34 * 3.00e8 / (2.00 * 1.60e-19)", target: "6.22e-7", tolerance: "5e-9"}
    answer_text: '$\lambda_0 = 6.22 \times 10^{-7}\,\text{m} = 622\,\text{nm}$.'

  - id: g8-stopping-potential
    section: '8.1'
    refs: [AP8]
    statement: 'The maximum kinetic energy of photoelectrons is 2.5 eV. Find the stopping potential.'
    answer_label: 'The stopping potential'
    check:
      kind: dimensions
      consistency: "V = E / Q"
      units: {V: "V", E: "eV", Q: "C"}
    answer_text: '$eV_s = 2.5\,\text{eV}$, so $V_s = 2.5\,\text{V}$.'

  - id: g9-hydrogen-transition
    section: '8.1'
    refs: [AP8]
    statement: 'An electron falls from -1.51 eV to -3.40 eV. Find the photon energy and wavelength.'
    answer_label: 'The photon energy and wavelength'
    check:
      kind: all
      checks:
        - {kind: approx, value: "-1.51 - (-3.40)", target: "1.89", tolerance: "0.01"}
        - {kind: approx, value: "6.63e-34 * 3.00e8 / (1.89 * 1.60e-19)", target: "6.58e-7", tolerance: "5e-9"}
    answer_text: '$E = 1.89\,\text{eV}$ and $\lambda = 6.58 \times 10^{-7}\,\text{m}$, which is red light.'

  - id: g10-below-threshold
    section: '8.1'
    refs: [AP8]
    statement: 'Explain why bright light below the threshold frequency releases no photoelectrons.'
    check:
      kind: structured
      requires: [photon-energy, work-function, one-photon, more-photons]
      concepts: [photoelectric]
      points:
        - id: photon-energy
          text: 'Each photon carries the energy $hf$, fixed by the frequency.'
          concepts: [photoelectric]
        - id: work-function
          text: 'One electron needs at least the work function to escape.'
          concepts: [photoelectric]
        - id: one-photon
          text: 'One photon is absorbed by one electron, so the electron cannot add the energy of two photons.'
          concepts: [photoelectric]
        - id: more-photons
          text: 'More photons of the same energy still leave every electron short of the work function, so no electrons escape.'
          concepts: [photoelectric]

  # --- Section 8.2, the Learn worked examples --------------------------------
  - id: w5-electron-150v
    section: '8.2'
    refs: [AP8]
    statement: 'An electron is accelerated through 150 V. Find its kinetic energy, momentum and de Broglie wavelength.'
    answer_label: 'The kinetic energy, momentum and wavelength'
    check:
      kind: all
      checks:
        - {kind: approx, value: "1.60e-19 * 150", target: "2.40e-17", tolerance: "1e-19"}
        - {kind: approx, value: "sqrt(2 * 9.11e-31 * 2.40e-17)", target: "6.61e-24", tolerance: "1e-26"}
        - {kind: approx, value: "6.63e-34 / sqrt(2 * 9.11e-31 * 2.40e-17)", target: "1.00e-10", tolerance: "1e-12"}
    answer_text: '$E_k = 2.40 \times 10^{-17}\,\text{J}$, $p = 6.61 \times 10^{-24}\,\text{kg}\,\text{m}\,\text{s}^{-1}$ and $\lambda = 1.00 \times 10^{-10}\,\text{m}$.'

  - id: w6-everyday-object
    section: '8.2'
    refs: [AP8]
    statement: 'Find the de Broglie wavelength of a 0.050 kg ball at 20 m/s.'
    answer_label: 'The de Broglie wavelength'
    check: {kind: approx, value: "6.63e-34 / (0.050 * 20)", target: "6.63e-34", tolerance: "1e-36"}
    answer_text: '$\lambda = \dfrac{h}{mv} = 6.6 \times 10^{-34}\,\text{m}$, far too small to observe.'

  - id: w7-voltage-from-wavelength
    section: '8.2'
    refs: [AP8]
    statement: 'Electrons have a de Broglie wavelength of 5.0e-11 m. Find the momentum, kinetic energy and accelerating potential difference.'
    answer_label: 'The momentum, kinetic energy and potential difference'
    check:
      kind: all
      checks:
        - {kind: approx, value: "6.63e-34 / 5.0e-11", target: "1.33e-23", tolerance: "1e-25"}
        - {kind: approx, value: "(6.63e-34 / 5.0e-11)**2 / (2 * 9.11e-31)", target: "9.65e-17", tolerance: "1e-18"}
        - {kind: approx, value: "(6.63e-34 / 5.0e-11)**2 / (2 * 9.11e-31 * 1.60e-19)", target: "603", tolerance: "5"}
    answer_text: '$p = 1.33 \times 10^{-23}\,\text{kg}\,\text{m}\,\text{s}^{-1}$, $E_k = 9.65 \times 10^{-17}\,\text{J}$ and $V = 6.0 \times 10^{2}\,\text{V}$.'

  # --- Section 8.2, warm-ups and guided problems -----------------------------
  - id: g11-ball-momentum
    section: '8.2'
    refs: [AP8]
    statement: 'A 0.20 kg ball moves at 3.0 m/s. Find its momentum.'
    answer_label: 'The momentum'
    check:
      kind: dimensions
      expression: "m * v"
      values:
        m: {value: "0.20", unit: "kg"}
        v: {value: "3.0", unit: "m s^-1"}
      answer: {value: "0.60", unit: "kg m s^-1"}
    answer_text: '$p = mv = 0.60\,\text{kg}\,\text{m}\,\text{s}^{-1}$.'

  - id: g12-photon-500nm
    plays: photon-energy
    section: '8.2'
    refs: [AP8]
    statement: 'Find the energy of a photon of wavelength 500 nm.'
    answer_label: 'The photon energy'
    check:
      kind: dimensions
      expression: "h * c / lam"
      values:
        h: {value: "6.63e-34", unit: "J s"}
        c: {value: "3.00e8", unit: "m s^-1"}
        lam: {value: "5.00e-7", unit: "m"}
      answer: {value: "3.978e-19", unit: "J"}
    answer_text: '$E = 3.98 \times 10^{-19}\,\text{J}$.'

  - id: g13-electron-200v
    section: '8.2'
    refs: [AP8]
    statement: 'An electron is accelerated through 200 V. Find its kinetic energy in joules.'
    answer_label: 'The kinetic energy'
    check: {kind: approx, value: "1.60e-19 * 200", target: "3.2e-17", tolerance: "1e-19"}
    answer_text: '$E_k = eV = 3.2 \times 10^{-17}\,\text{J}$.'

  - id: g14-electron-speed-wavelength
    section: '8.2'
    refs: [AP8]
    statement: 'An electron moves at 2.0e6 m/s. Find its de Broglie wavelength.'
    answer_label: 'The de Broglie wavelength'
    check: {kind: approx, value: "6.63e-34 / (9.11e-31 * 2.0e6)", target: "3.64e-10", tolerance: "5e-12"}
    answer_text: '$\lambda = 3.6 \times 10^{-10}\,\text{m}$.'

  - id: g15-proton-wavelength
    section: '8.2'
    refs: [AP8]
    statement: 'Find the de Broglie wavelength of a proton moving at 1.0e6 m/s.'
    answer_label: 'The de Broglie wavelength'
    check: {kind: approx, value: "6.63e-34 / (1.67e-27 * 1.0e6)", target: "3.97e-13", tolerance: "5e-15"}
    answer_text: '$\lambda = 4.0 \times 10^{-13}\,\text{m}$.'

  - id: g16-momentum-from-wavelength
    plays: de-broglie
    section: '8.2'
    refs: [AP8]
    statement: 'An electron has a de Broglie wavelength of 1.0e-10 m. Find its momentum.'
    answer_label: 'The momentum'
    check:
      kind: dimensions
      expression: "h / lam"
      values:
        h: {value: "6.63e-34", unit: "J s"}
        lam: {value: "1.0e-10", unit: "m"}
      answer: {value: "6.63e-24", unit: "kg m s^-1"}
    answer_text: '$p = 6.6 \times 10^{-24}\,\text{kg}\,\text{m}\,\text{s}^{-1}$.'

  - id: g17-electron-500v
    section: '8.2'
    refs: [AP8]
    statement: 'An electron is accelerated through 500 V. Find its de Broglie wavelength.'
    answer_label: 'The de Broglie wavelength'
    check: {kind: approx, value: "6.63e-34 / sqrt(2 * 9.11e-31 * 500 * 1.60e-19)", target: "5.49e-11", tolerance: "5e-13"}
    answer_text: '$\lambda = 5.5 \times 10^{-11}\,\text{m}$.'

  - id: g18-electron-diffraction
    section: '8.2'
    refs: [AP8]
    statement: 'Describe the electron diffraction experiment and what it shows.'
    check:
      kind: structured
      requires: [beam, target, rings, wavelength]
      concepts: [de-broglie, diffraction]
      points:
        - id: beam
          text: 'A beam of electrons is fired through a thin graphite film or at a crystal.'
          concepts: [de-broglie]
        - id: target
          text: 'The regular atomic spacing acts like a diffraction grating.'
          concepts: [diffraction]
        - id: rings
          text: 'A pattern of concentric rings appears on a screen, which only waves produce.'
          concepts: [diffraction]
        - id: wavelength
          text: 'The ring spacing matches $\lambda = h/p$, so electrons behave as waves.'
          concepts: [de-broglie]

  - id: g19-rings-and-voltage
    section: '8.2'
    refs: [AP8]
    statement: 'Explain why the diffraction rings move closer together when the accelerating voltage rises.'
    check:
      kind: structured
      requires: [voltage, energy, momentum, wavelength, angle]
      concepts: [de-broglie]
      points:
        - id: voltage
          text: 'A larger voltage gives each electron more kinetic energy, $E_k = eV$.'
          concepts: [de-broglie]
        - id: energy
          text: 'More kinetic energy means more momentum, $p = \sqrt{2mE_k}$.'
          concepts: [de-broglie]
        - id: momentum
          text: 'The wavelength is $\lambda = h/p$, so more momentum means a shorter wavelength.'
          concepts: [de-broglie]
        - id: wavelength
          text: 'A shorter wavelength diffracts through a smaller angle.'
          concepts: [de-broglie]
        - id: angle
          text: 'The rings therefore move closer together.'
          concepts: [de-broglie]

  # --- Section 8.3, the Learn worked examples --------------------------------
  - id: w8-tracer-activity
    plays: decay-rate
    section: '8.3'
    refs: [AP8]
    statement: 'A source of half-life 110 min starts at 8.0e8 Bq. Find its activity after 330 min.'
    answer_label: 'The activity'
    check:
      kind: dimensions
      expression: "A0 / 2**3"
      values:
        A0: {value: "8.0e8", unit: "Bq"}
      answer: {value: "1.0e8", unit: "Bq"}
    answer_text: '330 minutes is three half-lives, so $A = \dfrac{8.0 \times 10^{8}}{2^3} = 1.0 \times 10^{8}\,\text{Bq}$.'

  - id: w9-decay-constant
    section: '8.3'
    refs: [AP8]
    statement: 'Find the decay constant of a nuclide of half-life 110 minutes, in s^-1.'
    answer_label: 'The decay constant'
    check: {kind: approx, value: "ln(2) / 6600", target: "1.05e-4", tolerance: "1e-6"}
    answer_text: '$\lambda = \dfrac{\ln 2}{6600} = 1.05 \times 10^{-4}\,\text{s}^{-1}$.'

  - id: w10-number-of-nuclei
    section: '8.3'
    refs: [AP8]
    statement: 'A source has an activity of 8.0e8 Bq and a decay constant of 1.05e-4 s^-1. Find the number of undecayed nuclei.'
    answer_label: 'The number of nuclei'
    check: {kind: approx, value: "8.0e8 / 1.05e-4", target: "7.62e12", tolerance: "1e10"}
    answer_text: '$N = \dfrac{A}{\lambda} = 7.6 \times 10^{12}$.'

  - id: w11-beta-plus-equation
    section: '8.3'
    refs: [AP8]
    statement: 'Write the balanced equation for the beta-plus decay of fluorine-18.'
    check:
      kind: structured
      requires: [parent, daughter, positron, neutrino]
      concepts: [beta-plus]
      points:
        - id: parent
          text: 'The parent is $^{18}_{9}\text{F}$.'
          concepts: [beta-plus]
        - id: daughter
          text: 'The daughter has 18 nucleons and 8 protons, so it is $^{18}_{8}\text{O}$.'
          concepts: [beta-plus]
        - id: positron
          text: 'A positron $^{0}_{+1}\text{e}$ is emitted.'
          concepts: [beta-plus]
        - id: neutrino
          text: '$^{18}_{9}\text{F} \rightarrow {}^{18}_{8}\text{O} + {}^{0}_{+1}\text{e} + \nu$.'
          concepts: [beta-plus]

  # --- Section 8.3, warm-ups and guided problems -----------------------------
  - id: g20-fraction-after-three
    section: '8.3'
    refs: [AP8]
    statement: 'A quantity halves every 4.0 minutes. What fraction remains after 12 minutes?'
    answer_label: 'The fraction'
    check: {kind: approx, value: "1 / 2**3", target: "0.125", tolerance: "0.001"}
    answer_text: 'Three half-lives pass, so the fraction is $\left(\tfrac{1}{2}\right)^3 = \dfrac{1}{8}$.'

  - id: g21-hours-to-seconds
    section: '8.3'
    refs: [AP8]
    statement: 'Write 3.0 hours in seconds.'
    answer_label: 'The time'
    check: {kind: convert, value: "3.0", from: "h", to: "s", answer: "10800"}
    answer_text: '$3.0 \times 3600 = 1.08 \times 10^{4}\,\text{s}$.'

  - id: g22-activity-from-nuclei
    section: '8.3'
    refs: [AP8]
    statement: 'A sample of 5.0e20 nuclei has decay constant 2.0e-6 s^-1. Find its activity.'
    answer_label: 'The activity'
    check:
      kind: dimensions
      expression: "lam * N"
      values:
        lam: {value: "2.0e-6", unit: "s^-1"}
        N: {value: "5.0e20"}
      answer: {value: "1.0e15", unit: "Bq"}
    answer_text: '$A = \lambda N = 1.0 \times 10^{15}\,\text{Bq}$.'

  - id: g23-activity-15-days
    plays: decay-rate
    section: '8.3'
    refs: [AP8]
    statement: 'A source of 640 Bq has a half-life of 5.0 days. Find its activity after 15 days.'
    answer_label: 'The activity'
    check:
      kind: dimensions
      expression: "A0 / 2**3"
      values:
        A0: {value: "640", unit: "Bq"}
      answer: {value: "80", unit: "Bq"}
    answer_text: '$A = \dfrac{640}{2^3} = 80\,\text{Bq}$.'

  - id: g24-decay-constant-6h
    section: '8.3'
    refs: [AP8]
    statement: 'Find the decay constant of a nuclide of half-life 6.0 hours, in s^-1.'
    answer_label: 'The decay constant'
    check: {kind: approx, value: "ln(2) / (6.0 * 3600)", target: "3.2e-5", tolerance: "1e-7"}
    answer_text: '$\lambda = \dfrac{0.693}{2.16 \times 10^{4}} = 3.2 \times 10^{-5}\,\text{s}^{-1}$.'

  - id: g25-activity-4e15
    section: '8.3'
    refs: [AP8]
    statement: 'A sample of 4.0e15 nuclei has decay constant 1.2e-5 s^-1. Find its activity.'
    answer_label: 'The activity'
    check:
      kind: dimensions
      expression: "lam * N"
      values:
        lam: {value: "1.2e-5", unit: "s^-1"}
        N: {value: "4.0e15"}
      answer: {value: "4.8e10", unit: "Bq"}
    answer_text: '$A = 4.8 \times 10^{10}\,\text{Bq}$.'

  - id: g26-nuclei-from-activity
    plays: activity
    section: '8.3'
    refs: [AP8]
    statement: 'A source of 2.0e6 Bq has decay constant 5.0e-7 s^-1. Find the number of nuclei.'
    answer_label: 'The number of nuclei'
    check:
      kind: dimensions
      expression: "A / lam"
      values:
        A: {value: "2.0e6", unit: "Bq"}
        lam: {value: "5.0e-7", unit: "s^-1"}
      answer: {value: "4.0e12"}
    answer_text: '$N = \dfrac{A}{\lambda} = 4.0 \times 10^{12}$.'

  - id: g27-exponential-decay
    section: '8.3'
    refs: [AP8]
    statement: 'A source of 8.0e8 Bq has decay constant 1.05e-4 s^-1. Find its activity after 3300 s.'
    answer_label: 'The activity'
    check: {kind: approx, value: "8.0e8 * exp(-1.05e-4 * 3300)", target: "5.66e8", tolerance: "1e7"}
    answer_text: '$A = 8.0 \times 10^{8} e^{-0.3465} = 5.7 \times 10^{8}\,\text{Bq}$.'

  - id: g28-alpha-equation
    section: '8.3'
    refs: [AP8]
    statement: 'Write the balanced equation for the alpha decay of americium-241.'
    check:
      kind: structured
      requires: [parent, alpha, daughter, balance]
      concepts: [alpha-decay]
      points:
        - id: parent
          text: 'The parent is $^{241}_{95}\text{Am}$.'
          concepts: [alpha-decay]
        - id: alpha
          text: 'An alpha particle $^{4}_{2}\text{He}$ is emitted.'
          concepts: [alpha-decay]
        - id: daughter
          text: 'The daughter has 237 nucleons and 93 protons, so it is $^{237}_{93}\text{Np}$.'
          concepts: [alpha-decay]
        - id: balance
          text: '$^{241}_{95}\text{Am} \rightarrow {}^{237}_{93}\text{Np} + {}^{4}_{2}\text{He}$.'
          concepts: [alpha-decay]

  - id: g29-beta-minus-equation
    section: '8.3'
    refs: [AP8]
    statement: 'Write the balanced equation for the beta-minus decay of carbon-14.'
    check:
      kind: structured
      requires: [parent, daughter, electron, antineutrino]
      concepts: [beta-minus]
      points:
        - id: parent
          text: 'The parent is $^{14}_{6}\text{C}$.'
          concepts: [beta-minus]
        - id: daughter
          text: 'The daughter has 14 nucleons and 7 protons, so it is $^{14}_{7}\text{N}$.'
          concepts: [beta-minus]
        - id: electron
          text: 'An electron $^{0}_{-1}\text{e}$ is emitted.'
          concepts: [beta-minus]
        - id: antineutrino
          text: '$^{14}_{6}\text{C} \rightarrow {}^{14}_{7}\text{N} + {}^{0}_{-1}\text{e} + \bar{\nu}$.'
          concepts: [beta-minus]

  - id: g30-random-nature
    section: '8.3'
    refs: [AP8]
    statement: 'Explain why the activity is predictable although one decay is random.'
    check:
      kind: structured
      requires: [single-random, probability, large-numbers, average]
      concepts: [random, activity]
      points:
        - id: single-random
          text: 'The decay of one nucleus is random: it has a fixed probability each second but no predictable time.'
          concepts: [random]
        - id: probability
          text: 'The decay constant is that probability per second.'
          concepts: [random]
        - id: large-numbers
          text: 'A sample contains a very large number of nuclei.'
          concepts: [activity]
        - id: average
          text: 'Averages over large numbers are steady, so the activity follows a smooth exponential curve.'
          concepts: [activity]

  # --- Section 8.4, the Learn worked examples --------------------------------
  - id: w12-helium-binding
    section: '8.4'
    refs: [AP8]
    statement: 'A helium-4 nucleus has a mass defect of 0.0304 u. Find its binding energy and its value per nucleon.'
    answer_label: 'The binding energy and its value per nucleon'
    check:
      kind: all
      checks:
        - {kind: approx, value: "0.0304 * 931.5", target: "28.3", tolerance: "0.05"}
        - {kind: approx, value: "0.0304 * 931.5 / 4", target: "7.08", tolerance: "0.02"}
    answer_text: 'The binding energy is 28.3 MeV, or 7.08 MeV per nucleon.'

  - id: w13-fission-mass-defect
    section: '8.4'
    refs: [AP8]
    statement: 'A reaction releases 200 MeV. Find the mass defect in kilograms.'
    answer_label: 'The mass defect'
    check: {kind: approx, value: "200e6 * 1.60e-19 / (3.00e8)**2", target: "3.56e-28", tolerance: "1e-29"}
    answer_text: '$\Delta m = \dfrac{E}{c^2} = 3.56 \times 10^{-28}\,\text{kg}$, or 0.215 u.'

  - id: w14-annihilation
    section: '8.4'
    refs: [AP8]
    statement: 'An electron and a positron annihilate. Each has rest energy 0.511 MeV. Find the total energy and the energy of each photon.'
    answer_label: 'The total energy and the energy of each photon'
    check:
      kind: all
      checks:
        - {kind: approx, value: "2 * 0.511", target: "1.022", tolerance: "0.001"}
        - {kind: approx, value: "0.511 * 1.60e-13", target: "8.18e-14", tolerance: "1e-15"}
    answer_text: 'The total is 1.022 MeV $= 1.64 \times 10^{-13}\,\text{J}$, so each photon carries 0.511 MeV $= 8.18 \times 10^{-14}\,\text{J}$.'

  # --- Section 8.4, warm-ups and guided problems -----------------------------
  - id: g31-mev-to-joules
    section: '8.4'
    refs: [AP8]
    statement: 'Write 2.0 MeV in joules.'
    answer_label: 'The energy'
    check: {kind: approx, value: "2.0e6 * 1.60e-19", target: "3.2e-13", tolerance: "1e-15"}
    answer_text: '$2.0 \times 10^{6} \times 1.60 \times 10^{-19} = 3.2 \times 10^{-13}\,\text{J}$.'

  - id: g32-mass-to-energy
    plays: mass-energy
    section: '8.4'
    refs: [AP8]
    statement: 'A mass of 1.0e-30 kg becomes energy. Find the energy released.'
    answer_label: 'The energy released'
    check:
      kind: dimensions
      expression: "m * c**2"
      values:
        m: {value: "1.0e-30", unit: "kg"}
        c: {value: "3.00e8", unit: "m s^-1"}
      answer: {value: "9.0e-14", unit: "J"}
    answer_text: '$E = mc^2 = 9.0 \times 10^{-14}\,\text{J}$.'

  - id: g33-photon-mev
    section: '8.4'
    refs: [AP8]
    statement: 'Find the energy in joules of a photon of energy 0.511 MeV.'
    answer_label: 'The energy'
    check: {kind: approx, value: "0.511e6 * 1.60e-19", target: "8.18e-14", tolerance: "1e-15"}
    answer_text: '$0.511 \times 10^{6} \times 1.60 \times 10^{-19} = 8.18 \times 10^{-14}\,\text{J}$.'

  - id: g34-mass-to-energy-3e-29
    plays: mass-energy
    section: '8.4'
    refs: [AP8]
    statement: 'A reaction converts 3.0e-29 kg into energy. Find the energy released.'
    answer_label: 'The energy released'
    check:
      kind: dimensions
      expression: "m * c**2"
      values:
        m: {value: "3.0e-29", unit: "kg"}
        c: {value: "3.00e8", unit: "m s^-1"}
      answer: {value: "2.7e-12", unit: "J"}
    answer_text: '$E = mc^2 = 2.7 \times 10^{-12}\,\text{J}$.'

  - id: g35-mass-defect-mev
    section: '8.4'
    refs: [AP8]
    statement: 'A nucleus has a mass defect of 0.050 u. Find its binding energy in MeV.'
    answer_label: 'The binding energy'
    check: {kind: approx, value: "0.050 * 931.5", target: "46.6", tolerance: "0.05"}
    answer_text: '$E = 0.050 \times 931.5 = 46.6\,\text{MeV}$.'

  - id: g36-helium-binding
    section: '8.4'
    refs: [AP8]
    statement: 'A helium-4 nucleus has a mass defect of 0.0304 u. Find its binding energy per nucleon.'
    answer_label: 'The binding energy per nucleon'
    check: {kind: approx, value: "0.0304 * 931.5 / 4", target: "7.08", tolerance: "0.02"}
    answer_text: '$\dfrac{0.0304 \times 931.5}{4} = 7.08\,\text{MeV}$ per nucleon.'

  - id: g37-fission-mass-defect
    section: '8.4'
    refs: [AP8]
    statement: 'A reaction releases 200 MeV. Find the mass defect.'
    answer_label: 'The mass defect'
    check: {kind: approx, value: "200e6 * 1.60e-19 / (3.00e8)**2", target: "3.56e-28", tolerance: "1e-29"}
    answer_text: '$\Delta m = 3.56 \times 10^{-28}\,\text{kg}$.'

  - id: g38-annihilation-photon
    section: '8.4'
    refs: [AP8]
    statement: 'A positron and an electron annihilate into two photons. Find the total energy and the energy of each photon.'
    answer_label: 'The total energy and the energy of each photon'
    check:
      kind: all
      checks:
        - {kind: approx, value: "2 * 0.511 * 1.60e-13", target: "1.64e-13", tolerance: "1e-15"}
        - {kind: approx, value: "0.511 * 1.60e-13", target: "8.18e-14", tolerance: "1e-15"}
    answer_text: 'The total is $1.64 \times 10^{-13}\,\text{J}$, so each photon carries $8.2 \times 10^{-14}\,\text{J}$.'

  - id: g39-fission-explanation
    section: '8.4'
    refs: [AP8]
    statement: 'Explain why fission of a heavy nucleus releases energy.'
    check:
      kind: structured
      requires: [low-per-nucleon, products-higher, less-mass, energy]
      concepts: [binding-energy, fission]
      points:
        - id: low-per-nucleon
          text: 'A very heavy nucleus has a low binding energy per nucleon.'
          concepts: [binding-energy]
        - id: products-higher
          text: 'Its products are nearer the peak, so they have a higher binding energy per nucleon.'
          concepts: [binding-energy]
        - id: less-mass
          text: 'More tightly bound nucleons have less mass.'
          concepts: [fission]
        - id: energy
          text: 'The missing mass is released as energy, through $E = mc^2$.'
          concepts: [fission]

  - id: g40-fusion-explanation
    section: '8.4'
    refs: [AP8]
    statement: 'Explain why fusion of two light nuclei releases energy.'
    check:
      kind: structured
      requires: [low-per-nucleon, product-higher, less-mass, energy]
      concepts: [binding-energy, fusion]
      points:
        - id: low-per-nucleon
          text: 'Light nuclei have a low binding energy per nucleon.'
          concepts: [binding-energy]
        - id: product-higher
          text: 'The heavier product is nearer the peak, so it has a higher binding energy per nucleon.'
          concepts: [binding-energy]
        - id: less-mass
          text: 'The product has less mass than the two nuclei together.'
          concepts: [fusion]
        - id: energy
          text: 'The mass difference is released as energy, through $E = mc^2$.'
          concepts: [fusion]

  - id: g41-sun
    plays: mass-energy
    section: '8.4'
    refs: [AP8]
    statement: 'The Sun converts 4.3e9 kg of mass each second. Find the energy released each second.'
    answer_label: 'The energy each second'
    check:
      kind: dimensions
      expression: "m * c**2"
      values:
        m: {value: "4.3e9", unit: "kg"}
        c: {value: "3.00e8", unit: "m s^-1"}
      answer: {value: "3.87e26", unit: "J"}
    answer_text: '$E = mc^2 = 3.9 \times 10^{26}\,\text{J}$ each second.'

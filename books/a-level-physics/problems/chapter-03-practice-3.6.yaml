# Practice set for 3.6 (Oscillations and simple harmonic motion).
#
# Both the questions and the answers on the page are rendered from these records.
# An angular frequency, a period, a speed or an energy that involves pi or a
# square root uses `approx` with a stated tolerance; the mean of repeated timings
# uses the SymPy `statistic` kind, which is an exact summary of the data. The
# `structured` records prove only that a model answer contains its declared ideas
# in order.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): this proves the
# arithmetic and the dimensions, not the physics. Whether an oscillation really
# meets the SHM condition, and whether the small-angle approximation is good
# enough, is not checked.
chapter: 3
problems:
  - id: p1-angular-frequency
    section: '3.6'
    refs: [AP3]
    statement: 'An oscillation has a period of 0.25 s. Find its angular frequency.'
    answer_label: 'The angular frequency'
    check: {kind: approx, value: "2 * pi / 0.25", target: "25.13", tolerance: "0.01"}
    answer_text: '$\omega = \dfrac{2\pi}{T} = \dfrac{2\pi}{0.25} = 25.1\,\text{rad}\,\text{s}^{-1}$.'

  - id: p2-period-from-frequency
    section: '3.6'
    refs: [AP3]
    statement: 'An oscillation has a frequency of 2.5 Hz. Find its period.'
    answer_label: 'The period'
    check: {kind: approx, value: "1 / 2.5", target: "0.40", tolerance: "0.001"}
    answer_text: '$T = \dfrac{1}{f} = \dfrac{1}{2.5} = 0.40\,\text{s}$.'

  - id: p3-max-speed
    section: '3.6'
    refs: [AP3]
    statement: 'An oscillation has amplitude 0.030 m and angular frequency $12\,\text{rad}\,\text{s}^{-1}$. Find the maximum speed.'
    answer_label: 'The maximum speed'
    check: {kind: approx, value: "0.030 * 12", target: "0.36", tolerance: "0.001"}
    answer_text: '$v_{\max} = A\omega = 0.030 \times 12 = 0.36\,\text{m}\,\text{s}^{-1}$, at the equilibrium position.'

  - id: p4-max-acceleration
    section: '3.6'
    refs: [AP3]
    statement: 'An oscillation has amplitude 0.030 m and angular frequency $12\,\text{rad}\,\text{s}^{-1}$. Find the maximum acceleration.'
    answer_label: 'The maximum acceleration'
    check: {kind: approx, value: "0.030 * 12**2", target: "4.32", tolerance: "0.001"}
    answer_text: '$a_{\max} = A\omega^2 = 0.030 \times 12^2 = 4.3\,\text{m}\,\text{s}^{-2}$, at the extremes of the motion.'

  - id: p5-mass-spring-period
    section: '3.6'
    refs: [AP3]
    statement: 'A mass of 0.80 kg hangs on a spring of spring constant $5.0\,\text{N}\,\text{m}^{-1}$. Find the period of the oscillation.'
    answer_label: 'The period'
    check: {kind: approx, value: "2 * pi * sqrt(0.80 / 5.0)", target: "2.51", tolerance: "0.01"}
    answer_text: '$T = 2\pi\sqrt{\dfrac{m}{k}} = 2\pi\sqrt{\dfrac{0.80}{5.0}} = 2\pi \times 0.40 = 2.5\,\text{s}$.'

  - id: p6-pendulum-period
    section: '3.6'
    refs: [AP3]
    statement: 'A simple pendulum has a length of 2.50 m. Find its period. Take $g = 9.81\,\text{m}\,\text{s}^{-2}$.'
    answer_label: 'The period'
    check: {kind: approx, value: "2 * pi * sqrt(2.50 / 9.81)", target: "3.17", tolerance: "0.01"}
    answer_text: '$T = 2\pi\sqrt{\dfrac{l}{g}} = 2\pi\sqrt{\dfrac{2.50}{9.81}} = 3.2\,\text{s}$.'

  - id: p7-speed-at-displacement
    section: '3.6'
    refs: [AP3]
    statement: 'An oscillation has amplitude 0.10 m and angular frequency $4.0\,\text{rad}\,\text{s}^{-1}$. Find the speed when the displacement is 0.060 m.'
    answer_label: 'The speed'
    check: {kind: approx, value: "4.0 * sqrt(0.10**2 - 0.060**2)", target: "0.32", tolerance: "0.001"}
    answer_text: '$v = \omega\sqrt{A^2 - x^2} = 4.0\sqrt{0.10^2 - 0.060^2} = 4.0 \times 0.080 = 0.32\,\text{m}\,\text{s}^{-1}$.'

  - id: p8-total-energy
    section: '3.6'
    refs: [AP3]
    statement: 'A mass of 0.50 kg oscillates with amplitude 0.020 m and angular frequency $8.0\,\text{rad}\,\text{s}^{-1}$. Find the total energy of the oscillation.'
    answer_label: 'The total energy'
    check: {kind: approx, value: "0.5 * 0.50 * 8.0**2 * 0.020**2", target: "0.0064", tolerance: "0.0001"}
    answer_text: '$E = \tfrac{1}{2}m\omega^2A^2 = \tfrac{1}{2} \times 0.50 \times 8.0^2 \times 0.020^2 = 6.4 \times 10^{-3}\,\text{J}$.'

  - id: p9-kinetic-energy
    section: '3.6'
    refs: [AP3]
    statement: 'The same mass of 0.50 kg oscillates with amplitude 0.020 m and angular frequency $8.0\,\text{rad}\,\text{s}^{-1}$. Find the kinetic energy when the displacement is 0.012 m.'
    answer_label: 'The kinetic energy'
    check: {kind: approx, value: "0.5 * 0.50 * 8.0**2 * (0.020**2 - 0.012**2)", target: "0.00410", tolerance: "0.0001"}
    answer_text: '$E_k = \tfrac{1}{2}m\omega^2(A^2 - x^2) = \tfrac{1}{2} \times 0.50 \times 64 \times (0.020^2 - 0.012^2) = 4.1 \times 10^{-3}\,\text{J}$.'

  - id: p10-length-for-period
    section: '3.6'
    refs: [AP3]
    statement: 'Find the length of a simple pendulum that has a period of exactly 1.50 s. Take $g = 9.81\,\text{m}\,\text{s}^{-2}$.'
    answer_label: 'The length'
    check: {kind: approx, value: "9.81 * 1.50**2 / (4 * pi**2)", target: "0.559", tolerance: "0.001"}
    answer_text: 'Rearranging $T = 2\pi\sqrt{\dfrac{l}{g}}$ gives $l = \dfrac{gT^2}{4\pi^2} = \dfrac{9.81 \times 2.25}{4\pi^2} = 0.56\,\text{m}$.'

  - id: p11-mean-period
    section: '3.6'
    refs: [AP3]
    statement: 'A student times the same oscillation four times and records 18.2 s, 18.1 s, 18.3 s and 18.2 s. Find the mean time and the mean period for one oscillation.'
    answer_label: 'The mean time and the period'
    check:
      kind: all
      checks:
        - {kind: statistic, data: ["18.2", "18.1", "18.3", "18.2"], stat: "mean", answer: "18.2"}
        - {kind: approx, value: "(18.2 + 18.1 + 18.3 + 18.2) / 4 / 10", target: "1.82", tolerance: "0.001"}
    answer_text: 'The mean of the four readings is 18.2 s. Dividing by 10 oscillations gives a period of 1.82 s. Repeating a timing reduces the effect of the reaction time, and dividing by 10 shares the uncertainty over 10 oscillations.'

  - id: p12-method-choice
    section: '3.6'
    refs: [AP3]
    statement: 'A mass on a spring is pulled down and released. Say which formula you would use to find the period, and explain why the amplitude does not appear in it.'
    answer_label: 'The formula and the reason'
    check:
      kind: structured
      requires: [choose-formula, amplitude-independent, restoring-force]
      concepts: [simple-harmonic-motion, period]
      points:
        - id: choose-formula
          text: 'Use T = 2 pi times the square root of m over k for a mass on a spring.'
          concepts: [period]
        - id: amplitude-independent
          text: 'The amplitude does not appear because the period of simple harmonic motion is independent of the amplitude.'
          concepts: [simple-harmonic-motion]
        - id: restoring-force
          text: 'The restoring force is proportional to the displacement, so a larger amplitude gives a larger force and a larger maximum speed, but the same time for one oscillation.'
          concepts: [simple-harmonic-motion]
    answer_text: 'Use $T = 2\pi\sqrt{\dfrac{m}{k}}$. The amplitude does not appear because the restoring force is proportional to the displacement, so the period is independent of the amplitude.'

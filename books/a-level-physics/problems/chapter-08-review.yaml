# Review practice for Chapter 8 (Quantum and nuclear physics).
#
# Mixed practice across the chapter and earlier chapters, with method-selection
# prompts. Both the questions and the answers on the Review page are rendered
# from these records: `:::problems` prints the numbered list, `:::answers` the
# solutions. The book declares `oracles: [sympy, units]`.
#
# A quantity with exact SI units is proved by `dimensions`. A value that depends
# on the electronvolt, the atomic mass unit, a square root or a logarithm is
# proved by `approx` with a stated tolerance. A method-selection reason is a
# `structured` record: presence, order and coverage only, never physics.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): this proves the
# arithmetic and the dimensions, not the physics. A dimensionally consistent,
# arithmetically correct, physically absurd answer would pass.
chapter: 8
problems:
  - id: r1-photon-frequency
    section: '8.1'
    refs: [AP8]
    statement: 'A photon has an energy of 2.5 eV. Find its frequency.'
    answer_label: 'The frequency'
    check: {kind: approx, value: "2.5 * 1.60e-19 / 6.63e-34", target: "6.03e14", tolerance: "1e13"}
    answer_text: '$f = \dfrac{E}{h} = \dfrac{2.5 \times 1.60 \times 10^{-19}}{6.63 \times 10^{-34}} = 6.0 \times 10^{14}\,\text{Hz}$.'

  - id: r2-photoelectric-kinetic
    section: '8.1'
    refs: [AP8]
    statement: 'Light of wavelength 450 nm falls on a metal of work function 2.20 eV. Find the maximum kinetic energy of the electrons, in eV.'
    answer_label: 'The maximum kinetic energy'
    check: {kind: approx, value: "6.63e-34 * 3.00e8 / 450e-9 / 1.60e-19 - 2.20", target: "0.56", tolerance: "0.02"}
    answer_text: 'The photon energy is $\dfrac{hc}{\lambda} = 4.42 \times 10^{-19}\,\text{J} = 2.76\,\text{eV}$, so $E_{k(\text{max})} = 2.76 - 2.20 = 0.56\,\text{eV}$.'

  - id: r3-de-broglie-speed
    section: '8.2'
    refs: [AP8]
    statement: 'An electron moves at 5.0e6 m/s. Find its de Broglie wavelength.'
    answer_label: 'The de Broglie wavelength'
    check: {kind: approx, value: "6.63e-34 / (9.11e-31 * 5.0e6)", target: "1.46e-10", tolerance: "1e-12"}
    answer_text: '$\lambda = \dfrac{h}{mv} = \dfrac{6.63 \times 10^{-34}}{9.11 \times 10^{-31} \times 5.0 \times 10^{6}} = 1.5 \times 10^{-10}\,\text{m}$.'

  - id: r4-de-broglie-accelerated
    section: '8.2'
    refs: [AP8]
    statement: 'An electron is accelerated through 250 V. Find its de Broglie wavelength.'
    answer_label: 'The de Broglie wavelength'
    check: {kind: approx, value: "6.63e-34 / sqrt(2 * 9.11e-31 * 250 * 1.60e-19)", target: "7.77e-11", tolerance: "1e-12"}
    answer_text: '$E_k = 4.0 \times 10^{-17}\,\text{J}$, then $p = \sqrt{2mE_k} = 8.54 \times 10^{-24}\,\text{kg}\,\text{m}\,\text{s}^{-1}$, so $\lambda = 7.8 \times 10^{-11}\,\text{m}$.'

  - id: r5-half-lives
    plays: decay-rate
    section: '8.3'
    refs: [AP8]
    statement: 'A source has an activity of 1200 Bq and a half-life of 8.0 days. Find its activity after 32 days.'
    answer_label: 'The activity'
    check:
      kind: dimensions
      expression: "A0 / 2**4"
      values:
        A0: {value: "1200", unit: "Bq"}
      answer: {value: "75", unit: "Bq"}
    answer_text: '32 days is four half-lives, so $A = \dfrac{1200}{2^4} = 75\,\text{Bq}$.'

  - id: r6-decay-constant
    section: '8.3'
    refs: [AP8]
    statement: 'A nuclide has a half-life of 8.0 days. Find its decay constant in s^-1.'
    answer_label: 'The decay constant'
    check: {kind: approx, value: "ln(2) / (8.0 * 86400)", target: "1.00e-6", tolerance: "1e-8"}
    answer_text: '$T_{1/2} = 8.0 \times 86400 = 6.91 \times 10^{5}\,\text{s}$, so $\lambda = \dfrac{\ln 2}{T_{1/2}} = 1.0 \times 10^{-6}\,\text{s}^{-1}$.'

  - id: r7-mass-defect-energy
    section: '8.4'
    refs: [AP8]
    statement: 'A nucleus has a mass defect of 0.025 u. Find its binding energy in MeV.'
    answer_label: 'The binding energy'
    check: {kind: approx, value: "0.025 * 931.5", target: "23.3", tolerance: "0.05"}
    answer_text: '$E = 0.025 \times 931.5 = 23.3\,\text{MeV}$.'

  - id: r8-annihilation
    section: '8.4'
    refs: [AP8]
    statement: 'An electron and a positron annihilate. Find the total energy released, in joules.'
    answer_label: 'The total energy'
    check: {kind: approx, value: "2 * 0.511 * 1.60e-13", target: "1.64e-13", tolerance: "1e-15"}
    answer_text: '$E = 2 \times 0.511\,\text{MeV} = 1.64 \times 10^{-13}\,\text{J}$.'

  - id: r9-convert-nm
    section: '8.1'
    refs: [AP8]
    statement: 'Write 250 nm in metres.'
    answer_label: 'The wavelength'
    check: {kind: convert, value: "250", from: "nm", to: "m", answer: "2.50e-7"}
    answer_text: '$250\,\text{nm} = 2.50 \times 10^{-7}\,\text{m}$.'

  - id: r10-fringe-spacing
    section: '8.2'
    refs: [AP8]
    statement: 'A laser of wavelength 633 nm passes through two slits 0.20 mm apart, and the screen is 2.0 m away. Find the fringe spacing.'
    answer_label: 'The fringe spacing'
    check: {kind: approx, value: "633e-9 * 2.0 / 0.20e-3", target: "6.33e-3", tolerance: "1e-5"}
    answer_text: 'From Section 6.1, $w = \dfrac{\lambda D}{s} = \dfrac{633 \times 10^{-9} \times 2.0}{0.20 \times 10^{-3}} = 6.3 \times 10^{-3}\,\text{m}$.'

  - id: r11-electron-speed-energy
    section: '8.2'
    refs: [AP8]
    statement: 'An electron is accelerated from rest through 400 V. Find its speed.'
    answer_label: 'The speed'
    check: {kind: approx, value: "sqrt(2 * 1.60e-19 * 400 / 9.11e-31)", target: "1.19e7", tolerance: "1e5"}
    answer_text: 'The kinetic energy is $E_k = eV = 6.4 \times 10^{-17}\,\text{J}$. Then $\dfrac{1}{2}mv^2 = E_k$, so $v = \sqrt{\dfrac{2E_k}{m}} = 1.2 \times 10^{7}\,\text{m}\,\text{s}^{-1}$.'

  - id: r12-uncertainty
    section: '8.3'
    refs: [AP8]
    statement: 'A half-life is measured as 5.35 minutes with an uncertainty of 2.0%. Find the absolute uncertainty.'
    answer_label: 'The absolute uncertainty'
    check: {kind: approx, value: "5.35 * 0.02", target: "0.107", tolerance: "0.001"}
    answer_text: '$0.020 \times 5.35 = 0.107\,\text{minutes}$, so the half-life is $5.35 \pm 0.11\,\text{min}$.'

  - id: r13-half-life-from-change
    section: '8.3'
    refs: [AP8]
    statement: 'A source falls from 800 Bq to 100 Bq in 24 hours. Find its half-life.'
    answer_label: 'The half-life'
    check: {kind: approx, value: "24 / 3", target: "8", tolerance: "0.1"}
    answer_text: '800 to 100 is three halvings, so the half-life is $\dfrac{24}{3} = 8.0\,\text{hours}$.'

  - id: r14-method-de-broglie
    section: '8.2'
    refs: [AP8]
    statement: 'A beam of electrons is accelerated through 300 V. State which equation you would use to find their de Broglie wavelength, and why.'
    check:
      kind: structured
      requires: [energy-first, momentum, de-broglie, not-photon]
      concepts: [de-broglie, momentum]
      points:
        - id: energy-first
          text: 'First find the kinetic energy of an electron from $E_k = eV$.'
          concepts: [momentum]
        - id: momentum
          text: 'Then find the momentum from $p = \sqrt{2mE_k}$.'
          concepts: [momentum]
        - id: de-broglie
          text: 'Then use the de Broglie equation, $\lambda = h/p$.'
          concepts: [de-broglie]
        - id: not-photon
          text: 'The photon equation $E = hf$ does not apply, because an electron is not a photon.'
          concepts: [de-broglie]

  - id: r15-method-mass-energy
    section: '8.4'
    refs: [AP8]
    statement: 'State which equation you would use to find the energy released when a nucleus loses mass, and why.'
    check:
      kind: structured
      requires: [mass-defect, mc2, not-hf, conservation]
      concepts: [mass-energy, mass-defect]
      points:
        - id: mass-defect
          text: 'Find the mass defect, the difference between the masses before and after.'
          concepts: [mass-defect]
        - id: mc2
          text: 'Then use $E = mc^2$ with the mass defect to find the energy released.'
          concepts: [mass-energy]
        - id: not-hf
          text: 'The photon equation $E = hf$ does not apply unless a photon of a known frequency is emitted.'
          concepts: [mass-energy]
        - id: conservation
          text: 'The method works because the total mass-energy is conserved, so the missing mass appears as energy.'
          concepts: [mass-energy]

# Practice set for 5.3 (Direct-current circuits).
#
# Both the questions and the answers on the page are rendered from these records.
# A resistance, a current and a potential difference are checked by `dimensions`,
# which keeps the units exact. A potential divider output and an equivalent
# resistance are checked by `evaluate`. A reason is a `structured` record.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): this proves the
# arithmetic and the dimensions, not the physics.
chapter: 5
problems:
  - id: p1-series
    plays: resistors-series
    section: '5.3'
    dfe: [AP5]
    statement: 'A $4.0\,\Omega$ and a $6.0\,\Omega$ resistor are connected in series. Find the equivalent resistance.'
    answer_label: 'The equivalent resistance'
    check:
      kind: dimensions
      expression: "R1 + R2"
      values:
        R1: {value: "4.0", unit: "ohm"}
        R2: {value: "6.0", unit: "ohm"}
      answer: {value: "10", unit: "ohm"}
    answer_text: 'Resistances in series add: $R_{\text{total}} = 4.0 + 6.0 = 10\,\Omega$.'

  - id: p2-parallel
    section: '5.3'
    dfe: [AP5]
    statement: 'A $12\,\Omega$ and a $4.0\,\Omega$ resistor are connected in parallel. Find the equivalent resistance.'
    answer_label: 'The equivalent resistance'
    check: {kind: evaluate, expression: "1 / (1/12 + 1/4.0)", answer: "3.0"}
    answer_text: '$\dfrac{1}{R} = \dfrac{1}{12} + \dfrac{1}{4.0} = \dfrac{1}{12} + \dfrac{3}{12} = \dfrac{4}{12}$, so $R = 3.0\,\Omega$. The equivalent resistance is smaller than either resistor.'

  - id: p3-series-parallel
    section: '5.3'
    dfe: [AP5]
    statement: 'A $4.0\,\Omega$ resistor is connected in series with a parallel pair of a $6.0\,\Omega$ and a $3.0\,\Omega$ resistor. Find the equivalent resistance of the whole circuit.'
    answer_label: 'The equivalent resistance'
    check: {kind: evaluate, expression: "4.0 + 1 / (1/6.0 + 1/3.0)", answer: "6.0"}
    answer_text: 'The parallel pair gives $\dfrac{1}{2.0}$, so its equivalent resistance is $2.0\,\Omega$. Adding the series resistor gives $R = 4.0 + 2.0 = 6.0\,\Omega$.'

  - id: p4-divider
    section: '5.3'
    dfe: [AP5]
    statement: 'A $3.0\,\text{k}\Omega$ and a $1.0\,\text{k}\Omega$ resistor are connected in series across a $12\,\text{V}$ supply. Find the potential difference across the $1.0\,\text{k}\Omega$ resistor.'
    answer_label: 'The output potential difference'
    check: {kind: evaluate, expression: "12 * 1.0 / (3.0 + 1.0)", answer: "3.0"}
    answer_text: '$V_{\text{out}} = 12 \times \dfrac{1.0}{3.0 + 1.0} = 12 \times \dfrac{1.0}{4.0} = 3.0\,\text{V}$.'

  - id: p5-internal
    plays: emf
    section: '5.3'
    dfe: [AP5]
    statement: 'A battery has an emf of $6.0\,\text{V}$ and an internal resistance of $0.50\,\Omega$. It is connected to a $2.5\,\Omega$ resistor. Find the current and the terminal potential difference.'
    answer_label: 'The current and the terminal potential difference'
    check:
      kind: dimensions
      expression: "emf / (R + r)"
      values:
        emf: {value: "6.0", unit: "V"}
        R: {value: "2.5", unit: "ohm"}
        r: {value: "0.50", unit: "ohm"}
      answer: {value: "2.0", unit: "A"}
    answer_text: '$I = \dfrac{6.0}{2.5 + 0.50} = \dfrac{6.0}{3.0} = 2.0\,\text{A}$ and $V = 6.0 - (2.0 \times 0.50) = 5.0\,\text{V}$.'

  - id: p6-junction
    section: '5.3'
    dfe: [AP5]
    statement: 'A current of $3.0\,\text{A}$ enters a junction. Two branches leave with currents of $0.80\,\text{A}$ and $1.2\,\text{A}$. Find the current in the third branch that leaves the junction.'
    answer_label: 'The third current'
    check: {kind: evaluate, expression: "3.0 - 0.80 - 1.2", answer: "1.0"}
    answer_text: 'By the junction rule, $I_3 = 3.0 - 0.80 - 1.2 = 1.0\,\text{A}$.'

  - id: p7-three-parallel
    section: '5.3'
    dfe: [AP5]
    statement: 'Three $30\,\Omega$ resistors are connected in parallel. Find the equivalent resistance.'
    answer_label: 'The equivalent resistance'
    check: {kind: evaluate, expression: "1 / (1/30 + 1/30 + 1/30)", answer: "10"}
    answer_text: '$\dfrac{1}{R} = \dfrac{1}{30} + \dfrac{1}{30} + \dfrac{1}{30} = \dfrac{3}{30} = \dfrac{1}{10}$, so $R = 10\,\Omega$. For $n$ equal resistors in parallel the equivalent resistance is one of them divided by $n$.'

  - id: p8-divider
    section: '5.3'
    dfe: [AP5]
    statement: 'A $2.0\,\text{k}\Omega$ and a $4.0\,\text{k}\Omega$ resistor are connected in series across a $9.0\,\text{V}$ supply. Find the potential difference across the $4.0\,\text{k}\Omega$ resistor.'
    answer_label: 'The output potential difference'
    check: {kind: evaluate, expression: "9.0 * 4.0 / (2.0 + 4.0)", answer: "6.0"}
    answer_text: '$V_{\text{out}} = 9.0 \times \dfrac{4.0}{2.0 + 4.0} = 9.0 \times \dfrac{4.0}{6.0} = 6.0\,\text{V}$.'

  - id: p9-internal-resistance
    plays: emf
    section: '5.3'
    dfe: [AP5]
    statement: 'A cell has an emf of $1.5\,\text{V}$ and an internal resistance of $0.40\,\Omega$. It drives a current of $0.30\,\text{A}$. Find the terminal potential difference and the external resistance.'
    answer_label: 'The terminal potential difference and the external resistance'
    check:
      kind: dimensions
      expression: "emf - I * r"
      values:
        emf: {value: "1.5", unit: "V"}
        I: {value: "0.30", unit: "A"}
        r: {value: "0.40", unit: "ohm"}
      answer: {value: "1.38", unit: "V"}
    answer_text: '$V = 1.5 - (0.30 \times 0.40) = 1.38\,\text{V}$. The external resistance is $R = \dfrac{V}{I} = \dfrac{1.38}{0.30} = 4.6\,\Omega$.'

  - id: p10-series-power
    section: '5.3'
    dfe: [AP5]
    statement: 'A $4.0\,\Omega$ and an $8.0\,\Omega$ resistor are connected in series across a $12\,\text{V}$ supply. Find the current, and the power dissipated in each resistor.'
    answer_label: 'The current and the two powers'
    check: {kind: evaluate, expression: "12 / (4.0 + 8.0)", answer: "1.0"}
    answer_text: 'The total resistance is $12\,\Omega$, so $I = \dfrac{12}{12} = 1.0\,\text{A}$. The powers are $P = I^2R = 1.0^2 \times 4.0 = 4.0\,\text{W}$ in the $4.0\,\Omega$ resistor and $1.0^2 \times 8.0 = 8.0\,\text{W}$ in the $8.0\,\Omega$ resistor. The larger resistor dissipates more power.'

  - id: p11-divider-sensor
    section: '5.3'
    dfe: [AP5]
    statement: 'A fixed resistor is connected in series with a light-dependent resistor (LDR) across a supply, and the output pd is taken across the LDR. Explain what happens to the output pd when the light level rises.'
    answer_label: 'The effect on the output pd'
    check:
      kind: structured
      requires: [ldr-resistance-falls, share-falls, output-falls]
      concepts: [potential-divider, light-dependent-resistor]
      points:
        - id: ldr-resistance-falls
          text: 'The resistance of an LDR falls when the light level rises, because more charge carriers are released.'
          concepts: [light-dependent-resistor]
        - id: share-falls
          text: 'In a potential divider the potential difference across each resistor is proportional to its resistance, because the current through both resistors is the same.'
          concepts: [potential-divider]
        - id: output-falls
          text: 'If the output is measured across the LDR, a smaller resistance means a smaller share of the supply pd, so the output pd falls. If the output were measured across the fixed resistor, it would rise.'
          concepts: [potential-divider, light-dependent-resistor]
    answer_text: 'When the light level rises the resistance of the LDR falls. It then takes a smaller share of the supply potential difference, so the output pd across the LDR falls.'

  - id: p12-method-choice
    section: '5.3'
    dfe: [AP5]
    statement: 'A circuit has a battery, a fixed resistor and a lamp in series, and an ammeter in the main loop. Say how you would find the resistance of the lamp, and which measurement you need as well as the ammeter reading.'
    answer_label: 'The method'
    check:
      kind: structured
      requires: [measure-current, measure-pd-across-lamp, divide]
      concepts: [resistance, potential-difference, current]
      points:
        - id: measure-current
          text: 'Read the current through the lamp from the ammeter in the main loop, because the same current flows through every component in a series circuit.'
          concepts: [current]
        - id: measure-pd-across-lamp
          text: 'Connect a voltmeter in parallel with the lamp and read the potential difference across the lamp.'
          concepts: [potential-difference]
        - id: divide
          text: 'Divide the potential difference across the lamp by the current through it to get the resistance, using R equals V divided by I.'
          concepts: [resistance]
    answer_text: 'Read the current from the ammeter and the potential difference across the lamp from a voltmeter connected in parallel with it. Then use $R = \dfrac{V}{I}$.'

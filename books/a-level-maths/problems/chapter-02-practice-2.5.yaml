# Practice set for 2.5, simultaneous equations by elimination and substitution.
#
# The `system` check solves with nonlinsolve and compares solutions as sets, so
# the order of the solutions and the order of the variables do not matter. Every
# answer is a pair (x, y), and both coordinates are proved.
chapter: 2
symbols:
  x: {real: true}
  y: {real: true}
problems:
  - id: p1-eliminate
    section: "2.5"
    refs: [B4]
    statement: 'Solve the simultaneous equations $2x + 3y = 7$ and $5x - y = 9$.'
    answer_label: 'The solution'
    check:
      kind: system
      equations: ["2*x + 3*y = 7", "5*x - y = 9"]
      variables: [x, y]
      answer: [[2, 1]]
    answer_text: 'Multiply the second equation by $3$: $15x - 3y = 27$. Adding removes $y$: $17x = 34$, so $x = 2$. Substitute back: $5 \times 2 - y = 9$, so $y = 1$. The solution is $(2, 1)$.'

  - id: p2-eliminate-two
    section: "2.5"
    refs: [B4]
    statement: 'Solve $3x + 2y = 16$ and $2x - y = 6$.'
    answer_label: 'The solution'
    check:
      kind: system
      equations: ["3*x + 2*y = 16", "2*x - y = 6"]
      variables: [x, y]
      answer: [[4, 2]]
    answer_text: 'Multiply the second equation by $2$: $4x - 2y = 12$. Add the two equations to remove $y$: $7x = 28$, so $x = 4$. Then $2 \times 4 - y = 6$ gives $y = 2$. The solution is $(4, 2)$.'

  - id: p3-line-and-circle
    section: "2.5"
    refs: [B4]
    statement: 'Solve $y = x + 1$ and $x^2 + y^2 = 25$.'
    answer_label: 'The solutions'
    check:
      kind: system
      equations: ["y = x + 1", "x**2 + y**2 = 25"]
      variables: [x, y]
      answer: [[3, 4], [-4, -3]]
    answer_text: 'Substitute $y = x + 1$: $x^2 + (x + 1)^2 = 25$, so $2x^2 + 2x - 24 = 0$ and $x^2 + x - 12 = 0$. Factorise to $(x + 4)(x - 3) = 0$, so $x = 3$ or $x = -4$. Then $y = x + 1$ gives the pairs $(3, 4)$ and $(-4, -3)$.'

  - id: p4-line-and-parabola
    section: "2.5"
    refs: [B4]
    statement: 'Solve $y = 2x + 1$ and $y = x^2 - 2$.'
    answer_label: 'The solutions'
    check:
      kind: system
      equations: ["y = 2*x + 1", "y = x**2 - 2"]
      variables: [x, y]
      answer: [[3, 7], [-1, -1]]
    answer_text: 'Set the right sides equal: $2x + 1 = x^2 - 2$, so $x^2 - 2x - 3 = 0$ and $(x - 3)(x + 1) = 0$. So $x = 3$ or $x = -1$. Substituting into $y = x^2 - 2$ gives $(3, 7)$ and $(-1, -1)$.'

  - id: p5-sum-and-product
    section: "2.5"
    refs: [B4]
    statement: 'Solve $x + y = 5$ and $xy = 6$.'
    answer_label: 'The solutions'
    check:
      kind: system
      equations: ["x + y = 5", "x*y = 6"]
      variables: [x, y]
      answer: [[2, 3], [3, 2]]
    answer_text: 'From $x + y = 5$, $y = 5 - x$. Substitute into $xy = 6$: $x(5 - x) = 6$, so $x^2 - 5x + 6 = 0$ and $(x - 2)(x - 3) = 0$. So $x = 2$ or $x = 3$, giving the pairs $(2, 3)$ and $(3, 2)$.'

  - id: p6-parabola-and-line
    section: "2.5"
    refs: [B4]
    statement: 'Solve $y = x^2$ and $y = 2x + 3$.'
    answer_label: 'The solutions'
    check:
      kind: system
      equations: ["y = x**2", "y = 2*x + 3"]
      variables: [x, y]
      answer: [[3, 9], [-1, 1]]
    answer_text: 'Set the expressions equal: $x^2 = 2x + 3$, so $x^2 - 2x - 3 = 0$ and $(x - 3)(x + 1) = 0$. So $x = 3$ or $x = -1$. Use $y = x^2$ to get the pairs $(3, 9)$ and $(-1, 1)$.'

  - id: p7-difference-of-squares
    section: "2.5"
    refs: [B4]
    statement: 'Solve $x + y = 4$ and $x^2 - y^2 = 8$.'
    answer_label: 'The solution'
    check:
      kind: system
      equations: ["x + y = 4", "x**2 - y**2 = 8"]
      variables: [x, y]
      answer: [[3, 1]]
    answer_text: 'Factorise the difference of two squares: $x^2 - y^2 = (x + y)(x - y) = 8$. Since $x + y = 4$, this gives $4(x - y) = 8$, so $x - y = 2$. Adding $x + y = 4$ and $x - y = 2$ gives $2x = 6$, so $x = 3$ and $y = 1$. The solution is $(3, 1)$.'

  - id: p8-tangent-line
    section: "2.5"
    refs: [B4]
    statement: 'Solve $x^2 + y^2 = 4$ and $y = x + 2$.'
    answer_label: 'The solutions'
    check:
      kind: system
      equations: ["x**2 + y**2 = 4", "y = x + 2"]
      variables: [x, y]
      answer: [[0, 2], [-2, 0]]
    answer_text: 'Substitute $y = x + 2$: $x^2 + (x + 2)^2 = 4$, so $2x^2 + 4x + 4 = 4$ and $2x^2 + 4x = 0$. Factorise as $2x(x + 2) = 0$, so $x = 0$ or $x = -2$. The pairs are $(0, 2)$ and $(-2, 0)$.'

  - id: p9-symmetric
    section: "2.5"
    refs: [B4]
    statement: 'Solve $x + y = 5$ and $x^2 + y^2 = 13$.'
    answer_label: 'The solutions'
    check:
      kind: system
      equations: ["x + y = 5", "x**2 + y**2 = 13"]
      variables: [x, y]
      answer: [[2, 3], [3, 2]]
    answer_text: 'From $y = 5 - x$, substitute: $x^2 + (5 - x)^2 = 13$, so $2x^2 - 10x + 25 = 13$ and $x^2 - 5x + 6 = 0$. Factorise to $(x - 2)(x - 3) = 0$, so $x = 2$ or $x = 3$, giving $(2, 3)$ and $(3, 2)$.'

  - id: p10-unit-circle
    section: "2.5"
    refs: [B4]
    statement: 'Solve $x + y = 1$ and $x^2 + y^2 = 1$.'
    answer_label: 'The solutions'
    check:
      kind: system
      equations: ["x + y = 1", "x**2 + y**2 = 1"]
      variables: [x, y]
      answer: [[0, 1], [1, 0]]
    answer_text: 'From $y = 1 - x$, substitute: $x^2 + (1 - x)^2 = 1$, so $2x^2 - 2x + 1 = 1$ and $2x(x - 1) = 0$. So $x = 0$ or $x = 1$, giving $(0, 1)$ and $(1, 0)$.'

  - id: p11-fraction-coordinates
    section: "2.5"
    refs: [B4]
    statement: 'Solve $x + 2y = 4$ and $x^2 + y^2 = 16$.'
    answer_label: 'The solutions'
    check:
      kind: system
      equations: ["x + 2*y = 4", "x**2 + y**2 = 16"]
      variables: [x, y]
      answer: [[4, 0], ["-12/5", "16/5"]]
    answer_text: 'From $x = 4 - 2y$, substitute: $(4 - 2y)^2 + y^2 = 16$, so $5y^2 - 16y = 0$. Factorise as $y(5y - 16) = 0$, so $y = 0$ or $y = \frac{16}{5}$. Then $x = 4$ or $x = -\frac{12}{5}$. The pairs are $(4, 0)$ and $\left(-\frac{12}{5}, \frac{16}{5}\right)$.'

  - id: p12-graphical-meeting
    section: "2.5"
    refs: [B4]
    statement: 'The curve $y = x^2$ and the line $y = 4$ meet at two points. Solve the pair of equations to find them, and explain what the solutions mean on a graph.'
    answer_label: 'The points and their meaning'
    check:
      kind: system
      equations: ["y = x**2", "y = 4"]
      variables: [x, y]
      answer: [[2, 4], [-2, 4]]
    answer_text: 'Substitute $y = 4$ into $y = x^2$: $x^2 = 4$, so $x = 2$ or $x = -2$. The points are $(2, 4)$ and $(-2, 4)$. On a graph these are the two places where the horizontal line $y = 4$ cuts the parabola, one on each side of the $y$-axis.'

# Practice set for 10.2, magnitude and direction.
#
# A magnitude is the norm of the vector; a direction is atan2, kept exact where
# it can be and compared to a stated tolerance in degrees where it cannot. The
# direction is measured anticlockwise from the positive x-axis unless the
# statement says otherwise.
chapter: 10
problems:
  - id: p1-magnitude-6-8
    section: "10.2"
    dfe: [J2]
    statement: 'Find the magnitude of $\mathbf{a} = 6\mathbf{i} + 8\mathbf{j}$.'
    answer_label: 'The magnitude'
    check:
      kind: vector
      op: norm
      args: ["Matrix([6, 8])"]
      answer: "10"
    answer_text: '$|\mathbf{a}| = \sqrt{6^2 + 8^2} = \sqrt{36 + 64} = \sqrt{100} = 10$.'

  - id: p2-magnitude-negative
    section: "10.2"
    dfe: [J2]
    statement: 'Find the magnitude of $\mathbf{b} = -7\mathbf{i} + 24\mathbf{j}$.'
    answer_label: 'The magnitude'
    check:
      kind: vector
      op: norm
      args: ["Matrix([-7, 24])"]
      answer: "25"
    answer_text: '$|\mathbf{b}| = \sqrt{(-7)^2 + 24^2} = \sqrt{49 + 576} = \sqrt{625} = 25$. Squaring removes the negative sign.'

  - id: p3-magnitude-3d
    section: "10.2"
    dfe: [J2]
    statement: 'Find the magnitude of $\mathbf{c} = 2\mathbf{i} - 6\mathbf{j} + 3\mathbf{k}$.'
    answer_label: 'The magnitude'
    check:
      kind: vector
      op: norm
      args: ["Matrix([2, -6, 3])"]
      answer: "7"
    answer_text: '$|\mathbf{c}| = \sqrt{2^2 + (-6)^2 + 3^2} = \sqrt{4 + 36 + 9} = \sqrt{49} = 7$.'

  - id: p4-direction-60
    section: "10.2"
    dfe: [J2]
    statement: 'Find the direction of $\mathbf{a} = \mathbf{i} + \sqrt{3}\mathbf{j}$ as an angle from the positive $x$-axis.'
    answer_label: 'The direction in degrees'
    check:
      kind: approx
      value: "atan(sqrt(3)) * 180 / pi"
      target: "60"
      tolerance: "0.001"
    answer_text: 'Both components are positive, so the vector is in the first quadrant. $\tan\theta = \dfrac{\sqrt{3}}{1} = \sqrt{3}$, so $\theta = 60^\circ$.'

  - id: p5-direction-third-quadrant
    section: "10.2"
    dfe: [J2]
    statement: 'Find the direction of $\mathbf{b} = -\mathbf{i} - \mathbf{j}$ as an anticlockwise angle from the positive $x$-axis, between $0^\circ$ and $360^\circ$.'
    answer_label: 'The direction in degrees'
    check:
      kind: approx
      value: "atan2(-1, -1) * 180 / pi + 360"
      target: "225"
      tolerance: "0.001"
    answer_text: 'Both components are negative, so the vector is in the third quadrant. Its angle to the negative $x$-axis is $45^\circ$, so its anticlockwise direction is $180^\circ + 45^\circ = 225^\circ$.'

  - id: p6-direction-fourth-quadrant
    section: "10.2"
    dfe: [J2]
    statement: 'Find the direction of $\mathbf{c} = 3\mathbf{i} - 3\mathbf{j}$ as an anticlockwise angle from the positive $x$-axis, between $0^\circ$ and $360^\circ$.'
    answer_label: 'The direction in degrees'
    check:
      kind: approx
      value: "atan2(-3, 3) * 180 / pi + 360"
      target: "315"
      tolerance: "0.001"
    answer_text: 'The vector is in the fourth quadrant. Its angle below the positive $x$-axis is $\tan^{-1}(1) = 45^\circ$, so its anticlockwise direction is $360^\circ - 45^\circ = 315^\circ$.'

  - id: p7-unit-vector
    section: "10.2"
    dfe: [J2]
    statement: 'Find the unit vector in the direction of $\mathbf{a} = 6\mathbf{i} + 8\mathbf{j}$.'
    answer_label: 'The unit vector'
    check:
      kind: vector
      op: unit
      args: ["Matrix([6, 8])"]
      answer: "Matrix([3/5, 4/5])"
    answer_text: '$|\mathbf{a}| = 10$, so $\hat{\mathbf{a}} = \dfrac{1}{10}(6\mathbf{i} + 8\mathbf{j}) = \dfrac{3}{5}\mathbf{i} + \dfrac{4}{5}\mathbf{j}$. Check: $\sqrt{(3/5)^2 + (4/5)^2} = 1$.'

  - id: p8-components-from-force
    section: "10.2"
    dfe: [J2]
    statement: 'A force of $20$ N acts at $60^\circ$ above the horizontal. Find its horizontal and vertical components, exactly.'
    answer_label: 'The two components'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "20*cos(pi/3)", answer: "10"}
        - {kind: evaluate, expression: "20*sin(pi/3)", answer: "10*sqrt(3)"}
    answer_text: '$F_x = 20\cos 60^\circ = 20 \times \dfrac{1}{2} = 10$ N and $F_y = 20\sin 60^\circ = 20 \times \dfrac{\sqrt{3}}{2} = 10\sqrt{3}$ N. The force is $10\mathbf{i} + 10\sqrt{3}\mathbf{j}$ N.'

  - id: p9-components-from-bearing
    section: "10.2"
    dfe: [J2]
    statement: 'A cyclist rides $8$ km on a bearing of $030^\circ$. Find the displacement from the start, with east as $\mathbf{i}$ and north as $\mathbf{j}$, exactly.'
    answer_label: 'The two components'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "8*sin(pi/6)", answer: "4"}
        - {kind: evaluate, expression: "8*cos(pi/6)", answer: "4*sqrt(3)"}
    answer_text: 'A bearing is measured from north, so the east component uses sine and the north component uses cosine. East $= 8\sin 30^\circ = 4$ km and north $= 8\cos 30^\circ = 4\sqrt{3}$ km. The displacement is $4\mathbf{i} + 4\sqrt{3}\mathbf{j}$ km.'

  - id: p10-components-from-tangent
    section: "10.2"
    dfe: [J2]
    statement: 'A vector has magnitude $25$ and lies in the first quadrant. The angle $\theta$ it makes with the positive $x$-axis satisfies $\tan\theta = \dfrac{7}{24}$. Find its two components.'
    answer_label: 'The two components'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "25*(24/25)", answer: "24"}
        - {kind: evaluate, expression: "25*(7/25)", answer: "7"}
    answer_text: 'The components form a $7$–$24$–$25$ right-angled triangle, so $\cos\theta = \dfrac{24}{25}$ and $\sin\theta = \dfrac{7}{25}$. The components are $25 \times \dfrac{24}{25} = 24$ and $25 \times \dfrac{7}{25} = 7$.'

  - id: p11-distance-to-drone
    section: "10.2"
    dfe: [J2]
    statement: 'A drone is $3$ m east, $4$ m north and $12$ m above its base. Find its distance from the base.'
    answer_label: 'The distance'
    check:
      kind: vector
      op: norm
      args: ["Matrix([3, 4, 12])"]
      answer: "13"
    answer_text: 'The displacement is $3\mathbf{i} + 4\mathbf{j} + 12\mathbf{k}$ m, so the distance is $\sqrt{3^2 + 4^2 + 12^2} = \sqrt{9 + 16 + 144} = \sqrt{169} = 13$ m.'

  - id: p12-magnitude-of-a-velocity
    section: "10.2"
    dfe: [J2]
    statement: 'A current has velocity $-4\mathbf{i} + 3\mathbf{j}$ m/s. Find its speed and the angle it makes with the positive $x$-axis.'
    answer_label: 'The speed and the direction'
    check:
      kind: all
      checks:
        - {kind: vector, op: norm, args: ["Matrix([-4, 3])"], answer: "5"}
        - {kind: approx, value: "atan2(3, -4) * 180 / pi", target: "143.13", tolerance: "0.01"}
    answer_text: 'The speed is the magnitude: $\sqrt{(-4)^2 + 3^2} = 5$ m/s. The vector is in the second quadrant, so the angle from the positive $x$-axis is $180^\circ - \tan^{-1}\left(\dfrac{3}{4}\right) = 180^\circ - 36.9^\circ = 143.1^\circ$.'

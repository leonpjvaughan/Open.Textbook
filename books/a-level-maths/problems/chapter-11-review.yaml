# Review bank for Chapter 11. The items mix this chapter with earlier chapters,
# so the reader chooses a method before calculating. Each check proves the
# arithmetic; the choice of method and the reason for it are human review.
chapter: 11
symbols:
  x: {real: true}
  y: {real: true}
  n: {integer: true}
problems:
  - id: r1-mean
    section: "11.5"
    refs: [L3]
    statement: 'Find the mean of $12, 15, 16, 18, 20, 21$.'
    answer_label: 'The mean'
    check:
      kind: statistic
      data: [12, 15, 16, 18, 20, 21]
      stat: mean
      answer: "17"
    answer_text: 'The values sum to 102 over 6 values, so the mean is $\dfrac{102}{6} = 17$.'

  - id: r2-standard-deviation
    section: "11.5"
    refs: [L3]
    statement: 'Find the standard deviation of $12, 15, 16, 18, 20, 21$, dividing by $n$.'
    answer_label: 'The standard deviation'
    check:
      kind: statistic
      data: [12, 15, 16, 18, 20, 21]
      stat: std
      convention: population
      answer: "2*sqrt(21)/3"
    answer_text: 'The mean is 17. The squared deviations sum to 56, so the variance is $\dfrac{56}{6} = \dfrac{28}{3}$ and $\sigma = \dfrac{2\sqrt{21}}{3} = 3.06$ (3 s.f.).'

  - id: r3-interquartile-range
    section: "11.6"
    refs: [L4]
    statement: 'Find the interquartile range of $12, 15, 16, 18, 20, 21$, using the $(n + 1)$ positions.'
    answer_label: 'The interquartile range'
    check:
      kind: statistic
      data: [12, 15, 16, 18, 20, 21]
      stat: iqr
      convention: linear
      answer: "6"
    answer_text: 'The position of $Q_1$ is $\dfrac{7}{4} = 1.75$, giving $Q_1 = 14.25$. The position of $Q_3$ is $\dfrac{21}{4} = 5.25$, giving $Q_3 = 20.25$. The IQR is $20.25 - 14.25 = 6$.'

  - id: r4-frequency-density
    section: "11.3"
    refs: [L1]
    statement: 'A class of width 10 contains 45 values. Find the frequency density.'
    answer_label: 'The frequency density'
    check:
      kind: evaluate
      expression: "45 / 10"
      answer: "9/2"
    answer_text: 'Frequency density is frequency divided by class width: $\dfrac{45}{10} = 4.5 = \dfrac{9}{2}$.'

  - id: r5-stratified-sample
    section: "11.2"
    refs: [K1]
    statement: 'A population has 450 members in one stratum and 150 in another. A stratified sample of 60 is taken. Find the number from the 450 stratum.'
    answer_label: 'The sample size from the 450 stratum'
    check:
      kind: evaluate
      expression: "(450 / 600) * 60"
      answer: "45"
    answer_text: 'The population is 600, so the 450 stratum gives $\dfrac{450}{600} \times 60 = 45$ members. The other stratum gives 15, and the two add to 60.'

  - id: r6-population-total
    section: "11.1"
    refs: [K1]
    statement: 'A sample of 40 pupils has a mean of $2.5$ hours of sport each week. Estimate the total number of hours of sport each week for 800 pupils.'
    answer_label: 'The estimated total'
    check:
      kind: evaluate
      expression: "2.5 * 800"
      answer: "2000"
    answer_text: 'Multiply the sample mean by the population size: $2.5 \times 800 = 2000$ hours. This is an informal inference about the population.'

  - id: r7-gradient
    section: "11.4"
    refs: [L2]
    statement: 'A line of best fit passes through $(3, 11)$ and $(7, 23)$. Find its gradient.'
    answer_label: 'The gradient'
    check:
      kind: evaluate
      expression: "(23 - 11) / (7 - 3)"
      answer: "3"
    answer_text: 'The gradient is $\dfrac{23 - 11}{7 - 3} = 3$, so each extra unit of the explanatory variable is associated with about 3 extra units of the response.'

  - id: r8-histogram-probability
    section: "11.3"
    refs: [L1]
    statement: 'A histogram of 150 values has frequency density $2.5$ in the class $10$–$30$. Estimate the probability that a value lies in the class.'
    answer_label: 'The estimated probability'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "2.5 * 20", answer: "50"}
        - {kind: evaluate, expression: "50 / 150", answer: "1/3"}
    answer_text: 'The frequency is $2.5 \times 20 = 50$, so the probability is $\dfrac{50}{150} = \dfrac{1}{3}$. This is the area over the total frequency.'

  - id: r9-variance-summary
    section: "11.5"
    refs: [L3]
    statement: 'A data set has $n = 12$, $\sum x = 96$ and $\sum x^2 = 1000$. Find the variance, dividing by $n$.'
    answer_label: 'The variance'
    check:
      kind: evaluate
      expression: "1000 / 12 - (96 / 12)**2"
      answer: "58/3"
    answer_text: 'The mean is $\bar{x} = 8$. Then the variance is $\dfrac{1000}{12} - 8^2 = \dfrac{250}{3} - 64 = \dfrac{58}{3} = 19.33$ (3 s.f.).'

  - id: r10-arithmetic-series
    section: "4.5"
    refs: [D4]
    statement: 'A survey runs for 12 weeks. It gets 40 responses in week 1, and each later week gets 6 more responses than the week before. Find the total number of responses over the 12 weeks.'
    answer_label: 'The total number of responses'
    check:
      kind: apply
      expression: "40 + 6 * (n - 1)"
      apply: {op: sum, args: [n, "1", "12"]}
      answer: "876"
    answer_text: 'This is an arithmetic series with first term 40 and common difference 6. The sum is $\dfrac{12}{2}\left(2(40) + 11(6)\right) = 6(80 + 66) = 876$ responses. Sequences come from Chapter 4.'

  - id: r11-quadratic
    section: "2.4"
    refs: [B3]
    statement: 'Solve $x^2 - 5x + 6 = 0$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "x**2 - 5*x + 6 = 0"
      variable: "x"
      answer: ["2", "3"]
    answer_text: 'Factorise: $(x - 2)(x - 3) = 0$, so $x = 2$ or $x = 3$. Quadratics come from Chapter 2.'

  - id: r12-line-equation
    section: "3.1"
    refs: [C1]
    statement: 'A straight line passes through $(1, 4)$ and $(5, 16)$. Find its gradient and its intercept on the $y$-axis.'
    answer_label: 'The gradient and intercept'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(16 - 4) / (5 - 1)", answer: "3"}
        - {kind: evaluate, expression: "4 - 3 * 1", answer: "1"}
    answer_text: 'The gradient is $\dfrac{16 - 4}{5 - 1} = 3$. Using $y = 3x + c$ at $(1, 4)$ gives $4 = 3 + c$, so $c = 1$ and the line is $y = 3x + 1$. Straight lines come from Chapter 3.'

  - id: r13-simultaneous
    section: "2.5"
    refs: [B4]
    statement: 'Solve the simultaneous equations $2x + y = 11$ and $x - y = 1$.'
    answer_label: 'The solution'
    check:
      kind: system
      equations: ["2*x + y = 11", "x - y = 1"]
      variables: ["x", "y"]
      answer:
        - {x: "4", y: "3"}
    answer_text: 'Adding the equations gives $3x = 12$, so $x = 4$. Then $y = x - 1 = 3$. Check: $2(4) + 3 = 11$. Simultaneous equations come from Chapter 2.'

  - id: r14-index-laws
    section: "2.1"
    refs: [B1]
    statement: 'Work out $27^{2/3}$.'
    answer_label: 'The value'
    check:
      kind: evaluate
      expression: "27**(2/3)"
      answer: "9"
    answer_text: 'The cube root of 27 is 3, and $3^2 = 9$. So $27^{2/3} = 9$. Index laws come from Chapter 2.'

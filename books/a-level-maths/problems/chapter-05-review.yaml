# Review bank for Chapter 5 (Trigonometry).
#
# Twelve mixed-practice questions mixing Chapter 5 with Chapters 1, 2, 3 and 4.
# Every exact value, identity, harmonic form, equation, expansion, line and
# resolved component is proved by the SymPy oracle, using `rounded` or `approx`
# where decimal rounding is required.
#
# Honest limit: the verifier proves the trigonometric algebra and numerical
# rounding, not the reader's choice of method or the prose structure of a proof.
chapter: 5
symbols:
  theta: {real: true}
  x: {real: true}
  m: {integer: true}
  n: {integer: true}
problems:
  - id: r1-exact-tan
    section: '5.4'
    refs: [E3]
    statement: 'Work out the exact value of $\tan\dfrac{4\pi}{3}$.'
    answer_label: 'The exact value'
    check:
      kind: evaluate
      expression: 'tan(4*pi/3)'
      answer: 'sqrt(3)'
    answer_text: '**Exact value in the third quadrant.** $\dfrac{4\pi}{3}$ is in the third quadrant where tangent is positive, with related acute angle $\dfrac{\pi}{3}$, so $\tan\dfrac{4\pi}{3} = \tan\dfrac{\pi}{3} = \sqrt{3}$.'

  - id: r2-cosine-rule-largest
    section: '5.1'
    refs: [E1]
    statement: 'A triangle has sides $7$ cm, $8$ cm and $11$ cm. Find the largest angle.'
    answer_label: 'The largest angle'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '(7**2 + 8**2 - 11**2) / (2 * 7 * 8)', answer: '-1/14'}
        - {kind: approx, value: 'acos(-1/14) * 180 / pi', target: '94.1', tolerance: '0.05'}
    answer_text: '**Cosine rule, largest angle opposite the longest side.** The $11$ cm side faces the largest angle $C$: $\cos C = \dfrac{7^2 + 8^2 - 11^2}{2 \times 7 \times 8} = \dfrac{49 + 64 - 121}{112} = -\dfrac{1}{14}$, so $C = \arccos\left(-\dfrac{1}{14}\right) \approx 94.1^\circ$ to three significant figures.'

  - id: r3-arc-and-sector
    section: '5.2'
    refs: [E1]
    statement: 'A sector has radius $6$ cm and angle $1.4$ radians. Find the arc length and the sector area.'
    answer_label: 'Arc length and sector area'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '6 * (14/10)', answer: '42/5'}
        - {kind: evaluate, expression: '(1/2) * 6**2 * (14/10)', answer: '126/5'}
    answer_text: '**Arc and sector formulae in radians.** Arc length $= r\theta = 6 \times 1.4 = 8.4$ cm. Sector area $= \dfrac{1}{2}r^2\theta = \dfrac{1}{2} \times 36 \times 1.4 = 25.2$ cm$^2$.'

  - id: r4-trig-identity
    section: '5.7'
    refs: [E5]
    statement: 'Prove that $\dfrac{\cos\theta}{1 - \sin\theta} \equiv \dfrac{1 + \sin\theta}{\cos\theta}$ for $\cos\theta \ne 0$.'
    answer_label: 'Proof of the identity'
    check:
      kind: evaluate
      expression: 'cos(theta) / (1 - sin(theta))'
      answer: '(1 + sin(theta)) / cos(theta)'
    answer_text: '**Multiply numerator and denominator by $1 + \sin\theta$.** Starting on the left: $\dfrac{\cos\theta(1 + \sin\theta)}{(1 - \sin\theta)(1 + \sin\theta)} = \dfrac{\cos\theta(1 + \sin\theta)}{1 - \sin^2\theta} = \dfrac{\cos\theta(1 + \sin\theta)}{\cos^2\theta} = \dfrac{1 + \sin\theta}{\cos\theta}$.'

  - id: r5-single-wave-form
    section: '5.9'
    refs: [E6]
    statement: 'Write $8\cos\theta - 6\sin\theta$ in the form $R\cos(\theta - \alpha)$, and state its greatest value.'
    answer_label: 'Single-wave form and greatest value'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: 'sqrt(8**2 + (-6)**2)', answer: '10'}
        - {kind: apply, expression: '10*cos(theta + atan(3/4))', apply: {op: expand_trig}, answer: '8*cos(theta) - 6*sin(theta)'}
        - {kind: rounded, value: 'atan(-3/4)', rounded: '-0.644', to: '0.001'}
    answer_text: '**Single-wave form.** $R = \sqrt{8^2 + (-6)^2} = 10$. Matching $R\cos\alpha = 8$ and $R\sin\alpha = -6$ gives $\tan\alpha = -\dfrac{3}{4}$ with $\alpha$ in the fourth quadrant, so $\alpha = -\arctan\left(\dfrac{3}{4}\right) \approx -0.644$ radians. Thus $8\cos\theta - 6\sin\theta = 10\cos(\theta + 0.644)$, and its greatest value is $10$.'

  - id: r6-solve-sin-equation
    section: '5.10'
    refs: [E7]
    statement: 'Solve $4\sin\theta = 3$ for $0 \le \theta < 2\pi$, giving answers in radians to three decimal places.'
    answer_label: 'The solutions in radians'
    check:
      kind: all
      checks:
        - {kind: rounded, value: 'asin(3/4)', rounded: '0.848', to: '0.001'}
        - {kind: rounded, value: 'pi - asin(3/4)', rounded: '2.294', to: '0.001'}
    answer_text: '**Principal value, then symmetry of sine.** $\sin\theta = \dfrac{3}{4}$, so the principal value is $\arcsin\left(\dfrac{3}{4}\right) \approx 0.848$ radians. The second solution in $[0, 2\pi)$ is $\pi - \arcsin\left(\dfrac{3}{4}\right) \approx 2.294$ radians.'

  - id: r7-expand-cube
    section: '4.1'
    refs: [D1]
    statement: 'Expand $(2x - 3)^3$.'
    answer_label: 'The expansion'
    check:
      kind: evaluate
      expression: '(2*x - 3)**3'
      answer: '8*x**3 - 36*x**2 + 54*x - 27'
    answer_text: '**Binomial expansion.** $(2x - 3)^3 = (2x)^3 + 3(2x)^2(-3) + 3(2x)(-3)^2 + (-3)^3 = 8x^3 - 36x^2 + 54x - 27$.'

  - id: r8-perpendicular-line
    section: '3.2'
    refs: [C1]
    statement: 'Find the equation of the line through $(3, -1)$ perpendicular to $y = 2x + 5$.'
    answer_label: 'The perpendicular line'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '-1 - (1/2)*(x - 3)', answer: '-x/2 + 1/2'}
        - {kind: evaluate, expression: '3 + 2*(-1) - 1', answer: '0'}
    answer_text: '**Perpendicular gradient, then a point.** The gradient of $y = 2x + 5$ is $2$, so the perpendicular gradient is $-\dfrac{1}{2}$. Through $(3, -1)$: $y + 1 = -\dfrac{1}{2}(x - 3)$, which gives $y = -\dfrac{1}{2}x + \dfrac{1}{2}$, or $x + 2y - 1 = 0$.'

  - id: r9-sum-two-odds
    section: '1.2'
    refs: [A1]
    statement: 'Show that the sum of two odd numbers is even.'
    answer_label: 'Method and proof'
    check:
      kind: evaluate
      expression: '(2*m + 1) + (2*n + 1)'
      answer: '2*(m + n + 1)'
    answer_text: '**Deduction with general letters.** Let the numbers be $2m + 1$ and $2n + 1$ for whole numbers $m$ and $n$. Their sum is $2m + 2n + 2 = 2(m + n + 1)$, which has a factor of $2$, so the sum is even.'

  - id: r10-quadratic-x-intercepts
    section: '2.4'
    refs: [B3]
    statement: 'Find where the curve $y = x^2 - 4x + 3$ crosses the $x$-axis.'
    answer_label: 'The $x$-intercepts'
    check:
      kind: solve
      equation: 'x**2 - 4*x + 3 = 0'
      variable: x
      answer: ['1', '3']
    answer_text: '**Factorise the quadratic.** Setting $y = 0$ gives $x^2 - 4x + 3 = (x - 1)(x - 3) = 0$, so $x = 1$ or $x = 3$. The curve crosses the $x$-axis at $(1, 0)$ and $(3, 0)$.'

  - id: r11-wave-properties
    section: '5.3'
    refs: [E3]
    statement: 'A wave is modelled by $y = 6\sin(3t) + 1$. State its amplitude, period and range.'
    answer_label: 'Amplitude, period and range'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: 'Abs(6)', answer: '6'}
        - {kind: evaluate, expression: '2*pi / 3', answer: '2*pi/3'}
        - {kind: evaluate, expression: '1 - 6', answer: '-5'}
        - {kind: evaluate, expression: '1 + 6', answer: '7'}
    answer_text: '**Read the wave parameters.** The amplitude is $6$, the period is $\dfrac{2\pi}{3}$, and because the centre line is $y = 1$, the range is $1 - 6 \le y \le 1 + 6$, which is $-5 \le y \le 7$.'

  - id: r12-resolve-force
    section: '5.12'
    refs: [E9]
    statement: 'A force of $30$ N acts at $55^\circ$ above the horizontal. Find its two perpendicular components, to three significant figures.'
    answer_label: 'Horizontal and vertical components'
    check:
      kind: all
      checks:
        - {kind: approx, value: '30 * cos(55*pi/180)', target: '17.2', tolerance: '0.05'}
        - {kind: approx, value: '30 * sin(55*pi/180)', target: '24.6', tolerance: '0.05'}
    answer_text: '**Resolve with cosine and sine.** The horizontal component is $30\cos 55^\circ \approx 17.2$ N, and the vertical component is $30\sin 55^\circ \approx 24.6$ N, both to three significant figures.'

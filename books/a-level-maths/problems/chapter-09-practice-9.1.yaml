# Practice set for 9.1, locating roots by change of sign.
#
# Each bracket is proved by the two sign comparisons at its ends: a compare
# sub-check states the sign, not merely the value. Where a root is narrowed, the
# interval is proved by the same two signs, so the stated bracket is verified.
chapter: 9
symbols:
  x: {real: true}
problems:
  - id: s1-bracket-cubic
    section: "9.1"
    refs: [I1]
    statement: 'Show that $x^3 + x - 1 = 0$ has a root between $0$ and $1$.'
    answer_label: 'The two values'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "<", lhs: "0**3 + 0 - 1", rhs: "0"}
        - {kind: compare, relation: ">", lhs: "1**3 + 1 - 1", rhs: "0"}
    answer_text: 'At $x = 0$ the value is $-1 < 0$, and at $x = 1$ it is $1 > 0$. The signs differ, so the graph crosses the axis between $0$ and $1$.'

  - id: s2-bracket-cubic-two
    section: "9.1"
    refs: [I1]
    statement: 'Show that $x^3 + 3x - 2 = 0$ has a root between $0$ and $1$.'
    answer_label: 'The two values'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "<", lhs: "0**3 + 3*0 - 2", rhs: "0"}
        - {kind: compare, relation: ">", lhs: "1**3 + 3*1 - 2", rhs: "0"}
    answer_text: 'At $x = 0$ the value is $-2 < 0$, and at $x = 1$ it is $2 > 0$. The signs differ, so a root lies in $(0, 1)$.'

  - id: s3-bracket-exponential
    section: "9.1"
    refs: [I1]
    statement: 'Show that $e^x = 3x$ has a root between $1$ and $2$.'
    answer_label: 'The two values'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "<", lhs: "E - 3", rhs: "0"}
        - {kind: compare, relation: ">", lhs: "E**2 - 6", rhs: "0"}
    answer_text: 'Rearrange to $e^x - 3x = 0$. At $x = 1$ the value is $e - 3 = -0.2817\ldots < 0$, and at $x = 2$ it is $e^2 - 6 = 1.3891\ldots > 0$. The signs differ, so a root lies in $(1, 2)$.'

  - id: s4-bracket-logarithm
    section: "9.1"
    refs: [I1]
    statement: 'Show that $x + \ln x = 0$ has a root between $0.5$ and $0.6$.'
    answer_label: 'The two values'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "<", lhs: "0.5 + ln(0.5)", rhs: "0"}
        - {kind: compare, relation: ">", lhs: "0.6 + ln(0.6)", rhs: "0"}
    answer_text: 'At $x = 0.5$ the value is $0.5 + \ln 0.5 = -0.1931\ldots < 0$, and at $x = 0.6$ it is $0.6 + \ln 0.6 = 0.0892\ldots > 0$. The signs differ, so a root lies in $(0.5, 0.6)$.'

  - id: s5-narrow-to-tenth
    section: "9.1"
    refs: [I1]
    statement: 'Show that the root of $x^3 + x - 1 = 0$ lies between $0.6$ and $0.7$.'
    answer_label: 'The two values'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "<", lhs: "0.6**3 + 0.6 - 1", rhs: "0"}
        - {kind: compare, relation: ">", lhs: "0.7**3 + 0.7 - 1", rhs: "0"}
    answer_text: 'At $x = 0.6$ the value is $0.216 + 0.6 - 1 = -0.184 < 0$, and at $x = 0.7$ it is $0.343 + 0.7 - 1 = 0.043 > 0$. The sign changes, so the root lies in $(0.6, 0.7)$.'

  - id: s6-narrow-to-hundredth
    section: "9.1"
    refs: [I1]
    statement: 'Show that the root of $x^3 + x - 1 = 0$ lies between $0.68$ and $0.69$.'
    answer_label: 'The two values'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "<", lhs: "0.68**3 + 0.68 - 1", rhs: "0"}
        - {kind: compare, relation: ">", lhs: "0.69**3 + 0.69 - 1", rhs: "0"}
    answer_text: 'At $x = 0.68$ the value is $0.314432 + 0.68 - 1 = -0.005568 < 0$, and at $x = 0.69$ it is $0.328509 + 0.69 - 1 = 0.018509 > 0$. The root lies in $(0.68, 0.69)$.'

  - id: s7-repeated-root
    section: "9.1"
    refs: [I1]
    statement: 'For $f(x) = (x - 1)^2$, work out $f(0)$ and $f(2)$. Explain why the change of sign does not find the root at $x = 1$.'
    answer_label: 'The two values'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(0 - 1)**2", answer: "1"}
        - {kind: evaluate, expression: "(2 - 1)**2", answer: "1"}
    answer_text: '$f(0) = 1$ and $f(2) = 1$, so the sign does not change. The root at $x = 1$ is repeated: the graph touches the axis and turns back, so no interval around it has a sign change.'

  - id: s8-discontinuity
    section: "9.1"
    refs: [I1]
    statement: 'For $f(x) = \dfrac{1}{x}$ on the interval $[-1, 1]$, work out $f(-1)$ and $f(1)$. Explain why the sign change does not prove a root.'
    answer_label: 'The two values'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "1/(-1)", answer: "-1"}
        - {kind: evaluate, expression: "1/1", answer: "1"}
    answer_text: '$f(-1) = -1$ and $f(1) = 1$, so the signs differ. But $1/x$ is undefined at $x = 0$ and is never zero, so there is no root. The function is not continuous on $[-1, 1]$, so the test does not apply.'

  - id: s9-table-bracket
    section: "9.1"
    refs: [I1]
    statement: 'A function has $f(1) = -3$, $f(2) = 1$ and $f(3) = 4$. Between which two consecutive values does a root lie?'
    answer_label: 'The bracket'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "<", lhs: "-3", rhs: "0"}
        - {kind: compare, relation: ">", lhs: "1", rhs: "0"}
    answer_text: 'The value at $x = 1$ is negative and the value at $x = 2$ is positive, so the sign changes between them. The root lies in $(1, 2)$.'

  - id: s10-bracket-cube-root
    section: "9.1"
    refs: [I1]
    statement: 'Show that $x^3 = 20$ has a root between $2$ and $3$.'
    answer_label: 'The two values'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "<", lhs: "2**3", rhs: "20"}
        - {kind: compare, relation: ">", lhs: "3**3", rhs: "20"}
    answer_text: 'At $x = 2$, $x^3 = 8 < 20$. At $x = 3$, $x^3 = 27 > 20$. The sign of $x^3 - 20$ changes between the two values, so the root lies in $(2, 3)$.'

  - id: s11-bracket-two-to-the-x
    section: "9.1"
    refs: [I1]
    statement: 'Show that $2^x = x + 3$ has a root between $2$ and $3$.'
    answer_label: 'The two values'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "<", lhs: "2**2 - (2 + 3)", rhs: "0"}
        - {kind: compare, relation: ">", lhs: "2**3 - (3 + 3)", rhs: "0"}
    answer_text: 'Rearrange to $2^x - x - 3 = 0$. At $x = 2$ the value is $4 - 5 = -1 < 0$, and at $x = 3$ it is $8 - 6 = 2 > 0$. The signs differ, so a root lies in $(2, 3)$.'

  - id: s12-root-at-endpoint
    section: "9.1"
    refs: [I1]
    statement: 'For $f(x) = x^2 - 9$ on the interval $[3, 4]$, work out $f(3)$. What does this tell you about the root?'
    answer_label: 'The value'
    check:
      kind: evaluate
      expression: "3**2 - 9"
      answer: "0"
    answer_text: '$f(3) = 9 - 9 = 0$, so $x = 3$ is itself a root of $f(x) = 0$. When an endpoint gives zero, the root is that endpoint and no sign change is needed.'

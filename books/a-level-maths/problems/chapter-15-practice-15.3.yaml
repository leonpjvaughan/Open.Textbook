# Practice set for 15.3, displacement-time and velocity-time graphs.
#
# The bank cannot see a drawing, so every graph is described by its key points
# and the check proves the gradient or the area the reader computes. Units live
# in the statement; the CAS fields hold numbers only.
chapter: 15
symbols:
  t: {real: true}
problems:
  - id: p1-gradient-of-displacement
    section: "15.3"
    refs: [Q2]
    statement: 'A displacement–time graph is a straight line through $(0, 0)$ and $(8, 24)$, with $s$ in metres and $t$ in seconds. Find the velocity.'
    answer_label: 'The velocity'
    check:
      kind: evaluate
      expression: "(24 - 0)/(8 - 0)"
      answer: "3"
    answer_text: 'The velocity is the gradient: $v = \dfrac{24 - 0}{8 - 0} = 3$ m/s.'

  - id: p2-displacement-gradient-offset
    section: "15.3"
    refs: [Q2]
    statement: 'A displacement–time graph is a straight line through $(0, 10)$ and $(5, 25)$, with $s$ in metres. Find the velocity.'
    answer_label: 'The velocity'
    check:
      kind: evaluate
      expression: "(25 - 10)/(5 - 0)"
      answer: "3"
    answer_text: 'Use the change in displacement over the change in time: $v = \dfrac{25 - 10}{5 - 0} = 3$ m/s. The starting value of $10$ m does not change the gradient.'

  - id: p3-horizontal-displacement
    section: "15.3"
    refs: [Q2]
    statement: 'A displacement–time graph is horizontal from $t = 2$ s to $t = 9$ s. Find the velocity in that interval.'
    answer_label: 'The velocity'
    check:
      kind: evaluate
      expression: "0/(9 - 2)"
      answer: "0"
    answer_text: 'A horizontal line has zero gradient, so the velocity is $0$ m/s. The object is at rest.'

  - id: p4-acceleration-and-distance
    section: "15.3"
    refs: [Q2]
    statement: 'A velocity–time graph is a straight line from $(0, 5)$ to $(4, 17)$, with $v$ in m/s. Find the acceleration and the distance travelled.'
    answer_label: 'The acceleration and the distance'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(17 - 5)/(4 - 0)", answer: "3"}
        - {kind: evaluate, expression: "(5 + 17)/2*4", answer: "44"}
    answer_text: 'Acceleration $= \dfrac{17 - 5}{4} = 3$ m/s$^2$. The distance is the area of the trapezium: $\dfrac{5 + 17}{2} \times 4 = 44$ m.'

  - id: p5-deceleration
    section: "15.3"
    refs: [Q2]
    statement: 'A velocity–time graph is a straight line from $(0, 20)$ to $(5, 5)$, with $v$ in m/s. Find the acceleration and the distance travelled.'
    answer_label: 'The acceleration and the distance'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(5 - 20)/(5 - 0)", answer: "-3"}
        - {kind: evaluate, expression: "(20 + 5)/2*5", answer: "125/2"}
    answer_text: 'Acceleration $= \dfrac{5 - 20}{5} = -3$ m/s$^2$. The distance is the trapezium area: $\dfrac{20 + 5}{2} \times 5 = 62.5$ m.'

  - id: p6-from-rest
    section: "15.3"
    refs: [Q2]
    statement: 'A velocity–time graph is a straight line from $(0, 0)$ to $(6, 18)$, with $v$ in m/s. Find the acceleration and the distance travelled.'
    answer_label: 'The acceleration and the distance'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(18 - 0)/6", answer: "3"}
        - {kind: evaluate, expression: "1/2*6*18", answer: "54"}
    answer_text: 'Acceleration $= \dfrac{18}{6} = 3$ m/s$^2$. The area is a triangle: $\frac{1}{2} \times 6 \times 18 = 54$ m.'

  - id: p7-braking
    section: "15.3"
    refs: [Q2]
    statement: 'A velocity–time graph is a straight line from $(0, 24)$ to $(8, 0)$. Find the acceleration and the distance travelled.'
    answer_label: 'The acceleration and the distance'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(0 - 24)/(8 - 0)", answer: "-3"}
        - {kind: evaluate, expression: "1/2*8*24", answer: "96"}
    answer_text: 'Acceleration $= \dfrac{0 - 24}{8} = -3$ m/s$^2$. The car brakes to rest, and the distance is the triangle $\frac{1}{2} \times 8 \times 24 = 96$ m.'

  - id: p8-three-segments
    section: "15.3"
    refs: [Q2]
    statement: 'A velocity–time graph has segments $(0, 0)$ to $(3, 6)$, $(3, 6)$ to $(9, 6)$, and $(9, 6)$ to $(12, 0)$. Find the total distance travelled.'
    answer_label: 'The total distance'
    check:
      kind: evaluate
      expression: "1/2*3*6 + 6*6 + 1/2*3*6"
      answer: "54"
    answer_text: 'The three areas are a triangle $9$, a rectangle $36$ and a triangle $9$. The total distance is $9 + 36 + 9 = 54$ m.'

  - id: p9-crossing-the-axis
    section: "15.3"
    refs: [Q2]
    statement: 'A velocity–time graph is a straight line from $(0, 8)$ to $(4, -8)$, with $v$ in m/s. Find the displacement and the distance travelled.'
    answer_label: 'The displacement and the distance'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "1/2*2*8 - 1/2*2*8", answer: "0"}
        - {kind: evaluate, expression: "1/2*2*8 + 1/2*2*8", answer: "16"}
    answer_text: 'The line crosses the axis at $t = 2$ s. The two triangles each have area $\frac{1}{2} \times 2 \times 8 = 8$. The displacement is $8 - 8 = 0$ m and the distance travelled is $8 + 8 = 16$ m.'

  - id: p10-trapezium-distance
    section: "15.3"
    refs: [Q2]
    statement: 'A velocity–time graph is a straight line from $(0, 4)$ to $(5, 14)$. Find the distance travelled.'
    answer_label: 'The distance'
    check:
      kind: evaluate
      expression: "(4 + 14)/2*5"
      answer: "45"
    answer_text: 'The distance is the trapezium area: $\dfrac{4 + 14}{2} \times 5 = 9 \times 5 = 45$ m.'

  - id: p11-accelerate-then-steady
    section: "15.3"
    refs: [Q2]
    statement: 'A velocity–time graph rises from $(0, 0)$ to $(5, 15)$, then stays at $15$ m/s from $(5, 15)$ to $(15, 15)$. Find the total distance travelled.'
    answer_label: 'The total distance'
    check:
      kind: evaluate
      expression: "1/2*5*15 + 10*15"
      answer: "375/2"
    answer_text: 'The first stage is a triangle, $\frac{1}{2} \times 5 \times 15 = 37.5$ m. The second stage is a rectangle, $10 \times 15 = 150$ m. The total is $37.5 + 150 = 187.5$ m.'

  - id: p12-signs-mixed
    section: "15.3"
    refs: [Q2]
    statement: 'A velocity–time graph has a straight line from $(0, 12)$ to $(6, 0)$, then a straight line from $(6, 0)$ to $(10, -4)$. Find the displacement and the distance travelled over the whole $10$ s.'
    answer_label: 'The displacement and the distance'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "1/2*6*12 - 1/2*4*4", answer: "28"}
        - {kind: evaluate, expression: "1/2*6*12 + 1/2*4*4", answer: "44"}
    answer_text: 'The area above the axis is $\frac{1}{2} \times 6 \times 12 = 36$. The area below is $\frac{1}{2} \times 4 \times 4 = 8$, which counts as $-8$ for the displacement. Displacement $= 36 - 8 = 28$ m, and distance travelled $= 36 + 8 = 44$ m.'

# Practice set for 2.2, surds and rationalising the denominator.
#
# Every answer is an exact surd; the verifier compares the simplified form with
# the original expression symbolically, so an unsimplified but equal surd also
# passes. The answer text shows the simplification a reader is expected to make.
chapter: 2
problems:
  - id: p1-simplify-50
    section: "2.2"
    refs: [B2]
    statement: 'Simplify $\sqrt{50}$.'
    answer_label: 'Simplified'
    check:
      kind: evaluate
      expression: "sqrt(50)"
      answer: "5*sqrt(2)"
    answer_text: 'Look for the square factor: $50 = 25 \times 2$, so $\sqrt{50} = \sqrt{25}\sqrt{2} = 5\sqrt{2}$.'

  - id: p2-difference
    section: "2.2"
    refs: [B2]
    statement: 'Simplify $\sqrt{72} - \sqrt{32}$.'
    answer_label: 'Simplified'
    check:
      kind: evaluate
      expression: "sqrt(72) - sqrt(32)"
      answer: "2*sqrt(2)"
    answer_text: 'Simplify each surd first: $\sqrt{72} = \sqrt{36 \times 2} = 6\sqrt{2}$ and $\sqrt{32} = \sqrt{16 \times 2} = 4\sqrt{2}$. Then subtract like terms: $6\sqrt{2} - 4\sqrt{2} = 2\sqrt{2}$.'

  - id: p3-sum
    section: "2.2"
    refs: [B2]
    statement: 'Simplify $\sqrt{12} + \sqrt{75}$.'
    answer_label: 'Simplified'
    check:
      kind: evaluate
      expression: "sqrt(12) + sqrt(75)"
      answer: "7*sqrt(3)"
    answer_text: '$\sqrt{12} = \sqrt{4 \times 3} = 2\sqrt{3}$ and $\sqrt{75} = \sqrt{25 \times 3} = 5\sqrt{3}$. The surds are now like terms, so $2\sqrt{3} + 5\sqrt{3} = 7\sqrt{3}$.'

  - id: p4-product
    section: "2.2"
    refs: [B2]
    statement: 'Work out $\sqrt{8} \times \sqrt{18}$.'
    answer_label: 'The value'
    check:
      kind: evaluate
      expression: "sqrt(8)*sqrt(18)"
      answer: "12"
    answer_text: 'Multiply inside the roots: $\sqrt{8} \times \sqrt{18} = \sqrt{144} = 12$.'

  - id: p5-conjugate-product
    section: "2.2"
    refs: [B2]
    statement: 'Expand and simplify $\left(2 + \sqrt{3}\right)\left(2 - \sqrt{3}\right)$.'
    answer_label: 'Simplified'
    check:
      kind: evaluate
      expression: "(2 + sqrt(3))*(2 - sqrt(3))"
      answer: "1"
    answer_text: 'This is a difference of two squares: $\left(2 + \sqrt{3}\right)\left(2 - \sqrt{3}\right) = 2^2 - \left(\sqrt{3}\right)^2 = 4 - 3 = 1$. A conjugate pair always removes the surd.'

  - id: p6-rationalise-simple
    section: "2.2"
    refs: [B2]
    statement: 'Write $\dfrac{6}{\sqrt{3}}$ with a rational denominator.'
    answer_label: 'Rationalised'
    check:
      kind: evaluate
      expression: "6/sqrt(3)"
      answer: "2*sqrt(3)"
    answer_text: 'Multiply the top and the bottom by $\sqrt{3}$: $\dfrac{6}{\sqrt{3}} = \dfrac{6\sqrt{3}}{3} = 2\sqrt{3}$.'

  - id: p7-rationalise-conjugate
    section: "2.2"
    refs: [B2]
    statement: 'Write $\dfrac{1}{3 + \sqrt{2}}$ with a rational denominator.'
    answer_label: 'Rationalised'
    check:
      kind: evaluate
      expression: "1/(3 + sqrt(2))"
      answer: "(3 - sqrt(2))/7"
    answer_text: 'Multiply the top and the bottom by the conjugate $3 - \sqrt{2}$. The denominator becomes $9 - 2 = 7$, so $\dfrac{1}{3 + \sqrt{2}} = \dfrac{3 - \sqrt{2}}{7}$.'

  - id: p8-rationalise-conjugate-two
    section: "2.2"
    refs: [B2]
    statement: 'Write $\dfrac{5}{\sqrt{7} - 2}$ with a rational denominator.'
    answer_label: 'Rationalised'
    check:
      kind: evaluate
      expression: "5/(sqrt(7) - 2)"
      answer: "5*(sqrt(7) + 2)/3"
    answer_text: 'Multiply the top and the bottom by the conjugate $\sqrt{7} + 2$. The denominator becomes $7 - 4 = 3$, so $\dfrac{5}{\sqrt{7} - 2} = \dfrac{5\left(\sqrt{7} + 2\right)}{3}$.'

  - id: p9-square-of-a-sum
    section: "2.2"
    refs: [B2]
    statement: 'Expand and simplify $\left(\sqrt{5} + 2\right)^2$.'
    answer_label: 'Simplified'
    check:
      kind: evaluate
      expression: "(sqrt(5) + 2)**2"
      answer: "9 + 4*sqrt(5)"
    answer_text: 'Expand the bracket: $\left(\sqrt{5} + 2\right)^2 = 5 + 4\sqrt{5} + 4 = 9 + 4\sqrt{5}$. The middle term is $2 \times \sqrt{5} \times 2$.'

  - id: p10-compare-surds
    section: "2.2"
    refs: [B2]
    statement: 'Explain why $\sqrt{2} + \sqrt{3} > \sqrt{5}$.'
    answer_label: 'A valid reason'
    check:
      kind: compare
      relation: ">"
      lhs: "sqrt(2) + sqrt(3)"
      rhs: "sqrt(5)"
    answer_text: '$\sqrt{2} \approx 1.414$ and $\sqrt{3} \approx 1.732$, so the left side is about $3.146$, while $\sqrt{5} \approx 2.236$. The left side is larger. Use the decimal values only to compare sizes, never as the answer itself.'

  - id: p11-fraction-times-surd
    section: "2.2"
    refs: [B2]
    statement: 'Write $\dfrac{2}{3\sqrt{2}}$ with a rational denominator.'
    answer_label: 'Rationalised'
    check:
      kind: evaluate
      expression: "2/(3*sqrt(2))"
      answer: "sqrt(2)/3"
    answer_text: 'Multiply the top and the bottom by $\sqrt{2}$: $\dfrac{2}{3\sqrt{2}} = \dfrac{2\sqrt{2}}{3 \times 2} = \dfrac{\sqrt{2}}{3}$.'

  - id: p12-rationalise-numerator-surd
    section: "2.2"
    refs: [B2]
    statement: 'Write $\dfrac{2 + \sqrt{3}}{1 - \sqrt{3}}$ with a rational denominator.'
    answer_label: 'Rationalised'
    check:
      kind: evaluate
      expression: "(2 + sqrt(3))/(1 - sqrt(3))"
      answer: "-(5 + 3*sqrt(3))/2"
    answer_text: 'Multiply the top and the bottom by the conjugate $1 + \sqrt{3}$. The numerator is $2 + 2\sqrt{3} + \sqrt{3} + 3 = 5 + 3\sqrt{3}$, and the denominator is $1 - 3 = -2$. So the fraction is $-\dfrac{5 + 3\sqrt{3}}{2}$.'

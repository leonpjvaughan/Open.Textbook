# Practice set for 5.12, trigonometry in context with vectors and forces.
#
# Each component and resultant is checked with the exact trigonometric
# expression. Answers given to three significant figures are checked to a
# declared tolerance.
chapter: 5
problems:
  - id: p1-resolve-force
    section: "5.12"
    dfe: [E9, OT3]
    statement: 'A force of $50$ N acts at $30^\circ$ above the horizontal. Find its horizontal and vertical components.'
    answer_label: 'The two components'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "50*cos(pi/6)", answer: "25*sqrt(3)"}
        - {kind: evaluate, expression: "50*sin(pi/6)", answer: "25"}
    answer_text: 'Horizontal $= 50\cos 30^\circ = 25\sqrt{3} \approx 43.3$ N. Vertical $= 50\sin 30^\circ = 25$ N.'

  - id: p2-resultant-right-angle
    section: "5.12"
    dfe: [E9]
    statement: 'Two forces of $5$ N and $9$ N act at $90^\circ$ to each other. Find the magnitude of the resultant.'
    answer_label: 'The resultant'
    check:
      kind: evaluate
      expression: "sqrt(5**2 + 9**2)"
      answer: "sqrt(106)"
    answer_text: 'The vectors are perpendicular, so $R = \sqrt{5^2 + 9^2} = \sqrt{106} \approx 10.3$ N.'

  - id: p3-resultant-60
    section: "5.12"
    dfe: [E9]
    statement: 'Two forces of $6$ N and $8$ N act at $60^\circ$ to each other. Find the magnitude of the resultant.'
    answer_label: 'The resultant'
    check:
      kind: evaluate
      expression: "sqrt(6**2 + 8**2 + 2*6*8*cos(pi/3))"
      answer: "2*sqrt(37)"
    answer_text: '$R^2 = 36 + 64 + 2 \times 6 \times 8 \times \cos 60^\circ = 100 + 48 = 148$. So $R = \sqrt{148} = 2\sqrt{37} \approx 12.2$ N.'

  - id: p4-resultant-50
    section: "5.12"
    dfe: [E9]
    statement: 'Two forces of $4$ N and $7$ N act at $50^\circ$ to each other. Find the magnitude of the resultant, to three significant figures.'
    answer_label: 'The resultant'
    check:
      kind: approx
      value: "sqrt(4**2 + 7**2 + 2*4*7*cos(50*pi/180))"
      target: "10.05"
      tolerance: "0.01"
    answer_text: '$R^2 = 16 + 49 + 56\cos 50^\circ \approx 65 + 36.0 = 101.0$, so $R \approx 10.05$ N, which is $10.0$ N to three significant figures.'

  - id: p5-velocity-current
    section: "5.12"
    dfe: [E9]
    statement: 'A swimmer heads due east at $1.2$ m s$^{-1}$ in a current of $0.5$ m s$^{-1}$ due south. Find the size of the resultant velocity.'
    answer_label: 'The resultant speed'
    check:
      kind: evaluate
      expression: "sqrt(1.2**2 + 0.5**2)"
      answer: "13/10"
    answer_text: 'The velocities are perpendicular, so $v = \sqrt{1.44 + 0.25} = \sqrt{1.69} = 1.3$ m s$^{-1}$.'

  - id: p6-slope-component
    section: "5.12"
    dfe: [E9]
    statement: 'A block of weight $120$ N is on a slope of $20^\circ$. Find the component of the weight down the slope.'
    answer_label: 'The component down the slope'
    check:
      kind: approx
      value: "120*sin(20*pi/180)"
      target: "41.0"
      tolerance: "0.05"
    answer_text: 'The component down the slope is $120\sin 20^\circ \approx 41.0$ N. The component into the slope is $120\cos 20^\circ \approx 112.8$ N.'

  - id: p7-direction
    section: "5.12"
    dfe: [E9]
    statement: 'A boat moves $4$ m s$^{-1}$ due east with a current of $3$ m s$^{-1}$ due north. Find the angle of the resultant velocity north of east, in degrees to three significant figures.'
    answer_label: 'The direction'
    check:
      kind: approx
      value: "atan(3/4)*180/pi"
      target: "36.9"
      tolerance: "0.05"
    answer_text: 'The angle satisfies $\tan\theta = \dfrac{3}{4}$, so $\theta \approx 36.9^\circ$ north of east. The size of the resultant is $5$ m s$^{-1}$.'

  - id: p8-vertical-component
    section: "5.12"
    dfe: [E9]
    statement: 'A force of $100$ N acts at $65^\circ$ above the horizontal. Find its vertical component, to three significant figures.'
    answer_label: 'The vertical component'
    check:
      kind: approx
      value: "100*sin(65*pi/180)"
      target: "90.6"
      tolerance: "0.05"
    answer_text: 'Vertical component $= 100\sin 65^\circ \approx 90.6$ N.'

  - id: p9-resultant-pythagorean
    section: "5.12"
    dfe: [E9]
    statement: 'Two perpendicular displacements of $3$ m and $4$ m act from the same point. Find the magnitude of the resultant displacement.'
    answer_label: 'The resultant'
    check:
      kind: evaluate
      expression: "sqrt(3**2 + 4**2)"
      answer: "5"
    answer_text: 'For perpendicular displacements, $R = \sqrt{3^2 + 4^2} = \sqrt{25} = 5$ m.'

  - id: p10-slope-normal
    section: "5.12"
    dfe: [E9]
    statement: 'A block of weight $200$ N is on a slope of $25^\circ$. Find the component of the weight into the slope, to three significant figures.'
    answer_label: 'The component into the slope'
    check:
      kind: approx
      value: "200*cos(25*pi/180)"
      target: "181"
      tolerance: "0.5"
    answer_text: 'The component into the slope is $200\cos 25^\circ \approx 181$ N, to three significant figures. The component down the slope is $200\sin 25^\circ \approx 84.5$ N.'

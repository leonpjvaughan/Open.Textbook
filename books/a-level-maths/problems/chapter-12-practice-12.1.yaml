# Practice set for 12.1, mutually exclusive and independent events. The checks
# prove the probability arithmetic: an addition rule, a product for independent
# events, or the difference that tests independence. Whether a justification is
# well argued is human review.
chapter: 12
problems:
  - id: p1-die-even-or-five
    section: "12.1"
    dfe: [M1]
    statement: 'A fair six-sided die is rolled once. Find the probability of an even number or a 5.'
    answer_label: 'The probability of an even number or a 5'
    check:
      kind: evaluate
      expression: "3/6 + 1/6"
      answer: "2/3"
    answer_text: 'An even number and a 5 cannot happen together, so the events are mutually exclusive. Add the probabilities: $\dfrac{3}{6} + \dfrac{1}{6} = \dfrac{4}{6} = \dfrac{2}{3}$.'

  - id: p2-die-even-or-prime
    section: "12.1"
    dfe: [M1]
    statement: 'A fair six-sided die is rolled once. Find the probability of an even number or a prime number.'
    answer_label: 'The probability of an even number or a prime number'
    check:
      kind: evaluate
      expression: "3/6 + 3/6 - 1/6"
      answer: "5/6"
    answer_text: 'The evens are 2, 4 and 6, and the primes are 2, 3 and 5. The number 2 is in both, so subtract it once: $\dfrac{3}{6} + \dfrac{3}{6} - \dfrac{1}{6} = \dfrac{5}{6}$. The union is 2, 3, 4, 5, 6.'

  - id: p3-counter-not-red
    section: "12.1"
    dfe: [M1]
    statement: 'A bag has 4 red counters and 6 black counters. One counter is taken at random. Find the probability that it is not red.'
    answer_label: 'The probability that the counter is not red'
    check:
      kind: evaluate
      expression: "1 - 4/10"
      answer: "3/5"
    answer_text: 'The complement rule gives $P(\text{not red}) = 1 - P(\text{red}) = 1 - \dfrac{4}{10} = \dfrac{6}{10} = \dfrac{3}{5}$. This is also the probability of black, because every counter is red or black.'

  - id: p4-coin-and-die
    section: "12.1"
    dfe: [M1]
    statement: 'A fair coin is tossed and a fair six-sided die is rolled. The two results are independent. Find the probability of a head and a 6.'
    answer_label: 'The probability of a head and a 6'
    check:
      kind: evaluate
      expression: "1/2 * 1/6"
      answer: "1/12"
    answer_text: 'For independent events, multiply: $P(\text{head and } 6) = P(\text{head}) \times P(6) = \dfrac{1}{2} \times \dfrac{1}{6} = \dfrac{1}{12}$.'

  - id: p5-two-hearts-replacement
    section: "12.1"
    dfe: [M1]
    statement: 'A card is taken at random from a standard pack of 52 cards, then replaced. A second card is taken at random. Find the probability that both cards are hearts.'
    answer_label: 'The probability that both cards are hearts'
    check:
      kind: evaluate
      expression: "1/4 * 1/4"
      answer: "1/16"
    answer_text: 'A heart is drawn with probability $\dfrac{13}{52} = \dfrac{1}{4}$. The first card is replaced, so the draws are independent: $\dfrac{1}{4} \times \dfrac{1}{4} = \dfrac{1}{16}$.'

  - id: p6-car-and-bicycle-independent
    section: "12.1"
    dfe: [M1]
    statement: 'A survey of 300 adults records whether each owns a car and whether each owns a bicycle. 180 own a car, 120 own a bicycle, and 72 own both. Show that owning a car and owning a bicycle are independent.'
    answer_label: 'The test for independence'
    check:
      kind: evaluate
      expression: "(72/300) - (180/300)*(120/300)"
      answer: "0"
    answer_text: 'For independence, compare $P(\text{both})$ with $P(\text{car}) \times P(\text{bicycle})$. Here $P(\text{both}) = \dfrac{72}{300} = \dfrac{6}{25}$ and $\dfrac{180}{300} \times \dfrac{120}{300} = \dfrac{6}{25}$. The two agree, so the events are independent.'

  - id: p7-cat-and-dog-not-independent
    section: "12.1"
    dfe: [M1]
    statement: 'A survey of 250 people records whether each owns a cat and whether each owns a dog. 150 own a cat, 100 own a dog, and 30 own both. Show that owning a cat and owning a dog are not independent.'
    answer_label: 'The test for independence'
    check:
      kind: evaluate
      expression: "(30/250) - (150/250)*(100/250)"
      answer: "-3/25"
    answer_text: 'Here $P(\text{both}) = \dfrac{30}{250} = \dfrac{3}{25}$, while $P(\text{cat}) \times P(\text{dog}) = \dfrac{150}{250} \times \dfrac{100}{250} = \dfrac{6}{25}$. The two values differ, so the events are not independent. Fewer people own both than independence would predict.'

  - id: p8-mutually-exclusive-product
    section: "12.1"
    dfe: [M1]
    statement: 'Two events $A$ and $B$ have $P(A) = 0.3$ and $P(B) = 0.4$, and they are mutually exclusive. Work out $P(A) \times P(B)$, and explain why this shows that the events are not independent.'
    answer_label: 'The product of the probabilities'
    check:
      kind: evaluate
      expression: "0.3 * 0.4"
      answer: "3/25"
    answer_text: '$P(A) \times P(B) = 0.3 \times 0.4 = 0.12 = \dfrac{3}{25}$. Mutually exclusive events cannot happen together, so $P(A \text{ and } B) = 0$. Since $0 \ne 0.12$, the events are not independent. Knowing that $A$ happened makes $B$ impossible.'

  - id: p9-football-or-tennis
    section: "12.1"
    dfe: [M1]
    statement: 'In a class of 30 students, 18 play football, 12 play tennis, and 6 play both. A student is chosen at random. Find the probability that the student plays football or tennis.'
    answer_label: 'The probability that the student plays football or tennis'
    check:
      kind: evaluate
      expression: "(18 + 12 - 6) / 30"
      answer: "4/5"
    answer_text: 'Use the addition rule and subtract the overlap once: $\dfrac{18 + 12 - 6}{30} = \dfrac{24}{30} = \dfrac{4}{5}$. The 6 students who play both were counted in each total.'

  - id: p10-independent-union
    section: "12.1"
    dfe: [M1]
    statement: 'Events $A$ and $B$ are independent with $P(A) = 0.5$ and $P(B) = 0.4$. Find $P(A \text{ or } B)$.'
    answer_label: 'The probability of A or B'
    check:
      kind: evaluate
      expression: "0.5 + 0.4 - 0.5 * 0.4"
      answer: "7/10"
    answer_text: 'First find the overlap. Independence gives $P(A \text{ and } B) = 0.5 \times 0.4 = 0.2$. Then $P(A \text{ or } B) = 0.5 + 0.4 - 0.2 = 0.7 = \dfrac{7}{10}$.'

  - id: p11-both-pass
    section: "12.1"
    dfe: [M1]
    statement: 'A component passes inspection with probability $0.973$. Two components are inspected independently. Find the probability that both pass, to 4 decimal places.'
    answer_label: 'The probability that both components pass'
    check:
      kind: approx
      value: "973/1000 * 973/1000"
      target: "0.9467"
      tolerance: "0.00005"
    answer_text: 'The passes are independent, so multiply: $0.973 \times 0.973 = 0.946729$. To 4 decimal places this is $0.9467$.'

  - id: p12-coin-twice-reasoning
    section: "12.1"
    dfe: [M1]
    statement: 'A fair coin is tossed twice. Event $A$ is a head on the first toss. Event $B$ is a head on the second toss. Are $A$ and $B$ mutually exclusive? Are they independent? Explain your answers.'
    answer_label: 'Mutually exclusive and independent'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "1/2 * 1/2", answer: "1/4"}
        - {kind: evaluate, expression: "(1/2 * 1/2) - (1/2)*(1/2)", answer: "0"}
    answer_text: 'The two events are not mutually exclusive, because both can happen: the coins can show head, head. They are independent, because $P(A \text{ and } B) = \dfrac{1}{4}$ and $P(A) \times P(B) = \dfrac{1}{2} \times \dfrac{1}{2} = \dfrac{1}{4}$. The first toss does not change the chance of a head on the second.'

# Practice set for 6.5, logarithmic graphs and estimating parameters.
#
# The section turns a curved model into a straight line and reads a gradient
# and an intercept. The checks prove the algebra of that straightening and the
# arithmetic from a given gradient or intercept; reading a plotted graph by eye
# is human review.
chapter: 6
symbols:
  x: {real: true, positive: true}
  k: {real: true, positive: true}
  b: {real: true, positive: true}
  a: {real: true, positive: true}
  n: {real: true}
problems:
  - id: p1-linearise-exponential
    section: "6.5"
    dfe: [F6]
    statement: 'For the model $y = kb^x$, with $k > 0$ and $b > 0$, show that $\ln y = \ln k + x\ln b$.'
    answer_label: 'The difference'
    check:
      kind: evaluate
      expression: "ln(k*b**x) - (ln(k) + x*ln(b))"
      answer: "0"
    answer_text: 'Take logarithms of both sides. The product law turns $\ln\left(kb^x\right)$ into $\ln k + \ln b^x$, and the power law brings the $x$ down: $\ln k + x\ln b$. The result is a straight line in $x$ with gradient $\ln b$ and intercept $\ln k$.'

  - id: p2-gradient-from-data
    section: "6.5"
    dfe: [F6]
    statement: 'A model $y = kb^x$ has data points $\left(0, 200\right)$ and $\left(1, 300\right)$. Find the gradient of the graph of $\ln y$ against $x$.'
    answer_label: 'The gradient'
    check:
      kind: evaluate
      expression: "(ln(300) - ln(200)) / (1 - 0)"
      answer: "ln(3/2)"
    answer_text: 'The gradient is the change in $\ln y$ divided by the change in $x$: $\ln 300 - \ln 200 = \ln\dfrac{300}{200} = \ln 1.5$. So the gradient is $\ln 1.5$, and the growth factor is $b = 1.5$.'

  - id: p3-estimate-growth-factor
    section: "6.5"
    dfe: [F6]
    statement: 'The gradient of a log-linear graph is $\ln 1.5$. Write $\ln 1.5$ to three decimal places.'
    answer_label: 'The value'
    check:
      kind: approx
      value: "ln(3/2)"
      target: "0.405"
      tolerance: "0.0005"
    answer_text: '$\ln 1.5 = 0.405465\ldots$, which is $0.405$ to three decimal places. The gradient is positive, so the model grows.'

  - id: p4-estimate-initial-value
    section: "6.5"
    dfe: [F6]
    statement: 'A log-linear graph of $\ln y$ against $x$ has intercept $\ln 200$. Find the value of $k$ in $y = kb^x$.'
    answer_label: 'The value of $k$'
    check:
      kind: evaluate
      expression: "exp(ln(200))"
      answer: "200"
    answer_text: 'The intercept is $\ln k$, so $\ln k = \ln 200$ and $k = 200$. The exponential undoes the logarithm.'

  - id: p5-linearise-power
    section: "6.5"
    dfe: [F6]
    statement: 'For the model $y = ax^3$, with $a > 0$ and $x > 0$, show that plotting $\ln y$ against $\ln x$ gives a straight line of gradient $3$.'
    answer_label: 'The difference'
    check:
      kind: evaluate
      expression: "ln(a*x**3) - (ln(a) + 3*ln(x))"
      answer: "0"
    answer_text: 'Take logarithms: $\ln y = \ln a + \ln x^3 = \ln a + 3\ln x$. This is a straight line when $\ln y$ is plotted against $\ln x$, with gradient $3$ and intercept $\ln a$. The same argument with any power $n$ gives gradient $n$; the power law is what makes the model linear in the logs.'

  - id: p6-power-gradient
    section: "6.5"
    dfe: [F6]
    statement: 'The points $\left(1, 3\right)$, $\left(2, 12\right)$ and $\left(3, 27\right)$ fit a model $y = ax^n$. Use the first and last points to find $n$ from the gradient of $\ln y$ against $\ln x$.'
    answer_label: 'The value of $n$'
    check:
      kind: evaluate
      expression: "(ln(27) - ln(3)) / (ln(3) - ln(1))"
      answer: "2"
    answer_text: 'The gradient is $\dfrac{\ln 27 - \ln 3}{\ln 3 - \ln 1} = \dfrac{\ln 9}{\ln 3} = \dfrac{2\ln 3}{\ln 3} = 2$. So $n = 2$, and the model is a quadratic in disguise: $y = ax^2$.'

  - id: p7-predict-growth
    section: "6.5"
    dfe: [F6]
    statement: 'A population is modelled by $N = 200\left(1.5\right)^t$. Predict $N$ when $t = 5$.'
    answer_label: 'The value of $N$'
    check:
      kind: evaluate
      expression: "200 * (3/2)**5"
      answer: "6075/4"
    answer_text: '$\left(1.5\right)^5 = 7.59375$, and $200 \times 7.59375 = 1518.75$. As a fraction this is $\dfrac{6075}{4}$.'

  - id: p8-solve-for-time
    section: "6.5"
    dfe: [F6, F5]
    statement: 'A population is modelled by $N = 200\left(1.5\right)^x$. Find the value of $x$ when $N = 1000$, exactly.'
    answer_label: 'The value of $x$'
    check:
      kind: solve
      equation: "200*(3/2)**x = 1000"
      variable: "x"
      answer: ["ln(5)/ln(3/2)"]
    answer_text: 'Divide by $200$: $\left(1.5\right)^x = 5$. Take logarithms: $x\ln 1.5 = \ln 5$, so $x = \dfrac{\ln 5}{\ln 1.5} \approx 3.97$.'

  - id: p9-log10-form
    section: "6.5"
    dfe: [F6]
    statement: 'A model gives $\log_{10} y = 2 + 0.5x$. Find $k$ and $b$ in $y = kb^x$.'
    answer_label: 'The values of $k$ and $b$'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "10**2", answer: "100"}
        - {kind: evaluate, expression: "10**(1/2)", answer: "sqrt(10)"}
    answer_text: 'Compare with $\log_{10} y = \log_{10} k + x\log_{10} b$. The intercept gives $\log_{10} k = 2$, so $k = 100$. The gradient gives $\log_{10} b = 0.5$, so $b = 10^{0.5} = \sqrt{10} \approx 3.16$.'

  - id: p10-approximate-gradient
    section: "6.5"
    dfe: [F6]
    statement: 'A model has data points $\left(0, 5\right)$ and $\left(2, 20\right)$. Write the gradient of the graph of $\ln y$ against $x$ to three decimal places.'
    answer_label: 'The gradient'
    check:
      kind: approx
      value: "(ln(20) - ln(5)) / 2"
      target: "0.693"
      tolerance: "0.0005"
    answer_text: 'The gradient is $\dfrac{\ln 20 - \ln 5}{2} = \dfrac{\ln 4}{2} = \ln 2 = 0.693147\ldots$, which is $0.693$ to three decimal places.'

  - id: p11-interpret-intercept
    section: "6.5"
    dfe: [F6]
    statement: 'A straight line fitted to a graph of $\ln y$ against $x$ has gradient $0.4$ and passes through $\left(0, 1.2\right)$. Find $k$ in the model $y = kb^x$, to three significant figures.'
    answer_label: 'The value of $k$'
    check:
      kind: approx
      value: "exp(1.2)"
      target: "3.32"
      tolerance: "0.005"
    answer_text: 'The intercept is $\ln k = 1.2$, so $k = e^{1.2} = 3.3201\ldots$, which is $3.32$ to three significant figures. The gradient gives $\ln b = 0.4$, so $b = e^{0.4} \approx 1.49$.'

  - id: p12-power-intercept
    section: "6.5"
    dfe: [F6]
    statement: 'A graph of $\ln y$ against $\ln x$ for a model $y = ax^n$ has intercept $\ln 4$. Find $a$.'
    answer_label: 'The value of $a$'
    check:
      kind: evaluate
      expression: "exp(ln(4))"
      answer: "4"
    answer_text: 'The intercept is $\ln a$, so $\ln a = \ln 4$ and $a = 4$. The power law and the product law together turn the product $ax^n$ into a sum, which is what the straight line reads.'

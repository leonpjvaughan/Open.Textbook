# Practice set for 11.3, diagrams for single-variable data and the histogram.
# The checks prove frequency-density arithmetic: the meaning of the numbers for
# the reader is human review.
chapter: 11
symbols:
  x: {real: true}
problems:
  - id: p1-frequency-density
    section: "11.3"
    refs: [L1]
    statement: 'A class of width 5 contains 12 values. Find the frequency density.'
    answer_label: 'The frequency density'
    check:
      kind: evaluate
      expression: "12 / 5"
      answer: "12/5"
    answer_text: 'Divide the frequency by the class width: $\dfrac{12}{5} = 2.4$.'

  - id: p2-frequency-from-density
    section: "11.3"
    refs: [L1]
    statement: 'A histogram bar has frequency density 3 for a class of width 8. Find the frequency in the class.'
    answer_label: 'The frequency'
    check:
      kind: evaluate
      expression: "3 * 8"
      answer: "24"
    answer_text: 'Frequency is frequency density multiplied by class width: $3 \times 8 = 24$ values.'

  - id: p3-class-width
    section: "11.3"
    refs: [L1]
    statement: 'A class runs from 20 to 35. Find its class width.'
    answer_label: 'The class width'
    check:
      kind: evaluate
      expression: "35 - 20"
      answer: "15"
    answer_text: 'Subtract the lower boundary from the upper boundary: $35 - 20 = 15$.'

  - id: p4-total-frequency
    section: "11.3"
    refs: [L1]
    statement: 'A histogram has three classes: $0$–$10$ with frequency density 2, $10$–$20$ with frequency density 5, and $20$–$40$ with frequency density 1. Find the total frequency.'
    answer_label: 'The total frequency'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "2 * 10 + 5 * 10 + 1 * 20", answer: "90"}
    answer_text: 'Each frequency is density times width: $20 + 50 + 20 = 90$ values. Adding the areas of the bars gives the total frequency.'

  - id: p5-part-class
    section: "11.3"
    refs: [L1]
    statement: 'A histogram has frequency density 4 for the class $5$–$15$. Find the number of values between $5$ and $10$.'
    answer_label: 'The number of values'
    check:
      kind: evaluate
      expression: "4 * 5"
      answer: "20"
    answer_text: 'The part from $5$ to $10$ has width $5$, so the frequency is $4 \times 5 = 20$. The area over part of a bar gives the frequency in that part.'

  - id: p6-table-total
    section: "11.3"
    refs: [L1]
    statement: 'A grouped frequency table has classes with frequencies 12, 20 and 18. Find the total frequency.'
    answer_label: 'The total frequency'
    check:
      kind: evaluate
      expression: "12 + 20 + 18"
      answer: "50"
    answer_text: 'Add the frequencies: $12 + 20 + 18 = 50$ values.'

  - id: p7-grouped-mean
    section: "11.3"
    refs: [L1]
    statement: 'A grouped table has classes $0$–$10$ with frequency 12, $10$–$20$ with frequency 20, and $20$–$30$ with frequency 18. Using midpoints $5$, $15$ and $25$, estimate the mean.'
    answer_label: 'The estimated mean'
    check:
      kind: evaluate
      expression: "(5 * 12 + 15 * 20 + 25 * 18) / 50"
      answer: "81/5"
    answer_text: 'Multiply each midpoint by its frequency: $60 + 300 + 450 = 810$. Divide by the total frequency: $\dfrac{810}{50} = 16.2$. This is an estimate, because the midpoints stand for the values in each class.'

  - id: p8-density-of-class
    section: "11.3"
    refs: [L1]
    statement: 'A class of width 10 contains 25 values. Find its frequency density.'
    answer_label: 'The frequency density'
    check:
      kind: evaluate
      expression: "25 / 10"
      answer: "5/2"
    answer_text: 'The frequency density is $\dfrac{25}{10} = 2.5$. The bar is taller than a class of width 10 with 20 values, whose density is 2.'

  - id: p9-frequency-part
    section: "11.3"
    refs: [L1]
    statement: 'A histogram bar has frequency density 1.4 for the class $0$–$20$. Find the frequency in the class.'
    answer_label: 'The frequency'
    check:
      kind: evaluate
      expression: "1.4 * 20"
      answer: "28"
    answer_text: 'The frequency is $1.4 \times 20 = 28$ values.'

  - id: p10-compare-densities
    section: "11.3"
    refs: [L1]
    statement: 'One class $0$–$10$ contains 30 values, and another class $10$–$30$ contains 40 values. Find the frequency density of each class.'
    answer_label: 'The two frequency densities'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "30 / 10", answer: "3"}
        - {kind: evaluate, expression: "40 / 20", answer: "2"}
    answer_text: 'The first density is $\dfrac{30}{10} = 3$ and the second is $\dfrac{40}{20} = 2$. The second class holds more values, but its bar is shorter, because the class is three times as wide as the first.'

  - id: p11-probability
    section: "11.3"
    refs: [L1]
    statement: 'A histogram of 200 values has frequency density 6 in the class $10$–$20$. Estimate the probability that a value lies in that class.'
    answer_label: 'The estimated probability'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "6 * 10", answer: "60"}
        - {kind: evaluate, expression: "60 / 200", answer: "3/10"}
    answer_text: 'The frequency is $6 \times 10 = 60$, so the probability is $\dfrac{60}{200} = \dfrac{3}{10} = 0.3$. This is an estimate from the sample.'

  - id: p12-method-choice
    section: "11.3"
    refs: [L1]
    statement: 'A histogram has frequency density 6 in the class $0$–$5$ and frequency density 4 in the class $5$–$15$. Find the number of values in the class $5$–$15$. State whether you used the height or the area.'
    answer_label: 'The number of values'
    check:
      kind: evaluate
      expression: "4 * 10"
      answer: "40"
    answer_text: 'Use the area: $4 \times 10 = 40$ values. The height alone is 4, which is a frequency density, not a frequency.'

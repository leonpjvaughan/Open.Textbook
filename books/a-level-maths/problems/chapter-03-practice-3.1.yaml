# Practice set for 3.1, straight lines, gradients and straight-line models.
#
# A line is fixed by its gradient and one point, so a question that asks for an
# equation is verified by an `all` check on those two numbers: the gradient from
# the data, and the intercept it forces. Every record is exact arithmetic; no
# value here is rounded.
chapter: 3
symbols:
  x: {real: true}
  y: {real: true}
problems:
  - id: p1-gradient-two-points
    section: "3.1"
    dfe: [C1]
    statement: 'Work out the gradient of the line through $(2, 5)$ and $(7, 11)$.'
    answer_label: 'The gradient'
    check:
      kind: evaluate
      expression: "(11 - 5)/(7 - 2)"
      answer: "6/5"
    answer_text: 'Subtract the first point from the second on the top and on the bottom: $m = \dfrac{11 - 5}{7 - 2} = \dfrac{6}{5}$. The line rises $6$ units for every $5$ units across.'

  - id: p2-negative-gradient
    section: "3.1"
    dfe: [C1]
    statement: 'Work out the gradient of the line through $(-3, 4)$ and $(5, -2)$.'
    answer_label: 'The gradient'
    check:
      kind: evaluate
      expression: "(-2 - 4)/(5 - (-3))"
      answer: "-3/4"
    answer_text: '$m = \dfrac{-2 - 4}{5 - (-3)} = \dfrac{-6}{8} = -\dfrac{3}{4}$. The gradient is negative, so the line falls as it moves to the right.'

  - id: p3-gradient-and-point
    section: "3.1"
    dfe: [C1]
    statement: 'Find the equation of the line with gradient $4$ through $(3, -2)$, in the form $y = mx + c$.'
    answer_label: 'The equation'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "-2 - 4*3", answer: "-14"}
        - {kind: evaluate, expression: "4*3 - 14", answer: "-2"}
    answer_text: 'Use $y - y_1 = m(x - x_1)$ with $m = 4$ and $(3, -2)$: $y + 2 = 4(x - 3) = 4x - 12$, so $y = 4x - 14$. Check the point: $4 \times 3 - 14 = -2$, which is the given $y$-value.'

  - id: p4-equation-two-points
    section: "3.1"
    dfe: [C1]
    statement: 'Find the equation of the line through $(2, 5)$ and $(7, 11)$. Give the gradient and the intercept.'
    answer_label: 'The gradient and the intercept'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(11 - 5)/(7 - 2)", answer: "6/5"}
        - {kind: evaluate, expression: "5 - (6/5)*2", answer: "13/5"}
    answer_text: 'The gradient is $\dfrac{11 - 5}{7 - 2} = \dfrac{6}{5}$. Substitute the point $(2, 5)$ into $y - 5 = \frac{6}{5}(x - 2)$: $y = \frac{6}{5}x - \frac{12}{5} + 5 = \frac{6}{5}x + \frac{13}{5}$. The intercept is $\frac{13}{5}$. Multiplying by $5$ gives the equivalent form $6x - 5y + 13 = 0$.'

  - id: p5-general-form
    section: "3.1"
    dfe: [C1]
    statement: 'Write $y = \dfrac{2}{3}x - 4$ in the form $ax + by + c = 0$, where $a$, $b$ and $c$ are whole numbers.'
    answer_label: 'The equation in general form'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "2*0 - 3*(-4) - 12", answer: "0"}
        - {kind: evaluate, expression: "2*6 - 3*0 - 12", answer: "0"}
    answer_text: 'Multiply every term by $3$: $3y = 2x - 12$. Collect the terms on one side: $2x - 3y - 12 = 0$. The line passes through $(0, -4)$, from the original equation, and through $(6, 0)$, where $y = 0$; both points satisfy the new form, so the two equations describe the same line.'

  - id: p6-axis-crossings
    section: "3.1"
    dfe: [C1]
    statement: 'Work out where the line $2x + 3y = 12$ crosses each axis.'
    answer_label: 'The two intercepts'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "12/2", answer: "6"}
        - {kind: evaluate, expression: "12/3", answer: "4"}
    answer_text: 'Put $y = 0$: $2x = 12$, so the line crosses the $x$-axis at $(6, 0)$. Put $x = 0$: $3y = 12$, so it crosses the $y$-axis at $(0, 4)$.'

  - id: p7-gradient-from-equation
    section: "3.1"
    dfe: [C1]
    statement: 'Work out the gradient of the line $6x - 5y + 13 = 0$.'
    answer_label: 'The gradient'
    check:
      kind: evaluate
      expression: "-6/(-5)"
      answer: "6/5"
    answer_text: 'Rearrange to make $y$ the subject: $5y = 6x + 13$, so $y = \frac{6}{5}x + \frac{13}{5}$. The gradient is the coefficient of $x$, which is $\frac{6}{5}$. Rearranging always beats memorising a formula: the coefficient of $x$ is the gradient only after $y$ stands alone.'

  - id: p8-point-on-line
    section: "3.1"
    dfe: [C1]
    statement: 'Decide whether the point $(5, 2)$ lies on the line $y = 3x - 13$.'
    answer_label: 'The decision'
    check:
      kind: evaluate
      expression: "3*5 - 13 - 2"
      answer: "0"
    answer_text: 'Substitute $x = 5$: $3 \times 5 - 13 = 2$. That is the given $y$-value, so $(5, 2)$ lies on the line. The zero in the check is the difference between the line''s value and the point''s $y$-coordinate.'

  - id: p9-taxi-model
    section: "3.1"
    dfe: [C1]
    statement: 'A taxi charges a fixed £3 plus £2 for each kilometre. Write a model for the cost of a journey of $d$ kilometres, and work out the cost of a journey of $8$ km.'
    answer_label: 'The model and the cost'
    check:
      kind: evaluate
      expression: "3 + 2*8"
      answer: "19"
    answer_text: 'The model is $C = 3 + 2d$ pounds. The intercept $3$ is the fixed charge, paid before the taxi moves. The gradient $2$ is the rate, in pounds per kilometre. For $d = 8$: $C = 3 + 16 = 19$, so the fare is £19.'

  - id: p10-rate-from-two-readings
    section: "3.1"
    dfe: [C1]
    statement: 'A graph shows cost $C$ in pounds against the number $n$ of items. The line passes through $(2, 7)$ and $(6, 31)$. Work out the gradient and say what it means.'
    answer_label: 'The gradient and its meaning'
    check:
      kind: evaluate
      expression: "(31 - 7)/(6 - 2)"
      answer: "6"
    answer_text: 'The gradient is $\dfrac{31 - 7}{6 - 2} = \dfrac{24}{4} = 6$. The vertical quantity is cost in pounds and the horizontal quantity is a number of items, so the gradient means £6 per item: each extra item adds £6 to the cost.'

  - id: p11-line-through-three-points
    section: "3.1"
    dfe: [C1]
    statement: 'The points $(1, 3)$, $(2, 5)$ and $(3, 7)$ lie on a straight line. Find the equation of the line.'
    answer_label: 'The equation'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(5 - 3)/(2 - 1)", answer: "2"}
        - {kind: evaluate, expression: "3 - 2*1", answer: "1"}
    answer_text: 'Take the first two points: the gradient is $\dfrac{5 - 3}{2 - 1} = 2$. Substitute $(1, 3)$ into $y - 3 = 2(x - 1)$: $y = 2x + 1$. Check the third point: $2 \times 3 + 1 = 7$, so all three points fit the same line.'

  - id: p12-vertical-line
    section: "3.1"
    dfe: [C1]
    statement: 'The points $(4, -1)$ and $(4, 7)$ lie on a vertical line. Explain why the gradient is undefined, and write the equation of the line.'
    answer_label: 'The reason and the equation'
    check:
      kind: compare
      relation: "="
      lhs: "4 - 4"
      rhs: "0"
    answer_text: 'The gradient is $\dfrac{7 - (-1)}{4 - 4} = \dfrac{8}{0}$. The change in $x$ is $0$, and division by zero is undefined, so the line has no gradient. Every point on the line has $x = 4$, so its equation is $x = 4$. The general form $ax + by + c = 0$ still works here, with $b = 0$.'

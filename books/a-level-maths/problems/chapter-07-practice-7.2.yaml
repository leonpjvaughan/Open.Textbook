# Practice set for 7.2, differentiation from first principles.
#
# Each check applies a limit as h tends to zero to the chord gradient. The
# algebra of the expansion and the cancellation is what the check proves; the
# discipline of writing the four steps in order is human review.
chapter: 7
symbols:
  x: {real: true}
  h: {real: true}
problems:
  - id: p1-first-principles-square
    section: "7.2"
    dfe: [G1]
    statement: 'Differentiate $f(x) = x^2$ from first principles.'
    answer_label: 'The derivative'
    plays: first-principles
    check:
      kind: apply
      expression: "((x + h)**2 - x**2)/h"
      apply: {op: limit, args: [h, 0]}
      answer: "2*x"
    answer_text: '$f(x + h) - f(x) = 2xh + h^2$. Divide by $h$ to get $2x + h$, then let $h \to 0$. So $f''(x) = 2x$.'

  - id: p2-first-principles-value
    section: "7.2"
    dfe: [G1]
    statement: 'Use first principles to find the gradient of $y = x^2$ at $x = 3$.'
    answer_label: 'The gradient at $x = 3$'
    plays: first-principles
    check:
      kind: apply
      expression: "((3 + h)**2 - 3**2)/h"
      apply: {op: limit, args: [h, 0]}
      answer: "6"
    answer_text: 'Here $f(x) = x^2$ is fixed at $x = 3$, so the chord runs from $(3, 9)$ to $(3 + h, (3 + h)^2)$. The limit is $6$, so the gradient at $x = 3$ is $6$.'

  - id: p3-first-principles-sum
    section: "7.2"
    dfe: [G1]
    statement: 'Differentiate $f(x) = x^2 + 2x$ from first principles.'
    answer_label: 'The derivative'
    plays: first-principles
    check:
      kind: apply
      expression: "((x + h)**2 + 2*(x + h) - (x**2 + 2*x))/h"
      apply: {op: limit, args: [h, 0]}
      answer: "2*x + 2"
    answer_text: 'Expanding gives $f(x + h) - f(x) = 2xh + h^2 + 2h$. Divide by $h$ to get $2x + h + 2$, then let $h \to 0$. So $f''(x) = 2x + 2$.'

  - id: p4-first-principles-multiple
    section: "7.2"
    dfe: [G1]
    statement: 'Differentiate $f(x) = 3x^2$ from first principles.'
    answer_label: 'The derivative'
    plays: first-principles
    check:
      kind: apply
      expression: "(3*(x + h)**2 - 3*x**2)/h"
      apply: {op: limit, args: [h, 0]}
      answer: "6*x"
    answer_text: '$f(x + h) - f(x) = 6xh + 3h^2$. Divide by $h$ to get $6x + 3h$, then let $h \to 0$. So $f''(x) = 6x$, which is three times the derivative of $x^2$.'

  - id: p5-first-principles-cube
    section: "7.2"
    dfe: [G1]
    statement: 'Differentiate $f(x) = x^3$ from first principles.'
    answer_label: 'The derivative'
    plays: first-principles
    check:
      kind: apply
      expression: "((x + h)**3 - x**3)/h"
      apply: {op: limit, args: [h, 0]}
      answer: "3*x**2"
    answer_text: 'Use $(x + h)^3 = x^3 + 3x^2h + 3xh^2 + h^3$. The difference is $3x^2h + 3xh^2 + h^3$. Divide by $h$ to get $3x^2 + 3xh + h^2$, then let $h \to 0$. So $f''(x) = 3x^2$.'

  - id: p6-first-principles-cube-minus-x
    section: "7.2"
    dfe: [G1]
    statement: 'Differentiate $f(x) = x^3 - x$ from first principles.'
    answer_label: 'The derivative'
    plays: first-principles
    check:
      kind: apply
      expression: "((x + h)**3 - (x + h) - (x**3 - x))/h"
      apply: {op: limit, args: [h, 0]}
      answer: "3*x**2 - 1"
    answer_text: 'The difference is $3x^2h + 3xh^2 + h^3 - h$. Divide by $h$ to get $3x^2 + 3xh + h^2 - 1$, then let $h \to 0$. So $f''(x) = 3x^2 - 1$.'

  - id: p7-first-principles-constant
    section: "7.2"
    dfe: [G1]
    statement: 'Differentiate $f(x) = x^2 + 5$ from first principles.'
    answer_label: 'The derivative'
    plays: first-principles
    check:
      kind: apply
      expression: "((x + h)**2 + 5 - (x**2 + 5))/h"
      apply: {op: limit, args: [h, 0]}
      answer: "2*x"
    answer_text: 'The $5$ cancels in the subtraction, so the difference is $2xh + h^2$. Dividing by $h$ and letting $h \to 0$ gives $f''(x) = 2x$. Adding a constant moves the graph up but does not change its gradient.'

  - id: p8-first-principles-linear
    section: "7.2"
    dfe: [G1]
    statement: 'Differentiate $f(x) = 2x + 1$ from first principles.'
    answer_label: 'The derivative'
    plays: first-principles
    check:
      kind: apply
      expression: "(2*(x + h) + 1 - (2*x + 1))/h"
      apply: {op: limit, args: [h, 0]}
      answer: "2"
    answer_text: 'The difference is $2h$. Dividing by $h$ gives $2$, and the limit is $2$. The derivative of a straight line is its gradient, which is $2$ everywhere.'

  - id: p9-first-principles-quadratic-cubic
    section: "7.2"
    dfe: [G1]
    statement: 'Differentiate $f(x) = x^3 + x^2$ from first principles.'
    answer_label: 'The derivative'
    plays: first-principles
    check:
      kind: apply
      expression: "((x + h)**3 + (x + h)**2 - (x**3 + x**2))/h"
      apply: {op: limit, args: [h, 0]}
      answer: "3*x**2 + 2*x"
    answer_text: 'The difference is $3x^2h + 3xh^2 + h^3 + 2xh + h^2$. Divide by $h$ to get $3x^2 + 3xh + h^2 + 2x + h$, then let $h \to 0$. So $f''(x) = 3x^2 + 2x$.'

  - id: p10-first-principles-show
    section: "7.2"
    dfe: [G1]
    statement: 'Show, from first principles, that the gradient of $y = x^2$ at $x = -2$ is $-4$.'
    answer_label: 'The gradient at $x = -2$'
    plays: first-principles
    check:
      kind: apply
      expression: "((-2 + h)**2 - (-2)**2)/h"
      apply: {op: limit, args: [h, 0]}
      answer: "-4"
    answer_text: 'The difference is $(4 - 4h + h^2) - 4 = -4h + h^2$. Divide by $h$ to get $-4 + h$, then let $h \to 0$. The gradient is $-4$, which is negative, so the curve is falling at $x = -2$.'

# Practice set for 7.10, constructing differential equations.
#
# The verifier cannot read a sentence and judge a model: choosing the rate and
# the sign is human review. Each check proves the algebra either by
# substituting the stated solution into the constructed equation or by
# eliminating the constant from a family of curves.
chapter: 7
symbols:
  t: {real: true}
  x: {real: true}
  k: {real: true}
  P: {real: true}
  m: {real: true}
  T: {real: true}
  v: {real: true}
problems:
  - id: p1-population-growth
    section: "7.10"
    refs: [G6, OT3]
    statement: 'A population grows at a rate proportional to its size. Show that $P = P_0e^{kt}$ satisfies the differential equation you construct.'
    answer_label: 'The differential equation'
    check:
      kind: apply
      expression: "diff(P(t), t) - k*P(t)"
      apply: {op: dsolve, dependent: P, independent: t}
      equation: "diff(P(t), t) = k*P(t)"
      answer: "C1*exp(k*t)"
    answer_text: 'The rate is proportional to $P$ and the population grows, so $\dfrac{dP}{dt} = kP$ with $k > 0$. Substituting $P = P_0e^{kt}$ gives $\dfrac{dP}{dt} = kP_0e^{kt} = kP$, so the solution satisfies the equation.'

  - id: p2-radioactive-decay
    section: "7.10"
    refs: [G6, OT3]
    statement: 'A radioactive mass decays at a rate proportional to the mass. Construct the differential equation and show that $m = m_0e^{-kt}$ satisfies it.'
    answer_label: 'The differential equation'
    check:
      kind: apply
      expression: "diff(m(t), t) + k*m(t)"
      apply: {op: dsolve, dependent: m, independent: t}
      equation: "diff(m(t), t) = -k*m(t)"
      answer: "C1*exp(-k*t)"
    answer_text: 'The mass falls, so $\dfrac{dm}{dt} = -km$ with $k > 0$. Substituting $m = m_0e^{-kt}$ gives $\dfrac{dm}{dt} = -km_0e^{-kt} = -km$, so the solution satisfies the equation.'

  - id: p3-cooling
    section: "7.10"
    refs: [G6, OT3]
    statement: 'A body cools in a room at $15^\circ$C. Its temperature falls at a rate proportional to the difference from $15$. Construct the differential equation and show that $T = 15 + Ce^{-kt}$ satisfies it.'
    answer_label: 'The differential equation'
    check:
      kind: apply
      expression: "diff(T(t), t) + k*(T(t) - 15)"
      apply: {op: dsolve, dependent: T, independent: t}
      equation: "diff(T(t), t) = -k*(T(t) - 15)"
      answer: "15 + C1*exp(-k*t)"
    answer_text: 'The temperature difference is $T - 15$ and the body cools, so $\dfrac{dT}{dt} = -k(T - 15)$ with $k > 0$. Substituting $T = 15 + Ce^{-kt}$ gives $\dfrac{dT}{dt} = -kCe^{-kt} = -k(T - 15)$.'

  - id: p4-constant-acceleration
    section: "7.10"
    refs: [G6, OT3]
    statement: 'A car has constant acceleration $a$. Construct the differential equation for its velocity $v$ and show that $v = at + C$ satisfies it.'
    answer_label: 'The differential equation'
    check:
      kind: apply
      expression: "diff(v(t), t) - a"
      apply: {op: dsolve, dependent: v, independent: t}
      equation: "diff(v(t), t) = a"
      answer: "C1 + a*t"
    answer_text: 'Acceleration is the rate of change of velocity, so $\dfrac{dv}{dt} = a$. Substituting $v = at + C$ gives $\dfrac{dv}{dt} = a$, so the solution satisfies the equation.'

  - id: p5-cooling-limit
    section: "7.10"
    refs: [G6, OT3]
    statement: 'A liquid cools towards a room temperature of $18^\circ$C at a rate proportional to its excess over $18$. Construct the differential equation and show that $T = 18 + Ce^{-kt}$ satisfies it.'
    answer_label: 'The differential equation'
    check:
      kind: apply
      expression: "diff(T(t), t) + k*(T(t) - 18)"
      apply: {op: dsolve, dependent: T, independent: t}
      equation: "diff(T(t), t) = -k*(T(t) - 18)"
      answer: "18 + C1*exp(-k*t)"
    answer_text: 'The excess is $T - 18$, and the liquid cools, so $\dfrac{dT}{dt} = -k(T - 18)$ with $k > 0$. Substituting $T = 18 + Ce^{-kt}$ gives $\dfrac{dT}{dt} = -kCe^{-kt} = -k(T - 18)$.'

  - id: p6-price-demand
    section: "7.10"
    refs: [G6, OT3]
    statement: 'The price $P$ of an item falls at a rate proportional to the amount by which it exceeds $10$. Construct the differential equation and show that $P = 10 + Ce^{-kt}$ satisfies it.'
    answer_label: 'The differential equation'
    check:
      kind: apply
      expression: "diff(P(t), t) + k*(P(t) - 10)"
      apply: {op: dsolve, dependent: P, independent: t}
      equation: "diff(P(t), t) = -k*(P(t) - 10)"
      answer: "10 + C1*exp(-k*t)"
    answer_text: 'The excess is $P - 10$, and the price falls, so $\dfrac{dP}{dt} = -k(P - 10)$ with $k > 0$. Substituting $P = 10 + Ce^{-kt}$ gives $\dfrac{dP}{dt} = -kCe^{-kt} = -k(P - 10)$.'

  - id: p7-family-exponential
    section: "7.10"
    refs: [G6]
    statement: 'The curve $y = Ae^{2x}$ contains a constant $A$. Show that $y$ satisfies the differential equation $\dfrac{dy}{dx} = 2y$.'
    answer_label: 'The verification'
    check:
      kind: evaluate
      expression: "diff(A*exp(2*x), x) - 2*A*exp(2*x)"
      answer: "0"
    answer_text: 'Differentiate: $\dfrac{dy}{dx} = 2Ae^{2x} = 2y$. The constant $A$ cancels, so every curve in the family satisfies the same equation.'

  - id: p8-family-cubic
    section: "7.10"
    refs: [G6]
    statement: 'The curve $y = x^3 + C$ contains a constant $C$. Form a differential equation that does not contain $C$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "x**3 + C"
      apply: {op: diff, args: [x]}
      answer: "3*x**2"
    answer_text: 'Differentiating once removes the constant: $\dfrac{dy}{dx} = 3x^2$. Every curve of the family has the same gradient at a given $x$.'

  - id: p9-family-sine
    section: "7.10"
    refs: [G6]
    statement: 'The curve $y = A\sin 2x$ contains a constant $A$. Show that $y$ satisfies the differential equation $\dfrac{d^2y}{dx^2} = -4y$.'
    answer_label: 'The verification'
    check:
      kind: evaluate
      expression: "diff(diff(A*sin(2*x), x), x) + 4*A*sin(2*x)"
      answer: "0"
    answer_text: 'The first derivative is $2A\cos 2x$ and the second is $-4A\sin 2x$. Since $A\sin 2x = y$, the second derivative is $-4y$, which rearranges to the stated equation.'

  - id: p10-family-parabola
    section: "7.10"
    refs: [G6]
    statement: 'The curve $y = Ax^2$ contains a constant $A$. Show that $x\dfrac{dy}{dx} = 2y$.'
    answer_label: 'The verification'
    check:
      kind: evaluate
      expression: "x*diff(A*x**2, x) - 2*A*x**2"
      answer: "0"
    answer_text: '$\dfrac{dy}{dx} = 2Ax$, so $x\dfrac{dy}{dx} = 2Ax^2 = 2y$. The constant $A$ cancels on both sides.'

  - id: p11-family-decay
    section: "7.10"
    refs: [G6]
    statement: 'The curve $y = Ae^{-x}$ contains a constant $A$. Show that $y$ satisfies $\dfrac{dy}{dx} = -y$.'
    answer_label: 'The verification'
    check:
      kind: evaluate
      expression: "diff(A*exp(-x), x) + A*exp(-x)"
      answer: "0"
    answer_text: '$\dfrac{dy}{dx} = -Ae^{-x} = -y$. The curve falls at a rate equal to its own height.'

  - id: p12-logistic-style
    section: "7.10"
    refs: [G6, OT3]
    statement: 'A population $P$ grows at a rate proportional to $(1000 - P)$. Construct the differential equation and show that $P = 1000 - Ce^{-kt}$ satisfies it.'
    answer_label: 'The differential equation'
    check:
      kind: apply
      expression: "diff(P(t), t) - k*(1000 - P(t))"
      apply: {op: dsolve, dependent: P, independent: t}
      equation: "diff(P(t), t) = k*(1000 - P(t))"
      answer: "1000 + C1*exp(-k*t)"
    answer_text: 'The rate is proportional to the remaining room, $1000 - P$, so $\dfrac{dP}{dt} = k(1000 - P)$ with $k > 0$. Substituting $P = 1000 - Ce^{-kt}$ gives $\dfrac{dP}{dt} = kCe^{-kt} = k(1000 - P)$.'

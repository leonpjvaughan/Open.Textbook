# Practice set for 7.9, implicit and parametric differentiation.
#
# Implicit checks use apply: {op: idiff} on the relation set to zero. Parametric
# checks use apply: {op: parametric_diff} on Matrix([x, y]). The method of
# collecting the dy/dx terms, and the choice of formula, are human review.
chapter: 7
symbols:
  x: {real: true}
  y: {real: true}
  t: {real: true}
problems:
  - id: p1-implicit-circle
    section: "7.9"
    dfe: [G5]
    statement: 'Find $\dfrac{dy}{dx}$ for $x^2 + y^2 = 25$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "x**2 + y**2 - 25"
      apply: {op: idiff, args: [y, x]}
      answer: "-x/y"
    answer_text: 'Differentiate both sides: $2x + 2y\dfrac{dy}{dx} = 0$. So $\dfrac{dy}{dx} = -\dfrac{x}{y}$. The tangent is vertical where $y = 0$.'

  - id: p2-implicit-circle-point
    section: "7.9"
    dfe: [G5]
    statement: 'Find the gradient of $x^2 + y^2 = 100$ at the point $(6, 8)$.'
    answer_label: 'The gradient'
    check:
      kind: evaluate
      expression: "-6/8"
      answer: "-3/4"
    answer_text: 'For this circle $\dfrac{dy}{dx} = -\dfrac{x}{y}$. At $(6, 8)$ the gradient is $-\dfrac{6}{8} = -\dfrac{3}{4}$. The tangent through $(6, 8)$ is $y = -\tfrac{3}{4}x + \tfrac{25}{2}$.'

  - id: p3-implicit-product
    section: "7.9"
    dfe: [G5]
    statement: 'Find $\dfrac{dy}{dx}$ for $xy = 12$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "x*y - 12"
      apply: {op: idiff, args: [y, x]}
      answer: "-y/x"
    answer_text: 'Differentiate $xy$ with the product rule: $y + x\dfrac{dy}{dx} = 0$. So $\dfrac{dy}{dx} = -\dfrac{y}{x}$. This matches the derivative of $y = \dfrac{12}{x}$.'

  - id: p4-implicit-sum-product
    section: "7.9"
    dfe: [G5]
    statement: 'Find $\dfrac{dy}{dx}$ for $x^2 + xy = 6$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "x**2 + x*y - 6"
      apply: {op: idiff, args: [y, x]}
      answer: "-(2*x + y)/x"
    answer_text: 'Differentiate: $2x + y + x\dfrac{dy}{dx} = 0$. Collect the derivative: $\dfrac{dy}{dx} = -\dfrac{2x + y}{x}$.'

  - id: p5-implicit-mixed
    section: "7.9"
    dfe: [G5]
    statement: 'Find $\dfrac{dy}{dx}$ for $x^2 + 3xy - y^2 = 5$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "x**2 + 3*x*y - y**2 - 5"
      apply: {op: idiff, args: [y, x]}
      answer: "(2*x + 3*y)/(2*y - 3*x)"
    answer_text: 'Differentiate term by term: $2x + 3\left(y + x\dfrac{dy}{dx}\right) - 2y\dfrac{dy}{dx} = 0$. Collect the terms: $\dfrac{dy}{dx}(3x - 2y) = -(2x + 3y)$, so $\dfrac{dy}{dx} = \dfrac{2x + 3y}{2y - 3x}$.'

  - id: p6-implicit-cubes
    section: "7.9"
    dfe: [G5]
    statement: 'Find $\dfrac{dy}{dx}$ for $x^3 + y^3 = 9$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "x**3 + y**3 - 9"
      apply: {op: idiff, args: [y, x]}
      answer: "-x**2/y**2"
    answer_text: 'Differentiate: $3x^2 + 3y^2\dfrac{dy}{dx} = 0$. So $\dfrac{dy}{dx} = -\dfrac{x^2}{y^2}$.'

  - id: p7-parametric-square-quartic
    section: "7.9"
    dfe: [G5]
    statement: 'A curve is given by $x = t^2$, $y = t^3$. Find $\dfrac{dy}{dx}$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "Matrix([t**2, t**3])"
      apply: {op: parametric_diff, args: [t]}
      answer: "3*t/2"
    answer_text: '$\dfrac{dx}{dt} = 2t$ and $\dfrac{dy}{dt} = 3t^2$, so $\dfrac{dy}{dx} = \dfrac{3t^2}{2t} = \dfrac{3t}{2}$.'

  - id: p8-parametric-quartic
    section: "7.9"
    dfe: [G5]
    statement: 'A curve is given by $x = t^2$, $y = t^4$. Find $\dfrac{dy}{dx}$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "Matrix([t**2, t**4])"
      apply: {op: parametric_diff, args: [t]}
      answer: "2*t**2"
    answer_text: '$\dfrac{dx}{dt} = 2t$ and $\dfrac{dy}{dt} = 4t^3$, so $\dfrac{dy}{dx} = \dfrac{4t^3}{2t} = 2t^2$.'

  - id: p9-parametric-trig
    section: "7.9"
    dfe: [G5]
    statement: 'A curve is given by $x = \cos t$, $y = \sin t$. Find $\dfrac{dy}{dx}$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "Matrix([cos(t), sin(t)])"
      apply: {op: parametric_diff, args: [t]}
      answer: "-cot(t)"
    answer_text: '$\dfrac{dx}{dt} = -\sin t$ and $\dfrac{dy}{dt} = \cos t$, so $\dfrac{dy}{dx} = \dfrac{\cos t}{-\sin t} = -\cot t$.'

  - id: p10-parametric-line
    section: "7.9"
    dfe: [G5]
    statement: 'A curve is given by $x = 2t$, $y = t^2$. Find $\dfrac{dy}{dx}$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "Matrix([2*t, t**2])"
      apply: {op: parametric_diff, args: [t]}
      answer: "t"
    answer_text: '$\dfrac{dx}{dt} = 2$ and $\dfrac{dy}{dt} = 2t$, so $\dfrac{dy}{dx} = \dfrac{2t}{2} = t$.'

  - id: p11-implicit-tangent
    section: "7.9"
    dfe: [G5]
    statement: 'Find the gradient of the tangent to $x^2 + y^2 = 25$ at the point $(4, 3)$.'
    answer_label: 'The gradient'
    check:
      kind: evaluate
      expression: "-4/3"
      answer: "-4/3"
    answer_text: 'For the circle $\dfrac{dy}{dx} = -\dfrac{x}{y}$. At $(4, 3)$ the gradient is $-\dfrac{4}{3}$, which is the negative reciprocal of the radius gradient $\dfrac{3}{4}$.'

  - id: p12-parametric-cubic
    section: "7.9"
    dfe: [G5]
    statement: 'A curve is given by $x = t + 1$, $y = t^3$. Find $\dfrac{dy}{dx}$.'
    answer_label: 'The derivative'
    check:
      kind: apply
      expression: "Matrix([t + 1, t**3])"
      apply: {op: parametric_diff, args: [t]}
      answer: "3*t**2"
    answer_text: '$\dfrac{dx}{dt} = 1$ and $\dfrac{dy}{dt} = 3t^2$, so $\dfrac{dy}{dx} = \dfrac{3t^2}{1} = 3t^2$.'

# Practice set for 10.1, vectors in two and three dimensions.
#
# Every record is about representation: a displacement, a scalar multiple, a
# parallel pair. A vector is a column, so a `vector` check compares matrices
# component by component; nothing here needs a decimal or a tolerance.
chapter: 10
problems:
  - id: p1-column-displacement
    section: "10.1"
    refs: [J1]
    statement: 'Write the displacement from $A(1, 2)$ to $B(5, 7)$ as a column vector, and in $\mathbf{i}$, $\mathbf{j}$ form.'
    answer_label: 'The displacement'
    check:
      kind: vector
      op: subtract
      args: ["Matrix([5, 7])", "Matrix([1, 2])"]
      answer: "Matrix([4, 5])"
    answer_text: 'Subtract the coordinates of $A$ from those of $B$: $\vec{AB} = \begin{pmatrix} 5 - 1 \\ 7 - 2 \end{pmatrix} = \begin{pmatrix} 4 \\ 5 \end{pmatrix} = 4\mathbf{i} + 5\mathbf{j}$. The vector moves $4$ units east and $5$ units north.'

  - id: p2-reverse-displacement
    section: "10.1"
    refs: [J1]
    statement: 'Write the displacement from $B(5, 7)$ to $A(1, 2)$ as a column vector.'
    answer_label: 'The displacement'
    check:
      kind: vector
      op: subtract
      args: ["Matrix([1, 2])", "Matrix([5, 7])"]
      answer: "Matrix([-4, -5])"
    answer_text: 'Subtract the coordinates of $B$ from those of $A$: $\vec{BA} = \begin{pmatrix} 1 - 5 \\ 2 - 7 \end{pmatrix} = \begin{pmatrix} -4 \\ -5 \end{pmatrix}$. This is $-\vec{AB}$, so it points the opposite way.'

  - id: p3-scalar-multiple
    section: "10.1"
    refs: [J1]
    statement: 'A vector is $\mathbf{a} = 2\mathbf{i} + 3\mathbf{j}$. Write down $3\mathbf{a}$ in column form.'
    answer_label: 'The vector $3\mathbf{a}$'
    check:
      kind: vector
      op: scale
      args: ["3", "Matrix([2, 3])"]
      answer: "Matrix([6, 9])"
    answer_text: 'Multiplying by a scalar multiplies each component: $3\mathbf{a} = 3(2\mathbf{i} + 3\mathbf{j}) = 6\mathbf{i} + 9\mathbf{j}$, which is the column $\begin{pmatrix} 6 \\ 9 \end{pmatrix}$. The new vector is parallel to $\mathbf{a}$ and three times as long.'

  - id: p4-negative-in-three-dimensions
    section: "10.1"
    refs: [J1]
    statement: 'A vector is $\mathbf{w} = 4\mathbf{i} - \mathbf{j} + 2\mathbf{k}$. Write down $-\mathbf{w}$ in column form.'
    answer_label: 'The vector $-\mathbf{w}$'
    check:
      kind: vector
      op: scale
      args: ["-1", "Matrix([4, -1, 2])"]
      answer: "Matrix([-4, 1, -2])"
    answer_text: 'Multiplying by $-1$ changes the sign of every component: $-\mathbf{w} = -4\mathbf{i} + \mathbf{j} - 2\mathbf{k} = \begin{pmatrix} -4 \\ 1 \\ -2 \end{pmatrix}$. The vector is parallel to $\mathbf{w}$ and points the opposite way.'

  - id: p5-parallel-multiple
    section: "10.1"
    refs: [J1]
    statement: 'Show that $\mathbf{v} = 6\mathbf{i} - 3\mathbf{j}$ is parallel to $\mathbf{u} = 2\mathbf{i} - \mathbf{j}$, and state the multiplier.'
    answer_label: 'The multiplier $k$'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "6/2", answer: "3"}
        - {kind: evaluate, expression: "-3/(-1)", answer: "3"}
    answer_text: 'Each component of $\mathbf{v}$ is $3$ times the matching component of $\mathbf{u}$: $\mathbf{v} = 3\mathbf{u}$, so $k = 3$. The multiplier is positive, so the two vectors point the same way.'

  - id: p6-equal-displacement
    section: "10.1"
    refs: [J1]
    statement: 'The points are $P(1, 5)$ and $Q(4, 3)$. Show that $\vec{PQ}$ equals $\mathbf{a} = 3\mathbf{i} - 2\mathbf{j}$.'
    answer_label: 'The displacement $\vec{PQ}$'
    check:
      kind: vector
      op: subtract
      args: ["Matrix([4, 3])", "Matrix([1, 5])"]
      answer: "Matrix([3, -2])"
    answer_text: '$\vec{PQ} = \begin{pmatrix} 4 - 1 \\ 3 - 5 \end{pmatrix} = \begin{pmatrix} 3 \\ -2 \end{pmatrix} = 3\mathbf{i} - 2\mathbf{j}$. Both components match $\mathbf{a}$, so the vectors are equal.'

  - id: p7-three-dimensional-displacement
    section: "10.1"
    refs: [J1]
    statement: 'Write the displacement from $P(1, 0, 2)$ to $Q(4, 3, -2)$ in column form.'
    answer_label: 'The displacement'
    check:
      kind: vector
      op: subtract
      args: ["Matrix([4, 3, -2])", "Matrix([1, 0, 2])"]
      answer: "Matrix([3, 3, -4])"
    answer_text: 'Subtract each coordinate of $P$ from the matching coordinate of $Q$: $\vec{PQ} = \begin{pmatrix} 4 - 1 \\ 3 - 0 \\ -2 - 2 \end{pmatrix} = \begin{pmatrix} 3 \\ 3 \\ -4 \end{pmatrix}$. The negative $z$-component means the displacement is downwards.'

  - id: p8-half-vector-three-dimensions
    section: "10.1"
    refs: [J1]
    statement: 'A vector is $\mathbf{w} = 4\mathbf{i} - \mathbf{j} + 2\mathbf{k}$. Write down $\frac{1}{2}\mathbf{w}$ in column form.'
    answer_label: 'The vector $\frac{1}{2}\mathbf{w}$'
    check:
      kind: vector
      op: scale
      args: ["1/2", "Matrix([4, -1, 2])"]
      answer: "Matrix([2, -1/2, 1])"
    answer_text: 'Halve each component: $\frac{1}{2}\mathbf{w} = 2\mathbf{i} - \frac{1}{2}\mathbf{j} + \mathbf{k} = \begin{pmatrix} 2 \\ -\frac{1}{2} \\ 1 \end{pmatrix}$. The two vectors are parallel, and $\frac{1}{2}\mathbf{w}$ points the same way as $\mathbf{w}$.'

  - id: p9-column-from-unit-vectors
    section: "10.1"
    refs: [J1]
    statement: 'Write $6\mathbf{i} - 5\mathbf{j}$ as a column vector. State the top number and the bottom number.'
    answer_label: 'The two components'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "6", answer: "6"}
        - {kind: evaluate, expression: "-5", answer: "-5"}
    answer_text: 'The coefficient of $\mathbf{i}$ is the $x$-component, which goes on top. The coefficient of $\mathbf{j}$ is the $y$-component, which goes below. The column is $\begin{pmatrix} 6 \\ -5 \end{pmatrix}$.'

  - id: p10-repeated-step-on-a-line
    section: "10.1"
    refs: [J1]
    statement: 'The points are $A(2, 3)$, $B(5, 8)$ and $C(8, 13)$. Show that $\vec{AB}$ and $\vec{BC}$ are equal.'
    answer_label: 'Both displacements'
    check:
      kind: all
      checks:
        - kind: vector
          op: subtract
          args: ["Matrix([5, 8])", "Matrix([2, 3])"]
          answer: "Matrix([3, 5])"
        - kind: vector
          op: subtract
          args: ["Matrix([8, 13])", "Matrix([5, 8])"]
          answer: "Matrix([3, 5])"
    answer_text: '$\vec{AB} = \begin{pmatrix} 5 - 2 \\ 8 - 3 \end{pmatrix} = \begin{pmatrix} 3 \\ 5 \end{pmatrix}$ and $\vec{BC} = \begin{pmatrix} 8 - 5 \\ 13 - 8 \end{pmatrix} = \begin{pmatrix} 3 \\ 5 \end{pmatrix}$. The two displacements are equal, so the same step repeats and the three points lie on one straight line.'

  - id: p11-parallel-opposite
    section: "10.1"
    refs: [J1]
    statement: 'Show that $\mathbf{b} = -4\mathbf{i} - 6\mathbf{j}$ is parallel to $\mathbf{a} = 2\mathbf{i} + 3\mathbf{j}$, and state the multiplier.'
    answer_label: 'The multiplier $k$'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "-4/2", answer: "-2"}
        - {kind: evaluate, expression: "-6/3", answer: "-2"}
    answer_text: 'Both components divide by the same number: $\mathbf{b} = -2\mathbf{a}$, so $k = -2$. The multiplier is negative, so $\mathbf{b}$ is parallel to $\mathbf{a}$ but points the opposite way.'

  - id: p12-doubling-a-displacement
    section: "10.1"
    refs: [J1]
    statement: 'A displacement is $\vec{AB} = 3\mathbf{i} - 4\mathbf{j}$. Write down $\vec{BA}$ and $2\vec{AB}$.'
    answer_label: 'Both vectors'
    check:
      kind: all
      checks:
        - kind: vector
          op: scale
          args: ["-1", "Matrix([3, -4])"]
          answer: "Matrix([-3, 4])"
        - kind: vector
          op: scale
          args: ["2", "Matrix([3, -4])"]
          answer: "Matrix([6, -8])"
    answer_text: 'Changing the order reverses the signs: $\vec{BA} = -3\mathbf{i} + 4\mathbf{j}$. Doubling multiplies each component by $2$: $2\vec{AB} = 6\mathbf{i} - 8\mathbf{j}$. The first points the opposite way; the second points the same way and is twice as long.'

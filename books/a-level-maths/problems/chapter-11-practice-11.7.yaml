# Practice set for 11.7, working with the large data set. The items mix
# sampling (K1), diagrams (L1), correlation (L2), averages (L3) and cleaning
# (L4). The tables are small illustrative extracts, not any board's data set,
# because no board's large data set is named by a source we hold.
chapter: 11
symbols:
  x: {real: true}
problems:
  - id: p1-sample-count
    section: "11.7"
    refs: [K1]
    statement: 'A large data set holds 4000 days of weather records. A simple random sample of 200 days contains 50 wet days. Estimate the number of wet days in the whole data set.'
    answer_label: 'The estimated number of wet days'
    check:
      kind: evaluate
      expression: "(50 / 200) * 4000"
      answer: "1000"
    answer_text: 'The sample proportion is $\dfrac{50}{200} = 0.25$, so the estimate is $0.25 \times 4000 = 1000$ wet days. Here the data set is the population and the 200 days are a sample from it.'

  - id: p2-stratified
    section: "11.7"
    refs: [K1]
    statement: 'A data set contains 1200 days from station A and 800 days from station B. A stratified sample of 100 days is taken. Find the number of days from station A.'
    answer_label: 'The sample size from station A'
    check:
      kind: evaluate
      expression: "(1200 / 2000) * 100"
      answer: "60"
    answer_text: 'The total is 2000 days, so station A contributes $\dfrac{1200}{2000} \times 100 = 60$ days. Stratifying keeps the two stations in proportion.'

  - id: p3-frequency-density
    section: "11.7"
    refs: [L1]
    statement: 'An extract groups daily rainfall into $0$–$2$ mm with frequency 30 and $2$–$10$ mm with frequency 40. Find the frequency density of the $2$–$10$ mm class.'
    answer_label: 'The frequency density'
    check:
      kind: evaluate
      expression: "40 / 8"
      answer: "5"
    answer_text: 'The class width is $10 - 2 = 8$, so the frequency density is $\dfrac{40}{8} = 5$. The two classes have different widths, so a histogram is needed.'

  - id: p4-frequency-from-density
    section: "11.7"
    refs: [L1]
    statement: 'A histogram of daily sunshine has frequency density 6 in the class $10$–$20$ hours. Find the frequency in the class.'
    answer_label: 'The frequency'
    check:
      kind: evaluate
      expression: "6 * 10"
      answer: "60"
    answer_text: 'The frequency is the area of the bar: $6 \times 10 = 60$ days.'

  - id: p5-part-class
    section: "11.7"
    refs: [L1]
    statement: 'A histogram of daily rainfall has frequency density 3 in the class $0$–$10$ mm. Find the number of days with rainfall between $4$ mm and $10$ mm.'
    answer_label: 'The number of days'
    check:
      kind: evaluate
      expression: "3 * 6"
      answer: "18"
    answer_text: 'The part from $4$ mm to $10$ mm has width 6, so the frequency is $3 \times 6 = 18$ days.'

  - id: p6-mean
    section: "11.7"
    refs: [L3]
    statement: 'Six daily maximum temperatures, in degrees Celsius, are $18, 20, 22, 19, 21, 20$. Find the mean.'
    answer_label: 'The mean'
    check:
      kind: statistic
      data: [18, 20, 22, 19, 21, 20]
      stat: mean
      answer: "20"
    answer_text: 'The values sum to 120, and there are 6 of them, so the mean is $\dfrac{120}{6} = 20$ degrees Celsius.'

  - id: p7-standard-deviation
    section: "11.7"
    refs: [L3]
    statement: 'Find the standard deviation of $18, 20, 22, 19, 21, 20$, dividing by $n$.'
    answer_label: 'The standard deviation'
    check:
      kind: statistic
      data: [18, 20, 22, 19, 21, 20]
      stat: std
      convention: population
      answer: "sqrt(15)/3"
    answer_text: 'The mean is 20. The squared deviations sum to 10, so the variance is $\dfrac{10}{6}$ and $\sigma = \dfrac{\sqrt{15}}{3} = 1.29$ (3 s.f.). This is the population convention, dividing by $n$; some software divides by $n - 1$.'

  - id: p8-interquartile-range
    section: "11.7"
    refs: [L3]
    statement: 'Find the interquartile range of $18, 20, 22, 19, 21, 20$, using the $(n + 1)$ positions.'
    answer_label: 'The interquartile range'
    check:
      kind: statistic
      data: [18, 20, 22, 19, 21, 20]
      stat: iqr
      convention: linear
      answer: "5/2"
    answer_text: 'In order the values are $18, 19, 20, 20, 21, 22$. The position of $Q_1$ is $\dfrac{7}{4} = 1.75$, giving 18.75. The position of $Q_3$ is $\dfrac{21}{4} = 5.25$, giving 21.25. The IQR is $21.25 - 18.75 = 2.5 = \dfrac{5}{2}$.'

  - id: p9-outlier-fences
    section: "11.7"
    refs: [L4]
    statement: 'A data set has $Q_1 = 18.75$, $Q_3 = 21.25$ and IQR $= 2.5$. Find the two fences for a possible outlier.'
    answer_label: 'The two fences'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "18.75 - 1.5 * 2.5", answer: "15"}
        - {kind: evaluate, expression: "21.25 + 1.5 * 2.5", answer: "25"}
    answer_text: 'The fences are $18.75 - 3.75 = 15$ and $21.25 + 3.75 = 25$. A value below 15 or above 25 is a possible outlier in this data set.'

  - id: p10-missing-value
    section: "11.7"
    refs: [L4]
    statement: 'One day in an extract has a missing rainfall value. The five known values are $12, 15, 14, 16, 13$ mm. Find the mean of the known values.'
    answer_label: 'The mean of the known values'
    check:
      kind: statistic
      data: [12, 15, 14, 16, 13]
      stat: mean
      answer: "14"
    answer_text: 'The known values sum to 70 over 5 days, so the mean is $\dfrac{70}{5} = 14$ mm. Report that one value was missing, so the sample used fewer days.'

  - id: p11-unit-conversion
    section: "11.7"
    refs: [L4]
    statement: 'A temperature is recorded as $68$ degrees Fahrenheit, but the rest of the data are in degrees Celsius. Convert $68$ degrees Fahrenheit to degrees Celsius.'
    answer_label: 'The temperature in degrees Celsius'
    check:
      kind: evaluate
      expression: "(68 - 32) * 5 / 9"
      answer: "20"
    answer_text: 'Use ${}^\circ\mathrm{C} = \dfrac{5}{9}({}^\circ\mathrm{F} - 32)$: $\dfrac{5}{9}(68 - 32) = 20$ degrees Celsius. Convert every value to one unit before calculating.'

  - id: p12-method-choice
    section: "11.7"
    refs: [L2]
    statement: 'A scatter diagram from a large data set plots hours of sunshine against temperature, and a line of best fit passes through $(2, 12)$ and $(6, 20)$. Find the gradient of the line.'
    answer_label: 'The gradient'
    check:
      kind: evaluate
      expression: "(20 - 12) / (6 - 2)"
      answer: "2"
    answer_text: 'The gradient is $\dfrac{20 - 12}{6 - 2} = 2$, so each extra hour of sunshine is associated with about 2 degrees Celsius more. The correlation is positive; it does not by itself prove that sunshine causes the rise.'

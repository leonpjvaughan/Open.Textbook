# Practice set for 8.2, definite integrals and the area under a curve.
#
# Each definite integral is evaluated exactly. A signed integral is stated as
# the exact value; where a total area needs a split, the two pieces are checked
# and the sum is stated in answer_text, which the verifier cannot prove as
# geometry but which follows from the two exact pieces.
chapter: 8
symbols:
  x: {real: true}
problems:
  - id: t1-cubic
    section: "8.2"
    refs: [H3]
    statement: 'Evaluate $\displaystyle\int_0^2 x^3\,dx$.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "x**3"
      apply: {op: integrate, args: [x, "0", "2"]}
      answer: "4"
    answer_text: '$\displaystyle\int_0^2 x^3\,dx = \left[\dfrac{x^4}{4}\right]_0^2 = 4$.'

  - id: t2-linear
    section: "8.2"
    refs: [H3]
    statement: 'Evaluate $\displaystyle\int_1^3 (2x + 1)\,dx$.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "2*x + 1"
      apply: {op: integrate, args: [x, "1", "3"]}
      answer: "10"
    answer_text: '$\displaystyle\int_1^3 (2x + 1)\,dx = \Big[x^2 + x\Big]_1^3 = 12 - 2 = 10$.'

  - id: t3-quadratic
    section: "8.2"
    refs: [H3]
    statement: 'Evaluate $\displaystyle\int_0^1 (3x^2 - 2x + 1)\,dx$.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "3*x**2 - 2*x + 1"
      apply: {op: integrate, args: [x, "0", "1"]}
      answer: "1"
    answer_text: '$\displaystyle\int_0^1 (3x^2 - 2x + 1)\,dx = \Big[x^3 - x^2 + x\Big]_0^1 = 1 - 0 = 1$.'

  - id: t4-reciprocal
    section: "8.2"
    refs: [H3]
    statement: 'Evaluate $\displaystyle\int_1^2 \frac{1}{x}\,dx$, giving an exact answer.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "1/x"
      apply: {op: integrate, args: [x, "1", "2"]}
      answer: "ln(2)"
    answer_text: '$\displaystyle\int_1^2 \dfrac{1}{x}\,dx = \Big[\ln x\Big]_1^2 = \ln 2 - \ln 1 = \ln 2$.'

  - id: t5-exponential
    section: "8.2"
    refs: [H3]
    statement: 'Evaluate $\displaystyle\int_0^1 e^{2x}\,dx$, giving an exact answer.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "exp(2*x)"
      apply: {op: integrate, args: [x, "0", "1"]}
      answer: "(exp(2) - 1)/2"
    answer_text: '$\displaystyle\int_0^1 e^{2x}\,dx = \left[\dfrac{1}{2}e^{2x}\right]_0^1 = \dfrac{e^2 - 1}{2}$.'

  - id: t6-cosine
    section: "8.2"
    refs: [H3]
    statement: 'Evaluate $\displaystyle\int_0^{\pi/2} \cos x\,dx$.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "cos(x)"
      apply: {op: integrate, args: [x, "0", "pi/2"]}
      answer: "1"
    answer_text: '$\displaystyle\int_0^{\pi/2} \cos x\,dx = \Big[\sin x\Big]_0^{\pi/2} = 1 - 0 = 1$.'

  - id: t7-sine
    section: "8.2"
    refs: [H3]
    statement: 'Evaluate $\displaystyle\int_0^{\pi} \sin x\,dx$.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "sin(x)"
      apply: {op: integrate, args: [x, "0", "pi"]}
      answer: "2"
    answer_text: '$\displaystyle\int_0^{\pi} \sin x\,dx = \Big[-\cos x\Big]_0^{\pi} = 1 - (-1) = 2$.'

  - id: t8-odd-function
    section: "8.2"
    refs: [H3]
    statement: 'Evaluate $\displaystyle\int_{-1}^{1} x^3\,dx$ and explain the value.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "x**3"
      apply: {op: integrate, args: [x, "-1", "1"]}
      answer: "0"
    answer_text: '$\displaystyle\int_{-1}^{1} x^3\,dx = \left[\dfrac{x^4}{4}\right]_{-1}^{1} = \dfrac{1}{4} - \dfrac{1}{4} = 0$. The region below the axis cancels the region above it, because the curve has rotational symmetry about the origin.'

  - id: t9-signed-area
    section: "8.2"
    refs: [H3]
    statement: 'Evaluate $\displaystyle\int_0^3 (x^2 - 4)\,dx$.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "x**2 - 4"
      apply: {op: integrate, args: [x, "0", "3"]}
      answer: "-3"
    answer_text: '$\displaystyle\int_0^3 (x^2 - 4)\,dx = \left[\dfrac{x^3}{3} - 4x\right]_0^3 = 9 - 12 = -3$. The value is negative because the curve lies below the axis for part of the interval.'

  - id: t10-area-domain
    section: "8.2"
    refs: [H3]
    statement: 'Find the area under the curve $y = 4 - x^2$ between $x = -2$ and $x = 2$.'
    answer_label: 'The area'
    check:
      kind: apply
      expression: "4 - x**2"
      apply: {op: integrate, args: [x, "-2", "2"]}
      answer: "32/3"
    answer_text: 'The curve is above the axis on the whole interval, so the area is $\displaystyle\int_{-2}^2 (4 - x^2)\,dx = \left[4x - \dfrac{x^3}{3}\right]_{-2}^2 = \dfrac{16}{3} + \dfrac{16}{3} = \dfrac{32}{3}$ square units.'

  - id: t11-area-square
    section: "8.2"
    refs: [H3]
    statement: 'Find the area under the curve $y = x^2$ between $x = 0$ and $x = 3$.'
    answer_label: 'The area'
    check:
      kind: apply
      expression: "x**2"
      apply: {op: integrate, args: [x, "0", "3"]}
      answer: "9"
    answer_text: '$\displaystyle\int_0^3 x^2\,dx = \left[\dfrac{x^3}{3}\right]_0^3 = 9$ square units.'

  - id: t12-split-area
    section: "8.2"
    refs: [H3]
    statement: 'Find the total area between the curve $y = x^2 - 2x$ and the horizontal axis, from $x = 0$ to $x = 3$.'
    answer_label: 'The total area'
    check:
      kind: all
      checks:
        - {kind: apply, expression: "x**2 - 2*x", apply: {op: integrate, args: [x, "0", "2"]}, answer: "-4/3"}
        - {kind: apply, expression: "x**2 - 2*x", apply: {op: integrate, args: [x, "2", "3"]}, answer: "4/3"}
        - {kind: evaluate, expression: "4/3 + 4/3", answer: "8/3"}
    answer_text: 'The curve crosses the axis at $x = 0$ and $x = 2$. The first piece is $\displaystyle\int_0^2 (x^2 - 2x)\,dx = -\dfrac{4}{3}$, and the second is $\displaystyle\int_2^3 (x^2 - 2x)\,dx = \dfrac{4}{3}$. The total area is $\dfrac{4}{3} + \dfrac{4}{3} = \dfrac{8}{3}$ square units.'

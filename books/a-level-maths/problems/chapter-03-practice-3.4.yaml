# Practice set for 3.4, parametric equations and Cartesian conversion.
#
# Eliminating the parameter is a named `apply` operation, so a step that is not
# an equivalence declares itself. Where the parameter carries a sine and a
# cosine, the elimination is the identity cos^2 + sin^2 = 1 and is proved by
# `evaluate` on the sum of squares. Where solving for the parameter would be
# two-valued (x = t^2), the parameterisation is checked by the identity it
# satisfies instead, because the single-valued `eliminate` operation cannot
# express a branch.
chapter: 3
symbols:
  x: {real: true}
  y: {real: true}
  t: {real: true}
problems:
  - id: p1-point-from-parameter
    section: "3.4"
    dfe: [C3]
    statement: 'A curve has parametric equations $x = 3t$, $y = t^2 + 1$. Find the point where $t = 2$.'
    answer_label: 'The point'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "3*2", answer: "6"}
        - {kind: evaluate, expression: "2**2 + 1", answer: "5"}
    answer_text: 'Substitute $t = 2$ into each equation: $x = 3 \times 2 = 6$ and $y = 2^2 + 1 = 5$. The point is $(6, 5)$.'

  - id: p2-eliminate-parabola
    section: "3.4"
    dfe: [C3]
    statement: 'Find the Cartesian equation of the curve $x = 3t$, $y = t^2 + 1$.'
    answer_label: 'The Cartesian equation'
    check:
      kind: apply
      expression: "Matrix([3*t, t**2 + 1])"
      apply: {op: eliminate, args: ["t", "x", "y"]}
      answer: "Eq(y, x**2/9 + 1)"
    answer_text: 'Make $t$ the subject of $x = 3t$: $t = \dfrac{x}{3}$. Substitute into $y = t^2 + 1$: $y = \left(\dfrac{x}{3}\right)^2 + 1 = \dfrac{x^2}{9} + 1$. The curve is a parabola. Check the point from the previous question: at $x = 6$, $y = \frac{36}{9} + 1 = 5$.'

  - id: p3-eliminate-line
    section: "3.4"
    dfe: [C3]
    statement: 'Find the Cartesian equation of the curve $x = t - 4$, $y = 2t + 1$.'
    answer_label: 'The Cartesian equation'
    check:
      kind: apply
      expression: "Matrix([t - 4, 2*t + 1])"
      apply: {op: eliminate, args: ["t", "x", "y"]}
      answer: "Eq(y, 2*x + 9)"
    answer_text: 'Make $t$ the subject of $x = t - 4$: $t = x + 4$. Substitute into $y = 2t + 1$: $y = 2(x + 4) + 1 = 2x + 9$. The curve is a straight line of gradient $2$.'

  - id: p4-eliminate-circle
    section: "3.4"
    dfe: [C3]
    statement: 'Find the Cartesian equation of the curve $x = 4\cos t$, $y = 4\sin t$.'
    answer_label: 'The Cartesian equation'
    check:
      kind: evaluate
      expression: "(4*cos(t))**2 + (4*sin(t))**2"
      answer: "16"
    answer_text: 'Make each trigonometric function the subject: $\cos t = \dfrac{x}{4}$ and $\sin t = \dfrac{y}{4}$. Square and add, using $\cos^2 t + \sin^2 t = 1$: $\left(\dfrac{x}{4}\right)^2 + \left(\dfrac{y}{4}\right)^2 = 1$. Multiply by $16$ to get $x^2 + y^2 = 16$, the circle of radius $4$ centred on the origin.'

  - id: p5-eliminate-shifted-circle
    section: "3.4"
    dfe: [C3]
    statement: 'Find the Cartesian equation of the curve $x = 1 + 3\cos t$, $y = -2 + 3\sin t$.'
    answer_label: 'The Cartesian equation'
    check:
      kind: evaluate
      expression: "(1 + 3*cos(t) - 1)**2 + (-2 + 3*sin(t) + 2)**2"
      answer: "9"
    answer_text: 'Rearrange first: $\cos t = \dfrac{x - 1}{3}$ and $\sin t = \dfrac{y + 2}{3}$. Square and add: $\left(\dfrac{x - 1}{3}\right)^2 + \left(\dfrac{y + 2}{3}\right)^2 = 1$, so $(x - 1)^2 + (y + 2)^2 = 9$. The curve is a circle with centre $(1, -2)$ and radius $3$.'

  - id: p6-cartesian-to-parametric
    section: "3.4"
    dfe: [C3]
    statement: 'Give parametric equations for the curve $y = x^2 - 3$, and show that eliminating the parameter returns the same curve.'
    answer_label: 'The parametric equations'
    check:
      kind: apply
      expression: "Matrix([t, t**2 - 3])"
      apply: {op: eliminate, args: ["t", "x", "y"]}
      answer: "Eq(y, x**2 - 3)"
    answer_text: 'Let $t = x$. Then $x = t$ and $y = t^2 - 3$. Eliminating $t$ by substituting $t = x$ gives back $y = x^2 - 3$, so the parameterisation describes the whole curve. This choice of parameter is the simplest one; a curve has many parameterisations.'

  - id: p7-restricted-range
    section: "3.4"
    dfe: [C3]
    statement: 'A curve is given by $x = t + 2$, $y = t^2$, for $0 \le t \le 2$. Find its Cartesian equation and the range of $x$ that it covers.'
    answer_label: 'The Cartesian equation and the range of x'
    check:
      kind: all
      checks:
        - {kind: apply, expression: "Matrix([t + 2, t**2])", apply: {op: eliminate, args: ["t", "x", "y"]}, answer: "Eq(y, (x - 2)**2)"}
        - {kind: evaluate, expression: "0 + 2", answer: "2"}
        - {kind: evaluate, expression: "2 + 2", answer: "4"}
    answer_text: 'Eliminate $t$: from $x = t + 2$ we get $t = x - 2$, so $y = (x - 2)^2$. The parameter runs from $0$ to $2$, so $x = t + 2$ runs from $2$ to $4$. The curve is the part of the parabola with $2 \le x \le 4$, not the whole parabola.'

  - id: p8-eliminate-hyperbola
    section: "3.4"
    dfe: [C3]
    statement: 'Find the Cartesian equation of the curve $x = t$, $y = \dfrac{1}{t}$, where $t \ne 0$.'
    answer_label: 'The Cartesian equation'
    check:
      kind: apply
      expression: "Matrix([t, 1/t])"
      apply: {op: eliminate, args: ["t", "x", "y"]}
      answer: "Eq(y, 1/x)"
    answer_text: 'The first equation already gives $t = x$. Substitute into the second: $y = \dfrac{1}{x}$. The curve is a hyperbola. The condition $t \ne 0$ becomes $x \ne 0$, so the curve is not defined at the origin and neither axis is crossed.'

  - id: p9-identity-for-a-cusp
    section: "3.4"
    dfe: [C3]
    statement: 'A curve is given by $x = t^2$, $y = t^3$. Show that it satisfies $y^2 = x^3$.'
    answer_label: 'The identity'
    check:
      kind: evaluate
      expression: "(t**3)**2 - (t**2)**3"
      answer: "0"
    answer_text: 'Substitute both parametric expressions: $y^2 = (t^3)^2 = t^6$ and $x^3 = (t^2)^3 = t^6$. These are equal, so every point of the curve satisfies $y^2 = x^3$. Eliminating $t$ directly is not possible here, because $x = t^2$ gives two values of $t$, $t = \sqrt{x}$ and $t = -\sqrt{x}$; the curve is not the graph of a function.'

  - id: p10-point-on-parametric-curve
    section: "3.4"
    dfe: [C3]
    statement: 'Decide whether the point $(4, 8)$ lies on the curve $x = t^2$, $y = t^3$.'
    answer_label: 'The decision'
    check:
      kind: evaluate
      expression: "Matrix([t**2, t**3]).subs(t, 2)"
      answer: "Matrix([4, 8])"
    answer_text: 'Try $t = 2$: $x = 2^2 = 4$ and $y = 2^3 = 8$. Both coordinates match, so $(4, 8)$ lies on the curve. The parameter $t = 2$ produces the point, which is what "lies on the curve" means for a parametric description.'

  - id: p11-eliminate-linear
    section: "3.4"
    dfe: [C3]
    statement: 'Find the Cartesian equation of the curve $x = 2t + 1$, $y = t - 3$.'
    answer_label: 'The Cartesian equation'
    check:
      kind: apply
      expression: "Matrix([2*t + 1, t - 3])"
      apply: {op: eliminate, args: ["t", "x", "y"]}
      answer: "Eq(y, x/2 - 7/2)"
    answer_text: 'Either equation can give $t$. From $x = 2t + 1$: $t = \dfrac{x - 1}{2}$. Substitute: $y = \dfrac{x - 1}{2} - 3 = \dfrac{x}{2} - \dfrac{1}{2} - 3 = \dfrac{x}{2} - \dfrac{7}{2}$. The curve is a straight line. Check with the other equation: from $y = t - 3$, $t = y + 3$; substituting into $x = 2t + 1$ gives $x = 2y + 7$. Rearranging gives $y = \frac{x}{2} - \frac{7}{2}$, the same line.'

  - id: p12-method-choice
    section: "3.4"
    dfe: [C3]
    statement: 'A curve is given by $x = t^2$, $y = 2t$. Find the Cartesian equation, and state the part of the curve it covers.'
    answer_label: 'The Cartesian equation and the range of x'
    check:
      kind: apply
      expression: "Matrix([2*t, t**2])"
      apply: {op: eliminate, args: ["t", "y", "x"]}
      answer: "Eq(x, y**2/4)"
    answer_text: 'Eliminate $t$ from the equation without a square: $t = \dfrac{y}{2}$, so $x = \left(\dfrac{y}{2}\right)^2 = \dfrac{y^2}{4}$. This is the same as $y^2 = 4x$, a parabola opening to the right. Every value of $x = t^2$ is at least $0$, so the curve covers only $x \ge 0$. Eliminating the parameter with the squared equation would give two branches and lose this restriction.'

# Practice set for 8.6, integrating with partial fractions.
#
# Each answer is verified by differentiation. The partial-fraction split itself
# is written out in answer_text; the check proves the stated antiderivative, so
# an incorrect split fails even when the logarithms look plausible.
chapter: 8
symbols:
  x: {real: true}
problems:
  - id: x1-distinct
    section: "8.6"
    refs: [H6]
    statement: 'Find $\displaystyle\int \frac{1}{(x - 1)(x + 2)}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: "1/((x - 1)*(x + 2))"
      apply: {op: integrate, args: [x]}
      answer: "ln(x - 1)/3 - ln(x + 2)/3"
      variable: x
    answer_text: 'Split into $\dfrac{1}{3(x - 1)} - \dfrac{1}{3(x + 2)}$. Integrating gives $\dfrac{1}{3}\ln|x - 1| - \dfrac{1}{3}\ln|x + 2| + C = \dfrac{1}{3}\ln\left|\dfrac{x - 1}{x + 2}\right| + C$.'

  - id: x2-numerator-linear
    section: "8.6"
    refs: [H6]
    statement: 'Find $\displaystyle\int \frac{5x + 1}{(x - 1)(x + 2)}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: "(5*x + 1)/((x - 1)*(x + 2))"
      apply: {op: integrate, args: [x]}
      answer: "2*ln(x - 1) + 3*ln(x + 2)"
      variable: x
    answer_text: 'The split is $\dfrac{2}{x - 1} + \dfrac{3}{x + 2}$, so the integral is $2\ln|x - 1| + 3\ln|x + 2| + C$.'

  - id: x3-unit-coefficients
    section: "8.6"
    refs: [H6]
    statement: 'Find $\displaystyle\int \frac{2x + 3}{(x + 1)(x + 2)}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: "(2*x + 3)/((x + 1)*(x + 2))"
      apply: {op: integrate, args: [x]}
      answer: "ln(x + 1) + ln(x + 2)"
      variable: x
    answer_text: 'The split is $\dfrac{1}{x + 1} + \dfrac{1}{x + 2}$, so the integral is $\ln|x + 1| + \ln|x + 2| + C = \ln|(x + 1)(x + 2)| + C$.'

  - id: x4-negative-coefficient
    section: "8.6"
    refs: [H6]
    statement: 'Find $\displaystyle\int \frac{x + 4}{(x - 2)(x + 1)}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: "(x + 4)/((x - 2)*(x + 1))"
      apply: {op: integrate, args: [x]}
      answer: "2*ln(x - 2) - ln(x + 1)"
      variable: x
    answer_text: 'The split is $\dfrac{2}{x - 2} - \dfrac{1}{x + 1}$, so the integral is $2\ln|x - 2| - \ln|x + 1| + C$.'

  - id: x5-fractional-coefficients
    section: "8.6"
    refs: [H6]
    statement: 'Find $\displaystyle\int \frac{3x - 2}{(x + 1)(x - 3)}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: "(3*x - 2)/((x + 1)*(x - 3))"
      apply: {op: integrate, args: [x]}
      answer: "5*ln(x + 1)/4 + 7*ln(x - 3)/4"
      variable: x
    answer_text: 'The split is $\dfrac{5}{4(x + 1)} + \dfrac{7}{4(x - 3)}$, so the integral is $\dfrac{5}{4}\ln|x + 1| + \dfrac{7}{4}\ln|x - 3| + C$.'

  - id: x6-repeated
    section: "8.6"
    refs: [H6]
    statement: 'Find $\displaystyle\int \frac{1}{x(x - 1)^2}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: "1/(x*(x - 1)**2)"
      apply: {op: integrate, args: [x]}
      answer: "ln(x) - ln(x - 1) - 1/(x - 1)"
      variable: x
    answer_text: 'The split is $\dfrac{1}{x} - \dfrac{1}{x - 1} - \dfrac{1}{(x - 1)^2}$. Integrating gives $\ln|x| - \ln|x - 1| - \dfrac{1}{x - 1} + C$.'

  - id: x7-definite
    section: "8.6"
    refs: [H6]
    statement: 'Evaluate $\displaystyle\int_2^3 \frac{1}{(x - 1)(x + 2)}\,dx$, giving an exact answer.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "1/((x - 1)*(x + 2))"
      apply: {op: integrate, args: [x, "2", "3"]}
      answer: "ln(8/5)/3"
    answer_text: 'The antiderivative is $\dfrac{1}{3}\ln\left|\dfrac{x - 1}{x + 2}\right|$. Then $\dfrac{1}{3}\left(\ln\dfrac{2}{5} - \ln\dfrac{1}{4}\right) = \dfrac{1}{3}\ln\dfrac{8}{5}$.'

  - id: x8-improper
    section: "8.6"
    refs: [H6]
    statement: 'Find $\displaystyle\int \frac{x^2 + 1}{x(x - 1)}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: "(x**2 + 1)/(x*(x - 1))"
      apply: {op: integrate, args: [x]}
      answer: "x - ln(x) + 2*ln(x - 1)"
      variable: x
    answer_text: 'Divide first: $\dfrac{x^2 + 1}{x(x - 1)} = 1 - \dfrac{1}{x} + \dfrac{2}{x - 1}$. Integrating gives $x - \ln|x| + 2\ln|x - 1| + C$.'

  - id: x9-simple-sum
    section: "8.6"
    refs: [H6]
    statement: 'Find $\displaystyle\int \frac{1}{(x + 1)(x + 3)}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: "1/((x + 1)*(x + 3))"
      apply: {op: integrate, args: [x]}
      answer: "ln(x + 1)/2 - ln(x + 3)/2"
      variable: x
    answer_text: 'The split is $\dfrac{1}{2(x + 1)} - \dfrac{1}{2(x + 3)}$, so the integral is $\dfrac{1}{2}\ln|x + 1| - \dfrac{1}{2}\ln|x + 3| + C$.'

  - id: x10-repeated-shifted
    section: "8.6"
    refs: [H6]
    statement: 'Find $\displaystyle\int \frac{1}{x(x + 1)^2}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: "1/(x*(x + 1)**2)"
      apply: {op: integrate, args: [x]}
      answer: "ln(x) - ln(x + 1) + 1/(x + 1)"
      variable: x
    answer_text: 'The split is $\dfrac{1}{x} - \dfrac{1}{x + 1} - \dfrac{1}{(x + 1)^2}$. Integrating gives $\ln|x| - \ln|x + 1| + \dfrac{1}{x + 1} + C$.'

  - id: x11-degree-equal
    section: "8.6"
    refs: [H6]
    statement: 'Find $\displaystyle\int \frac{x^2}{x^2 - 1}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: "x**2/(x**2 - 1)"
      apply: {op: integrate, args: [x]}
      answer: "x + ln(x - 1)/2 - ln(x + 1)/2"
      variable: x
    answer_text: 'Divide first: $\dfrac{x^2}{x^2 - 1} = 1 + \dfrac{1}{2(x - 1)} - \dfrac{1}{2(x + 1)}$. Integrating gives $x + \dfrac{1}{2}\ln\left|\dfrac{x - 1}{x + 1}\right| + C$.'

  - id: x12-definite-simple
    section: "8.6"
    refs: [H6]
    statement: 'Evaluate $\displaystyle\int_0^1 \frac{1}{(x + 1)(x + 2)}\,dx$, giving an exact answer.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: "1/((x + 1)*(x + 2))"
      apply: {op: integrate, args: [x, "0", "1"]}
      answer: "ln(4/3)"
    answer_text: 'The integral is $\Big[\ln(x + 1) - \ln(x + 2)\Big]_0^1 = (\ln 2 - \ln 3) + \ln 2 = \ln\dfrac{4}{3}$.'

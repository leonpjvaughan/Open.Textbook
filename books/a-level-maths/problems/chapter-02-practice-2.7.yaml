# Practice set for 2.7, polynomials, the factor theorem and algebraic division.
#
# Division names its operation: `apply: {op: div}` proves the quotient and
# `apply: {op: rem}` proves the remainder with SymPy's div, so inspection and
# long division are both accepted — the verifier proves the result, not the
# method. The factor theorem is an `evaluate` to zero at the candidate root.
chapter: 2
symbols:
  x: {real: true}
  k: {real: true}
problems:
  - id: p1-division-quotient
    section: "2.7"
    refs: [B6]
    statement: 'Divide $x^3 - 2x^2 + 4x - 7$ by $x - 1$ and give the quotient.'
    answer_label: 'The quotient'
    check:
      kind: apply
      expression: "x**3 - 2*x**2 + 4*x - 7"
      apply: {op: div, args: ["x - 1", x]}
      answer: "x**2 - x + 3"
    answer_text: 'Divide: $x^3 - 2x^2 + 4x - 7 = (x - 1)(x^2 - x + 3) - 4$. The quotient is $x^2 - x + 3$.'

  - id: p2-division-remainder
    section: "2.7"
    refs: [B6]
    statement: 'Find the remainder when $x^3 - 2x^2 + 4x - 7$ is divided by $x - 1$.'
    answer_label: 'The remainder'
    check:
      kind: apply
      expression: "x**3 - 2*x**2 + 4*x - 7"
      apply: {op: rem, args: ["x - 1", x]}
      answer: "-4"
    answer_text: 'By the remainder theorem the remainder is $p(1) = 1 - 2 + 4 - 7 = -4$.'

  - id: p3-remainder-theorem
    section: "2.7"
    refs: [B6]
    statement: 'Use the remainder theorem to find the remainder when $x^3 + 2x^2 - 5x + 1$ is divided by $x - 2$.'
    answer_label: 'The remainder'
    check:
      kind: apply
      expression: "x**3 + 2*x**2 - 5*x + 1"
      apply: {op: rem, args: ["x - 2", x]}
      answer: "7"
    answer_text: 'Substitute $x = 2$: $2^3 + 2 \times 2^2 - 5 \times 2 + 1 = 8 + 8 - 10 + 1 = 7$. The remainder is $7$.'

  - id: p4-factor-theorem-zero
    section: "2.7"
    refs: [B6]
    statement: 'Show that $x - 2$ is a factor of $p(x) = x^3 - 3x^2 + 4x - 4$.'
    answer_label: 'The value at the root'
    check:
      kind: evaluate
      expression: "2**3 - 3*2**2 + 4*2 - 4"
      answer: "0"
    answer_text: 'Substitute $x = 2$: $p(2) = 8 - 12 + 8 - 4 = 0$. Since $p(2) = 0$, the factor theorem says $x - 2$ is a factor. In fact $p(x) = (x - 2)(x^2 - x + 2)$.'

  - id: p5-factorise-cubic
    section: "2.7"
    refs: [B6]
    statement: 'Factorise $x^3 - 6x^2 + 11x - 6$ completely.'
    answer_label: 'Factorised'
    check:
      kind: evaluate
      expression: "x**3 - 6*x**2 + 11*x - 6"
      answer: "(x - 1)*(x - 2)*(x - 3)"
    answer_text: 'The constant is $-6$, so try factors of $6$. $p(1) = 1 - 6 + 11 - 6 = 0$, so $x - 1$ is a factor. Dividing gives $(x - 1)(x^2 - 5x + 6)$, and $x^2 - 5x + 6 = (x - 2)(x - 3)$. So $x^3 - 6x^2 + 11x - 6 = (x - 1)(x - 2)(x - 3)$.'

  - id: p6-factorise-cubic-two
    section: "2.7"
    refs: [B6]
    statement: 'Factorise $x^3 + 2x^2 - x - 2$ completely.'
    answer_label: 'Factorised'
    check:
      kind: evaluate
      expression: "x**3 + 2*x**2 - x - 2"
      answer: "(x - 1)*(x + 1)*(x + 2)"
    answer_text: '$p(1) = 1 + 2 - 1 - 2 = 0$, so $x - 1$ is a factor. Dividing gives $(x - 1)(x^2 + 3x + 2)$, and $x^2 + 3x + 2 = (x + 1)(x + 2)$. So $x^3 + 2x^2 - x - 2 = (x - 1)(x + 1)(x + 2)$.'

  - id: p7-division-non-zero
    section: "2.7"
    refs: [B6]
    statement: 'Divide $2x^3 + 3x^2 - 8x + 3$ by $x + 3$. Give the quotient and state whether $x + 3$ is a factor.'
    answer_label: 'The quotient'
    check:
      kind: apply
      expression: "2*x**3 + 3*x**2 - 8*x + 3"
      apply: {op: div, args: ["x + 3", x]}
      answer: "2*x**2 - 3*x + 1"
    answer_text: 'Divide: $2x^3 + 3x^2 - 8x + 3 = (x + 3)(2x^2 - 3x + 1)$. The quotient is $2x^2 - 3x + 1$. The remainder is zero, so $x + 3$ is a factor. Also $p(-3) = -54 + 27 + 24 + 3 = 0$, which confirms it by the factor theorem.'

  - id: p8-solve-cubic
    section: "2.7"
    refs: [B6]
    statement: 'Solve $x^3 - 4x^2 + x + 6 = 0$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "x**3 - 4*x**2 + x + 6 = 0"
      variable: x
      answer: ["-1", "2", "3"]
    answer_text: 'Try $x = -1$: $-1 - 4 - 1 + 6 = 0$, so $x + 1$ is a factor. Dividing gives $(x + 1)(x^2 - 5x + 6)$, and $x^2 - 5x + 6 = (x - 2)(x - 3)$. The roots are $x = -1$, $x = 2$ and $x = 3$.'

  - id: p9-remainder-quartic
    section: "2.7"
    refs: [B6]
    statement: 'Find the remainder when $x^4 - 3x + 2$ is divided by $x + 1$.'
    answer_label: 'The remainder'
    check:
      kind: apply
      expression: "x**4 - 3*x + 2"
      apply: {op: rem, args: ["x + 1", x]}
      answer: "6"
    answer_text: 'Write $x + 1$ as $x - (-1)$, so substitute $x = -1$: $(-1)^4 - 3 \times (-1) + 2 = 1 + 3 + 2 = 6$. The remainder is $6$.'

  - id: p10-find-the-constant
    section: "2.7"
    refs: [B6]
    statement: 'Given that $x - 2$ is a factor of $x^3 + kx^2 - 4$, find $k$.'
    answer_label: 'The value of $k$'
    check:
      kind: solve
      equation: "8 + 4*k - 4 = 0"
      variable: k
      answer: ["-1"]
    answer_text: 'A factor gives a zero remainder, so $p(2) = 0$: $2^3 + k \times 2^2 - 4 = 0$, so $8 + 4k - 4 = 0$ and $4k = -4$. Therefore $k = -1$.'

  - id: p11-factorise-three-roots
    section: "2.7"
    refs: [B6]
    statement: 'Factorise $x^3 - 2x^2 - 5x + 6$ completely.'
    answer_label: 'Factorised'
    check:
      kind: evaluate
      expression: "x**3 - 2*x**2 - 5*x + 6"
      answer: "(x - 1)*(x + 2)*(x - 3)"
    answer_text: '$p(1) = 1 - 2 - 5 + 6 = 0$, so $x - 1$ is a factor. Dividing gives $(x - 1)(x^2 - x - 6)$, and $x^2 - x - 6 = (x + 2)(x - 3)$. So $x^3 - 2x^2 - 5x + 6 = (x - 1)(x + 2)(x - 3)$.'

  - id: p12-factor-then-divide
    section: "2.7"
    refs: [B6]
    statement: 'Given that $x = 1$ is a root of $x^3 - 7x + 6 = 0$, divide to find the other two roots.'
    answer_label: 'The quotient, then the roots'
    check:
      kind: all
      checks:
        - {kind: apply, expression: "x**3 - 7*x + 6", apply: {op: div, args: ["x - 1", x]}, answer: "x**2 + x - 6"}
        - {kind: solve, equation: "x**2 + x - 6 = 0", variable: x, answer: ["-3", "2"]}
    answer_text: 'Since $x = 1$ is a root, $x - 1$ is a factor. Dividing gives $x^3 - 7x + 6 = (x - 1)(x^2 + x - 6)$. Factorise the quadratic: $x^2 + x - 6 = (x + 3)(x - 2)$, so the other roots are $x = -3$ and $x = 2$. The three roots are $-3$, $1$ and $2$.'

# Practice set for 2.9, graphs, the modulus function, asymptotes and
# intersections.
#
# A modulus equation splits into two cases, and the `solve` check compares the
# whole real solution set, so a case that produces no valid value is already
# excluded. An inequality answer is a set; an asymptote is a named limit, so the
# horizontal asymptote is `apply: {op: limit}` as x tends to infinity.
chapter: 2
symbols:
  x: {real: true}
  y: {real: true}
problems:
  - id: p1-modulus-equation
    section: "2.9"
    refs: [B7]
    statement: 'Solve $|x - 3| = 2$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "Abs(x - 3) = 2"
      variable: x
      answer: ["1", "5"]
    answer_text: 'The expression inside the modulus is either $2$ or $-2$. Case 1: $x - 3 = 2$, so $x = 5$. Case 2: $x - 3 = -2$, so $x = 1$. Both values satisfy the equation.'

  - id: p2-modulus-scaling
    section: "2.9"
    refs: [B7]
    statement: 'Solve $|2x - 1| = 5$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "Abs(2*x - 1) = 5"
      variable: x
      answer: ["-2", "3"]
    answer_text: 'Case 1: $2x - 1 = 5$, so $2x = 6$ and $x = 3$. Case 2: $2x - 1 = -5$, so $2x = -4$ and $x = -2$. Both values work.'

  - id: p3-modulus-fraction-root
    section: "2.9"
    refs: [B7]
    statement: 'Solve $|3x - 1| = 4$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "Abs(3*x - 1) = 4"
      variable: x
      answer: ["-1", "5/3"]
    answer_text: 'Case 1: $3x - 1 = 4$, so $x = \frac{5}{3}$. Case 2: $3x - 1 = -4$, so $3x = -3$ and $x = -1$. Both values work.'

  - id: p4-modulus-both-sides
    section: "2.9"
    refs: [B7]
    statement: 'Solve $|x + 3| = |2x|$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "Abs(x + 3) = Abs(2*x)"
      variable: x
      answer: ["-1", "3"]
    answer_text: 'Two expressions have the same modulus when they are equal or when one is the negative of the other. Case 1: $x + 3 = 2x$, so $x = 3$. Case 2: $x + 3 = -2x$, so $3x = -3$ and $x = -1$. Both values satisfy the equation.'

  - id: p5-modulus-with-linear
    section: "2.9"
    refs: [B7]
    statement: 'Solve $|x| = 2x - 1$.'
    answer_label: 'The solution'
    check:
      kind: solve
      equation: "Abs(x) = 2*x - 1"
      variable: x
      answer: ["1"]
    answer_text: 'Case 1, $x \geq 0$: $x = 2x - 1$, so $x = 1$. Case 2, $x < 0$: $-x = 2x - 1$, so $3x = 1$ and $x = \frac{1}{3}$. The value $x = \frac{1}{3}$ is not in the case $x < 0$, so it is rejected. The only solution is $x = 1$.'

  - id: p6-modulus-inequality-inside
    section: "2.9"
    refs: [B7]
    statement: 'Solve $|x + 1| < 3$.'
    answer_label: 'The solution set'
    check:
      kind: inequality
      variable: x
      inequality: "Abs(x + 1) < 3"
      answer: "Interval.open(-4, 2)"
    answer_text: '$|x + 1| < 3$ means the distance from $x$ to $-1$ is less than $3$. So $-3 < x + 1 < 3$. Subtract $1$ from every part: $-4 < x < 2$, or $x \in (-4, 2)$.'

  - id: p7-modulus-inequality-outside
    section: "2.9"
    refs: [B7]
    statement: 'Solve $|x - 2| \geq 1$.'
    answer_label: 'The solution set'
    check:
      kind: inequality
      variable: x
      inequality: "Abs(x - 2) >= 1"
      answer: "Union(Interval(-oo, 1), Interval(3, oo))"
    answer_text: 'The distance from $x$ to $2$ is at least $1$, so $x$ lies at or beyond the two points $1$ and $3$. This gives $x \leq 1$ or $x \geq 3$, that is $x \in (-\infty, 1] \cup [3, \infty)$.'

  - id: p8-intersections-parabola-line
    section: "2.9"
    refs: [B7]
    statement: 'Find the points where the curve $y = x^2$ meets the line $y = x + 6$.'
    answer_label: 'The intersection points'
    check:
      kind: system
      equations: ["y = x**2", "y = x + 6"]
      variables: [x, y]
      answer: [[3, 9], [-2, 4]]
    answer_text: 'Set $x^2 = x + 6$: $x^2 - x - 6 = 0$, so $(x - 3)(x + 2) = 0$. The values are $x = 3$ and $x = -2$. Substituting into $y = x^2$ gives the points $(3, 9)$ and $(-2, 4)$.'

  - id: p9-intersections-axis
    section: "2.9"
    refs: [B7]
    statement: 'Find where the curve $y = x^2 - 4$ meets the line $y = 0$, and explain what these points are.'
    answer_label: 'The intersection points'
    check:
      kind: system
      equations: ["y = x**2 - 4", "y = 0"]
      variables: [x, y]
      answer: [[2, 0], [-2, 0]]
    answer_text: 'The line $y = 0$ is the $x$-axis. Setting $x^2 - 4 = 0$ gives $x^2 = 4$, so $x = 2$ or $x = -2$. The points are $(2, 0)$ and $(-2, 0)$; they are the roots of $x^2 - 4 = 0$, read from the graph as the places where the curve crosses the $x$-axis.'

  - id: p10-reciprocal-equation
    section: "2.9"
    refs: [B7]
    statement: 'Solve $\dfrac{1}{x} = 2$.'
    answer_label: 'The solution'
    check:
      kind: solve
      equation: "1/x = 2"
      variable: x
      answer: ["1/2"]
    answer_text: 'The graph of $y = \frac{1}{x}$ meets the line $y = 2$ once. Solve: multiply both sides by $x$ (which is not zero), giving $1 = 2x$, so $x = \frac{1}{2}$. The value $x = 0$ is excluded from the domain.'

  - id: p11-reciprocal-meets-line
    section: "2.9"
    refs: [B7]
    statement: 'Find the points where $y = \dfrac{1}{x}$ meets the line $y = x$.'
    answer_label: 'The intersection points'
    check:
      kind: solve
      equation: "1/x = x"
      variable: x
      answer: ["-1", "1"]
    answer_text: 'Set $\frac{1}{x} = x$. Multiply both sides by $x$: $1 = x^2$, so $x = 1$ or $x = -1$. The points are $(1, 1)$ and $(-1, -1)$.'

  - id: p12-horizontal-asymptote
    section: "2.9"
    refs: [B7]
    statement: 'The curve $y = \dfrac{3}{x - 2} + 1$ has a horizontal asymptote. Find its equation by considering what happens as $x \to \infty$.'
    answer_label: 'The asymptote'
    check:
      kind: apply
      expression: "3/(x - 2) + 1"
      apply: {op: limit, args: [x, oo]}
      answer: "1"
    answer_text: 'As $x \to \infty$, the fraction $\frac{3}{x - 2}$ gets closer and closer to $0$. So $y \to 1$. The horizontal asymptote is $y = 1$. There is also a vertical asymptote at $x = 2$, where the denominator is zero and the curve is undefined.'

# Practice set for 2.4, solving quadratic equations, including in a function of
# the unknown.
#
# Each solution set is compared exactly, so a surd answer is proved symbolically.
# The substitution-and-back-substitution records state the values of x, not of
# the substituted letter t; the answer text shows the extra step.
chapter: 2
symbols:
  x: {real: true}
problems:
  - id: p1-factorise
    section: "2.4"
    refs: [B3]
    statement: 'Solve $x^2 - 5x + 6 = 0$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "x**2 - 5*x + 6 = 0"
      variable: x
      answer: ["2", "3"]
    answer_text: 'Factorise: $x^2 - 5x + 6 = (x - 2)(x - 3)$. A product is zero when a factor is zero, so $x = 2$ or $x = 3$.'

  - id: p2-factorise-leading
    section: "2.4"
    refs: [B3]
    statement: 'Solve $2x^2 + 5x - 3 = 0$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "2*x**2 + 5*x - 3 = 0"
      variable: x
      answer: ["-3", "1/2"]
    answer_text: 'Split the middle term: $2x^2 + 6x - x - 3 = (2x - 1)(x + 3)$. So $x = \frac{1}{2}$ or $x = -3$. Alternatively, the formula with $a = 2$, $b = 5$ and $c = -3$ gives the same two roots.'

  - id: p3-completing-the-square
    section: "2.4"
    refs: [B3]
    statement: 'Solve $x^2 + 4x - 1 = 0$, giving the answer in surd form.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "x**2 + 4*x - 1 = 0"
      variable: x
      answer: ["-2 - sqrt(5)", "-2 + sqrt(5)"]
    answer_text: 'Complete the square: $x^2 + 4x - 1 = (x + 2)^2 - 5$, so $(x + 2)^2 = 5$. Then $x + 2 = \pm\sqrt{5}$, so $x = -2 \pm \sqrt{5}$.'

  - id: p4-formula
    section: "2.4"
    refs: [B3]
    statement: 'Solve $x^2 - 3x - 2 = 0$, giving the answer in surd form.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "x**2 - 3*x - 2 = 0"
      variable: x
      answer: ["(3 - sqrt(17))/2", "(3 + sqrt(17))/2"]
    answer_text: 'Use the formula with $a = 1$, $b = -3$ and $c = -2$: $x = \dfrac{3 \pm \sqrt{9 + 8}}{2} = \dfrac{3 \pm \sqrt{17}}{2}$. Neither root factorises, so the surd form is the exact answer.'

  - id: p5-in-x-squared
    section: "2.4"
    refs: [B3]
    statement: 'Solve $x^4 - 5x^2 + 4 = 0$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "x**4 - 5*x**2 + 4 = 0"
      variable: x
      answer: ["-2", "-1", "1", "2"]
    answer_text: 'Let $t = x^2$. Then $t^2 - 5t + 4 = 0$, so $(t - 1)(t - 4) = 0$ and $t = 1$ or $t = 4$. Replace $t$: $x^2 = 1$ gives $x = \pm 1$, and $x^2 = 4$ gives $x = \pm 2$. There are four solutions.'

  - id: p6-in-an-exponential
    section: "2.4"
    refs: [B3]
    statement: 'Solve $2^{2x} - 5 \times 2^x + 4 = 0$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "2**(2*x) - 5*2**x + 4 = 0"
      variable: x
      answer: ["0", "2"]
    answer_text: 'Let $t = 2^x$. Then $t^2 - 5t + 4 = 0$, so $t = 1$ or $t = 4$. Replace $t$: $2^x = 1$ gives $x = 0$, and $2^x = 4$ gives $x = 2$.'

  - id: p7-with-a-square-root
    section: "2.4"
    refs: [B3]
    statement: 'Solve $x + 3\sqrt{x} - 10 = 0$.'
    answer_label: 'The solution'
    check:
      kind: solve
      equation: "x + 3*sqrt(x) - 10 = 0"
      variable: x
      answer: ["4"]
    answer_text: 'Let $t = \sqrt{x}$, so $x = t^2$ and $t \geq 0$. Then $t^2 + 3t - 10 = 0$, so $(t + 5)(t - 2) = 0$ and $t = 2$ or $t = -5$. The value $t = -5$ is rejected because a square root is never negative. So $\sqrt{x} = 2$ and $x = 4$. Check: $4 + 3 \times 2 - 10 = 0$.'

  - id: p8-reciprocal
    section: "2.4"
    refs: [B3]
    statement: 'Solve $\dfrac{1}{x^2} - \dfrac{3}{x} + 2 = 0$, where $x \neq 0$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "1/x**2 - 3/x + 2 = 0"
      variable: x
      answer: ["1/2", "1"]
    answer_text: 'Let $t = \frac{1}{x}$. Then $t^2 - 3t + 2 = 0$, so $(t - 1)(t - 2) = 0$ and $t = 1$ or $t = 2$. Replace $t$: $\frac{1}{x} = 1$ gives $x = 1$, and $\frac{1}{x} = 2$ gives $x = \frac{1}{2}$. Neither value is zero, so both are allowed.'

  - id: p9-in-x-cubed
    section: "2.4"
    refs: [B3]
    statement: 'Solve $x^6 - 9x^3 + 8 = 0$ for real $x$.'
    answer_label: 'The real solutions'
    check:
      kind: solve
      equation: "x**6 - 9*x**3 + 8 = 0"
      variable: x
      answer: ["1", "2"]
    answer_text: 'Let $t = x^3$. Then $t^2 - 9t + 8 = 0$, so $(t - 1)(t - 8) = 0$ and $t = 1$ or $t = 8$. Replace $t$: $x^3 = 1$ gives $x = 1$, and $x^3 = 8$ gives $x = 2$. A cube has exactly one real root, so these are the only real solutions.'

  - id: p10-simple-rearrangement
    section: "2.4"
    refs: [B3]
    statement: 'Solve $3x^2 = 12$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "3*x**2 = 12"
      variable: x
      answer: ["-2", "2"]
    answer_text: 'Divide both sides by $3$: $x^2 = 4$. Taking both signs of the square root gives $x = 2$ or $x = -2$. Remember the negative root.'

  - id: p11-completed-square-equation
    section: "2.4"
    refs: [B3]
    statement: 'Solve $(x - 1)^2 = 9$.'
    answer_label: 'The solutions'
    check:
      kind: solve
      equation: "(x - 1)**2 = 9"
      variable: x
      answer: ["-2", "4"]
    answer_text: 'A square equals $9$ when the bracket is $3$ or $-3$. So $x - 1 = 3$ gives $x = 4$, and $x - 1 = -3$ gives $x = -2$. Do not take only the positive square root.'

  - id: p12-extraneous-root
    section: "2.4"
    refs: [B3]
    statement: 'Solve $\sqrt{x + 5} = x - 1$, and explain why one of the values found by squaring is rejected.'
    answer_label: 'The solution'
    check:
      kind: solve
      equation: "sqrt(x + 5) = x - 1"
      variable: x
      answer: ["4"]
    answer_text: 'Square both sides: $x + 5 = x^2 - 2x + 1$, so $x^2 - 3x - 4 = 0$ and $(x - 4)(x + 1) = 0$. The values are $x = 4$ and $x = -1$. Check the original equation: for $x = 4$, $\sqrt{9} = 3$ and $4 - 1 = 3$, so $x = 4$ works. For $x = -1$, $\sqrt{4} = 2$ but $-1 - 1 = -2$, so $x = -1$ fails. It is an extraneous root created by squaring, and the only solution is $x = 4$.'

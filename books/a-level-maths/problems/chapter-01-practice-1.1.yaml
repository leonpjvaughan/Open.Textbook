# Practice set for 1.1, statements, assumptions and the structure of a proof.
# Both the questions and the answers are rendered from these records:
# `:::problems` prints the numbered list, `:::answers` the solutions.
#
# The mathematics here is arithmetic and algebra, which the verifier proves. The
# truth value of a statement and the choice of a proof method are not CAS
# sentences; the answer text states them, and the check proves the arithmetic
# the answer rests on.
chapter: 1
symbols:
  n: {integer: true}
  k: {integer: true}
  x: {real: true}
problems:
  - id: p1-truth-values
    section: "1.1"
    refs: [A1, OT1]
    statement: 'Decide whether each statement is true or false. (a) $2 + 3 = 6$ (b) $12$ is a multiple of $4$ (c) $7 < 3$.'
    answer_label: 'True or false'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "!=", lhs: "2 + 3", rhs: "6"}
        - {kind: compare, relation: "=", lhs: "Mod(12, 4)", rhs: "0"}
        - {kind: compare, relation: ">", lhs: "7", rhs: "3"}
    answer_text: '(a) false, because $2 + 3 = 5$ (b) true, because $12 = 3 \times 4$ (c) false, because $7 > 3$.'

  - id: p2-assumption-conclusion
    section: "1.1"
    refs: [A1, OT1]
    statement: 'A statement says: "If a whole number is a multiple of $6$, then it is a multiple of $3$." (a) Write the assumption. (b) Write the conclusion. (c) Test the statement with the number $42$.'
    answer_label: 'Assumption, conclusion and a test'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "=", lhs: "Mod(42, 6)", rhs: "0"}
        - {kind: compare, relation: "=", lhs: "Mod(42, 3)", rhs: "0"}
    answer_text: 'Assumption: the number is a multiple of $6$. Conclusion: the number is a multiple of $3$. For $42$: $42 = 6 \times 7$, so the assumption holds, and $42 = 3 \times 14$, so the conclusion holds too.'

  - id: p3-converse
    section: "1.1"
    refs: [A1, OT1]
    statement: 'A statement says: "If $n$ is a multiple of $4$, then $n$ is even." (a) Write the converse. (b) Give a value of $n$ that shows the converse is false.'
    answer_label: 'The converse and a counter example'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "=", lhs: "Mod(2, 2)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(2, 4)", rhs: "0"}
    answer_text: '(a) Converse: "If $n$ is even, then $n$ is a multiple of $4$." (b) Take $n = 2$. The number $2$ is even, but $2$ leaves remainder $2$ on division by $4$, so it is not a multiple of $4$.'

  - id: p4-counter-example-inequality
    section: "1.1"
    refs: [A1, OT1]
    statement: 'The statement "For every real number $x$, $x^2 \geq x$" is false. Find a value of $x$ that shows this.'
    answer_label: 'A value of $x$'
    check:
      kind: compare
      relation: "<"
      lhs: "(1 / 2)**2"
      rhs: "1 / 2"
    answer_text: 'Take $x = \frac{1}{2}$. Then $x^2 = \frac{1}{4}$, and $\frac{1}{4} < \frac{1}{2}$, so $x^2 \geq x$ fails.'

  - id: p5-exists
    section: "1.1"
    refs: [A1, OT1]
    statement: 'Show that there is a whole number $n$ for which $n^2 + n + 1$ is a multiple of $3$.'
    answer_label: 'A value of $n$'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "1**2 + 1 + 1", answer: "3"}
        - {kind: compare, relation: "=", lhs: "Mod(3, 3)", rhs: "0"}
    answer_text: 'For $n = 1$, $n^2 + n + 1 = 3$, which is a multiple of $3$. One example is enough, because the statement says "there is".'

  - id: p6-values-of-the-formula
    section: "1.1"
    refs: [A1, OT1]
    statement: 'Work out the value of $n^2 + n + 41$ for $n = 1$, $n = 2$ and $n = 3$.'
    answer_label: 'The three values'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "1**2 + 1 + 41", answer: "43"}
        - {kind: evaluate, expression: "2**2 + 2 + 41", answer: "47"}
        - {kind: evaluate, expression: "3**2 + 3 + 41", answer: "53"}
    answer_text: '(a) $43$ (b) $47$ (c) $53$.'

  - id: p7-prime-or-composite
    section: "1.1"
    refs: [A1, OT1]
    statement: 'Decide whether each number is prime: (a) $9$ (b) $11$.'
    answer_label: 'Prime or composite'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "=", lhs: "Mod(9, 3)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(11, 2)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(11, 3)", rhs: "0"}
    answer_text: '(a) $9 = 3 \times 3$, so $9$ is not prime. (b) $\sqrt{11}$ lies between $3$ and $5$, so the only primes to test are $2$ and $3$. Neither divides $11$, so $11$ is prime.'

  - id: p8-finite-check-is-not-proof
    section: "1.1"
    refs: [A1, OT1]
    statement: 'A student checks $n = 1, 2, 3, 4, 5$ and finds that $n^2 + n + 41$ is prime each time. The student says: "This proves the claim for every whole number $n$." Explain what is wrong with the reasoning.'
    answer_label: 'The flaw in the reasoning'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "1**2 + 1 + 41", answer: "43"}
        - {kind: evaluate, expression: "2**2 + 2 + 41", answer: "47"}
        - {kind: evaluate, expression: "3**2 + 3 + 41", answer: "53"}
        - {kind: evaluate, expression: "4**2 + 4 + 41", answer: "61"}
        - {kind: evaluate, expression: "5**2 + 5 + 41", answer: "71"}
        - {kind: compare, relation: "!=", lhs: "Mod(43, 2)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(43, 3)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(43, 5)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(43, 7)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(47, 2)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(47, 3)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(47, 5)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(47, 7)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(53, 2)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(53, 3)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(53, 5)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(53, 7)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(61, 2)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(61, 3)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(61, 5)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(61, 7)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(71, 2)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(71, 3)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(71, 5)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(71, 7)", rhs: "0"}
    answer_text: 'The five values are prime, so the checking is correct. But the claim is about every whole number, and there are infinitely many. A finite check is evidence, not proof: an untested value might still fail, and one later does. A proof needs a general argument that covers every value at once.'

  - id: p9-multiple-of-six
    section: "1.1"
    refs: [A1, OT1]
    statement: 'A whole number $n$ is a multiple of $6$. Show that $n$ is also a multiple of $3$.'
    answer_label: 'Show the conclusion'
    check:
      kind: evaluate
      expression: "6 * k"
      answer: "3 * (2 * k)"
    answer_text: 'Write $n = 6k$, because $n$ is a multiple of $6$. Then $n = 3 \times (2k)$. The factor $2k$ is a whole number, so $n$ is a multiple of $3$.'

  - id: p10-false-implication
    section: "1.1"
    refs: [A1, OT1]
    statement: 'The statement "If $n$ is a multiple of $3$, then $n$ is a multiple of $9$" is false. Give a value of $n$ that shows this.'
    answer_label: 'A value of $n$'
    check:
      kind: all
      checks:
        - {kind: compare, relation: "=", lhs: "Mod(3, 3)", rhs: "0"}
        - {kind: compare, relation: "!=", lhs: "Mod(3, 9)", rhs: "0"}
    answer_text: 'Take $n = 3$. The number $3$ is a multiple of $3$, but it is not a multiple of $9$. One such value is enough to show the statement is false.'

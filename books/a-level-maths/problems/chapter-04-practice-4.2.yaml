# Practice set for 4.2, the binomial expansion for a rational n.
#
# A truncated expansion is checked as `apply: series`, which takes the Taylor
# series to the stated order and strips the big-O, so the printed polynomial is
# proved coefficient by coefficient. The range of validity is a condition, not a
# value, so it is checked as an `inequality` set and explained in the answer. The
# two approximations are `approx` checks: the test is closeness to the true
# value, not equality, because a truncated series is an estimate.
chapter: 4
symbols:
  x: {real: true}
problems:
  - id: p1-negative-power
    section: "4.2"
    refs: [D1]
    statement: 'Expand $(1 + x)^{-1}$ up to and including the term in $x^3$, and state the range of validity.'
    answer_label: 'The expansion and the range'
    plays: binomial-series
    check:
      kind: apply
      expression: "(1 + x)**(-1)"
      apply: {op: series, args: [x, 0, 4]}
      answer: "1 - x + x**2 - x**3"
    answer_text: 'With $n = -1$, every coefficient $\binom{-1}{r} = (-1)^r$. So $(1 + x)^{-1} = 1 - x + x^2 - x^3 + \dots$, which is valid for $|x| < 1$. The signs alternate, and the series matches the geometric series with first term $1$ and ratio $-x$.'

  - id: p2-negative-power-scaled
    section: "4.2"
    refs: [D1]
    statement: 'Expand $(1 + 3x)^{-1}$ up to and including the term in $x^3$, and state the range of validity.'
    answer_label: 'The expansion and the range'
    plays: binomial-series
    check:
      kind: apply
      expression: "(1 + 3*x)**(-1)"
      apply: {op: series, args: [x, 0, 4]}
      answer: "1 - 3*x + 9*x**2 - 27*x**3"
    answer_text: 'Replace $x$ with $3x$ in the expansion of $(1 + x)^{-1}$: $(1 + 3x)^{-1} = 1 - 3x + 9x^2 - 27x^3 + \dots$. The expansion is valid when $|3x| < 1$, which is $|x| < \frac{1}{3}$. The coefficients are powers of $3$, because each term brings another factor of $3x$.'

  - id: p3-fractional-power-minus-x
    section: "4.2"
    refs: [D1]
    statement: 'Expand $(1 - x)^{\frac{1}{2}}$ up to and including the term in $x^3$.'
    answer_label: 'The expansion'
    plays: binomial-series
    check:
      kind: apply
      expression: "(1 - x)**(1/2)"
      apply: {op: series, args: [x, 0, 4]}
      answer: "1 - x/2 - x**2/8 - x**3/16"
    answer_text: 'Use $n = \frac{1}{2}$ with $-x$ in place of $x$: $(1 - x)^{\frac{1}{2}} = 1 + \frac{1}{2}(-x) - \frac{1}{8}(-x)^2 + \frac{1}{16}(-x)^3 + \dots = 1 - \frac{x}{2} - \frac{x^2}{8} - \frac{x^3}{16} + \dots$, valid for $|x| < 1$. The odd powers stay negative, and the even power $(x)^2$ carries the negative coefficient $-\frac{1}{8}$.'

  - id: p4-take-out-a-to-the-n
    section: "4.2"
    refs: [D1]
    statement: 'Expand $\sqrt{9 + x}$ up to and including the term in $x^3$, and state the range of validity.'
    answer_label: 'The expansion and the range'
    plays: binomial-series
    check:
      kind: apply
      expression: "(9 + x)**(1/2)"
      apply: {op: series, args: [x, 0, 4]}
      answer: "3 + x/6 - x**2/216 + x**3/3888"
    answer_text: 'Take out the factor $9^{\frac{1}{2}} = 3$: $\sqrt{9 + x} = 3\left(1 + \frac{x}{9}\right)^{\frac{1}{2}} = 3\left[1 + \frac{x}{18} - \frac{x^2}{648} + \frac{x^3}{11664} + \dots\right] = 3 + \frac{x}{6} - \frac{x^2}{216} + \frac{x^3}{3888} + \dots$. The expansion is valid when $\left|\frac{x}{9}\right| < 1$, which is $|x| < 9$. The factor $3$ is why the answer starts at $3$, not $1$.'

  - id: p5-negative-fractional-power
    section: "4.2"
    refs: [D1]
    statement: 'Find the first three terms, up to $x^2$, in the expansion of $\dfrac{1}{\sqrt{1 + 4x}}$.'
    answer_label: 'The first three terms'
    plays: binomial-series
    check:
      kind: apply
      expression: "(1 + 4*x)**(-1/2)"
      apply: {op: series, args: [x, 0, 3]}
      answer: "1 - 2*x + 6*x**2"
    answer_text: 'Write the expression as $(1 + 4x)^{-\frac{1}{2}}$, so $n = -\frac{1}{2}$. The coefficients are $\binom{-\frac{1}{2}}{1} = -\frac{1}{2}$ and $\binom{-\frac{1}{2}}{2} = \frac{3}{8}$. So $(1 + 4x)^{-\frac{1}{2}} = 1 - \frac{1}{2}(4x) + \frac{3}{8}(4x)^2 + \dots = 1 - 2x + 6x^2 + \dots$ for $|x| < \frac{1}{4}$. The range is $|4x| < 1$.'

  - id: p6-negative-integer-power
    section: "4.2"
    refs: [D1]
    statement: 'Expand $(1 + x)^{-3}$ up to and including the term in $x^3$.'
    answer_label: 'The expansion'
    plays: binomial-series
    check:
      kind: apply
      expression: "(1 + x)**(-3)"
      apply: {op: series, args: [x, 0, 4]}
      answer: "1 - 3*x + 6*x**2 - 10*x**3"
    answer_text: 'With $n = -3$: $\binom{-3}{1} = -3$, $\binom{-3}{2} = \frac{(-3)(-4)}{2} = 6$, and $\binom{-3}{3} = \frac{(-3)(-4)(-5)}{6} = -10$. So $(1 + x)^{-3} = 1 - 3x + 6x^2 - 10x^3 + \dots$ for $|x| < 1$. The coefficients grow in size, because each new factor on the top is negative and larger than the one before.'

  - id: p7-surd-answer
    section: "4.2"
    refs: [D1]
    statement: 'Find the first three terms, up to $x^2$, in the expansion of $(2 + 3x)^{\frac{1}{2}}$. Give the answer with exact surds.'
    answer_label: 'The first three terms'
    plays: binomial-series
    check:
      kind: apply
      expression: "(2 + 3*x)**(1/2)"
      apply: {op: series, args: [x, 0, 3]}
      answer: "sqrt(2) + 3*sqrt(2)*x/4 - 9*sqrt(2)*x**2/32"
    answer_text: 'Take out the factor $2^{\frac{1}{2}} = \sqrt{2}$: $(2 + 3x)^{\frac{1}{2}} = \sqrt{2}\left(1 + \frac{3x}{2}\right)^{\frac{1}{2}} = \sqrt{2}\left[1 + \frac{3x}{4} - \frac{9x^2}{32} + \dots\right]$. So the first three terms are $\sqrt{2} + \frac{3\sqrt{2}}{4}x - \frac{9\sqrt{2}}{32}x^2$. The expansion is valid when $\left|\frac{3x}{2}\right| < 1$, which is $|x| < \frac{2}{3}$. Each coefficient carries the factor $\sqrt{2}$.'

  - id: p8-coefficient-of-a-term
    section: "4.2"
    refs: [D1]
    statement: 'Find the coefficient of $x^2$ in the expansion of $(1 - 2x)^{\frac{1}{2}}$.'
    answer_label: 'The coefficient'
    check:
      kind: evaluate
      expression: "binomial(1/2, 2)*(-2)**2"
      answer: "-1/2"
    answer_text: 'The term is $\binom{\frac{1}{2}}{2}(-2x)^2 = -\frac{1}{8} \times 4x^2 = -\frac{1}{2}x^2$. The coefficient of $x^2$ is $-\frac{1}{2}$. The minus sign comes from the coefficient, not from the bracket, because the square $(-2x)^2$ is positive.'

  - id: p9-approximate-a-root
    section: "4.2"
    refs: [D1]
    statement: 'Use the first three terms of the expansion of $(1 + x)^{\frac{1}{2}}$ to estimate $\sqrt{1.02}$.'
    answer_label: 'The estimate'
    check:
      kind: approx
      value: "1 + 1/2*(1/50) - 1/8*(1/50)**2"
      target: "sqrt(1.02)"
      tolerance: "1/100000"
    answer_text: 'Write $1.02 = 1 + 0.02$, so $x = 0.02$. The first three terms are $1 + \frac{1}{2}x - \frac{1}{8}x^2 = 1 + 0.01 - 0.00005 = 1.00995$. The estimate is within $5 \times 10^{-7}$ of the true value, which the check confirms against a tolerance of $10^{-5}$. The term in $x^3$ is smaller than the rounding, which is why three terms are enough.'

  - id: p10-approximate-a-reciprocal-root
    section: "4.2"
    refs: [D1]
    statement: 'Use the first three terms of the expansion of $(1 + x)^{-\frac{1}{2}}$ to estimate $\dfrac{1}{\sqrt{1.02}}$.'
    answer_label: 'The estimate'
    check:
      kind: approx
      value: "1 - 1/2*(1/50) + 3/8*(1/50)**2"
      target: "1/sqrt(1.02)"
      tolerance: "1/100000"
    answer_text: 'With $n = -\frac{1}{2}$ and $x = 0.02$: the first three terms are $1 - \frac{1}{2}x + \frac{3}{8}x^2 = 1 - 0.01 + 0.00015 = 0.99015$. The true value is $0.9901475\dots$, so the estimate is within $3 \times 10^{-6}$ of it. The coefficient $\frac{3}{8}$ is $\binom{-\frac{1}{2}}{2}$.'

  - id: p11-range-of-validity
    section: "4.2"
    refs: [D1]
    statement: 'State the range of $x$ for which the expansion of $(1 + 7x)^{-1}$ is valid. Give the answer as an inequality.'
    answer_label: 'The range'
    check:
      kind: inequality
      variable: x
      inequality: "-1 < 7*x < 1"
      answer: "Interval.open(-1/7, 1/7)"
    answer_text: 'The general expansion is valid when the size of the replaced variable is less than $1$. Here the replacement is $7x$, so the condition is $|7x| < 1$. Dividing by $7$ gives $|x| < \frac{1}{7}$, which is $-\frac{1}{7} < x < \frac{1}{7}$. At the endpoints the series does not settle, which is why the interval is open.'

  - id: p12-first-two-terms
    section: "4.2"
    refs: [D1]
    statement: 'Show that the first two terms in the expansion of $\sqrt{4 + 2x}$ are $2 + \frac{x}{2}$.'
    answer_label: 'The first two terms'
    plays: binomial-series
    check:
      kind: apply
      expression: "(4 + 2*x)**(1/2)"
      apply: {op: series, args: [x, 0, 2]}
      answer: "2 + x/2"
    answer_text: 'Take out the factor $4^{\frac{1}{2}} = 2$: $\sqrt{4 + 2x} = 2\left(1 + \frac{x}{2}\right)^{\frac{1}{2}}$. The first two terms of the bracket are $1 + \frac{1}{2} \times \frac{x}{2} = 1 + \frac{x}{4}$. Multiplying by $2$ gives $2 + \frac{x}{2}$, as required. The expansion is valid when $\left|\frac{x}{2}\right| < 1$, which is $|x| < 2$.'

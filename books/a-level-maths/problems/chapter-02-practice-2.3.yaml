# Practice set for 2.3, quadratic functions, the discriminant and completing the
# square.
#
# Completing the square is an identity, so the verifier proves it by equivalence.
# The discriminant is a sign, so it is a `compare`. The vertex and the minimum
# value are values of the completed-square form, so they are `evaluate` checks.
chapter: 2
symbols:
  x: {real: true}
  k: {real: true}
problems:
  - id: p1-complete-monic
    section: "2.3"
    refs: [B3]
    statement: 'Write $x^2 + 6x + 2$ in the form $(x + a)^2 + b$.'
    answer_label: 'Completed square'
    check:
      kind: evaluate
      expression: "x**2 + 6*x + 2"
      answer: "(x + 3)**2 - 7"
    answer_text: 'Half of $6$ is $3$, and $\left(x + 3\right)^2 = x^2 + 6x + 9$. So $x^2 + 6x + 2 = \left(x + 3\right)^2 - 7$: the $+9$ is removed by subtracting $7$.'

  - id: p2-complete-non-monic
    section: "2.3"
    refs: [B3]
    statement: 'Write $2x^2 - 8x + 5$ in the form $a(x + p)^2 + q$.'
    answer_label: 'Completed square'
    check:
      kind: evaluate
      expression: "2*x**2 - 8*x + 5"
      answer: "2*(x - 2)**2 - 3"
    answer_text: 'Take out the factor $2$ from the first two terms: $2\left(x^2 - 4x\right) + 5$. Complete the square inside the bracket: $x^2 - 4x = \left(x - 2\right)^2 - 4$. So $2\left(x^2 - 4x\right) + 5 = 2\left(x - 2\right)^2 - 8 + 5 = 2\left(x - 2\right)^2 - 3$.'

  - id: p3-minimum-value
    section: "2.3"
    refs: [B3]
    statement: 'Complete the square for $x^2 - 10x + 3$, and state the minimum value of the expression.'
    answer_label: 'The completed square and the minimum'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "x**2 - 10*x + 3", answer: "(x - 5)**2 - 22"}
        - {kind: evaluate, expression: "(5 - 5)**2 - 22", answer: "-22"}
    answer_text: '$x^2 - 10x + 3 = \left(x - 5\right)^2 - 22$. A square is never negative, so the smallest value occurs when $\left(x - 5\right)^2 = 0$, at $x = 5$. The minimum value is $-22$.'

  - id: p4-discriminant-negative
    section: "2.3"
    refs: [B3]
    statement: 'Work out the discriminant of $3x^2 + 2x + 5$ and use it to state how many real roots the equation $3x^2 + 2x + 5 = 0$ has.'
    answer_label: 'The discriminant and the number of roots'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "2**2 - 4*3*5", answer: "-56"}
        - {kind: compare, relation: "<", lhs: "2**2 - 4*3*5", rhs: "0"}
    answer_text: 'The discriminant is $b^2 - 4ac = 2^2 - 4 \times 3 \times 5 = 4 - 60 = -56$. It is negative, so the equation has no real roots.'

  - id: p5-discriminant-zero
    section: "2.3"
    refs: [B3]
    statement: 'Show that $x^2 - 4x + 4 = 0$ has a repeated root, and find it.'
    answer_label: 'The discriminant and the root'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(-4)**2 - 4*1*4", answer: "0"}
        - {kind: solve, equation: "x**2 - 4*x + 4 = 0", variable: x, answer: ["2"]}
    answer_text: 'The discriminant is $(-4)^2 - 4 \times 1 \times 4 = 16 - 16 = 0$, so there is exactly one repeated real root. Factorising gives $\left(x - 2\right)^2 = 0$, so the repeated root is $x = 2$.'

  - id: p6-discriminant-positive
    section: "2.3"
    refs: [B3]
    statement: 'Work out the discriminant of $x^2 - 5x + 6$ and state how many real roots the equation has.'
    answer_label: 'The discriminant and the number of roots'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(-5)**2 - 4*1*6", answer: "1"}
        - {kind: compare, relation: ">", lhs: "(-5)**2 - 4*1*6", rhs: "0"}
    answer_text: 'The discriminant is $(-5)^2 - 4 \times 1 \times 6 = 25 - 24 = 1$. It is positive, so there are two distinct real roots. They are $x = 2$ and $x = 3$, since $x^2 - 5x + 6 = \left(x - 2\right)\left(x - 3\right)$.'

  - id: p7-vertex
    section: "2.3"
    refs: [B3]
    statement: 'Find the coordinates of the vertex of $y = x^2 - 6x + 5$.'
    answer_label: 'The vertex'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "x**2 - 6*x + 5", answer: "(x - 3)**2 - 4"}
        - {kind: evaluate, expression: "(3)**2 - 6*3 + 5", answer: "-4"}
    answer_text: 'Complete the square: $x^2 - 6x + 5 = \left(x - 3\right)^2 - 4$. The square is smallest when $x = 3$, where it is $0$. Substituting $x = 3$ gives $y = -4$, so the vertex is at $(3, -4)$ and the curve opens upwards.'

  - id: p8-always-positive
    section: "2.3"
    refs: [B3]
    statement: 'Show that $x^2 + 4x + 7$ is positive for every value of $x$, and state its minimum value.'
    answer_label: 'The completed square and the minimum'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "x**2 + 4*x + 7", answer: "(x + 2)**2 + 3"}
        - {kind: evaluate, expression: "(-2 + 2)**2 + 3", answer: "3"}
        - {kind: compare, relation: ">", lhs: "3", rhs: "0"}
    answer_text: '$x^2 + 4x + 7 = \left(x + 2\right)^2 + 3$. A square is never negative, so the expression is at least $3$. Since $3 > 0$, the expression is positive for every $x$, and its minimum value is $3$ at $x = -2$.'

  - id: p9-factorise
    section: "2.3"
    refs: [B3]
    statement: 'Factorise $x^2 - 7x + 12$.'
    answer_label: 'Factorised'
    check:
      kind: evaluate
      expression: "x**2 - 7*x + 12"
      answer: "(x - 3)*(x - 4)"
    answer_text: 'Look for two numbers that multiply to $12$ and add to $-7$. The numbers are $-3$ and $-4$, so $x^2 - 7x + 12 = \left(x - 3\right)\left(x - 4\right)$.'

  - id: p10-repeated-root-k
    section: "2.3"
    refs: [B3]
    statement: 'The equation $x^2 + kx + 9 = 0$ has a repeated root. Find the possible values of $k$.'
    answer_label: 'The values of $k$'
    check:
      kind: solve
      equation: "k**2 - 36 = 0"
      variable: k
      answer: ["-6", "6"]
    answer_text: 'A repeated root needs a discriminant of zero: $k^2 - 4 \times 1 \times 9 = 0$, so $k^2 = 36$ and $k = 6$ or $k = -6$. Both values give $\left(x \pm 3\right)^2 = 0$.'

  - id: p11-no-real-roots
    section: "2.3"
    refs: [B3]
    statement: 'Show that the equation $2x^2 - 4x + 5 = 0$ has no real roots.'
    answer_label: 'The discriminant and the conclusion'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "(-4)**2 - 4*2*5", answer: "-24"}
        - {kind: compare, relation: "<", lhs: "(-4)**2 - 4*2*5", rhs: "0"}
    answer_text: 'The discriminant is $(-4)^2 - 4 \times 2 \times 5 = 16 - 40 = -24$. It is negative, and a negative discriminant means no real roots. Completing the square also shows this: $2x^2 - 4x + 5 = 2\left(x - 1\right)^2 + 3$, which is always at least $3$.'

  - id: p12-method-choice
    section: "2.3"
    refs: [B3]
    statement: 'For $y = x^2 - 2x - 3$, say which feature you would find each way. (a) the roots (b) the vertex.'
    answer_label: 'Which method, and why'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "x**2 - 2*x - 3", answer: "(x - 1)**2 - 4"}
        - {kind: solve, equation: "x**2 - 2*x - 3 = 0", variable: x, answer: ["-1", "3"]}
        - {kind: evaluate, expression: "(1)**2 - 2*1 - 3", answer: "-4"}
    answer_text: '(a) For the roots, factorise or use the formula: $x^2 - 2x - 3 = \left(x - 3\right)\left(x + 1\right)$, so the roots are $x = 3$ and $x = -1$. (b) For the vertex, complete the square: $x^2 - 2x - 3 = \left(x - 1\right)^2 - 4$, so the vertex is at $(1, -4)$. Factorising reads the roots straight off; completing the square reads the vertex straight off.'

# Identity and build metadata for this book.
#
# Everything a build needs that is not the content itself. The scaffold reads
# this to generate the docs tree and the book's tint; the portal reads it to build the landing
# page card; the hooks read the paths through the build's config.

id: a-level-maths
title: A-level Mathematics
qualification: A-level
subject: Mathematics
order: 2
description: >-
  A complete, interactive A-level Mathematics book for England, covering pure
  mathematics, statistics and mechanics.

boards: [AQA, Pearson Edexcel, OCR]

# One build per profile. A-level has no tiers, so there is no Foundation/Higher
# pair and no tier axis: the single profile keeps every page, and says so with
# `tier_filter: all`. It is declared as a profile anyway, because the pipeline, the
# portal and the build matrix are all driven by `profiles`, and a book with none is
# not a book they can build.
profiles:
  - id: a-level
    name: A level
    default: true
    # No tier axis in this book, so every page ships. Declared rather than left
    # to default to the profile id, which worked only because an unrecognised
    # filter happens to keep everything.
    tier_filter: all

# The tier axis for this book, for documentation and for the scaffold's stubs.
#
# Empty, and deliberately so: A-level Mathematics has no Foundation/Higher
# distinction, so there is no F/H to label. Its sections carry no `tier`, every
# page belongs to every reader, and the tier hook passes the build through
# untouched. Compare the GCSE books, where this maps F and H to their
# reader-facing labels.
tier_axis: {}

# Verification oracles the banks in this book may use.
oracles: [sympy]

# This book's own theme, one variation per colour scheme. Set only what makes
# this book itself; everything else stays the house default in
# assets/stylesheets/extra.css. `accent` also tints the book's landing-page card
# in both schemes. Themable tokens: accent, accent_light, accent_dark,
# accent_ink, paper, ink, ink_soft, rule, link, code_bg, fig_warn, fig_good, fig_grid.
#
# A violet, chosen to sit clear of GCSE Mathematics' blue so the two cards are
# tellable apart. Measured against every bundle in both schemes; see
# `contrast_problems` in engine/textbook/themes.py.
theme:
  light:
    accent: "#633399"
    accent_light: "#7b52b0"
    accent_dark: "#4d2878"
  dark:
    accent: "#b594db"
    accent_light: "#cbb3ea"
    accent_dark: "#9371c4"

# Paths, relative to this directory.
curriculum: curriculum.yaml
banks: problems
sources: sources.yaml

# The awarding bodies' own exam-room formulae documents were retrieved on
# 2026-10-12 and are recorded in sources.yaml. AQA and Pearson Edexcel each
# give out a booklet and OCR prints its formulae sheet in every question paper,
# so the three provisions differ; `booklet/a-level-maths.yaml` is the source of
# truth for what each board gives and what the DfE Appendix B requires students
# to recall. Declaring the booklet is what ships the widget; see BOOKLETS.md.
booklet: booklet/a-level-maths.yaml

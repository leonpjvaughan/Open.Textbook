# Numerical Methods — the map.
#
# `books/numerical-methods/AGENTS.md` is the contract for this book. The short
# version, because it is unlike every course in the collection:
#
#   * It has **no chapters**. It declares `chapters: []` and lists its pages under
#     `pages:` below, which is what the navigation and the landing page read. The
#     scaffold therefore generates no stub pages and no Review, and every page
#     under `docs/` is authored.
#   * The order of `pages:` **is** the reading order, and it is the order of the
#     decision tree: the four things a reader might want, then steady problems,
#     then moving ones.
#   * A page is a **class of problem**, entered by symptom. It is not a lesson and
#     it has no exercises.
#
# `techniques` and `symptoms` are the two indexes that make the book a lookup
# rather than a set of essays: one goes method → class, the other goes wrong
# answer → class → cause.

meta:
  title: Numerical Methods
  # No `jurisdiction`: this book follows no country's documents. The About page
  # asks for one only when a book has not said what it is, and this one says it.
  # No `syllabus`, because there is none.
  what_it_is: >-
    This is a map of problems. You arrive with a system you have modelled and find
    the kind of problem that model became. You leave with the techniques that solve
    it, and with the ones that look like they should but do not. The classes are not
    chapters to work through. They are boxes to look things up in, and one system
    often belongs in more than one.
  level_word: level
  retrieved: 2026-10-18

# Where a reader can go, in the order the decision tree reaches them. The first
# four are the answers to "what do you want?"; the rest are "what has the model
# become?" once the answer is "the state that obeys the rules".
#
# `signature` is the one line a `:::class <slug>` directive prints under the link,
# and an entry without one is not linkable as a class — which is why the two
# indexes have none. That is deliberate: the directive exists to say what kind of
# problem a page is talking about, and "see also the methods index" is not a kind.
#
# **One sentence, two places, and it is written here first.** The class page prints
# the same string verbatim after "You have one of these when", so it is stored in the
# form that reads there — lowercase initial — and the directive capitalises it for its
# own note (`hooks/classes.py`). Before this the nine sentences existed in eighteen
# wordings, and two of them disagreed about the class: the registry said a root's rule
# "bends with the answer" and the page did not. A test now holds the page to the
# registry, so the next edit has to make both.
pages:
  - title: Optimisation
    path: optimisation/index.md
    signature: you can score any candidate answer with a single number, and you want the best one.
  - title: Averaging
    path: averaging/index.md
    signature: the answer is not a number but a distribution, or an average over possibilities you cannot list.
  - title: Eigenvalues
    path: eigenvalue/index.md
    signature: you ask which values are allowed — which frequencies, which loads, which energies — rather than what any one of them is.
  - title: Linear system
    path: linear-system/index.md
    signature: every rule in the model is linear in the unknowns, the unknowns are a finite list, and nothing changes with time.
  - title: Root finding
    path: root/index.md
    signature: a rule has to hold at a point, the rule bends with the answer, and nothing changes with time.
  - title: Saddle point
    path: saddle-point/index.md
    signature: a rule has to hold everywhere, and the model pays for it with a second unknown.
  - title: Elliptic
    path: elliptic/index.md
    signature: the answer is a value at every point in a region, and nothing travels.
  - title: Parabolic
    path: parabolic/index.md
    signature: the answer moves forward in time and smooths as it goes, so it forgets where it started.
  - title: Hyperbolic
    path: hyperbolic/index.md
    signature: information travels at a finite speed along paths, and what arrives keeps the shape of what was sent.

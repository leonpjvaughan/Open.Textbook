      kind: all
      checks:
        - kind: dimensions
          expression: "c / f"
          values:
            c: {value: "3.0e8", unit: "m/s"}
            f: {value: "150", unit: "MHz"}
          answer: {value: "2.0", unit: "m"}
        - {kind: sigfigs, value: "2.0", figures: 2, answer: "2.0", convention: round-once}
    answer_text: '$\lambda = \dfrac{c}{f} = \dfrac{3.0 \times 10^8}{1.5 \times 10^8} = 2.0\,\text{m}$.'

  - id: anchor-infrared-frequency
    section: '5.1'
    tier: F
    dfe: [WA3]
    statement: 'The observatory infrared camera detects radiation with a wavelength of 10 μm. Calculate its frequency.'
    answer_label: 'Frequency of the infrared radiation'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "c / lam"
          values:
            c: {value: "3.0e8", unit: "m/s"}
            lam: {value: "10", unit: "μm"}
          answer: {value: "3.0e13", unit: "Hz"}
        - {kind: sigfigs, value: "3.0e13", figures: 2, answer: "3.0e13", convention: round-once}
    answer_text: '$f = \dfrac{c}{\lambda} = \dfrac{3.0 \times 10^8}{1.0 \times 10^{-5}} = 3.0 \times 10^{13}\,\text{Hz}$.'

  - id: anchor-visible-frequency
    section: '5.1'
    tier: F
    dfe: [WA3]
    statement: 'A visible-light image at the observatory uses light with a wavelength of 600 nm. Calculate its frequency.'
    answer_label: 'Frequency of the visible light'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "c / lam"
          values:
            c: {value: "3.0e8", unit: "m/s"}
            lam: {value: "600", unit: "nm"}
          answer: {value: "5.0e14", unit: "Hz"}
        - {kind: sigfigs, value: "5.0e14", figures: 2, answer: "5.0e14", convention: round-once}
    answer_text: '$f = \dfrac{c}{\lambda} = \dfrac{3.0 \times 10^8}{6.0 \times 10^{-7}} = 5.0 \times 10^{14}\,\text{Hz}$.'

  - id: anchor-magnification
    section: '5.3'
    tier: F
    dfe: [WA5]
    statement: 'The visitor centre lens projects a picture 2.0 cm tall so that its image on the wall is 0.30 m tall. Calculate the magnification.'
    answer_label: 'Magnification of the projected picture'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "30 / 2.0", answer: "15"}
        - {kind: sigfigs, value: "15", figures: 2, answer: "15", convention: round-once}
    answer_text: 'magnification $= \dfrac{30\,\text{cm}}{2.0\,\text{cm}} = 15$.'

  - id: anchor-spectrum-order
    section: '5.1'
    tier: F
    dfe: [WA3]
    statement: 'Place the radio signal, the infrared radiation and the visible light from the chapter problem in order of increasing frequency. Explain your answer.'
    answer_label: 'The order of increasing frequency'
    check:
      kind: structured
      requires: [state-order, give-reason]
      concepts: [frequency, wavelength]
      points:
        - id: state-order
          text: 'Radio, then infrared, then visible light.'
          concepts: [frequency]
        - id: give-reason
          text: 'All three travel at the same speed, so the longer the wavelength the lower the frequency. The radio wavelength of 2.0 m is the longest, then the infrared at 10 μm, then the visible light at 600 nm.'
          concepts: [wavelength]

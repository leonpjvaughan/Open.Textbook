    dfe: [FO6]
    statement: 'A ball of mass 0.15 kg moves at 20 m/s. Calculate its momentum.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m * v"
          values:
            m: {value: "0.15", unit: "kg"}
            v: {value: "20", unit: "m/s"}
          answer: {value: "3.0", unit: "kg m/s"}
        - {kind: sigfigs, value: "3", figures: 2, answer: "3.0", convention: round-once}
    answer_text: '$3.0\,\text{kg m/s}$'

  - id: g15-momentum-lorry
    section: '3.4'
    tier: H
    dfe: [FO6]
    statement: 'A lorry of mass 8000 kg travels at 25 m/s. Calculate its momentum.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m * v"
          values:
            m: {value: "8000", unit: "kg"}
            v: {value: "25", unit: "m/s"}
          answer: {value: "200000", unit: "kg m/s"}
        - {kind: sigfigs, value: "200000", figures: 2, answer: "2.0e5", convention: round-once}
    answer_text: '$2.0 \times 10^5\,\text{kg m/s}$'

  - id: g16-conservation-trolley
    section: '3.4'
    tier: H
    dfe: [FO6]
    statement: 'A trolley of mass 2.0 kg moves at 3.0 m/s and hits a stationary trolley of mass 1.0 kg. The two stick together. Calculate their common velocity.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m1 * v1 / (m1 + m2)"
          values:
            m1: {value: "2.0", unit: "kg"}
            v1: {value: "3.0", unit: "m/s"}
            m2: {value: "1.0", unit: "kg"}
          answer: {value: "2.0", unit: "m/s"}
        - {kind: sigfigs, value: "2", figures: 2, answer: "2.0", convention: round-once}
    answer_text: '$2.0\,\text{m/s}$'

  - id: g17-force-momentum
    section: '3.4'
    tier: H
    dfe: [FO6]
    statement: 'A car of mass 1000 kg travels at 20 m/s and stops in 0.25 s. Calculate the force.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m * v / t"
          values:
            m: {value: "1000", unit: "kg"}
            v: {value: "20", unit: "m/s"}
            t: {value: "0.25", unit: "s"}
          answer: {value: "80000", unit: "N"}
        - {kind: sigfigs, value: "80000", figures: 2, answer: "8.0e4", convention: round-once}
    answer_text: '$8.0 \times 10^4\,\text{N}$'

  - id: g18-skater-recoil
    section: '3.4'
    tier: H
    dfe: [FO6]
    statement: 'Two skaters push apart. The skater of mass 50 kg moves at 1.2 m/s. Calculate the speed of the skater of mass 75 kg.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m1 * v1 / m2"
          values:
            m1: {value: "50", unit: "kg"}
            v1: {value: "1.2", unit: "m/s"}
            m2: {value: "75", unit: "kg"}
          answer: {value: "0.80", unit: "m/s"}
        - {kind: sigfigs, value: "0.8", figures: 2, answer: "0.80", convention: round-once}
    answer_text: '$0.80\,\text{m/s}$'

  # --- The warm-up recalls ----------------------------------------------------
  - id: warmup-3-1-resultant
    section: '3.1'
    tier: F
    dfe: [FO1]
    statement: 'Warm-up: two forces act on a trolley, 45 N forwards and 20 N backwards. Calculate the resultant force.'
    check: {kind: evaluate, expression: "45 - 20", answer: "25"}
    answer_text: '$25\,\text{N}$ forwards'

  - id: warmup-3-1-kinetic
    section: '3.1'
    tier: F
    dfe: [EN1]
    statement: 'Warm-up: calculate the energy in the kinetic store of a 3.0 kg object moving at 4.0 m/s.'
    check: {kind: evaluate, expression: "0.5 * 3.0 * 4.0**2", answer: "24"}
    answer_text: '$24\,\text{J}$'

  - id: warmup-3-2-acceleration
    section: '3.2'
    tier: F
    dfe: [FO5]
    statement: 'Warm-up: a bus speeds up from 10 m/s to 16 m/s in 3.0 s. Calculate its acceleration.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "(v - u) / t"
          values:
            u: {value: "10", unit: "m/s"}
            v: {value: "16", unit: "m/s"}
            t: {value: "3.0", unit: "s"}
          answer: {value: "2.0", unit: "m/s^2"}
        - {kind: sigfigs, value: "2", figures: 2, answer: "2.0", convention: round-once}
    answer_text: '$2.0\,\text{m/s}^2$'

  - id: warmup-3-2-spring
    section: '3.2'
    tier: F
    dfe: [FO1]
    statement: 'Warm-up: a force of 30 N stretches a spring by 0.15 m. Calculate the spring constant.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F / e"
          values:
            F: {value: "30", unit: "N"}
            e: {value: "0.15", unit: "m"}
          answer: {value: "200", unit: "N/m"}
        - {kind: sigfigs, value: "200", figures: 2, answer: "2.0e2", convention: round-once}
    answer_text: '$2.0 \times 10^2\,\text{N/m}$'

  - id: warmup-3-3-force
    section: '3.3'
    tier: F
    dfe: [FO6]
    statement: 'Warm-up: a car of mass 800 kg accelerates at 2.5 m/s squared. Calculate the resultant force.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m * a"
          values:
            m: {value: "800", unit: "kg"}
            a: {value: "2.5", unit: "m/s^2"}
          answer: {value: "2000", unit: "N"}
        - {kind: sigfigs, value: "2000", figures: 2, answer: "2.0e3", convention: round-once}
    answer_text: '$2.0 \times 10^3\,\text{N}$'

  - id: warmup-3-3-speed
    section: '3.3'
    tier: F
    dfe: [FO5]
    statement: 'Warm-up: a cyclist travels 150 m in 20 s. Calculate her average speed.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "s / t"
          values:
            s: {value: "150", unit: "m"}
            t: {value: "20", unit: "s"}
          answer: {value: "7.5", unit: "m/s"}
        - {kind: sigfigs, value: "7.5", figures: 2, answer: "7.5", convention: round-once}
    answer_text: '$7.5\,\text{m/s}$'

  - id: warmup-3-4-force
    section: '3.4'
    tier: H
    dfe: [FO6]
    statement: 'Warm-up: a resultant force of 500 N acts on a mass of 200 kg. Calculate the acceleration.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F / m"
          values:
            F: {value: "500", unit: "N"}
            m: {value: "200", unit: "kg"}
          answer: {value: "2.5", unit: "m/s^2"}
        - {kind: sigfigs, value: "2.5", figures: 2, answer: "2.5", convention: round-once}
    answer_text: '$2.5\,\text{m/s}^2$'

  - id: warmup-3-4-acceleration
    section: '3.4'
    tier: H
    dfe: [FO5]
    statement: 'Warm-up: a car slows from 20 m/s to 5.0 m/s in 3.0 s. Calculate its acceleration.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "(v - u) / t"
          values:
            u: {value: "20", unit: "m/s"}
            v: {value: "5.0", unit: "m/s"}
            t: {value: "3.0", unit: "s"}
          answer: {value: "-5.0", unit: "m/s^2"}
        - {kind: sigfigs, value: "-5", figures: 2, answer: "-5.0", convention: round-once}
    answer_text: '$-5.0\,\text{m/s}^2$, so the deceleration is $5.0\,\text{m/s}^2$.'

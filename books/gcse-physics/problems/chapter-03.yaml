# Worked solutions for Chapter 3 (Forces and motion).
#
# These are the numerical worked examples, the guided calculations and the
# warm-up recalls that the Learn and Practise with help pages show. The pages
# carry the prose and the reasoning; this bank is the independent check of every
# number in them, so a slip in a worked example cannot ship. The records are not
# rendered by a page marker: the pages write their own working, and the
# `:::answers` blocks come from the practice banks.
#
# Each calculation proves the exact magnitude and dimension with `dimensions`
# (or `evaluate` where the check cannot carry a unit) and the one rounding with
# `sigfigs`. A value read from a motion graph is a measurement, so it is proved
# against a declared closed interval by `gradient` or `area`.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): this proves the
# arithmetic and the dimensions, not the physics.
chapter: 3
problems:
  # --- Section 3.1, the Learn worked examples ---------------------------------
  - id: w1-speed-cyclist
    section: '3.1'
    tier: F
    dfe: [FO5]
    statement: 'A cyclist travels 90 m in 15 s. Calculate her average speed.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "s / t"
          values:
            s: {value: "90", unit: "m"}
            t: {value: "15", unit: "s"}
          answer: {value: "6.0", unit: "m/s"}
        - {kind: sigfigs, value: "6", figures: 2, answer: "6.0", convention: round-once}
    answer_text: '$6.0\,\text{m/s}$'

  - id: w2-distance-car
    section: '3.1'
    tier: F
    dfe: [FO5]
    statement: 'A car travels at a steady 24 m/s for 5.0 s. Calculate the distance.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v * t"
          values:
            v: {value: "24", unit: "m/s"}
            t: {value: "5.0", unit: "s"}
          answer: {value: "120", unit: "m"}
        - {kind: sigfigs, value: "120", figures: 2, answer: "1.2e2", convention: round-once}
    answer_text: '$1.2 \times 10^2\,\text{m}$'

  - id: w3-distance-time-gradient
    section: '3.1'
    tier: F
    dfe: [FO5]
    statement: 'A distance-time graph is a straight line through (0 s, 0 m), (4.0 s, 32 m) and (8.0 s, 64 m). Find the speed from the gradient.'
    check:
      kind: gradient
      series: [[0, 0], [4, 32], [8, 64]]
      between: [7.9, 8.1]
    answer_text: '$8.0\,\text{m/s}$'

  - id: w4-acceleration-bus
    section: '3.1'
    tier: F
    dfe: [FO5]
    statement: 'A bus speeds up from rest to 9.0 m/s in 6.0 s. Calculate its acceleration.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v / t"
          values:
            v: {value: "9.0", unit: "m/s"}
            t: {value: "6.0", unit: "s"}
          answer: {value: "1.5", unit: "m/s^2"}
        - {kind: sigfigs, value: "1.5", figures: 2, answer: "1.5", convention: round-once}
    answer_text: '$1.5\,\text{m/s}^2$'

  - id: w5-velocity-time-gradient
    section: '3.1'
    tier: F
    dfe: [FO5]
    statement: 'A velocity-time graph is a straight line through (0 s, 0 m/s), (5.0 s, 15 m/s) and (10 s, 30 m/s). Find the acceleration from the gradient.'
    check:
      kind: gradient
      series: [[0, 0], [5, 15], [10, 30]]
      between: [2.9, 3.1]
    answer_text: '$3.0\,\text{m/s}^2$'

  - id: w6-braking-distance
    section: '3.1'
    tier: F
    dfe: [FO5]
    statement: 'A car travels at 20 m/s and brakes with a steady deceleration of 4.0 m/s squared until it stops. Calculate the braking distance.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "u**2 / (2 * a)"
          values:
            u: {value: "20", unit: "m/s"}
            a: {value: "4.0", unit: "m/s^2"}
          answer: {value: "50", unit: "m"}
        - {kind: sigfigs, value: "50", figures: 2, answer: "5.0e1", convention: round-once}
    answer_text: '$5.0 \times 10^1\,\text{m}$'

  - id: w7-tangent
    section: '3.1'
    tier: H
    dfe: [FO5]
    statement: 'The tangent to a curved distance-time graph at 4.0 s passes through (2.0 s, 10 m) and (6.0 s, 30 m). Find the speed at 4.0 s.'
    check:
      kind: gradient
      series: [[2, 10], [6, 30]]
      between: [4.9, 5.1]
    answer_text: '$5.0\,\text{m/s}$'

  - id: w8-area-under-graph
    section: '3.1'
    tier: H
    dfe: [FO5]
    statement: 'A velocity-time graph rises in a straight line from 0 m/s at 0 s to 12 m/s at 6.0 s. Find the distance from the area under the graph.'
    check:
      kind: area
      series: [[0, 0], [6, 12]]
      between: [35, 37]
    answer_text: '$36\,\text{m}$'


# Practice set for 1.2 (Conservation, dissipation and energy resources).
#
# Both the questions and the answers on the page are rendered from these records:
# `:::problems` prints the numbered list, `:::answers` the solutions. The book
# declares `oracles: [sympy, units]` in book.yaml, so a check may use either.
#
# Efficiency has no unit, so its check is `evaluate` for the exact value plus
# `sigfigs` for the one rounding to the declared figures. Everything with a unit
# uses `dimensions` for the exact magnitude and dimension plus `sigfigs` for the
# rounding. The four `structured` records prove only that a model answer contains
# the declared steps in order and covers the declared ideas; they do not prove
# that the explanation is right, and the pages say so where a reader compares
# their own wording with the model.
chapter: 1
problems:
  - id: p1-efficiency-600
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'A device takes in 800 J of energy and transfers 600 J usefully. Calculate its efficiency as a decimal and as a percentage.'
    answer_label: 'Efficiency of the device'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "600 / 800", answer: "0.75"}
        - {kind: sigfigs, value: "0.75", figures: 2, answer: "0.75", convention: round-once}
    answer_text: '$\text{efficiency} = \dfrac{600}{800} = 0.75 = 75\%$.'

  - id: p2-lamp-efficiency
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'A lamp is supplied with 50 J of energy and transfers 10 J of it as useful light. Calculate the efficiency as a percentage.'
    answer_label: 'Efficiency of the lamp'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "10 / 50", answer: "0.2"}
        - {kind: sigfigs, value: "0.2", figures: 2, answer: "0.20", convention: round-once}
    answer_text: '$\text{efficiency} = \dfrac{10}{50} = 0.20 = 20\%$.'

  - id: p3-motor-input
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'A motor is 80% efficient and its useful output is 320 J. Calculate the total energy supplied to the motor.'
    answer_label: 'Total energy supplied'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "320 / 0.8", answer: "400"}
        - {kind: sigfigs, value: "400", figures: 2, answer: "4.0e2", convention: round-once}
    answer_text: '$0.80 = \dfrac{320}{\text{total input}}$, so total input $= \dfrac{320}{0.80} = 400\,\text{J} = 4.0 \times 10^2\,\text{J}$.'

  - id: p4-kettle-useful
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'A kettle is 90% efficient and takes in $6.0 \times 10^5\,\text{J}$ of energy. Calculate the energy transferred usefully to the water.'
    answer_label: 'Useful energy transferred to the water'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "0.9 * 600000", answer: "540000"}
        - {kind: sigfigs, value: "540000", figures: 2, answer: "5.4e5", convention: round-once}
    answer_text: '$\text{useful output} = 0.90 \times 6.0 \times 10^5 = 5.4 \times 10^5\,\text{J}$.'

  - id: p5-bounce-explain
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'A ball is dropped from a height of 2.0 m and bounces back to 1.5 m. Explain the energy changes, in terms of stores.'
    answer_label: 'The energy changes in the bounce'
    check:
      kind: structured
      requires: [start-store, bottom-store, dissipated]
      concepts: [gravitational-potential-store, kinetic-store, thermal-store]
      points:
        - id: start-store
          text: 'At the top of the drop the ball has energy in its gravitational potential store.'
          concepts: [gravitational-potential-store]
        - id: bottom-store
          text: 'As the ball falls, that energy moves to the kinetic store, which is largest just before the bounce.'
          concepts: [kinetic-store]
        - id: dissipated
          text: 'During the bounce, some energy is transferred to the thermal store of the ball, the floor and the air, so the ball rises to a lower height.'
          concepts: [thermal-store]

  - id: p6-insulate-tank
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'A hot water tank loses energy to its surroundings. Describe two ways to reduce this unwanted energy transfer.'
    answer_label: 'Two ways to reduce the transfer'
    check:
      kind: structured
      requires: [lag-the-tank, insulate-the-pipes]
      concepts: [thermal-insulation, thermal-conductivity]
      points:
        - id: lag-the-tank
          text: 'Wrap the tank in a thick insulating jacket, which traps air and lowers the rate at which energy is transferred.'
          concepts: [thermal-insulation]
        - id: insulate-the-pipes
          text: 'Insulate the hot pipes, because a material with a low thermal conductivity transfers energy more slowly.'
          concepts: [thermal-conductivity]

  - id: p7-resources-wind-coal
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'Give one advantage of using wind rather than coal to generate electricity, one advantage of using coal rather than wind, and one disadvantage of a wind farm.'
    answer_label: 'Comparing wind and coal'
    check:
      kind: structured
      requires: [wind-advantage, coal-advantage, wind-disadvantage]
      concepts: [renewable, reliability, environmental-impact]
      points:
        - id: wind-advantage
          text: 'Wind is renewable, so it is replaced as it is used and will not run out.'
          concepts: [renewable]
        - id: coal-advantage
          text: 'Coal is reliable, because a coal power station can generate at any time, while the wind does not always blow.'
          concepts: [reliability]
        - id: wind-disadvantage
          text: 'A wind farm changes the look of the landscape, which is an environmental impact.'
          concepts: [environmental-impact]

  - id: p8-trends-renewables
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'Explain why the share of electricity generated from renewable resources has increased in many countries.'
    answer_label: 'Why the renewable share has increased'
    check:
      kind: structured
      requires: [reason-not-run-out, reason-carbon-dioxide]
      concepts: [renewable, environmental-impact]
      points:
        - id: reason-not-run-out
          text: 'Renewable resources are replaced as they are used, so they will not run out.'
          concepts: [renewable]
        - id: reason-carbon-dioxide
          text: 'Burning fossil fuels adds carbon dioxide to the air, so many countries choose renewable resources instead to reduce this effect.'
          concepts: [environmental-impact]

  - id: p9-anchor-efficiency
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'In the chapter problem the falling water gives up 3528 J each second and the generator gives out 2100 J each second. Calculate the efficiency of the generator.'
    answer_label: 'Efficiency of the generator'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "2100 / 3528", answer: "25/42"}
        - {kind: sigfigs, value: "25/42", figures: 2, answer: "0.60", convention: round-once}
    answer_text: '$\text{efficiency} = \dfrac{2100}{3528} = 0.60 = 60\%$ to 2 significant figures.'

  - id: p10-dissipated-energy
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'A device takes in 1500 J of energy and transfers 600 J usefully. Calculate the energy dissipated, and name the store that receives it.'
    answer_label: 'Energy dissipated'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "1500 - 600", answer: "900"}
        - {kind: sigfigs, value: "900", figures: 2, answer: "9.0e2", convention: round-once}
    answer_text: '$\text{dissipated} = 1500 - 600 = 900\,\text{J} = 9.0 \times 10^2\,\text{J}$. The energy is transferred to the thermal store of the surroundings.'

  - id: p11-method-choice-heater
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'A 2000 W heater runs for 300 s. The water gains 480000 J of useful energy. Work out the efficiency. Say which two quantities you need first, and why.'
    answer_label: 'Efficiency of the heater'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "480000 / (2000 * 300)", answer: "0.8"}
        - {kind: sigfigs, value: "480000/600000", figures: 2, answer: "0.80", convention: round-once}
    answer_text: 'First find the total energy in: $E = Pt = 2000 \times 300 = 600000\,\text{J}$. Then $\text{efficiency} = \dfrac{480000}{600000} = 0.80 = 80\%$.'

  - id: p12-conservation-statement
    section: '1.2'
    tier: F
    refs: [EN2]
    statement: 'State the principle of conservation of energy for a closed system.'
    answer_label: 'The principle of conservation of energy'
    check:
      kind: structured
      requires: [total-unchanged, not-destroyed]
      concepts: [closed-system, conservation-of-energy]
      points:
        - id: total-unchanged
          text: 'In a closed system the total energy stored does not change.'
          concepts: [closed-system]
        - id: not-destroyed
          text: 'Energy can be transferred between stores, but it is not created and it is not destroyed.'
          concepts: [conservation-of-energy]

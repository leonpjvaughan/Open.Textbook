# Worked solutions for Chapter 4 (Waves in matter).
#
# These are the numerical worked examples, the guided calculations and the
# warm-up recalls that the Learn and Practise with help pages show. The pages
# carry the prose and the reasoning; this bank is the independent check of every
# number in them, so a slip in a worked example cannot ship. The records are not
# rendered by a page marker: the pages write their own working, and the
# `:::answers` blocks come from the practice banks.
#
# A calculation proves the exact magnitude and dimension with `dimensions` and
# the one rounding with `sigfigs`. An echo distance uses `v * t / 2`, because the
# pulse travels to the boundary and back. Where a value comes from a list of
# readings, the `uncertainty` kind would be used; none of these records needs it.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): this proves the
# arithmetic and the dimensions, not the physics.
chapter: 4
problems:
  # --- Section 4.1, the Learn worked examples ---------------------------------
  - id: w1-period
    section: '4.1'
    tier: F
    refs: [WA1]
    statement: 'A wave has a frequency of 4.0 Hz. Calculate its period.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "1 / f"
          values:
            f: {value: "4.0", unit: "Hz"}
          answer: {value: "0.25", unit: "s"}
        - {kind: sigfigs, value: "0.25", figures: 2, answer: "0.25", convention: round-once}
    answer_text: '$T = \dfrac{1}{f} = \dfrac{1}{4.0} = 0.25\,\text{s}$.'

  - id: w2-ripple-speed
    section: '4.1'
    tier: F
    refs: [WA1]
    statement: 'A ripple tank makes water waves with a frequency of 2.5 Hz and a wavelength of 0.20 m. Calculate the wave speed.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "f * wavelength"
          values:
            f: {value: "2.5", unit: "Hz"}
            wavelength: {value: "0.20", unit: "m"}
          answer: {value: "0.5", unit: "m/s"}
        - {kind: sigfigs, value: "0.5", figures: 2, answer: "0.50", convention: round-once}
    answer_text: '$v = f\lambda = 2.5 \times 0.20 = 0.50\,\text{m/s}$.'

  - id: w3-sound-wavelength
    section: '4.1'
    tier: F
    refs: [WA1]
    statement: 'A sound wave in air has a frequency of 440 Hz. The speed of sound in air is 330 m/s. Calculate the wavelength.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v / f"
          values:
            v: {value: "330", unit: "m/s"}
            f: {value: "440", unit: "Hz"}
          answer: {value: "0.75", unit: "m"}
        - {kind: sigfigs, value: "0.75", figures: 2, answer: "0.75", convention: round-once}
    answer_text: '$\lambda = \dfrac{v}{f} = \dfrac{330}{440} = 0.75\,\text{m}$.'

  - id: w4-spring-frequency
    section: '4.1'
    tier: F
    refs: [WA1]
    statement: 'A wave travels along a spring at 6.0 m/s. Its wavelength is 0.40 m. Calculate the frequency.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v / wavelength"
          values:
            v: {value: "6.0", unit: "m/s"}
            wavelength: {value: "0.40", unit: "m"}
          answer: {value: "15", unit: "Hz"}
        - {kind: sigfigs, value: "15", figures: 2, answer: "15", convention: round-once}
    answer_text: '$f = \dfrac{v}{\lambda} = \dfrac{6.0}{0.40} = 15\,\text{Hz}$.'

  - id: w5-anchor-ripple
    section: '4.1'
    tier: F
    refs: [WA1]
    statement: 'In the chapter problem the ripple tank makes waves with a frequency of 5.0 Hz and a wavelength of 0.12 m. Calculate the wave speed.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "f * wavelength"
          values:
            f: {value: "5.0", unit: "Hz"}
            wavelength: {value: "0.12", unit: "m"}
          answer: {value: "0.6", unit: "m/s"}
        - {kind: sigfigs, value: "0.6", figures: 2, answer: "0.60", convention: round-once}
    answer_text: '$v = f\lambda = 5.0 \times 0.12 = 0.60\,\text{m/s}$.'

  - id: w6-steel-wavelength
    section: '4.1'
    tier: F
    refs: [WA1]
    statement: 'A sound wave travels through a steel rail at 5000 m/s. Its frequency is 1000 Hz. Calculate the wavelength.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v / f"
          values:
            v: {value: "5000", unit: "m/s"}
            f: {value: "1000", unit: "Hz"}
          answer: {value: "5", unit: "m"}
        - {kind: sigfigs, value: "5", figures: 2, answer: "5.0", convention: round-once}
    answer_text: '$\lambda = \dfrac{v}{f} = \dfrac{5000}{1000} = 5.0\,\text{m}$.'


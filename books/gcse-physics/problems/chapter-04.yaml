        - kind: dimensions
          expression: "1 / f"
          values:
            f: {value: "500", unit: "Hz"}
          answer: {value: "0.002", unit: "s"}
        - {kind: sigfigs, value: "0.002", figures: 2, answer: "2.0e-3", convention: round-once}

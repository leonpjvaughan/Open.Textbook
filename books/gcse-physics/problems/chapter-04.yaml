          values:
            v1: {value: "5.0", unit: "m/s"}
            f: {value: "250", unit: "Hz"}
          answer: {value: "0.02", unit: "m"}
        - {kind: sigfigs, value: "0.02", figures: 2, answer: "0.020", convention: round-once}
        - kind: dimensions
          expression: "v2 / f"
          values:
            v2: {value: "8.0", unit: "m/s"}
            f: {value: "250", unit: "Hz"}
          answer: {value: "0.032", unit: "m"}
        - {kind: sigfigs, value: "0.032", figures: 2, answer: "0.032", convention: round-once}
    answer_text: 'The frequency stays at 250 Hz. In the first material $\lambda = \dfrac{5.0}{250} = 0.020\,\text{m}$, and in the second $\lambda = \dfrac{8.0}{250} = 0.032\,\text{m}$.'

  - id: g14-transmitted
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'When a wave meets a boundary, 20% of its energy is reflected and 30% is absorbed. Calculate the percentage of the energy that is transmitted.'
    check:
      kind: evaluate
      expression: "100 - 20 - 30"
      answer: "50"
    answer_text: 'The reflected and absorbed energy together are 50%, so 50% is transmitted.'

  - id: g15-three-effects
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'Describe what can happen to a wave when it meets the boundary between two different materials.'
    check:
      kind: structured
      requires: [reflection, transmission, absorption]
      concepts: [reflection, transmission, absorption]
      points:
        - id: reflection
          text: 'Part of the wave can be reflected, so it bounces back from the boundary.'
          concepts: [reflection]
        - id: transmission
          text: 'Part of the wave can be transmitted, so it passes through the boundary into the second material.'
          concepts: [transmission]
        - id: absorption
          text: 'Part of the wave can be absorbed by the material, so its energy is transferred to the material.'
          concepts: [absorption]

  - id: g16-why-normal
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'Explain why the angles in a reflection diagram are measured from the normal and not from the surface.'
    answer_label: 'Why the normal is used'
    check:
      kind: structured
      requires: [normal-is-perpendicular, surface-does-not-fix-angle]
      concepts: [normal, reflection]
      points:
        - id: normal-is-perpendicular
          text: 'The normal is at right angles to the surface, so it gives a fixed reference line for measuring both angles.'
          concepts: [normal]
        - id: surface-does-not-fix-angle
          text: 'The surface lies flat along the boundary, so the angle between a ray and the surface is never the same from one diagram to the next. Measuring from the normal gives the same rule at every point.'
          concepts: [reflection]

  - id: g17-echo-distance
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'A person claps and hears the echo from a wall after 0.50 s. The speed of sound in air is 340 m/s. Calculate the distance from the person to the wall.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v * t / 2"
          values:
            v: {value: "340", unit: "m/s"}
            t: {value: "0.50", unit: "s"}
          answer: {value: "85", unit: "m"}
        - {kind: sigfigs, value: "85", figures: 2, answer: "85", convention: round-once}
    answer_text: '$d = \dfrac{v t}{2} = \dfrac{340 \times 0.50}{2} = 85\,\text{m}$.'

  # --- Section 4.3, the warm-up recalls ---------------------------------------
  - id: warmup-4-3-speed
    section: '4.3'
    tier: F
    refs: [WA1]
    statement: 'A wave has a frequency of 5.0 Hz and a wavelength of 0.40 m. Calculate the wave speed.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "f * wavelength"
          values:
            f: {value: "5.0", unit: "Hz"}
            wavelength: {value: "0.40", unit: "m"}
          answer: {value: "2", unit: "m/s"}
        - {kind: sigfigs, value: "2", figures: 2, answer: "2.0", convention: round-once}
    answer_text: '$v = f\lambda = 5.0 \times 0.40 = 2.0\,\text{m/s}$.'

  - id: warmup-4-3-convert
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'Convert 40 cm to metres.'
    check:
      kind: convert
      value: "40"
      from: "cm"
      to: "m"
      answer: "0.40"
    answer_text: '$40\,\text{cm} = 0.40\,\text{m}$.'

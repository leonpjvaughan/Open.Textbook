    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v / f"
          values:
            v: {value: "1500", unit: "m/s"}
            f: {value: "2500000", unit: "Hz"}
          answer: {value: "0.0006", unit: "m"}
        - {kind: sigfigs, value: "0.0006", figures: 2, answer: "6.0e-4", convention: round-once}
    answer_text: '$\lambda = \dfrac{v}{f} = \dfrac{1500}{2.5 \times 10^6} = 6.0 \times 10^{-4}\,\text{m}$, which is 0.60 mm.'

  # --- Section 4.2, the warm-up recalls ---------------------------------------
  - id: warmup-4-2-speed

  - id: g9-seismic-speed
    section: '4.2'
    tier: H
    refs: [WA1]
    statement: 'An earthquake P-wave travels 45 km in 15 s. Calculate the speed of the P-wave.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "s / t"
          values:
            s: {value: "45", unit: "km"}
            t: {value: "15", unit: "s"}
          answer: {value: "3000", unit: "m/s"}
        - {kind: sigfigs, value: "3000", figures: 2, answer: "3.0e3", convention: round-once}

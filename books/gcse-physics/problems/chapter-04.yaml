  # --- Section 4.3, the Learn worked examples ---------------------------------
  - id: w12-law-of-reflection
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'A ray of light meets a mirror at an angle of incidence of 35 degrees. State the angle of reflection, and say what line the angles are measured from.'
    check:
      kind: structured
      requires: [equal-angle, normal]
      concepts: [reflection, normal]
      points:
        - id: equal-angle
          text: 'The angle of reflection is 35 degrees, because the angle of reflection equals the angle of incidence.'
          concepts: [reflection]
        - id: normal
          text: 'Both angles are measured from the normal, which is the line at right angles to the mirror at the point where the ray hits it.'
          concepts: [normal]

  - id: w13-boundary-wavelengths
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'A sound wave of frequency 500 Hz passes from air into water. The speed of sound is 330 m/s in air and 1500 m/s in water. Calculate the wavelength in each material.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v1 / f"
          values:
            v1: {value: "330", unit: "m/s"}
            f: {value: "500", unit: "Hz"}
          answer: {value: "0.66", unit: "m"}
        - {kind: sigfigs, value: "0.66", figures: 2, answer: "0.66", convention: round-once}
        - kind: dimensions
          expression: "v2 / f"
          values:
            v2: {value: "1500", unit: "m/s"}
            f: {value: "500", unit: "Hz"}
          answer: {value: "3", unit: "m"}
        - {kind: sigfigs, value: "3", figures: 2, answer: "3.0", convention: round-once}
    answer_text: 'In air, $\lambda = \dfrac{330}{500} = 0.66\,\text{m}$. In water, $\lambda = \dfrac{1500}{500} = 3.0\,\text{m}$. The higher speed gives the longer wavelength.'

  - id: w14-transmitted
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'When a wave meets a boundary, 15% of its energy is reflected and 25% is absorbed. Calculate the percentage of the energy that is transmitted.'
    check:
      kind: evaluate
      expression: "100 - 15 - 25"
      answer: "60"
    answer_text: 'The reflected and absorbed energy together are 40%, so 60% is transmitted.'

  - id: w15-echo-time
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'A water wave travels at 4.0 m/s and reflects from a wall 30 m away. Calculate the time taken for the wave to travel to the wall and back.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "2 * d / v"
          values:
            d: {value: "30", unit: "m"}
            v: {value: "4.0", unit: "m/s"}
          answer: {value: "15", unit: "s"}
        - {kind: sigfigs, value: "15", figures: 2, answer: "15", convention: round-once}
    answer_text: 'The total distance is $2 \times 30 = 60\,\text{m}$, so $t = \dfrac{60}{4.0} = 15\,\text{s}$.'

  - id: w16-convert-depth
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'A ripple tank contains water to a depth of 25 cm. Convert this depth to metres.'
    check:
      kind: convert
      value: "25"
      from: "cm"
      to: "m"
      answer: "0.25"
    answer_text: '$25\,\text{cm} = 0.25\,\text{m}$.'

  - id: w17-echo-distance
    section: '4.3'
    tier: F
    refs: [WA2]
    statement: 'A person claps and hears the echo from a wall after 0.80 s. The speed of sound in air is 330 m/s. Calculate the distance from the person to the wall.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v * t / 2"
          values:
            v: {value: "330", unit: "m/s"}
            t: {value: "0.80", unit: "s"}
          answer: {value: "132", unit: "m"}
        - {kind: sigfigs, value: "132", figures: 2, answer: "1.3e2", convention: round-once}
    answer_text: '$d = \dfrac{v t}{2} = \dfrac{330 \times 0.80}{2} = 132\,\text{m} = 1.3 \times 10^2\,\text{m}$ to 2 significant figures.'


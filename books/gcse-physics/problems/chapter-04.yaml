    answer_text: '$f = \dfrac{20}{5.0} = 4.0\,\text{Hz}$, so the period is $T = \dfrac{1}{4.0} = 0.25\,\text{s}$.'

  # --- Section 4.1, the warm-up recalls ---------------------------------------
  - id: warmup-4-1-speed
    section: '4.1'
    tier: F
    refs: [FO5]
    statement: 'A runner covers 400 m in 50 s. Calculate her average speed.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "s / t"
          values:
            s: {value: "400", unit: "m"}
            t: {value: "50", unit: "s"}
          answer: {value: "8", unit: "m/s"}
        - {kind: sigfigs, value: "8", figures: 2, answer: "8.0", convention: round-once}
    answer_text: '$v = \dfrac{s}{t} = \dfrac{400}{50} = 8.0\,\text{m/s}$.'

  - id: warmup-4-1-time
    section: '4.1'
    tier: F
    refs: [FO5]
    statement: 'A train travels 900 m at a steady speed of 25 m/s. Calculate the time taken.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "s / v"
          values:
            s: {value: "900", unit: "m"}
            v: {value: "25", unit: "m/s"}
          answer: {value: "36", unit: "s"}
        - {kind: sigfigs, value: "36", figures: 2, answer: "36", convention: round-once}
    answer_text: '$t = \dfrac{s}{v} = \dfrac{900}{25} = 36\,\text{s}$.'

  # --- Section 4.2, the Learn worked examples ---------------------------------
  - id: w7-hearing-period
    section: '4.2'
    tier: H
    refs: [WA1]
    statement: 'The lowest frequency a healthy young person can hear is 20 Hz. Calculate the period of this sound wave.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "1 / f"
          values:
            f: {value: "20", unit: "Hz"}
          answer: {value: "0.05", unit: "s"}
        - {kind: sigfigs, value: "0.05", figures: 2, answer: "0.050", convention: round-once}
    answer_text: '$T = \dfrac{1}{f} = \dfrac{1}{20} = 0.050\,\text{s}$.'

  - id: w8-echo-tissue
    section: '4.2'
    tier: H
    refs: [WA1]
    statement: 'A pulse of ultrasound travels through tissue at 1500 m/s. The reflection returns to the detector after 0.00012 s. Calculate the distance to the boundary.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v * t / 2"
          values:
            v: {value: "1500", unit: "m/s"}
            t: {value: "0.00012", unit: "s"}
          answer: {value: "0.09", unit: "m"}
        - {kind: sigfigs, value: "0.09", figures: 2, answer: "0.090", convention: round-once}
    answer_text: '$s = \dfrac{v t}{2} = \dfrac{1500 \times 0.00012}{2} = 0.090\,\text{m}$.'

  - id: w9-anchor-depth
    section: '4.2'
    tier: H
    refs: [WA1]
    statement: 'In the chapter problem the echo sounder sends a pulse through sea water at 1500 m/s. The reflection returns after 0.020 s. Calculate the depth of the sea floor.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v * t / 2"
          values:
            v: {value: "1500", unit: "m/s"}
            t: {value: "0.020", unit: "s"}
          answer: {value: "15", unit: "m"}
        - {kind: sigfigs, value: "15", figures: 2, answer: "15", convention: round-once}
    answer_text: '$s = \dfrac{v t}{2} = \dfrac{1500 \times 0.020}{2} = 15\,\text{m}$.'

  - id: w10-ultrasound-wavelength
    section: '4.2'
    tier: H
    refs: [WA1]
    statement: 'A medical scanner uses ultrasound at a frequency of 2.0 MHz. The speed of sound in tissue is 1500 m/s. Calculate the wavelength.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "v / f"
          values:
            v: {value: "1500", unit: "m/s"}
            f: {value: "2000000", unit: "Hz"}
          answer: {value: "0.00075", unit: "m"}
        - {kind: sigfigs, value: "0.00075", figures: 2, answer: "7.5e-4", convention: round-once}
    answer_text: '$\lambda = \dfrac{v}{f} = \dfrac{1500}{2.0 \times 10^6} = 7.5 \times 10^{-4}\,\text{m}$, which is 0.75 mm.'

  - id: w11-seismic-speed
    section: '4.2'
    tier: H
    refs: [WA1]
    statement: 'A seismic P-wave travels 60 km in 12 s. Calculate its speed.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "s / t"
          values:
            s: {value: "60", unit: "km"}
            t: {value: "12", unit: "s"}
          answer: {value: "5000", unit: "m/s"}
        - {kind: sigfigs, value: "5000", figures: 2, answer: "5.0e3", convention: round-once}
    answer_text: '$60\,\text{km} = 60000\,\text{m}$, so $v = \dfrac{s}{t} = \dfrac{60000}{12} = 5000\,\text{m/s} = 5.0 \times 10^3\,\text{m/s}$.'


  # --- Section 2.2, the Learn worked examples ---------------------------------
  - id: w6-spring-force
    section: '2.2'
    tier: F
    refs: [FO1]
    statement: 'A spring has a spring constant of 320 N/m and is stretched by 0.15 m. Calculate the force.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "k * e"
          values:
            k: {value: "320", unit: "N/m"}
            e: {value: "0.15", unit: "m"}
          answer: {value: "48", unit: "N"}
        - {kind: sigfigs, value: "48", figures: 2, answer: "48", convention: round-once}
    answer_text: '$48\,\text{N}$'

  - id: w7-spring-constant
    section: '2.2'
    tier: F
    refs: [FO1]
    statement: 'A force of 20 N stretches a spring by 0.080 m. Calculate the spring constant.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F / e"
          values:
            F: {value: "20", unit: "N"}
            e: {value: "0.080", unit: "m"}
          answer: {value: "250", unit: "N/m"}
        - {kind: sigfigs, value: "250", figures: 2, answer: "250", convention: round-once}
    answer_text: '$250\,\text{N/m}$'

  - id: w8-spring-extension
    section: '2.2'

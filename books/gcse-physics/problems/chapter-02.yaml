# Worked solutions for Chapter 2 (Forces and their interactions).
#
# These are the numerical worked examples, the guided calculations and the
# warm-up recalls that the Learn and Practise with help pages show. The pages
# carry the prose and the reasoning; this bank is the independent check of every
# number in them, so a slip in a worked example cannot ship. The records are not
# rendered by a page marker: the pages write their own working, and the
# `:::answers` blocks come from the practice banks.
#
# Each calculation proves the exact magnitude and dimension with `dimensions`
# (or `evaluate` where the quantity has no unit) and the one rounding with
# `sigfigs`. A value read from a graph is a measurement, so it is proved against
# a declared interval by `gradient`. A resolved force uses `resolve` and carries
# an answer_text, because a composed check has no top-level answer to render.
chapter: 2
problems:
  # --- Section 2.1, the Learn worked examples ---------------------------------
  - id: w1-weight-pupil
    section: '2.1'
    tier: F
    refs: [FO1]
    statement: 'A pupil of mass 70 kg stands on the ground. Take g = 9.8 N/kg. Calculate the weight of the pupil.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m * g"
          values:
            m: {value: "70", unit: "kg"}
            g: {value: "9.8", unit: "N/kg"}
          answer: {value: "686", unit: "N"}
        - {kind: sigfigs, value: "686", figures: 2, answer: "690", convention: round-once}
    answer_text: '$690\,\text{N}$'

  - id: w2-resultant-opposite
    section: '2.1'
    tier: F
    refs: [FO1]
    statement: 'A force of 250 N acts to the right and a force of 100 N acts to the left. Calculate the resultant force.'
    check: {kind: evaluate, expression: "250 - 100", answer: "150"}
    answer_text: '$150\,\text{N}$ to the right'

  - id: w3-resultant-same
    section: '2.1'
    tier: F
    refs: [FO1]
    statement: 'Two forces of 35 N and 50 N act in the same direction. Calculate the resultant force.'
    check: {kind: evaluate, expression: "35 + 50", answer: "85"}
    answer_text: '$85\,\text{N}$ in the direction of the forces'

  - id: w4-resolve-50n
    section: '2.1'
    tier: H
    refs: [FO1]
    statement: 'A force of 50 N acts at 30 degrees to the horizontal. Resolve the force into components.'
    check:
      kind: all
      checks:
        - kind: resolve
          relation: components-from-magnitude-and-angle
          magnitude: "50"
          angle_deg: "30"
          components: {x: "43.3", y: "25.0"}
    answer_text: 'horizontal $43.3\,\text{N}$, vertical $25.0\,\text{N}$'

  - id: w5-resultant-perpendicular
    section: '2.1'
    tier: H
    refs: [FO1]
    statement: 'Two forces of 30 N and 40 N act at right angles. Calculate the resultant.'
    check:
      kind: all
      checks:
        - kind: resolve
          relation: magnitude-and-angle-from-components
          components: {x: "30", y: "40"}
          magnitude: "50"
          angle_deg: "53.1"
    answer_text: '$50\,\text{N}$ at $53.1^\circ$ to the 30 N force'


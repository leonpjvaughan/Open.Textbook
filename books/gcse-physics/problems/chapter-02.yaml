    tier: F
    refs: [FO4]
    statement: 'A force of 25 N acts at a perpendicular distance of 0.40 m from a pivot. Calculate the moment.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F * d"
          values:
            F: {value: "25", unit: "N"}
            d: {value: "0.40", unit: "m"}
          answer: {value: "10", unit: "N m"}
        - {kind: sigfigs, value: "10", figures: 2, answer: "1.0e1", convention: round-once}
    answer_text: '$10\,\text{N m}$'

  - id: g17-balance
    section: '2.5'
    tier: F
    refs: [FO4]
    statement: 'A weight of 500 N sits 0.60 m from the pivot of a balanced beam. A second weight sits 1.5 m from the pivot on the other side. Calculate the second weight.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F1 * d1 / d2"
          values:
            F1: {value: "500", unit: "N"}
            d1: {value: "0.60", unit: "m"}
            d2: {value: "1.5", unit: "m"}
          answer: {value: "200", unit: "N"}
        - {kind: sigfigs, value: "200", figures: 2, answer: "2.0e2", convention: round-once}
    answer_text: '$2.0 \times 10^2\,\text{N}$'

  - id: g18-lever
    section: '2.5'
    tier: F
    refs: [FO4]
    statement: 'A lever has an effort of 120 N at 0.50 m from the pivot and a load at 0.10 m from the pivot. Calculate the force on the load.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F1 * d1 / d2"
          values:
            F1: {value: "120", unit: "N"}
            d1: {value: "0.50", unit: "m"}
            d2: {value: "0.10", unit: "m"}
          answer: {value: "600", unit: "N"}
        - {kind: sigfigs, value: "600", figures: 2, answer: "6.0e2", convention: round-once}
    answer_text: '$6.0 \times 10^2\,\text{N}$'

  - id: g19-gear
    section: '2.5'
    tier: F
    refs: [FO4]
    statement: 'A gear with 20 teeth drives a gear with 40 teeth. The driving gear has a moment of 12 N m. Calculate the moment of the driven gear.'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "12 * 20 / 40", answer: "6"}
        - {kind: sigfigs, value: "6", figures: 2, answer: "6.0", convention: round-once}
    answer_text: '$6.0\,\text{N m}$'

  # --- The warm-up recalls ----------------------------------------------------
  - id: warmup-2-1-kinetic
    section: '2.1'
    tier: F
    refs: [EN1]
    statement: 'Warm-up: calculate the energy in the kinetic store of a 2.0 kg object moving at 3.0 m/s.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "0.5 * m * v**2"
          values:
            m: {value: "2.0", unit: "kg"}
            v: {value: "3.0", unit: "m/s"}
          answer: {value: "9.0", unit: "J"}
    answer_text: '$9.0\,\text{J}$'

  - id: warmup-2-2-weight
    section: '2.2'
    tier: F
    refs: [FO1]
    statement: 'Warm-up: calculate the weight of a 4.0 kg bag. Take g = 9.8 N/kg.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m * g"
          values:
            m: {value: "4.0", unit: "kg"}
            g: {value: "9.8", unit: "N/kg"}
          answer: {value: "39.2", unit: "N"}
        - {kind: sigfigs, value: "39.2", figures: 2, answer: "39", convention: round-once}
    answer_text: '$39\,\text{N}$'

  - id: warmup-2-3-spring
    section: '2.3'
    tier: F
    refs: [FO1]
    statement: 'Warm-up: a spring of spring constant 200 N/m is stretched by 0.10 m. Calculate the force.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "k * e"
          values:
            k: {value: "200", unit: "N/m"}
            e: {value: "0.10", unit: "m"}
          answer: {value: "20", unit: "N"}
        - {kind: sigfigs, value: "20", figures: 2, answer: "2.0e1", convention: round-once}
    answer_text: '$20\,\text{N}$'

  - id: warmup-2-4-work
    section: '2.4'
    tier: F
    refs: [FO2]
    statement: 'Warm-up: calculate the work done when a force of 60 N moves an object 5.0 m along the line of the force.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F * s"
          values:
            F: {value: "60", unit: "N"}
            s: {value: "5.0", unit: "m"}
          answer: {value: "300", unit: "J"}
        - {kind: sigfigs, value: "300", figures: 2, answer: "3.0e2", convention: round-once}
    answer_text: '$300\,\text{J}$'

  - id: warmup-2-5-pressure
    section: '2.5'
    tier: F
    refs: [FO3]
    statement: 'Warm-up: calculate the pressure when a force of 400 N acts on an area of 0.20 m squared.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F / A"
          values:
            F: {value: "400", unit: "N"}
            A: {value: "0.20", unit: "m^2"}
          answer: {value: "2000", unit: "Pa"}
        - {kind: sigfigs, value: "2000", figures: 2, answer: "2.0e3", convention: round-once}
    answer_text: '$2.0 \times 10^3\,\text{Pa}$'

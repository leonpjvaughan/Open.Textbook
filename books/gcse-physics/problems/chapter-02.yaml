        - kind: dimensions
          expression: "0.5 * k * e**2"
          values:
            k: {value: "200", unit: "N/m"}
            e: {value: "0.20", unit: "m"}
          answer: {value: "4.0", unit: "J"}
        - {kind: sigfigs, value: "4", figures: 2, answer: "4.0", convention: round-once}
    answer_text: '$4.0\,\text{J}$'


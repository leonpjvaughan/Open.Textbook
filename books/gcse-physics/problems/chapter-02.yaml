    refs: [FO1]
    statement: 'A spring has a spring constant of 120 N/m. A force of 36 N is applied. Calculate the extension.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F / k"
          values:
            F: {value: "36", unit: "N"}
            k: {value: "120", unit: "N/m"}
          answer: {value: "0.30", unit: "m"}
        - {kind: sigfigs, value: "0.3", figures: 2, answer: "0.30", convention: round-once}
    answer_text: '$0.30\,\text{m}$'

  - id: w9-elastic-energy
    section: '2.2'

# Practice set for 9.1 (Nuclear atom and isotopes).
#
# Both the questions and the answers on the page are rendered from these records:
# `:::problems` prints the numbered list, `:::answers` the solutions. The book
# declares `oracles: [sympy, units]`, so a check may use either.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): the verifier
# proves arithmetic and dimensions, not physics. The `structured` records prove
# only that a model answer contains the declared ideas, in order.
chapter: 9
problems:
  - id: p1-atom-particles
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'State the relative electric charge of a proton, a neutron and an electron, and say where the protons and neutrons are found in an atom.'
    answer_label: 'The three particles and their charges'
    check:
      kind: structured
      requires: [proton-charge, neutron-charge, electron-charge, location]
      concepts: [proton, neutron, electron, nucleus]
      points:
        - id: proton-charge
          text: 'A proton has a relative charge of +1.'
          concepts: [proton]
        - id: neutron-charge
          text: 'A neutron has no charge; its relative charge is 0.'
          concepts: [neutron]
        - id: electron-charge
          text: 'An electron has a relative charge of -1.'
          concepts: [electron]
        - id: location
          text: 'The protons and neutrons are packed together in the nucleus at the centre of the atom.'
          concepts: [nucleus]

  - id: p2-mass-number
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'An atom has 15 protons and 16 neutrons. State its mass number and the number of electrons in the neutral atom.'
    answer_label: 'Mass number and electrons'
    check: {kind: evaluate, expression: '15 + 16', answer: '31'}
    answer_text: 'Mass number $= 15 + 16 = 31$. A neutral atom has 15 electrons, the same as the number of protons.'

  - id: p3-iron-notation
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'An atom of iron is written $^{56}_{26}\text{Fe}$. State the number of protons, the number of neutrons and the number of electrons.'
    answer_label: 'Protons, neutrons and electrons in iron-56'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '56 - 26', answer: '30'}
    answer_text: 'The lower number is the atomic number, so there are 26 protons. The upper number is the mass number, so the number of neutrons is $56 - 26 = 30$. A neutral atom has 26 electrons.'

  - id: p4-isotope-definition
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'Define the term isotope.'
    answer_label: 'Definition of an isotope'
    check:
      kind: structured
      requires: [same-protons, different-neutrons]
      concepts: [isotope]
      points:
        - id: same-protons
          text: 'Isotopes are atoms of the same element, so they have the same number of protons.'
          concepts: [isotope]
        - id: different-neutrons
          text: 'They have different numbers of neutrons, so they have different mass numbers.'
          concepts: [isotope]

  - id: p5-carbon-isotopes
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'Carbon-12 and carbon-14 are both atoms of carbon. Explain why they are isotopes of the same element.'
    answer_label: 'Why carbon-12 and carbon-14 are isotopes'
    check:
      kind: structured
      requires: [same-protons, different-neutrons]
      concepts: [isotope, mass-number]
      points:
        - id: same-protons
          text: 'Both have 6 protons, because the number of protons decides which element an atom is.'
          concepts: [isotope]
        - id: different-neutrons
          text: 'Carbon-12 has 6 neutrons and carbon-14 has 8 neutrons. The different numbers of neutrons give them different mass numbers.'
          concepts: [mass-number]

  - id: p6-rutherford
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'Describe what the alpha particle scattering experiment showed about the mass and the charge of an atom.'
    answer_label: 'What the scattering experiment showed'
    check:
      kind: structured
      requires: [mass-concentrated, nucleus-charged]
      concepts: [alpha-scattering, nucleus, nuclear-model]
      points:
        - id: mass-concentrated
          text: 'Most alpha particles passed straight through, but a few were repelled back. This showed that almost all of the mass is concentrated in a very small volume at the centre.'
          concepts: [alpha-scattering, nucleus]
        - id: nucleus-charged
          text: 'The particles that were repelled were pushed back by a concentrated positive charge, so the centre of the atom is positively charged. This centre is the nucleus.'
          concepts: [nuclear-model, nucleus]

  - id: p7-plum-pudding
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'Describe the difference between the plum pudding model and the nuclear model of the atom.'
    answer_label: 'Plum pudding compared with the nuclear model'
    check:
      kind: structured
      requires: [plum-pudding, nuclear-model]
      concepts: [plum-pudding, nuclear-model]
      points:
        - id: plum-pudding
          text: 'In the plum pudding model the atom is a ball of positive charge with negative electrons spread through it.'
          concepts: [plum-pudding]
        - id: nuclear-model
          text: 'In the nuclear model the positive charge and almost all of the mass are concentrated in a tiny nucleus, with the electrons around the outside.'
          concepts: [nuclear-model]

  - id: p8-ion
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'An atom of magnesium loses two outer electrons. State the charge on the ion that is formed, and explain your answer.'
    answer_label: 'The charge on the ion'
    check:
      kind: structured
      requires: [loses-electrons, positive-charge]
      concepts: [ion]
      points:
        - id: loses-electrons
          text: 'The atom loses two negative electrons, so the number of protons is now greater than the number of electrons.'
          concepts: [ion]
        - id: positive-charge
          text: 'The atom had no overall charge. Removing two electrons leaves a charge of $+2$.'
          concepts: [ion]

  - id: p9-nucleus-size
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'The radius of an atom is about $1 \times 10^{-10}\,\text{m}$. The radius of its nucleus is about $1 \times 10^{-14}\,\text{m}$. Work out how many times smaller the nucleus is than the atom.'
    answer_label: 'How many times smaller the nucleus is'
    check: {kind: evaluate, expression: '1e-10 / 1e-14', answer: '1e4'}
    answer_text: '$\dfrac{1 \times 10^{-10}}{1 \times 10^{-14}} = 1 \times 10^{4}$. The atom is about 10 000 times wider than its nucleus.'

  - id: p10-energy-levels
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'Describe what happens to an electron when an atom absorbs electromagnetic radiation, and what happens when the atom emits electromagnetic radiation.'
    answer_label: 'Absorption and emission of radiation'
    check:
      kind: structured
      requires: [absorption, emission]
      concepts: [energy-level]
      points:
        - id: absorption
          text: 'When the atom absorbs electromagnetic radiation, the electron moves to a higher energy level, further from the nucleus.'
          concepts: [energy-level]
        - id: emission
          text: 'When the atom emits electromagnetic radiation, the electron moves to a lower energy level, closer to the nucleus.'
          concepts: [energy-level]

  - id: p11-chapter-isotope
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'In the chapter problem the tracer isotope has 43 protons and 56 neutrons. State its atomic number, its mass number and the number of electrons in a neutral atom.'
    answer_label: 'Atomic number, mass number and electrons of the tracer'
    check: {kind: evaluate, expression: '43 + 56', answer: '99'}
    answer_text: 'Atomic number $Z = 43$. Mass number $A = 43 + 56 = 99$. A neutral atom has 43 electrons.'

  - id: p12-method
    section: '9.1'
    tier: F
    dfe: [AT1]
    statement: 'A pupil says that the mass number of an atom is the number of neutrons in it. Explain what is wrong with this statement, and give the correct definition.'
    answer_label: 'Correcting the definition of mass number'
    check:
      kind: structured
      requires: [what-is-wrong, correct-definition]
      concepts: [mass-number, proton, neutron]
      points:
        - id: what-is-wrong
          text: 'The mass number is not the number of neutrons on its own. It counts both kinds of particle in the nucleus.'
          concepts: [mass-number]
        - id: correct-definition
          text: 'The mass number is the total number of protons and neutrons in the nucleus.'
          concepts: [proton, neutron, mass-number]

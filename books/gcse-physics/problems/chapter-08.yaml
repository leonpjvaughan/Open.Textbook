    section: '8.2'
    tier: F
    dfe: [PM2]
    statement: 'Warm-up: a heater transfers 30000 J of energy in 20 s. Calculate its power.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "E / t"
          values:
            E: {value: "30000", unit: "J"}

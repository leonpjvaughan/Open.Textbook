          answer: {value: "1500", unit: "W"}
        - {kind: sigfigs, value: "1500", figures: 2, answer: "1.5e3", convention: round-once}
    answer_text: '$1500\,\text{W}$'

  # --- Section 8.3, the Learn worked examples ---------------------------------
  - id: w11-pv-pressure
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'A fixed mass of gas at 100 kPa fills 0.30 m^3. It is compressed at constant temperature to 0.10 m^3. Calculate the new pressure.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "p1 * V1 / V2"
          values:
            p1: {value: "100", unit: "kPa"}
            V1: {value: "0.30", unit: "m^3"}
            V2: {value: "0.10", unit: "m^3"}
          answer: {value: "300", unit: "kPa"}
        - {kind: sigfigs, value: "300", figures: 2, answer: "3.0e2", convention: round-once}
    answer_text: '$300\,\text{kPa}$'

  - id: w12-pv-volume
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'A fixed mass of gas at 100 kPa fills 0.60 m^3. It expands at constant temperature to 150 kPa. Calculate the new volume.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "p1 * V1 / p2"
          values:
            p1: {value: "100", unit: "kPa"}
            V1: {value: "0.60", unit: "m^3"}
            p2: {value: "150", unit: "kPa"}
          answer: {value: "0.40", unit: "m^3"}
        - {kind: sigfigs, value: "0.40", figures: 2, answer: "0.40", convention: round-once}
    answer_text: '$0.40\,\text{m}^3$'

  - id: w13-force-from-pressure
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'A gas pushes on a window of area 0.015 m^2 with a force of 3000 N. Calculate the pressure of the gas on the window.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F / A"
          values:
            F: {value: "3000", unit: "N"}
            A: {value: "0.015", unit: "m^2"}
          answer: {value: "200000", unit: "Pa"}
        - {kind: sigfigs, value: "200000", figures: 2, answer: "2.0e5", convention: round-once}
    answer_text: '$200\,000\,\text{Pa} = 200\,\text{kPa}$'

  - id: w14-cooling-can
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'A sealed metal can of air is placed in a freezer. Explain what happens to the motion of the air particles and to the pressure inside the can.'
    check:
      kind: structured
      requires: [motion, collisions, pressure]
      concepts: [gas-pressure, particle-model]
      points:
        - id: motion
          text: 'The air particles cool, so their average kinetic energy falls and they move more slowly.'
          concepts: [particle-model]
        - id: collisions
          text: 'They collide with the walls of the can less often and with less force.'
          concepts: [gas-pressure]
        - id: pressure
          text: 'The pressure inside the can therefore decreases.'
          concepts: [gas-pressure]

  - id: w15-bicycle-pump
    section: '8.3'
    tier: H
    dfe: [PM3]
    statement: 'A student pushes the handle of a bicycle pump quickly. The air inside the pump gets warm. Explain why, using energy ideas.'
    check:
      kind: structured
      requires: [work, internal-energy, temperature]
      concepts: [work-done, internal-energy]
      points:
        - id: work
          text: 'Pushing the handle does work on the air inside the pump, because a force moves through a distance.'
          concepts: [work-done]
        - id: internal-energy
          text: 'The work done is transferred to the internal energy of the air.'
          concepts: [internal-energy]
        - id: temperature
          text: 'The particles of air gain kinetic energy, so the temperature of the air rises.'
          concepts: [internal-energy]

  # --- Section 8.3, the Practise with help calculations -----------------------
  - id: g15-pv-pressure
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'A fixed mass of gas at 100 kPa fills 1.2 m^3. It is compressed at constant temperature to 0.40 m^3. Calculate the new pressure.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "p1 * V1 / V2"
          values:
            p1: {value: "100", unit: "kPa"}
            V1: {value: "1.2", unit: "m^3"}
            V2: {value: "0.40", unit: "m^3"}
          answer: {value: "300", unit: "kPa"}
        - {kind: sigfigs, value: "300", figures: 2, answer: "3.0e2", convention: round-once}
    answer_text: '$300\,\text{kPa}$'

  - id: g16-pv-volume
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'A fixed mass of gas at 100 kPa fills 0.30 m^3. It expands at constant temperature to 120 kPa. Calculate the new volume.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "p1 * V1 / p2"
          values:
            p1: {value: "100", unit: "kPa"}
            V1: {value: "0.30", unit: "m^3"}
            p2: {value: "120", unit: "kPa"}
          answer: {value: "0.25", unit: "m^3"}
        - {kind: sigfigs, value: "0.25", figures: 2, answer: "0.25", convention: round-once}
    answer_text: '$0.25\,\text{m}^3$'

  - id: g17-plate-force
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'A gas exerts a pressure of 250 kPa on a flat plate of area 0.040 m^2. Calculate the force on the plate.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "p * A"
          values:
            p: {value: "250", unit: "kPa"}
            A: {value: "0.040", unit: "m^2"}
          answer: {value: "10000", unit: "N"}
        - {kind: sigfigs, value: "10000", figures: 2, answer: "1.0e4", convention: round-once}
    answer_text: '$10\,000\,\text{N} = 10\,\text{kN}$'

  - id: g18-compress-explain
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'Explain, using the particle model, why the pressure of a gas rises when the gas is compressed at a constant temperature.'
    check:
      kind: structured
      requires: [crowding, collisions]
      concepts: [gas-pressure, particle-model]
      points:
        - id: crowding
          text: 'The same number of particles is squeezed into a smaller volume, so the particles are closer together and closer to the walls.'
          concepts: [particle-model]
        - id: collisions
          text: 'Each particle hits the walls more often, and the average kinetic energy does not change, so the walls receive more collisions each second and the pressure rises.'
          concepts: [gas-pressure]

  - id: g19-heat-sealed
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'A sealed metal container holding a gas is warmed. The volume does not change. Explain what happens to the speed of the particles and to the pressure of the gas.'
    check:
      kind: structured
      requires: [speed, collisions, pressure]
      concepts: [gas-pressure, particle-model]
      points:
        - id: speed
          text: 'The particles gain kinetic energy and move faster.'
          concepts: [particle-model]
        - id: collisions
          text: 'They hit the walls more often, and each collision is harder.'
          concepts: [gas-pressure]
        - id: pressure
          text: 'The pressure of the gas therefore rises.'
          concepts: [gas-pressure]

  - id: g20-method-choice-pv
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'Say which relationship you will use, then calculate the pressure when 0.80 m^3 of gas at 100 kPa is compressed to 0.20 m^3 at a constant temperature.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "p1 * V1 / V2"
          values:
            p1: {value: "100", unit: "kPa"}
            V1: {value: "0.80", unit: "m^3"}
            V2: {value: "0.20", unit: "m^3"}
          answer: {value: "400", unit: "kPa"}
        - {kind: sigfigs, value: "400", figures: 2, answer: "4.0e2", convention: round-once}
    answer_text: '$p_1V_1 = p_2V_2$, so $p_2 = \dfrac{100 \times 0.80}{0.20} = 400\,\text{kPa}$.'

  - id: g21-pump-explain
    section: '8.3'
    tier: H
    dfe: [PM3]
    statement: 'A student pushes the handle of a bicycle pump quickly. Explain why the air inside the pump becomes warmer.'
    check:
      kind: structured
      requires: [work, internal-energy, particles]
      concepts: [work-done, internal-energy]
      points:
        - id: work
          text: 'Pushing the handle does work on the trapped air, because the force moves through a distance.'
          concepts: [work-done]
        - id: internal-energy
          text: 'The work done is transferred to the internal energy of the air.'
          concepts: [internal-energy]
        - id: particles
          text: 'The particles gain kinetic energy, so the air becomes warmer.'
          concepts: [internal-energy]

  # --- The Section 8.3 warm-up recalls ----------------------------------------
  - id: warmup-8-3-heat
    section: '8.3'
    tier: F
    dfe: [PM2]
    statement: 'Warm-up: calculate the energy needed to warm 0.50 kg of water by 40 °C. The specific heat capacity of water is 4200 J/kg°C.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m * c * dtheta"
          values:
            m: {value: "0.50", unit: "kg"}
            c: {value: "4200", unit: "J kg^-1 K^-1"}
            dtheta: {value: "40", unit: "K"}
          answer: {value: "84000", unit: "J"}
        - {kind: sigfigs, value: "84000", figures: 2, answer: "8.4e4", convention: round-once}
    answer_text: '$84\,000\,\text{J}$'

  - id: warmup-8-3-pressure
    section: '8.3'
    tier: F
    dfe: [PM3]
    statement: 'Warm-up: a force of 60 N acts on an area of 0.020 m^2. Calculate the pressure.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "F / A"
          values:
            F: {value: "60", unit: "N"}
            A: {value: "0.020", unit: "m^2"}
          answer: {value: "3000", unit: "Pa"}
        - {kind: sigfigs, value: "3000", figures: 2, answer: "3.0e3", convention: round-once}
    answer_text: '$3000\,\text{Pa}$'

  # --- The chapter problem, resolved on the Review page -----------------------
  - id: anchor-ice-mass
    section: Review
    tier: F
    dfe: [PM1]
    statement: 'The block of ice has a volume of 2.5 x 10^-3 m^3 and the density of ice is 920 kg/m^3. Calculate its mass.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "rho * V"
          values:
            rho: {value: "920", unit: "kg/m^3"}
            V: {value: "2.5e-3", unit: "m^3"}
          answer: {value: "2.3", unit: "kg"}
        - {kind: sigfigs, value: "2.3", figures: 2, answer: "2.3", convention: round-once}
    answer_text: '$2.3\,\text{kg}$'

  - id: anchor-melt
    section: Review
    tier: F
    dfe: [PM2]
    statement: 'The 2.3 kg of ice melts. The specific latent heat of fusion of ice is 3.3 x 10^5 J/kg. Calculate the energy needed.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m * L"
          values:
            m: {value: "2.3", unit: "kg"}
            L: {value: "3.3e5", unit: "J/kg"}
          answer: {value: "759000", unit: "J"}
        - {kind: sigfigs, value: "759000", figures: 2, answer: "7.6e5", convention: round-once}
    answer_text: '$7.6 \times 10^5\,\text{J}$'

  - id: anchor-warm
    section: Review
    tier: F
    dfe: [PM2]
    statement: 'The 2.3 kg of meltwater is warmed from 0 °C to 45 °C. The specific heat capacity of water is 4200 J/kg°C. Calculate the energy needed.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "m * c * dtheta"
          values:
            m: {value: "2.3", unit: "kg"}
            c: {value: "4200", unit: "J kg^-1 K^-1"}
            dtheta: {value: "45", unit: "K"}
          answer: {value: "434700", unit: "J"}
        - {kind: sigfigs, value: "434700", figures: 2, answer: "4.3e5", convention: round-once}
    answer_text: '$4.3 \times 10^5\,\text{J}$'

  - id: anchor-total
    section: Review
    tier: F
    dfe: [PM2]
    statement: 'Add the energy to melt the ice, 759000 J, to the energy to warm the water, 434700 J.'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: "759000 + 434700", answer: "1193700"}
        - {kind: sigfigs, value: "1193700", figures: 2, answer: "1.2e6", convention: round-once}
    answer_text: '$1\,193\,700\,\text{J} = 1.2 \times 10^6\,\text{J}$'

  - id: anchor-balloon
    section: Review
    tier: F
    dfe: [PM3]
    statement: 'The weather balloon holds 2.0 m^3 of gas at 100 kPa in the valley. At altitude the pressure is 25 kPa and the temperature is the same. Calculate the volume at altitude.'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "p1 * V1 / p2"
          values:
            p1: {value: "100", unit: "kPa"}
            V1: {value: "2.0", unit: "m^3"}
            p2: {value: "25", unit: "kPa"}
          answer: {value: "8.0", unit: "m^3"}
        - {kind: sigfigs, value: "8.0", figures: 2, answer: "8.0", convention: round-once}
    answer_text: '$8.0\,\text{m}^3$'

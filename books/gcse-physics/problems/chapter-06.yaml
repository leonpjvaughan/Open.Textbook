          expression: "Q * V"
          values:
            Q: {value: "40", unit: "C"}
            V: {value: "230", unit: "V"}
          answer: {value: "9200", unit: "J"}
        - {kind: sigfigs, value: "9200", figures: 2, answer: "9.2e3", convention: round-once}
    answer_text: '$E = QV = 40 \times 230 = 9200\,\text{J} = 9.2 \times 10^3\,\text{J}$.'

  - id: g21-current-from-power
    section: '6.4'
    tier: F
    refs: [EL4]
    statement: 'A 460 W appliance is connected to the 230 V supply. Calculate the current through it.'
    answer_label: 'Current through the appliance'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "P / V"
          values:
            P: {value: "460", unit: "W"}
            V: {value: "230", unit: "V"}
          answer: {value: "2.0", unit: "A"}
        - {kind: sigfigs, value: "2.0", figures: 2, answer: "2.0", convention: round-once}
    answer_text: '$I = \dfrac{P}{V} = \dfrac{460}{230} = 2.0\,\text{A}$.'

  - id: g22-power-and-energy
    section: '6.4'
    tier: F
    refs: [EL4]
    statement: 'An appliance on the 230 V supply takes a current of 0.60 A for 5.0 minutes. Calculate the power and the energy transferred.'
    answer_label: 'Power and energy transferred'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: "V * I"
          values:
            V: {value: "230", unit: "V"}
            I: {value: "0.60", unit: "A"}
          answer: {value: "138", unit: "W"}
        - kind: dimensions
          expression: "P * t"
          values:
            P: {value: "138", unit: "W"}
            t: {value: "300", unit: "s"}
          answer: {value: "41400", unit: "J"}
        - {kind: sigfigs, value: "41400", figures: 2, answer: "4.1e4", convention: round-once}
    answer_text: '$P = VI = 230 \times 0.60 = 138\,\text{W}$. Then $5.0\,\text{minutes} = 300\,\text{s}$, so $E = Pt = 138 \times 300 = 41\,400\,\text{J} = 4.1 \times 10^4\,\text{J}$.'

  - id: w17-spark-current
    section: '6.5'
    tier: F
    refs: [EL5]
    statement: 'A spark transfers a charge of 3.0 μC in a time of 1.5 μs. Calculate the average current.'
    answer_label: 'Average current of the spark'
    check:

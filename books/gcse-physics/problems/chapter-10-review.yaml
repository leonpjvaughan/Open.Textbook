# Mixed practice for the Chapter 10 Review.
#
# The review resolves the chapter problem and then interleaves Chapter 10 with
# earlier chapters: speed from Chapter 3, the wave equation from Chapter 4,
# kinetic energy from Chapter 1, weight from Chapter 2, and fusion from
# Chapter 9. The opening items are the chapter problem itself. Each calculation
# is checked twice where a quantity is reported: the exact magnitude and
# dimension by `dimensions`, and the one rounding by `sigfigs`. The `structured`
# records stand where a computer cannot go: they prove that a model answer
# contains the declared ideas, in order, and nothing more.
#
# Honest limit (research/curriculum/physics-verifier-gaps.md §6): the verifier
# proves arithmetic and dimensions, not physics.
chapter: 10
problems:
  - id: r1-chapter-signal
    section: Review
    tier: F
    refs: [SP1]
    statement: 'The telescope orbits 540 km above the Earth. A radio signal travels at $3.0 \times 10^{8}\,\text{m/s}$. Calculate the time for a signal from the telescope to reach the ground.'
    answer_label: 'Time for the telescope signal to reach the ground'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: 'd / v'
          values:
            d: {value: '5.4e5', unit: 'm'}
            v: {value: '3.0e8', unit: 'm/s'}
          answer: {value: '1.8e-3', unit: 's'}
        - {kind: sigfigs, value: '1.8e-3', figures: 2, answer: '1.8e-3', convention: round-once}
    answer_text: '$540\,\text{km} = 5.4 \times 10^{5}\,\text{m}$. $t = \dfrac{5.4 \times 10^{5}}{3.0 \times 10^{8}} = 1.8 \times 10^{-3}\,\text{s}$, which is 1.8 ms.'

  - id: r2-chapter-orbit
    section: Review
    tier: F
    refs: [SP1]
    statement: 'Explain what keeps the telescope in a circular orbit around the Earth, and describe the direction of the force.'
    answer_label: 'What keeps the telescope in orbit'
    check:
      kind: structured
      requires: [gravity-force, towards-centre, bends-path]
      concepts: [gravity, orbit]
      points:
        - id: gravity-force
          text: 'Gravity provides a force of attraction between the telescope and the Earth.'
          concepts: [gravity]
        - id: towards-centre
          text: 'The force is directed towards the centre of the Earth.'
          concepts: [gravity]
        - id: bends-path
          text: 'The force changes the direction of the telescope, so its path curves into a circle instead of a straight line.'
          concepts: [orbit]

  - id: r3-chapter-sun
    section: Review
    tier: F
    refs: [SP1]
    statement: 'The telescope photographs new stars forming. Explain why a star such as the Sun stays the same size for billions of years.'
    answer_label: 'Why a star stays the same size'
    check:
      kind: structured
      requires: [outward, inward, balance]
      concepts: [fusion, gravity, equilibrium]
      points:
        - id: outward
          text: 'Fusion reactions in the core release energy, which pushes outwards and tends to make the star expand.'
          concepts: [fusion]
        - id: inward
          text: 'Gravity pulls the material of the star inwards and tends to make it collapse.'
          concepts: [gravity]
        - id: balance
          text: 'The outward push and the inward pull are equal, so the star is in equilibrium and stays the same size.'
          concepts: [equilibrium]

  - id: r4-chapter-redshift
    section: Review
    tier: F
    refs: [SP2]
    statement: 'The telescope photographs distant galaxies. Explain what is meant by the red-shift of the light from a galaxy, and what it shows.'
    answer_label: 'Red-shift and what it shows'
    check:
      kind: structured
      requires: [longer-wavelength, moving-away, further-faster]
      concepts: [red-shift, universe]
      points:
        - id: longer-wavelength
          text: 'The wavelength of the light is longer than the wavelength of the same light measured in a laboratory.'
          concepts: [wavelength]
        - id: moving-away
          text: 'The red-shift shows that the galaxy is moving away from the Earth.'
          concepts: [red-shift]
        - id: further-faster
          text: 'The further away a galaxy is, the faster it is moving away, which is evidence that the universe is expanding.'
          concepts: [universe]

  - id: r5-chapter-big-bang
    section: Review
    tier: F
    refs: [SP2]
    statement: 'State what the Big Bang model says about the start of the universe, and explain how red-shift supports it.'
    answer_label: 'The Big Bang model and the evidence'
    check:
      kind: structured
      requires: [hot-dense, expansion, evidence]
      concepts: [big-bang, red-shift]
      points:
        - id: hot-dense
          text: 'The universe began from a very small region that was extremely hot and dense.'
          concepts: [big-bang]
        - id: expansion
          text: 'The universe has been expanding ever since.'
          concepts: [big-bang]
        - id: evidence
          text: 'Red-shift shows that the galaxies are moving apart, so the universe is expanding. This is evidence that supports the Big Bang model.'
          concepts: [red-shift]

  - id: r6-chapter-galaxy-time
    section: Review
    tier: F
    refs: [SP2]
    statement: 'One of the galaxies photographed by the telescope is $2.4 \times 10^{25}\,\text{m}$ from the Earth. Say which equation you will use, then calculate how long the light has taken to reach the Earth. Give your answer in seconds to 2 significant figures.'
    answer_label: 'Time for the light from the distant galaxy'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: 'd / v'
          values:
            d: {value: '2.4e25', unit: 'm'}
            v: {value: '3.0e8', unit: 'm/s'}
          answer: {value: '8.0e16', unit: 's'}
        - {kind: sigfigs, value: '8.0e16', figures: 2, answer: '8.0e16', convention: round-once}
        - {kind: approx, value: '2.54e9', target: '8.0e16 / 3.15e7', tolerance: '1e7'}
    answer_text: 'Use $\text{time} = \dfrac{\text{distance}}{\text{speed}}$. $t = \dfrac{2.4 \times 10^{25}}{3.0 \times 10^{8}} = 8.0 \times 10^{16}\,\text{s}$, which is about $2.5 \times 10^{9}$ years. We see the galaxy as it was 2.5 billion years ago.'

  - id: r7-chapter-solar-system
    section: Review
    tier: F
    refs: [SP1]
    statement: 'State the main features of our solar system, and say where the solar system sits in the universe.'
    answer_label: 'The main features of the solar system'
    check:
      kind: structured
      requires: [one-star, planets, moons, artificial, galaxy]
      concepts: [solar-system, galaxy]
      points:
        - id: one-star
          text: 'The solar system has one star, the Sun.'
          concepts: [solar-system]
        - id: planets
          text: 'Eight planets orbit the Sun, and dwarf planets also orbit the Sun.'
          concepts: [planet]
        - id: moons
          text: 'Natural satellites, called moons, orbit the planets.'
          concepts: [moon]
        - id: artificial
          text: 'Artificial satellites built by people also orbit the Earth and other bodies.'
          concepts: [artificial-satellite]
        - id: galaxy
          text: 'The solar system is a small part of the Milky Way galaxy, which contains billions of stars.'
          concepts: [galaxy]

  - id: r8-ht-velocity
    section: Review
    tier: H
    refs: [SP1]
    statement: 'The telescope moves at a constant speed in its orbit, but its velocity changes. Explain how this is possible.'
    answer_label: 'How the velocity changes while the speed stays the same'
    check:
      kind: structured
      requires: [velocity-direction, direction-changes, speed-constant]
      concepts: [velocity, speed, orbit]
      points:
        - id: velocity-direction
          text: 'Velocity is speed in a given direction.'
          concepts: [velocity]
        - id: direction-changes
          text: 'The direction of the telescope changes all the time as it goes round the orbit.'
          concepts: [orbit]
        - id: speed-constant
          text: 'The speed stays the same, but the changing direction means the velocity changes.'
          concepts: [speed, velocity]

  - id: r9-ht-radius
    section: Review
    tier: H
    refs: [SP1]
    statement: 'A small force from a thruster changes the speed of a satellite in a stable circular orbit. Explain why the radius of the orbit must change.'
    answer_label: 'Why the radius of a stable orbit must change'
    check:
      kind: structured
      requires: [match, change, radius]
      concepts: [orbit, gravity]
      points:
        - id: match
          text: 'A stable circular orbit needs a speed that matches its radius.'
          concepts: [orbit]
        - id: change
          text: 'When the speed changes, the satellite can no longer stay in a stable orbit at the same radius.'
          concepts: [orbit]
        - id: radius
          text: 'The radius must change until the speed and the radius match again, so the orbit is stable at the new radius.'
          concepts: [orbit, gravity]

  - id: r10-interleave-speed
    section: Review
    tier: F
    refs: [FO5]
    statement: 'A space probe travels $1.2 \times 10^{8}\,\text{m}$ in $4.0 \times 10^{2}\,\text{s}$. Say which equation you will use, then calculate its average speed. Give your answer to 2 significant figures.'
    answer_label: 'Average speed of the space probe'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: 'd / t'
          values:
            d: {value: '1.2e8', unit: 'm'}
            t: {value: '4.0e2', unit: 's'}
          answer: {value: '3.0e5', unit: 'm/s'}
        - {kind: sigfigs, value: '3.0e5', figures: 2, answer: '3.0e5', convention: round-once}
    answer_text: 'Use $\text{speed} = \dfrac{\text{distance}}{\text{time}}$. $v = \dfrac{1.2 \times 10^{8}}{4.0 \times 10^{2}} = 3.0 \times 10^{5}\,\text{m/s}$.'

  - id: r11-interleave-wave
    section: Review
    tier: F
    refs: [WA1]
    statement: 'A radio signal from a satellite has a frequency of $6.0 \times 10^{14}\,\text{Hz}$ and a wavelength of $5.0 \times 10^{-7}\,\text{m}$. Calculate the speed of the signal. Give your answer to 2 significant figures.'
    answer_label: 'Speed of the radio signal'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: 'f * lam'
          values:
            f: {value: '6.0e14', unit: 'Hz'}
            lam: {value: '5.0e-7', unit: 'm'}
          answer: {value: '3.0e8', unit: 'm/s'}
        - {kind: sigfigs, value: '3.0e8', figures: 2, answer: '3.0e8', convention: round-once}
    answer_text: 'Use the wave equation $v = f\lambda = 6.0 \times 10^{14} \times 5.0 \times 10^{-7} = 3.0 \times 10^{8}\,\text{m/s}$. This is the speed of light in a vacuum, which is what we expect for a radio wave.'

  - id: r12-interleave-kinetic
    section: Review
    tier: F
    refs: [EN1]
    statement: 'A satellite of mass 1500 kg orbits at a speed of 20 m/s at one point in a transfer orbit. Calculate the energy in its kinetic store. Give your answer to 2 significant figures.'
    answer_label: 'Energy in the kinetic store of the satellite'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: '0.5 * m * v**2'
          values:
            m: {value: '1500', unit: 'kg'}
            v: {value: '20', unit: 'm/s'}
          answer: {value: '300000', unit: 'J'}
        - {kind: sigfigs, value: '300000', figures: 2, answer: '3.0e5', convention: round-once}
    answer_text: '$E_k = \tfrac{1}{2}mv^2 = 0.5 \times 1500 \times 20^2 = 300000\,\text{J}$, so $3.0 \times 10^{5}\,\text{J}$ to 2 significant figures.'

  - id: r13-interleave-weight
    section: Review
    tier: F
    refs: [FO1]
    statement: 'An astronaut has a mass of 70 kg. The gravitational field strength on the Moon is 1.6 N/kg. Calculate the weight of the astronaut on the Moon. Give your answer to 2 significant figures.'
    answer_label: 'Weight of the astronaut on the Moon'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: 'm * g'
          values:
            m: {value: '70', unit: 'kg'}
            g: {value: '1.6', unit: 'N/kg'}
          answer: {value: '112', unit: 'N'}
        - {kind: sigfigs, value: '112', figures: 2, answer: '1.1e2', convention: round-once}
    answer_text: '$W = mg = 70 \times 1.6 = 112\,\text{N}$, so $1.1 \times 10^{2}\,\text{N}$ to 2 significant figures. The mass is still 70 kg, because mass does not change with position.'

  - id: r14-interleave-fusion
    section: Review
    tier: F
    refs: [AT4]
    statement: 'Fusion happens in the core of a star such as the Sun. Describe the process of nuclear fusion and explain why it releases energy.'
    answer_label: 'Fusion in a star'
    check:
      kind: structured
      requires: [joining, mass-to-energy, star-core]
      concepts: [fusion, star]
      points:
        - id: joining
          text: 'Fusion joins two light nuclei, such as hydrogen nuclei, to form a heavier nucleus, such as helium.'
          concepts: [fusion]
        - id: mass-to-energy
          text: 'Some of the mass is converted into the energy of radiation, which is why energy is released.'
          concepts: [fusion]
        - id: star-core
          text: 'The core of a star is hot and dense enough for this to happen continuously.'
          concepts: [star]

  - id: r15-method-choice
    section: Review
    tier: F
    refs: [SP1, SP2]
    statement: 'A television programme makes two claims: that a satellite stays in orbit because the Earth pulls on it, and that the universe is expanding because distant galaxies are red-shifted. Say which idea supports each claim, and explain each one in one sentence.'
    answer_label: 'The idea behind each claim'
    check:
      kind: structured
      requires: [gravity-claim, redshift-claim]
      concepts: [gravity, orbit, red-shift, universe]
      points:
        - id: gravity-claim
          text: 'The first claim uses gravity. Gravity provides the force towards the centre of the orbit, which bends the path of the satellite into a circle.'
          concepts: [gravity, orbit]
        - id: redshift-claim
          text: 'The second claim uses red-shift. The wavelength of the light from a receding galaxy is longer, and the further away a galaxy is the faster it recedes, which is evidence that the universe is expanding.'
          concepts: [red-shift, universe]

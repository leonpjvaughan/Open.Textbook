# GCSE Physics equations and data — source of truth.
#
# One item per equation per board spelling, because the boards differ and
# BOOKLETS.md forbids normalising. The widget shows only the items whose
# `provision` includes the selected board, so a reader sees exactly their own
# board's sheet. `group` is one of:
#   given    - printed on the board's equations sheet
#   question - supplied inside the relevant question rather than on the sheet
#   know     - not given; the reader must have it (units, prefixes, symbols,
#              definitions, and the typical values the board says to recall)
#
# For the current specifications no *equation* must be memorised: DfE confirmed
# on 26 February 2026 that students do not need to memorise equations for GCSE
# physics for the lifetime of the current specifications, and Ofqual's 5 May 2026
# decision requires the sheets to keep being provided. So there is no "recall"
# group of equations. The `know` group is units, prefixes and values.
#
# Evidence: research/curriculum/physics-equations-and-data.md and each board's
# own sheet, recorded in sources.yaml. The sheets are all-rights-reserved; the
# booklet reproduces what every candidate is given, which is the one use
# BOOKLETS.md requires.
meta:
  title: GCSE Physics — equations and data
  panel_title: Equations & tables
  short: Equations
  tab_label: Equations
  item_label: equations
  search_placeholder: Search equations…
  series: exams in 2026
  default_board: aqa
  tiered: true
  note: >-
    There is no national booklet: each board prints its own equations sheet, and
    the boards differ. Provision shown here is taken from the sheets recorded in
    sources.yaml. AQA's 2026 sheet prints all 35 equations; Edexcel's equation
    list prints every equation; OCR's 2027 sheet prints every recall and select
    equation. Because no equation must be memorised, every equation is in the
    `given` group.
  provenance:
    aqa: "AQA Physics Equations Sheet, GCSE Physics (8463), for use in June 2026 only"
    edexcel: "Pearson Edexcel GCSE Physics Equations List, May–June 2024 (1PH0); a 2026 list was not retrieved"
    ocr: "OCR GCSE Physics A (J249) Equation Sheet, June 2027"
  basis: >-
    DfE confirmed on 26 February 2026 that students do not need to memorise
    equations for GCSE physics or combined science for the lifetime of the
    current specifications, and Ofqual decided on 5 May 2026 that boards must
    keep providing the sheets and must not set questions answerable solely by
    transferring information from them. The recall/select appendices in the
    specifications predate the 2022 policy and are not the provision. AQA's and
    OCR's current sheets were read directly. Edexcel's exam-support page states
    an equation list is provided in the exam room; the only machine-readable
    list is the May–June 2024 one, so Edexcel's provision here rests on that
    document and must be re-verified when Pearson publishes a later list.
  boards:
    aqa: {name: AQA, code: "8463"}
    edexcel: {name: Edexcel, code: "1PH0"}
    ocr: {name: OCR, code: "J249/J259"}
  groups:
    given: {label: "On your equations sheet", chip: Given, tone: accent}
    question: {label: "May be given in the question", chip: In question, tone: muted}
    know: {label: "You must know", chip: Must know, tone: warn}


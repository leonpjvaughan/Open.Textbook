chapter: 9
problems:
- id: p9-3-transverse
  section: '9.3'
  tier: O
  refs:
  - '2.2'
  statement: >-
    Describe a transverse wave, and give two examples of one.
  answer_label: A transverse wave
  check:
    kind: structured
    requires:
    - direction
    - examples
    concepts:
    - perpendicular
    - examples
    points:
    - id: direction
      text: in a transverse wave the particles of the medium vibrate at right angles to the
        direction the wave travels
      concepts:
      - perpendicular
    - id: examples
      text: a wave on a string and a light wave are transverse; a wave on the surface of water
        is also mostly transverse
      concepts:

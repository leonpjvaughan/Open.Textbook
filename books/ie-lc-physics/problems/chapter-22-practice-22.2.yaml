# Leaving Certificate Physics, Chapter 22, section 22.2.
#
# This bank covers research from secondary sources: judging reliability, spotting
# bias, telling primary data from secondary data, comparing two sources that
# disagree, and recording a source so it can be cited.
#
# Honest limit: `structured` proves only that a model answer contains its declared
# steps and concepts, in order. It cannot judge the source, and the arithmetic
# checks prove the numbers, not the claims a source makes.
chapter: 22
problems:
  - id: p22-2-reliability
    section: '22.2'
    tier: O
    refs: ['1.3']
    statement: 'Describe two things you would check to judge whether a secondary source is reliable.'
    answer_label: 'Judging a source'
    check:
      kind: structured
      requires: [author, evidence]
      concepts: [expertise, motive, method]
      points:
        - id: author
          text: 'Check who wrote it and why, because a source selling a product has a reason to favour it.'
          concepts: [expertise, motive]
        - id: evidence
          text: 'Check whether the source reports how the data were collected, because a figure with no method cannot be checked.'
          concepts: [method]
    answer_text: 'Check who wrote the source and why, because a seller has a reason to favour its own product. Check whether it reports how the data were collected, because a figure with no method cannot be checked.'
  - id: p22-2-bias
    section: '22.2'
    tier: O
    refs: ['1.3']
    statement: 'Explain what bias in a source means, and give one sign of it.'
    answer_label: 'Bias in a source'
    check:
      kind: structured
      requires: [definition, sign, effect]
      concepts: [selects, no-method, opposite]
      points:
        - id: definition
          text: 'A source is biased when it selects or presents evidence to favour one conclusion.'
          concepts: [selects]
        - id: sign
          text: 'One sign is a claim with no method, such as a percentage with no number of measurements behind it.'
          concepts: [no-method]
        - id: effect
          text: 'Bias matters because the reader cannot tell whether the evidence would support the opposite conclusion.'
          concepts: [opposite]
    answer_text: 'A source is biased when it selects or presents evidence to favour one conclusion. One sign is a claim with no method, such as a percentage with no number of measurements behind it. The reader then cannot tell whether the evidence would support the opposite conclusion.'
  - id: p22-2-primary-secondary
    section: '22.2'
    tier: O
    refs: ['1.3']
    statement: 'State the difference between primary data and secondary data, and give one example of each.'
    answer_label: 'Primary and secondary data'
    check:
      kind: structured
      requires: [primary, secondary, example]
      concepts: [collected-by-you, collected-by-other, example]
      points:
        - id: primary
          text: 'Primary data are readings you take yourself, such as a voltage you measure with a voltmeter.'
          concepts: [collected-by-you, example]
        - id: secondary
          text: 'Secondary data are readings somebody else took, such as a table in a textbook.'
          concepts: [collected-by-other, example]
        - id: example
          text: 'An example of each is your own timing of a fall and a published value of g.'
          concepts: [example]
    answer_text: 'Primary data are readings you take yourself, such as a voltage you measure with a voltmeter. Secondary data are readings somebody else took, such as a table in a textbook.'
  - id: p22-2-percentage
    section: '22.2'
    tier: O
    refs: ['1.3']
    statement: "A manufacturer states that a lamp is 20% efficient. An independent test finds an efficiency of 18%. Taking the manufacturer's value as the reference, calculate the percentage difference between the two values."
    answer_label: 'Percentage difference'
    check:
      kind: evaluate
      expression: (20 - 18) / 20 * 100
      answer: '10'
    answer_text: 'The difference is $20\% - 18\% = 2\%$. As a percentage of the reference value, $\dfrac{2}{20} \times 100\% = 10\%$. A difference of 10% is worth a comment in the report.'
  - id: p22-2-convert
    section: '22.2'
    tier: O
    refs: ['1.3']
    statement: 'A data sheet quotes the power of a solar panel as 1.2 kW. Convert it to watts.'
    answer_label: 'Power in watts'
    check:
      kind: convert
      value: '1.2'
      from: kW
      to: W
      answer: '1200'
    answer_text: 'The prefix kilo means a thousand, so $1.2\,\text{kW} = 1.2 \times 1000 = 1200\,\text{W}$.'
  - id: p22-2-record
    section: '22.2'
    tier: O
    refs: ['1.3']
    statement: 'State three pieces of information you should record for every secondary source you use.'
    answer_label: 'What to record about a source'
    check:
      kind: structured
      requires: [author, date, where]
      concepts: [author, date, location]
      points:
        - id: author
          text: 'Record who wrote it, including the organisation if no person is named.'
          concepts: [author]
        - id: date
          text: 'Record when it was published or last updated, because older data may be out of date.'
          concepts: [date]
        - id: where
          text: 'Record the title and the address where you found it, so you can find it again and cite it.'
          concepts: [location]
    answer_text: 'Record who wrote it, when it was published or last updated, and the title and address where you found it. Those three let you find the source again and cite it honestly.'
  - id: p22-2-disagree
    section: '22.2'
    tier: O
    refs: ['1.3']
    statement: 'Two sources give different values for the efficiency of the same device. Describe how you would decide which value to use.'
    answer_label: 'Choosing between two sources'
    check:
      kind: structured
      requires: [compare, method, conclusion]
      concepts: [method, independence, uncertainty]
      points:
        - id: compare
          text: 'Compare how each value was obtained, and whether the source states its method and its sample.'
          concepts: [method]
        - id: method
          text: 'Prefer the source that states its method, has been checked by others, and has no product to sell.'
          concepts: [independence]
        - id: conclusion
          text: 'If neither value can be checked, report both and say why the value is uncertain.'
          concepts: [uncertainty]
    answer_text: 'Compare how each value was obtained and whether the source states its method. Prefer the source that states its method, has been checked by others and has no product to sell. If neither can be checked, report both values and say why the value is uncertain.'
  - id: p22-2-two-values
    section: '22.2'
    tier: O
    refs: ['1.3']
    statement: 'One source quotes a power of 30 W and a later source gives 33 W. Taking the first value as the reference, calculate the percentage difference between them.'
    answer_label: 'Percentage difference'
    check:
      kind: evaluate
      expression: (33 - 30) / 30 * 100
      answer: '10'
    answer_text: 'The difference is $33 - 30 = 3\,\text{W}$. As a percentage of the reference value, $\dfrac{3}{30} \times 100\% = 10\%$. A difference of 10% is large enough to mention in the report.'

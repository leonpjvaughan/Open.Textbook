# Leaving Certificate Physics, Chapter 6, section 6.4 (strand 1 outcomes 1.5 and 1.6).
#
# The physics oracle checks two claims whenever a quantity is asked for:
# `dimensions` proves the exact magnitude *and* the unit, and `sigfigs` proves the
# rounding to the figures the data support. Both are written out, because a rounded
# answer is never equal to the exact one. A value built on a square root or on pi
# carries a `tolerance`, so the check proves the arithmetic within the precision of
# the data rather than against a number that was rounded by hand.
#
# Honest limit: this proves the arithmetic and the dimensions, not the physics. A
# dimensionally consistent, arithmetically correct, physically absurd answer would
# pass. The `structured` records prove only that a model answer contains the
# declared steps and concepts, in order — not that the physics in them is right.
chapter: 6
problems:
- id: p6-4-orbital-speed
  section: '6.4'
  tier: O
  refs:
  - '1.5'
  - '1.6'
  statement: A satellite orbits 4.22e7 m from the centre of the Earth. Calculate its orbital speed. Take
    M = 5.97e24 kg.
  answer_label: Orbital speed
  check:
    kind: all
    checks:
    - kind: dimensions
      expression: sqrt(G * M / r)
      values:
        G:
          value: '6.67e-11'
          unit: N m^2 kg^-2
        M:
          value: '5.97e24'
          unit: kg
        r:
          value: '4.22e7'
          unit: m
      tolerance: '5'
      answer:
        value: '3072'
        unit: m/s
    - kind: sigfigs
      value: sqrt(6.67e-11 * 5.97e24 / 4.22e7)
      figures: 2
      tolerance: '5'
      answer: 3.1e3
      convention: round-once
  answer_text: $v = \sqrt{\dfrac{GM}{r}} = \sqrt{\dfrac{6.67 \times 10^{-11} \times 5.97 \times
    10^{24}}{4.22 \times 10^{7}}} = 3.1 \times 10^{3}\,\text{m/s}$. The mass of the satellite does not
    appear in the formula, so it does not affect the speed.
- id: p6-4-period
  section: '6.4'
  tier: O
  refs:
  - '1.5'
  - '1.6'
  statement: Calculate the period of a satellite at 4.22e7 m from the centre of the Earth. Take
    M = 5.97e24 kg.
  answer_label: Period
  check:
    kind: all
    checks:
    - kind: approx
      value: 2 * pi * 4.22e7 / sqrt(6.67e-11 * 5.97e24 / 4.22e7)
      target: '8.63e4'
      tolerance: '100'
    - kind: sigfigs
      value: 2 * pi * 4.22e7 / sqrt(6.67e-11 * 5.97e24 / 4.22e7)
      figures: 2
      tolerance: '100'
      answer: 8.6e4
      convention: round-once
  answer_text: $T = \dfrac{2\pi r}{v} = \dfrac{2\pi \times 4.22 \times 10^{7}}{3.1 \times
    10^{3}} = 8.6 \times 10^{4}\,\text{s}$, which is 24 hours to two significant figures. That is why
    this orbit is the geostationary one.
- id: p6-4-kepler-ratio
  section: '6.4'
  tier: O
  refs:
  - '1.5'
  - '1.6'
  statement: One satellite has an orbital radius nine times that of another around the same planet.
    Calculate the ratio of their periods.
  answer_label: Ratio of the periods
  plays: satellite-period
  check:
    kind: dimensions
    expression: sqrt(r**3)
    values:
      r:
        value: '9'
    answer:
      value: '27'
  answer_text: Kepler's third law gives $T^2 \propto r^3$, so $\dfrac{T_2}{T_1} = 9^{3/2} = 27$. The
    period of the second satellite is 27 times the period of the first.
- id: p6-4-leo-speed
  section: '6.4'
  tier: O
  refs:
  - '1.5'
  - '1.6'
  statement: A satellite orbits 400 km above the Earth's surface, so its distance from the centre is
    6.77e6 m. Calculate its orbital speed.
  answer_label: Orbital speed in low orbit
  check:
    kind: all
    checks:
    - kind: dimensions
      expression: sqrt(G * M / r)
      values:
        G:
          value: '6.67e-11'
          unit: N m^2 kg^-2
        M:
          value: '5.97e24'
          unit: kg
        r:
          value: '6.77e6'
          unit: m
      tolerance: '5'
      answer:
        value: '7669'
        unit: m/s
    - kind: sigfigs
      value: sqrt(6.67e-11 * 5.97e24 / 6.77e6)
      figures: 2
      tolerance: '5'
      answer: 7.7e3
      convention: round-once
  answer_text: $v = \sqrt{\dfrac{GM}{r}} = \sqrt{\dfrac{3.98 \times 10^{14}}{6.77 \times 10^{6}}} =
    7.7 \times 10^{3}\,\text{m/s}$. A low orbit is faster than a high one, because the satellite is
    closer to the Earth.
- id: p6-4-leo-period
  section: '6.4'
  tier: O
  refs:
  - '1.5'
  - '1.6'
  statement: Calculate the period of the satellite in low orbit from the previous question, in minutes.
    Its orbital speed is 7.7e3 m/s.
  answer_label: Period in minutes
  check:
    kind: all
    checks:
    - kind: approx
      value: 2 * pi * 6.77e6 / 7.7e3 / 60
      target: '92.1'
      tolerance: '0.4'
    - kind: sigfigs
      value: 2 * pi * 6.77e6 / 7.7e3 / 60
      figures: 2
      tolerance: '0.4'
      answer: '92'
      convention: round-once
  answer_text: $T = \dfrac{2\pi r}{v} = \dfrac{2\pi \times 6.77 \times 10^{6}}{7.7 \times 10^{3}} =
    5.5 \times 10^{3}\,\text{s}$, which is 92 minutes. The space station orbits at about this height and
    circles the Earth about 16 times a day.
- id: p6-4-geostationary
  section: '6.4'
  tier: O
  refs:
  - '1.5'
  - '1.6'
  statement: State the three conditions for a satellite to be geostationary, and give one use of a
    geostationary orbit.
  answer_label: Conditions for a geostationary orbit
  check:
    kind: structured
    requires:
    - period
    - equator
    - direction
    - use
    concepts:
    - 24-hours
    - fixed-point
    - communications
    points:
    - id: period
      text: the period must be 24 hours, so the satellite turns once while the Earth turns once
      concepts:
      - 24-hours
    - id: equator
      text: the orbit must be above the equator, so the satellite does not drift north and south
      concepts:
      - fixed-point
    - id: direction
      text: the satellite must move in the same direction as the Earth spins, from west to east
      concepts:
      - fixed-point
    - id: use
      text: a dish can point at a fixed spot in the sky, so the orbit suits television, telephone and
        weather satellites
      concepts:
      - communications
  answer_text: The period must be exactly 24 hours. The orbit must be above the equator. The satellite
    must move in the same direction as the Earth spins, from west to east. A dish on the ground can then
    point at a fixed spot and never move, which is what television, telephone and weather satellites
    need.
- id: p6-4-weightless
  section: '6.4'
  tier: H
  refs:
  - '1.5'
  - '1.6'
  statement: Explain why an astronaut in orbit feels weightless, even though the gravitational force on
    her has not fallen to zero.
  answer_label: Why an astronaut floats
  check:
    kind: structured
    requires:
    - free-fall
    - no-push
    - gravity-remains
    concepts:
    - same-acceleration
    - field-strength
    points:
    - id: free-fall
      text: the astronaut and the spacecraft are both in free fall towards the Earth with the same
        acceleration
      concepts:
      - same-acceleration
    - id: no-push
      text: they fall together, so the floor does not push on her and nothing presses on her
      concepts:
      - same-acceleration
    - id: gravity-remains
      text: gravity has not gone, and the field strength at the orbit is still about 8.7 N/kg
      concepts:
      - field-strength
  answer_text: The astronaut and the spacecraft are falling towards the Earth together, with the same
    acceleration. Because they fall at the same rate, the floor does not push on her and nothing presses
    on her, so she floats. Gravity has not disappeared. The field strength at the orbit is about
    8.7 N/kg, so her weight is nearly as large as on the ground. She feels weightless because she is in
    free fall.
- id: p6-4-geostationary-radius
  section: '6.4'
  tier: H
  refs:
  - '1.5'
  - '1.6'
  statement: Use Kepler's third law to calculate the radius of a geostationary orbit, taking the period
    as 24 hours. Take M = 5.97e24 kg.
  answer_label: Radius of the geostationary orbit
  check:
    kind: all
    checks:
    - kind: approx
      value: (6.67e-11 * 5.97e24 * (24 * 3600)**2 / (4 * pi**2))**(1/3)
      target: 4.22e7
      tolerance: '5e5'
    - kind: sigfigs
      value: (6.67e-11 * 5.97e24 * (24 * 3600)**2 / (4 * pi**2))**(1/3)
      figures: 3
      tolerance: '1e4'
      answer: 4.22e7
      convention: round-once
  answer_text: Rearranging $T^2 = \dfrac{4\pi^2r^3}{GM}$ gives $r = \left(\dfrac{GMT^2}{4\pi^2}\right)^{1/3}
    = \left(\dfrac{6.67 \times 10^{-11} \times 5.97 \times 10^{24} \times (8.64 \times
    10^{4})^2}{4\pi^2}\right)^{1/3} = 4.22 \times 10^{7}\,\text{m}$. That is about 36 000 km above the
    surface, so every geostationary satellite sits on the same ring.

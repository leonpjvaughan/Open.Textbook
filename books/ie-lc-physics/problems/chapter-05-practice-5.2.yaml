# Leaving Certificate Physics, Chapter 5, section 5.2 (strand 1 outcome 1.3).
#
# The physics oracle checks two claims whenever a quantity is asked for:
# `dimensions` proves the exact magnitude *and* the unit, and `sigfigs` proves the
# rounding to the figures the data support. Both are written out, because a rounded
# answer is never equal to the exact one. An integer that is two significant
# figures is written as `2.0e1`, since `20` is one figure.
#
# Honest limit: this proves the arithmetic and the dimensions, not the physics. A
# dimensionally consistent, arithmetically correct, physically absurd answer would
# pass. The two `structured` records prove only that a model answer contains the
# declared steps and concepts, in order — not that the physics in them is right.
chapter: 5
problems:
- id: p5-2-series
  section: '5.2'
  tier: O
  refs:
  - '1.3'
  statement: Two springs of spring constant 60 N/m and 30 N/m are joined end to end. Calculate the spring
    constant of the combination.
  answer_label: Spring constant of the combination
  check:
    kind: all
    checks:
    - kind: dimensions
      expression: 1 / (1/k1 + 1/k2)
      values:
        k1:
          value: '60'
          unit: N/m
        k2:
          value: '30'
          unit: N/m
      answer:
        value: '20'
        unit: N/m
    - kind: sigfigs
      value: '20'
      figures: 2
      answer: 2.0e1
      convention: round-once
  answer_text: $\dfrac{1}{k} = \dfrac{1}{60} + \dfrac{1}{30} = \dfrac{1}{20}$, so $k = 20\,\text{N/m}$.
    A combination in series is *easier* to stretch than either spring, so the answer is smaller than both.
- id: p5-2-parallel
  section: '5.2'
  tier: O
  refs:
  - '1.3'
  statement: Two springs of spring constant 60 N/m and 30 N/m are joined side by side so that they stretch
    together. Calculate the spring constant of the combination.
  answer_label: Spring constant of the combination
  check:
    kind: all
    checks:
    - kind: dimensions
      expression: k1 + k2
      values:
        k1:
          value: '60'
          unit: N/m
        k2:
          value: '30'
          unit: N/m
      answer:
        value: '90'
        unit: N/m
    - kind: sigfigs
      value: '90'
      figures: 2
      answer: 9.0e1
      convention: round-once
  answer_text: $k = k_1 + k_2 = 60 + 30 = 90\,\text{N/m}$. Two springs sharing the load need less force
    each for the same extension, so the combination is *stiffer* than either spring and the answer is
    larger than both.
- id: p5-2-compare
  section: '5.2'
  tier: H
  refs:
  - '1.3'
  statement: Explain why the spring constant of two springs in series is smaller than either spring constant,
    while in parallel it is larger.
  answer_label: Series compared with parallel
  check:
    kind: structured
    requires:
    - series
    - parallel
    - conclusion
    concepts:
    - same-force
    - add
    - less-stiff
    - shared
    - stiffer
    points:
    - id: series
      text: in series the same force acts on each spring, so the extensions add
      concepts:
      - same-force
      - add
      - less-stiff
    - id: parallel
      text: in parallel the load is shared, so each spring carries only part of the force and stretches
        less
      concepts:
      - shared
      - stiffer
    - id: conclusion
      text: by k = F / x, a larger extension for the same force means a smaller spring constant, and a
        smaller extension means a larger one
      concepts:
      - less-stiff
      - stiffer
  answer_text: In series the same force acts on each spring, and the extensions add. So the combination
    stretches further than either spring alone for that force, which by $k = F/x$ means a smaller spring
    constant. In parallel the load is shared, so each spring carries only part of the force and each stretches
    less. The combination stretches less than either spring alone for the same total force, which means
    a larger spring constant.

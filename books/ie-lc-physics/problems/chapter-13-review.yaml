# Mixed practice for the Chapter 13 Review.
#
# Eleven questions, one record each, in the order they appear on the Review page.
# Every record that asks for a number pairs a `dimensions` check, which proves the
# magnitude and the unit, with a `sigfigs` check, which proves the rounding to the
# figures the data support. Questions 2, 9, 10 and 11 ask for a direction, a choice
# of relationship or a comparison of methods, so each carries a `structured`
# component, and no numeric check is invented for the two questions that have no
# number in them at all.
#
# Honest limit: this proves arithmetic, dimensions and the declared conventions,
# not physics. A `structured` check proves only that a model answer contains its
# declared steps and concepts, in order. Questions 9 and 10 ask which relationship
# to use: the verifier can prove that the reason is stated, and nothing about
# whether it is the right one.
#
# The data are read as the Review page states them: the Coulomb constant is
# 9.0e9 N m^2 C^-2 and the charge on one electron is 1.6e-19 C. Question 1 asks for
# the size of the charge; the answer text says that the body carries it as a
# negative charge, because it gained electrons.
chapter: 13
problems:
  - id: c13-r1-electrons-to-charge
    section: Review
    tier: O
    refs: ['3.1']
    statement: 'A body gains $1.5 \times 10^{14}$ electrons. Calculate its charge.'
    answer_label: 'The charge, and its sign'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: n * e
          values:
            n: {value: '1.5e14'}
            e: {value: '1.6e-19', unit: C}
          answer: {value: '2.4e-5', unit: C}
        - kind: sigfigs
          value: '1.5e14 * 1.6e-19'
          figures: 2
          answer: '2.4e-5'
          convention: round-once
    answer_text: 'Each electron carries $1.6 \times 10^{-19}\,\text{C}$, so the size of the charge is $q = ne = 1.5 \times 10^{14} \times 1.6 \times 10^{-19} = 2.4 \times 10^{-5}\,\text{C}$. The body gained electrons, so its charge is negative: $-2.4 \times 10^{-5}\,\text{C}$, which is $-24\,\mu\text{C}$. Gaining electrons always makes a body negative, and the size of the charge is a whole number of electron charges, because charge is quantised.'

  - id: c13-r2-coulomb-force
    section: Review
    tier: O
    refs: ['3.1']
    statement: 'Two charges of $+2.0\,\mu\text{C}$ and $+4.0\,\mu\text{C}$ are $0.20\,\text{m}$ apart. Calculate the force between them and state its direction.'
    answer_label: 'The force, and its direction'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: k * q1 * q2 / d**2
          values:
            k: {value: '9.0e9', unit: N m^2 C^-2}
            q1: {value: '2.0e-6', unit: C}
            q2: {value: '4.0e-6', unit: C}
            d: {value: '0.20', unit: m}
          answer: {value: '1.8', unit: N}
        - kind: sigfigs
          value: '9.0e9 * 2.0e-6 * 4.0e-6 / 0.20**2'
          figures: 2
          answer: '1.8'
          convention: round-once
        - kind: structured
          requires: [state-force, direction, reason]
          concepts: [coulomb-law, like-charges-repel]
          points:
            - id: state-force
              text: 'The force is 1.8 N.'
              concepts: [coulomb-law]
            - id: direction
              text: 'It is a repulsive force, so each charge is pushed directly away from the other along the line joining them.'
              concepts: [like-charges-repel]
            - id: reason
              text: 'Both charges are positive, and like charges repel. The force is small because the charges are only microcoulombs and a fifth of a metre apart.'
              concepts: [like-charges-repel, coulomb-law]
    answer_text: 'Coulomb''s law gives $F = \dfrac{kq_1q_2}{d^2} = \dfrac{9.0 \times 10^{9} \times 2.0 \times 10^{-6} \times 4.0 \times 10^{-6}}{0.20^2} = \dfrac{0.072}{0.040} = 1.8\,\text{N}$. Both charges are positive, so like charges repel: each is pushed directly away from the other, along the line joining them. The force is equal in size on both, because Newton''s third law pairs them.'

  - id: c13-r3-inverse-square
    section: Review
    tier: O
    refs: ['3.1']
    statement: 'Two charges repel with a force of $0.60\,\text{N}$ at a separation of $0.20\,\text{m}$. Calculate the force at a separation of $0.40\,\text{m}$.'
    answer_label: 'The force at twice the separation'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: F * (d1 / d2)**2
          values:
            F: {value: '0.60', unit: N}
            d1: {value: '0.20', unit: m}
            d2: {value: '0.40', unit: m}
          answer: {value: '0.15', unit: N}
        - kind: sigfigs
          value: '0.60 * (0.20 / 0.40)**2'
          figures: 2
          answer: '0.15'
          convention: round-once
    answer_text: 'The force follows an inverse-square law, $F \propto \dfrac{1}{d^2}$. Doubling the separation multiplies $d^2$ by four, so the force is divided by four: $0.60 \div 4 = 0.15\,\text{N}$. The charges are unchanged, so only the distance matters here.'

  - id: c13-r4-field-strength
    section: Review
    tier: O
    refs: ['3.2']
    statement: 'A charge of $4.0\,\mu\text{C}$ experiences a force of $0.16\,\text{N}$ at a point in a field. Calculate the field strength at that point.'
    answer_label: 'The field strength'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: F / q
          values:
            F: {value: '0.16', unit: N}
            q: {value: '4.0e-6', unit: C}
          answer: {value: '4.0e4', unit: V/m}
        - kind: sigfigs
          value: '0.16 / 4.0e-6'
          figures: 2
          answer: '4.0e4'
          convention: round-once
    answer_text: 'The field strength is the force per unit charge, $E = \dfrac{F}{q} = \dfrac{0.16}{4.0 \times 10^{-6}} = 4.0 \times 10^{4}\,\text{N/C}$, and a newton per coulomb is the same as a volt per metre. The field strength belongs to the point in space, not to the charge put there: a larger test charge would feel a larger force, in the same proportion.'

  - id: c13-r5-uniform-field
    section: Review
    tier: O
    refs: ['3.2']
    statement: 'Two parallel plates are $3.0\,\text{mm}$ apart with a potential difference of $600\,\text{V}$. Calculate the field strength between them.'
    answer_label: 'The field strength between the plates'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: V / d
          values:
            V: {value: '600', unit: V}
            d: {value: '3.0e-3', unit: m}
          answer: {value: '2.0e5', unit: V/m}
        - kind: sigfigs
          value: '600 / 3.0e-3'
          figures: 2
          answer: '2.0e5'
          convention: round-once
    answer_text: 'Between parallel plates the field is uniform, so $E = \dfrac{V}{d} = \dfrac{600}{3.0 \times 10^{-3}} = 2.0 \times 10^{5}\,\text{V/m}$. The gap must be in metres before the division, or the answer is wrong by a factor of a thousand. The field points from the positive plate to the negative one, and its strength is the same everywhere between them.'

  - id: c13-r6-point-charge-field
    section: Review
    tier: O
    refs: ['3.2']
    statement: 'A point charge of $+3.0\,\mu\text{C}$ is isolated in air. Calculate the field strength $0.10\,\text{m}$ from it.'
    answer_label: 'The field strength at that distance'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: k * Q / d**2
          values:
            k: {value: '9.0e9', unit: N m^2 C^-2}
            Q: {value: '3.0e-6', unit: C}
            d: {value: '0.10', unit: m}
          answer: {value: '2.7e6', unit: V/m}
        - kind: sigfigs
          value: '9.0e9 * 3.0e-6 / 0.10**2'
          figures: 2
          answer: '2.7e6'
          convention: round-once
    answer_text: 'The field of a point charge is $E = \dfrac{kQ}{d^2} = \dfrac{9.0 \times 10^{9} \times 3.0 \times 10^{-6}}{0.10^2} = 2.7 \times 10^{6}\,\text{V/m}$. The field points away from the charge, because the charge is positive. This is the inverse-square field of a point charge, not the uniform field between plates, and the two are used for different situations.'

  - id: c13-r7-potential-difference
    section: Review
    tier: O
    refs: ['3.2']
    statement: 'A charge of $2.0\,\mu\text{C}$ is moved between two points, and the work done is $5.0 \times 10^{-4}\,\text{J}$. Calculate the potential difference between the points.'
    answer_label: 'The potential difference'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: W / q
          values:
            W: {value: '5.0e-4', unit: J}
            q: {value: '2.0e-6', unit: C}
          answer: {value: '250', unit: V}
        - kind: sigfigs
          value: '5.0e-4 / 2.0e-6'
          figures: 2
          answer: '2.5e2'
          convention: round-once
    answer_text: 'The work done per unit charge is the potential difference: $V = \dfrac{W}{q} = \dfrac{5.0 \times 10^{-4}}{2.0 \times 10^{-6}} = 2.5 \times 10^{2}\,\text{V}$. One volt is one joule per coulomb, so the unit follows from the division. The potential difference describes the two points, not the charge that was moved between them.'

  - id: c13-r8-point-charge-potential
    section: Review
    tier: O
    refs: ['3.2']
    statement: 'A point charge of $+3.0\,\mu\text{C}$ is isolated in air. Calculate the potential $0.10\,\text{m}$ from it.'
    answer_label: 'The potential at that distance'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: k * Q / d
          values:
            k: {value: '9.0e9', unit: N m^2 C^-2}
            Q: {value: '3.0e-6', unit: C}
            d: {value: '0.10', unit: m}
          answer: {value: '2.7e5', unit: V}
        - kind: sigfigs
          value: '9.0e9 * 3.0e-6 / 0.10'
          figures: 2
          answer: '2.7e5'
          convention: round-once
    answer_text: 'The potential of a point charge is $V = \dfrac{kQ}{d} = \dfrac{9.0 \times 10^{9} \times 3.0 \times 10^{-6}}{0.10} = 2.7 \times 10^{5}\,\text{V}$, taking zero potential at infinity. The potential falls as $1/d$ while the field falls as $1/d^2$, which is why the field is the negative gradient of the potential. The potential is a scalar, so the potentials from several charges add.'

  - id: c13-r9-choosing-coulomb
    section: Review
    tier: O
    refs: ['3.1']
    statement: 'You must find the force between two small charged spheres. Which relationship applies, and what must you check about the distance before you use it?'
    answer_label: 'The relationship, and what to check about the distance'
    check:
      kind: structured
      requires: [relationship, distance-check, other-checks]
      concepts: [coulomb-law, point-charges, centre-to-centre]
      points:
        - id: relationship
          text: 'Coulomb''s law, F = k q1 q2 over d squared, gives the force between two point charges.'
          concepts: [coulomb-law]
        - id: distance-check
          text: 'The distance must be measured between the centres of the spheres, not between their nearest surfaces, and it must be much larger than the radius of either sphere. If the spheres are close together the charge is not spread evenly, and the law no longer holds.'
          concepts: [centre-to-centre, point-charges]
        - id: other-checks
          text: 'The charges must be in air or a vacuum, or the medium must be allowed for, and the force found is the size of the force on each sphere, in opposite directions.'
          concepts: [coulomb-law, point-charges]
    answer_text: 'Coulomb''s law applies: $F = \dfrac{kq_1q_2}{d^2}$. Before using it, check that the distance is measured between the centres of the spheres, not between their nearest surfaces, and that it is much larger than the radius of either sphere. When the spheres are close, the charge on each is pushed to one side and the spheres do not behave as point charges. Check also that the spheres are in air or a vacuum, or allow for the medium between them. The law gives the size of the force on each sphere, and the two forces are equal and opposite.'

  - id: c13-r10-which-field-equation
    section: Review
    tier: O
    refs: ['3.2']
    statement: 'A charge sits in an electric field. Would you use $E = \dfrac{V}{d}$ or $E = \dfrac{kQ}{d^2}$ to find the field strength? Explain how you decide.'
    answer_label: 'Which equation, and how to decide'
    check:
      kind: structured
      requires: [uniform-case, point-case, how-to-decide]
      concepts: [parallel-plates, point-charge, field-shape]
      points:
        - id: uniform-case
          text: 'Between parallel plates the field is uniform, and E = V over d uses the potential difference across a known gap.'
          concepts: [parallel-plates]
        - id: point-case
          text: 'Around a single point charge the field spreads out and falls with distance, and E = k Q over d squared uses the charge and the distance from it.'
          concepts: [point-charge]
        - id: how-to-decide
          text: 'Decide from the shape of the field: if the field is the same everywhere between two plates and you know the voltage, use V over d. If the field comes from one charge and gets weaker as you move away, use k Q over d squared. Both give the same quantity and the same unit.'
          concepts: [field-shape, parallel-plates, point-charge]
    answer_text: 'Decide from the shape of the field and from what you are given. Between two parallel plates the field is uniform, and $E = \dfrac{V}{d}$ uses the potential difference across a gap you can measure. Around a single point charge the field spreads out and falls as the distance increases, and $E = \dfrac{kQ}{d^2}$ uses the charge and the distance from it. If you know the voltage and the gap, use the first; if you know the charge and the distance, use the second. Both give a field strength in volts per metre, and neither replaces the definition $E = \dfrac{F}{q}$.'

  - id: c13-r11-gravity-compared
    section: Review
    tier: O
    refs: ['3.2']
    statement: 'A question from Chapter 6. A $5.0\,\text{kg}$ mass has a weight of $8.0\,\text{N}$ on a small moon. Calculate the gravitational field strength at its surface, and compare the method with $E = \dfrac{F}{q}$.'
    answer_label: 'The gravitational field strength, and the comparison'
    check:
      kind: all
      checks:
        - kind: dimensions
          expression: W / m
          values:
            W: {value: '8.0', unit: N}
            m: {value: '5.0', unit: kg}
          answer: {value: '1.6', unit: N/kg}
        - kind: sigfigs
          value: '8.0 / 5.0'
          figures: 2
          answer: '1.6'
          convention: round-once
        - kind: structured
          requires: [state-strength, same-structure, difference]
          concepts: [force-per-unit-mass, force-per-unit-charge, inverse-square]
          points:
            - id: state-strength
              text: 'The gravitational field strength is 1.6 N/kg, from g = W over m.'
              concepts: [force-per-unit-mass]
            - id: same-structure
              text: 'The method has the same shape as E = F over q: a field strength is the force on a test object divided by the property that feels the force, mass for gravity and charge for electricity.'
              concepts: [force-per-unit-mass, force-per-unit-charge]
            - id: difference
              text: 'Gravity only attracts, because there is no negative mass, while electric forces attract or repel. Both fields fall as the inverse square of the distance from a point source, which is why a satellite orbit and an electron around a nucleus are described by the same kind of equation.'
              concepts: [inverse-square]
    answer_text: 'The gravitational field strength is the weight per unit mass: $g = \dfrac{W}{m} = \dfrac{8.0}{5.0} = 1.6\,\text{N/kg}$. The method has exactly the shape of $E = \dfrac{F}{q}$: a field strength is the force on a test object divided by the property that feels the force, which is mass for gravity and charge for electricity. The difference is the sign: gravity only attracts, because there is no negative mass, while electric forces can attract or repel. Both fields fall as the inverse square of the distance from a point source, which is why an orbit and an electron in an atom are described by equations of the same kind. On this moon you would weigh about a sixth of your weight on the Earth.'

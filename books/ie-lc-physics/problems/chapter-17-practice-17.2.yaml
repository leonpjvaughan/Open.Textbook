# Leaving Certificate Physics, Chapter 17, section 17.2 (strand 4 outcome 4.1).
#
# The physics oracle checks two claims whenever a quantity is asked for:
# `dimensions` proves the exact magnitude *and* the unit, and `sigfigs` proves the
# rounding to the figures the data support. Both are written out, because a rounded
# answer is never equal to the exact one. A speed that comes from a square root is
# irrational, so its `dimensions` and `sigfigs` checks carry the tolerance that
# makes the rounding a proof rather than an assertion.
#
# Honest limit: this proves the arithmetic and the dimensions, not the physics. A
# dimensionally consistent, arithmetically correct, physically absurd answer would
# pass. The `structured` record proves only that a model answer contains the
# declared steps and concepts, in order — not that the physics in it is right.
chapter: 17
problems:
- id: p17-2-energy-300
  section: '17.2'
  tier: O
  refs:
  - '4.1'
  statement: An electron is accelerated through a potential difference of 300 V. Calculate the kinetic
    energy it gains, in joules. Take $e = 1.6 \times 10^{-19}$ C.
  answer_label: Kinetic energy gained
  check:
    kind: all
    checks:
    - kind: dimensions
      expression: e * V
      values:
        e:
          value: '1.6e-19'
          unit: C
        V:
          value: '300'
          unit: V
      answer:
        value: '4.8e-17'
        unit: J
    - kind: sigfigs
      value: '1.6e-19 * 300'
      figures: 2
      answer: '4.8e-17'
      convention: round-once
  answer_text: The work done on the electron is $eV = 1.6 \times 10^{-19} \times 300 = 4.8 \times
    10^{-17}\,\text{J}$. The same energy is 300 eV.
- id: p17-2-speed-500
  section: '17.2'
  tier: O
  refs:
  - '4.1'
  statement: An electron is accelerated from rest through a potential difference of 500 V. Calculate
    its speed. Take $e = 1.6 \times 10^{-19}$ C and $m = 9.1 \times 10^{-31}$ kg.
  answer_label: Speed of the electron
  check:
    kind: all
    checks:
    - kind: dimensions
      expression: sqrt(2 * e * V / m)
      values:
        e:
          value: '1.6e-19'
          unit: C
        V:
          value: '500'
          unit: V
        m:
          value: '9.1e-31'
          unit: kg
      answer:
        value: '1.3e7'
        unit: m/s
      tolerance: '5e5'
    - kind: sigfigs
      value: 'sqrt(2 * 1.6e-19 * 500 / 9.1e-31)'
      figures: 2
      answer: '1.3e7'
      tolerance: '1e3'
      convention: round-once
  answer_text: The kinetic energy gained is $eV$, so $eV = \tfrac{1}{2}mv^2$ and $v = \sqrt{\dfrac{2eV}{m}}
    = \sqrt{\dfrac{2 \times 1.6 \times 10^{-19} \times 500}{9.1 \times 10^{-31}}} = 1.3 \times 10^7\,\text{m/s}$.
- id: p17-2-speed-1000
  section: '17.2'
  tier: O
  refs:
  - '4.1'
  statement: An electron is accelerated from rest through a potential difference of 1000 V. Calculate
    its speed. Take $e = 1.6 \times 10^{-19}$ C and $m = 9.1 \times 10^{-31}$ kg.
  answer_label: Speed of the electron
  check:
    kind: all
    checks:
    - kind: dimensions
      expression: sqrt(2 * e * V / m)
      values:
        e:
          value: '1.6e-19'
          unit: C
        V:
          value: '1000'
          unit: V
        m:
          value: '9.1e-31'
          unit: kg
      answer:
        value: '1.9e7'
        unit: m/s
      tolerance: '5e5'
    - kind: sigfigs
      value: 'sqrt(2 * 1.6e-19 * 1000 / 9.1e-31)'
      figures: 2
      answer: '1.9e7'
      tolerance: '1e3'
      convention: round-once
  answer_text: $v = \sqrt{\dfrac{2eV}{m}} = \sqrt{\dfrac{2 \times 1.6 \times 10^{-19} \times 1000}{9.1
    \times 10^{-31}}} = 1.9 \times 10^7\,\text{m/s}$. Doubling the voltage does not double the speed,
    because the speed depends on the square root of the voltage.
- id: p17-2-speed-2000
  section: '17.2'
  tier: O
  refs:
  - '4.1'
  statement: An electron gun accelerates electrons from rest through a potential difference of 2000 V.
    Calculate the speed at which they leave the gun. Take $e = 1.6 \times 10^{-19}$ C and $m = 9.1 \times
    10^{-31}$ kg.
  answer_label: Speed of the electrons
  check:
    kind: all
    checks:
    - kind: dimensions
      expression: sqrt(2 * e * V / m)
      values:
        e:
          value: '1.6e-19'
          unit: C
        V:
          value: '2000'
          unit: V
        m:
          value: '9.1e-31'
          unit: kg
      answer:
        value: '2.7e7'
        unit: m/s
      tolerance: '5e5'
    - kind: sigfigs
      value: 'sqrt(2 * 1.6e-19 * 2000 / 9.1e-31)'
      figures: 2
      answer: '2.7e7'
      tolerance: '1e3'
      convention: round-once
  answer_text: The work done by the field is $eV$, and all of it becomes kinetic energy. So $eV =
    \tfrac{1}{2}mv^2$ and $v = \sqrt{\dfrac{2eV}{m}} = \sqrt{\dfrac{2 \times 1.6 \times 10^{-19} \times
    2000}{9.1 \times 10^{-31}}} = 2.7 \times 10^7\,\text{m/s}$.
- id: p17-2-speed-from-energy
  section: '17.2'
  tier: O
  refs:
  - '4.1'
  statement: An electron has a kinetic energy of $1.6 \times 10^{-16}$ J. Calculate its speed. Take $m
    = 9.1 \times 10^{-31}$ kg.
  answer_label: Speed of the electron
  check:
    kind: all
    checks:
    - kind: dimensions
      expression: sqrt(2 * E / m)
      values:
        E:
          value: '1.6e-16'
          unit: J
        m:
          value: '9.1e-31'
          unit: kg
      answer:
        value: '1.9e7'
        unit: m/s
      tolerance: '5e5'
    - kind: sigfigs
      value: 'sqrt(2 * 1.6e-16 / 9.1e-31)'
      figures: 2
      answer: '1.9e7'
      tolerance: '1e3'
      convention: round-once
  answer_text: $E = \tfrac{1}{2}mv^2$, so $v = \sqrt{\dfrac{2E}{m}} = \sqrt{\dfrac{2 \times 1.6 \times
    10^{-16}}{9.1 \times 10^{-31}}} = 1.9 \times 10^7\,\text{m/s}$. The energy is the same as 1000 eV,
    so the speed matches the answer for a 1000 V gun.
- id: p17-2-work-function
  section: '17.2'
  tier: O
  refs:
  - '4.1'
  statement: The work function of caesium is 2.1 eV. Calculate it in joules, taking $1\,\text{eV} = 1.6
    \times 10^{-19}$ J.
  answer_label: Work function in joules
  check:
    kind: all
    checks:
    - kind: dimensions
      value: '2.1'
      unit: eV
      dimensions: J
      si_value: '3.3645709314e-19'
    - kind: sigfigs
      value: '2.1 * 1.602176634e-19'
      figures: 2
      answer: '3.4e-19'
      convention: round-once
  answer_text: $2.1 \times 1.6 \times 10^{-19} = 3.4 \times 10^{-19}\,\text{J}$. The electronvolt
    is a convenient unit here, because the work function of a metal is only a few electronvolts.
- id: p17-2-thermionic
  section: '17.2'
  tier: O
  refs:
  - '4.1'
  statement: Explain what thermionic emission is, and why the filament of an electron gun is heated.
  answer_label: Thermionic emission
  check:
    kind: structured
    requires:
    - definition
    - work-function
    - role-of-heating
    concepts:
    - escape-from-metal
    - minimum-energy
    points:
    - id: definition
      text: thermionic emission is the release of electrons from the surface of a hot metal
      concepts:
      - escape-from-metal
    - id: work-function
      text: each electron needs at least the work function, the minimum energy to escape the metal
      concepts:
      - minimum-energy
    - id: role-of-heating
      text: heating gives the electrons enough thermal energy to overcome the work function, so they escape
        and form a beam
      concepts:
      - escape-from-metal
      - minimum-energy
  answer_text: Thermionic emission is the release of electrons from the surface of a hot metal. An electron
    inside the metal is held in place, and it needs at least the work function to escape. Heating the
    filament gives the electrons enough thermal energy to overcome the work function, so a cloud of
    electrons forms around the cathode.

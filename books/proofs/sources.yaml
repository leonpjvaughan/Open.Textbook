# Provenance for the proof book.
#
# Two different kinds of claim live here and they are not the same claim:
#
#   * **Who is examined on a proof.** `proofs.yaml → qualifications` says whether a
#     proof is in a reader's course. That is a claim about a specification, and it
#     rests on the documents below.
#   * **The proof itself.** Where a proof is the standard one it is the standard
#     one, and no document is cited for the wording because the wording is ours.
#     What is cited is the claim it justifies.
#
# Written for this collection rather than copied from a board document — see
# `research/` for how the source material is used.

retrieved: 2026-10-12


# The proofs this collection can show, and who is examined on them.
#
# This is the source of truth the `:::prove` directive reads. A proof listed here
# has a page at `docs/<id>/index.md` and a URL at `/proofs/<id>/`; a directive
# naming an id that is not here fails the build, the same way an unknown
# `:::figure` slug does.
#
# `qualifications` is the whole point of the file. The same fact sits differently
# in different courses: a reader on GCSE Mathematics meets the angles of a
# triangle every year, and meets the sum of the first n squares never. So the
# directive compares this list against the qualification of the book the reader is
# in, and **marks the link when the proof is not in their course**. Nothing else
# in the collection can say that, because nothing else knows which course the
# reader came from.
#
# A proof with no `qualifications` is not in any course, which is a mistake unless
# it is deliberate — `tests/test_proofs.py` fails on an empty list.

meta:
  title: Proofs
  # Kept for the same reason a book's curriculum records it.
  retrieved: 2026-10-12
  note: >-
    Written for this collection rather than copied from a board document. Where a
    proof is the standard one, it is the version a reader can follow rather than
    the shortest one — and each is checked against the source recorded in
    sources.yaml for the claim it justifies, not for its wording.

proofs:
  - id: angles-in-a-triangle
    title: The angles in a triangle add to 180°
    summary: >-
      Draw the line through one corner parallel to the opposite side, and the
      three angles fall onto a straight line.
    qualifications: [GCSE, A-level]
    strand: geometry
    figure: angles-on-a-line

  - id: sine-rule
    title: The sine rule
    summary: >-
      Drop a perpendicular and the same height comes out as b sin A and as
      a sin B. Equate them and the rule appears.
    qualifications: [GCSE, A-level]
    strand: trigonometry
    figure: sine-rule-perpendicular

  - id: pythagoras
    title: Pythagoras' theorem
    summary: >-
      Four copies of the triangle make a square with a hole in it, and the hole is
      the square on the hypotenuse.
    qualifications: [GCSE, A-level]
    strand: geometry
    figure: pythagoras-rearrangement

  - id: cosine-rule
    title: The cosine rule
    summary: >-
      Pythagoras twice, with a dropped perpendicular. The correction term is what
      an angle that is not a right angle costs.
    qualifications: [GCSE, A-level]
    strand: trigonometry

  - id: triangle-area-sinc
    title: The area of a triangle is half a b sin C
    summary: >-
      Drop a perpendicular and the triangle's area is half its base times its
      height. The height is what the sine ratio turns into b sin C.
    qualifications: [GCSE, A-level]
    strand: trigonometry
    figure: triangle-area-sinc

  - id: angle-at-the-centre
    title: The angle at the centre is twice the angle at the circumference
    summary: >-
      Join the two points to the centre. Two isosceles triangles appear whose base
      angles must add up to half the straight angle at the centre.
    qualifications: [GCSE]
    strand: geometry
    figure: angle-at-the-centre

  - id: completing-the-square
    title: Completing the square
    summary: >-
      Why half the coefficient of x, squared, is the number to add: it is the
      corner of the same square drawn as a picture.
    qualifications: [GCSE, A-level]
    strand: algebra
    figure: completing-the-square

  - id: the-discriminant
    title: The discriminant decides how many roots there are
    summary: >-
      Read it off the completed square. The square root is the whole story, and the
      graph shows the same thing.
    qualifications: [GCSE, A-level]
    strand: algebra
    figure: discriminant-graph

  - id: power-rule
    title: Differentiating x to the n from first principles
    summary: >-
      Expand (x + h) to the n, subtract, divide by h, and let h go to zero. The
      terms that survive are the ones the rule names.
    qualifications: [A-level]
    strand: calculus

  - id: product-rule
    title: The product rule
    summary: >-
      The area of a rectangle whose sides both grow: the change is the two strips
      plus a corner that vanishes in the limit.
    qualifications: [A-level]
    strand: calculus
    figure: product-rule-rectangle

  - id: chain-rule
    title: The chain rule
    summary: >-
      Rates multiply. If y changes twice as fast as u and u three times as fast as
      x, y changes six times as fast as x.
    qualifications: [A-level]
    strand: calculus

  - id: binomial-theorem
    title: The binomial theorem for a positive whole number n
    summary: >-
      Count the ways each term can be made. The coefficients are the number of
      choices, which is why they are the numbers in Pascal's triangle.
    qualifications: [A-level]
    strand: algebra
    figure: binomial-choices

  - id: factor-theorem
    title: The factor theorem
    summary: >-
      Dividing a polynomial by (x - a) leaves a remainder you can find by
      substituting. If that remainder is zero, the division came out exactly.
    qualifications: [A-level]
    strand: algebra

  - id: laws-of-logarithms
    title: The laws of logarithms
    summary: >-
      A logarithm is an index, so every log law is an index law read backwards.
    qualifications: [A-level]
    strand: algebra

  - id: trapezium-area
    title: The area of a trapezium
    summary: >-
      Two copies, one turned upside down, make a parallelogram. One trapezium is
      half of it.
    qualifications: [GCSE, A-level]
    strand: mensuration
    figure: trapezium-double

  - id: arithmetic-series
    title: The sum of an arithmetic series
    summary: >-
      Write the sum down twice, once backwards, and add. Every pair makes the same
      total.
    qualifications: [A-level]
    strand: sequences

  - id: geometric-series
    title: The sum of a geometric series
    summary: >-
      Multiply the sum by the common ratio and subtract. Everything cancels except
      the two ends.
    qualifications: [A-level]
    strand: sequences

  - id: quadratic-formula
    title: The quadratic formula
    summary: >-
      Complete the square on ax² + bx + c and solve for x. The formula is what is
      left when the algebra is done.
    qualifications: [GCSE, A-level]
    strand: algebra

  - id: angle-in-a-semicircle
    title: The angle in a semicircle is 90°
    summary: >-
      Join the corner to the centre. Two isosceles triangles appear, and their
      angles must fill a straight line.
    qualifications: [GCSE]
    strand: geometry
    figure: semicircle-angle

  - id: angles-in-a-polygon
    title: The angles in a polygon add to (n − 2) × 180°
    summary: >-
      Cut the polygon into triangles from one corner. Count how many, and the
      triangle proof does the rest.
    qualifications: [GCSE, A-level]
    strand: geometry
    figure: polygon-triangulation

  # In no course at this collection's level, which is a fact about the curriculum
  # rather than an omission: the sum of the first n squares is Further Mathematics.
  # An A-level reader meeting it here is offered it, not set it, and the empty list
  # is what makes the link say so.
  - id: sum-of-the-first-n-squares
    title: The sum of the first n squares
    summary: >-
      Why 1² + 2² + … + n² is n(n + 1)(2n + 1)/6, proved by induction so the
      formula arrives rather than appears.
    qualifications: []
    strand: sequences

# Junior Cycle Mathematics, Chapter 9, section 9.1.
#
# Every check is arithmetic the CAS proves, so the answer the reader is shown is
# the answer the verifier proved. A repeating pattern is checked by finding the
# position inside the cycle: the remainder is the arithmetic, and the reader
# names the term it points at in `answer_text`. A growing pattern is checked by
# the additions that build each term. Units and words stay in `statement`.
chapter: 9
symbols: {}

problems:
- id: jc9-9.1-repeat-1
  section: '9.1'
  tier: O
  refs:
  - N.4
  - AF.1
  statement: A pattern repeats triangle, circle, square, triangle, circle, square, and so on. What shape is at position 10?
  answer_label: A pattern repeats triangle, circle, square. What shape is at position 10?
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 10 - 3*3
      answer: '1'
    - kind: evaluate
      expression: 3*3 + 1
      answer: '10'
  answer_text: >-
    Triangle. The cycle has 3 shapes, and $10=3\times3+1$, so position 10 is the
    first shape of a cycle. Counting in threes from the start lands on a triangle
    every time.
- id: jc9-9.1-repeat-2
  section: '9.1'
  tier: O
  refs:
  - N.4
  - AF.1
  statement: The cycle is 2, 5, 8, repeating. What is the 14th term?
  answer_label: The cycle 2, 5, 8 repeats. What is the 14th term?
  check:
    kind: evaluate
    expression: 14 - 3*4
    answer: '2'
  answer_text: >-
    $5$. The cycle has 3 terms, and $14=3\times4+2$, so the 14th term is the
    second term of a cycle. The second term is 5.
- id: jc9-9.1-continue-1
  section: '9.1'
  tier: O
  refs:
  - N.4
  - AF.1
  statement: Continue the pattern 4, 7, 10, 13 by two terms.
  answer_label: Continue the pattern 4, 7, 10, 13 by two terms.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 13 + 3
      answer: '16'
    - kind: evaluate
      expression: 16 + 3
      answer: '19'
  answer_text: $16$ and $19$. The pattern adds 3 each time.
- id: jc9-9.1-table-1
  section: '9.1'
  tier: O
  refs:
  - N.4
  - AF.1
  statement: A tile design uses 5 tiles in design 1, 9 tiles in design 2 and 13 tiles in design 3. How many tiles are in design 5?
  answer_label: A tile design uses 5, 9, 13, ... tiles. How many in design 5?
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 9 - 5
      answer: '4'
    - kind: evaluate
      expression: 13 - 9
      answer: '4'
    - kind: evaluate
      expression: 13 + 4
      answer: '17'
    - kind: evaluate
      expression: 17 + 4
      answer: '21'
  answer_text: >-
    $21$. The number of tiles goes up by 4 each time, so design 4 has $13+4=17$
    tiles and design 5 has $17+4=21$ tiles.
- id: jc9-9.1-missing-1
  section: '9.1'
  tier: O
  refs:
  - N.4
  - AF.1
  statement: Find the missing term. 6, 11, ?, 21, 26
  answer_label: Find the missing term. 6, 11, ?, 21, 26
  check:
    kind: evaluate
    expression: 11 + 5
    answer: '16'
  answer_text: >-
    $16$. The pattern adds 5 each time: $6, 11, 16, 21, 26$. You can check the
    answer against the next term, because $16+5=21$.
- id: jc9-9.1-decrease-1
  section: '9.1'
  tier: O
  refs:
  - N.4
  - AF.1
  statement: Continue the pattern 100, 90, 80 by two terms.
  answer_label: Continue the pattern 100, 90, 80 by two terms.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 80 - 10
      answer: '70'
    - kind: evaluate
      expression: 70 - 10
      answer: '60'
  answer_text: $70$ and $60$. The pattern goes down by 10 each time.
- id: jc9-9.1-word-1
  section: '9.1'
  tier: O
  refs:
  - N.4
  - AF.1
  statement: A pattern starts with 2 tiles and adds 4 tiles each time. Write the number of tiles in designs 1, 2, 3 and 4.
  answer_label: A pattern starts at 2 and adds 4 each time. List designs 1 to 4.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 2 + 4
      answer: '6'
    - kind: evaluate
      expression: 6 + 4
      answer: '10'
    - kind: evaluate
      expression: 10 + 4
      answer: '14'
  answer_text: >-
    $2, 6, 10, 14$. Start at 2, then add 4 for each new design. The first term is
    2 and the change is 4, so both numbers matter.
- id: jc9-9.1-cycle-4
  section: '9.1'
  tier: O
  refs:
  - N.4
  - AF.1
  statement: A pattern repeats 1, 3, 5, 7, then starts again. What is the 19th term?
  answer_label: The cycle 1, 3, 5, 7 repeats. What is the 19th term?
  check:
    kind: evaluate
    expression: 19 - 4*4
    answer: '3'
  answer_text: >-
    $5$. The cycle has 4 terms, and $19=4\times4+3$, so the 19th term is the
    third term of a cycle. The third term is 5.
- id: jc9-9.1-compare-1
  section: '9.1'
  tier: O
  refs:
  - N.4
  - AF.1
  statement: Which is larger, the 8th term of 3, 6, 9, ... or the 8th term of 5, 10, 15, ...?
  answer_label: Which is larger, the 8th term of 3, 6, 9, ... or of 5, 10, 15, ...?
  check:
    kind: compare
    relation: '>'
    lhs: 5*8
    rhs: 3*8
  answer_text: >-
    The 8th term of 5, 10, 15, ... is larger. It is $40$, and the 8th term of
    3, 6, 9, ... is $24$. Both patterns are made by counting in steps, so the
    larger step wins.
- id: jc9-9.1-repeat-word-1
  section: '9.1'
  tier: O
  refs:
  - N.4
  - AF.1
  statement: A pattern of colours repeats red, green, blue, yellow, then starts again. What colour is at position 22?
  answer_label: A cycle of 4 colours repeats. What colour is at position 22?
  check:
    kind: evaluate
    expression: 22 - 4*5
    answer: '2'
  answer_text: >-
    Green. The cycle has 4 colours, and $22=4\times5+2$, so position 22 is the
    second colour of a cycle. The second colour is green.

# Junior Cycle Mathematics, Chapter 14, section 14.4.
#
# A quadratic graph is checked from its table of values, one row at a time. The
# roots are checked with `kind: solve`, so the CAS finds them from the equation
# rather than taking the claim on trust. A quadratic built from its roots is
# checked by expanding the factorised form, so the two forms must agree.
chapter: 14
symbols:
  x: {real: true}

problems:
- id: jc14-14.4-table-1
  section: '14.4'
  tier: O
  refs:
  - AF.7
  statement: Complete the table of values for $y=x^2$ for $x=-2$, $-1$, $0$, $1$ and $2$.
  answer_label: Complete the table for $y=x^2$.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: (-2)**2
      answer: '4'
    - kind: evaluate
      expression: (-1)**2
      answer: '1'
    - kind: evaluate
      expression: 0**2
      answer: '0'
    - kind: evaluate
      expression: 1**2
      answer: '1'
    - kind: evaluate
      expression: 2**2
      answer: '4'
  answer_text: The values are $4$, $1$, $0$, $1$ and $4$. The graph is a curve with a lowest point at
    $(0,0)$. It is the same height on the left and on the right, because a negative number and a positive
    number with the same size have the same square.
- id: jc14-14.4-eval-1
  section: '14.4'
  tier: O
  refs:
  - AF.7
  statement: Find the value of $y$ when $x=-4$, using $y=x^2$.
  answer_label: Find $y$ when $x=-4$.
  check:
    kind: evaluate
    expression: (-4)**2
    answer: '16'
  answer_text: $y=(-4)^2=16$. The square of a negative number is positive, so the left-hand side of the
    graph rises as well as the right-hand side.
- id: jc14-14.4-eval-2
  section: '14.4'
  tier: O
  refs:
  - AF.7
  statement: Find the value of $y$ when $x=2$ and when $x=-2$, using $y=x^2-3$.
  answer_label: Find $y$ for $x=2$ and for $x=-2$.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 2**2-3
      answer: '1'
    - kind: evaluate
      expression: (-2)**2-3
      answer: '1'
  answer_text: Both inputs give $y=1$. The curve is symmetrical about its lowest point, so the two points
    $(-2,1)$ and $(2,1)$ are at the same height. Subtracting 3 moves the whole curve down by 3.
- id: jc14-14.4-roots-1
  section: '14.4'
  tier: O
  refs:
  - AF.7
  statement: Find the values of $x$ where the graph of $y=x^2-4$ crosses the horizontal axis.
  answer_label: Find where the graph crosses the horizontal axis.
  check:
    kind: solve
    equation: x**2-4 = 0
    variable: x
    answer:
    - '-2'
    - '2'
  answer_text: The graph crosses at $x=-2$ and $x=2$, because $(-2)^2-4=0$ and $2^2-4=0$. These two values
    are the roots of the equation $x^2-4=0$, and they are the two places where $y=0$.
- id: jc14-14.4-build-1
  section: '14.4'
  tier: O
  refs:
  - AF.5
  statement: A quadratic graph crosses the horizontal axis at $x=2$ and $x=5$. Write the equation of the
    graph in the form $y=(x-2)(x-5)$, and expand it.
  answer_label: Write the equation and expand it.
  check:
    kind: evaluate
    expression: (x-2)*(x-5)
    answer: x**2-7*x+10
  answer_text: The equation is $y=(x-2)(x-5)$, which expands to $y=x^2-7x+10$. A root at $x=2$ means that
    $(x-2)$ is a factor, and a root at $x=5$ means that $(x-5)$ is a factor.
- id: jc14-14.4-build-2
  section: '14.4'
  tier: O
  refs:
  - AF.5
  statement: A quadratic graph crosses the horizontal axis at $x=-3$ and $x=1$. Write its equation in
    factorised form and expand it.
  answer_label: Write the equation and expand it.
  check:
    kind: evaluate
    expression: (x+3)*(x-1)
    answer: x**2+2*x-3
  answer_text: The equation is $y=(x+3)(x-1)$, which expands to $y=x^2+2x-3$. A root at $x=-3$ gives the
    factor $(x+3)$, because substituting $-3$ makes that bracket zero.
- id: jc14-14.4-garden-1
  section: '14.4'
  tier: O
  refs:
  - AF.7
  statement: The area of the garden bed is $A(x)=12x-2x^2$ square metres. Complete the table for $x=0$,
    $1$, $2$, $3$, $4$, $5$ and $6$.
  answer_label: Complete the table for $A(x)=12x-2x^2$.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 12*0-2*0**2
      answer: '0'
    - kind: evaluate
      expression: 12*1-2*1**2
      answer: '10'
    - kind: evaluate
      expression: 12*2-2*2**2
      answer: '16'
    - kind: evaluate
      expression: 12*3-2*3**2
      answer: '18'
    - kind: evaluate
      expression: 12*4-2*4**2
      answer: '16'
    - kind: evaluate
      expression: 12*5-2*5**2
      answer: '10'
    - kind: evaluate
      expression: 12*6-2*6**2
      answer: '0'
  answer_text: The areas are $0$, $10$, $16$, $18$, $16$, $10$ and $0$ square metres. The graph rises to a
    highest point and then falls, and it is the same height on both sides of that point.
- id: jc14-14.4-garden-2
  section: '14.4'
  tier: O
  refs:
  - AF.7
  statement: The area of the garden bed is $A(x)=12x-2x^2$ square metres. Find the greatest area, and the
    width that gives it.
  answer_label: Find the greatest area and the width.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 12*3-2*3**2
      answer: '18'
    - kind: compare
      lhs: 12*3-2*3**2
      relation: '>'
      rhs: 12*2-2*2**2
    - kind: compare
      lhs: 12*3-2*3**2
      relation: '>'
      rhs: 12*4-2*4**2
  answer_text: The greatest area is $18\ \text{m}^2$, and it comes from a width of 3 m. The table shows the
    highest value at $x=3$, and the values on either side are lower. This is the maximum point of the graph.
- id: jc14-14.4-garden-3
  section: '14.4'
  tier: O
  refs:
  - AF.7
  statement: The area of the garden bed is $A(x)=12x-2x^2$ square metres. Find the two widths for which the
    area is 0.
  answer_label: Find the widths that give an area of 0.
  check:
    kind: solve
    equation: 12*x-2*x**2 = 0
    variable: x
    answer:
    - '0'
    - '6'
  answer_text: The area is 0 when $x=0$ and when $x=6$. These are the two places where the graph meets the
    horizontal axis. A width of 0 means no bed, and a width of 6 leaves no fence for the length.
- id: jc14-14.4-eval-3
  section: '14.4'
  tier: O
  refs:
  - AF.7
  statement: Find the value of $y$ when $x=-4$ and when $x=1$, using $y=x^2+2x-3$.
  answer_label: Find $y$ for $x=-4$ and for $x=1$.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: (-4)**2+2*(-4)-3
      answer: '5'
    - kind: evaluate
      expression: 1**2+2*1-3
      answer: '0'
  answer_text: When $x=-4$, $y=16-8-3=5$. When $x=1$, $y=1+2-3=0$, so the graph crosses the horizontal
    axis at $x=1$.
- id: jc14-14.4-roots-2
  section: '14.4'
  tier: O
  refs:
  - AF.7
  statement: Find the values of $x$ where the graph of $y=x^2+2x-3$ crosses the horizontal axis.
  answer_label: Find where the graph crosses the horizontal axis.
  check:
    kind: solve
    equation: x**2+2*x-3 = 0
    variable: x
    answer:
    - '-3'
    - '1'
  answer_text: The graph crosses at $x=-3$ and $x=1$. Factorising gives $(x+3)(x-1)=0$, and a product is
    zero when either bracket is zero. This is the factorised form you built in question 6.

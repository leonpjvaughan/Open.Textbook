# Junior Cycle Mathematics, Chapter 2, section 2.3.
#
# A negative index is checked as an exact rational: the power on the left and the
# fraction on the right must be the same number. That is what stops the common
# error `2^-3 = -8` from passing, and a separate `compare` record states that
# error and shows it is false. A decimal answer such as 0.01 is rationalised
# before the comparison, so it is exact.
chapter: 2
symbols:
  x: {real: true}

problems:
- id: jc2-2.3-zero-1
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Work out $9^0$.
  answer_label: Work out $9^0$.
  check:
    kind: evaluate
    expression: 9**0
    answer: '1'
  answer_text: >-
    $1$. Any non-zero number to the power zero is 1. The quotient $9^3\div9^3$ is
    both 1 and $9^0$, so the two must agree.
- id: jc2-2.3-zero-2
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Work out $100^0$.
  answer_label: Work out $100^0$.
  check:
    kind: evaluate
    expression: 100**0
    answer: '1'
  answer_text: >-
    $1$. The base is 100, and the index is 0. The value is 1 whatever the
    non-zero base is.
- id: jc2-2.3-neg-1
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Write $2^{-4}$ as a fraction, and work out its value.
  answer_label: Write $2^{-4}$ as a fraction, and work out its value.
  check:
    kind: evaluate
    expression: 2**-4
    answer: '1/16'
  answer_text: >-
    $\frac{1}{16}$. A negative index gives a reciprocal, so
    $2^{-4} = \frac{1}{2^4} = \frac{1}{16}$.
- id: jc2-2.3-neg-2
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Work out $5^{-2}$.
  answer_label: Work out $5^{-2}$.
  check:
    kind: evaluate
    expression: 5**-2
    answer: '1/25'
  answer_text: >-
    $\frac{1}{25}$. The index $-2$ gives the reciprocal of $5^2$, and
    $5^2 = 25$. The answer is positive, as it must be.
- id: jc2-2.3-neg-3
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Work out $10^{-3}$.
  answer_label: Work out $10^{-3}$.
  check:
    kind: evaluate
    expression: 10**-3
    answer: '1/1000'
  answer_text: >-
    $\frac{1}{1000} = 0.001$. The index counts the zeros, and a negative index
    places them after the decimal point. Three zeros give three decimal places.
- id: jc2-2.3-neg-4
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Work out $3^{-1}$.
  answer_label: Work out $3^{-1}$.
  check:
    kind: evaluate
    expression: 3**-1
    answer: '1/3'
  answer_text: >-
    $\frac{1}{3}$. An index of $-1$ gives the reciprocal of the base. The answer
    is a fraction, and it is positive.
- id: jc2-2.3-neg-5
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Work out $4^{-3}$.
  answer_label: Work out $4^{-3}$.
  check:
    kind: evaluate
    expression: 4**-3
    answer: '1/64'
  answer_text: >-
    $\frac{1}{64}$. $4^3 = 64$, so the reciprocal is $\frac{1}{64}$. Keep the
    index positive while you work out the denominator.
- id: jc2-2.3-misconception
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Is $2^{-3}$ equal to $-8$? Give a reason.
  answer_label: Is $2^{-3}$ equal to $-8$?
  check:
    kind: compare
    lhs: 2**-3
    relation: '!='
    rhs: '-8'
  answer_text: >-
    No. $2^{-3} = \frac{1}{2^3} = \frac{1}{8} = 0.125$, which is positive. The
    minus sign in the index tells you to take the reciprocal. It does not make
    the answer negative.
- id: jc2-2.3-algebra
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Write $x^{-5}$ as a fraction.
  answer_label: Write $x^{-5}$ as a fraction.
  check:
    kind: evaluate
    expression: x**-5
    answer: 1/x**5
  answer_text: >-
    $\frac{1}{x^5}$. The base stays as $x$. The power moves to the denominator
    and the index becomes positive.
- id: jc2-2.3-div
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Work out $\dfrac{2^3}{2^7}$ using the index law.
  answer_label: Work out $\dfrac{2^3}{2^7}$ using the index law.
  check:
    kind: evaluate
    expression: 2**3/2**7
    answer: 2**-4
  answer_text: >-
    $2^{-4} = \frac{1}{16}$. The index law subtracts: $3-7 = -4$. The negative
    index appears because the denominator is the larger power.
- id: jc2-2.3-place
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: Work out $10^{-2}$, and write it as a decimal.
  answer_label: Work out $10^{-2}$ as a decimal.
  check:
    kind: evaluate
    expression: 10**-2
    answer: '0.01'
  answer_text: >-
    $0.01$. $10^{-2} = \frac{1}{100}$, which is the hundredths place. The answer
    is positive and smaller than 1.
- id: jc2-2.3-anchor
  section: '2.3'
  tier: O
  refs:
  - N.1
  statement: >-
    The photocopier's 50% button halves the width. Write the width multiplier as
    a power of 2 with a negative index.
  answer_label: The width multiplier of the 50% button, as a power of 2.
  check:
    kind: evaluate
    expression: 2**-1
    answer: '1/2'
  answer_text: >-
    $2^{-1} = \frac{1}{2}$. Halving is the reverse of doubling, so the index
    changes sign. Doubling is $2^1$, and halving is $2^{-1}$.

# Junior Cycle Mathematics, Chapter 17, section 17.5.
#
# A line is fixed by its slope and one point, so the check computes the
# y-intercept from them: `expression` works out c = y - m*x, and `answer` is the
# value the reader is shown. A line through two points is an `all` of the slope
# and the intercept. Where two lines meet, `system` solves the pair. One record
# asks the reader to find an error, which cannot be proved by a CAS, so it uses
# `structured`.
chapter: 17
oracles: [sympy, units]
symbols:
  x: {real: true}
  y: {real: true}

problems:
- id: jc17-17.5-eq-1
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'A line has slope 2 and passes through $(0,3)$. Write its equation in the form $y=mx+c$.'
  answer_label: 'Write the equation of the line.'
  check:
    kind: evaluate
    expression: 3-2*0
    answer: '3'
  answer_text: 'The equation is $y=2x+3$. The point $(0,3)$ is on the $y$-axis, so the intercept is already 3. Put $c=3$ with the slope $m=2$.'

- id: jc17-17.5-eq-2
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'A line has slope 3 and passes through $(1,5)$. Write its equation in the form $y=mx+c$.'
  answer_label: 'Write the equation of the line.'
  check:
    kind: evaluate
    expression: 5-3*1
    answer: '2'
  answer_text: 'The equation is $y=3x+2$. Work out the intercept from $c=y-mx$: $c=5-3\times1=2$. Check by substituting $x=1$: $3\times1+2=5$, which matches the point.'

- id: jc17-17.5-eq-3
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'A line has slope $-2$ and passes through $(2,1)$. Write its equation in the form $y=mx+c$.'
  answer_label: 'Write the equation of the line.'
  check:
    kind: evaluate
    expression: 1-(-2)*2
    answer: '5'
  answer_text: 'The equation is $y=-2x+5$. The intercept is $c=1-(-2)\times2=1+4=5$. Take care with the negative slope: subtracting a negative adds.'

- id: jc17-17.5-eq-4
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'A line has slope $\tfrac{1}{2}$ and passes through $(4,5)$. Write its equation in the form $y=mx+c$.'
  answer_label: 'Write the equation of the line.'
  check:
    kind: evaluate
    expression: 5-(1/2)*4
    answer: '3'
  answer_text: 'The equation is $y=\tfrac{1}{2}x+3$. The intercept is $c=5-\tfrac{1}{2}\times4=5-2=3$. Check by substituting $x=4$: $\tfrac{1}{2}\times4+3=5$.'

- id: jc17-17.5-two-points
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'A line passes through $(1,2)$ and $(3,8)$. Find its slope and its equation.'
  answer_label: 'Find the slope and the equation.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: (8-2)/(3-1)
      answer: '3'
    - kind: evaluate
      expression: 2-3*1
      answer: '-1'
  answer_text: 'The slope is 3 and the equation is $y=3x-1$. The slope is $(8-2)\div(3-1)=3$. The intercept is $c=2-3\times1=-1$. Check with the other point: $3\times3-1=8$.'

- id: jc17-17.5-two-points-2
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'A line passes through $(0,4)$ and $(2,0)$. Find its slope and its equation.'
  answer_label: 'Find the slope and the equation.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: (0-4)/(2-0)
      answer: '-2'
    - kind: evaluate
      expression: 4-(-2)*0
      answer: '4'
  answer_text: 'The slope is $-2$ and the equation is $y=-2x+4$. The slope is $(0-4)\div(2-0)=-2$. The point $(0,4)$ is on the $y$-axis, so the intercept is 4.'

- id: jc17-17.5-point-slope
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'A line passes through $(2,3)$ with slope 4. Write its equation in the form $y-y_1=m(x-x_1)$, and then in the form $y=mx+c$.'
  answer_label: 'Write the equation in both forms.'
  check:
    kind: evaluate
    expression: 3-4*2
    answer: '-5'
  answer_text: 'The point-slope form is $y-3=4(x-2)$. Expanding it gives $y=4x-5$. The intercept is $c=3-4\times2=-5$. Check with $x=2$: $4\times2-5=3$.'

- id: jc17-17.5-yint
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'Find the $y$-intercept of the line $y=3x-7$.'
  answer_label: 'Find the y-intercept.'
  check:
    kind: evaluate
    expression: 3*0-7
    answer: '-7'
  answer_text: 'The $y$-intercept is $-7$. The line crosses the $y$-axis where $x=0$, so substitute $x=0$: $3\times0-7=-7$. The intercept is the constant term when the line is written as $y=mx+c$.'

- id: jc17-17.5-on-line
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'Does the point $(4,11)$ lie on the line $y=2x+3$?'
  answer_label: 'Say whether the point lies on the line.'
  check:
    kind: evaluate
    expression: 2*4+3
    answer: '11'
  answer_text: 'Yes, the point lies on the line. Substitute $x=4$ into the equation: $2\times4+3=11$. The $y$-value from the equation is 11, which matches the $y$-coordinate of the point.'

- id: jc17-17.5-intersect
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'Find the point where the line $y=2x+1$ meets the line $y=x+4$.'
  answer_label: 'Find the point of intersection.'
  check:
    kind: system
    equations: ["y = 2*x + 1", "y = x + 4"]
    variables: [x, y]
    answer: [[3, 7]]
  answer_text: 'The lines meet at $(3,7)$. At the crossing point the two $y$-values are equal, so $2x+1=x+4$. Subtract $x$ to get $x+1=4$, so $x=3$. Then $y=2\times3+1=7$. Check with the other line: $3+4=7$.'

- id: jc17-17.5-park-eq
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'The park main path passes through the gate $G(1,2)$ with slope $\tfrac{3}{4}$. Write its equation in the form $y=mx+c$.'
  answer_label: 'Write the equation of the main path.'
  check:
    kind: evaluate
    expression: 2-(3/4)*1
    answer: 5/4
  answer_text: 'The equation is $y=\tfrac{3}{4}x+\tfrac{5}{4}$. The intercept is $c=2-\tfrac{3}{4}\times1=2-\tfrac{3}{4}=\tfrac{5}{4}$. Check with the kiosk $K(9,8)$: $\tfrac{3}{4}\times9+\tfrac{5}{4}=\tfrac{27}{4}+\tfrac{5}{4}=\tfrac{32}{4}=8$.'

- id: jc17-17.5-error
  section: '17.5'
  tier: O
  refs:
  - GT.5
  statement: 'A student says the line through $(0,5)$ with slope 2 is $y=2x+5$, so the line through $(3,5)$ with slope 2 is $y=2x+5$ too. Explain the error.'
  answer_label: 'Explain the error.'
  check:
    kind: structured
    requires: [identify-error, give-intercept]
    concepts: [y-intercept]
    points:
    - id: identify-error
      text: 'The number 5 is the intercept only when the point is on the $y$-axis. Here the point is $(3,5)$, not $(0,5)$.'
      concepts: [y-intercept]
    - id: give-intercept
      text: 'The intercept is $c=5-2\times3=-1$, so the equation is $y=2x-1$.'
  answer_text: 'The student treated the $y$-coordinate 5 as the intercept, but the intercept is the value of $y$ when $x=0$. The point $(3,5)$ gives $c=5-2\times3=-1$, so the equation is $y=2x-1$. Substitute $x=3$ to check: $2\times3-1=5$.'

# Junior Cycle Mathematics, Chapter 9, section 9.5.
#
# Every check is arithmetic the CAS proves, so the answer the reader is shown is
# the answer the verifier proved. Moving between representations is checked by
# the arithmetic that joins them: a rule is tested at several positions to match
# a table, a straight-line graph is proved by a constant first difference, and a
# curve is proved by its constant second difference or multiplier. The letter n
# is declared as a symbol. Units and words stay in `statement`.
chapter: 9
symbols:
  n:
    real: true

problems:
- id: jc9-9.5-table-rule-1
  section: '9.5'
  tier: O
  refs:
  - AF.1
  statement: A table shows position 1 with term 3, position 2 with term 5 and position 4 with term 9. Which rule matches the table, $2n+1$ or $3n$?
  answer_label: Which rule matches the table $3, 5, \ldots, 9$ — $2n+1$ or $3n$?
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 2*1 + 1
      answer: '3'
    - kind: evaluate
      expression: 2*2 + 1
      answer: '5'
    - kind: evaluate
      expression: 2*4 + 1
      answer: '9'
  answer_text: >-
    $2n+1$. Substituting the positions gives $2(1)+1=3$, $2(2)+1=5$ and
    $2(4)+1=9$, so every term matches. The rule $3n$ gives $3, 6, 12$, which does
    not fit.
- id: jc9-9.5-graph-rule-1
  section: '9.5'
  tier: O
  refs:
  - AF.1
  statement: A graph of a pattern passes through the points $(1,4)$, $(2,7)$ and $(3,10)$. Find the general term.
  answer_label: A graph passes through $(1,4)$, $(2,7)$, $(3,10)$. Find the rule.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 3*1 + 1
      answer: '4'
    - kind: evaluate
      expression: 3*2 + 1
      answer: '7'
    - kind: evaluate
      expression: 3*3 + 1
      answer: '10'
  answer_text: >-
    $3n+1$. The points rise by 3 for each step across, so the graph is a straight
    line with common difference 3. The rule starts with $3n$, and position 1
    gives $3(1)+1=4$.
- id: jc9-9.5-words-rule-1
  section: '9.5'
  tier: O
  refs:
  - AF.1
  statement: A pattern starts at 6 and adds 5 each time. Write its general term and use it to find the term at position 4.
  answer_label: A pattern starts at 6 and adds 5. Find its rule and position 4.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 5*1 + 1
      answer: '6'
    - kind: evaluate
      expression: 5*2 + 1
      answer: '11'
    - kind: evaluate
      expression: 5*4 + 1
      answer: '21'
  answer_text: >-
    $5n+1$, and position 4 is $21$. The common difference is 5, so start with
    $5n$. At position 1, $5(1)=5$, and you need 1 more to reach 6. Then
    $5(4)+1=21$.
- id: jc9-9.5-table-next-1
  section: '9.5'
  tier: O
  refs:
  - AF.1
  statement: A table shows position 1 with term 2, position 2 with term 5, position 3 with term 8 and position 4 with term 11. Find the term at position 5.
  answer_label: A table shows 2, 5, 8, 11. Find the term at position 5.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 5 - 2
      answer: '3'
    - kind: evaluate
      expression: 8 - 5
      answer: '3'
    - kind: evaluate
      expression: 11 + 3
      answer: '14'
  answer_text: >-
    $14$. The table rises by 3 each step, so position 5 is $11+3=14$. The same
    arithmetic gives the general term $3n-1$.
- id: jc9-9.5-quadratic-rule-1
  section: '9.5'
  tier: O
  refs:
  - AF.1
  statement: A curved graph passes through $(1,1)$, $(2,4)$ and $(3,9)$. Find the general term.
  answer_label: A curve passes through $(1,1)$, $(2,4)$, $(3,9)$. Find the rule.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 1**2
      answer: '1'
    - kind: evaluate
      expression: 2**2
      answer: '4'
    - kind: evaluate
      expression: 3**2
      answer: '9'
  answer_text: >-
    $n^2$. The points are the square numbers, so the rule is $n^2$. The graph
    curves upwards because the first differences $3, 5, 7$ grow, and the second
    difference is constant.
- id: jc9-9.5-exponential-rule-1
  section: '9.5'
  tier: O
  refs:
  - AF.1
  statement: A graph passes through $(1,3)$, $(2,6)$ and $(3,12)$. Find the general term.
  answer_label: A graph passes through $(1,3)$, $(2,6)$, $(3,12)$. Find the rule.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 3*2**0
      answer: '3'
    - kind: evaluate
      expression: 3*2**1
      answer: '6'
    - kind: evaluate
      expression: 3*2**2
      answer: '12'
  answer_text: >-
    $3\times2^{n-1}$. Each term is double the one before, so the multiplier is 2
    and the first term is 3. The general term is $3\times2^{n-1}$. Check position
    3: $3\times2^2=12$.
- id: jc9-9.5-straight-1
  section: '9.5'
  tier: O
  refs:
  - AF.1
  statement: Which rule gives a straight-line graph, $4n-1$ or $n^2$? Give a reason.
  answer_label: Which rule gives a straight line, $4n-1$ or $n^2$? Give a reason.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: (4*2 - 1) - (4*1 - 1)
      answer: '4'
    - kind: evaluate
      expression: (4*3 - 1) - (4*2 - 1)
      answer: '4'
  answer_text: >-
    $4n-1$. Its first differences are constant: $7-3=4$ and $11-7=4$. A constant
    first difference gives points in a straight line. The rule $n^2$ gives
    $1, 4, 9$, whose first differences $3, 5$ grow, so its graph curves.
- id: jc9-9.5-value-1
  section: '9.5'
  tier: O
  refs:
  - AF.1
  statement: A pattern has general term $3n+2$. Work out the term at position 6.
  answer_label: A pattern has general term $3n+2$. Work out position 6.
  check:
    kind: evaluate
    expression: 3*6 + 2
    answer: '20'
  answer_text: >-
    $20$. Put $n=6$ into the rule: $3(6)+2=18+2=20$. On a graph this is the point
    $(6,20)$.
- id: jc9-9.5-which-rule-1
  section: '9.5'
  tier: O
  refs:
  - AF.1
  statement: A pattern begins 5, 9, 13, 17. Which rule matches it, $4n+1$ or $3n+2$?
  answer_label: Which rule matches 5, 9, 13, 17 — $4n+1$ or $3n+2$?
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 4*1 + 1
      answer: '5'
    - kind: evaluate
      expression: 4*2 + 1
      answer: '9'
    - kind: evaluate
      expression: 4*3 + 1
      answer: '13'
    - kind: evaluate
      expression: 4*4 + 1
      answer: '17'
  answer_text: >-
    $4n+1$. Every position matches: $4(1)+1=5$, $4(2)+1=9$, $4(3)+1=13$ and
    $4(4)+1=17$. The rule $3n+2$ gives $5, 8, 11, 14$, which fits only the first
    term.

# Junior Cycle Mathematics, Chapter 12, section 12.6.
#
# The picture on the number line is a drawing, so the verifier checks the algebra
# behind it. `kind: inequality` proves the solution set, and the interval's
# open/closed endpoint is exactly the open/closed circle the reader draws. A
# "write the inequality for this graph" question states the graph in words and is
# checked the same way. The whole-number case from AF.4(d) is `kind: all`: the
# boundary is proved by `inequality`, and 206/207 by `evaluate`.
chapter: 12
symbols:
  x: {real: true}
  n: {real: true}

problems:
- id: jc12-12.6-graph-1
  section: '12.6'
  tier: O
  refs:
  - AF.4
  statement: Solve $x+3>7$ and describe its graph on the number line.
  answer_label: Solve $x+3>7$.
  check:
    kind: inequality
    variable: x
    inequality: "x + 3 > 7"
    answer: "Interval.open(4, oo)"
  answer_text: '$x>4$. Draw an open circle at 4, because 4 is not included, and an arrow to the right. Open circle means the endpoint is not part of the solution set.'
- id: jc12-12.6-graph-2
  section: '12.6'
  tier: O
  refs:
  - AF.4
  statement: Solve $2x\leq8$ and describe its graph on the number line.
  answer_label: Solve $2x\leq8$.
  check:
    kind: inequality
    variable: x
    inequality: "2*x <= 8"
    answer: "Interval(-oo, 4)"
  answer_text: '$x\leq4$. Draw a closed circle at 4, because 4 is included, and an arrow to the left. Closed circle means the endpoint is part of the solution set.'
- id: jc12-12.6-graph-3
  section: '12.6'
  tier: O
  refs:
  - AF.4
  statement: A number line shows an open circle at $-2$ with an arrow pointing to the right. Write the inequality and its solution set.
  answer_label: Write the inequality for an open circle at $-2$ with an arrow to the right.
  check:
    kind: inequality
    variable: x
    inequality: "x > -2"
    answer: "Interval.open(-2, oo)"
  answer_text: '$x>-2$. The arrow points right, so the solution set is larger than $-2$. The circle is open, so $-2$ itself is not included.'
- id: jc12-12.6-graph-4
  section: '12.6'
  tier: O
  refs:
  - AF.4
  statement: A number line shows a closed circle at $3$ with an arrow pointing to the left. Write the inequality and its solution set.
  answer_label: Write the inequality for a closed circle at $3$ with an arrow to the left.
  check:
    kind: inequality
    variable: x
    inequality: "x <= 3"
    answer: "Interval(-oo, 3)"
  answer_text: '$x\leq3$. The arrow points left, so the solution set is smaller than 3. The circle is closed, so 3 itself is included.'
- id: jc12-12.6-graph-5
  section: '12.6'
  tier: O
  refs:
  - AF.4
  statement: Solve $1<x+2\leq5$ and describe its graph.
  answer_label: Solve $1<x+2\leq5$.
  check:
    kind: inequality
    variable: x
    inequality: "1 < x + 2 <= 5"
    answer: "Interval.Lopen(-1, 3)"
  answer_text: '$-1<x\leq3$. Subtract 2 from all three parts: $-1<x\leq3$. The graph is shaded between $-1$ and 3, with an open circle at $-1$ and a closed circle at 3.'
- id: jc12-12.6-graph-6
  section: '12.6'
  tier: O
  refs:
  - AF.4
  statement: Solve $3\leq2x+1<9$ and describe its graph.
  answer_label: Solve $3\leq2x+1<9$.
  check:
    kind: inequality
    variable: x
    inequality: "3 <= 2*x + 1 < 9"
    answer: "Interval.Ropen(1, 4)"
  answer_text: '$1\leq x<4$. Subtract 1 from all three parts: $2\leq2x<8$. Divide by 2: $1\leq x<4$. The graph is shaded between 1 and 4, with a closed circle at 1 and an open circle at 4.'
- id: jc12-12.6-graph-7
  section: '12.6'
  tier: O
  refs:
  - AF.4
  statement: A number line shows an open circle at $-1$ with an arrow pointing to the left. Write the inequality and its solution set.
  answer_label: Write the inequality for an open circle at $-1$ with an arrow to the left.
  check:
    kind: inequality
    variable: x
    inequality: "x < -1"
    answer: "Interval.open(-oo, -1)"
  answer_text: '$x<-1$. The arrow points left, so the solution set is smaller than $-1$. The open circle means $-1$ is not included.'
- id: jc12-12.6-graph-8
  section: '12.6'
  tier: O
  refs:
  - AF.4
  statement: 'The chapter problem: solve $8n-150\geq1500$ and state the smallest whole number $n$ on the number line.'
  answer_label: Solve $8n-150\geq1500$ for a whole number $n$.
  check:
    kind: all
    checks:
    - kind: inequality
      variable: n
      inequality: "8*n - 150 >= 1500"
      answer: "Interval(825/4, oo)"
    - kind: evaluate
      expression: 8*206 - 150
      answer: '1498'
    - kind: evaluate
      expression: 8*207 - 150
      answer: '1506'
  answer_text: '$n\geq206.25$, so $n\geq207$ for whole tickets. The number line for $n$ in the whole numbers starts at 207 and continues right, shown with dots at 207, 208, 209 and so on.'
- id: jc12-12.6-graph-9
  section: '12.6'
  tier: O
  refs:
  - AF.4
  statement: 'The chapter problem: for $n$ in the whole numbers, list the first three values of $n$ with $n\geq207$.'
  answer_label: List the first three whole numbers $n$ with $n\geq207$.
  check:
    kind: all
    checks:
    - kind: compare
      relation: ">="
      lhs: '207'
      rhs: 825/4
    - kind: compare
      relation: ">="
      lhs: '208'
      rhs: 825/4
    - kind: compare
      relation: ">="
      lhs: '209'
      rhs: 825/4
  answer_text: '$207$, $208$ and $209$. The boundary is $206.25$, so the first whole number that reaches it is 207. For $n$ in the whole numbers the graph is a row of dots starting at 207, not a solid ray.'

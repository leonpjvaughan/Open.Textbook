# Junior Cycle Mathematics, Chapter 17, section 17.6.
#
# A general-form line ax + by + c = 0 is proved by substituting points that lie
# on it and checking the left-hand side is 0, so the check is an `all` of those
# `evaluate` results. The slope and the intercepts are read off the general form
# and checked as `evaluate` computations. One record asks the reader to find a
# sign error, which cannot be proved by a CAS, so it uses `structured`.
chapter: 17
oracles: [sympy, units]
symbols:
  x: {real: true}
  y: {real: true}

problems:
- id: jc17-17.6-gen-1
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'Write the line $y=3x+2$ in the form $ax+by+c=0$.'
  answer_label: 'Write the line in general form.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 3*0-2+2
      answer: '0'
    - kind: evaluate
      expression: 3*1-5+2
      answer: '0'
  answer_text: 'The general form is $3x-y+2=0$. Move every term to the left: $y=3x+2$ becomes $3x-y+2=0$. Check with two points on the line. At $(0,2)$: $0-2+2=0$. At $(1,5)$: $3-5+2=0$.'

- id: jc17-17.6-gen-2
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'Write the line $y=-2x+4$ in the form $ax+by+c=0$.'
  answer_label: 'Write the line in general form.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 2*0+4-4
      answer: '0'
    - kind: evaluate
      expression: 2*1+2-4
      answer: '0'
  answer_text: 'The general form is $2x+y-4=0$. Add $2x$ to both sides and subtract 4: $2x+y-4=0$. Check at $(0,4)$: $0+4-4=0$. At $(1,2)$: $2+2-4=0$.'

- id: jc17-17.6-to-slope
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'Write the line $2x+3y-6=0$ in the form $y=mx+c$.'
  answer_label: 'Write the line in the form y = mx + c.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: (6-2*0)/3
      answer: '2'
    - kind: evaluate
      expression: (6-2*3)/3
      answer: '0'
  answer_text: 'The line is $y=-\tfrac{2}{3}x+2$. Rearrange: $3y=6-2x$, so $y=2-\tfrac{2}{3}x$. Check two points. At $x=0$, $y=2$. At $x=3$, $y=0$. The slope is $-\tfrac{2}{3}$ and the intercept is 2.'

- id: jc17-17.6-slope
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'Find the slope of the line $4x-2y+6=0$.'
  answer_label: 'Find the slope.'
  check:
    kind: evaluate
    expression: -4/(-2)
    answer: '2'
  answer_text: 'The slope is 2. Rearrange to $y=2x+3$: $2y=4x+6$, so $y=2x+3$. The slope is the coefficient of $x$, which is 2. In general form the slope is $-a\div b$, and here $-4\div(-2)=2$.'

- id: jc17-17.6-yint
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'Find the $y$-intercept of the line $3x+4y-12=0$.'
  answer_label: 'Find the y-intercept.'
  check:
    kind: evaluate
    expression: (12-3*0)/4
    answer: '3'
  answer_text: 'The $y$-intercept is 3. Set $x=0$: $4y-12=0$, so $4y=12$ and $y=3$. The line crosses the $y$-axis at $(0,3)$.'

- id: jc17-17.6-on-line
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'Does the point $(2,3)$ lie on the line $2x+y-7=0$?'
  answer_label: 'Say whether the point lies on the line.'
  check:
    kind: evaluate
    expression: 2*2+3-7
    answer: '0'
  answer_text: 'Yes, the point lies on the line. Substitute $x=2$ and $y=3$: $2\times2+3-7=4+3-7=0$. A point lies on a line in general form when the substitution gives 0.'

- id: jc17-17.6-xint
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'Find the $x$-intercept of the line $5x+2y-10=0$.'
  answer_label: 'Find the x-intercept.'
  check:
    kind: evaluate
    expression: (10-2*0)/5
    answer: '2'
  answer_text: 'The $x$-intercept is 2. The line crosses the $x$-axis where $y=0$. Set $y=0$: $5x-10=0$, so $5x=10$ and $x=2$. The crossing point is $(2,0)$.'

- id: jc17-17.6-through-origin
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'A line passes through the origin with slope 3. Write its equation in the form $ax+by+c=0$.'
  answer_label: 'Write the line in general form.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 3*0-0
      answer: '0'
    - kind: evaluate
      expression: 3*1-3
      answer: '0'
  answer_text: 'The general form is $3x-y=0$, which is $3x-y+0=0$. The line passes through the origin, so the intercept is 0 and the constant term is 0. Check at $(0,0)$: $0-0=0$. At $(1,3)$: $3-3=0$.'

- id: jc17-17.6-fraction
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'Write the line $y=\tfrac{1}{2}x+3$ in the form $ax+by+c=0$ with whole-number coefficients.'
  answer_label: 'Write the line in general form with whole numbers.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 0-2*3+6
      answer: '0'
    - kind: evaluate
      expression: 2-2*4+6
      answer: '0'
  answer_text: 'The general form is $x-2y+6=0$. Multiply every term by 2 to clear the fraction: $2y=x+6$, so $x-2y+6=0$. Check at $(0,3)$: $0-6+6=0$. At $(2,4)$: $2-8+6=0$.'

- id: jc17-17.6-park-general
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'The park main path has equation $y=\tfrac{3}{4}x+\tfrac{5}{4}$. Write it in the form $ax+by+c=0$ with whole-number coefficients.'
  answer_label: 'Write the main path in general form.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 3*1-4*2+5
      answer: '0'
    - kind: evaluate
      expression: 3*9-4*8+5
      answer: '0'
  answer_text: 'The general form is $3x-4y+5=0$. Multiply every term by 4: $4y=3x+5$, so $3x-4y+5=0$. Check the gate $G(1,2)$: $3-8+5=0$. Check the kiosk $K(9,8)$: $27-32+5=0$.'

- id: jc17-17.6-park-check
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'Check that the kiosk $K(9,8)$ lies on the line $3x-4y+5=0$.'
  answer_label: 'Check that the kiosk lies on the line.'
  check:
    kind: evaluate
    expression: 3*9-4*8+5
    answer: '0'
  answer_text: 'Substitute $x=9$ and $y=8$: $3\times9-4\times8+5=27-32+5=0$. The result is 0, so the kiosk lies on the line. The main path really does pass through the kiosk.'

- id: jc17-17.6-error
  section: '17.6'
  tier: O
  refs:
  - GT.5
  statement: 'A student writes the line $y=2x+1$ as $2x+y+1=0$. Explain the error.'
  answer_label: 'Explain the error.'
  check:
    kind: structured
    requires: [identify-error, give-correct-form]
    concepts: [general-form]
    points:
    - id: identify-error
      text: 'The student kept the sign of $y$ and added the constant instead of moving it, so the sign of the $y$ term is wrong.'
      concepts: [general-form]
    - id: give-correct-form
      text: 'The correct form is $2x-y+1=0$, because $y=2x+1$ gives $2x-y+1=0$.'
  answer_text: 'The student moved $y$ the wrong way. From $y=2x+1$, subtract $y$ from both sides: $0=2x-y+1$, which is $2x-y+1=0$. The correct form is $2x-y+1=0$. Check with $x=0$: $0-1+1=0$, so $(0,1)$ lies on the line.'

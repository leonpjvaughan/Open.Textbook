# Junior Cycle Mathematics, Chapter 16, section 16.6.
#
# A surface area is a sum of flat areas, so the check is an exact `evaluate`. A pi
# answer stays exact; a decimal answer uses 3.14 exactly. The last record asks for the
# difference between curved and total surface area, which uses `structured`.
chapter: 16
oracles: [sympy, units]
symbols: {}

problems:
- id: jc16-16.6-box-1
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A rectangular solid is 4 cm long, 3 cm wide and 2 cm tall. Find its surface area.'
  answer_label: 'Find the surface area.'
  check:
    kind: evaluate
    expression: 2*(4*3+3*2+4*2)
    answer: '52'
  answer_text: 'The surface area is $52$ cm². The three pairs are $12$, $6$ and $8$ cm². Their total is $26$, and doubling gives $52$ cm².'

- id: jc16-16.6-box-2
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A box is 6 cm long, 5 cm wide and 2 cm tall. Find its surface area.'
  answer_label: 'Find the surface area.'
  check:
    kind: evaluate
    expression: 2*(6*5+5*2+6*2)
    answer: '104'
  answer_text: 'The surface area is $104$ cm². The three pairs are $30$, $10$ and $12$ cm². Their total is $52$, and doubling gives $104$ cm².'

- id: jc16-16.6-cube
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A cube has sides of 5 cm. Find its surface area.'
  answer_label: 'Find the surface area.'
  check:
    kind: evaluate
    expression: 6*5**2
    answer: '150'
  answer_text: 'The surface area is $150$ cm². A cube has six equal square faces. Each is $5^2=25$ cm², so the total is $6\times25=150$.'

- id: jc16-16.6-prism
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A triangular prism is 10 cm long. Its cross-section is a triangle with base 6 cm, height 4 cm and the other two sides each 5 cm. Find its surface area.'
  answer_label: 'Find the surface area.'
  check:
    kind: evaluate
    expression: 2*(0.5*6*4)+(6+5+5)*10
    answer: '184'
  answer_text: 'The surface area is $184$ cm². The two triangular ends give $24$ cm². The three rectangular sides give $(6+5+5)\times10=160$ cm². Add them.'

- id: jc16-16.6-cyl-curved-1
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A cylinder has a radius of 3 cm and a height of 10 cm. Find its curved surface area in terms of $\pi$.'
  answer_label: 'Find the curved surface area in terms of pi.'
  check:
    kind: evaluate
    expression: 2*pi*3*10
    answer: '60*pi'
  answer_text: 'The curved surface area is $60\pi$ cm². Use $2\pi rh$: $2\times\pi\times3\times10=60\pi$. The curved surface is the side only, without the ends.'

- id: jc16-16.6-cyl-total-1
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A cylinder has a radius of 3 cm and a height of 10 cm. Find its total surface area in terms of $\pi$.'
  answer_label: 'Find the total surface area in terms of pi.'
  check:
    kind: evaluate
    expression: 2*pi*3**2+2*pi*3*10
    answer: '78*pi'
  answer_text: 'The total surface area is $78\pi$ cm². The curved side gives $60\pi$ cm², and the two ends give $2\times9\pi=18\pi$ cm². Add them to get $78\pi$ cm².'

- id: jc16-16.6-cyl-curved-2
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A cylinder has a radius of 4 cm and a height of 5 cm. Find its curved surface area in terms of $\pi$.'
  answer_label: 'Find the curved surface area in terms of pi.'
  check:
    kind: evaluate
    expression: 2*pi*4*5
    answer: '40*pi'
  answer_text: 'The curved surface area is $40\pi$ cm². Use $2\pi rh$: $2\times\pi\times4\times5=40\pi$. The ends are not part of the curved surface.'

- id: jc16-16.6-cyl-curved-3
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A cylinder has a radius of 2 m and a height of 7 m. Find its curved surface area. Use $\pi\approx3.14$.'
  answer_label: 'Find the curved surface area as a decimal.'
  check:
    kind: evaluate
    expression: 2*3.14*2*7
    answer: '87.92'
  answer_text: 'The curved surface area is about $87.92$ m². Work out $2\times3.14\times2\times7=87.92$. Round once, at the end.'

- id: jc16-16.6-sphere-1
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A sphere has a radius of 6 cm. Find its surface area in terms of $\pi$.'
  answer_label: 'Find the surface area in terms of pi.'
  check:
    kind: evaluate
    expression: 4*pi*6**2
    answer: '144*pi'
  answer_text: 'The surface area is $144\pi$ cm². Square the radius: $6^2=36$. Then $4\times36=144$, so the answer is $144\pi$ cm².'

- id: jc16-16.6-sphere-2
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A sphere has a radius of 3 cm. Find its surface area in terms of $\pi$.'
  answer_label: 'Find the surface area in terms of pi.'
  check:
    kind: evaluate
    expression: 4*pi*3**2
    answer: '36*pi'
  answer_text: 'The surface area is $36\pi$ cm². Square the radius: $3^2=9$. Then $4\times9=36$. The surface area uses $r^2$, while the volume uses $r^3$.'

- id: jc16-16.6-tank-curved
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'The cylindrical part of the chapter tank has a radius of 0.5 m and a height of 1 m. Find its curved surface area in terms of $\pi$.'
  answer_label: 'Find the curved surface area in terms of pi.'
  check:
    kind: evaluate
    expression: 2*pi*0.5*1
    answer: 'pi'
  answer_text: 'The curved surface area is $\pi$ m². Use $2\pi rh$: $2\times0.5\times1=1$, so the answer is $\pi$ m². That is about 3.14 m².'

- id: jc16-16.6-surface-reason
  section: '16.6'
  tier: O
  refs:
  - GT.2
  statement: 'A question asks for the curved surface area of a cylinder, and another asks for its total surface area. Explain the difference.'
  answer_label: 'Explain the difference.'
  check:
    kind: structured
    requires: [name-curved, name-total]
    concepts: [curved-surface-area]
    points:
    - id: name-curved
      text: 'The curved surface area is the side only, $2\pi rh$.'
      concepts: [curved-surface-area]
    - id: name-total
      text: 'The total surface area adds the two circular ends, so it is $2\pi rh+2\pi r^2$.'
  answer_text: 'The curved surface area covers the side only, and it is $2\pi rh$. The total surface area adds the two circular ends, so it is $2\pi rh+2\pi r^2$. The ends are the difference between the two answers.'

# Junior Cycle Mathematics, Chapter 12, section 12.1.
#
# Solving a linear equation is checked with `kind: solve`, so the verifier proves
# the whole solution set of the equation the answer text states. A "is this value
# a solution" question is checked with `kind: evaluate`, which works out the left
# side at that value so the reader compares it with the right side. Units and
# words stay in `statement`: the CAS parses numbers and symbols only.
chapter: 12
symbols:
  x: {real: true}
  s: {real: true}

problems:
- id: jc12-12.1-eq-1
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: Solve $x+7=12$.
  answer_label: Solve $x+7=12$.
  check:
    kind: solve
    equation: x + 7 = 12
    variable: x
    answer: '5'
  answer_text: '$x=5$. The 7 is added to $x$, so subtract 7 from both sides: $x=12-7=5$. Check: $5+7=12$.'
- id: jc12-12.1-eq-2
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: Solve $x-9=4$.
  answer_label: Solve $x-9=4$.
  check:
    kind: solve
    equation: x - 9 = 4
    variable: x
    answer: '13'
  answer_text: '$x=13$. The 9 is subtracted from $x$, so add 9 to both sides: $x=4+9=13$. Check: $13-9=4$.'
- id: jc12-12.1-eq-3
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: Solve $4x=20$.
  answer_label: Solve $4x=20$.
  check:
    kind: solve
    equation: 4*x = 20
    variable: x
    answer: '5'
  answer_text: '$x=5$. The $x$ is multiplied by 4, so divide both sides by 4: $x=20\div4=5$. Check: $4\times5=20$.'
- id: jc12-12.1-eq-4
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: Solve $8x=48$.
  answer_label: Solve $8x=48$.
  check:
    kind: solve
    equation: 8*x = 48
    variable: x
    answer: '6'
  answer_text: '$x=6$. Divide both sides by 8: $x=48\div8=6$. Check: $8\times6=48$.'
- id: jc12-12.1-eq-5
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: Solve $3x-5=10$.
  answer_label: Solve $3x-5=10$.
  check:
    kind: solve
    equation: 3*x - 5 = 10
    variable: x
    answer: '5'
  answer_text: '$x=5$. Undo the subtraction first: add 5 to both sides to get $3x=15$. Then divide both sides by 3: $x=5$.'
- id: jc12-12.1-eq-6
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: Solve $2x+7=19$.
  answer_label: Solve $2x+7=19$.
  check:
    kind: solve
    equation: 2*x + 7 = 19
    variable: x
    answer: '6'
  answer_text: '$x=6$. Subtract 7 from both sides: $2x=12$. Divide both sides by 2: $x=6$. Undo the addition before the multiplication.'
- id: jc12-12.1-eq-7
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: Solve $5x-2=3x+8$.
  answer_label: Solve $5x-2=3x+8$.
  check:
    kind: solve
    equation: 5*x - 2 = 3*x + 8
    variable: x
    answer: '5'
  answer_text: '$x=5$. Subtract $3x$ from both sides: $2x-2=8$. Add 2: $2x=10$. Divide by 2: $x=5$. The letters are collected on one side first.'
- id: jc12-12.1-eq-8
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: Solve $4x+3=2x+11$.
  answer_label: Solve $4x+3=2x+11$.
  check:
    kind: solve
    equation: 4*x + 3 = 2*x + 11
    variable: x
    answer: '4'
  answer_text: '$x=4$. Subtract $2x$ from both sides: $2x+3=11$. Subtract 3: $2x=8$. Divide by 2: $x=4$. Check both sides: $4\times4+3=19$ and $2\times4+11=19$.'
- id: jc12-12.1-eq-9
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: Solve $9-2x=1$.
  answer_label: Solve $9-2x=1$.
  check:
    kind: solve
    equation: 9 - 2*x = 1
    variable: x
    answer: '4'
  answer_text: '$x=4$. Subtract 9 from both sides: $-2x=-8$. Divide both sides by $-2$: $x=4$. Check: $9-2\times4=1$.'
- id: jc12-12.1-eq-10
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: Is $x=6$ a solution of $3x-4=14$?
  answer_label: Is $x=6$ a solution of $3x-4=14$?
  check:
    kind: evaluate
    expression: 3*6 - 4
    answer: '14'
  answer_text: 'Yes. The left side is $3\times6-4=18-4=14$, which equals the right side. So $x=6$ is a solution.'
- id: jc12-12.1-eq-11
  section: '12.1'
  tier: O
  refs:
  - AF.4
  statement: 'The chapter problem: 110 adult tickets and $s$ student tickets make 200 tickets in total. Solve $110+s=200$ to find $s$.'
  answer_label: Solve $110+s=200$.
  check:
    kind: solve
    equation: 110 + s = 200
    variable: s
    answer: '90'
  answer_text: '$s=90$. Subtract 110 from both sides: $s=200-110=90$. So 90 student tickets were sold.'

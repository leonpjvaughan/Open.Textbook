# Junior Cycle Mathematics, Chapter 18, section 18.7.
#
# Choosing a method. The method is not proved — a correct answer reached by
# another route still passes — so each check proves the number. `expression`
# performs the calculation the chosen method gives, and `answer` is the value the
# reader is shown. Exact cases use `evaluate`; irrational ones use `approx` with a
# half-unit-of-the-last-place tolerance and their value lives in `answer_text`.
# The last record asks for the method and a reason, so it uses `structured`.
chapter: 18
oracles: [sympy, units]
symbols: {}

problems:
- id: jc18-18.7-hyp-1
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A right-angled triangle has legs of 9 cm and 12 cm. Find the hypotenuse. Say which method you used.'
  answer_label: 'Find the hypotenuse and name the method.'
  check:
    kind: evaluate
    expression: sqrt(9**2 + 12**2)
    answer: '15'
  answer_text: 'The hypotenuse is $15$ cm, found with Pythagoras. Two sides are known and no angle is given, so the two legs are squared and added: $81+144=225$, and $\sqrt{225}=15$.'

- id: jc18-18.7-opp-1
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A right-angled triangle has an angle of 30° and a hypotenuse of 10 m. Find the opposite side. Say which method you used.'
  answer_label: 'Find the opposite side and name the method.'
  check:
    kind: evaluate
    expression: 10*sin(30*pi/180)
    answer: '5'
  answer_text: 'The opposite side is $5$ m, found with a ratio. One side and one angle are known, so use sine: $10\sin 30^\circ=10\times0.5=5$.'

- id: jc18-18.7-angle-1
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A right-angled triangle has an opposite side of 6 m and an adjacent side of 8 m. Find the angle, correct to one decimal place. Say which method you used.'
  answer_label: 'Find the angle and name the method.'
  check:
    kind: approx
    value: atan(6/8)*180/pi
    target: '36.9'
    tolerance: '0.05'
  answer_text: 'The angle is $36.9$°, found with an inverse ratio. Two sides are known and an angle is wanted, so use $\tan^{-1}$: $\tan\theta=\frac{6}{8}=0.75$, and $\tan^{-1}(0.75)=36.869\ldots$°.'

- id: jc18-18.7-leg-1
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A right-angled triangle has a hypotenuse of 13 cm and one leg of 5 cm. Find the other leg. Say which method you used.'
  answer_label: 'Find the other leg and name the method.'
  check:
    kind: evaluate
    expression: sqrt(13**2 - 5**2)
    answer: '12'
  answer_text: 'The other leg is $12$ cm, found with Pythagoras. Two sides are known and no angle is given: $13^2-5^2=169-25=144$, and $\sqrt{144}=12$.'

- id: jc18-18.7-opp-2
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A right-angled triangle has an angle of 45° and an adjacent side of 9 cm. Find the opposite side. Say which method you used.'
  answer_label: 'Find the opposite side and name the method.'
  check:
    kind: evaluate
    expression: 9*tan(45*pi/180)
    answer: '9'
  answer_text: 'The opposite side is $9$ cm, found with a ratio. One side and one angle are known, so use tangent: $9\tan 45^\circ=9\times1=9$.'

- id: jc18-18.7-hyp-2
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A right-angled triangle has legs of 7 m and 24 m. Find the hypotenuse. Say which method you used.'
  answer_label: 'Find the hypotenuse and name the method.'
  check:
    kind: evaluate
    expression: sqrt(7**2 + 24**2)
    answer: '25'
  answer_text: 'The hypotenuse is $25$ m, found with Pythagoras. $49+576=625$, and $\sqrt{625}=25$.'

- id: jc18-18.7-angle-2
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A right-angled triangle has an opposite side of 8 m and a hypotenuse of 16 m. Find the angle. Say which method you used.'
  answer_label: 'Find the angle and name the method.'
  check:
    kind: evaluate
    expression: asin(8/16)*180/pi
    answer: '30'
  answer_text: 'The angle is $30$°, found with an inverse ratio. Two sides are known and an angle is wanted: $\sin\theta=\frac{8}{16}=0.5$, and $\sin^{-1}(0.5)=30^\circ$.'

- id: jc18-18.7-chapter
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'The chapter problem. You know the 15 m line to the top of the building and the 12 m distance along the ground. Find the height, and say which method you used and why.'
  answer_label: 'Find the height and name the method.'
  check:
    kind: evaluate
    expression: sqrt(15**2 - 12**2)
    answer: '9'
  answer_text: 'The height is $9$ m, found with Pythagoras. Two sides of the right-angled triangle are known and no angle is given, so the third side comes from $h^2+12^2=15^2$, giving $h^2=81$ and $h=9$.'

- id: jc18-18.7-opp-3
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A right-angled triangle has an angle of 40° and an adjacent side of 15 m. Find the opposite side, correct to one decimal place. Say which method you used.'
  answer_label: 'Find the opposite side and name the method.'
  check:
    kind: approx
    value: 15*tan(40*pi/180)
    target: '12.6'
    tolerance: '0.05'
  answer_text: 'The opposite side is $12.6$ m, found with a ratio. One side and one angle are known, so use tangent: $15\tan 40^\circ=12.586\ldots$'

- id: jc18-18.7-leg-2
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A right-angled triangle has a hypotenuse of 17 m and one leg of 15 m. Find the other leg. Say which method you used.'
  answer_label: 'Find the other leg and name the method.'
  check:
    kind: evaluate
    expression: sqrt(17**2 - 15**2)
    answer: '8'
  answer_text: 'The other leg is $8$ m, found with Pythagoras. $17^2-15^2=289-225=64$, and $\sqrt{64}=8$.'

- id: jc18-18.7-angle-3
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A ramp rises 1 m over a horizontal distance of 12 m. Find the angle of the ramp, correct to one decimal place. Say which method you used.'
  answer_label: 'Find the angle and name the method.'
  check:
    kind: approx
    value: atan(1/12)*180/pi
    target: '4.8'
    tolerance: '0.05'
  answer_text: 'The angle is $4.8$°, found with an inverse ratio. Two sides are known and an angle is wanted: $\tan\theta=\frac{1}{12}=0.0833\ldots$, and $\tan^{-1}(0.0833\ldots)=4.763\ldots$°.'

- id: jc18-18.7-reason
  section: '18.7'
  tier: O
  refs:
  - GT.4
  statement: 'A right-angled triangle has an angle of 35° and a hypotenuse of 10 cm. Explain whether you can use Pythagoras to find a missing side, and why.'
  answer_label: 'Explain whether Pythagoras can be used.'
  check:
    kind: structured
    requires: [state-method, give-reason]
    concepts: [method-choice]
    points:
    - id: state-method
      text: 'Pythagoras cannot be used, because only one side is known.'
      concepts: [method-choice]
    - id: give-reason
      text: 'Pythagoras needs two known sides, and here only the hypotenuse and an angle are given, so use a ratio such as sine.'
  answer_text: 'Pythagoras cannot be used, because it needs two known sides and only one side is given here. The question gives an angle and the hypotenuse, so use a trigonometric ratio, such as $\sin 35^\circ=\frac{\text{opposite}}{10}$.'

# Junior Cycle Mathematics, Chapter 12, section 12.2.
#
# An equation with a bracket is checked with `kind: solve`, so the verifier proves
# the solution set rather than trusting the expansion in the answer text. An
# equation with a fraction is checked the same way: the fraction bar is only a
# bracket around the whole top and the whole bottom. Units and words stay in
# `statement`: the CAS parses numbers and symbols only.
chapter: 12
symbols:
  x: {real: true}
  a: {real: true}

problems:
- id: jc12-12.2-bracket-1
  section: '12.2'
  tier: O
  refs:
  - AF.4
  statement: Solve $3(x+4)=21$.
  answer_label: Solve $3(x+4)=21$.
  check:
    kind: solve
    equation: 3*(x + 4) = 21
    variable: x
    answer: '3'
  answer_text: '$x=3$. Divide both sides by 3: $x+4=7$. Subtract 4: $x=3$. You can also expand the bracket first, but dividing is quicker here.'
- id: jc12-12.2-bracket-2
  section: '12.2'
  tier: O
  refs:
  - AF.4
  statement: Solve $2(x-5)=18$.
  answer_label: Solve $2(x-5)=18$.
  check:
    kind: solve
    equation: 2*(x - 5) = 18
    variable: x
    answer: '14'
  answer_text: '$x=14$. Divide both sides by 2: $x-5=9$. Add 5: $x=14$. Check: $2(14-5)=2\times9=18$.'
- id: jc12-12.2-bracket-3
  section: '12.2'
  tier: O
  refs:
  - AF.4
  statement: Solve $5(x+2)=3x+16$.
  answer_label: Solve $5(x+2)=3x+16$.
  check:
    kind: solve
    equation: 5*(x + 2) = 3*x + 16
    variable: x
    answer: '3'
  answer_text: '$x=3$. Expand the bracket: $5x+10=3x+16$. Subtract $3x$: $2x+10=16$. Subtract 10: $2x=6$. Divide by 2: $x=3$. The 5 multiplies both terms inside the bracket.'
- id: jc12-12.2-bracket-4
  section: '12.2'
  tier: O
  refs:
  - AF.4
  statement: Solve $4(x-1)=2x+6$.
  answer_label: Solve $4(x-1)=2x+6$.
  check:
    kind: solve
    equation: 4*(x - 1) = 2*x + 6
    variable: x
    answer: '5'
  answer_text: '$x=5$. Expand: $4x-4=2x+6$. Subtract $2x$: $2x-4=6$. Add 4: $2x=10$. Divide by 2: $x=5$. Check: $4(5-1)=16$ and $2\times5+6=16$.'
- id: jc12-12.2-fraction-1
  section: '12.2'
  tier: O
  refs:
  - AF.4
  statement: Solve $\frac{x}{3}+2=5$.
  answer_label: Solve $\frac{x}{3}+2=5$.
  check:
    kind: solve
    equation: x/3 + 2 = 5
    variable: x
    answer: '9'
  answer_text: '$x=9$. Subtract 2 from both sides: $\frac{x}{3}=3$. Multiply both sides by 3: $x=9$. Check: $9\div3+2=5$.'
- id: jc12-12.2-fraction-2
  section: '12.2'
  tier: O
  refs:
  - AF.4
  statement: Solve $\frac{x+1}{4}=3$.
  answer_label: Solve $\frac{x+1}{4}=3$.
  check:
    kind: solve
    equation: (x + 1)/4 = 3
    variable: x
    answer: '11'
  answer_text: '$x=11$. The bar groups the whole top, so multiply both sides by 4: $x+1=12$. Subtract 1: $x=11$. Check: $\frac{11+1}{4}=3$.'
- id: jc12-12.2-fraction-3
  section: '12.2'
  tier: O
  refs:
  - AF.4
  statement: Solve $\frac{x-2}{5}=4$.
  answer_label: Solve $\frac{x-2}{5}=4$.
  check:
    kind: solve
    equation: (x - 2)/5 = 4
    variable: x
    answer: '22'
  answer_text: '$x=22$. Multiply both sides by 5: $x-2=20$. Add 2: $x=22$. Check: $\frac{22-2}{5}=\frac{20}{5}=4$.'
- id: jc12-12.2-fraction-4
  section: '12.2'
  tier: O
  refs:
  - AF.4
  statement: Solve $\frac{2x+1}{3}=5$.
  answer_label: Solve $\frac{2x+1}{3}=5$.
  check:
    kind: solve
    equation: (2*x + 1)/3 = 5
    variable: x
    answer: '7'
  answer_text: '$x=7$. Multiply both sides by 3: $2x+1=15$. Subtract 1: $2x=14$. Divide by 2: $x=7$. Check: $\frac{2\times7+1}{3}=\frac{15}{3}=5$.'
- id: jc12-12.2-both-1
  section: '12.2'
  tier: O
  refs:
  - AF.4
  statement: Solve $2(x+3)=5x-3$.
  answer_label: Solve $2(x+3)=5x-3$.
  check:
    kind: solve
    equation: 2*(x + 3) = 5*x - 3
    variable: x
    answer: '3'
  answer_text: '$x=3$. Expand: $2x+6=5x-3$. Subtract $2x$: $6=3x-3$. Add 3: $9=3x$. Divide by 3: $x=3$. Check: $2(3+3)=12$ and $5\times3-3=12$.'
- id: jc12-12.2-anchor-1
  section: '12.2'
  tier: O
  refs:
  - AF.4
  statement: 'The chapter problem: use $s=200-a$ in the money equation $12a+8s=2040$. Solve $12a+8(200-a)=2040$.'
  answer_label: Solve $12a+8(200-a)=2040$.
  check:
    kind: solve
    equation: 12*a + 8*(200 - a) = 2040
    variable: a
    answer: '110'
  answer_text: '$a=110$. Expand the bracket: $12a+1600-8a=2040$, so $4a+1600=2040$. Subtract 1600: $4a=440$. Divide by 4: $a=110$. So 110 adult tickets were sold.'

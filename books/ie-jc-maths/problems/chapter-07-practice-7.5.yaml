# Junior Cycle Mathematics, Chapter 7, section 7.5.
#
# Simple interest is proved as "P * r * t" and compound interest as "P * (1+r)**t",
# so a record cannot report the same total for both. Where a compound total is not
# exact in euro and cent, the check is an `approx` with a half-cent tolerance, and
# the answer text names the rounding. The euro sign, the per-cent sign and the
# words stay in `statement`: the CAS parses numbers and symbols only.
chapter: 7
symbols: {}

problems:
- id: jc7-7.5-simple-interest-1
  section: '7.5'
  tier: O
  refs:
  - N.2
  statement: €2,000.00 is saved at $5\%$ simple interest for 3 years. Work out the interest.
  answer_label: Find the simple interest on €2,000.00 at $5\%$ for 3 years.
  check:
    kind: evaluate
    expression: 2000*5/100*3
    answer: '300'
  steps:
  - expr: 2000*5/100*3
  - expr: 2000*0.05*3
  - expr: '300'
  answer_text: >-
    €300.00. Simple interest is $I=P\times r\times t$, where $P$ is the principal,
    $r$ is the rate as a decimal, and $t$ is the number of years. So
    $I=2000\times0.05\times3=300$.
- id: jc7-7.5-simple-total-1
  section: '7.5'
  tier: O
  refs:
  - N.2
  statement: €2,000.00 is saved at $5\%$ simple interest for 3 years. Work out the total after
    3 years.
  answer_label: Find the total after 3 years of simple interest on €2,000.00 at $5\%$.
  check:
    kind: evaluate
    expression: 2000+2000*5/100*3
    answer: '2300'
  answer_text: >-
    €2,300.00. The interest is $2000\times0.05\times3=300$ euro, and the total is
    $2000+300=2300$ euro.
- id: jc7-7.5-compound-total-1
  section: '7.5'
  tier: O
  refs:
  - N.2
  statement: €2,000.00 is saved at $5\%$ compound interest for 2 years. Work out the total after
    2 years.
  answer_label: Find the compound total after 2 years on €2,000.00 at $5\%$.
  check:
    kind: evaluate
    expression: 2000*(1+5/100)**2
    answer: '2205'
  steps:
  - expr: 2000*(1+5/100)**2
  - expr: 2000*1.05**2
  - expr: '2205'
  answer_text: >-
    €2,205.00. Compound interest uses $A=P(1+r)^t$. Here
    $A=2000\times1.05^2=2000\times1.1025=2205$. The first year adds €100.00, and
    the second year adds €105.00, because the interest earns interest too.
- id: jc7-7.5-simple-interest-2
  section: '7.5'
  tier: O
  refs:
  - N.2
  statement: €500.00 is saved at $4\%$ simple interest for 2 years. Work out the interest and the
    total.
  answer_label: Find the simple interest and total on €500.00 at $4\%$ for 2 years.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 500*4/100*2
      answer: '40'
    - kind: evaluate
      expression: 500+40
      answer: '540'
  answer_text: >-
    The interest is €40.00, and the total is €540.00. The interest is
    $500\times0.04\times2=40$ euro, and $500+40=540$ euro.
- id: jc7-7.5-compound-total-2
  section: '7.5'
  tier: O
  refs:
  - N.2
  statement: €500.00 is saved at $4\%$ compound interest for 2 years. Work out the total after
    2 years.
  answer_label: Find the compound total after 2 years on €500.00 at $4\%$.
  check:
    kind: evaluate
    expression: 500*(1+4/100)**2
    answer: '540.8'
  answer_text: >-
    €540.80. Compound interest gives $A=500\times1.04^2=500\times1.0816=540.80$.
    The first year adds €20.00, and the second year adds €20.80, because the
    second year's interest includes interest on the first €20.00.
- id: jc7-7.5-compound-total-3
  section: '7.5'
  tier: O
  refs:
  - N.2
  statement: €1,000.00 is saved at $3\%$ compound interest for 3 years. Work out the total after
    3 years, correct to the nearest cent.
  answer_label: Find the compound total after 3 years on €1,000.00 at $3\%$.
  check:
    kind: approx
    value: 1000*(1+3/100)**3
    target: '1092.73'
    tolerance: '0.005'
  answer_text: >-
    €1,092.73. Compound interest gives $A=1000\times1.03^3$. Now
    $1.03^3=1.092727$, so $A=1092.727$ euro, which rounds to €1,092.73. The exact
    value is not a whole number of cent, so it must be rounded.
- id: jc7-7.5-simple-interest-3
  section: '7.5'
  tier: O
  refs:
  - N.2
  statement: €1,000.00 is saved at $3\%$ simple interest for 3 years. Work out the interest and
    the total.
  answer_label: Find the simple interest and total on €1,000.00 at $3\%$ for 3 years.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 1000*3/100*3
      answer: '90'
    - kind: evaluate
      expression: 1000+90
      answer: '1090'
  answer_text: >-
    The interest is €90.00, and the total is €1,090.00. Simple interest is
    $1000\times0.03\times3=90$ euro, and $1000+90=1090$ euro.
- id: jc7-7.5-difference-1
  section: '7.5'
  tier: O
  refs:
  - N.2
  statement: €1,000.00 is saved at $3\%$ for 3 years. Work out the compound total minus the
    simple total, correct to the nearest cent.
  answer_label: Find how much more compound interest gives than simple interest.
  check:
    kind: approx
    value: 1000*(1+3/100)**3-1090
    target: '2.73'
    tolerance: '0.005'
  answer_text: >-
    €2.73. The compound total is €1,092.727, and the simple total is €1,090.00.
    The difference is $1092.727-1090=2.727$ euro, which rounds to €2.73. Compound
    interest is larger, because each year's interest earns interest of its own.
- id: jc7-7.5-compound-total-4
  section: '7.5'
  tier: H
  refs:
  - N.2
  statement: €2,000.00 is saved at $5\%$ compound interest for 10 years. Work out the total after
    10 years, correct to the nearest cent. Also work out the simple total for the same 10 years.
  answer_label: Find the compound total and the simple total on €2,000.00 at $5\%$ for 10 years.
  check:
    kind: all
    checks:
    - kind: approx
      value: 2000*(1+5/100)**10
      target: '3257.79'
      tolerance: '0.005'
    - kind: evaluate
      expression: 2000+2000*5/100*10
      answer: '3000'
  answer_text: >-
    The compound total is €3,257.79, and the simple total is €3,000.00. Compound
    interest gives $A=2000\times1.05^{10}$. Now $1.05^{10}=1.628894\ldots$, so
    $A=3257.789\ldots$ euro, which rounds to €3,257.79. Simple interest gives
    $2000+2000\times0.05\times10=2000+1000=3000$ euro. Over 10 years the
    difference is €257.79, and it grows every year.
- id: jc7-7.5-simple-interest-4
  section: '7.5'
  tier: O
  refs:
  - N.2
  statement: €1,200.00 is saved at $6\%$ simple interest for 1 year. Work out the interest.
  answer_label: Find the simple interest on €1,200.00 at $6\%$ for 1 year.
  check:
    kind: evaluate
    expression: 1200*6/100*1
    answer: '72'
  answer_text: >-
    €72.00. Simple interest is $1200\times0.06\times1=72$ euro. After one year,
    simple and compound interest give the same amount, because there is no earlier
    interest for the second year to grow.

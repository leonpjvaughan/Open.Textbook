# Mixed practice for the Junior Cycle Mathematics Chapter 12 Review.
#
# Fourteen questions covering linear equations, equations with brackets and
# fractions, simultaneous equations, linear inequalities, a number-line graph,
# trial and improvement, working backwards, and interleaved expanding and
# simplifying from Chapter 11.
#
# Honest limit: the verifier proves the algebra, equation solutions, systems
# and intervals, not which method the reader chose or the number-line drawing
# for Question 10 (where `kind: inequality` proves the closed endpoint and
# direction, while the diagram itself is described in prose).
chapter: 12
symbols:
  x: {real: true}
  y: {real: true}
  a: {real: true}

problems:
  - id: r1-linear-equation
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Solve $5x+3=23$.'
    answer_label: 'Solve $5x+3=23$.'
    check:
      kind: solve
      equation: '5*x + 3 = 23'
      variable: x
      answer: '4'
    answer_text: '$x=4$. Undo the operations in reverse order: subtract 3 from both sides to get $5x=20$, then divide both sides by 5 to get $x=4$. Check: $5\times4+3=23$.'

  - id: r2-bracket-equation
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Solve $3(x-4)=18$.'
    answer_label: 'Solve $3(x-4)=18$.'
    check:
      kind: solve
      equation: '3*(x - 4) = 18'
      variable: x
      answer: '10'
    answer_text: '$x=10$. Clear the bracket by dividing both sides by 3 to get $x-4=6$, then add 4 to both sides to get $x=10$. Expanding first gives $3x-12=18$, $3x=30$, $x=10$.'

  - id: r3-fraction-equation
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Solve $\dfrac{x+5}{2}=6$.'
    answer_label: 'Solve $\dfrac{x+5}{2}=6$.'
    check:
      kind: solve
      equation: '(x + 5)/2 = 6'
      variable: x
      answer: '7'
    answer_text: '$x=7$. Clear the fraction by multiplying both sides by 2 to get $x+5=12$, then subtract 5 from both sides to get $x=7$. Check: $(7+5)\div2=6$.'

  - id: r4-both-sides-equation
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Solve $4x-1=2x+9$.'
    answer_label: 'Solve $4x-1=2x+9$.'
    check:
      kind: solve
      equation: '4*x - 1 = 2*x + 9'
      variable: x
      answer: '5'
    answer_text: '$x=5$. Subtract $2x$ from both sides to collect the $x$ terms: $2x-1=9$. Add 1 to get $2x=10$, then divide by 2 to get $x=5$.'

  - id: r5-simultaneous-substitution
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Solve $y=x+5$ and $x+y=13$.'
    answer_label: 'Solve $y=x+5$ and $x+y=13$.'
    check:
      kind: system
      equations: ['y = x + 5', 'x + y = 13']
      variables: [x, y]
      answer: [[4, 9]]
    answer_text: '$x=4$ and $y=9$. Use substitution because $y$ is already the subject: $x+(x+5)=13$, so $2x+5=13$ and $2x=8$, giving $x=4$. Then $y=4+5=9$.'

  - id: r6-simultaneous-elimination-1
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Solve $x+y=10$ and $x-y=2$.'
    answer_label: 'Solve $x+y=10$ and $x-y=2$.'
    check:
      kind: system
      equations: ['x + y = 10', 'x - y = 2']
      variables: [x, y]
      answer: [[6, 4]]
    answer_text: '$x=6$ and $y=4$. Use elimination: add the two equations to remove $y$, giving $2x=12$, so $x=6$. Substitute into $x+y=10$ to get $y=4$.'

  - id: r7-simultaneous-elimination-2
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Solve $2x+3y=13$ and $4x-3y=17$.'
    answer_label: 'Solve $2x+3y=13$ and $4x-3y=17$.'
    check:
      kind: system
      equations: ['2*x + 3*y = 13', '4*x - 3*y = 17']
      variables: [x, y]
      answer: [[5, 1]]
    answer_text: '$x=5$ and $y=1$. Use elimination: add the two equations because $+3y$ and $-3y$ cancel, giving $6x=30$ and $x=5$. Then $2(5)+3y=13$, so $3y=3$ and $y=1$.'

  - id: r8-inequality-negative
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Solve $5-2x>9$.'
    answer_label: 'Solve $5-2x>9$.'
    check:
      kind: inequality
      variable: x
      inequality: '5 - 2*x > 9'
      answer: 'Interval.open(-oo, -2)'
    answer_text: '$x<-2$. Subtract 5 from both sides to get $-2x>4$. Divide both sides by $-2$ and turn the inequality sign around to get $x<-2$.'

  - id: r9-inequality-bracket
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Solve $3(x+1)\leq15$.'
    answer_label: 'Solve $3(x+1)\leq15$.'
    check:
      kind: inequality
      variable: x
      inequality: '3*(x + 1) <= 15'
      answer: 'Interval(-oo, 4)'
    answer_text: '$x\leq4$. Divide both sides by 3 (positive, so the sign stays the same) to get $x+1\leq5$. Subtract 1 from both sides to get $x\leq4$.'

  - id: r10-inequality-number-line
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Draw the solution set of $x\geq-1$.'
    answer_label: 'Draw the solution set of $x\geq-1$.'
    check:
      kind: inequality
      variable: x
      inequality: 'x >= -1'
      answer: 'Interval(-1, oo)'
    answer_text: 'On a number line for real numbers, draw a closed (filled) circle at $-1$, because $-1$ is included, and shade a solid line with an arrow pointing to the right. For integers, mark filled dots at $-1, 0, 1, 2, \ldots$.'

  - id: r11-trial-and-improvement
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'Use trial and improvement to solve $x^2+x=42$.'
    answer_label: 'Use trial and improvement to solve $x^2+x=42$.'
    check:
      kind: solve
      equation: 'x**2 + x = 42'
      variable: x
      answer: ['-7', '6']
    answer_text: '$x=6$ (and $x=-7$ is also a solution). Try $x=5$: $5^2+5=30$, which is too small. Try $x=7$: $7^2+7=56$, which is too large. Try $x=6$: $6^2+6=36+6=42$, exact. Checking negative integers also gives $(-7)^2+(-7)=49-7=42$.'

  - id: r12-working-backwards
    section: Review
    tier: O
    refs: [AF.4]
    statement: 'I think of a number, multiply it by 5, and add 2. The result is 37. Find the number.'
    answer_label: 'Find the number.'
    check:
      kind: solve
      equation: '5*x + 2 = 37'
      variable: x
      answer: '7'
    answer_text: '$7$. Work backwards from 37: subtract 2 to get 35, then divide by 5 to get 7. As an equation, $5x+2=37$ gives $5x=35$ and $x=7$.'

  - id: r13-expand-brackets
    section: Review
    tier: O
    refs: [AF.3]
    statement: 'Expand $(x+3)(x+2)$.'
    answer_label: 'Expand $(x+3)(x+2)$.'
    check:
      kind: evaluate
      expression: '(x + 3)*(x + 2)'
      answer: 'x**2 + 5*x + 6'
    answer_text: '$x^2+5x+6$. Multiply every term in the first bracket by every term in the second: $x^2+2x+3x+6=x^2+5x+6$.'

  - id: r14-simplify-like-terms
    section: Review
    tier: O
    refs: [AF.3]
    statement: 'Simplify $7a+3a-2a$.'
    answer_label: 'Simplify $7a+3a-2a$.'
    check:
      kind: evaluate
      expression: '7*a + 3*a - 2*a'
      answer: '8*a'
    answer_text: '$8a$. All three terms are like terms in $a$, so combine the coefficients: $7+3-2=8$, giving $8a$.'

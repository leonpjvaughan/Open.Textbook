# Junior Cycle Mathematics, Chapter 5, section 5.3.
#
# Every check is an arithmetic identity the CAS proves, so the answer the reader
# is shown is the answer the verifier proved. A division of fractions is written
# in brackets, "(1/2)/(1/4)", because the CAS reads "/" from left to right and
# "1/2 / 1/4" would mean "((1/2)/1)/4". Units and words stay in `statement`.
chapter: 5
symbols: {}

problems:
- id: jc5-5.3-mult-1
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{2}{3}\times\frac{3}{4}$.
  answer_label: Work out $\frac{2}{3}\times\frac{3}{4}$.
  check:
    kind: evaluate
    expression: 2/3 * 3/4
    answer: 1/2
  steps:
  - expr: 2/3 * 3/4
  - expr: 6/12
  - expr: 1/2
  answer_text: >-
    $\frac{1}{2}$. Multiply the numerators and multiply the denominators:
    $\frac{2\times3}{3\times4}=\frac{6}{12}$. Then simplify by dividing both parts
    by 6.
- id: jc5-5.3-mult-2
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{3}{5}\times\frac{10}{9}$.
  answer_label: Work out $\frac{3}{5}\times\frac{10}{9}$.
  check:
    kind: evaluate
    expression: 3/5 * 10/9
    answer: 2/3
  steps:
  - expr: 3/5 * 10/9
  - expr: 30/45
  - expr: 2/3
  answer_text: >-
    $\frac{2}{3}$. Multiplying straight across gives $\frac{30}{45}$. Divide the
    top and the bottom by 15 to simplify it. Cancelling the 3 and the 9 first
    would reach the same answer with smaller numbers.
- id: jc5-5.3-div-1
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{1}{2}\div\frac{1}{4}$.
  answer_label: Work out $\frac{1}{2}\div\frac{1}{4}$.
  check:
    kind: evaluate
    expression: (1/2)/(1/4)
    answer: '2'
  steps:
  - expr: (1/2)/(1/4)
  - expr: (1/2)*(4/1)
  - expr: 4/2
  - expr: '2'
  answer_text: >-
    $2$. Dividing by a fraction is the same as multiplying by the fraction turned
    upside down. So $\frac{1}{2}\div\frac{1}{4}=\frac{1}{2}\times\frac{4}{1}=2$.
    There are two quarters in one half.
- id: jc5-5.3-div-2
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{3}{4}\div\frac{3}{8}$.
  answer_label: Work out $\frac{3}{4}\div\frac{3}{8}$.
  check:
    kind: evaluate
    expression: (3/4)/(3/8)
    answer: '2'
  steps:
  - expr: (3/4)/(3/8)
  - expr: (3/4)*(8/3)
  - expr: 24/12
  - expr: '2'
  answer_text: >-
    $2$. Turn the second fraction upside down and multiply:
    $\frac{3}{4}\times\frac{8}{3}=\frac{24}{12}=2$. There are two eighths of a
    whole in three quarters.
- id: jc5-5.3-mult-3
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{4}{5}\times15$.
  answer_label: Work out $\frac{4}{5}\times15$.
  check:
    kind: evaluate
    expression: 4/5 * 15
    answer: '12'
  steps:
  - expr: 4/5 * 15
  - expr: 60/5
  - expr: '12'
  answer_text: >-
    $12$. A whole number is a fraction with denominator 1, so
    $\frac{4}{5}\times\frac{15}{1}=\frac{60}{5}=12$. Divide 15 by 5 first to see
    that this is four groups of 3.
- id: jc5-5.3-of-1
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{3}{8}$ of 24.
  answer_label: Work out $\frac{3}{8}$ of 24.
  check:
    kind: evaluate
    expression: 3/8 * 24
    answer: '9'
  steps:
  - expr: 3/8 * 24
  - expr: 72/8
  - expr: '9'
  answer_text: >-
    $9$. The word "of" means multiply, so this is $\frac{3}{8}\times24$. Since
    $24\div8=3$, one eighth of 24 is 3, and three eighths is $3\times3=9$.
- id: jc5-5.3-punch-1
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: One jug of punch holds $\frac{3}{2}$ litres. The stall needs 12 litres. How many
    jugs is that?
  answer_label: Work out $12\div\frac{3}{2}$.
  check:
    kind: evaluate
    expression: 12/(3/2)
    answer: '8'
  steps:
  - expr: 12/(3/2)
  - expr: 12*(2/3)
  - expr: 24/3
  - expr: '8'
  answer_text: >-
    $8$ jugs. Dividing by $\frac{3}{2}$ is the same as multiplying by
    $\frac{2}{3}$, because the jug is one and a half litres. So
    $12\div\frac{3}{2}=12\times\frac{2}{3}=8$.
- id: jc5-5.3-div-3
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: Work out $6\div\frac{3}{4}$.
  answer_label: Work out $6\div\frac{3}{4}$.
  check:
    kind: evaluate
    expression: 6/(3/4)
    answer: '8'
  steps:
  - expr: 6/(3/4)
  - expr: 6*(4/3)
  - expr: 24/3
  - expr: '8'
  answer_text: >-
    $8$. Turn $\frac{3}{4}$ upside down and multiply: $6\times\frac{4}{3}=8$. The
    answer is bigger than 6, because three quarters fit into 6 more than six
    times.
- id: jc5-5.3-mult-4
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{2}{5}\times\frac{5}{2}$.
  answer_label: Work out $\frac{2}{5}\times\frac{5}{2}$.
  check:
    kind: evaluate
    expression: 2/5 * 5/2
    answer: '1'
  steps:
  - expr: 2/5 * 5/2
  - expr: 10/10
  - expr: '1'
  answer_text: >-
    $1$. The two fractions are upside-down versions of each other, so multiplying
    them gives 1. The numerator and the denominator cancel completely.
- id: jc5-5.3-div-4
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{1}{3}\div2$.
  answer_label: Work out $\frac{1}{3}\div2$.
  check:
    kind: evaluate
    expression: (1/3)/2
    answer: 1/6
  steps:
  - expr: (1/3)/2
  - expr: (1/3)*(1/2)
  - expr: 1/6
  answer_text: >-
    $\frac{1}{6}$. Dividing by 2 is the same as multiplying by $\frac{1}{2}$. So
    $\frac{1}{3}\div2=\frac{1}{3}\times\frac{1}{2}=\frac{1}{6}$. Sharing a third
    into two equal parts gives a sixth each.
- id: jc5-5.3-punch-2
  section: '5.3'
  tier: O
  refs:
  - N.2
  statement: Each jug uses $\frac{3}{4}$ of a litre of orange juice. How much orange juice is
    needed for 8 jugs?
  answer_label: Work out $8\times\frac{3}{4}$.
  check:
    kind: evaluate
    expression: 8 * 3/4
    answer: '6'
  steps:
  - expr: 8 * 3/4
  - expr: 24/4
  - expr: '6'
  answer_text: >-
    $6$ litres. Multiply: $8\times\frac{3}{4}=\frac{24}{4}=6$. Each jug takes
    three quarters, and eight groups of three quarters make six whole litres.

# Junior Cycle Mathematics, Chapter 6, section 6.1.
#
# A ratio is simplified by dividing both parts by their highest common factor, so
# every check proves that factor with `gcd` as well as the two divisions. A record
# therefore cannot pass by dividing both parts by a number that is not the highest
# common factor: the arithmetic and the method agree. Ratios with three parts use
# three divisions and one gcd of all three, written as gcd(gcd(a,b),c).
chapter: 6
symbols: {}

problems:
- id: jc6-6.1-simplify-1
  section: '6.1'
  tier: O
  refs:
  - N.2
  statement: Write the ratio $6:9$ in its simplest form.
  answer_label: Write the ratio $6:9$ in its simplest form.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: gcd(6,9)
      answer: '3'
    - kind: evaluate
      expression: 6/3
      answer: '2'
    - kind: evaluate
      expression: 9/3
      answer: '3'
  answer_text: >-
    $2:3$. Both parts divide by 3, and 3 is the highest common factor of 6 and 9,
    so nothing is left to divide. Dividing both parts by the same number keeps
    the comparison the same.
- id: jc6-6.1-simplify-2
  section: '6.1'
  tier: O
  refs:
  - N.2
  statement: Write the ratio $15:25$ in its simplest form.
  answer_label: Write the ratio $15:25$ in its simplest form.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: gcd(15,25)
      answer: '5'
    - kind: evaluate
      expression: 15/5
      answer: '3'
    - kind: evaluate
      expression: 25/5
      answer: '5'
  answer_text: >-
    $3:5$. The highest common factor of 15 and 25 is 5, so divide both parts by 5.
    The order matters: $3:5$ compares the first amount with the second, so it is
    not the same as $5:3$.
- id: jc6-6.1-simplify-3
  section: '6.1'
  tier: O
  refs:
  - N.2
  statement: Write the ratio $24:36$ in its simplest form.
  answer_label: Write the ratio $24:36$ in its simplest form.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: gcd(24,36)
      answer: '12'
    - kind: evaluate
      expression: 24/12
      answer: '2'
    - kind: evaluate
      expression: 36/12
      answer: '3'
  answer_text: >-
    $2:3$. The highest common factor of 24 and 36 is 12. You could divide by 2 and
    then by 6, or by 4 and then by 3, and you would still reach $2:3$ — the
    simplest form is the same however you get there.
- id: jc6-6.1-simplify-three
  section: '6.1'
  tier: O
  refs:
  - N.2
  statement: Write the ratio $2:6:10$ in its simplest form.
  answer_label: Write the ratio $2:6:10$ in its simplest form.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: gcd(gcd(2,6),10)
      answer: '2'
    - kind: evaluate
      expression: 2/2
      answer: '1'
    - kind: evaluate
      expression: 6/2
      answer: '3'
    - kind: evaluate
      expression: 10/2
      answer: '5'
  answer_text: >-
    $1:3:5$. All three parts are even, so divide every part by 2. A ratio with
    three parts is simplified in the same way as one with two: divide every part
    by the same number, and stop when the parts share no common factor.
- id: jc6-6.1-recipe
  section: '6.1'
  tier: O
  refs:
  - N.2
  statement: A recipe uses 200 g of flour and 150 g of sugar. Write the ratio of
    flour to sugar in its simplest form.
  answer_label: Write the ratio of flour to sugar in its simplest form.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: gcd(200,150)
      answer: '50'
    - kind: evaluate
      expression: 200/50
      answer: '4'
    - kind: evaluate
      expression: 150/50
      answer: '3'
  answer_text: >-
    $4:3$. The highest common factor of 200 and 150 is 50, so divide both by 50.
    The units must match before you compare: both amounts here are in grams. If
    one were in kilograms you would change it first.
- id: jc6-6.1-class
  section: '6.1'
  tier: O
  refs:
  - N.2
  statement: A class has 12 girls and 18 boys. Write the ratio of girls to boys in
    its simplest form.
  answer_label: Write the ratio of girls to boys in its simplest form.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: gcd(12,18)
      answer: '6'
    - kind: evaluate
      expression: 12/6
      answer: '2'
    - kind: evaluate
      expression: 18/6
      answer: '3'
  answer_text: >-
    $2:3$. Divide both parts by 6, the highest common factor of 12 and 18. The
    simplified ratio says that for every 2 girls there are 3 boys. The class does
    not have 2 girls and 3 boys — the ratio compares, it does not count.
- id: jc6-6.1-equivalent
  section: '6.1'
  tier: O
  refs:
  - N.2
  statement: Write the ratio $4:7$ as an equivalent ratio whose first part is 20.
  answer_label: Write the ratio $4:7$ with first part 20.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 20/4
      answer: '5'
    - kind: evaluate
      expression: 4*5
      answer: '20'
    - kind: evaluate
      expression: 7*5
      answer: '35'
  answer_text: >-
    $20:35$. The first part went from 4 to 20, which is a multiplication by 5, so
    multiply the second part by 5 as well. Multiplying both parts by the same
    number gives an equivalent ratio, and the comparison is unchanged.
- id: jc6-6.1-three-parts
  section: '6.1'
  tier: O
  refs:
  - N.2
  statement: A bag holds 5 red, 10 blue and 15 green beads. Write the ratio of
    red to blue to green in its simplest form.
  answer_label: Write the ratio of red to blue to green in its simplest form.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: gcd(gcd(5,10),15)
      answer: '5'
    - kind: evaluate
      expression: 5/5
      answer: '1'
    - kind: evaluate
      expression: 10/5
      answer: '2'
    - kind: evaluate
      expression: 15/5
      answer: '3'
  answer_text: >-
    $1:2:3$. Divide every part by 5. The simplest form $1:2:3$ tells you that
    there are twice as many blue beads as red, and three times as many green as
    red — the whole picture is still there after simplifying.
- id: jc6-6.1-order
  section: '6.1'
  tier: O
  refs:
  - N.2
  statement: A group has 3 boys and 5 girls. Write the ratio of boys to girls, and
    the ratio of girls to boys. Explain why the two ratios are different.
  answer_label: Write both ratios and explain why they differ.
  check:
    kind: compare
    lhs: 3/5
    relation: '!='
    rhs: 5/3
  answer_text: >-
    Boys to girls is $3:5$; girls to boys is $5:3$. The two are different because
    a ratio is read in order. The first part names the first thing mentioned, so
    swapping the words swaps the numbers. A ratio is not a fraction to be flipped
    without thinking about which way round the question is.
- id: jc6-6.1-one-to-n
  section: '6.1'
  tier: H
  refs:
  - N.2
  statement: Write the ratio $5:8$ in the form $1:n$.
  answer_label: Write the ratio $5:8$ in the form $1:n$.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 5/5
      answer: '1'
    - kind: evaluate
      expression: 8/5
      answer: '1.6'
  answer_text: >-
    $1:1.6$. Dividing both parts by 5 makes the first part 1. This form is useful
    when you want to compare many ratios with different first parts: each one
    tells you how much of the second amount there is for every 1 of the first.

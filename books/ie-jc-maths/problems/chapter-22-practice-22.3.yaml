# Junior Cycle Mathematics, Chapter 22, section 22.3.
#
# The counts in a frequency table are the data the reader is given, so every
# answer is an arithmetic identity the CAS proves: a total is a sum, a class count
# is a sum, and the modal class is a chain of `compare`s. Why the total must equal
# the sample size is a reason, and uses `structured`.
chapter: 22
oracles: [sympy, units]
symbols: {}

problems:
- id: jc22-22.3-total-1
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'A tally shows 3 marks for 5, 5 marks for 6 and 2 marks for 7. How many answers were collected?'
  answer_label: 'Find the total number of answers.'
  check:
    kind: evaluate
    expression: 3 + 5 + 2
    answer: '10'
  answer_text: 'The frequencies add to $3+5+2=10$, so 10 answers were collected.'

- id: jc22-22.3-pets
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'The number of pets in 10 homes is $0, 1, 2, 1, 1, 3, 0, 1, 2, 1$. The frequencies of 0, 1, 2 and 3 are 2, 5, 2 and 1. How many homes are there?'
  answer_label: 'Check the total.'
  check:
    kind: evaluate
    expression: 2 + 5 + 2 + 1
    answer: '10'
  answer_text: 'The frequencies add to $2+5+2+1=10$, which is the number of homes. The most common number of pets is 1, because it has the largest frequency.'

- id: jc22-22.3-die-total
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'A die is rolled 20 times. The faces 1 to 6 come up with frequencies 4, 3, 2, 5, 3 and 3. Check that the frequencies add to 20.'
  answer_label: 'Add the frequencies.'
  check:
    kind: evaluate
    expression: 4 + 3 + 2 + 5 + 3 + 3
    answer: '20'
  answer_text: 'The frequencies add to $4+3+2+5+3+3=20$, which matches the number of rolls.'

- id: jc22-22.3-die-45
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'Use the die table with frequencies 4, 3, 2, 5, 3 and 3 for the faces 1 to 6. How many rolls showed a 4 or a 5?'
  answer_label: 'Find the number of rolls showing 4 or 5.'
  check:
    kind: evaluate
    expression: 5 + 3
    answer: '8'
  answer_text: 'The frequency of 4 is 5 and the frequency of 5 is 3, so $5+3=8$ rolls showed a 4 or a 5.'

- id: jc22-22.3-homework
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'A grouped table shows the minutes 30 students spent on homework: 0 to 19 has frequency 4, 20 to 39 has 9, 40 to 59 has 8, 60 to 79 has 6 and 80 to 99 has 3. How many students spent at least 40 minutes?'
  answer_label: 'Find the number of students.'
  check:
    kind: evaluate
    expression: 8 + 6 + 3
    answer: '17'
  answer_text: 'At least 40 minutes means the classes 40 to 59, 60 to 79 and 80 to 99. Their frequencies add to $8+6+3=17$ students.'

- id: jc22-22.3-sleep-total
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'The 20 sleep answers give frequencies 3, 3, 4, 5, 3 and 2 for the values 5, 6, 7, 8, 9 and 10. Check that the frequencies add to 20.'
  answer_label: 'Add the sleep frequencies.'
  check:
    kind: evaluate
    expression: 3 + 3 + 4 + 5 + 3 + 2
    answer: '20'
  answer_text: 'The frequencies add to $3+3+4+5+3+2=20$, which matches the 20 students.'

- id: jc22-22.3-sleep-fewer7
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'Use the sleep frequency table with frequencies 3, 3, 4, 5, 3 and 2 for the values 5 to 10. How many students slept fewer than 7 hours?'
  answer_label: 'Find how many students slept fewer than 7 hours.'
  check:
    kind: evaluate
    expression: 3 + 3
    answer: '6'
  answer_text: 'Fewer than 7 hours means 5 or 6 hours. The frequencies are 3 and 3, so $3+3=6$ students.'

- id: jc22-22.3-sleep-atleast8
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'Use the sleep frequency table with frequencies 3, 3, 4, 5, 3 and 2 for the values 5 to 10. How many students slept at least 8 hours?'
  answer_label: 'Find how many students slept at least 8 hours.'
  check:
    kind: evaluate
    expression: 5 + 3 + 2
    answer: '10'
  answer_text: 'At least 8 hours means 8, 9 or 10 hours. The frequencies add to $5+3+2=10$ students, which is half of the sample.'

- id: jc22-22.3-modal-sleep
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'The sleep frequencies are 3, 3, 4, 5, 3 and 2 for the values 5, 6, 7, 8, 9 and 10. Which value is the most common?'
  answer_label: 'Find the most common value.'
  check:
    kind: all
    checks:
    - kind: compare
      relation: '>'
      lhs: '5'
      rhs: '3'
    - kind: compare
      relation: '>'
      lhs: '5'
      rhs: '4'
    - kind: compare
      relation: '>'
      lhs: '5'
      rhs: '2'
  answer_text: 'The largest frequency is 5, and it belongs to 8 hours. So 8 hours is the most common value.'

- id: jc22-22.3-modal-homework
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'The homework frequencies for the classes 0 to 19, 20 to 39, 40 to 59, 60 to 79 and 80 to 99 are 4, 9, 8, 6 and 3. Which class is the most common?'
  answer_label: 'Find the most common class.'
  check:
    kind: all
    checks:
    - kind: compare
      relation: '>'
      lhs: '9'
      rhs: '4'
    - kind: compare
      relation: '>'
      lhs: '9'
      rhs: '8'
    - kind: compare
      relation: '>'
      lhs: '9'
      rhs: '6'
    - kind: compare
      relation: '>'
      lhs: '9'
      rhs: '3'
  answer_text: 'The largest frequency is 9, which belongs to the class 20 to 39 minutes. That is the most common class.'

- id: jc22-22.3-why-total
  section: '22.3'
  tier: O
  refs:
  - SP.3
  statement: 'Why must the frequencies in a frequency table add to the number of answers collected?'
  answer_label: 'Explain why the frequencies add to the total.'
  check:
    kind: structured
    requires: [give-reason]
    concepts: [frequency-table]
    points:
    - id: give-reason
      text: 'Every answer is counted in exactly one row, so the rows together hold every answer.'
      concepts: [frequency-table]
  answer_text: 'Every answer is placed in exactly one row, so the rows together contain every answer once. The frequencies therefore add to the number of answers collected. If the total is wrong, one answer was missed or one row was counted twice.'

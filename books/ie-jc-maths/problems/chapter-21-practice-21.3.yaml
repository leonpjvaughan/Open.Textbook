# Junior Cycle Mathematics, Chapter 21, section 21.3.
#
# When the outcomes are equally likely, the probability is a count divided by a
# count, so every record is an `evaluate` on that fraction. The one `structured`
# record asks the reader to explain why a colour count is not a probability; it
# proves the model answer contains its steps in order, not that the explanation
# is the best one.
chapter: 21
oracles: [sympy, units]
symbols: {}

problems:
- id: jc21-21.3-die-even
  section: '21.3'
  tier: O
  refs:
  - SP.2
  statement: 'A fair six-sided die is rolled. Find the probability of an even number.'
  answer_label: 'Find the probability of an even number.'
  check:
    kind: evaluate
    expression: 3/6
    answer: '1/2'
  answer_text: '$\frac{3}{6}=\frac12$. The even results are 2, 4 and 6, so 3 of the 6 equally likely outcomes match. The fraction simplifies to one half.'

- id: jc21-21.3-die-greater
  section: '21.3'
  tier: O
  refs:
  - SP.2
  statement: 'A fair six-sided die is rolled. Find the probability of a number greater than 4.'
  answer_label: 'Find the probability of a number greater than 4.'
  check:
    kind: evaluate
    expression: 2/6
    answer: '1/3'
  answer_text: '$\frac{2}{6}=\frac13$. The results greater than 4 are 5 and 6, so 2 of the 6 outcomes match. The result 4 is not greater than 4.'

- id: jc21-21.3-star-prize
  section: '21.3'
  tier: O
  refs:
  - SP.2
  statement: 'The open-day game has 24 equally likely outcomes. Find the probability of the star prize, the die showing 6 and the spinner landing on A.'
  answer_label: 'Find the probability of the star prize.'
  check:
    kind: evaluate
    expression: 1/24
    answer: '1/24'
  answer_text: '$\frac{1}{24}$. Exactly one of the 24 outcomes is a 6 with an A, so the star prize is unlikely. As a decimal it is about $0.042$, which is close to 0.'

- id: jc21-21.3-spinner-a
  section: '21.3'
  tier: O
  refs:
  - SP.2
  statement: 'The open-day game has 24 equally likely outcomes. Find the probability that the spinner lands on A.'
  answer_label: 'Find the probability that the spinner lands on A.'
  check:
    kind: evaluate
    expression: 6/24
    answer: '1/4'
  answer_text: '$\frac{6}{24}=\frac14$. For each of the 6 die results there is one outcome with an A, so 6 of the 24 outcomes match. That is the same as the 1 sector out of 4 on the spinner.'

- id: jc21-21.3-even-and-a
  section: '21.3'
  tier: O
  refs:
  - SP.2
  statement: 'The open-day game has 24 equally likely outcomes. Find the probability that the die shows an even number and the spinner lands on A.'
  answer_label: 'Find the probability that the die shows an even number and the spinner lands on A.'
  check:
    kind: evaluate
    expression: 3/24
    answer: '1/8'
  answer_text: '$\frac{3}{24}=\frac18$. The even results are 2, 4 and 6, and each pairs with the single A sector, so 3 of the 24 outcomes match.'

- id: jc21-21.3-counters-green
  section: '21.3'
  tier: O
  refs:
  - SP.2
  statement: 'A bag holds 4 green counters and 1 yellow counter. One counter is taken at random. Find the probability that it is green.'
  answer_label: 'Find the probability that it is green.'
  check:
    kind: evaluate
    expression: 4/5
    answer: '4/5'
  answer_text: '$\frac45$. Each of the 5 counters is equally likely, and 4 of them are green. Do not write $\frac12$: the colours are not equally likely, because there are more green counters than yellow ones.'

- id: jc21-21.3-counters-red
  section: '21.3'
  tier: O
  refs:
  - SP.2
  statement: 'A bag holds 3 red counters, 3 blue counters and 3 green counters. One counter is taken at random. Find the probability that it is red.'
  answer_label: 'Find the probability that it is red.'
  check:
    kind: evaluate
    expression: 3/9
    answer: '1/3'
  answer_text: '$\frac{3}{9}=\frac13$. There are 9 counters in total and 3 of them are red. The 9 counters are equally likely even though the 3 colours are not equally numerous in the question.'

- id: jc21-21.3-spinner-eight
  section: '21.3'
  tier: O
  refs:
  - SP.2
  statement: 'A spinner has 8 equal sectors and 3 of them are red. Find the probability that the spinner lands on red.'
  answer_label: 'Find the probability that the spinner lands on red.'
  check:
    kind: evaluate
    expression: 3/8
    answer: '3/8'
  answer_text: '$\frac38$. The 8 sectors are equal, so the outcomes are equally likely and 3 of the 8 are red.'

- id: jc21-21.3-half-counters
  section: '21.3'
  tier: O
  refs:
  - SP.2
  statement: 'A bag holds 5 red counters and 5 blue counters. Is the probability of red equal to one half?'
  answer_label: 'Is the probability of red equal to one half?'
  check:
    kind: compare
    relation: '='
    lhs: '5/10'
    rhs: '1/2'
  answer_text: 'Yes. There are $5+5=10$ counters and 5 are red, so the probability is $\frac{5}{10}=\frac12$. Here the two colours are equally numerous, so the probability of each is one half.'

- id: jc21-21.3-explain-colours
  section: '21.3'
  tier: O
  refs:
  - SP.2
  statement: 'A spinner has 3 equal red sectors and 2 equal blue sectors. Explain why the probability of red is not one half.'
  answer_label: 'Explain why the probability of red is not one half.'
  check:
    kind: structured
    requires: [total-sectors, red-sectors, compare-counts]
    concepts: [equally-likely]
    points:
    - id: total-sectors
      text: 'There are 5 equal sectors in total, because $3+2=5$.'
      concepts: [equally-likely]
    - id: red-sectors
      text: 'A red sector is 3 of those 5, so the probability of red is $\frac35$.'
      concepts: [equally-likely]
    - id: compare-counts
      text: 'One half would need equal numbers of red and blue sectors, and 3 is not 2.'
      concepts: [equally-likely]

# Junior Cycle Mathematics, Chapter 11, section 11.2.
#
# The check writes the bracket product in `expression` and the claimed expansion
# in `answer`, so the CAS proves the two are equivalent. The minus sign in front
# of a bracket is kept in the expression, so the sign rule is part of what is
# proved. Symbols are declared real.
chapter: 11
symbols:
  x: {real: true}

problems:
- id: jc11-11.2-expand-1
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: Expand $5(x+2)$.
  answer_label: Expand $5(x+2)$.
  check:
    kind: evaluate
    expression: 5*(x + 2)
    answer: 5*x + 10
  answer_text: '$5x+10$. The 5 multiplies both terms inside the bracket: $5\times x=5x$ and $5\times2=10$.'
- id: jc11-11.2-expand-2
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: Expand $7(2x+3)$.
  answer_label: Expand $7(2x+3)$.
  check:
    kind: evaluate
    expression: 7*(2*x + 3)
    answer: 14*x + 21
  answer_text: '$14x+21$. The 7 multiplies the $2x$ and the 3: $7\times2x=14x$ and $7\times3=21$.'
- id: jc11-11.2-expand-3
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: Expand $4(3x-2)$.
  answer_label: Expand $4(3x-2)$.
  check:
    kind: evaluate
    expression: 4*(3*x - 2)
    answer: 12*x - 8
  answer_text: '$12x-8$. The 4 multiplies both terms: $4\times3x=12x$ and $4\times(-2)=-8$.'
- id: jc11-11.2-expand-letter-1
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: Expand $x(x+9)$.
  answer_label: Expand $x(x+9)$.
  check:
    kind: evaluate
    expression: x*(x + 9)
    answer: x**2 + 9*x
  answer_text: '$x^2+9x$. The $x$ outside multiplies both terms, and $x\times x=x^2$.'
- id: jc11-11.2-expand-letter-2
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: Expand $2x(x+4)$.
  answer_label: Expand $2x(x+4)$.
  check:
    kind: evaluate
    expression: 2*x*(x + 4)
    answer: 2*x**2 + 8*x
  answer_text: '$2x^2+8x$. The $2x$ multiplies both terms: $2x\times x=2x^2$ and $2x\times4=8x$.'
- id: jc11-11.2-minus-1
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: Expand $-(x+7)$.
  answer_label: Expand $-(x+7)$.
  check:
    kind: evaluate
    expression: -(x + 7)
    answer: -x - 7
  answer_text: '$-x-7$. The minus sign is the same as multiplying by $-1$, so both signs inside the bracket change.'
- id: jc11-11.2-minus-2
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: Expand $-4(2x-3)$.
  answer_label: Expand $-4(2x-3)$.
  check:
    kind: evaluate
    expression: -4*(2*x - 3)
    answer: -8*x + 12
  answer_text: '$-8x+12$. The $-4$ multiplies both terms, and $-4\times(-3)=+12$.'
- id: jc11-11.2-mixed-1
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: Expand and simplify $3(x+4)+2(x+1)$.
  answer_label: Expand and simplify $3(x+4)+2(x+1)$.
  check:
    kind: evaluate
    expression: 3*(x + 4) + 2*(x + 1)
    answer: 5*x + 14
  answer_text: '$5x+14$. Expand each bracket, then collect: $3x+12+2x+2=5x+14$.'
- id: jc11-11.2-mixed-2
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: Expand and simplify $6(x+2)-3(x+4)$.
  answer_label: Expand and simplify $6(x+2)-3(x+4)$.
  check:
    kind: evaluate
    expression: 6*(x + 2) - 3*(x + 4)
    answer: 3*x
  answer_text: '$3x$. Expand each bracket: $6x+12-3x-12=3x$. The numbers cancel.'
- id: jc11-11.2-mixed-3
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: Expand and simplify $2(3x+1)-4(x-2)$.
  answer_label: Expand and simplify $2(3x+1)-4(x-2)$.
  check:
    kind: evaluate
    expression: 2*(3*x + 1) - 4*(x - 2)
    answer: 2*x + 10
  answer_text: '$2x+10$. The minus sign applies to the whole second bracket: $6x+2-4x+8=2x+10$.'
- id: jc11-11.2-perimeter-1
  section: '11.2'
  tier: O
  refs:
  - AF.3
  statement: A rectangle has length $(2x+3)$ metres and width $(x+1)$ metres. Write and simplify an expression for its perimeter.
  answer_label: Perimeter of the rectangle.
  check:
    kind: evaluate
    expression: 2*(2*x + 3) + 2*(x + 1)
    answer: 6*x + 8
  answer_text: '$6x+8$. The perimeter is $2(2x+3)+2(x+1)$. Expand to get $4x+6+2x+2=6x+8$.'

# Junior Cycle Mathematics, Chapter 11, section 11.7.
#
# This section is Higher level. Each check uses `kind: apply` with `op: div`, so
# the CAS performs the polynomial division and proves the claimed quotient, rather
# than comparing the answer with itself. The variable is named so the divisor and
# the dividend are both read as polynomials in `x`.
chapter: 11
symbols:
  x: {real: true}

problems:
- id: jc11-11.7-divide-1
  section: '11.7'
  tier: H
  refs:
  - AF.3
  statement: Divide $8x^2+12x$ by $4x$.
  answer_label: Divide $8x^2+12x$ by $4x$.
  check:
    kind: apply
    expression: 8*x**2 + 12*x
    apply: {op: div, args: ["4*x", "x"]}
    answer: 2*x + 3
  answer_text: '$2x+3$. Divide each term by $4x$: $8x^2\div4x=2x$ and $12x\div4x=3$. Check: $4x(2x+3)=8x^2+12x$.'
- id: jc11-11.7-divide-2
  section: '11.7'
  tier: H
  refs:
  - AF.3
  statement: Divide $x^2+6x+8$ by $x+2$.
  answer_label: Divide $x^2+6x+8$ by $x+2$.
  check:
    kind: apply
    expression: x**2 + 6*x + 8
    apply: {op: div, args: ["x+2", "x"]}
    answer: x + 4
  answer_text: '$x+4$. The $x^2$ term gives $x$, and the constant is $8\div2=4$. Check: $(x+2)(x+4)=x^2+6x+8$.'
- id: jc11-11.7-divide-3
  section: '11.7'
  tier: H
  refs:
  - AF.3
  statement: Divide $x^2+10x+21$ by $x+3$.
  answer_label: Divide $x^2+10x+21$ by $x+3$.
  check:
    kind: apply
    expression: x**2 + 10*x + 21
    apply: {op: div, args: ["x+3", "x"]}
    answer: x + 7
  answer_text: '$x+7$. The constant is $21\div3=7$. Check: $(x+3)(x+7)=x^2+10x+21$.'
- id: jc11-11.7-divide-4
  section: '11.7'
  tier: H
  refs:
  - AF.3
  statement: Divide $x^2-2x-15$ by $x-5$.
  answer_label: Divide $x^2-2x-15$ by $x-5$.
  check:
    kind: apply
    expression: x**2 - 2*x - 15
    apply: {op: div, args: ["x-5", "x"]}
    answer: x + 3
  answer_text: '$x+3$. The constant is $(-15)\div(-5)=3$. Check: $(x-5)(x+3)=x^2-2x-15$.'
- id: jc11-11.7-divide-5
  section: '11.7'
  tier: H
  refs:
  - AF.3
  statement: Divide $x^2+x-12$ by $x+4$.
  answer_label: Divide $x^2+x-12$ by $x+4$.
  check:
    kind: apply
    expression: x**2 + x - 12
    apply: {op: div, args: ["x+4", "x"]}
    answer: x - 3
  answer_text: '$x-3$. The constant is $(-12)\div4=-3$. Check: $(x+4)(x-3)=x^2+x-12$.'
- id: jc11-11.7-divide-6
  section: '11.7'
  tier: H
  refs:
  - AF.3
  statement: Divide $x^3+2x^2-5x-6$ by $x+1$.
  answer_label: Divide $x^3+2x^2-5x-6$ by $x+1$.
  check:
    kind: apply
    expression: x**3 + 2*x**2 - 5*x - 6
    apply: {op: div, args: ["x+1", "x"]}
    answer: x**2 + x - 6
  answer_text: '$x^2+x-6$. The quotient starts with $x^2$, and the constant is $(-6)\div1=-6$. Check: $(x+1)(x^2+x-6)=x^3+2x^2-5x-6$.'
- id: jc11-11.7-divide-7
  section: '11.7'
  tier: H
  refs:
  - AF.3
  statement: Divide $x^3-27$ by $x-3$.
  answer_label: Divide $x^3-27$ by $x-3$.
  check:
    kind: apply
    expression: x**3 - 27
    apply: {op: div, args: ["x-3", "x"]}
    answer: x**2 + 3*x + 9
  answer_text: '$x^2+3x+9$. The $x^2$ and $x$ terms are missing from $x^3-27$, but their places are still needed in the quotient. Check: $(x-3)(x^2+3x+9)=x^3-27$.'
- id: jc11-11.7-divide-8
  section: '11.7'
  tier: H
  refs:
  - AF.3
  statement: Divide $x^3+7x^2+10x$ by $x+5$.
  answer_label: Divide $x^3+7x^2+10x$ by $x+5$.
  check:
    kind: apply
    expression: x**3 + 7*x**2 + 10*x
    apply: {op: div, args: ["x+5", "x"]}
    answer: x**2 + 2*x
  answer_text: '$x^2+2x$. The quotient starts with $x^2$, and its last term is $10x\div5=2x$. This is the volume of the raised bed divided by its length in the chapter problem.'
- id: jc11-11.7-divide-9
  section: '11.7'
  tier: H
  refs:
  - AF.3
  statement: Divide $6x^3-9x^2$ by $3x^2$.
  answer_label: Divide $6x^3-9x^2$ by $3x^2$.
  check:
    kind: apply
    expression: 6*x**3 - 9*x**2
    apply: {op: div, args: ["3*x**2", "x"]}
    answer: 2*x - 3
  answer_text: '$2x-3$. Divide each term by $3x^2$: $6x^3\div3x^2=2x$ and $9x^2\div3x^2=3$.'
- id: jc11-11.7-height-1
  section: '11.7'
  tier: H
  refs:
  - AF.3
  statement: The volume of a cuboid is $x^3+5x^2+6x$ cubic centimetres. Its length is $(x+3)$ centimetres and its width is $x$ centimetres. Find its height.
  answer_label: Height of the cuboid.
  check:
    kind: evaluate
    expression: (x**3 + 5*x**2 + 6*x)/((x + 3)*x)
    answer: x + 2
  answer_text: '$x+2$ centimetres. Divide the volume by the length and the width: $x^3+5x^2+6x$ divided by $(x+3)$ is $x^2+2x$, and then divided by $x$ is $x+2$.'

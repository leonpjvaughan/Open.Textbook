# Junior Cycle Mathematics, Chapter 11, section 11.1.
#
# Every check writes the expression in `expression` and the claimed simplified
# answer in `answer`, so the CAS proves the two are equivalent rather than
# comparing a value with itself. The symbols are declared real, so the
# equivalence holds for every value of the letter. Units and words stay in
# `statement` and `answer_text`.
chapter: 11
symbols:
  x: {real: true}
  y: {real: true}
  a: {real: true}

problems:
- id: jc11-11.1-like-1
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: Simplify $7x+4x$.
  answer_label: Simplify $7x+4x$.
  check:
    kind: evaluate
    expression: 7*x + 4*x
    answer: 11*x
  answer_text: '$7x+4x=11x$. The two terms are like terms, so their coefficients add. The letter part does not change.'
- id: jc11-11.1-like-2
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: Simplify $9a-3a+2a$.
  answer_label: Simplify $9a-3a+2a$.
  check:
    kind: evaluate
    expression: 9*a - 3*a + 2*a
    answer: 8*a
  answer_text: '$9a-3a+2a=8a$. The coefficients are 9, $-3$ and 2, and they add to 8.'
- id: jc11-11.1-like-3
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: Simplify $3x+5y+4x+2y$.
  answer_label: Simplify $3x+5y+4x+2y$.
  check:
    kind: evaluate
    expression: 3*x + 5*y + 4*x + 2*y
    answer: 7*x + 7*y
  answer_text: '$7x+7y$. The $x$ terms give $3x+4x=7x$, and the $y$ terms give $5y+2y=7y$. The two letter parts stay apart.'
- id: jc11-11.1-add-1
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: Simplify $(3x+2)+(4x+7)$.
  answer_label: Simplify $(3x+2)+(4x+7)$.
  check:
    kind: evaluate
    expression: (3*x + 2) + (4*x + 7)
    answer: 7*x + 9
  answer_text: '$7x+9$. Adding the bracket adds each term, so $3x+2+4x+7=7x+9$.'
- id: jc11-11.1-sub-1
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: Simplify $(8x+3)-(2x+1)$.
  answer_label: Simplify $(8x+3)-(2x+1)$.
  check:
    kind: evaluate
    expression: (8*x + 3) - (2*x + 1)
    answer: 6*x + 2
  answer_text: '$6x+2$. The minus sign changes both terms in the second bracket, so $8x+3-2x-1=6x+2$.'
- id: jc11-11.1-sub-2
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: Simplify $(6x+5)-(4x-3)$.
  answer_label: Simplify $(6x+5)-(4x-3)$.
  check:
    kind: evaluate
    expression: (6*x + 5) - (4*x - 3)
    answer: 2*x + 8
  answer_text: '$2x+8$. The $-3$ becomes $+3$, so $6x+5-4x+3=2x+8$.'
- id: jc11-11.1-mixed-1
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: Simplify $2(x+4)+3(x+2)$.
  answer_label: Simplify $2(x+4)+3(x+2)$.
  check:
    kind: evaluate
    expression: 2*(x + 4) + 3*(x + 2)
    answer: 5*x + 14
  answer_text: '$5x+14$. Multiply out each bracket first: $2x+8+3x+6=5x+14$.'
- id: jc11-11.1-mixed-2
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: Simplify $5(x+1)-2(x+3)$.
  answer_label: Simplify $5(x+1)-2(x+3)$.
  check:
    kind: evaluate
    expression: 5*(x + 1) - 2*(x + 3)
    answer: 3*x - 1
  answer_text: '$3x-1$. The minus sign applies to the whole second bracket: $5x+5-2x-6=3x-1$.'
- id: jc11-11.1-square-1
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: Simplify $(x^2+3x+2)+(2x^2+x+1)$.
  answer_label: Simplify $(x^2+3x+2)+(2x^2+x+1)$.
  check:
    kind: evaluate
    expression: (x**2 + 3*x + 2) + (2*x**2 + x + 1)
    answer: 3*x**2 + 4*x + 3
  answer_text: '$3x^2+4x+3$. Collect the $x^2$ terms, then the $x$ terms, then the numbers: $x^2+2x^2=3x^2$, $3x+x=4x$, $2+1=3$.'
- id: jc11-11.1-square-2
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: Simplify $(5x^2+2x)-(3x^2+4x)$.
  answer_label: Simplify $(5x^2+2x)-(3x^2+4x)$.
  check:
    kind: evaluate
    expression: (5*x**2 + 2*x) - (3*x**2 + 4*x)
    answer: 2*x**2 - 2*x
  answer_text: '$2x^2-2x$. The minus sign changes both terms in the second bracket: $5x^2+2x-3x^2-4x=2x^2-2x$.'
- id: jc11-11.1-perimeter-1
  section: '11.1'
  tier: O
  refs:
  - AF.3
  statement: A rectangle has length $(x+6)$ cm and width $(x+2)$ cm. Write and simplify an expression for the length plus the width.
  answer_label: Length plus width of the rectangle.
  check:
    kind: evaluate
    expression: (x + 6) + (x + 2)
    answer: 2*x + 8
  answer_text: '$2x+8$. Add the two expressions and collect the like terms: $x+6+x+2=2x+8$.'

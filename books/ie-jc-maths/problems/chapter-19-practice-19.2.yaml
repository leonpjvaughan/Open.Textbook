# Junior Cycle Mathematics, Chapter 19, section 19.2.
#
# A reflection moves a point to the other side of the mirror line, the same
# perpendicular distance away. Each image coordinate is therefore an `evaluate`
# on the rule for that line: `-x` for the y-axis, `2k - x` for the line `x = k`,
# and the swapped pair for the line `y = x`. One record asks the reader to find
# an error in a reflection; a fault-finding answer cannot be proved by a CAS, so
# it uses `structured`.
chapter: 19
oracles: [sympy, units]
symbols: {}

problems:
- id: jc19-19.2-yaxis-1
  section: '19.2'
  tier: O
  refs:
  - GT.6
  statement: 'Reflect the point $P(3,2)$ in the $y$-axis. Find the image.'
  answer_label: 'Find the image of $P$.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 0 - 3
      answer: '-3'
    - kind: evaluate
      expression: 2
      answer: '2'
  answer_text: 'The image is $(-3,2)$. The $y$-axis is the mirror line, so the $x$-coordinate changes sign and the $y$-coordinate stays the same.'

- id: jc19-19.2-xaxis-1
  section: '19.2'
  tier: O
  refs:
  - GT.6
  statement: 'Reflect the point $P(3,2)$ in the $x$-axis. Find the image.'
  answer_label: 'Find the image of $P$.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 3
      answer: '3'
    - kind: evaluate
      expression: 0 - 2
      answer: '-2'
  answer_text: 'The image is $(3,-2)$. The $x$-axis is the mirror line, so the $y$-coordinate changes sign and the $x$-coordinate stays the same.'

- id: jc19-19.2-diag-1
  section: '19.2'
  tier: O
  refs:
  - GT.6
  statement: 'Reflect the point $P(2,5)$ in the line $y=x$. Find the image.'
  answer_label: 'Find the image of $P$.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 5
      answer: '5'
    - kind: evaluate
      expression: 2
      answer: '2'
  answer_text: 'The image is $(5,2)$. The line $y=x$ runs at 45°, so the two coordinates swap. The point and its image are the same distance from the line.'

- id: jc19-19.2-vert-1
  section: '19.2'
  tier: O
  refs:
  - GT.6
  statement: 'Reflect the point $P(4,1)$ in the line $x=2$. Find the image.'
  answer_label: 'Find the image of $P$.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 2*2 - 4
      answer: '0'
    - kind: evaluate
      expression: 1
      answer: '1'
  answer_text: 'The image is $(0,1)$. The point $P$ is 2 units to the right of the line $x=2$, so the image is 2 units to the left. The $y$-coordinate does not change.'

- id: jc19-19.2-horiz-1
  section: '19.2'
  tier: O
  refs:
  - GT.6
  statement: 'Reflect the point $P(1,6)$ in the line $y=3$. Find the image.'
  answer_label: 'Find the image of $P$.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 1
      answer: '1'
    - kind: evaluate
      expression: 2*3 - 6
      answer: '0'
  answer_text: 'The image is $(1,0)$. The point $P$ is 3 units above the line $y=3$, so the image is 3 units below. The $x$-coordinate does not change.'

- id: jc19-19.2-tri-1
  section: '19.2'
  tier: O
  refs:
  - GT.6
  statement: 'A triangle has vertices $(1,1)$, $(3,1)$ and $(1,2)$. Reflect the triangle in the $y$-axis. Find the image vertices.'
  answer_label: 'Find the three image vertices.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 0 - 1
      answer: '-1'
    - kind: evaluate
      expression: 0 - 3
      answer: '-3'
    - kind: evaluate
      expression: 0 - 1
      answer: '-1'
    - kind: evaluate
      expression: 2
      answer: '2'
  answer_text: 'The image vertices are $(-1,1)$, $(-3,1)$ and $(-1,2)$. Every $x$-coordinate changes sign and every $y$-coordinate stays the same, so the image is the mirror picture in the $y$-axis.'

- id: jc19-19.2-tri-2
  section: '19.2'
  tier: O
  refs:
  - GT.6
  statement: 'A triangle has vertices $A(0,0)$, $B(2,0)$ and $C(0,3)$. Reflect the triangle in the line $x=1$. Find the image vertices.'
  answer_label: 'Find the three image vertices.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 2*1 - 0
      answer: '2'
    - kind: evaluate
      expression: 2*1 - 2
      answer: '0'
    - kind: evaluate
      expression: 2*1 - 0
      answer: '2'
    - kind: evaluate
      expression: 3
      answer: '3'
  answer_text: 'The image vertices are $(2,0)$, $(0,0)$ and $(2,3)$. Each point moves to the other side of the line $x=1$, and the $y$-coordinates do not change.'

- id: jc19-19.2-diag-2
  section: '19.2'
  tier: O
  refs:
  - GT.6
  statement: 'Reflect the point $P(-1,4)$ in the line $y=x$. Find the image.'
  answer_label: 'Find the image of $P$.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 4
      answer: '4'
    - kind: evaluate
      expression: -1
      answer: '-1'
  answer_text: 'The image is $(4,-1)$. Reflection in the line $y=x$ swaps the coordinates. The image can sit in a different quadrant from the original.'

- id: jc19-19.2-crest
  section: '19.2'
  tier: O
  refs:
  - GT.6
  statement: 'The crest has a shaded triangle with vertices $M(2,2)$, $A(4,0)$ and $B(4,4)$. Reflect the triangle in the line $x=2$. Find the image vertices.'
  answer_label: 'Find the three image vertices.'
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 2*2 - 2
      answer: '2'
    - kind: evaluate
      expression: 2*2 - 4
      answer: '0'
    - kind: evaluate
      expression: 2*2 - 4
      answer: '0'
  answer_text: 'The image vertices are $(2,2)$, $(0,0)$ and $(0,4)$. The line $x=2$ is the mirror line, so the right shaded triangle maps to the left shaded triangle $MCO$. The crest has a line of symmetry along $x=2$.'

- id: jc19-19.2-error
  section: '19.2'
  tier: O
  refs:
  - GT.6
  statement: 'A student reflects the point $(3,2)$ in the $y$-axis and writes the image as $(2,3)$. Explain the error and give the correct image.'
  answer_label: 'Explain the error and give the correct image.'
  check:
    kind: structured
    requires: [state-error, give-image]
    concepts: [reflection-y-axis]
    points:
    - id: state-error
      text: 'The student swapped the coordinates. Swapping is a reflection in the line $y=x$, not in the $y$-axis.'
      concepts: [reflection-y-axis]
    - id: give-image
      text: 'The correct image is $(-3,2)$. A reflection in the $y$-axis changes the sign of the $x$-coordinate and leaves the $y$-coordinate alone.'
      concepts: [reflection-y-axis]
  answer_text: 'The student swapped the two coordinates, which is a reflection in the line $y=x$. A reflection in the $y$-axis changes the sign of the $x$-coordinate only, so the image is $(-3,2)$.'

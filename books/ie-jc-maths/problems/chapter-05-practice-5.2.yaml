# Junior Cycle Mathematics, Chapter 5, section 5.2.
#
# Every check is an arithmetic identity the CAS proves, so the answer the reader
# is shown is the answer the verifier proved. Each record writes the sum or
# difference of fractions in `expression` and the claimed value in `answer`, so a
# wrong common denominator fails rather than comparing a number with itself.
# Units and words stay in `statement`: the CAS parses numbers and symbols only.
chapter: 5
symbols: {}

problems:
- id: jc5-5.2-add-1
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{1}{4}+\frac{1}{3}$.
  answer_label: Work out $\frac{1}{4}+\frac{1}{3}$.
  check:
    kind: evaluate
    expression: 1/4 + 1/3
    answer: 7/12
  steps:
  - expr: 1/4 + 1/3
  - expr: 3/12 + 4/12
  - expr: 7/12
  answer_text: >-
    $\frac{7}{12}$. The denominators are different, so first write both fractions
    with the denominator 12. That gives $\frac{3}{12}+\frac{4}{12}$, and the
    numerators add to 7.
- id: jc5-5.2-add-2
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{3}{5}+\frac{1}{4}$.
  answer_label: Work out $\frac{3}{5}+\frac{1}{4}$.
  check:
    kind: evaluate
    expression: 3/5 + 1/4
    answer: 17/20
  steps:
  - expr: 3/5 + 1/4
  - expr: 12/20 + 5/20
  - expr: 17/20
  answer_text: >-
    $\frac{17}{20}$. The lowest common denominator of 5 and 4 is 20. So
    $\frac{3}{5}=\frac{12}{20}$ and $\frac{1}{4}=\frac{5}{20}$, and the sum is
    $\frac{17}{20}$.
- id: jc5-5.2-sub-1
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{5}{6}-\frac{1}{4}$.
  answer_label: Work out $\frac{5}{6}-\frac{1}{4}$.
  check:
    kind: evaluate
    expression: 5/6 - 1/4
    answer: 7/12
  steps:
  - expr: 5/6 - 1/4
  - expr: 10/12 - 3/12
  - expr: 7/12
  answer_text: >-
    $\frac{7}{12}$. The lowest common denominator of 6 and 4 is 12. So
    $\frac{5}{6}=\frac{10}{12}$ and $\frac{1}{4}=\frac{3}{12}$, and the difference
    is $\frac{7}{12}$.
- id: jc5-5.2-add-3
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{2}{3}+\frac{1}{6}$.
  answer_label: Work out $\frac{2}{3}+\frac{1}{6}$.
  check:
    kind: evaluate
    expression: 2/3 + 1/6
    answer: 5/6
  steps:
  - expr: 2/3 + 1/6
  - expr: 4/6 + 1/6
  - expr: 5/6
  answer_text: >-
    $\frac{5}{6}$. The denominator 6 is already a multiple of 3, so only the first
    fraction changes: $\frac{2}{3}=\frac{4}{6}$. Then
    $\frac{4}{6}+\frac{1}{6}=\frac{5}{6}$.
- id: jc5-5.2-sub-2
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{7}{8}-\frac{3}{4}$.
  answer_label: Work out $\frac{7}{8}-\frac{3}{4}$.
  check:
    kind: evaluate
    expression: 7/8 - 3/4
    answer: 1/8
  steps:
  - expr: 7/8 - 3/4
  - expr: 7/8 - 6/8
  - expr: 1/8
  answer_text: >-
    $\frac{1}{8}$. Write $\frac{3}{4}$ as $\frac{6}{8}$, because $8$ is a multiple
    of $4$. Then $\frac{7}{8}-\frac{6}{8}=\frac{1}{8}$.
- id: jc5-5.2-add-4
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{1}{2}+\frac{1}{4}+\frac{1}{4}$.
  answer_label: Work out $\frac{1}{2}+\frac{1}{4}+\frac{1}{4}$.
  check:
    kind: evaluate
    expression: 1/2 + 1/4 + 1/4
    answer: '1'
  steps:
  - expr: 1/2 + 1/4 + 1/4
  - expr: 2/4 + 1/4 + 1/4
  - expr: 4/4
  - expr: '1'
  answer_text: >-
    $1$. Write every fraction with the denominator 4:
    $\frac{2}{4}+\frac{1}{4}+\frac{1}{4}$. The numerators add to 4, and
    $\frac{4}{4}=1$.
- id: jc5-5.2-punch-1
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: One jug of punch uses $\frac{3}{4}$ of a litre of orange juice, $\frac{1}{2}$ of a
    litre of apple juice and $\frac{1}{4}$ of a litre of sparkling water. Work out the
    total volume in one jug.
  answer_label: Work out $\frac{3}{4}+\frac{1}{2}+\frac{1}{4}$ litres.
  check:
    kind: evaluate
    expression: 3/4 + 1/2 + 1/4
    answer: 3/2
  steps:
  - expr: 3/4 + 1/2 + 1/4
  - expr: 3/4 + 2/4 + 1/4
  - expr: 6/4
  - expr: 3/2
  answer_text: >-
    $\frac{3}{2}$ litres, which is $1.5$ litres. Write every fraction with the
    denominator 4: $\frac{3}{4}+\frac{2}{4}+\frac{1}{4}=\frac{6}{4}$. Then simplify
    $\frac{6}{4}$ to $\frac{3}{2}$.
- id: jc5-5.2-punch-2
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: The recipe uses $\frac{3}{4}$ of a litre of orange juice and $\frac{1}{2}$ of a litre
    of apple juice. How much more orange juice than apple juice is that?
  answer_label: Work out $\frac{3}{4}-\frac{1}{2}$.
  check:
    kind: evaluate
    expression: 3/4 - 1/2
    answer: 1/4
  steps:
  - expr: 3/4 - 1/2
  - expr: 3/4 - 2/4
  - expr: 1/4
  answer_text: >-
    $\frac{1}{4}$ of a litre. Write $\frac{1}{2}$ as $\frac{2}{4}$ and subtract:
    $\frac{3}{4}-\frac{2}{4}=\frac{1}{4}$.
- id: jc5-5.2-add-5
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: Work out $\frac{3}{2}+\frac{3}{4}$.
  answer_label: Work out $\frac{3}{2}+\frac{3}{4}$.
  check:
    kind: evaluate
    expression: 3/2 + 3/4
    answer: 9/4
  steps:
  - expr: 3/2 + 3/4
  - expr: 6/4 + 3/4
  - expr: 9/4
  answer_text: >-
    $\frac{9}{4}$, which is $2\frac{1}{4}$. Write $\frac{3}{2}$ as
    $\frac{6}{4}$, then add: $\frac{6}{4}+\frac{3}{4}=\frac{9}{4}$. The top is
    larger than the bottom, so the value is more than one whole.
- id: jc5-5.2-sub-3
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: Work out $1-\frac{2}{5}$.
  answer_label: Work out $1-\frac{2}{5}$.
  check:
    kind: evaluate
    expression: 1 - 2/5
    answer: 3/5
  steps:
  - expr: 1 - 2/5
  - expr: 5/5 - 2/5
  - expr: 3/5
  answer_text: >-
    $\frac{3}{5}$. Write the whole number 1 as $\frac{5}{5}$, so both parts have
    the denominator 5. Then $\frac{5}{5}-\frac{2}{5}=\frac{3}{5}$.
- id: jc5-5.2-sub-4
  section: '5.2'
  tier: O
  refs:
  - N.2
  statement: A jug holds $\frac{3}{2}$ litres. It already contains $\frac{2}{3}$ of a litre. How
    much more will fill it?
  answer_label: Work out $\frac{3}{2}-\frac{2}{3}$.
  check:
    kind: evaluate
    expression: 3/2 - 2/3
    answer: 5/6
  steps:
  - expr: 3/2 - 2/3
  - expr: 9/6 - 4/6
  - expr: 5/6
  answer_text: >-
    $\frac{5}{6}$ of a litre. The lowest common denominator of 2 and 3 is 6, so
    $\frac{3}{2}=\frac{9}{6}$ and $\frac{2}{3}=\frac{4}{6}$. The difference is
    $\frac{5}{6}$.

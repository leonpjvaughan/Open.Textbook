# Junior Cycle Mathematics, Chapter 21, section 21.5.
#
# The addition rule is the identity `P(A or B) = P(A) + P(B) - P(A and B)`, and
# each record proves the arithmetic of one substitution into it. When the events
# cannot both happen the overlap is 0, so the subtraction disappears. The
# `structured` record asks why the overlap is subtracted rather than added.
chapter: 21
oracles: [sympy, units]
symbols: {}

problems:
- id: jc21-21.5-die-even-or-over
  section: '21.5'
  tier: O
  refs:
  - SP.2
  statement: 'A fair six-sided die is rolled. Find the probability of an even number or a number greater than 4.'
  answer_label: 'Find the probability of an even number or a number greater than 4.'
  check:
    kind: evaluate
    expression: 3/6+2/6-1/6
    answer: '2/3'
  answer_text: '$\frac36+\frac26-\frac16=\frac46=\frac23$. The even results are 2, 4 and 6, and the results greater than 4 are 5 and 6. The 6 is in both events, so it was counted twice and its probability is subtracted once.'

- id: jc21-21.5-prize-or
  section: '21.5'
  tier: O
  refs:
  - SP.2
  statement: 'In the open-day game the probability of a 6 is $\frac16$ and the probability of an A is $\frac14$. The probability of both a 6 and an A is $\frac{1}{24}$. Find the probability of a prize, which needs a 6 or an A.'
  answer_label: 'Find the probability of a prize.'
  check:
    kind: evaluate
    expression: 1/6+1/4-1/24
    answer: '3/8'
  answer_text: '$\frac16+\frac14-\frac{1}{24}=\frac{4}{24}+\frac{6}{24}-\frac{1}{24}=\frac{9}{24}=\frac38$. The star prize outcome, a 6 with an A, is in both events, so subtract it once. A player wins a prize on 9 of the 24 equally likely outcomes.'

- id: jc21-21.5-mutually-exclusive
  section: '21.5'
  tier: O
  refs:
  - SP.2
  statement: 'A fair six-sided die is rolled. Find the probability of a 1 or a 2.'
  answer_label: 'Find the probability of a 1 or a 2.'
  check:
    kind: evaluate
    expression: 1/6+1/6
    answer: '1/3'
  answer_text: '$\frac16+\frac16=\frac26=\frac13$. The results 1 and 2 cannot both happen on one roll, so the events are mutually exclusive and there is no overlap to subtract.'

- id: jc21-21.5-numbers-even-or-five
  section: '21.5'
  tier: O
  refs:
  - SP.2
  statement: 'A card is chosen at random from cards numbered 1 to 10. Find the probability that the number is even or a multiple of 5.'
  answer_label: 'Find the probability that the number is even or a multiple of 5.'
  check:
    kind: evaluate
    expression: 5/10+2/10-1/10
    answer: '3/5'
  answer_text: '$\frac{5}{10}+\frac{2}{10}-\frac{1}{10}=\frac{6}{10}=\frac35$. The even numbers are 2, 4, 6, 8 and 10, and the multiples of 5 are 5 and 10. The 10 is in both, so subtract it once.'

- id: jc21-21.5-decimals-or
  section: '21.5'
  tier: O
  refs:
  - SP.2
  statement: 'Two events have probabilities $0.5$ and $0.4$, and the probability that both happen is $0.2$. Find the probability that at least one of them happens.'
  answer_label: 'Find the probability that at least one of them happens.'
  check:
    kind: evaluate
    expression: 0.5+0.4-0.2
    answer: '0.7'
  answer_text: '$0.5+0.4-0.2=0.7$. At least one means the first or the second, and the overlap of $0.2$ was counted in both, so it is subtracted once.'

- id: jc21-21.5-decimals-exclusive
  section: '21.5'
  tier: O
  refs:
  - SP.2
  statement: 'Two mutually exclusive events have probabilities $0.3$ and $0.25$. Find the probability that one or the other happens.'
  answer_label: 'Find the probability that one or the other happens.'
  check:
    kind: evaluate
    expression: 0.3+0.25
    answer: '0.55'
  answer_text: '$0.3+0.25=0.55$. Mutually exclusive events cannot both happen, so the probability of both is 0 and the subtraction adds nothing.'

- id: jc21-21.5-die-odd-or-three
  section: '21.5'
  tier: O
  refs:
  - SP.2
  statement: 'A fair six-sided die is rolled. Find the probability of an odd number or a 3.'
  answer_label: 'Find the probability of an odd number or a 3.'
  check:
    kind: evaluate
    expression: 3/6+1/6-1/6
    answer: '1/2'
  answer_text: '$\frac36+\frac16-\frac16=\frac36=\frac12$. The odd results are 1, 3 and 5. The 3 is already an odd number, so the event adds no new outcome and the probability stays one half.'

- id: jc21-21.5-dice-seven-or-eleven
  section: '21.5'
  tier: O
  refs:
  - SP.2
  statement: 'Two fair dice are rolled. Find the probability that the total is 7 or 11.'
  answer_label: 'Find the probability that the total is 7 or 11.'
  check:
    kind: evaluate
    expression: 6/36+2/36
    answer: '2/9'
  answer_text: '$\frac{6}{36}+\frac{2}{36}=\frac{8}{36}=\frac29$. Six outcomes total 7 and two outcomes total 11. One roll cannot give both totals, so the events are mutually exclusive and there is no overlap.'

- id: jc21-21.5-counters-red-or-blue
  section: '21.5'
  tier: O
  refs:
  - SP.2
  statement: 'A bag holds 3 red, 2 blue and 5 green counters. One counter is taken at random. Find the probability that it is red or blue.'
  answer_label: 'Find the probability that it is red or blue.'
  check:
    kind: evaluate
    expression: 3/10+2/10
    answer: '1/2'
  answer_text: '$\frac{3}{10}+\frac{2}{10}=\frac{5}{10}=\frac12$. There are 10 counters in total, and 5 of them are red or blue. A counter cannot be both red and blue, so the events are mutually exclusive.'

- id: jc21-21.5-explain-subtract
  section: '21.5'
  tier: O
  refs:
  - SP.2
  statement: 'A fair die is rolled. The events even and greater than 4 overlap at the result 6. Explain why the probability of even or greater than 4 subtracts the probability of the overlap.'
  answer_label: 'Explain why the overlap is subtracted.'
  check:
    kind: structured
    requires: [count-even, count-over, subtract-overlap]
    concepts: [addition-rule]
    points:
    - id: count-even
      text: 'The even results are 2, 4 and 6, so the probability of even is $\frac36$.'
      concepts: [addition-rule]
    - id: count-over
      text: 'The results greater than 4 are 5 and 6, so the probability is $\frac26$, and the result 6 is in both events.'
      concepts: [addition-rule]
    - id: subtract-overlap
      text: 'Adding $\frac36+\frac26$ counts the 6 twice, so subtract its probability once: $\frac36+\frac26-\frac16=\frac46$.'
      concepts: [addition-rule]

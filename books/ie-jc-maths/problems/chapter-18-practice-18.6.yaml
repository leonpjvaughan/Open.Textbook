- id: jc18-18.6-chapter
  section: '18.6'
  tier: O
  refs:
  - GT.4
  statement: 'The chapter problem. You stand on the ground and look up to the top of the school building. Name the angle between the horizontal ground and your line of sight, and explain your choice.'
  answer_label: 'Name the angle and explain.'
  check:
    kind: structured
    requires: [name-angle, give-reason]
    concepts: [angle-of-elevation]
    points:
    - id: name-angle
      text: 'It is an angle of elevation.'
      concepts: [angle-of-elevation]
    - id: give-reason
      text: 'The angle is measured up from the horizontal to an object above the observer, which is what an angle of elevation means.'
  answer_text: 'It is an angle of elevation, because the top of the building is above your eye level and the angle is measured up from the horizontal. An angle down to something below you is an angle of depression.'

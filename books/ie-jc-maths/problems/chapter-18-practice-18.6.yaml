- id: jc18-18.6-kite
  section: '18.6'
  tier: O
  refs:
  - GT.4
  statement: 'A kite is flying on a string 30 m long. The string makes an angle of 60° with the ground. Find the height of the kite, correct to one decimal place.'
  answer_label: 'Find the height of the kite.'
  check:
    kind: approx
    value: 30*sin(60*pi/180)
    target: '26.0'
    tolerance: '0.05'
  answer_text: 'The kite is about $26.0$ m above the ground. The string is the hypotenuse, so use sine: $h=30\sin 60^\circ=25.980\ldots$'


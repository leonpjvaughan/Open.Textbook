# Junior Cycle Mathematics, Chapter 18, section 18.6.
#
# Angles of elevation and depression. Each record is a real situation turned into
# a right-angled triangle. `expression` performs the tangent, sine or division
# the triangle gives, and `answer` is the length the reader is shown. The answers
# are irrational, so they use `approx` with a half-unit-of-the-last-place
# tolerance and the reader's value lives in `answer_text`. The last record asks
# for the name of an angle and a reason, so it uses `structured`.
chapter: 18
oracles: [sympy, units]
symbols: {}

problems:
- id: jc18-18.6-tree
  section: '18.6'
  tier: O
  refs:
  - GT.4
  statement: 'A person stands 20 m from a tree. The angle of elevation to the top is 30°. Find the height of the tree, correct to one decimal place.'
  answer_label: 'Find the height of the tree.'
  check:
    kind: approx
    value: 20*tan(30*pi/180)
    target: '11.5'
    tolerance: '0.05'
  answer_text: 'The tree is about $11.5$ m tall. The height is opposite the 30° angle and 20 m is adjacent to it: $h=20\tan 30^\circ=11.547\ldots$'

- id: jc18-18.6-cliff-1
  section: '18.6'
  tier: O
  refs:
  - GT.4
  statement: 'From the top of a cliff 40 m above the sea, the angle of depression to a boat is 25°. Find the horizontal distance to the boat, correct to one decimal place.'
  answer_label: 'Find the horizontal distance to the boat.'
  check:
    kind: approx
    value: 40/tan(25*pi/180)
    target: '85.8'
    tolerance: '0.05'
  answer_text: 'The boat is about $85.8$ m from the cliff. The height is opposite the 25° angle and the distance is adjacent to it: $d=\frac{40}{\tan 25^\circ}=85.78\ldots$ The unknown is on the bottom of the fraction, so divide.'


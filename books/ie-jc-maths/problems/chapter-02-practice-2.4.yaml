# Junior Cycle Mathematics, Chapter 2, section 2.4.
#
# A fractional power is checked as an exact value: the power on the left and the
# whole number or fraction on the right must be the same number, so `8^(2/3) = 16`
# fails. The two photocopier records round, so they use a `rounded` check: the
# answer must be the nearest multiple of the declared step. Rounding is never an
# equality check.
chapter: 2
symbols: {}

problems:
- id: jc2-2.4-half-1
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: Work out $9^{\frac12}$.
  answer_label: Work out $9^{\frac12}$.
  check:
    kind: evaluate
    expression: 9**(1/2)
    answer: '3'
  answer_text: >-
    $3$. An index of $\frac12$ means the square root, so $9^{\frac12} = \sqrt9$.
    Check it: $3^2 = 9$.
- id: jc2-2.4-half-2
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: Work out $100^{\frac12}$.
  answer_label: Work out $100^{\frac12}$.
  check:
    kind: evaluate
    expression: 100**(1/2)
    answer: '10'
  answer_text: >-
    $10$. The half index asks for the number whose square is 100, and
    $10^2 = 100$.
- id: jc2-2.4-third-1
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: Work out $8^{\frac13}$.
  answer_label: Work out $8^{\frac13}$.
  check:
    kind: evaluate
    expression: 8**(1/3)
    answer: '2'
  answer_text: >-
    $2$. The denominator 3 names the cube root, so $8^{\frac13} = \sqrt[3]{8}$.
    Check it: $2^3 = 8$.
- id: jc2-2.4-third-2
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: Work out $27^{\frac13}$.
  answer_label: Work out $27^{\frac13}$.
  check:
    kind: evaluate
    expression: 27**(1/3)
    answer: '3'
  answer_text: >-
    $3$. The cube root of 27 is 3, because $3^3 = 27$.
- id: jc2-2.4-fourth
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: Work out $16^{\frac14}$.
  answer_label: Work out $16^{\frac14}$.
  check:
    kind: evaluate
    expression: 16**(1/4)
    answer: '2'
  answer_text: >-
    $2$. The denominator 4 names the fourth root. Check it: $2^4 = 16$.
- id: jc2-2.4-two-thirds
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: Work out $8^{\frac23}$.
  answer_label: Work out $8^{\frac23}$.
  check:
    kind: evaluate
    expression: 8**(2/3)
    answer: '4'
  answer_text: >-
    $4$. Take the cube root first, then square the result:
    $8^{\frac23} = \left(8^{\frac13}\right)^2 = 2^2 = 4$.
- id: jc2-2.4-three-quarters
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: Work out $16^{\frac34}$.
  answer_label: Work out $16^{\frac34}$.
  check:
    kind: evaluate
    expression: 16**(3/4)
    answer: '8'
  answer_text: >-
    $8$. The fourth root of 16 is 2, and then $2^3 = 8$. Taking the root first
    keeps the numbers small.
- id: jc2-2.4-neg-half
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: Work out $4^{-\frac12}$.
  answer_label: Work out $4^{-\frac12}$.
  check:
    kind: evaluate
    expression: 4**(-1/2)
    answer: '1/2'
  answer_text: >-
    $\frac{1}{2}$. The negative index gives a reciprocal, and
    $4^{\frac12} = 2$. So the answer is $\frac{1}{2}$, which is positive.
- id: jc2-2.4-neg-two-thirds
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: Work out $27^{-\frac23}$.
  answer_label: Work out $27^{-\frac23}$.
  check:
    kind: evaluate
    expression: 27**(-2/3)
    answer: '1/9'
  answer_text: >-
    $\frac{1}{9}$. Work out the positive power first:
    $27^{\frac23} = \left(27^{\frac13}\right)^2 = 3^2 = 9$. The negative index
    then gives the reciprocal $\frac{1}{9}$.
- id: jc2-2.4-misconception
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: A pupil says $2^{\frac12} = 1$. Show that this is wrong.
  answer_label: Show that $2^{\frac12} = 1$ is wrong.
  check:
    kind: compare
    lhs: 1**2
    relation: '!='
    rhs: '2'
  answer_text: >-
    If $2^{\frac12}$ were 1, then squaring it would give 1. But $1^2 = 1$, and
    2 is not 1. In fact $2^{\frac12} = \sqrt2 \approx 1.414$. The index
    $\frac12$ asks for a square root, and it is not a division by 2.
- id: jc2-2.4-anchor-value
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: >-
    The 141% button multiplies the width by $2^{\frac12}$. Work out $2^{\frac12}$
    to 3 decimal places.
  answer_label: $2^{\frac12}$ to 3 decimal places.
  check:
    kind: rounded
    value: 2**(1/2)
    rounded: '1.414'
    to: '0.001'
  answer_text: >-
    $1.414$. The value is the square root of 2, which is 1.41421356 to 8 decimal
    places. To 3 decimal places it is 1.414, because the next digit is 2.
- id: jc2-2.4-anchor-width
  section: '2.4'
  tier: O
  refs:
  - N.1
  statement: >-
    The 141% button multiplies the 210 mm width of an A4 sheet by
    $2^{\frac12}$. Work out the new width to the nearest millimetre.
  answer_label: The new width, to the nearest millimetre.
  check:
    kind: rounded
    value: 210*2**(1/2)
    rounded: '297'
    to: '1'
  answer_text: >-
    $297$ mm. Work out $210\times1.41421356 = 296.98$, which rounds to 297 to the
    nearest millimetre. That is the width of an A3 sheet, which is why the button
    is marked 141%.

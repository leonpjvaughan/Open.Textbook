# Junior Cycle Mathematics, Chapter 14, section 14.3.
#
# A table of values is checked value by value with `kind: all`, so one wrong row
# fails the whole record. A point on a line is checked by substituting its
# coordinates into the rule: the CAS proves the two sides agree, or that they do
# not. Units and words stay in `statement`: the CAS parses numbers and symbols only.
chapter: 14
symbols:
  x: {real: true}

problems:
- id: jc14-14.3-table-1
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: Complete the table of values for $y=2x+1$ for $x=0$, $1$, $2$ and $3$.
  answer_label: Complete the table for $y=2x+1$.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 2*0+1
      answer: '1'
    - kind: evaluate
      expression: 2*1+1
      answer: '3'
    - kind: evaluate
      expression: 2*2+1
      answer: '5'
    - kind: evaluate
      expression: 2*3+1
      answer: '7'
  answer_text: The values are $1$, $3$, $5$ and $7$. Each time $x$ goes up by 1, $y$ goes up by 2, because
    the rule doubles the input. Plot the four points and join them with a straight line.
- id: jc14-14.3-table-2
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: Use the rule $y=2x+1$ to find the value of $y$ when $x=4$.
  answer_label: Find $y$ when $x=4$.
  check:
    kind: evaluate
    expression: 2*4+1
    answer: '9'
  answer_text: $y=2\times4+1=9$. This is the next row of the table, and the point $(4,9)$ sits on the same
    straight line as the four points before it.
- id: jc14-14.3-table-3
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: Complete the table of values for $y=3x-4$ for $x=0$, $1$, $2$ and $3$.
  answer_label: Complete the table for $y=3x-4$.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: 3*0-4
      answer: '-4'
    - kind: evaluate
      expression: 3*1-4
      answer: '-1'
    - kind: evaluate
      expression: 3*2-4
      answer: '2'
    - kind: evaluate
      expression: 3*3-4
      answer: '5'
  answer_text: The values are $-4$, $-1$, $2$ and $5$. The line crosses the vertical axis at $-4$, which is
    the value for $x=0$. The values go up by 3 each time.
- id: jc14-14.3-point-1
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: Which of the points $(2,3)$ and $(4,8)$ lies on the line $y=3x-4$? Substitute both points to
    decide.
  answer_label: Decide which point lies on the line.
  check:
    kind: all
    checks:
    - kind: compare
      lhs: 3*4-4
      relation: '='
      rhs: '8'
    - kind: compare
      lhs: 3*2-4
      relation: '!='
      rhs: '3'
  answer_text: The point $(4,8)$ lies on the line, because $3\times4-4=8$. The point $(2,3)$ does not,
    because $3\times2-4=2$, and 2 is not 3. A point is on a line when its coordinates make the rule true.
- id: jc14-14.3-garden-1
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: The fenced length of the garden bed is $L(x)=12-2x$ metres, where $x$ is the width in metres.
    Find $L(4)$.
  answer_label: Find $L(4)$.
  check:
    kind: evaluate
    expression: 12-2*4
    answer: '4'
  answer_text: $L(4)=12-8=4$, so the fenced length is 4 m. The width is 4 m, so the bed is a square in this
    design.
- id: jc14-14.3-garden-2
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: The fenced length of the garden bed is $L(x)=12-2x$ metres. Find the width $x$ for which the
    fenced length is 0.
  answer_label: Find $x$ when $L(x)=0$.
  check:
    kind: solve
    equation: 12-2*x = 0
    variable: x
    answer: '6'
  answer_text: '$x=6$, because $12-2\times6=0$. A width of 6 m uses all 12 m of fencing on the two widths,
    so no fence is left for the length. The graph of $L$ crosses the horizontal axis at 6.'
- id: jc14-14.3-eval-1
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: Find the value of $y$ when $x=-2$, using $y=x+5$.
  answer_label: Find $y$ when $x=-2$.
  check:
    kind: evaluate
    expression: -2+5
    answer: '3'
  answer_text: $y=-2+5=3$. The point $(-2,3)$ lies on the line, which is to the left of the vertical axis.
- id: jc14-14.3-eval-2
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: Find the value of $y$ when $x=5$, using $y=-x+3$.
  answer_label: Find $y$ when $x=5$.
  check:
    kind: evaluate
    expression: -5+3
    answer: '-2'
  answer_text: $y=-5+3=-2$. The number in front of $x$ is negative, so the line goes down as you move to the
    right. This is what makes it different from the lines in questions 1 to 3.
- id: jc14-14.3-line-1
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: A straight line passes through $(0,3)$ and $(2,7)$. Find the value of $y$ on this line when
    $x=4$.
  answer_label: Find $y$ when $x=4$ on this line.
  check:
    kind: all
    checks:
    - kind: evaluate
      expression: (7-3)/(2-0)
      answer: '2'
    - kind: evaluate
      expression: 2*4+3
      answer: '11'
  answer_text: The line rises by 4 when $x$ goes up by 2, so it rises by 2 for each step of 1. From $(0,3)$
    the rule is $y=2x+3$, and $y=2\times4+3=11$.
- id: jc14-14.3-read-1
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: The graph of $y=2x+1$ is a straight line. Use the rule to find the value of $x$ where the graph
    has height $y=7$.
  answer_label: Find $x$ when $y=7$.
  check:
    kind: solve
    equation: 2*x+1 = 7
    variable: x
    answer: '3'
  answer_text: '$x=3$, because $2\times3+1=7$. On the graph, find 7 on the vertical axis, move across to the
    line, and then down to the horizontal axis.'
- id: jc14-14.3-context-1
  section: '14.3'
  tier: O
  refs:
  - AF.7
  statement: A taxi charges €4 to start and €2 for each kilometre. The fare is $C(k)=2k+4$ euros for a
    journey of $k$ kilometres. Find the fare for a journey of 9 km.
  answer_label: Find the fare for 9 km.
  check:
    kind: evaluate
    expression: 2*9+4
    answer: '22'
  answer_text: $C(9)=2\times9+4=18+4=22$, so the fare is €22. The graph of $C$ is a straight line that starts
    at 4 on the vertical axis, because the €4 is charged even for a journey of 0 km.

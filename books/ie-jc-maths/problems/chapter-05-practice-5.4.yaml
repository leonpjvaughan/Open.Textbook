# Junior Cycle Mathematics, Chapter 5, section 5.4.
#
# Every check is an arithmetic identity the CAS proves, so the answer the reader
# is shown is the answer the verifier proved. A percentage is written as a
# fraction of 100 in `expression`, so "3/5 = 60%" is proved as "3/5*100 = 60".
# The per-cent sign and the words stay in `statement`: the CAS parses numbers and
# symbols only. A decimal that repeats needs a `rounded` check, never equality.
chapter: 5
symbols: {}

problems:
- id: jc5-5.4-frac-dec-1
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: Write $\frac{3}{4}$ as a decimal.
  answer_label: Write $\frac{3}{4}$ as a decimal.
  check:
    kind: evaluate
    expression: 3/4
    answer: '0.75'
  answer_text: >-
    $0.75$. Divide the numerator by the denominator: $3\div4=0.75$. A quarter is
    $0.25$, and three of them make $0.75$.
- id: jc5-5.4-dec-frac-1
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: Write $0.6$ as a fraction in its simplest form.
  answer_label: Write $0.6$ as a fraction in its simplest form.
  check:
    kind: evaluate
    expression: '0.6'
    answer: 3/5
  answer_text: >-
    $\frac{3}{5}$. The 6 sits in the tenths place, so $0.6=\frac{6}{10}$. Divide
    the top and the bottom by 2 to simplify it.
- id: jc5-5.4-frac-pct-1
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: Write $\frac{3}{5}$ as a percentage.
  answer_label: Write $\frac{3}{5}$ as a percentage.
  check:
    kind: evaluate
    expression: 3/5 * 100
    answer: '60'
  answer_text: >-
    $60\%$. Per cent means "per hundred", so multiply the fraction by 100.
    $\frac{3}{5}\times100=60$. You can also write the fraction with the
    denominator 100: $\frac{3}{5}=\frac{60}{100}$.
- id: jc5-5.4-pct-frac-1
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: Write $45\%$ as a fraction in its simplest form.
  answer_label: Write $45\%$ as a fraction in its simplest form.
  check:
    kind: evaluate
    expression: 45/100
    answer: 9/20
  answer_text: >-
    $\frac{9}{20}$. A percentage is a fraction with denominator 100, so
    $45\%=\frac{45}{100}$. Divide the top and the bottom by 5 to simplify it.
- id: jc5-5.4-dec-frac-2
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: Write $0.125$ as a fraction in its simplest form.
  answer_label: Write $0.125$ as a fraction in its simplest form.
  check:
    kind: evaluate
    expression: '0.125'
    answer: 1/8
  answer_text: >-
    $\frac{1}{8}$. The last digit is in the thousandths place, so
    $0.125=\frac{125}{1000}$. Divide the top and the bottom by 125, which is the
    highest common factor.
- id: jc5-5.4-frac-pct-2
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: Write $\frac{7}{20}$ as a percentage.
  answer_label: Write $\frac{7}{20}$ as a percentage.
  check:
    kind: evaluate
    expression: 7/20 * 100
    answer: '35'
  answer_text: >-
    $35\%$. Multiply by 100: $\frac{7}{20}\times100=35$. Because $20\times5=100$,
    you can also write the fraction with denominator 100 as
    $\frac{35}{100}$.
- id: jc5-5.4-pct-dec-1
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: Write $80\%$ as a decimal.
  answer_label: Write $80\%$ as a decimal.
  check:
    kind: evaluate
    expression: 80/100
    answer: '0.8'
  answer_text: >-
    $0.8$. A percentage is out of 100, so divide by 100: $80\div100=0.8$. Dividing
    by 100 moves every digit two places to the right of the decimal point.
- id: jc5-5.4-frac-dec-2
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: Write $\frac{1}{3}$ as a decimal, correct to 2 decimal places.
  answer_label: Write $\frac{1}{3}$ as a decimal, correct to 2 decimal places.
  check:
    kind: rounded
    value: 1/3
    rounded: '0.33'
    to: '0.01'
  answer_text: >-
    $0.33$. Dividing 1 by 3 gives $0.333\ldots$, which never stops. The third
    decimal digit is 3, which is less than 5, so the second digit stays.
- id: jc5-5.4-punch-1
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: One jug of punch holds $\frac{3}{2}$ litres, and $\frac{3}{4}$ of a litre of it is
    orange juice. What percentage of the jug is orange juice?
  answer_label: What percentage of the jug is orange juice?
  check:
    kind: evaluate
    expression: (3/4)/(3/2) * 100
    answer: '50'
  answer_text: >-
    $50\%$. Divide the orange juice by the whole jug:
    $\frac{3}{4}\div\frac{3}{2}=\frac{3}{4}\times\frac{2}{3}=\frac{1}{2}$. Then
    $\frac{1}{2}=0.5=50\%$. Half of every jug is orange juice.
- id: jc5-5.4-order-1
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: Write $0.7$, $\frac{2}{3}$ and $65\%$ in order, smallest first.
  answer_label: Order $0.7$, $\frac{2}{3}$ and $65\%$, smallest first.
  check:
    kind: all
    checks:
    - kind: compare
      relation: <
      lhs: 65/100
      rhs: 2/3
    - kind: compare
      relation: <
      lhs: 2/3
      rhs: '0.7'
  answer_text: >-
    $65\%$, $\frac{2}{3}$, $0.7$. As decimals they are $0.65$, $0.666\ldots$ and
    $0.70$. Writing all three in the same form is what makes the order clear.
- id: jc5-5.4-frac-pct-3
  section: '5.4'
  tier: O
  refs:
  - N.2
  statement: Write $\frac{5}{8}$ as a percentage.
  answer_label: Write $\frac{5}{8}$ as a percentage.
  check:
    kind: evaluate
    expression: 5/8 * 100
    answer: '62.5'
  answer_text: >-
    $62.5\%$. Multiply by 100: $\frac{5}{8}\times100=62.5$. As a decimal it is
    $0.625$, so the percentage is a little more than $60\%$.

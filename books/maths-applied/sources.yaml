# Provenance for Maths Applied.
#
# Two different claims live here, and they are not the same claim:
#
#   * **The vocabulary.** Camber, toe, instant centre and roll centre are the
#     standard terms of vehicle dynamics. This book uses those terms and states its
#     own sign conventions, so a reader comparing it with another text can see where
#     the conventions differ. That is the one claim here that rests on a document,
#     and it is tagged `attribution: true`.
#   * **Everything else is further reading.** The books below are where a reader can
#     go deeper, and none of them is the source of a number in this book. The roles
#     say which is which, because "we read this" and "read this next" are different
#     statements and only one of them is a citation.
#
# What the book does not do: it does not rest on a syllabus, and its geometry is
# illustrative rather than measured. Both are stated to the reader — in
# `curriculum.yaml` and in the chapter — rather than left to be inferred.

retrieved: 2026-10-18

note: >-
  The mathematics is standard, the geometry is illustrative rather than measured, and
  every number in a figure is computed by the model the page describes.

references:
  # --- the vocabulary ---------------------------------------------------------
  - id: sae-j670
    attribution: true
    title: "SAE J670: Vehicle Dynamics Terminology"
    url: https://www.sae.org/standards/content/j670_202208/
    role: >-
      The vocabulary of vehicle dynamics, and the place to check what this book's
      terms mean when another text uses them differently. The book states its own
      sign conventions rather than claiming J670's wording.

  - id: corner-photograph
    attribution: true
    title: A.d.Tramontana front suspension (cutaway display, Wikimedia Commons)
    url: https://commons.wikimedia.org/wiki/File:A.d.Tramontana_Front_Suspension.jpg
    ref: "a.d.Tramontana, CC BY-SA 1.0, via Wikimedia Commons; cropped to the mechanism"
    role: >-
      The photograph above the chapter: a real corner's parts, painted because it is a
      display unit rather than a car. It shows the shapes the anatomy diagram names and
      what the diagram cannot — how little space the linkage occupies. Cropped to remove
      the display stand. Licences searched on 2026-10-18: every clean photograph of a
      production or racing corner carried a team's livery (the Ferrari and Bridgestone
      Formula One corners were rejected for sponsor branding), the public-domain road-car
      corner was too dark and too dirty to read, and the technical drawings duplicate the
      illustration the book already has.

  - id: iso-8855
    title: "ISO 8855:2011 — Road vehicles: Vehicle dynamics and road-holding ability, vocabulary"
    ref: ISO 8855:2011
    role: >-
      The international counterpart to the above. Listed here so a reader who needs
      the standard rather than a textbook can find the number to ask for.

  # --- suspension geometry, in more depth than this book goes -----------------
  # Known unit caveat in 0.11.0: `dw-compliant` reports radians; its `out.js` says deg.
  - id: suspension-kinematics
    attribution: true
    title: suspension-kinematics — the model, its exports and a generated solver
    url: https://github.com/leonpjvaughan/suspension-kinematics
    ref: "release 0.11.0, 2026-10-21; otkd 0.11.0"
    role: >-
      The package the chapter's numbers come from: topology, geometry and study as
      data, the residual and Jacobian derived symbolically, and the same derivation
      compiled to WebAssembly — five kernels on the kinematic models and an integrator
      on the quarter car. Its 0.11.0 bundle is vendored under `docs/assets/data/otkd/`,
      with the bundle's `MANIFEST.json` and `SHA256SUMS`, by `scripts/vendor-otkd.sh`,
      which pins the release and the zip's digest. Figures run the kernels in the page:
      §1.2 compares the rigid one with its own front view, §1.5's ladder is the bushed
      model's export, and §1.6's table re-integrates the quarter car under two controls.
      The quarter car's trajectory is not in the bundle — a trajectory is not a sweep —
      so it is vendored beside the chapter with the digests of the model it came from.
      One unit caveat is the package's, not the book's: the `dw-compliant` kernel
      returns angles in radians while its `out.js` declares degrees. §1.5 converts both
      columns and its test recomputes them; remove the conversion when a release fixes
      the unit.

  - id: dixon
    title: Suspension Geometry and Computation
    ref: "John C. Dixon, Wiley, 2009"
    role: >-
      The standard treatment of suspension geometry: the same quantities as this
      chapter, computed in three dimensions and for every corner of a car. Further
      reading, not a source of any number here.

  - id: milliken
    title: Race Car Vehicle Dynamics
    url: https://www.sae.org/publications/books/content/r-146
    ref: "Milliken and Milliken, SAE, 1995"
    role: >-
      Why camber matters: the tyre model that turns the angle this chapter computes
      into the grip that §1.7 points at. Further reading; the chapter deliberately
      stops before the tyre.

  - id: mccarthy
    title: Geometric Design of Linkages
    url: https://link.springer.com/book/10.1007/978-1-4419-7892-9
    ref: "McCarthy and Soh, Springer, 2nd edition, 2011"
    role: >-
      Kinematic theory of linkages proper: mobility, branches, singular
      configurations. §1.2 to §1.4 are the smallest useful part of that subject.

  # --- the numerical ideas -----------------------------------------------------
  - id: nocedal
    title: Numerical Optimization
    url: https://link.springer.com/book/10.1007/978-0-387-40065-5
    ref: "Nocedal and Wright, Springer, 2nd edition, 2006"
    role: >-
      Gauss–Newton, Levenberg–Marquardt and why a step is solved the way §1.3 solves
      it. Further reading.

  - id: bjorck
    title: Numerical Methods for Least Squares Problems
    ref: "Åke Björck, SIAM, 1996"
    role: >-
      The numerical analysis behind §1.3 and §1.4: rank, the singular value
      decomposition, and what a least-squares answer's error bar really is.

  # --- modelling, which is what the book is about -------------------------------
  - id: box
    title: "Science and Statistics"
    ref: "George E. P. Box, Journal of the American Statistical Association 71 (1976), 791–799"
    role: >-
      Where "all models are wrong, but some are useful" comes from, and the argument
      that a model is judged by what it is for. The chapter's method is a worked
      version of that sentence.

  - id: hestenes
    title: "Toward a modeling theory of physics instruction"
    ref: "David Hestenes, American Journal of Physics 55 (1987), 440–454"
    role: >-
      Modelling as the thing being taught rather than a way of presenting content.
      Further reading on why a book can be about models instead of about a subject.

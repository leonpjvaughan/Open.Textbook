# Practice set for 3.7 (strand 3, outcome 3.4). Every answer is an exact multiple of pi,
# so `sympy` proves it symbolically. The two comparisons use `all`, so both the volume and
# the surface area claim must hold. The one explanation uses `structured`.
chapter: 3
problems:
  - id: lc3-7-sphere-volume
    section: '3.7'
    tier: O
    refs: ['3.4']
    statement: 'Find the volume of a sphere of radius $3$ cm.'
    answer_label: 'The volume of the sphere'
    check: {kind: evaluate, expression: '(4/3) * pi * 3**3', answer: '36 * pi'}
    answer_text: |-
      $$V = \tfrac{4}{3}\pi r^3 = \tfrac{4}{3}\pi \times 27 = 36\pi \approx 113.10 \text{ cm}^3$$

      Cube the radius first, then multiply by $\tfrac{4}{3}$ and by $\pi$.

  - id: lc3-7-sphere-area
    section: '3.7'
    tier: O
    refs: ['3.4']
    statement: 'Find the surface area of a sphere of radius $3$ cm.'
    answer_label: 'The surface area of the sphere'
    check: {kind: evaluate, expression: '4 * pi * 3**2', answer: '36 * pi'}
    answer_text: |-
      $$A = 4\pi r^2 = 4\pi \times 9 = 36\pi \approx 113.10 \text{ cm}^2$$

      The volume and the surface area agree only when the radius is $3$ cm.

  - id: lc3-7-sphere-volume-diameter
    section: '3.7'
    tier: O
    refs: ['3.4']
    statement: 'Find the volume of a sphere of diameter $12$ cm.'
    answer_label: 'The volume of the sphere'
    check: {kind: evaluate, expression: '(4/3) * pi * (12 / 2)**3', answer: '288 * pi'}
    answer_text: |-
      The radius is $6$ cm, so

      $$V = \tfrac{4}{3}\pi \times 216 = 288\pi \approx 904.78 \text{ cm}^3$$

      Halve the diameter before cubing it.

  - id: lc3-7-hemisphere-volume
    section: '3.7'
    tier: O
    refs: ['3.4']
    statement: 'Find the volume of a hemisphere of radius $6$ cm.'
    answer_label: 'The volume of the hemisphere'
    check: {kind: evaluate, expression: '(4/3) * pi * 6**3 / 2', answer: '144 * pi'}
    answer_text: |-
      A hemisphere is half a sphere, so

      $$V = \tfrac{1}{2} \times \tfrac{4}{3}\pi \times 216 = 144\pi \approx 452.39 \text{ cm}^3$$

      That is $\tfrac{2}{3}\pi r^3$ with $r = 6$.

  - id: lc3-7-hemisphere-surface
    section: '3.7'
    tier: O
    refs: ['3.4']
    statement: 'Find the total surface area of a hemisphere of radius $5$ cm.'
    answer_label: 'The total surface area of the hemisphere'
    check: {kind: evaluate, expression: '2 * pi * 5**2 + pi * 5**2', answer: '75 * pi'}
    answer_text: |-
      The curved surface is $2\pi \times 25 = 50\pi$, and the flat circle is
      $\pi \times 25 = 25\pi$:

      $$A = 50\pi + 25\pi = 75\pi \approx 235.62 \text{ cm}^2$$

      The flat circle is part of the total surface, and leaving it out gives $50\pi$.

  - id: lc3-7-tank-b
    section: '3.7'
    tier: O
    refs: ['3.4']
    statement: >-
      Tank B is a sphere of diameter $1.2$ m. Find its volume and its surface area, in
      exact form in terms of $\pi$.
    answer_label: 'The volume and the surface area of Tank B'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '(4/3) * pi * 0.6**3', answer: '0.288 * pi'}
        - {kind: evaluate, expression: '4 * pi * 0.6**2', answer: '1.44 * pi'}
    answer_text: |-
      The radius is $0.6$ m, so

      $$V = \tfrac{4}{3}\pi \times 0.216 = 0.288\pi \approx 0.905 \text{ m}^3$$

      $$A = 4\pi \times 0.36 = 1.44\pi \approx 4.52 \text{ m}^2$$

      That is about $905$ litres.

  - id: lc3-7-metal-per-volume
    section: '3.7'
    tier: O
    refs: ['3.4']
    statement: >-
      Tank A needs $2.16\pi \text{ m}^2$ of metal for a volume of $0.432\pi \text{ m}^3$.
      Tank B needs $1.44\pi \text{ m}^2$ for a volume of $0.288\pi \text{ m}^3$. Find the
      metal per cubic metre for each tank.
    answer_label: 'The metal per cubic metre for each tank'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '(2.16 * pi) / (0.432 * pi)', answer: '5'}
        - {kind: evaluate, expression: '(1.44 * pi) / (0.288 * pi)', answer: '5'}
    answer_text: |-
      $$\text{Tank A: } \frac{2.16\pi}{0.432\pi} = 5 \text{ m}^2/\text{m}^3$$

      $$\text{Tank B: } \frac{1.44\pi}{0.288\pi} = 5 \text{ m}^2/\text{m}^3$$

      Both tanks need exactly $5$ square metres of metal for every cubic metre of water, so
      the two shapes cost the same per litre. The $\pi$ cancels in both divisions, which is
      why the answer is exact.

  - id: lc3-7-hemisphere-surface-reason
    section: '3.7'
    tier: O
    refs: ['3.4']
    statement: 'Explain how to find the total surface area of a hemisphere of radius $r$.'
    answer_label: 'How to find the total surface area of a hemisphere'
    check:
      kind: structured
      requires: [curved-half, flat-circle, add-and-simplify]
      concepts: [hemisphere-surface]
      points:
        - id: curved-half
          text: >-
            The curved surface of a hemisphere is half the surface area of the whole
            sphere, so it is $\tfrac{1}{2} \times 4\pi r^2 = 2\pi r^2$.
          concepts: [hemisphere-surface]
        - id: flat-circle
          text: >-
            The cut face is a flat circle of radius $r$, with area $\pi r^2$.
        - id: add-and-simplify
          text: >-
            Add the two parts: $2\pi r^2 + \pi r^2 = 3\pi r^2$.
          concepts: [hemisphere-surface]
    answer_text: >-
      A hemisphere has a curved surface and a flat circular face. The curved surface is half
      of $4\pi r^2$, which is $2\pi r^2$. The flat face is a circle of area $\pi r^2$. So
      the total surface area is $2\pi r^2 + \pi r^2 = 3\pi r^2$. For a radius of $5$ cm that
      is $75\pi \approx 235.62 \text{ cm}^2$.

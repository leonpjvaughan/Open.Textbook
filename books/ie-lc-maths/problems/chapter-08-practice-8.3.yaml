# Practice set for 8.3 (strand 5, outcome 5.2, Higher). Every indefinite integral is
# checked by differentiation, so the constant of integration is free, and every
# definite integral is evaluated exactly over its limits. The statement of the
# Fundamental Theorem of Calculus is an explanation, so it uses `structured`.
chapter: 8
symbols:
  x: {real: true}
  t: {real: true}
problems:
  - id: lc8-3-exponential
    section: '8.3'
    tier: H
    refs: ['5.2']
    statement: 'Find $\displaystyle\int e^{3x}\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: 'exp(3*x)'
      apply: {op: integrate, args: [x]}
      answer: 'exp(3*x)/3'
      variable: x
    answer_text: >-
      Differentiating $e^{3x}$ multiplies by $3$, so integrating divides by $3$:

      $$\int e^{3x}\,dx = \frac{1}{3}e^{3x} + C$$

      The factor is $\dfrac{1}{k}$, not $k$. Check it by differentiating your answer.

  - id: lc8-3-sine
    section: '8.3'
    tier: H
    refs: ['5.2']
    statement: 'Find $\displaystyle\int \sin 2x\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: 'sin(2*x)'
      apply: {op: integrate, args: [x]}
      answer: '-cos(2*x)/2'
      variable: x
    answer_text: >-
      The derivative of $\cos 2x$ is $-2\sin 2x$, so the integral of $\sin 2x$ is
      negative and divided by $2$:

      $$\int \sin 2x\,dx = -\frac{1}{2}\cos 2x + C$$

  - id: lc8-3-cosine
    section: '8.3'
    tier: H
    refs: ['5.2']
    statement: 'Find $\displaystyle\int \cos 4x\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: 'cos(4*x)'
      apply: {op: integrate, args: [x]}
      answer: 'sin(4*x)/4'
      variable: x
    answer_text: >-
      The derivative of $\sin 4x$ is $4\cos 4x$, so integrating divides by $4$:

      $$\int \cos 4x\,dx = \frac{1}{4}\sin 4x + C$$

  - id: lc8-3-general-base
    section: '8.3'
    tier: H
    refs: ['5.2']
    statement: 'Find $\displaystyle\int 2^x\,dx$.'
    answer_label: 'The integral'
    check:
      kind: apply
      expression: '2**x'
      apply: {op: integrate, args: [x]}
      answer: '2**x/ln(2)'
      variable: x
    answer_text: >-
      For a positive base $a$, the standard result is

      $$\int a^x\,dx = \frac{a^x}{\ln a} + C$$

      so with $a = 2$ the integral is $\dfrac{2^x}{\ln 2} + C$. The logarithm appears
      because differentiating $2^x$ brings down $\ln 2$.

  - id: lc8-3-cosine-definite
    section: '8.3'
    tier: H
    refs: ['5.2']
    statement: 'Evaluate $\displaystyle\int_0^{\pi/2} \cos x\,dx$.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: 'cos(x)'
      apply: {op: integrate, args: [x, '0', 'pi/2']}
      answer: '1'
    answer_text: >-
      An antiderivative of $\cos x$ is $\sin x$, so by the Fundamental Theorem of
      Calculus

      $$\int_0^{\pi/2} \cos x\,dx = \Big[\sin x\Big]_0^{\pi/2} = 1 - 0 = 1$$

  - id: lc8-3-reciprocal
    section: '8.3'
    tier: H
    refs: ['5.2']
    statement: 'Evaluate $\displaystyle\int_1^2 \frac{1}{x}\,dx$, giving an exact answer.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: '1/x'
      apply: {op: integrate, args: [x, '1', '2']}
      answer: 'ln(2)'
    answer_text: >-
      The power rule does not cover $n = -1$, because dividing by $n + 1$ would divide
      by zero. The logarithm fills that gap, so

      $$\int_1^2 \frac{1}{x}\,dx = \Big[\ln x\Big]_1^2 = \ln 2 - \ln 1 = \ln 2$$

  - id: lc8-3-exponential-definite
    section: '8.3'
    tier: H
    refs: ['5.2']
    statement: 'Evaluate $\displaystyle\int_0^1 e^{2x}\,dx$, giving an exact answer.'
    answer_label: 'The value of the integral'
    check:
      kind: apply
      expression: 'exp(2*x)'
      apply: {op: integrate, args: [x, '0', '1']}
      answer: '(exp(2) - 1)/2'
    answer_text: >-
      An antiderivative of $e^{2x}$ is $\dfrac{1}{2}e^{2x}$, so

      $$\int_0^1 e^{2x}\,dx = \left[\frac{1}{2}e^{2x}\right]_0^1
      = \frac{1}{2}e^2 - \frac{1}{2} = \frac{e^2 - 1}{2}$$

  - id: lc8-3-theorem
    section: '8.3'
    tier: H
    refs: ['5.2']
    statement: >-
      State the Fundamental Theorem of Calculus, and explain why the constant of
      integration does not appear in a definite integral.
    answer_label: 'The theorem and the reason'
    check:
      kind: structured
      requires: [statement, subtract, constant]
      concepts: [antiderivative-at-limits, constant-cancels]
      points:
        - id: statement
          text: >-
            if F is any antiderivative of f, then the definite integral from a to b of
            f(x) dx is F(b) - F(a)
          concepts: [antiderivative-at-limits]
        - id: subtract
          text: >-
            evaluate the antiderivative at the upper limit and subtract its value at the
            lower limit
          concepts: [antiderivative-at-limits]
        - id: constant
          text: >-
            the constant would be added at the upper limit and subtracted at the lower
            limit, so it cancels
          concepts: [constant-cancels]
    answer_text: >-
      **The Fundamental Theorem of Calculus.** If $F$ is any antiderivative of $f$,
      then

      $$\int_a^b f(x)\,dx = F(b) - F(a)$$

      Evaluate the antiderivative at the upper limit and subtract its value at the
      lower limit.

      The constant of integration does not appear because it cancels. Writing
      $F(x) + C$ for the antiderivative gives $(F(b) + C) - (F(a) + C) = F(b) - F(a)$.
      The $C$ is added at the top and subtracted at the bottom, so it makes no
      difference to the value.

      For the chapter problem's tank, the rate is $r(t) = 12t - 3t^2$ and an
      antiderivative is $V(t) = 6t^2 - t^3$. The theorem gives

      $$\int_0^4 r(t)\,dt = V(4) - V(0) = (96 - 64) - 0 = 32$$

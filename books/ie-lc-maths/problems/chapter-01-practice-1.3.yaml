# Practice set for 1.3 (strand 3, outcome 3.1, Higher). A construction is a
# sequence of steps, so the constructions are `structured`; the lengths they
# produce are exact, so Pythagoras is proved with `evaluate` and `compare`.
chapter: 1
problems:
  - id: lc1-3-square-diagonal
    section: '1.3'
    tier: H
    refs: ['3.1']
    statement: 'A square has sides of length $1$. Use Pythagoras to find the length of a diagonal.'
    answer_label: 'The diagonal of the unit square'
    check: {kind: evaluate, expression: 'sqrt(1**2 + 1**2)', answer: 'sqrt(2)'}
    answer_text: >-
      The diagonal is the hypotenuse of a right triangle with legs $1$ and $1$:

      $$d = \sqrt{1^2 + 1^2} = \sqrt{2}$$

      The length is $\sqrt{2}$, an irrational number. That is the whole point of
      the construction: a length you can draw with a compass is not always a
      fraction.

  - id: lc1-3-square-diagonal-3
    section: '1.3'
    tier: H
    refs: ['3.1']
    statement: 'A square has sides of length $3$. Find the length of a diagonal in simplest surd form.'
    answer_label: 'The diagonal of the square of side 3'
    check: {kind: evaluate, expression: 'sqrt(3**2 + 3**2)', answer: '3*sqrt(2)'}
    answer_text: >-
      $$d = \sqrt{3^2 + 3^2} = \sqrt{18} = 3\sqrt{2}$$

      The diagonal of a square of side $s$ is always $s\sqrt{2}$.

  - id: lc1-3-construct-sqrt2
    section: '1.3'
    tier: H
    refs: ['3.1']
    statement: 'Describe how to construct $\sqrt{2}$ on the number line, starting from a unit square.'
    answer_label: 'The construction of $\sqrt{2}$'
    check:
      kind: structured
      requires: [square, arc]
      concepts: [pythagoras, compass-arc]
      points:
        - id: square
          text: draw a square of side 1 on the number line with one corner at 0, so its diagonal is sqrt(2) by Pythagoras
          concepts: [pythagoras]
        - id: arc
          text: open the compass to the diagonal and mark that distance on the number line from 0; the point marked is sqrt(2)
          concepts: [compass-arc]
    answer_text: >-
      Draw a square of side $1$ with one corner at $0$ and one side along the
      number line. Its diagonal is $\sqrt{1^2 + 1^2} = \sqrt{2}$ by Pythagoras.

      Open a pair of compasses to the diagonal, put the point at $0$, and draw
      an arc that crosses the number line. The point where the arc crosses is at
      distance $\sqrt{2}$ from $0$.

  - id: lc1-3-construct-sqrt3
    section: '1.3'
    tier: H
    refs: ['3.1']
    statement: 'Describe how to construct $\sqrt{3}$ on the number line, using the right triangle with legs $1$ and $\sqrt{2}$.'
    answer_label: 'The construction of $\sqrt{3}$'
    check:
      kind: structured
      requires: [triangle, arc]
      concepts: [pythagoras, compass-arc]
      points:
        - id: triangle
          text: draw a right triangle with legs 1 and sqrt(2); its hypotenuse is sqrt(1 + 2) = sqrt(3)
          concepts: [pythagoras]
        - id: arc
          text: open the compass to the hypotenuse and mark that distance on the number line from 0; the point marked is sqrt(3)
          concepts: [compass-arc]
    answer_text: >-
      Draw a right triangle with one leg of length $1$ and the other of length
      $\sqrt{2}$. Its hypotenuse is

      $$\sqrt{1^2 + (\sqrt{2})^2} = \sqrt{1 + 2} = \sqrt{3}$$

      Open the compass to the hypotenuse and mark the distance on the number
      line from $0$. The point marked is at $\sqrt{3}$.

  - id: lc1-3-hypotenuse
    section: '1.3'
    tier: H
    refs: ['3.1']
    statement: 'A right triangle has legs of length $1$ and $\sqrt{2}$. Find the length of the hypotenuse.'
    answer_label: 'The hypotenuse'
    check: {kind: evaluate, expression: 'sqrt(1**2 + (sqrt(2))**2)', answer: 'sqrt(3)'}
    answer_text: >-
      $$h = \sqrt{1^2 + (\sqrt{2})^2} = \sqrt{1 + 2} = \sqrt{3}$$

      This is the triangle that gives $\sqrt{3}$ from $\sqrt{2}$.

  - id: lc1-3-rectangle
    section: '1.3'
    tier: H
    refs: ['3.1']
    statement: 'A rectangle is $2$ units by $3$ units. Find the length of a diagonal in simplest surd form.'
    answer_label: 'The diagonal of the rectangle'
    check: {kind: evaluate, expression: 'sqrt(2**2 + 3**2)', answer: 'sqrt(13)'}
    answer_text: >-
      $$d = \sqrt{2^2 + 3^2} = \sqrt{4 + 9} = \sqrt{13}$$

      $13$ has no square factor, so $\sqrt{13}$ is already in simplest form.

  - id: lc1-3-between
    section: '1.3'
    tier: H
    refs: ['3.1']
    statement: 'Show that $\sqrt{2}$ lies between $1.4$ and $1.5$.'
    answer_label: 'The two comparisons'
    check:
      kind: all
      checks:
        - {kind: compare, relation: '<', lhs: '1.4', rhs: 'sqrt(2)'}
        - {kind: compare, relation: '<', lhs: 'sqrt(2)', rhs: '1.5'}
    answer_text: >-
      $1.4^2 = 1.96$ and $1.5^2 = 2.25$, and $1.96 < 2 < 2.25$. Taking square
      roots keeps the order for positive numbers, so $1.4 < \sqrt{2} < 1.5$.

      Squaring is the way to place a surd between two decimals.

  - id: lc1-3-sqrt5
    section: '1.3'
    tier: H
    refs: ['3.1']
    statement: 'Describe how to construct $\sqrt{5}$ on the number line.'
    answer_label: 'The construction of $\sqrt{5}$'
    check:
      kind: structured
      requires: [rectangle, arc]
      concepts: [pythagoras, compass-arc]
      points:
        - id: rectangle
          text: draw a rectangle 1 unit by 2 units, or a right triangle with legs 1 and 2; its diagonal is sqrt(1 + 4) = sqrt(5)
          concepts: [pythagoras]
        - id: arc
          text: open the compass to the diagonal and mark that distance on the number line from 0
          concepts: [compass-arc]
    answer_text: >-
      Draw a right triangle with legs $1$ and $2$. Its hypotenuse is

      $$\sqrt{1^2 + 2^2} = \sqrt{1 + 4} = \sqrt{5}$$

      Open the compass to the hypotenuse and mark the distance from $0$ on the
      number line. The point marked is at $\sqrt{5}$.

      The same method builds the square root of any whole number: write it as
      the sum of two squares, then draw the right triangle.

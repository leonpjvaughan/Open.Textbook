# Practice set for 3.6 (strand 3, outcome 3.4). Every answer here is an exact rational or
# an exact multiple of pi, so `sympy` proves it. The tank comparison is one `all` check, so
# both the volume ratio and the area ratio must hold. The one explanation uses
# `structured`.
chapter: 3
problems:
  - id: lc3-6-area-ratio
    section: '3.6'
    tier: H
    refs: ['3.4']
    statement: 'Two similar rectangles have corresponding lengths in the ratio $3 : 1$. Find the ratio of their areas.'
    answer_label: 'The ratio of the areas'
    check: {kind: evaluate, expression: '3**2', answer: '9'}
    answer_text: >-
      The areas are in the ratio $9 : 1$. An area is stretched in two directions, so the
      area ratio is $k^2 = 3^2 = 9$.

  - id: lc3-6-volume-ratio
    section: '3.6'
    tier: H
    refs: ['3.4']
    statement: 'Two similar solids have corresponding lengths in the ratio $2 : 1$. Find the ratio of their volumes.'
    answer_label: 'The ratio of the volumes'
    check: {kind: evaluate, expression: '2**3', answer: '8'}
    answer_text: >-
      The volumes are in the ratio $8 : 1$. A volume is stretched in three directions, so
      the volume ratio is $k^3 = 2^3 = 8$.

  - id: lc3-6-model-scale
    section: '3.6'
    tier: H
    refs: ['3.4']
    statement: 'A model of a tank is built to a scale of $1 : 20$. Find the ratio of the volume of the model to the volume of the real tank.'
    answer_label: 'The volume ratio of model to tank'
    check: {kind: evaluate, expression: '(1/20)**3', answer: '1/8000'}
    answer_text: |-
      $$\left(\frac{1}{20}\right)^3 = \frac{1}{8000}$$

      The model volume is $\dfrac{1}{8000}$ of the real volume, because three lengths are
      scaled down.

  - id: lc3-6-length-from-area
    section: '3.6'
    tier: H
    refs: ['3.4']
    statement: 'Two similar triangles have areas $25 \text{ cm}^2$ and $64 \text{ cm}^2$. Find the ratio of their corresponding sides.'
    answer_label: 'The ratio of the sides'
    check: {kind: evaluate, expression: 'sqrt(64/25)', answer: '8/5'}
    answer_text: |-
      The area ratio is $\dfrac{64}{25}$, so the length ratio is

      $$\sqrt{\frac{64}{25}} = \frac{8}{5}$$

      The sides are in the ratio $5 : 8$, and the scale factor from small to large is
      $1.6$.

  - id: lc3-6-length-from-volume
    section: '3.6'
    tier: H
    refs: ['3.4']
    statement: 'Two similar solids have volumes $8 \text{ cm}^3$ and $125 \text{ cm}^3$. Find the ratio of their corresponding lengths.'
    answer_label: 'The ratio of the lengths'
    check: {kind: evaluate, expression: '(125/8)**(1/3)', answer: '5/2'}
    answer_text: |-
      The volume ratio is $\dfrac{125}{8}$, so the length ratio is

      $$\sqrt[3]{\frac{125}{8}} = \frac{5}{2}$$

      The lengths are in the ratio $2 : 5$.

  - id: lc3-6-tank-doubled
    section: '3.6'
    tier: H
    refs: ['3.4']
    statement: >-
      Tank A has volume $0.432\pi \text{ m}^3$ and surface area $2.16\pi \text{ m}^2$. A
      similar tank is twice as large in every length. Find its volume and its surface area,
      in terms of $\pi$.
    answer_label: 'The volume and the surface area'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '0.432 * pi * 2**3', answer: '3.456 * pi'}
        - {kind: evaluate, expression: '2.16 * pi * 2**2', answer: '8.64 * pi'}
    answer_text: |-
      The volume is multiplied by $2^3 = 8$:

      $$V = 0.432\pi \times 8 = 3.456\pi \approx 10.86 \text{ m}^3$$

      The surface area is multiplied by $2^2 = 4$:

      $$A = 2.16\pi \times 4 = 8.64\pi \approx 27.14 \text{ m}^2$$

      The volume grows faster than the surface area, so the larger tank gives more water
      for each square metre of metal.

  - id: lc3-6-length-from-volume-64-27
    section: '3.6'
    tier: H
    refs: ['3.4']
    statement: 'Two similar cylinders have volumes in the ratio $27 : 64$. Find the ratio of their radii.'
    answer_label: 'The ratio of the radii'
    check: {kind: evaluate, expression: '(64/27)**(1/3)', answer: '4/3'}
    answer_text: |-
      The radii are lengths, so the ratio of the radii is the cube root of the volume
      ratio:

      $$\sqrt[3]{\frac{64}{27}} = \frac{4}{3}$$

      The radii are in the ratio $3 : 4$.

  - id: lc3-6-why-k-squared
    section: '3.6'
    tier: H
    refs: ['3.4']
    statement: 'Explain why an area is multiplied by $k^2$ and a volume by $k^3$ when every length is multiplied by $k$.'
    answer_label: 'Why area uses k² and volume uses k³'
    check:
      kind: structured
      requires: [explain-two-directions, explain-three-directions, give-example]
      concepts: [area-ratio, volume-ratio]
      points:
        - id: explain-two-directions
          text: >-
            A flat figure has two dimensions, so an enlargement stretches it in two
            directions. Each direction contributes one factor of $k$, and the area is
            multiplied by $k \times k = k^2$.
          concepts: [area-ratio]
        - id: explain-three-directions
          text: >-
            A solid has three dimensions, so it is stretched in three directions and its
            volume is multiplied by $k \times k \times k = k^3$.
          concepts: [volume-ratio]
        - id: give-example
          text: >-
            For $k = 3$ a rectangle $2$ cm by $3$ cm becomes $6$ cm by $9$ cm, so the area
            goes from $6 \text{ cm}^2$ to $54 \text{ cm}^2$, which is $3^2 = 9$ times.
    answer_text: >-
      A length is stretched in one direction, so it is multiplied by $k$. A flat figure has
      two dimensions, so both of them are stretched and the area is multiplied by $k^2$. A
      solid has three dimensions, so the volume is multiplied by $k^3$. For a cylinder of
      radius $r$ and height $h$, the new volume is
      $\pi (kr)^2 (kh) = k^3 \pi r^2 h$, which is $k^3$ times the old volume.

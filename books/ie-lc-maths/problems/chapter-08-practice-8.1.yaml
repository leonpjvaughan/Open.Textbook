# Practice set for 8.1 (strand 5, outcome 5.2). Integration is the reverse of
# differentiation and not an equivalence of expressions, so every indefinite integral
# is checked with `kind: apply` and `op: integrate`. The verifier proves the stated
# answer is an antiderivative, so the constant of integration is free. The chapter
# problem's tank is built here from its rate of change.
chapter: 8
symbols:
  x: {real: true}
  t: {real: true}
problems:
  - id: lc8-1-power
    section: '8.1'
    tier: O
    refs: ['5.2']
    statement: 'Find $\displaystyle\int x^5\,dx$.'
    answer_label: 'The integral'
    plays: integral-power
    check:
      kind: apply
      expression: 'x**5'
      apply: {op: integrate, args: [x]}
      answer: 'x**6/6'
      variable: x
    steps:
      - expr: 'x**5'
      - expr: 'x**6/6'
        relation: apply
        apply: {op: integrate, args: [x]}
    answer_text: >-
      Raise the power by one and divide by the new power:

      $$\int x^5\,dx = \frac{x^6}{6} + C$$

      The constant $C$ is added because any constant differentiates to zero.

  - id: lc8-1-constant-multiple
    section: '8.1'
    tier: O
    refs: ['5.2']
    statement: 'Find $\displaystyle\int 8x^3\,dx$.'
    answer_label: 'The integral'
    plays: integral-power
    check:
      kind: apply
      expression: '8*x**3'
      apply: {op: integrate, args: [x]}
      answer: '2*x**4'
      variable: x
    answer_text: >-
      The constant multiple stays outside the integral:

      $$\int 8x^3\,dx = 8 \times \frac{x^4}{4} + C = 2x^4 + C$$

  - id: lc8-1-sum
    section: '8.1'
    tier: O
    refs: ['5.2']
    statement: 'Find $\displaystyle\int (6x^2 - 4x + 5)\,dx$.'
    answer_label: 'The integral'
    plays: integral-power
    check:
      kind: apply
      expression: '6*x**2 - 4*x + 5'
      apply: {op: integrate, args: [x]}
      answer: '2*x**3 - 2*x**2 + 5*x'
      variable: x
    answer_text: >-
      Integrate term by term:

      $$\int (6x^2 - 4x + 5)\,dx = 6 \times \frac{x^3}{3} - 4 \times \frac{x^2}{2}
      + 5x + C = 2x^3 - 2x^2 + 5x + C$$

  - id: lc8-1-negative-power
    section: '8.1'
    tier: O
    refs: ['5.2']
    statement: 'Find $\displaystyle\int \frac{1}{x^2}\,dx$.'
    answer_label: 'The integral'
    plays: integral-power
    check:
      kind: apply
      expression: 'x**(-2)'
      apply: {op: integrate, args: [x]}
      answer: '-1/x'
      variable: x
    answer_text: >-
      Write the fraction as a power first: $\dfrac{1}{x^2} = x^{-2}$. Then

      $$\int x^{-2}\,dx = \frac{x^{-1}}{-1} + C = -\frac{1}{x} + C$$

      The power rule works for a negative whole number, as long as the new power is
      not zero.

  - id: lc8-1-surd
    section: '8.1'
    tier: O
    refs: ['5.2']
    statement: 'Find $\displaystyle\int \sqrt{x}\,dx$.'
    answer_label: 'The integral'
    plays: integral-power
    check:
      kind: apply
      expression: 'sqrt(x)'
      apply: {op: integrate, args: [x]}
      answer: '(2/3)*x**(3/2)'
      variable: x
    answer_text: >-
      Write the root as a power: $\sqrt{x} = x^{1/2}$. Then

      $$\int x^{1/2}\,dx = \frac{x^{3/2}}{3/2} + C = \frac{2}{3}x^{3/2} + C$$

      Dividing by $\dfrac{3}{2}$ is the same as multiplying by $\dfrac{2}{3}$.

  - id: lc8-1-check-by-differentiating
    section: '8.1'
    tier: O
    refs: ['5.2']
    statement: >-
      Show that $F(x) = 2x^3 - x^2 + 4x$ is an antiderivative of
      $f(x) = 6x^2 - 2x + 4$.
    answer_label: 'The derivative of F'
    plays: derivative-power
    check:
      kind: apply
      expression: '2*x**3 - x**2 + 4*x'
      apply: {op: diff, args: [x]}
      answer: '6*x**2 - 2*x + 4'
    answer_text: >-
      Differentiate $F$ term by term:

      $$F'(x) = 6x^2 - 2x + 4$$

      This is exactly $f(x)$, so $F$ is an antiderivative of $f$. You can always check
      an integral this way: differentiate the answer and see whether you get back to
      the function you started with.

  - id: lc8-1-curve-through-point
    section: '8.1'
    tier: O
    refs: ['5.2']
    statement: >-
      The gradient of a curve is $\dfrac{dy}{dx} = 6x^2$, and the curve passes through
      $(1, 5)$. Find the equation of the curve.
    answer_label: 'The equation of the curve'
    check:
      kind: all
      checks:
        - {kind: apply, expression: '2*x**3 + 3', apply: {op: diff, args: [x]}, answer: '6*x**2'}
        - {kind: evaluate, expression: '2*1**3 + 3', answer: '5'}
    answer_text: >-
      Integrate the gradient:

      $$y = \int 6x^2\,dx = 2x^3 + C$$

      The point $(1, 5)$ lies on the curve, so substitute $x = 1$ and $y = 5$:

      $$5 = 2(1)^3 + C = 2 + C \quad\Rightarrow\quad C = 3$$

      The curve is $y = 2x^3 + 3$.

  - id: lc8-1-tank-volume
    section: '8.1'
    tier: O
    refs: ['5.2']
    statement: >-
      Water is rising in a tank at a rate $\dfrac{dV}{dt} = 12t - 3t^2$ litres per
      minute, and the tank is empty at $t = 0$. Find $V(t)$, the volume of water after
      $t$ minutes, and work out $V(4)$.
    answer_label: 'The volume function, then the volume at four minutes'
    check:
      kind: all
      variable: t
      checks:
        - {kind: apply, expression: '12*t - 3*t**2', apply: {op: integrate, args: [t]}, answer: '6*t**2 - t**3', variable: t}
        - {kind: evaluate, expression: '6*4**2 - 4**3', answer: '32'}
    steps:
      - expr: '12*t - 3*t**2'
      - expr: '6*t**2 - t**3'
        relation: apply
        apply: {op: integrate, args: [t]}
    answer_text: >-
      The volume is an antiderivative of the rate:

      $$V(t) = \int (12t - 3t^2)\,dt = 6t^2 - t^3 + C$$

      The tank is empty at $t = 0$, so $V(0) = 0$ and $C = 0$. Therefore
      $V(t) = 6t^2 - t^3$ litres. At $t = 4$,

      $$V(4) = 6(16) - 64 = 96 - 64 = 32 \text{ litres}$$

      The tank holds $32$ litres after four minutes. This is the chapter problem.

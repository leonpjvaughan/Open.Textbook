# Practice set for 7.4 (strand 5, outcome 5.2). The quotient rule is an operation, so
# every derivative uses `kind: apply` with `op: diff`. The statement of the rule and the
# order of its numerator is a written argument and uses `structured`.
chapter: 7
symbols:
  x: {real: true}
  t: {real: true}
problems:
  - id: lc7-4-linear-over-linear
    section: '7.4'
    tier: O
    refs: ['5.2']
    statement: 'Differentiate $y = \dfrac{2x + 1}{x - 1}$.'
    answer_label: 'The derivative'
    plays: quotient-rule
    check:
      kind: apply
      expression: '(2*x + 1)/(x - 1)'
      apply: {op: diff, args: [x]}
      answer: '-3/(x - 1)**2'
    answer_text: |-
      Let $u = 2x + 1$, so $u' = 2$, and $v = x - 1$, so $v' = 1$. Then

      $$y' = \frac{u'v - uv'}{v^2} = \frac{2(x - 1) - (2x + 1)(1)}{(x - 1)^2}
      = \frac{2x - 2 - 2x - 1}{(x - 1)^2} = \frac{-3}{(x - 1)^2}$$

  - id: lc7-4-over-x
    section: '7.4'
    tier: O
    refs: ['5.2']
    statement: 'Differentiate $y = \dfrac{x^2 + 1}{x}$.'
    answer_label: 'The derivative'
    plays: quotient-rule
    check:
      kind: apply
      expression: '(x**2 + 1)/x'
      apply: {op: diff, args: [x]}
      answer: '(x**2 - 1)/x**2'
    answer_text: |-
      Let $u = x^2 + 1$, so $u' = 2x$, and $v = x$, so $v' = 1$. Then

      $$y' = \frac{2x(x) - (x^2 + 1)(1)}{x^2} = \frac{2x^2 - x^2 - 1}{x^2}
      = \frac{x^2 - 1}{x^2}$$

      Dividing the original by $x$ first gives $y = x + \dfrac{1}{x}$, whose
      derivative is $1 - \dfrac{1}{x^2}$, the same result.

  - id: lc7-4-three-x
    section: '7.4'
    tier: O
    refs: ['5.2']
    statement: 'Differentiate $y = \dfrac{3x + 2}{x + 1}$.'
    answer_label: 'The derivative'
    plays: quotient-rule
    check:
      kind: apply
      expression: '(3*x + 2)/(x + 1)'
      apply: {op: diff, args: [x]}
      answer: '1/(x + 1)**2'
    answer_text: |-
      Let $u = 3x + 2$, so $u' = 3$, and $v = x + 1$, so $v' = 1$. Then

      $$y' = \frac{3(x + 1) - (3x + 2)(1)}{(x + 1)^2}
      = \frac{3x + 3 - 3x - 2}{(x + 1)^2} = \frac{1}{(x + 1)^2}$$

  - id: lc7-4-x-squared-over-linear
    section: '7.4'
    tier: O
    refs: ['5.2']
    statement: 'Differentiate $y = \dfrac{x^2}{x + 1}$.'
    answer_label: 'The derivative'
    plays: quotient-rule
    check:
      kind: apply
      expression: 'x**2/(x + 1)'
      apply: {op: diff, args: [x]}
      answer: '(x**2 + 2*x)/(x + 1)**2'
    answer_text: |-
      Let $u = x^2$, so $u' = 2x$, and $v = x + 1$, so $v' = 1$. Then

      $$y' = \frac{2x(x + 1) - x^2(1)}{(x + 1)^2} = \frac{2x^2 + 2x - x^2}{(x + 1)^2}
      = \frac{x^2 + 2x}{(x + 1)^2}$$

      The numerator factorises as $x(x + 2)$, which shows the derivative is zero at
      $x = 0$ and at $x = -2$.

  - id: lc7-4-tank
    section: '7.4'
    tier: O
    refs: ['5.2']
    statement: >-
      Write the tank volume as $V(t) = \dfrac{12t^3 - t^4}{t}$ litres and use the
      quotient rule to find $V'(t)$.
    answer_label: 'The rate'
    plays: quotient-rule
    check:
      kind: apply
      expression: '(12*t**3 - t**4)/t'
      apply: {op: diff, args: [t]}
      answer: '24*t - 3*t**2'
    answer_text: |-
      Let $u = 12t^3 - t^4$, so $u' = 36t^2 - 4t^3$, and $v = t$, so $v' = 1$. Then

      $$V'(t) = \frac{(36t^2 - 4t^3)t - (12t^3 - t^4)(1)}{t^2}
      = \frac{36t^3 - 4t^4 - 12t^3 + t^4}{t^2} = \frac{24t^3 - 3t^4}{t^2}
      = 24t - 3t^2$$

      The quotient form gives the same rate as the product and expanded forms.

  - id: lc7-4-tank-rate-four
    section: '7.4'
    tier: O
    refs: ['5.2']
    statement: >-
      Using $V'(t) = 24t - 3t^2$, work out the rate at $t = 4$ minutes.
    answer_label: 'The rate at four minutes'
    check: {kind: evaluate, expression: '24*4 - 3*4**2', answer: '48'}
    answer_text: >-
      $V'(4) = 96 - 48 = 48$ litres per minute.

  - id: lc7-4-statement
    section: '7.4'
    tier: O
    refs: ['5.2']
    statement: >-
      State the quotient rule and explain why the order of the two terms in the
      numerator matters.
    answer_label: 'The rule and the order'
    check:
      kind: structured
      requires: [state, order]
      concepts: [quotient-rule, sign-matters]
      points:
        - id: state
          text: >-
            the quotient rule is y' equals (u'v minus uv') divided by v squared, for
            y = u over v
          concepts: [quotient-rule]
        - id: order
          text: >-
            the subtraction is not symmetric, so reversing u'v and uv' changes the sign
            of the answer
          concepts: [sign-matters]
    answer_text: |-
      For $y = \dfrac{u}{v}$ the quotient rule is

      $$y' = \frac{u'v - uv'}{v^2}$$

      The numerator subtracts $uv'$ from $u'v$. Subtraction is not symmetric, so
      swapping the two terms changes the sign of the whole answer. For example
      $\dfrac{2x + 1}{x - 1}$ has derivative $\dfrac{-3}{(x - 1)^2}$, and reversing
      the terms would give $\dfrac{+3}{(x - 1)^2}$, which is wrong.

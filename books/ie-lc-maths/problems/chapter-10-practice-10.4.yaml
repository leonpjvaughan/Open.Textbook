# Practice set for 10.4 (strand 1, outcome 1.2). The counts of outcomes and of events are
# integers, so `evaluate` proves them. The set *names* are prose: the oracle proves the
# size of the event, and the answer text says which outcomes it contains.
chapter: 10
problems:
  - id: lc10-4-two-coins
    section: '10.4'
    tier: O
    refs: ['1.2']
    statement: >-
      Two coins are tossed. State how many outcomes are in the sample space, and name
      them.
    answer_label: 'The number of outcomes'
    check: {kind: evaluate, expression: '2 * 2', answer: '4'}
    answer_text: >-
      Each coin has $2$ outcomes, so the sample space has $2 \times 2 = 4$ outcomes:
      HH, HT, TH and TT. Here H means a head and T means a tail.

  - id: lc10-4-die
    section: '10.4'
    tier: O
    refs: ['1.2']
    statement: 'A fair six-sided die is rolled once. How many outcomes are in the sample space?'
    answer_label: 'The number of outcomes'
    check: {kind: evaluate, expression: '6', answer: '6'}
    answer_text: >-
      The sample space is $\{1, 2, 3, 4, 5, 6\}$, which has $6$ outcomes. Each outcome is
      equally likely, so each has probability $\dfrac{1}{6}$.

  - id: lc10-4-even
    section: '10.4'
    tier: O
    refs: ['1.2']
    statement: >-
      A fair six-sided die is rolled. The event $A$ is an even score. How many outcomes
      are in $A$, and what is $P(A)$?
    answer_label: 'The count, then the probability'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '3', answer: '3'}
        - {kind: evaluate, expression: '3/6', answer: '1/2'}
    answer_text: >-
      The even scores are $2$, $4$ and $6$, so $A$ has $3$ outcomes. Then
      $P(A) = \dfrac{3}{6} = \dfrac{1}{2}$.

  - id: lc10-4-union
    section: '10.4'
    tier: O
    refs: ['1.2']
    statement: >-
      A die is rolled. The event $A$ is an even score and the event $B$ is a score
      greater than $4$. How many outcomes are in $A \cup B$?
    answer_label: 'The number of outcomes'
    check: {kind: evaluate, expression: '3 + 2 - 1', answer: '4'}
    answer_text: >-
      $A = \{2, 4, 6\}$ has $3$ outcomes and $B = \{5, 6\}$ has $2$. The score $6$ is in
      both, so it is counted twice. Then
      $n(A \cup B) = 3 + 2 - 1 = 4$, and $A \cup B = \{2, 4, 5, 6\}$.

  - id: lc10-4-intersection
    section: '10.4'
    tier: O
    refs: ['1.2']
    statement: >-
      A die is rolled. The event $A$ is an even score and the event $B$ is a score
      greater than $4$. How many outcomes are in $A \cap B$?
    answer_label: 'The number of outcomes'
    check: {kind: evaluate, expression: '1', answer: '1'}
    answer_text: >-
      $A \cap B$ contains the scores that are even **and** greater than $4$. The only
      such score is $6$, so $n(A \cap B) = 1$.

  - id: lc10-4-complement
    section: '10.4'
    tier: O
    refs: ['1.2']
    statement: >-
      A die is rolled and $A$ is an even score. How many outcomes are in the complement
      $A'$?
    answer_label: 'The number of outcomes'
    check: {kind: evaluate, expression: '6 - 3', answer: '3'}
    answer_text: >-
      The complement $A'$ contains every outcome that is not in $A$, so it is the odd
      scores $\{1, 3, 5\}$. It has $6 - 3 = 3$ outcomes.

  - id: lc10-4-addition-rule
    section: '10.4'
    tier: O
    refs: ['1.2']
    statement: >-
      Two events have $n(A) = 3$, $n(B) = 2$ and $n(A \cap B) = 1$. Use the addition rule
      to find $n(A \cup B)$.
    answer_label: 'The number of outcomes'
    check: {kind: evaluate, expression: '3 + 2 - 1', answer: '4'}
    answer_text: >-
      The addition rule is
      $n(A \cup B) = n(A) + n(B) - n(A \cap B)$. So
      $n(A \cup B) = 3 + 2 - 1 = 4$. The subtraction removes the outcomes counted in
      both sets.

  - id: lc10-4-sample-space
    section: '10.4'
    tier: O
    refs: ['1.2']
    statement: 'Explain what a sample space is, and what an event is.'
    answer_label: 'The explanation'
    check:
      kind: structured
      requires: [sample-space, event]
      concepts: [all-outcomes, subset]
      points:
        - id: sample-space
          text: the sample space is the set of all possible outcomes of an experiment
          concepts: [all-outcomes]
        - id: event
          text: an event is a subset of the sample space, a collection of outcomes that share a property
          concepts: [subset]
    answer_text: >-
      The sample space is the set of every possible outcome. For one roll of a die it is
      $\{1, 2, 3, 4, 5, 6\}$.

      An event is a subset of the sample space. The event "an even score" is the subset
      $\{2, 4, 6\}$. Every outcome belongs to the sample space, and an event collects the
      outcomes that share the property we are asking about.

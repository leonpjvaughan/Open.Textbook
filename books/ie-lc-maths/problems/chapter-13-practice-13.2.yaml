# Practice set for 13.2 (Leaving Certificate Mathematics, strand 2, outcome 2.2).
#
# A line is checked by the two numbers that fix it: the slope, computed from the
# two points, and the intercept, computed from a point and the slope. A point on
# the line is then substituted, so the CAS proves the equation satisfies the
# data rather than being told the answer.
chapter: 13
symbols:
  x: {real: true}
problems:
  - id: lc13-2-slope-intercept
    section: '13.2'
    tier: F
    refs: ['2.2']
    statement: 'Write down the slope and the $y$-intercept of $y = 2x - 5$.'
    answer_label: 'Slope and y-intercept'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '(2*1 - 5) - (2*0 - 5)', answer: '2'}
        - {kind: evaluate, expression: '2*0 - 5', answer: '-5'}
    answer_text: >-
      In the form $y = mx + c$, the slope is $m = 2$ and the $y$-intercept is
      $c = -5$. The line crosses the $y$-axis at $(0, -5)$.

  - id: lc13-2-through-point
    section: '13.2'
    tier: F
    refs: ['2.2']
    statement: 'Find the equation of the line with slope $3$ through $(1, 2)$.'
    answer_label: 'The equation'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '2 - 3*1', answer: '-1'}
        - {kind: evaluate, expression: '3*2 - 1', answer: '5'}
    answer_text: >-
      Use $y - y_1 = m(x - x_1)$: $y - 2 = 3(x - 1)$, so $y = 3x - 1$. The
      point $(2, 5)$ satisfies it, since $3 \times 2 - 1 = 5$.

  - id: lc13-2-two-points
    section: '13.2'
    tier: F
    refs: ['2.2']
    statement: 'Find the equation of the line through $(2, 1)$ and $(6, 9)$.'
    answer_label: 'The equation'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '(9 - 1)/(6 - 2)', answer: '2'}
        - {kind: evaluate, expression: '1 - 2*2', answer: '-3'}
    answer_text: >-
      The slope is $\frac{9 - 1}{6 - 2} = 2$. Using the point $(2, 1)$,
      $y - 1 = 2(x - 2)$, so $y = 2x - 3$.

  - id: lc13-2-main-road
    section: '13.2'
    tier: F
    refs: ['2.2']
    statement: >-
      Write the equation of the main road through $A(-1, 1)$ and $B(7, 7)$ in
      the form $ax + by + c = 0$.
    answer_label: 'The equation'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '1 - (3/4)*(-1)', answer: '7/4'}
        - {kind: evaluate, expression: '3*7 - 4*7 + 7', answer: '0'}
        - {kind: evaluate, expression: '3*(-1) - 4*1 + 7', answer: '0'}
    answer_text: >-
      The slope is $\frac{3}{4}$. Using $A$, $y - 1 = \frac{3}{4}(x + 1)$, so
      $y = \frac{3}{4}x + \frac{7}{4}$. Multiplying by $4$ and rearranging gives
      $3x - 4y + 7 = 0$. Both $A$ and $B$ satisfy it.

  - id: lc13-2-x-intercept
    section: '13.2'
    tier: F
    refs: ['2.2']
    statement: 'Find where the line $3x + 4y = 12$ crosses the $x$-axis.'
    answer_label: 'The x-intercept'
    check: {kind: solve, equation: '3*x + 4*0 = 12', variable: x, answer: '4'}
    answer_text: >-
      On the $x$-axis, $y = 0$. Then $3x = 12$, so $x = 4$. The line crosses at
      $(4, 0)$.

  - id: lc13-2-taxi
    section: '13.2'
    tier: F
    refs: ['2.2']
    statement: >-
      A taxi charges a fixed €3.50 plus €2 for each kilometre. Write an
      equation for the fare $y$ for $x$ kilometres, and find the fare for
      $7$ km.
    answer_label: 'The equation and the fare'
    check: {kind: evaluate, expression: '2*7 + 3.5', answer: '17.5'}
    answer_text: >-
      The fixed charge is the intercept and the rate is the slope, so
      $y = 2x + 3.5$. For $7$ km, $y = 2 \times 7 + 3.5 = €17.50$.

  - id: lc13-2-negative-slope
    section: '13.2'
    tier: F
    refs: ['2.2']
    statement: 'Find the equation of the line with slope $-3$ through $(-2, 5)$.'
    answer_label: 'The equation'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '5 - (-3)*(-2)', answer: '-1'}
        - {kind: evaluate, expression: '-3*1 - 1', answer: '-4'}
    answer_text: >-
      $y - 5 = -3(x + 2)$, so $y = -3x - 1$. Watch the sign: $x - (-2)$ is
      $x + 2$, and the intercept is $-1$, not $5$.

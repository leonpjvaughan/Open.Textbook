# Practice set for 12.1 (strand 2, outcome 2.3). Every ratio here is a real
# computation, so `approx` compares the arithmetic against the claimed decimal with a
# stated tolerance. The exact values (tan 45) use `evaluate`, and the one explanation
# uses `structured`. The ratios themselves are not in the Formulae and Tables booklet,
# so no record declares a `plays`.
chapter: 12
problems:
  - id: lc12-1-hypotenuse
    section: '12.1'
    tier: F
    refs: ['2.3']
    statement: >-
      In a right triangle the angle $\theta = 35^\circ$ and the side opposite it is
      $7$ cm. Find the hypotenuse, correct to two decimal places.
    answer_label: 'The hypotenuse'
    check:
      kind: approx
      value: '7 / sin(35 * pi / 180)'
      target: '12.20'
      tolerance: '0.01'
    answer_text: |-
      The sides involved are the opposite and the hypotenuse, so use sine:

      $$\sin 35^\circ = \frac{7}{h} \quad\Rightarrow\quad h = \frac{7}{\sin 35^\circ} = 12.20 \text{ cm}$$

      The hypotenuse is longer than the opposite side, which is a useful check.

  - id: lc12-1-opposite
    section: '12.1'
    tier: F
    refs: ['2.3']
    statement: >-
      A right triangle has hypotenuse $12$ m and an angle of $40^\circ$. Find the side
      opposite that angle, correct to two decimal places.
    answer_label: 'The opposite side'
    check:
      kind: approx
      value: '12 * sin(40 * pi / 180)'
      target: '7.71'
      tolerance: '0.01'
    answer_text: |-
      The opposite and the hypotenuse give the sine ratio:

      $$x = 12 \sin 40^\circ = 7.71 \text{ m}$$

      The opposite side is shorter than the hypotenuse, as it must be.

  - id: lc12-1-adjacent
    section: '12.1'
    tier: F
    refs: ['2.3']
    statement: >-
      A right triangle has hypotenuse $15$ cm and an angle of $25^\circ$. Find the side
      adjacent to that angle, correct to two decimal places.
    answer_label: 'The adjacent side'
    check:
      kind: approx
      value: '15 * cos(25 * pi / 180)'
      target: '13.59'
      tolerance: '0.01'
    answer_text: |-
      The adjacent and the hypotenuse give the cosine ratio:

      $$x = 15 \cos 25^\circ = 13.59 \text{ cm}$$

      The angle is small, so the adjacent side is close to the full hypotenuse.

  - id: lc12-1-angle
    section: '12.1'
    tier: F
    refs: ['2.3']
    statement: >-
      In a right triangle the side opposite $\theta$ is $5$ cm and the side adjacent to
      $\theta$ is $8$ cm. Find $\theta$, correct to one decimal place.
    answer_label: 'The angle theta'
    check:
      kind: approx
      value: 'atan(5 / 8) * 180 / pi'
      target: '32.0'
      tolerance: '0.05'
    answer_text: |-
      The two known sides are the opposite and the adjacent, so use tangent:

      $$\tan\theta = \frac{5}{8} = 0.625 \quad\Rightarrow\quad \theta = \tan^{-1}(0.625) = 32.0^\circ$$

      The opposite side is shorter than the adjacent side, so the angle is less than
      $45^\circ$. The answer fits.

  - id: lc12-1-tan-45
    section: '12.1'
    tier: F
    refs: ['2.3']
    statement: 'Write down the exact value of $\tan 45^\circ$.'
    answer_label: '$\tan 45^\circ$'
    check: {kind: evaluate, expression: 'tan(pi / 4)', answer: '1'}
    answer_text: >-
      At $45^\circ$ the opposite and the adjacent sides are equal, so their ratio is
      $1$. No calculator is needed.

  - id: lc12-1-cliff
    section: '12.1'
    tier: F
    refs: ['2.3']
    statement: >-
      A Coast Guard station stands on a cliff $60$ m above the sea. The angle of
      depression from the station to a marker buoy at sea level is $9^\circ$. Find the
      horizontal distance from the foot of the cliff to the buoy, correct to one
      decimal place.
    answer_label: 'The horizontal distance'
    check:
      kind: approx
      value: '60 / tan(9 * pi / 180)'
      target: '378.8'
      tolerance: '0.1'
    answer_text: |-
      The angle of depression equals the angle at the top of the cliff inside the
      triangle, because the two are alternate angles. The known sides are the height
      and the horizontal distance, which are the opposite and the adjacent.

      $$\tan 9^\circ = \frac{60}{x} \quad\Rightarrow\quad x = \frac{60}{\tan 9^\circ} = 378.8 \text{ m}$$

      The distance is much larger than the height, which fits a shallow angle.

  - id: lc12-1-choose-ratio
    section: '12.1'
    tier: F
    refs: ['2.3']
    statement: >-
      Explain how to choose which trigonometric ratio to use when you know one side and
      one angle of a right triangle.
    answer_label: 'Choosing the ratio'
    check:
      kind: structured
      requires: [name-sides, pick-ratio]
      concepts: [sohcahtoa]
      points:
        - id: name-sides
          text: >-
            Mark the angle, then name the side you know and the side you want as the
            opposite, the adjacent or the hypotenuse.
          concepts: [sohcahtoa]
        - id: pick-ratio
          text: >-
            Choose the ratio that contains both of those sides: opposite over
            hypotenuse is sine, adjacent over hypotenuse is cosine, and opposite over
            adjacent is tangent.
          concepts: [sohcahtoa]
    answer_text: >-
      Mark the angle first, then name the two sides that matter — the one you know and
      the one you want. Choose the ratio that contains both.

      Opposite and hypotenuse give sine. Adjacent and hypotenuse give cosine. Opposite
      and adjacent give tangent. The three initials spell SOH CAH TOA.

  - id: lc12-1-higher
    section: '12.1'
    tier: H
    refs: ['2.3']
    statement: >-
      In a right triangle the angle is $62^\circ$ and the side adjacent to it is $9$ cm.
      Find the side opposite the angle and the hypotenuse, each correct to two decimal
      places.
    answer_label: 'The opposite side, then the hypotenuse'
    check:
      kind: all
      checks:
        - {kind: approx, value: '9 * tan(62 * pi / 180)', target: '16.93', tolerance: '0.01'}
        - {kind: approx, value: '9 / cos(62 * pi / 180)', target: '19.17', tolerance: '0.01'}
    answer_text: |-
      The opposite and the adjacent give tangent:

      $$x = 9 \tan 62^\circ = 16.93 \text{ cm}$$

      The adjacent and the hypotenuse give cosine:

      $$h = \frac{9}{\cos 62^\circ} = 19.17 \text{ cm}$$

      The angle is steep, so the opposite side is longer than the adjacent side, and the
      hypotenuse is the longest side of all.

# Practice set for 8.5 (strand 5, outcome 5.2, Higher). A substitution is not an
# equivalence of expressions, so each integral is checked with `kind: apply` and
# `op: integrate`: the verifier proves the stated answer is an antiderivative, which
# is exactly what a substitution is meant to produce. The method itself is shown in
# the answer text, and a definite integral is evaluated exactly over its new limits.
chapter: 8
symbols:
  x: {real: true}
  t: {real: true}
problems:
  - id: lc8-5-quadratic-inside
    section: '8.5'
    tier: H
    refs: ['5.2']
    statement: 'Find $\displaystyle\int 2x(x^2 + 1)^3\,dx$.'
    answer_label: 'The integral'
    plays: integral-power
    check:
      kind: apply
      expression: '2*x*(x**2 + 1)**3'
      apply: {op: integrate, args: [x]}
      answer: '(x**2 + 1)**4/4'
      variable: x
    steps:
      - expr: '2*x*(x**2 + 1)**3'
      - expr: '(x**2 + 1)**4/4'
        relation: apply
        apply: {op: integrate, args: [x]}
    answer_text: >-
      Let $u = x^2 + 1$. Then $\dfrac{du}{dx} = 2x$, so $du = 2x\,dx$, which is exactly
      the rest of the integrand:

      $$\int 2x(x^2 + 1)^3\,dx = \int u^3\,du = \frac{u^4}{4} + C
      = \frac{(x^2 + 1)^4}{4} + C$$

      Check by differentiating: the chain rule brings back $2x$ and the cube.

  - id: lc8-5-linear-inside
    section: '8.5'
    tier: H
    refs: ['5.2']
    statement: 'Find $\displaystyle\int 6x(3x^2 + 1)^2\,dx$.'
    answer_label: 'The integral'
    plays: integral-power
    check:
      kind: apply
      expression: '6*x*(3*x**2 + 1)**2'
      apply: {op: integrate, args: [x]}
      answer: '(3*x**2 + 1)**3/3'
      variable: x
    answer_text: >-
      Let $u = 3x^2 + 1$. Then $du = 6x\,dx$, so

      $$\int 6x(3x^2 + 1)^2\,dx = \int u^2\,du = \frac{u^3}{3} + C
      = \frac{(3x^2 + 1)^3}{3} + C$$

  - id: lc8-5-power-of-linear
    section: '8.5'
    tier: H
    refs: ['5.2']
    statement: 'Find $\displaystyle\int (2x + 1)^5\,dx$.'
    answer_label: 'The integral'
    plays: integral-power
    check:
      kind: apply
      expression: '(2*x + 1)**5'
      apply: {op: integrate, args: [x]}
      answer: '(2*x + 1)**6/12'
      variable: x
    answer_text: >-
      Let $u = 2x + 1$. Then $du = 2\,dx$, so $dx = \dfrac{1}{2}du$:

      $$\int (2x + 1)^5\,dx = \frac{1}{2}\int u^5\,du = \frac{1}{2} \times \frac{u^6}{6} + C
      = \frac{(2x + 1)^6}{12} + C$$

      The factor $\dfrac{1}{2}$ is the one that balances $du = 2\,dx$. Leaving it out
      is the usual error.

  - id: lc8-5-definite
    section: '8.5'
    tier: H
    refs: ['5.2']
    statement: 'Evaluate $\displaystyle\int_0^1 2x(x^2 + 1)^3\,dx$.'
    answer_label: 'The value of the integral'
    plays: integral-power
    check:
      kind: apply
      expression: '2*x*(x**2 + 1)**3'
      apply: {op: integrate, args: [x, '0', '1']}
      answer: '15/4'
    answer_text: >-
      With $u = x^2 + 1$ the limits change too. When $x = 0$, $u = 1$; when $x = 1$,
      $u = 2$. Then

      $$\int_0^1 2x(x^2 + 1)^3\,dx = \int_1^2 u^3\,du
      = \left[\frac{u^4}{4}\right]_1^2 = 4 - \frac{1}{4} = \frac{15}{4}$$

      Change the limits at the same time as the variable, and you never need to
      substitute back.

  - id: lc8-5-sine
    section: '8.5'
    tier: H
    refs: ['5.2']
    statement: 'Find $\displaystyle\int \sin 3x\,dx$ by substituting $u = 3x$.'
    answer_label: 'The integral'
    plays: integral-sin
    check:
      kind: apply
      expression: 'sin(3*x)'
      apply: {op: integrate, args: [x]}
      answer: '-cos(3*x)/3'
      variable: x
    answer_text: >-
      Let $u = 3x$, so $du = 3\,dx$ and $dx = \dfrac{1}{3}du$:

      $$\int \sin 3x\,dx = \frac{1}{3}\int \sin u\,du = -\frac{1}{3}\cos u + C
      = -\frac{1}{3}\cos 3x + C$$

  - id: lc8-5-surd
    section: '8.5'
    tier: H
    refs: ['5.2']
    statement: 'Find $\displaystyle\int x\sqrt{x^2 + 4}\,dx$.'
    answer_label: 'The integral'
    plays: integral-power
    check:
      kind: apply
      expression: 'x*sqrt(x**2 + 4)'
      apply: {op: integrate, args: [x]}
      answer: '(x**2 + 4)**(3/2)/3'
      variable: x
    answer_text: >-
      Let $u = x^2 + 4$. Then $du = 2x\,dx$, so $x\,dx = \dfrac{1}{2}du$, and
      $\sqrt{x^2 + 4} = u^{1/2}$:

      $$\int x\sqrt{x^2 + 4}\,dx = \frac{1}{2}\int u^{1/2}\,du
      = \frac{1}{2} \times \frac{2}{3}u^{3/2} + C = \frac{1}{3}(x^2 + 4)^{3/2} + C$$

  - id: lc8-5-second-tank
    section: '8.5'
    tier: H
    refs: ['5.2']
    statement: >-
      A second tank fills at a rate $r(t) = 4t(t^2 + 1)^3$ litres per minute. Find the
      volume that enters between $t = 0$ and $t = 1$ minute.
    answer_label: 'The volume collected'
    plays: integral-power
    check:
      kind: apply
      expression: '4*t*(t**2 + 1)**3'
      apply: {op: integrate, args: [t, '0', '1']}
      answer: '15/2'
    answer_text: >-
      Let $u = t^2 + 1$. Then $du = 2t\,dt$, so $4t\,dt = 2\,du$. The limits become
      $u = 1$ at $t = 0$ and $u = 2$ at $t = 1$:

      $$\int_0^1 4t(t^2 + 1)^3\,dt = 2\int_1^2 u^3\,du
      = 2\left[\frac{u^4}{4}\right]_1^2 = 2\left(4 - \frac{1}{4}\right) = \frac{15}{2}$$

      The second tank collects $7.5$ litres. This returns to the chapter problem: both
      tanks collect water, but only the second needs a substitution.

  - id: lc8-5-how
    section: '8.5'
    tier: H
    refs: ['5.2']
    statement: >-
      Explain how to recognise an integral that can be done by substitution, and what
      to do with the limits of a definite integral.
    answer_label: 'How substitution works'
    check:
      kind: structured
      requires: [recognise, convert, limits]
      concepts: [inner-function, du-replaces-dx, change-limits]
      points:
        - id: recognise
          text: >-
            look for an inner function and, next to it, a multiple of its derivative
          concepts: [inner-function]
        - id: convert
          text: >-
            let u be the inner function, work out du, and replace the whole integrand
            and dx with an expression in u
          concepts: [du-replaces-dx]
        - id: limits
          text: >-
            for a definite integral, change the limits to the values of u at the two
            ends, so you never substitute back
          concepts: [change-limits]
    answer_text: >-
      Look for a function inside another one, and next to it a multiple of the
      derivative of that inner function. For example, in $2x(x^2 + 1)^3$ the inner
      function is $x^2 + 1$, and $2x$ is its derivative.

      Let $u$ be the inner function and work out $du$. Then replace the whole
      integrand and $dx$ with expressions in $u$, and integrate in $u$.

      For a definite integral, change the limits as well. When $x = a$, work out the
      value of $u$; when $x = b$, work out the other value. Integrate between the new
      limits, and you never need to substitute back to $x$.

# Practice set for 18.4, perpendicularity and the angle between vectors.
#
# The test for a right angle is a zero dot product, checked with `op: dot`. A special
# angle is exact and is checked with `evaluate`; a general angle is irrational, so it is
# compared in degrees with `approx` and a stated tolerance.
chapter: 18
symbols:
  k: {real: true}
problems:
  - id: lc18-4-test
    section: '18.4'
    tier: O
    refs: ['2.2']
    statement: >-
      Show that $\begin{pmatrix} 1 \\ 2 \end{pmatrix}$ and
      $\begin{pmatrix} 2 \\ -1 \end{pmatrix}$ are perpendicular.
    answer_label: 'The dot product'
    check:
      kind: vector
      op: dot
      args: ["Matrix([1, 2])", "Matrix([2, -1])"]
      answer: "0"
    answer_text: >-
      $1 \times 2 + 2 \times (-1) = 2 - 2 = 0$. The dot product is zero, so the two
      vectors are perpendicular.

  - id: lc18-4-angle-right
    section: '18.4'
    tier: O
    refs: ['2.2']
    statement: 'Find the angle between $\begin{pmatrix} 1 \\ 0 \end{pmatrix}$ and $\begin{pmatrix} 0 \\ 1 \end{pmatrix}$.'
    answer_label: 'The angle in degrees'
    check:
      kind: evaluate
      expression: "acos(0) * 180 / pi"
      answer: "90"
    answer_text: >-
      $\cos\theta = \dfrac{1 \times 0 + 0 \times 1}{1 \times 1} = 0$, so
      $\theta = 90^\circ$. The two vectors point along the axes and meet at a right
      angle.

  - id: lc18-4-angle-45
    section: '18.4'
    tier: O
    refs: ['2.2']
    statement: 'Find the angle between $\begin{pmatrix} 1 \\ 0 \end{pmatrix}$ and $\begin{pmatrix} 1 \\ 1 \end{pmatrix}$.'
    answer_label: 'The angle in degrees'
    check:
      kind: evaluate
      expression: "acos(sqrt(2)/2) * 180 / pi"
      answer: "45"
    answer_text: >-
      The dot product is $1 \times 1 + 0 \times 1 = 1$. The lengths are $1$ and
      $\sqrt{2}$, so $\cos\theta = \dfrac{1}{\sqrt{2}}$ and $\theta = 45^\circ$.

  - id: lc18-4-angle-60
    section: '18.4'
    tier: O
    refs: ['2.2']
    statement: >-
      Find the angle between $\begin{pmatrix} 1 \\ 0 \end{pmatrix}$ and
      $\begin{pmatrix} 1 \\ \sqrt{3} \end{pmatrix}$.
    answer_label: 'The angle in degrees'
    check:
      kind: evaluate
      expression: "acos(1/2) * 180 / pi"
      answer: "60"
    answer_text: >-
      The dot product is $1$. The lengths are $1$ and $\sqrt{1 + 3} = 2$, so
      $\cos\theta = \dfrac{1}{2}$ and $\theta = 60^\circ$.

  - id: lc18-4-angle-general
    section: '18.4'
    tier: O
    refs: ['2.2']
    statement: >-
      Find the angle between $\begin{pmatrix} 2 \\ 3 \end{pmatrix}$ and
      $\begin{pmatrix} 1 \\ 4 \end{pmatrix}$, to one decimal place.
    answer_label: 'The angle in degrees'
    check:
      kind: approx
      value: "acos(14 / (sqrt(13) * sqrt(17))) * 180 / pi"
      target: "19.65"
      tolerance: "0.05"
    answer_text: >-
      The dot product is $2 \times 1 + 3 \times 4 = 14$. The lengths are $\sqrt{13}$ and
      $\sqrt{17}$, so
      $\cos\theta = \dfrac{14}{\sqrt{13}\sqrt{17}} = 0.9418$ to four decimal places.
      Then $\theta = 19.7^\circ$ to one decimal place.

  - id: lc18-4-unknown
    section: '18.4'
    tier: O
    refs: ['2.2']
    statement: >-
      Find $k$ so that $\begin{pmatrix} k \\ 2 \end{pmatrix}$ is perpendicular to
      $\begin{pmatrix} 3 \\ -1 \end{pmatrix}$.
    answer_label: 'The value of $k$'
    check:
      kind: solve
      equation: "k*3 + 2*(-1) = 0"
      variable: k
      answer: ["2/3"]
    answer_text: >-
      Set the dot product to zero: $3k - 2 = 0$, so $k = \dfrac{2}{3}$.
      Check: $\dfrac{2}{3} \times 3 + 2 \times (-1) = 2 - 2 = 0$.

  - id: lc18-4-right-triangle
    section: '18.4'
    tier: O
    refs: ['2.2']
    statement: >-
      The points are $A(0, 0)$, $B(3, 4)$ and $C(7, 1)$. Show that the angle at $B$ is a
      right angle.
    answer_label: 'The dot product at $B$'
    check:
      kind: all
      checks:
        - kind: vector
          op: subtract
          args: ["Matrix([3, 4])", "Matrix([0, 0])"]
          answer: "Matrix([3, 4])"
        - kind: vector
          op: subtract
          args: ["Matrix([7, 1])", "Matrix([3, 4])"]
          answer: "Matrix([4, -3])"
        - kind: vector
          op: dot
          args: ["Matrix([3, 4])", "Matrix([4, -3])"]
          answer: "0"
    answer_text: >-
      At $B$ the two sides are $\vec{BA} = \begin{pmatrix} 0 - 3 \\ 0 - 4 \end{pmatrix}
      = \begin{pmatrix} -3 \\ -4 \end{pmatrix}$ and
      $\vec{BC} = \begin{pmatrix} 7 - 3 \\ 1 - 4 \end{pmatrix}
      = \begin{pmatrix} 4 \\ -3 \end{pmatrix}$. Their dot product is
      $(-3)(4) + (-4)(-3) = -12 + 12 = 0$, so the angle at $B$ is a right angle.
      Using $\vec{AB} = \begin{pmatrix} 3 \\ 4 \end{pmatrix}$ instead gives the same
      zero, because the sign of a vector does not change the angle.

  - id: lc18-4-perpendicularity-test
    section: '18.4'
    tier: O
    refs: ['2.2']
    statement: >-
      Explain how the dot product tests two vectors for perpendicularity, and why the
      test works.
    answer_label: 'The perpendicularity test'
    check:
      kind: structured
      requires: [zero, cosine, right-angle]
      concepts: [dot-product-zero, cosine-of-90, right-angle-means-90]
      points:
        - id: zero
          text: two non-zero vectors are perpendicular exactly when their dot product is zero
          concepts: [dot-product-zero]
        - id: cosine
          text: the dot product equals the product of the lengths times the cosine of the angle
          concepts: [cosine-of-90]
        - id: right-angle
          text: a right angle has cosine zero, so the dot product vanishes
          concepts: [right-angle-means-90]
    answer_text: >-
      Two non-zero vectors are perpendicular exactly when their dot product is zero.
      The test works because $\mathbf{a} \cdot \mathbf{b}
      = |\mathbf{a}||\mathbf{b}|\cos\theta$. The lengths are not zero, so the dot product
      is zero exactly when $\cos\theta = 0$, and that happens at $\theta = 90^\circ$.

# Practice set for 14.4 (strand 2, outcome 2.4). sympy proves the coordinate
# arithmetic: scaling about the origin is scalar multiplication of the point, scaling
# about a general centre is the displacement rule, and the area effect is proved as the
# square of the scale factor. Exact fractions are used, never rounded decimals.
chapter: 14
problems:
  - id: lc14-4-enlarge-origin
    section: '14.4'
    tier: O
    refs: ['2.4']
    statement: 'Enlarge the point $(2,3)$ by scale factor $2$ about the origin.'
    answer_label: 'Image about the origin'
    check: {kind: evaluate, expression: '2 * Matrix([2, 3])', answer: 'Matrix([4, 6])'}
    answer_text: '$(4,6)$: multiply both coordinates by the scale factor.'

  - id: lc14-4-enlarge-fraction
    section: '14.4'
    tier: O
    refs: ['2.4']
    statement: 'Enlarge the point $(6,3)$ by scale factor $\frac{1}{2}$ about the origin.'
    answer_label: 'Image about the origin'
    check: {kind: evaluate, expression: 'Matrix([6, 3]) / 2', answer: 'Matrix([3, 3/2])'}
    answer_text: '$(3,1.5)$: a scale factor between 0 and 1 makes the image smaller.'

  - id: lc14-4-enlarge-centre
    section: '14.4'
    tier: O
    refs: ['2.4']
    statement: 'Enlarge the point $(5,4)$ by scale factor $2$ about the centre $C(1,1)$.'
    answer_label: 'Image about $C(1,1)$'
    check:
      kind: evaluate
      expression: 'Matrix([1, 1]) + 2 * (Matrix([5, 4]) - Matrix([1, 1]))'
      answer: 'Matrix([9, 7])'
    answer_text: >-
      $(9,7)$: use $(x,y) \to (a + k(x-a),\; b + k(y-b))$ with $a = 1$, $b = 1$ and
      $k = 2$.

  - id: lc14-4-area-double
    section: '14.4'
    tier: O
    refs: ['2.4']
    statement: 'A shape has area $20$ cm². It is enlarged by scale factor $2$. Find the area of the image.'
    answer_label: 'Area of the image'
    check: {kind: evaluate, expression: '20 * 2**2', answer: '80'}
    answer_text: 'The area factor is $k^2 = 4$, so the image has area $20 \times 4 = 80$ cm².'

  - id: lc14-4-enlarge-triangle
    section: '14.4'
    tier: O
    refs: ['2.4']
    statement: >-
      Enlarge the triangle with corners $(1,1)$, $(4,1)$ and $(1,3)$ by scale factor $3$
      about the origin, and give all three image corners.
    answer_label: 'Image of the triangle'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '3 * Matrix([1, 1])', answer: 'Matrix([3, 3])'}
        - {kind: evaluate, expression: '3 * Matrix([4, 1])', answer: 'Matrix([12, 3])'}
        - {kind: evaluate, expression: '3 * Matrix([1, 3])', answer: 'Matrix([3, 9])'}
    answer_text: '$(3,3)$, $(12,3)$ and $(3,9)$: every corner is multiplied by 3.'

  - id: lc14-4-area-shrink
    section: '14.4'
    tier: O
    refs: ['2.4']
    statement: >-
      A shape has area $45$ cm². After an enlargement its image has area $5$ cm². Find
      the positive scale factor.
    answer_label: 'Scale factor'
    check: {kind: evaluate, expression: 'sqrt(5 / 45)', answer: '1/3'}
    answer_text: >-
      The area factor is $\frac{5}{45} = \frac{1}{9}$, so $k = \sqrt{\frac{1}{9}} =
      \frac{1}{3}$. A scale factor between 0 and 1 makes the image smaller.

  - id: lc14-4-area-quarter
    section: '14.4'
    tier: O
    refs: ['2.4']
    statement: 'A shape has area $12$ cm². Find the area of its image after an enlargement by scale factor $\frac{1}{2}$.'
    answer_label: 'Area of the image'
    check: {kind: evaluate, expression: '12 * (1/2)**2', answer: '3'}
    answer_text: 'The area factor is $\left(\frac{1}{2}\right)^2 = \frac{1}{4}$, so the area is $12 \times \frac{1}{4} = 3$ cm².'

  - id: lc14-4-enlarge-fraction-centre
    section: '14.4'
    tier: O
    refs: ['2.4']
    statement: 'Enlarge the point $(3,7)$ by scale factor $\frac{1}{2}$ about the centre $C(1,3)$.'
    answer_label: 'Image about $C(1,3)$'
    check:
      kind: evaluate
      expression: 'Matrix([1, 3]) + (1/2) * (Matrix([3, 7]) - Matrix([1, 3]))'
      answer: 'Matrix([2, 5])'
    answer_text: >-
      $(2,5)$: the displacement from $C$ is $(2,4)$, and halving it gives $(1,2)$.

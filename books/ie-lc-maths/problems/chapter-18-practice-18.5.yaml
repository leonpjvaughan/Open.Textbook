# Practice set for 18.5, vectors in three dimensions.
#
# A three-dimensional vector is a column of three numbers, and every operation from the
# two-dimensional sections carries over unchanged. A length uses the three-dimensional
# norm; an angle is compared in degrees with `approx`.
chapter: 18
problems:
  - id: lc18-5-displacement
    section: '18.5'
    tier: H
    refs: ['2.2']
    statement: 'Write the displacement from $P(1, 0, 2)$ to $Q(4, 3, -2)$ as a column vector.'
    answer_label: 'The displacement $\vec{PQ}$'
    check:
      kind: vector
      op: subtract
      args: ["Matrix([4, 3, -2])", "Matrix([1, 0, 2])"]
      answer: "Matrix([3, 3, -4])"
    answer_text: >-
      Subtract each coordinate of $P$ from the matching coordinate of $Q$:
      $\vec{PQ} = \begin{pmatrix} 4 - 1 \\ 3 - 0 \\ -2 - 2 \end{pmatrix}
      = \begin{pmatrix} 3 \\ 3 \\ -4 \end{pmatrix}$. The negative third component means
      the displacement is downwards.

  - id: lc18-5-magnitude
    section: '18.5'
    tier: H
    refs: ['2.2']
    statement: 'Find the length of $\begin{pmatrix} 3 \\ 4 \\ 12 \end{pmatrix}$.'
    answer_label: 'The length'
    check:
      kind: vector
      op: norm
      args: ["Matrix([3, 4, 12])"]
      answer: "13"
    answer_text: >-
      $|\mathbf{a}| = \sqrt{3^2 + 4^2 + 12^2} = \sqrt{9 + 16 + 144} = \sqrt{169} = 13$.
      The third component is squared with the other two, exactly as the two-dimensional
      formula squares its two.

  - id: lc18-5-add
    section: '18.5'
    tier: H
    refs: ['2.2']
    statement: >-
      Add $\begin{pmatrix} 1 \\ -2 \\ 3 \end{pmatrix}$ and
      $\begin{pmatrix} 2 \\ 2 \\ -5 \end{pmatrix}$.
    answer_label: 'The sum'
    check:
      kind: vector
      op: add
      args: ["Matrix([1, -2, 3])", "Matrix([2, 2, -5])"]
      answer: "Matrix([3, 0, -2])"
    answer_text: >-
      Add each row: $(1 + 2)\mathbf{i} + (-2 + 2)\mathbf{j} + (3 - 5)\mathbf{k}
      = 3\mathbf{i} - 2\mathbf{k}$. The middle component cancels to zero, so there is no
      $\mathbf{j}$ term in the answer.

  - id: lc18-5-dot
    section: '18.5'
    tier: H
    refs: ['2.2']
    statement: >-
      Work out $\begin{pmatrix} 1 \\ 2 \\ 3 \end{pmatrix} \cdot
      \begin{pmatrix} 4 \\ -1 \\ 2 \end{pmatrix}$.
    answer_label: 'The dot product'
    check:
      kind: vector
      op: dot
      args: ["Matrix([1, 2, 3])", "Matrix([4, -1, 2])"]
      answer: "8"
    answer_text: >-
      Multiply matching components and add all three products:
      $1 \times 4 + 2 \times (-1) + 3 \times 2 = 4 - 2 + 6 = 8$.

  - id: lc18-5-perpendicular
    section: '18.5'
    tier: H
    refs: ['2.2']
    statement: >-
      Show that $\begin{pmatrix} 1 \\ 2 \\ 3 \end{pmatrix}$ and
      $\begin{pmatrix} 1 \\ 1 \\ -1 \end{pmatrix}$ are perpendicular.
    answer_label: 'The dot product'
    check:
      kind: vector
      op: dot
      args: ["Matrix([1, 2, 3])", "Matrix([1, 1, -1])"]
      answer: "0"
    answer_text: >-
      $1 \times 1 + 2 \times 1 + 3 \times (-1) = 1 + 2 - 3 = 0$. The dot product is
      zero, so the two three-dimensional vectors meet at a right angle.

  - id: lc18-5-angle
    section: '18.5'
    tier: H
    refs: ['2.2']
    statement: >-
      Find the angle between $\begin{pmatrix} 1 \\ 0 \\ 0 \end{pmatrix}$ and
      $\begin{pmatrix} 1 \\ 1 \\ 1 \end{pmatrix}$, to one decimal place.
    answer_label: 'The angle in degrees'
    check:
      kind: approx
      value: "acos(1 / sqrt(3)) * 180 / pi"
      target: "54.74"
      tolerance: "0.05"
    answer_text: >-
      The dot product is $1$. The lengths are $1$ and $\sqrt{3}$, so
      $\cos\theta = \dfrac{1}{\sqrt{3}} = 0.5774$ to four decimal places. Then
      $\theta = 54.7^\circ$ to one decimal place.

  - id: lc18-5-magnitude-reason
    section: '18.5'
    tier: H
    refs: ['2.2']
    statement: >-
      Explain why the length of $\begin{pmatrix} x \\ y \\ z \end{pmatrix}$ is
      $\sqrt{x^2 + y^2 + z^2}$, and not $x + y + z$.
    answer_label: 'Why the three squares are added'
    check:
      kind: structured
      requires: [pythagoras, twice, squares]
      concepts: [pythagoras-in-space, three-dimensions, add-squares]
      points:
        - id: pythagoras
          text: the length in a flat plane is found with Pythagoras' theorem
          concepts: [pythagoras-in-space]
        - id: twice
          text: in three dimensions Pythagoras is used twice, first in the base and then up the third direction
          concepts: [three-dimensions]
        - id: squares
          text: the squares of the three components are added, never the components themselves
          concepts: [add-squares]
    answer_text: >-
      In a flat plane the length of $\begin{pmatrix} x \\ y \end{pmatrix}$ is
      $\sqrt{x^2 + y^2}$ by Pythagoras' theorem. In three dimensions the same theorem is
      used twice: once across the base to get $\sqrt{x^2 + y^2}$, and again with the
      height $z$. That gives $\sqrt{\left(\sqrt{x^2 + y^2}\right)^2 + z^2}
      = \sqrt{x^2 + y^2 + z^2}$. The squares are added, because each component is a
      perpendicular step.

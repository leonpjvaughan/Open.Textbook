# Practice set for 1.5 (strand 3, outcome 3.2). The laws of indices are exact
# identities, so sympy proves every one by equivalence, including the symbolic
# cases with declared real assumptions.
chapter: 1
symbols:
  x: {real: true}
  y: {real: true}
problems:
  - id: lc1-5-product
    section: '1.5'
    tier: F
    refs: ['3.2']
    statement: 'Simplify $2^3 \times 2^4$ by writing it as a single power of $2$.'
    answer_label: '$2^3 \times 2^4$ as a power'
    check: {kind: evaluate, expression: '2**3 * 2**4', answer: '2**7'}
    answer_text: >-
      The bases are the same, so add the indices:

      $$2^3 \times 2^4 = 2^{3+4} = 2^7$$

      $2^7 = 128$.

  - id: lc1-5-quotient
    section: '1.5'
    tier: F
    refs: ['3.2']
    statement: 'Simplify $3^5 \div 3^2$.'
    answer_label: '$3^5 \div 3^2$'
    check: {kind: evaluate, expression: '3**5 / 3**2', answer: '3**3'}
    answer_text: >-
      $$3^5 \div 3^2 = 3^{5-2} = 3^3 = 27$$

      Dividing powers of the same base subtracts the indices.

  - id: lc1-5-power
    section: '1.5'
    tier: F
    refs: ['3.2']
    statement: 'Simplify $(2^3)^2$.'
    answer_label: '$(2^3)^2$'
    check: {kind: evaluate, expression: '(2**3)**2', answer: '2**6'}
    answer_text: >-
      A power of a power multiplies the indices:

      $$(2^3)^2 = 2^{3 \times 2} = 2^6 = 64$$

  - id: lc1-5-zero
    section: '1.5'
    tier: F
    refs: ['3.2']
    statement: 'Write down the value of $5^0$.'
    answer_label: '$5^0$'
    check: {kind: evaluate, expression: '5**0', answer: '1'}
    answer_text: >-
      $5^0 = 1$. Any non-zero number raised to the power $0$ is $1$.

      It follows from the quotient rule: $5^2 \div 5^2 = 5^{2-2} = 5^0$, and
      $5^2 \div 5^2 = 1$.

  - id: lc1-5-negative
    section: '1.5'
    tier: F
    refs: ['3.2']
    statement: 'Write down the value of $2^{-3}$ as a fraction.'
    answer_label: '$2^{-3}$'
    check: {kind: evaluate, expression: '2**-3', answer: '1/8'}
    answer_text: >-
      A negative index means the reciprocal:

      $$2^{-3} = \frac{1}{2^3} = \frac{1}{8}$$

  - id: lc1-5-symbolic
    section: '1.5'
    tier: F
    refs: ['3.2']
    statement: 'Simplify $x^3 \times x^5$.'
    answer_label: '$x^3 \times x^5$'
    plays: index-product
    check: {kind: evaluate, expression: 'x**3 * x**5', answer: 'x**8'}
    answer_text: >-
      The bases are the same, so add the indices:

      $$x^3 \times x^5 = x^{3+5} = x^8$$

      The rule works for a letter just as it works for a number.

  - id: lc1-5-fractional
    section: '1.5'
    tier: H
    refs: ['3.2']
    statement: 'Work out $27^{2/3}$.'
    answer_label: '$27^{2/3}$'
    check: {kind: evaluate, expression: '27**(2/3)', answer: '9'}
    answer_text: >-
      The index $\frac{2}{3}$ means the cube root, then squared:

      $$27^{2/3} = \left(\sqrt[3]{27}\right)^2 = 3^2 = 9$$

      Take the root first, then the power. The root of $27$ is a whole number,
      which keeps the arithmetic exact.

  - id: lc1-5-bracket
    section: '1.5'
    tier: H
    refs: ['3.2']
    statement: 'Simplify $(2x^3)^2$.'
    answer_label: '$(2x^3)^2$'
    plays: index-power-of-power
    check: {kind: evaluate, expression: '(2*x**3)**2', answer: '4*x**6'}
    answer_text: >-
      The power applies to every factor inside the bracket:

      $$(2x^3)^2 = 2^2 \times (x^3)^2 = 4x^6$$

      The coefficient is squared as well as the letter. Writing $2x^6$ misses the
      $2^2$.

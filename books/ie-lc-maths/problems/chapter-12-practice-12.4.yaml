# Practice set for 12.4 (strand 2, outcome 2.3). Every answer is an exact surd or
# fraction, so `evaluate` proves it symbolically. The exact values of 30, 45 and 60
# degrees are the ones the syllabus asks a candidate to work with in surd form; the
# Formulae and Tables booklet carries the identities that follow from them, but not the
# values themselves, so no record declares a `plays`.
chapter: 12
problems:
  - id: lc12-4-sin150
    section: '12.4'
    tier: O
    refs: ['2.3']
    statement: 'Find the exact value of $\sin 150^\circ$.'
    answer_label: '$\sin 150^\circ$'
    check: {kind: evaluate, expression: 'sin(150 * pi / 180)', answer: '1 / 2'}
    answer_text: >-
      $150^\circ$ lies in the second quadrant, where sine is positive. The reference angle
      is $180^\circ - 150^\circ = 30^\circ$, so

      $$\sin 150^\circ = \sin 30^\circ = \frac{1}{2}$$

  - id: lc12-4-cos150
    section: '12.4'
    tier: O
    refs: ['2.3']
    statement: 'Find the exact value of $\cos 150^\circ$.'
    answer_label: '$\cos 150^\circ$'
    check: {kind: evaluate, expression: 'cos(150 * pi / 180)', answer: '-sqrt(3) / 2'}
    answer_text: >-
      $150^\circ$ lies in the second quadrant, where cosine is negative. The reference
      angle is $30^\circ$, so

      $$\cos 150^\circ = -\cos 30^\circ = -\frac{\sqrt{3}}{2}$$

      The point is to the left of the origin, which is what the negative sign records.

  - id: lc12-4-sin210
    section: '12.4'
    tier: O
    refs: ['2.3']
    statement: 'Find the exact value of $\sin 210^\circ$.'
    answer_label: '$\sin 210^\circ$'
    check: {kind: evaluate, expression: 'sin(210 * pi / 180)', answer: '-1 / 2'}
    answer_text: >-
      $210^\circ$ lies in the third quadrant, where both coordinates are negative. The
      reference angle is $210^\circ - 180^\circ = 30^\circ$, so

      $$\sin 210^\circ = -\sin 30^\circ = -\frac{1}{2}$$

  - id: lc12-4-cos330
    section: '12.4'
    tier: O
    refs: ['2.3']
    statement: 'Find the exact value of $\cos 330^\circ$.'
    answer_label: '$\cos 330^\circ$'
    check: {kind: evaluate, expression: 'cos(330 * pi / 180)', answer: 'sqrt(3) / 2'}
    answer_text: >-
      $330^\circ$ lies in the fourth quadrant, where cosine is positive. The reference
      angle is $360^\circ - 330^\circ = 30^\circ$, so

      $$\cos 330^\circ = \cos 30^\circ = \frac{\sqrt{3}}{2}$$

  - id: lc12-4-tan120
    section: '12.4'
    tier: O
    refs: ['2.3']
    statement: 'Find the exact value of $\tan 120^\circ$.'
    answer_label: '$\tan 120^\circ$'
    check: {kind: evaluate, expression: 'tan(120 * pi / 180)', answer: '-sqrt(3)'}
    answer_text: >-
      $120^\circ$ lies in the second quadrant, where cosine is negative and sine is
      positive, so the tangent is negative. The reference angle is $60^\circ$, so

      $$\tan 120^\circ = -\tan 60^\circ = -\sqrt{3}$$

  - id: lc12-4-bearing
    section: '12.4'
    tier: O
    refs: ['2.3']
    statement: >-
      A bearing is measured clockwise from north. Write the bearing $330^\circ$ as an
      angle in standard position, then find its exact sine and cosine.
    answer_label: 'The standard angle, then its sine and cosine'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: 'sin(120 * pi / 180)', answer: 'sqrt(3) / 2'}
        - {kind: evaluate, expression: 'cos(120 * pi / 180)', answer: '-1 / 2'}
    answer_text: >-
      A bearing of $330^\circ$ points $30^\circ$ west of north. North is $90^\circ$ in
      standard position, so the standard angle is $90^\circ + 30^\circ = 120^\circ$.

      $$120^\circ \text{ lies in the second quadrant: } \sin 120^\circ = \frac{\sqrt{3}}{2}, \quad \cos 120^\circ = -\frac{1}{2}$$

      The negative cosine says the yacht lies to the west of the lighthouse.

  - id: lc12-4-quadrant-signs
    section: '12.4'
    tier: O
    refs: ['2.3']
    statement: >-
      Explain how to find the sine and cosine of an angle between $90^\circ$ and
      $360^\circ$ from its reference angle.
    answer_label: 'The method'
    check:
      kind: structured
      requires: [find-reference, apply-signs]
      concepts: [reference-angle]
      points:
        - id: find-reference
          text: >-
            Find the acute angle between the radius and the x-axis: subtract from 180 in
            the second quadrant, subtract 180 in the third, and subtract from 360 in the
            fourth.
          concepts: [reference-angle]
        - id: apply-signs
          text: >-
            Take the sine and cosine of that acute angle, then put the sign the quadrant
            gives: cosine is negative in the second and third quadrants, and sine is
            negative in the third and fourth.
          concepts: [reference-angle]
    answer_text: >-
      Find the **reference angle**, the acute angle between the radius and the $x$-axis.
      In the second quadrant it is $180^\circ - \theta$, in the third it is
      $\theta - 180^\circ$, and in the fourth it is $360^\circ - \theta$.

      The size of the sine and cosine is the same as for the reference angle. The
      quadrant decides the sign: cosine is negative in the second and third quadrants,
      and sine is negative in the third and fourth.

  - id: lc12-4-higher
    section: '12.4'
    tier: H
    refs: ['2.3']
    statement: >-
      Given that $\sin\theta = \dfrac{3}{5}$ and that $90^\circ < \theta < 180^\circ$,
      find $\cos\theta$ and $\tan\theta$.
    answer_label: '$\cos\theta$, then $\tan\theta$'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '-sqrt(1 - (3/5)**2)', answer: '-4 / 5'}
        - {kind: evaluate, expression: '(3/5) / (-4/5)', answer: '-3 / 4'}
    answer_text: >-
      From $\sin^2\theta + \cos^2\theta = 1$,

      $$\cos^2\theta = 1 - \frac{9}{25} = \frac{16}{25} \qquad \cos\theta = \pm\frac{4}{5}$$

      The angle is in the second quadrant, where the cosine is negative, so
      $\cos\theta = -\dfrac{4}{5}$.

      $$\tan\theta = \frac{\sin\theta}{\cos\theta} = \frac{3/5}{-4/5} = -\frac{3}{4}$$

      The quadrant is what chooses the sign. Without it there would be two answers.

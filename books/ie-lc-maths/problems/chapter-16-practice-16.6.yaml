# Practice set for 16.6 (strand 2, outcome 2.1). The numeric checks are proved by
# sympy: the expression is the arithmetic the page claims, and the answer is the
# result. The two `structured` records cover the independence of base and height, and
# the area of a parallelogram. A `structured` record proves that a model answer
# contains the declared ideas **in order**, and nothing more. It does not prove the
# geometry: the verifier reads the words, so the mathematics of a written argument
# stays a human judgement. The `points` list is the model answer the reader sees.
chapter: 16
problems:
  - id: lc16-6-triangle-area
    section: '16.6'
    tier: O
    refs: ['2.1']
    statement: 'A triangle has base $12$ cm and height $7$ cm. Find its area.'
    answer_label: 'The area'
    check: {kind: evaluate, expression: '0.5 * 12 * 7', answer: '42'}
    answer_text: >-
      The area is $42$ cm$^2$. The area of a triangle is half the base by the height.

  - id: lc16-6-parallelogram-area
    section: '16.6'
    tier: O
    refs: ['2.1']
    statement: 'A parallelogram has base $14$ m and height $6$ m. Find its area.'
    answer_label: 'The area'
    check: {kind: evaluate, expression: '14 * 6', answer: '84'}
    answer_text: >-
      The area is $84$ m$^2$. The area of a parallelogram is the base by the height, and
      the height is perpendicular to the base.

  - id: lc16-6-trapezium-area
    section: '16.6'
    tier: O
    refs: ['2.1']
    statement: >-
      A trapezium has parallel sides of $8$ cm and $12$ cm, and the perpendicular
      distance between them is $5$ cm. Find its area.
    answer_label: 'The area'
    check: {kind: evaluate, expression: '(8 + 12) / 2 * 5', answer: '50'}
    answer_text: >-
      The area is $50$ cm$^2$. Average the two parallel sides and multiply by the
      distance between them: $\frac{8 + 12}{2} \times 5 = 50$.

  - id: lc16-6-sine-area
    section: '16.6'
    tier: O
    refs: ['2.1']
    statement: >-
      A triangle has sides of $6$ cm and $10$ cm, and the angle between them is
      $30^\circ$. Find its area.
    answer_label: 'The area'
    check: {kind: evaluate, expression: '0.5 * 6 * 10 * sin(pi / 6)', answer: '15'}
    answer_text: >-
      The area is $15$ cm$^2$. Use $\frac{1}{2}ab\sin C$ with $a = 6$, $b = 10$ and
      $\sin 30^\circ = 0.5$.

  - id: lc16-6-field-area
    section: '16.6'
    tier: O
    refs: ['2.1']
    statement: 'A rectangular field is $60$ m long and $25$ m wide. Find its area.'
    answer_label: 'The area'
    check: {kind: evaluate, expression: '60 * 25', answer: '1500'}
    answer_text: >-
      The area is $1500$ m$^2$. The field is a rectangle, so the area is length times
      width.

  - id: lc16-6-base-height-independent
    section: '16.6'
    tier: O
    refs: ['2.1']
    statement: >-
      Explain why base times height does not depend on which side of a triangle is chosen
      as the base.
    answer_label: 'Why the choice of base does not matter'
    check:
      kind: structured
      requires: [two-altitudes, similar-triangles, equal-products]
      concepts: [similar-triangles, proportional-sides, area]
      points:
        - id: two-altitudes
          text: draw the altitude AD from A to BC and the altitude BE from B to AC
          concepts: [area]
        - id: similar-triangles
          text: the right-angled triangles BCE and ACD share the angle at C, so they are similar by the AA rule
          concepts: [similar-triangles]
        - id: equal-products
          text: the proportional sides give AD over BE equals AC over BC, so AD times BC equals BE times AC, which is the same product of base and height either way
          concepts: [proportional-sides]
    answer_text: >-
      The two altitudes make two similar right-angled triangles. Their proportional sides
      give $|AD| \times |BC| = |BE| \times |AC|$, so the product of base and height is
      the same for either choice.

  - id: lc16-6-parallelogram-proof
    section: '16.6'
    tier: O
    refs: ['2.1']
    statement: 'Prove that the area of a parallelogram is the base by the height.'
    answer_label: 'The proof of Theorem 18'
    check:
      kind: structured
      requires: [draw-diagonal, two-equal-areas, triangle-area, double]
      concepts: [diagonal, congruent-triangles, area]
      points:
        - id: draw-diagonal
          text: let ABCD be a parallelogram with base AB and height h, and draw the diagonal BD
          concepts: [diagonal]
        - id: two-equal-areas
          text: the diagonal splits the parallelogram into two congruent triangles, so by Proposition 12 the two triangles have equal areas
          concepts: [congruent-triangles]
        - id: triangle-area
          text: the triangle ABD has base AB and height h, so its area is one half times AB times h
          concepts: [area]
        - id: double
          text: the parallelogram is twice the triangle, so its area is AB times h, which is the base by the height
          concepts: [area]
    answer_text: >-
      The diagonal makes two congruent triangles of equal area. Each has area
      $\frac{1}{2} \times \text{base} \times \text{height}$, and the parallelogram is the
      two of them, so its area is base times height.

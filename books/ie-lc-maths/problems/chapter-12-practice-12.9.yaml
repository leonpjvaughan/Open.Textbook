# Practice set for 12.9 (strand 2, outcome 2.3). Every answer is a complete set of
# solutions in the stated range, so the `solve` check proves the whole set rather than
# one value: SymPy solves the equation over the interval and compares the two sets.
# Degrees in the statement become radians in the CAS, because the CAS works in radians;
# the interval and the answer list are both in radians. The quadratic record uses the
# Pythagorean identity from the booklet, so it declares `plays`. The final record is a
# `structured` check of the method, which the CAS cannot prove.
chapter: 12
symbols:
  x: {real: true}
problems:
  - id: lc12-9-sin-surd
    section: '12.9'
    tier: H
    refs: ['2.3']
    statement: >-
      Solve $\sin\theta = \dfrac{\sqrt{3}}{2}$ for $0^\circ \le \theta \le 360^\circ$.
    answer_label: 'The solutions'
    check:
      kind: solve
      variable: x
      equation: 'sin(x) = sqrt(3)/2'
      interval: [0, '2*pi']
      answer: ['pi/3', '2*pi/3']
    answer_text: >-
      The reference angle is $\sin^{-1}\!\left(\dfrac{\sqrt{3}}{2}\right) = 60^\circ$.
      The sine is positive, so the solutions lie in the first and second quadrants.

      $$\theta = 60^\circ \quad\text{or}\quad \theta = 180^\circ - 60^\circ = 120^\circ$$

      Check: $\sin 60^\circ = \dfrac{\sqrt{3}}{2}$ and
      $\sin 120^\circ = \dfrac{\sqrt{3}}{2}$.

  - id: lc12-9-cos-surd
    section: '12.9'
    tier: H
    refs: ['2.3']
    statement: >-
      Solve $\cos\theta = \dfrac{\sqrt{3}}{2}$ for $0^\circ \le \theta \le 360^\circ$.
    answer_label: 'The solutions'
    check:
      kind: solve
      variable: x
      equation: 'cos(x) = sqrt(3)/2'
      interval: [0, '2*pi']
      answer: ['pi/6', '11*pi/6']
    answer_text: >-
      The reference angle is $\cos^{-1}\!\left(\dfrac{\sqrt{3}}{2}\right) = 30^\circ$.
      The cosine is positive, so the solutions lie in the first and fourth quadrants.

      $$\theta = 30^\circ \quad\text{or}\quad \theta = 360^\circ - 30^\circ = 330^\circ$$

      The second solution is not $180^\circ - 30^\circ$, because that angle has a
      negative cosine. The sign of the cosine chooses the pair of quadrants.

  - id: lc12-9-tan-negative
    section: '12.9'
    tier: H
    refs: ['2.3']
    statement: >-
      Solve $\tan\theta = -1$ for $0^\circ \le \theta \le 360^\circ$.
    answer_label: 'The solutions'
    check:
      kind: solve
      variable: x
      equation: 'tan(x) = -1'
      interval: [0, '2*pi']
      answer: ['3*pi/4', '7*pi/4']
    answer_text: >-
      The reference angle is $\tan^{-1}(1) = 45^\circ$, and the tangent is negative, so
      the solutions lie in the second and fourth quadrants.

      $$\theta = 180^\circ - 45^\circ = 135^\circ \quad\text{or}\quad
      \theta = 360^\circ - 45^\circ = 315^\circ$$

      The tangent repeats every $180^\circ$, and $135^\circ + 180^\circ = 315^\circ$.
      The next solution, $495^\circ$, is outside the range.

  - id: lc12-9-sin-double
    section: '12.9'
    tier: H
    refs: ['2.3']
    statement: >-
      Solve $\sin 2\theta = \dfrac{1}{2}$ for $0^\circ \le \theta \le 360^\circ$.
    answer_label: 'The solutions'
    check:
      kind: solve
      variable: x
      equation: 'sin(2*x) = 1/2'
      interval: [0, '2*pi']
      answer: ['pi/12', '5*pi/12', '13*pi/12', '17*pi/12']
    answer_text: >-
      Let $x = 2\theta$, so $0^\circ \le x \le 720^\circ$. The reference angle is
      $30^\circ$, and the sine is positive, so

      $$x = 30^\circ,\ 150^\circ,\ 390^\circ,\ 510^\circ$$

      The last two are the second-turn copies. Divide each by $2$:

      $$\theta = 15^\circ,\ 75^\circ,\ 195^\circ,\ 255^\circ$$

      Four solutions, because $2\theta$ makes two full turns.

  - id: lc12-9-cos-double
    section: '12.9'
    tier: H
    refs: ['2.3']
    statement: >-
      Solve $\cos 2\theta = -\dfrac{1}{2}$ for $0^\circ \le \theta \le 360^\circ$.
    answer_label: 'The solutions'
    check:
      kind: solve
      variable: x
      equation: 'cos(2*x) = -1/2'
      interval: [0, '2*pi']
      answer: ['pi/3', '2*pi/3', '4*pi/3', '5*pi/3']
    answer_text: >-
      Let $x = 2\theta$, so $0^\circ \le x \le 720^\circ$. The reference angle is
      $60^\circ$, and the cosine is negative, so

      $$x = 120^\circ,\ 240^\circ,\ 480^\circ,\ 600^\circ$$

      Divide each by $2$:

      $$\theta = 60^\circ,\ 120^\circ,\ 240^\circ,\ 300^\circ$$

      Both copies of each solution are in the range, because $2\theta$ runs to
      $720^\circ$.

  - id: lc12-9-radians
    section: '12.9'
    tier: H
    refs: ['2.3']
    statement: >-
      Solve $\cos\theta = \dfrac{1}{2}$ for $0 \le \theta \le 2\pi$. Give the answers in
      radians.
    answer_label: 'The solutions'
    check:
      kind: solve
      variable: x
      equation: 'cos(x) = 1/2'
      interval: [0, '2*pi']
      answer: ['pi/3', '5*pi/3']
    answer_text: >-
      The reference angle is $\dfrac{\pi}{3}$. The cosine is positive, so the solutions
      lie in the first and fourth quadrants.

      $$\theta = \frac{\pi}{3} \quad\text{or}\quad \theta = 2\pi - \frac{\pi}{3} = \frac{5\pi}{3}$$

      The method is the same as in degrees. Only the units of the range have changed.

  - id: lc12-9-quadratic
    section: '12.9'
    tier: H
    refs: ['2.3']
    plays: pythagoras-identity
    statement: >-
      Solve $2\cos^2\theta + \sin\theta = 1$ for $0^\circ \le \theta \le 360^\circ$.
    answer_label: 'The solutions'
    check:
      kind: solve
      variable: x
      equation: '2*cos(x)**2 + sin(x) = 1'
      interval: [0, '2*pi']
      answer: ['pi/2', '7*pi/6', '11*pi/6']
    answer_text: |-
      The booklet gives $\cos^2\theta + \sin^2\theta = 1$, so
      $\cos^2\theta = 1 - \sin^2\theta$. Substitute this to leave only the sine:

      $$2(1 - \sin^2\theta) + \sin\theta = 1$$

      $$2\sin^2\theta - \sin\theta - 1 = 0$$

      Factorise the quadratic:

      $$(2\sin\theta + 1)(\sin\theta - 1) = 0$$

      So $\sin\theta = -\dfrac{1}{2}$ or $\sin\theta = 1$.

      - $\sin\theta = -\dfrac{1}{2}$ gives $\theta = 210^\circ$ or $330^\circ$.
      - $\sin\theta = 1$ gives $\theta = 90^\circ$.

      The solutions are $90^\circ$, $210^\circ$ and $330^\circ$. Each one checks in the
      original equation.

  - id: lc12-9-method
    section: '12.9'
    tier: H
    refs: ['2.3']
    statement: >-
      Explain how to find every solution of $\sin\theta = k$ in the range
      $0^\circ \le \theta \le 360^\circ$.
    answer_label: 'The method'
    check:
      kind: structured
      requires: [reference-angle, quadrant-signs, list-solutions]
      concepts: [solving-equations]
      points:
        - id: reference-angle
          text: >-
            Find the reference angle, the acute angle whose sine is the size of k. A
            calculator gives it as the inverse sine of the positive value.
          concepts: [solving-equations]
        - id: quadrant-signs
          text: >-
            Decide which quadrants the sign of k selects. The sine is positive in the
            first and second quadrants, and negative in the third and fourth.
          concepts: [solving-equations]
        - id: list-solutions
          text: >-
            Write the angle in each selected quadrant. For a positive k the solutions
            are the reference angle and 180 degrees minus it; for a negative k they are
            180 degrees plus it and 360 degrees minus it.
          concepts: [solving-equations]
    answer_text: |-
      Find the **reference angle** first: the acute angle whose sine is the size of $k$.
      A calculator gives it as the inverse sine of the positive value.

      Then decide which quadrants the sign of $k$ selects. The sine is positive in the
      first and second quadrants, and negative in the third and fourth.

      - If $k$ is positive, the solutions are $\alpha$ and $180^\circ - \alpha$.
      - If $k$ is negative, the solutions are $180^\circ + \alpha$ and
        $360^\circ - \alpha$.

      Finally, check each answer by substituting it back into the original equation. A
      full turn normally gives two solutions for a sine equation.

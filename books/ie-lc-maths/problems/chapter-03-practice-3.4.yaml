# Practice set for 3.4 (strand 3, outcome 3.4). The rational nets are proved by the
# `dimensions` oracle, so a net area in square centimetres is checked as a quantity. The
# cylinder nets carry pi and are proved exactly by `sympy`. The one explanation uses
# `structured`.
chapter: 3
problems:
  - id: lc3-4-cuboid-net
    section: '3.4'
    tier: O
    refs: ['3.4']
    statement: 'Find the area of the net of a cuboid $5$ cm by $3$ cm by $2$ cm.'
    answer_label: 'The area of the net'
    plays: parallelogram-area
    check:
      kind: dimensions
      expression: '2 * (l * w + l * h + w * h)'
      values:
        l: {value: '5', unit: cm}
        w: {value: '3', unit: cm}
        h: {value: '2', unit: cm}
      answer: {value: '62', unit: 'cm^2'}
    answer_text: |-
      The net holds three pairs of rectangles:

      $$A = 2(15 + 10 + 6) = 62 \text{ cm}^2$$

      The factor $2$ counts both copies of each face.

  - id: lc3-4-cube-net
    section: '3.4'
    tier: O
    refs: ['3.4']
    statement: 'A cube has edges of $4$ cm. Find the area of its net.'
    answer_label: 'The area of the cube net'
    plays: parallelogram-area
    check:
      kind: dimensions
      expression: '6 * s**2'
      values:
        s: {value: '4', unit: cm}
      answer: {value: '96', unit: 'cm^2'}
    answer_text: |-
      A cube net is $6$ squares, and each one has area $16 \text{ cm}^2$:

      $$A = 6 \times 16 = 96 \text{ cm}^2$$

  - id: lc3-4-cylinder-net-width
    section: '3.4'
    tier: O
    refs: ['3.4']
    statement: >-
      A cylinder has radius $5$ cm and height $10$ cm. Find the width of the rectangle in
      its net.
    answer_label: 'The width of the rectangle'
    check: {kind: evaluate, expression: '2 * pi * 5', answer: '10 * pi'}
    answer_text: |-
      The width is the circumference of the base:

      $$\text{Width} = 2\pi r = 2\pi \times 5 = 10\pi \approx 31.42 \text{ cm}$$

  - id: lc3-4-cylinder-net-area
    section: '3.4'
    tier: O
    refs: ['3.4']
    statement: >-
      A cylinder has radius $5$ cm and height $10$ cm. Find the area of the rectangle in
      its net.
    answer_label: 'The area of the rectangle'
    check: {kind: evaluate, expression: '2 * pi * 5 * 10', answer: '100 * pi'}
    answer_text: |-
      The rectangle is $10\pi$ cm wide and $10$ cm high, so

      $$A = 10\pi \times 10 = 100\pi \approx 314.16 \text{ cm}^2$$

      This rectangle is the curved surface only. The two circles are separate faces of
      the net.

  - id: lc3-4-cylinder-net-width-diameter
    section: '3.4'
    tier: O
    refs: ['3.4']
    statement: 'A cylinder has diameter $12$ cm. Find the width of the rectangle in its net.'
    answer_label: 'The width of the rectangle'
    check: {kind: evaluate, expression: 'pi * 12', answer: '12 * pi'}
    answer_text: |-
      $$\text{Width} = \pi d = 12\pi \approx 37.70 \text{ cm}$$

      The width is the circumference, not the diameter. A rectangle $12$ cm wide would
      roll into a tube too narrow for the $12$ cm circles.

  - id: lc3-4-triangular-prism-net
    section: '3.4'
    tier: O
    refs: ['3.4']
    statement: >-
      A triangular prism has a right-angled triangular cross-section with legs $3$ cm and
      $4$ cm, and a hypotenuse of $5$ cm. Its length is $10$ cm. Find the total area of
      its net.
    answer_label: 'The total area of the net'
    plays: triangle-area
    check:
      kind: dimensions
      expression: '2 * (a * b / 2) + a * L + b * L + c * L'
      values:
        a: {value: '3', unit: cm}
        b: {value: '4', unit: cm}
        c: {value: '5', unit: cm}
        L: {value: '10', unit: cm}
      answer: {value: '132', unit: 'cm^2'}
    answer_text: |-
      The net has two triangles and three rectangles:

      $$A = 2(6) + 30 + 40 + 50 = 132 \text{ cm}^2$$

      Each rectangle is one side of the triangle multiplied by the length, so the three
      rectangles have different widths.

  - id: lc3-4-cylinder-net-total
    section: '3.4'
    tier: O
    refs: ['3.4']
    statement: >-
      A cylinder has radius $5$ cm and height $10$ cm. Find the total area of its net.
    answer_label: 'The total area of the net'
    check: {kind: evaluate, expression: '2 * pi * 5**2 + 2 * pi * 5 * 10', answer: '150 * pi'}
    answer_text: |-
      The two circles together have area $2 \times 25\pi = 50\pi \text{ cm}^2$, and the
      rectangle has area $100\pi \text{ cm}^2$. So

      $$A = 50\pi + 100\pi = 150\pi \approx 471.24 \text{ cm}^2$$

      Add all three faces of the net. Missing a circle is the most common error here.

  - id: lc3-4-sphere-no-net
    section: '3.4'
    tier: O
    refs: ['3.4']
    statement: 'Explain why a sphere has no flat net.'
    answer_label: 'Why a sphere has no flat net'
    check:
      kind: structured
      requires: [state-curvature, describe-stretching, give-football-example]
      concepts: [curved-surface, no-flat-net]
      points:
        - id: state-curvature
          text: >-
            Every point of a sphere's surface is curved in two directions, so there is no
            straight edge to cut along and lay flat.
          concepts: [curved-surface]
        - id: describe-stretching
          text: >-
            Pressing the surface flat would stretch or tear it, which changes distances
            and areas.
          concepts: [no-flat-net]
        - id: give-football-example
          text: >-
            A football is the closest flat-piece version, and its panels are curved before
            they are stitched together.
    answer_text: >-
      A sphere is curved in every direction, so its surface cannot be cut and pressed flat
      without stretching or tearing it. A football comes closest, because it is made from
      flat panels, but each panel is curved before it is stitched and the finished ball is
      not made of flat pieces.

# Practice set for 1.6 (strand 3, outcome 3.2, Ordinary and Higher). Index
# equations with a matching base are solved exactly; the growth and decay items
# are exact rational arithmetic, because the multipliers are rational.
chapter: 1
symbols:
  x: {real: true}
problems:
  - id: lc1-6-solve-2x
    section: '1.6'
    tier: O
    refs: ['3.2']
    statement: 'Solve $2^x = 32$.'
    answer_label: 'The value of $x$'
    check: {kind: solve, equation: '2**x = 32', variable: x, answer: ['5']}
    answer_text: >-
      Write $32$ as a power of $2$: $32 = 2^5$. Then $2^x = 2^5$, so the indices
      are equal and $x = 5$.

      When the bases match, the indices must match.

  - id: lc1-6-solve-3x
    section: '1.6'
    tier: O
    refs: ['3.2']
    statement: 'Solve $3^x = 81$.'
    answer_label: 'The value of $x$'
    check: {kind: solve, equation: '3**x = 81', variable: x, answer: ['4']}
    answer_text: >-
      $81 = 3^4$, so $x = 4$. Write the right-hand side as a power of the same
      base first.

  - id: lc1-6-solve-shift
    section: '1.6'
    tier: O
    refs: ['3.2']
    statement: 'Solve $2^{x+1} = 16$.'
    answer_label: 'The value of $x$'
    check: {kind: solve, equation: '2**(x + 1) = 16', variable: x, answer: ['3']}
    answer_text: >-
      $16 = 2^4$, so $2^{x+1} = 2^4$. The indices are equal:

      $$x + 1 = 4 \qquad x = 3$$

  - id: lc1-6-solve-power
    section: '1.6'
    tier: O
    refs: ['3.2']
    statement: 'Solve $5^{2x} = 125$.'
    answer_label: 'The value of $x$'
    check: {kind: solve, equation: '5**(2*x) = 125', variable: x, answer: ['3/2']}
    answer_text: >-
      $125 = 5^3$, so $2x = 3$ and $x = \dfrac{3}{2}$. The index does not have
      to be a whole number.

  - id: lc1-6-solve-match
    section: '1.6'
    tier: O
    refs: ['3.2']
    statement: 'Solve $9^x = 3^{x+2}$.'
    answer_label: 'The value of $x$'
    check: {kind: solve, equation: '9**x = 3**(x + 2)', variable: x, answer: ['2']}
    answer_text: >-
      Write $9$ as $3^2$. Then the left side is $(3^2)^x = 3^{2x}$, and

      $$3^{2x} = 3^{x+2} \qquad 2x = x + 2 \qquad x = 2$$

      Making both bases the same is the first move in every question of this
      kind.

  - id: lc1-6-growth
    section: '1.6'
    tier: O
    refs: ['3.2']
    statement: >-
      €500 is invested at 4% per year. Work out the value after 3 years, to the
      nearest cent.
    answer_label: 'The value after 3 years'
    check: {kind: evaluate, expression: '500 * 1.04**3', answer: '562.432'}
    answer_text: >-
      A rise of $4\%$ multiplies by $1.04$ each year, so after $3$ years the
      multiplier is used three times:

      $$500 \times 1.04^3 = 500 \times 1.124864 = 562.432$$

      To the nearest cent that is €562.43. The index $3$ counts the years, and
      the growth compounds because each year builds on the last.

  - id: lc1-6-depreciation
    section: '1.6'
    tier: O
    refs: ['3.2']
    statement: >-
      A car worth €24\,000 loses 15% of its value each year. Work out its value
      after 2 years.
    answer_label: 'The value after 2 years'
    check: {kind: evaluate, expression: '24000 * 0.85**2', answer: '17340'}
    answer_text: >-
      A fall of $15\%$ leaves $85\%$, so the multiplier is $0.85$ each year:

      $$24\,000 \times 0.85^2 = 24\,000 \times 0.7225 = 17\,340$$

      The car is worth €17\,340 after two years.

  - id: lc1-6-solve-4x
    section: '1.6'
    tier: H
    refs: ['3.2']
    statement: 'Solve $4^x = 8$.'
    answer_label: 'The value of $x$'
    check: {kind: evaluate, expression: 'log(8)/log(4)', answer: '3/2'}
    answer_text: >-
      Write both sides as powers of $2$: $4^x = (2^2)^x = 2^{2x}$ and $8 = 2^3$.
      Then

      $$2^{2x} = 2^3 \qquad 2x = 3 \qquad x = \frac{3}{2}$$

      Check: $4^{3/2} = (\sqrt{4})^3 = 2^3 = 8$.

# Mixed practice for the Chapter 1 Review.
#
# Eleven questions, one record each, in the order they appear on the Review page.
# The arithmetic a reader can do by hand is proved with `evaluate` over exact
# rationals; the recurring decimal is solved as an equation; the rounding question
# is proved by `sigfigs`, which also insists the answer is written to the figures
# it claims. Questions 1, 5 and 11 ask for an explanation as well as, or instead
# of, a number, so each carries a `structured` component.
#
# Honest limit: this proves arithmetic, the rounding convention and the presence of
# the declared steps in a model answer. It does not prove that a construction is
# possible with ruler and compass, nor that a written explanation is right — a
# `structured` check proves only that the steps and concepts appear, in order.
#
# The review page ships at every level, so an item carries the tier of the section
# it practises; the Higher-only ones are marked H on the page.
chapter: 1
symbols:
  a: {real: true}
  x: {real: true}
problems:
  - id: r1-smallest-system
    section: '1.1'
    tier: F
    refs: ['3.1']
    statement: >-
      Which of $\mathbb{N}$, $\mathbb{Z}$, $\mathbb{Q}$ and $\mathbb{R}$ is the
      smallest system that contains $-0.75$?
    answer_label: 'The smallest system'
    check:
      kind: structured
      requires: [write-as-fraction, name-the-system]
      concepts: [rational, negative, not-integer]
      points:
        - id: write-as-fraction
          text: >-
            -0.75 = -3/4, which is one integer divided by another, so -0.75 is a
            rational number
          concepts: [rational]
        - id: name-the-system
          text: >-
            The smallest system that contains it is therefore Q, the rational
            numbers. It is not a natural number and not an integer, because it is
            negative and it is not whole
          concepts: [negative, not-integer]

  - id: r2-recurring-decimal
    section: '1.1'
    tier: F
    refs: ['3.1']
    statement: 'Write $0.363636\dots$ as a fraction in its lowest terms.'
    answer_label: 'The fraction'
    check:
      kind: solve
      equation: '99*x = 36'
      variable: x
      answer: ['4/11']
    answer_text: |-
      Let $x = 0.363636\dots$. The repeating block is two digits long, so multiply
      by $100$:

      $$100x = 36.363636\dots$$

      Subtracting the first equation from the second gives $99x = 36$, so
      $x = \dfrac{36}{99} = \dfrac{4}{11}$. Dividing top and bottom by $9$ gives the
      lowest terms.

  - id: r3-simplify-surd
    section: '1.2'
    tier: O
    refs: ['3.1']
    statement: 'Simplify $\sqrt{75}$.'
    answer_label: 'The simplified surd'
    check: {kind: evaluate, expression: 'sqrt(75)', answer: '5*sqrt(3)'}
    answer_text: |-
      Look for the largest square factor of $75$. Since $75 = 25 \times 3$,

      $$\sqrt{75} = \sqrt{25 \times 3} = \sqrt{25}\,\sqrt{3} = 5\sqrt{3}$$

      The square root of a product is the product of the square roots, and
      $\sqrt{25} = 5$ is exact, which is why the answer is simpler than the question.

  - id: r4-rationalise
    section: '1.2'
    tier: O
    refs: ['3.1']
    statement: 'Write $\dfrac{8}{\sqrt{2}}$ with a whole-number denominator.'
    answer_label: 'The rationalised form'
    check: {kind: evaluate, expression: '8/sqrt(2)', answer: '4*sqrt(2)'}
    answer_text: |-
      Multiply top and bottom by $\sqrt{2}$:

      $$\frac{8}{\sqrt{2}} \times \frac{\sqrt{2}}{\sqrt{2}}
      = \frac{8\sqrt{2}}{2} = 4\sqrt{2}$$

      Multiplying by $\dfrac{\sqrt{2}}{\sqrt{2}}$ changes nothing, because that
      fraction is $1$. The denominator is now the whole number $2$.

  - id: r5-construct-roots
    section: '1.3'
    tier: H
    refs: ['3.1']
    statement: 'Describe how to construct $\sqrt{2}$ and then $\sqrt{3}$ on the number line.'
    answer_label: 'The construction, and the lengths it uses'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '1**2 + 1**2', answer: '2'}
        - {kind: evaluate, expression: '1**2 + (sqrt(2))**2', answer: '3'}
        - kind: structured
          requires: [square-for-root-two, transfer-root-two, rectangle-for-root-three, transfer-root-three]
          concepts: [pythagoras, compass, number-line]
          points:
            - id: square-for-root-two
              text: >-
                Draw a unit square on the number line with one corner at 0 and one
                side along the axis. Its diagonal is sqrt(2) by Pythagoras, because
                1 squared plus 1 squared is 2.
              concepts: [pythagoras]
            - id: transfer-root-two
              text: >-
                Put the compass point at 0 and the pencil on the far corner, then
                swing the arc down to the number line. The mark is sqrt(2).
              concepts: [compass, number-line]
            - id: rectangle-for-root-three
              text: >-
                Draw a rectangle 1 unit high with its base sqrt(2) long. Its diagonal
                is sqrt(3), because 1 squared plus 2 is 3.
              concepts: [pythagoras]
            - id: transfer-root-three
              text: >-
                Transfer that diagonal to the number line with the compass in the
                same way. The mark is sqrt(3).
              concepts: [compass, number-line]
    answer_text: |-
      Start with a unit square whose bottom side lies on the number line from $0$ to
      $1$. Its diagonal is $\sqrt{1^2 + 1^2} = \sqrt{2}$ by Pythagoras' theorem.
      Open the compass to that diagonal, put the point at $0$, and swing the arc down
      to the line. The mark is $\sqrt{2}$.

      Now draw a rectangle $1$ unit high with its base $\sqrt{2}$ long. Its diagonal
      is $\sqrt{1^2 + \left(\sqrt{2}\right)^2} = \sqrt{3}$. Transfer that length to
      the line in the same way, and the mark is $\sqrt{3}$.

      Each step uses a length already built, which is what makes the construction a
      construction: nothing is measured with a ruler.

  - id: r6-absolute-and-distance
    section: '1.4'
    tier: O
    refs: ['3.1']
    statement: 'Work out $|-13|$ and the distance between $-5$ and $3$.'
    answer_label: 'The absolute value and the distance'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: 'abs(-13)', answer: '13'}
        - {kind: evaluate, expression: 'abs(3 - (-5))', answer: '8'}
    answer_text: |-
      $|-13| = 13$, because an absolute value is the distance from $0$ and does not
      carry a sign. The distance between $-5$ and $3$ is the absolute value of the
      difference:

      $$|3 - (-5)| = |8| = 8$$

      On the number line, count the units from $-5$ up to $3$: five to reach $0$ and
      three more, so eight in all.

  - id: r7-modulus-equation
    section: '1.4'
    tier: O
    refs: ['3.1']
    statement: 'Solve $|x - 4| = 6$.'
    answer_label: 'The two solutions'
    check:
      kind: solve
      equation: 'abs(x - 4) = 6'
      variable: x
      answer: ['-2', '10']
    answer_text: |-
      The absolute value of $x - 4$ is $6$ when $x - 4$ is $6$ or $-6$:

      $$x - 4 = 6 \quad\text{or}\quad x - 4 = -6$$

      So $x = 10$ or $x = -2$. Both are $6$ units from $4$ on the number line, one
      above and one below, which is why a modulus equation of this shape always has
      two solutions.

  - id: r8-power-of-a-product
    section: '1.5'
    tier: F
    refs: ['3.2']
    statement: 'Simplify $(3a^2)^3$.'
    answer_label: 'The simplified expression'
    check: {kind: evaluate, expression: '(3*a**2)**3', answer: '27*a**6'}
    answer_text: |-
      The cube applies to every factor inside the bracket:

      $$(3a^2)^3 = 3^3 \left(a^2\right)^3 = 27a^6$$

      For the power of a power, multiply the indices: $2 \times 3 = 6$. A common error
      is to cube the $3$ and forget to cube the $a^2$, which gives $3a^6$.

  - id: r9-solve-index-equation
    section: '1.6'
    tier: O
    refs: ['3.2']
    statement: 'Solve $3^{2x} = 81$.'
    answer_label: 'The value of x'
    check:
      kind: solve
      equation: '3**(2*x) = 81'
      variable: x
      answer: ['2']
    answer_text: |-
      Write $81$ as a power of $3$: $81 = 3^4$. Then

      $$3^{2x} = 3^4 \quad\Rightarrow\quad 2x = 4 \quad\Rightarrow\quad x = 2$$

      The bases are equal, so the indices must be equal. Check: $3^{2 \times 2} = 3^4
      = 81$.

  - id: r10-scientific-notation
    section: '1.7'
    tier: F
    refs: ['3.1']
    statement: 'Write $0.000\,456$ to 2 significant figures and in scientific notation.'
    answer_label: 'The number in scientific notation'
    check:
      kind: sigfigs
      value: '0.000456'
      figures: 2
      answer: '4.6e-4'
      convention: round-once
    answer_text: |-
      The first significant figure is the $4$. The digits after it are $5$ and $6$, so
      the next digit is $5$ and the $4$ rounds up to $5$:

      $$0.000\,456 = 4.56 \times 10^{-4} \approx 4.6 \times 10^{-4}$$

      The power is $-4$ because the decimal point moves four places to reach the $4$.
      Writing $0.000\,46$ is the same number, but the standard form shows at once that
      two figures are meant.

  - id: r11-rounding-in-a-chain
    section: '1.7'
    tier: F
    refs: ['3.1']
    statement: >-
      A quote for a job is rounded to the nearest euro before the profit margin is
      added. Explain why the final figure may be out by more than €1, and say where
      the rounding should happen instead.
    answer_label: 'Why the error grows, and where to round'
    check:
      kind: structured
      requires: [where-the-error-comes-from, where-to-round]
      concepts: [rounding-error, accumulation, end-only]
      points:
        - id: where-the-error-comes-from
          text: >-
            Rounding a figure to the nearest euro can change it by up to 50 cent, and
            the margin is then charged on the rounded figure, so the error travels
            into the final total. A quote with several lines has a rounding on each
            one, and the errors add: ten lines can put the total out by up to five
            euro before the margin is added.
          concepts: [rounding-error, accumulation]
        - id: where-to-round
          text: >-
            Keep the full value through the working and round once, at the end, on
            the finished quote. The margin should be worked out on the exact figure,
            not on a rounded one.
          concepts: [end-only]

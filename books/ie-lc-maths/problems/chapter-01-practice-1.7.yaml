# Practice set for 1.7 (strand 3, outcome 3.1). Scientific notation is exact, so
# it is proved by `evaluate`; rounding is a separate claim, so it is proved by
# `rounded` or `sigfigs`. The last two records are the chapter's quotation, kept
# exact so the error can be proved rather than described.
chapter: 1
problems:
  - id: lc1-7-to-sci
    section: '1.7'
    tier: F
    refs: ['3.1']
    statement: 'Write $45\,000$ in scientific notation.'
    answer_label: '$45\,000$ in scientific notation'
    check: {kind: evaluate, expression: '45000', answer: '4.5*10**4'}
    answer_text: >-
      Move the decimal point so that one non-zero digit sits before it:
      $4.5 \times 10^4$. The index $4$ counts the places the point moved.

  - id: lc1-7-to-sci-small
    section: '1.7'
    tier: F
    refs: ['3.1']
    statement: 'Write $0.00032$ in scientific notation.'
    answer_label: '$0.00032$ in scientific notation'
    check: {kind: evaluate, expression: '0.00032', answer: '3.2*10**-4'}
    answer_text: >-
      $0.00032 = 3.2 \times 10^{-4}$. The index is negative because the number
      is smaller than $1$, and it counts the places the point moved to the right.

  - id: lc1-7-from-sci
    section: '1.7'
    tier: F
    refs: ['3.1']
    statement: 'Write $5.2 \times 10^3$ as an ordinary number.'
    answer_label: '$5.2 \times 10^3$ as an ordinary number'
    check: {kind: evaluate, expression: '5.2*10**3', answer: '5200'}
    answer_text: >-
      $5.2 \times 10^3 = 5200$. A positive index of $3$ moves the point three
      places to the right.

  - id: lc1-7-multiply
    section: '1.7'
    tier: F
    refs: ['3.1']
    statement: 'Work out $(2 \times 10^3)(3 \times 10^5)$ and write the answer in scientific notation.'
    answer_label: 'The product in scientific notation'
    check: {kind: evaluate, expression: '(2*10**3)*(3*10**5)', answer: '6*10**8'}
    answer_text: >-
      Multiply the front numbers and add the indices:

      $$(2 \times 10^3)(3 \times 10^5) = 6 \times 10^{3+5} = 6 \times 10^8$$

      The answer is already in scientific notation, because $6$ is between $1$
      and $10$.

  - id: lc1-7-round-2sf
    section: '1.7'
    tier: F
    refs: ['3.1']
    statement: 'Round $0.004\,567$ to 2 significant figures.'
    answer_label: '$0.004\,567$ to 2 significant figures'
    check: {kind: rounded, value: '0.004567', rounded: '0.0046', to: '0.0001'}
    answer_text: >-
      The first significant figure is the $4$, because leading zeros do not
      count. The next digit is $5$, so round the $4$ up:

      $$0.004\,567 \approx 0.0046$$

  - id: lc1-7-sigfigs
    section: '1.7'
    tier: F
    refs: ['3.1']
    statement: 'Write the area $14.268$ to 3 significant figures.'
    answer_label: 'The area to 3 significant figures'
    check: {kind: sigfigs, convention: round-once, value: '14.268', figures: 3, answer: '14.3'}
    answer_text: >-
      The first three significant figures are $1$, $4$ and $2$. The next digit
      is $6$, so round the $2$ up: $14.3$.

      Round once, at the end. Rounding at every step is what makes a chain of
      calculations drift.

  - id: lc1-7-quote-correct
    section: '1.7'
    tier: F
    refs: ['3.1']
    statement: >-
      A room measures $4.35$ m by $3.28$ m. Carpet costs €32.40 per square metre,
      and the quote adds 5% for waste and then 10% profit. Work out the correct
      quote, keeping full precision until the end.
    answer_label: 'The correct quote'
    check:
      kind: evaluate
      expression: '(87/20)*(82/25)*(21/20)*(162/5)*(11/10)'
      answer: '533.937096'
    answer_text: >-
      $$4.35 \times 3.28 = 14.268 \text{ m}^2$$

      $$14.268 \times 1.05 = 14.9814 \text{ m}^2$$

      $$14.9814 \times 32.40 \times 1.10 = 533.937096$$

      So the correct quote is €533.94 to the nearest cent. Every figure is kept
      until this final rounding.

  - id: lc1-7-quote-error
    section: '1.7'
    tier: F
    refs: ['3.1']
    statement: >-
      The estimator rounded the two measurements to $4$ m and $3$ m before
      starting. The quote came to $4 \times 3 \times 1.05 \times 32.40 \times
      1.10$. Work out how far this is from the correct quote.
    answer_label: 'The size of the error'
    check:
      kind: evaluate
      expression: '(87/20)*(82/25)*(21/20)*(162/5)*(11/10) - 4*3*(21/20)*(162/5)*(11/10)'
      answer: '84.873096'
    answer_text: >-
      The rounded quote is

      $$4 \times 3 \times 1.05 \times 32.40 \times 1.10 = 449.064$$

      so the error is

      $$533.937096 - 449.064 = 84.873096$$

      about €84.87. The estimator quoted €449.06, but the carpet alone costs
      €485.40. The error is bigger than the €48.54 profit the job was meant to
      make, which is why the contract lost money.

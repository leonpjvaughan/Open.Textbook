# Practice set for 7.8 (strand 5, outcome 5.2). A stationary point is where the derivative
# is zero, so `solve` finds the x-values and `evaluate` checks the y-values. The second
# derivative test is a written argument and uses `structured`. The tank's fastest filling
# is the stationary point of its rate, which `apply` and `solve` prove.
chapter: 7
symbols:
  x: {real: true}
  t: {real: true}
problems:
  - id: lc7-8-quadratic
    section: '7.8'
    tier: O
    refs: ['5.2']
    statement: 'Find the stationary point of $y = x^2 - 6x + 5$.'
    answer_label: 'The x-value, then the y-value'
    check:
      kind: all
      checks:
        - {kind: solve, equation: '2*x - 6 = 0', variable: x, answer: [3]}
        - {kind: evaluate, expression: '3**2 - 6*3 + 5', answer: '-4'}
    answer_text: >-
      $\dfrac{dy}{dx} = 2x - 6$. Setting this to zero gives $x = 3$. Then
      $y = 9 - 18 + 5 = -4$. The stationary point is $(3, -4)$. Since
      $\dfrac{d^2y}{dx^2} = 2 > 0$, it is a minimum.

  - id: lc7-8-cubic-two-points
    section: '7.8'
    tier: O
    refs: ['5.2']
    statement: 'Find the x-values of the stationary points of $y = x^3 - 3x$.'
    answer_label: 'The x-values'
    check:
      kind: solve
      equation: '3*x**2 - 3 = 0'
      variable: x
      answer: [-1, 1]
    answer_text: >-
      $\dfrac{dy}{dx} = 3x^2 - 3$. Setting this to zero gives $3x^2 = 3$, so
      $x^2 = 1$ and $x = -1$ or $x = 1$. There are two stationary points.

  - id: lc7-8-cubic-classify
    section: '7.8'
    tier: O
    refs: ['5.2']
    statement: >-
      For $y = x^3 - 6x^2 + 9x$, find the x-values of the stationary points and
      classify each one.
    answer_label: 'The x-values'
    check:
      kind: solve
      equation: '3*x**2 - 12*x + 9 = 0'
      variable: x
      answer: [1, 3]
    answer_text: >-
      $\dfrac{dy}{dx} = 3x^2 - 12x + 9 = 3(x - 1)(x - 3)$, so the stationary points
      are at $x = 1$ and $x = 3$.

      The second derivative is $\dfrac{d^2y}{dx^2} = 6x - 12$. At $x = 1$ it is $-6$,
      so there is a local maximum. At $x = 3$ it is $6$, so there is a local minimum.

  - id: lc7-8-cubic-values
    section: '7.8'
    tier: O
    refs: ['5.2']
    statement: >-
      For $y = x^3 - 6x^2 + 9x$, work out the y-values at the stationary points
      $x = 1$ and $x = 3$.
    answer_label: 'The two y-values'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '1**3 - 6*1**2 + 9*1', answer: '4'}
        - {kind: evaluate, expression: '3**3 - 6*3**2 + 9*3', answer: '0'}
    answer_text: >-
      At $x = 1$: $y = 1 - 6 + 9 = 4$. At $x = 3$: $y = 27 - 54 + 27 = 0$. So the
      local maximum is $(1, 4)$ and the local minimum is $(3, 0)$.

  - id: lc7-8-tank-full
    section: '7.8'
    tier: O
    refs: ['5.2']
    statement: >-
      The tank volume is $V(t) = 12t^2 - t^3$ for $0 \le t \le 8$. Find the time at
      which the volume is greatest, and state the greatest volume.
    answer_label: 'The time, then the volume'
    check:
      kind: all
      checks:
        - {kind: solve, equation: '24*t - 3*t**2 = 0', variable: t, answer: [0, 8]}
        - {kind: evaluate, expression: '12*8**2 - 8**3', answer: '256'}
    answer_text: >-
      $V'(t) = 24t - 3t^2 = 3t(8 - t)$. This is zero at $t = 0$ and at $t = 8$. At
      $t = 0$ the tank is empty, so the greatest volume is at $t = 8$:

      $$V(8) = 12(64) - 512 = 768 - 512 = 256 \text{ litres}$$

      Since $V''(8) = 24 - 48 = -24 < 0$, this is a maximum.

  - id: lc7-8-tank-fastest
    section: '7.8'
    tier: O
    refs: ['5.2']
    statement: >-
      The tank fills at rate $V'(t) = 24t - 3t^2$ litres per minute. Find the time at
      which the rate is greatest, and state the greatest rate.
    answer_label: 'The time, then the rate'
    check:
      kind: all
      checks:
        - {kind: solve, equation: '24 - 6*t = 0', variable: t, answer: [4]}
        - {kind: evaluate, expression: '24*4 - 3*4**2', answer: '48'}
    answer_text: >-
      To make the rate greatest, set its derivative to zero: $V''(t) = 24 - 6t = 0$,
      so $t = 4$. The rate there is

      $$V'(4) = 24(4) - 3(16) = 96 - 48 = 48 \text{ litres per minute}$$

      Since $V'''(t) = -6 < 0$, this is a maximum of the rate. The tank fills fastest
      at $t = 4$ minutes.

  - id: lc7-8-second-derivative-test
    section: '7.8'
    tier: O
    refs: ['5.2']
    statement: 'Explain how the second derivative is used to classify a stationary point.'
    answer_label: 'The second derivative test'
    check:
      kind: structured
      requires: [zero, sign]
      concepts: [second-derivative-test, maximum-minimum]
      points:
        - id: zero
          text: >-
            first find the stationary points by solving f'(x) = 0
          concepts: [second-derivative-test]
        - id: sign
          text: >-
            then work out f'' at each point: a negative value gives a local maximum, a
            positive value gives a local minimum, and zero gives no information
          concepts: [maximum-minimum]
    answer_text: >-
      First solve $f'(x) = 0$ to find the stationary points. Then work out $f''$ at
      each one.

      - If $f''(x) < 0$, the gradient is falling, so the point is a local maximum.
      - If $f''(x) > 0$, the gradient is rising, so the point is a local minimum.
      - If $f''(x) = 0$, the test gives no information, and you need the sign of
        $f'(x)$ on each side instead.

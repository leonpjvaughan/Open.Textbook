# Mixed practice for the Chapter 10 Review.
#
# Ten questions, one record each, in the order they appear on the Review page.
# Questions 1 to 5 are counts and probabilities, so `evaluate` proves the arithmetic of
# the count itself: the fundamental principle, the permutation, the combination, the
# multiplication rule and the conditional multiplication are each one product, and that
# product is the whole answer. Question 6 asks whether two events are independent, so
# the numeric part is the product of the two probabilities and a `structured` component
# states the reason. Question 7 is a binomial probability, proved by the `distribution`
# oracle. Questions 8 and 9 come from Chapter 9 and are proved by `evaluate` and `solve`.
# Question 10 asks for a proof by induction: the closed form is proved by `sum`, and the
# induction is a `structured` component.
#
# Honest limit: this proves arithmetic and the closed form, not the mathematics of
# counting. Nothing here checks that the reader **chose** the right method — a
# permutation recorded where a combination belongs would still verify, because the
# oracle is given the expression. A `structured` check proves only that a model answer
# contains its declared steps and concepts, in order; it does not prove the reasoning.
chapter: 10
symbols:
  n: {real: true, integer: true, positive: true}
  r: {real: true}
problems:
  - id: r1-soup-and-sandwich
    section: '10.1'
    tier: F
    refs: ['1.1']
    statement: >-
      A cafe offers $4$ soups and $6$ sandwiches. How many soup-and-sandwich lunches are
      possible?
    answer_label: 'The number of lunches'
    check: {kind: evaluate, expression: '4 * 6', answer: '24'}
    answer_text: >-
      $4 \times 6 = 24$ lunches. Every soup can be paired with every sandwich, and the
      choices multiply. This is the fundamental principle of counting.

  - id: r2-podium
    section: '10.2'
    tier: O
    refs: ['1.1']
    statement: 'How many ways can $5$ runners fill first, second and third place?'
    answer_label: 'The number of ways'
    check: {kind: evaluate, expression: '5 * 4 * 3', answer: '60'}
    answer_text: >-
      $5 \times 4 \times 3 = 60$ ways. There are $5$ choices for first, then $4$ left for
      second, then $3$ for third. Order matters, so this is a permutation:
      ${}^{5}P_{3} = 60$.

  - id: r3-committee
    section: '10.3'
    tier: O
    refs: ['1.1']
    statement: 'A committee of $4$ is chosen from $9$ people. How many committees are possible?'
    answer_label: 'The number of committees'
    check: {kind: evaluate, expression: 'binomial(9, 4)', answer: '126'}
    answer_text: >-
      $\dbinom{9}{4} = \dfrac{9 \times 8 \times 7 \times 6}{4 \times 3 \times 2 \times 1}
      = 126$ committees. Order does not matter: the same four people are one committee,
      however they were listed.

  - id: r4-two-even-scores
    section: '10.7'
    tier: F
    refs: ['1.3']
    statement: 'A fair die is rolled twice. Find the probability of two even scores.'
    answer_label: 'The probability'
    check: {kind: evaluate, expression: '(3 / 6) * (3 / 6)', answer: '1/4'}
    answer_text: >-
      Three of the six scores are even, so each roll gives an even score with probability
      $\dfrac{3}{6} = \dfrac{1}{2}$. The rolls are independent, so the probabilities
      multiply: $\dfrac{1}{2} \times \dfrac{1}{2} = \dfrac{1}{4}$.

  - id: r5-two-red-counters
    section: '10.6'
    tier: O
    refs: ['1.2']
    statement: >-
      A bag holds $6$ red and $4$ green counters. Two are drawn without replacement. Find
      the probability that both are red.
    answer_label: 'The probability that both are red'
    check: {kind: evaluate, expression: '(6 / 10) * (5 / 9)', answer: '1/3'}
    answer_text: >-
      $P(\text{first red}) = \dfrac{6}{10}$. Then $5$ red and $4$ green remain, so
      $P(\text{second red} \mid \text{first red}) = \dfrac{5}{9}$. The multiplication rule
      gives
      $\dfrac{6}{10} \times \dfrac{5}{9} = \dfrac{30}{90} = \dfrac{1}{3}$.
      The draw is without replacement, so the second probability is not $\dfrac{6}{10}$.

  - id: r6-independent-events
    section: '10.7'
    tier: F
    refs: ['1.3']
    statement: >-
      $P(A) = 0.6$, $P(B) = 0.3$ and $P(A \cap B) = 0.18$. Are $A$ and $B$ independent?
      Give a reason.
    answer_label: 'Whether the events are independent, with the reason'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '0.6 * 0.3', answer: '0.18'}
        - kind: structured
          requires: [multiply-probabilities, compare-with-intersection, conclude]
          concepts: [product-rule, independent]
          points:
            - id: multiply-probabilities
              text: >-
                Multiply the two probabilities: $P(A) \times P(B) = 0.6 \times 0.3 = 0.18$.
              concepts: [product-rule]
            - id: compare-with-intersection
              text: >-
                Compare that product with the probability of both events: $P(A \cap B)$
                is also $0.18$, so the two agree.
              concepts: [product-rule]
            - id: conclude
              text: >-
                Equality means the events are independent. Knowing that $A$ happened does
                not change the probability of $B$.
              concepts: [independent]
    answer_text: >-
      $P(A) \times P(B) = 0.6 \times 0.3 = 0.18$, which equals $P(A \cap B)$. So the
      events are **independent**. The test is always the same: multiply the two
      probabilities and compare the product with the probability of both events.

  - id: r7-binomial-three
    section: '10.8'
    tier: H
    refs: ['1.3']
    statement: '$X \sim B\left(10, \tfrac14\right)$. Find $P(X = 3)$.'
    answer_label: 'The probability'
    check:
      kind: distribution
      distribution: binomial
      parameters: {n: 10, p: '1/4'}
      query: {kind: exactly, value: 3}
      answer: '32805/131072'
    answer_text: >-
      $P(X = 3) = \dbinom{10}{3}\left(\tfrac14\right)^3\left(\tfrac34\right)^7
      = \dfrac{120 \times 2187}{1048576} = \dfrac{262440}{1048576}
      = \dfrac{32805}{131072} \approx 0.2503$.
      The two powers add to $10$, which is $n$, and $\dbinom{10}{3}$ counts the positions
      of the three successes.

  - id: r8-arithmetic-sum
    section: '9.2'
    tier: O
    refs: ['4.1']
    statement: 'Find the sum of the first $20$ terms of the arithmetic series $3 + 7 + 11 + \dots$'
    answer_label: 'The sum of the first twenty terms'
    check: {kind: evaluate, expression: '(20 / 2) * (2 * 3 + 19 * 4)', answer: '820'}
    answer_text: >-
      $a = 3$ and $d = 4$, so
      $S_{20} = \dfrac{20}{2}\left(2(3) + 19(4)\right) = 10(6 + 76) = 820$.
      The formula is in the booklet. The bracket is twice the first term plus
      $19$ steps of $4$, so it is the sum of the first and last terms.

  - id: r9-geometric-ratio
    section: '9.3'
    tier: O
    refs: ['4.1']
    statement: >-
      The fifth term of a geometric sequence is $48$ and the first term is $3$. Find the
      common ratio.
    answer_label: 'The common ratio'
    check:
      kind: solve
      equation: '3 * r ** 4 = 48'
      variable: 'r'
      answer: ['2', '-2']
    answer_text: >-
      The fifth term is $ar^{4}$, so $3r^{4} = 48$ and $r^{4} = 16$. Taking the fourth
      root gives $r = \pm 2$: an even power loses the sign, so both $2$ and $-2$ are
      answers. With $r = -2$ the terms alternate in sign.

  - id: r10-induction-even-sum
    section: '9.6'
    tier: H
    refs: ['4.1']
    statement: 'Prove by induction that $2 + 4 + 6 + \dots + 2n = n(n+1)$.'
    answer_label: 'The proof, step by step'
    check:
      kind: all
      checks:
        - kind: apply
          expression: '2 * n'
          apply: {op: sum, args: [n, 1, n]}
          answer: 'n * (n + 1)'
        - kind: structured
          requires: [base-case, assume-for-k, add-next-term, conclude]
          concepts: [base-case, inductive-hypothesis, inductive-step]
          points:
            - id: base-case
              text: >-
                Base case $n = 1$: the left side is $2$ and the right side is
                $1 \times 2 = 2$. The statement is true for $n = 1$.
              concepts: [base-case]
            - id: assume-for-k
              text: >-
                Assume the statement holds for some $n = k$, so
                $2 + 4 + \dots + 2k = k(k+1)$.
              concepts: [inductive-hypothesis]
            - id: add-next-term
              text: >-
                Add the next term $2(k+1)$ to both sides:
                $2 + 4 + \dots + 2k + 2(k+1) = k(k+1) + 2(k+1) = (k+1)(k+2)$.
              concepts: [inductive-step]
            - id: conclude
              text: >-
                That is the formula with $n = k+1$. The statement holds for $n = 1$, and
                whenever it holds for $k$ it holds for $k+1$, so it holds for every
                $n \ge 1$ by induction.
              concepts: [inductive-step]
    answer_text: >-
      **Base case.** For $n = 1$, $2 = 1 \times 2$. True.

      **Inductive step.** Assume $2 + 4 + \dots + 2k = k(k+1)$. Then
      $2 + 4 + \dots + 2k + 2(k+1) = k(k+1) + 2(k+1) = (k+1)(k+2)$, which is the formula
      with $n = k + 1$. So the statement holds for every $n \ge 1$ by induction.

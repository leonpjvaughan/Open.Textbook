# Practice set for 13.7 (Leaving Certificate Mathematics, strand 2, outcome 2.2).
#
# The point that divides A to B in the ratio m:n is (nA + mB)/(m+n). Every record
# computes that weighted average from the coordinates, so the answer is proved
# from the ratio and the endpoints rather than asserted.
chapter: 13
problems:
  - id: lc13-7-simple
    section: '13.7'
    tier: H
    refs: ['2.2']
    statement: >-
      Find the point that divides the segment from $(2, 4)$ to $(8, 10)$ in the
      ratio $1 : 2$.
    answer_label: 'The point'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '(2*2 + 1*8)/3', answer: '4'}
        - {kind: evaluate, expression: '(2*4 + 1*10)/3', answer: '6'}
    answer_text: >-
      The point is $\left(\frac{2 \times 2 + 1 \times 8}{3},
      \frac{2 \times 4 + 1 \times 10}{3}\right) = (4, 6)$. The ratio is $1 : 2$,
      so the point is one third of the way from the first endpoint to the second.

  - id: lc13-7-chapter
    section: '13.7'
    tier: H
    refs: ['2.2']
    statement: >-
      A bus stop divides the main road from $A(-1, 1)$ to $B(7, 7)$ in the
      ratio $2 : 3$. Find its coordinates.
    answer_label: 'The coordinates'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '(3*(-1) + 2*7)/5', answer: '11/5'}
        - {kind: evaluate, expression: '(3*1 + 2*7)/5', answer: '17/5'}
    answer_text: >-
      The point is $\left(\frac{3 \times (-1) + 2 \times 7}{5},
      \frac{3 \times 1 + 2 \times 7}{5}\right) = \left(\frac{11}{5},
      \frac{17}{5}\right)$. That is $2.2$ units right and $3.4$ units up, which
      is $2$ parts of the $5$ equal parts along the road.

  - id: lc13-7-third
    section: '13.7'
    tier: H
    refs: ['2.2']
    statement: >-
      Find the point that divides the segment from $(0, 0)$ to $(6, 9)$ in the
      ratio $2 : 1$.
    answer_label: 'The point'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '(1*0 + 2*6)/3', answer: '4'}
        - {kind: evaluate, expression: '(1*0 + 2*9)/3', answer: '6'}
    answer_text: >-
      The point is $\left(\frac{1 \times 0 + 2 \times 6}{3},
      \frac{1 \times 0 + 2 \times 9}{3}\right) = (4, 6)$. This time the point is
      two thirds of the way along, because the first part of the ratio is larger.

  - id: lc13-7-trisect
    section: '13.7'
    tier: H
    refs: ['2.2']
    statement: >-
      Find the two points that divide the segment from $(0, 0)$ to $(9, 6)$ into
      three equal parts.
    answer_label: 'The two points'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '(2*0 + 1*9)/3', answer: '3'}
        - {kind: evaluate, expression: '(2*0 + 1*6)/3', answer: '2'}
        - {kind: evaluate, expression: '(1*0 + 2*9)/3', answer: '6'}
        - {kind: evaluate, expression: '(1*0 + 2*6)/3', answer: '4'}
    answer_text: >-
      The first point divides the segment in the ratio $1 : 2$, giving $(3, 2)$.
      The second divides it in the ratio $2 : 1$, giving $(6, 4)$. Together with
      the endpoints, the four points are evenly spaced along the segment.

  - id: lc13-7-find-b
    section: '13.7'
    tier: H
    refs: ['2.2']
    statement: >-
      The point $P(3, 5)$ divides the segment from $A(1, 1)$ to $B$ in the ratio
      $1 : 2$. Find $B$.
    answer_label: 'The coordinates of B'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '1 + 3*(3 - 1)', answer: '7'}
        - {kind: evaluate, expression: '1 + 3*(5 - 1)', answer: '13'}
    answer_text: >-
      $AP$ is one part and $PB$ is two parts, so $AP$ is one third of $AB$ and
      $\vec{AB} = 3\,\vec{AP}$. Then $B = (1 + 3 \times 2, 1 + 3 \times 4) =
      (7, 13)$.

  - id: lc13-7-find-ratio
    section: '13.7'
    tier: H
    refs: ['2.2']
    statement: >-
      Find the ratio in which the point $(2, 3)$ divides the segment from
      $(0, 0)$ to $(8, 12)$.
    answer_label: 'The ratio'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '2/(8 - 2)', answer: '1/3'}
        - {kind: evaluate, expression: '3/(12 - 3)', answer: '1/3'}
    answer_text: >-
      The fraction of the way along is $\frac{2}{8} = \frac{3}{12} = \frac{1}{4}$
      from the start. So $AP : PB = 1 : 3$: the point is one part along and three
      parts remain.

  - id: lc13-7-midpoint
    section: '13.7'
    tier: H
    refs: ['2.2']
    statement: >-
      Show that the section formula with the ratio $1 : 1$ gives the midpoint of
      $(1, 2)$ and $(5, 10)$.
    answer_label: 'The midpoint'
    check:
      kind: all
      checks:
        - {kind: evaluate, expression: '(1*1 + 1*5)/2', answer: '3'}
        - {kind: evaluate, expression: '(1*2 + 1*10)/2', answer: '6'}
    answer_text: >-
      With $m = n = 1$ the formula gives
      $\left(\frac{1 \times 1 + 1 \times 5}{2}, \frac{1 \times 2 + 1 \times 10}{2}\right)
      = (3, 6)$, which is the average of the endpoints. The midpoint is the
      special case of the section formula with equal parts.

  - id: lc13-7-explain
    section: '13.7'
    tier: H
    refs: ['2.2']
    statement: >-
      Explain why the point that divides $A$ to $B$ in the ratio $m : n$ is
      $\frac{nA + mB}{m + n}$.
    answer_label: 'Why the formula works'
    check:
      kind: structured
      requires: [fraction, weighted]
      concepts: [ratio, vector]
      points:
        - id: fraction
          text: The point is m parts of the way from A to B out of m + n equal parts.
          concepts: [ratio, vector]
        - id: weighted
          text: Moving that fraction along AB weights A by n and B by m, then divides by m + n.
          concepts: [ratio]
    answer_text: >-
      The segment is split into $m + n$ equal parts, and the point is $m$ of them
      from $A$. So it is the fraction $\frac{m}{m + n}$ of the way along
      $\vec{AB}$ from $A$. Adding that fraction of the vector to $A$ gives the
      weighted average $\frac{nA + mB}{m + n}$.

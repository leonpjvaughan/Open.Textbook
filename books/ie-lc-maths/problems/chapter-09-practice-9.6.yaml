# Practice set for 9.6 (strand 4, outcome 4.1, Higher). The induction *step* is algebra
# and sympy proves it; the *structure* of the proof — base case, assumption, conclusion —
# is a statement and is recorded as `structured`. The split is deliberate and the bank
# comment says so: this oracle can prove that the algebra is right, and cannot prove that
# the argument is complete.
symbols:
  n: {integer: true}
  k: {integer: true}
chapter: 9
problems:
  - id: lc9-6-step-sum
    section: '9.6'
    tier: H
    refs: ['4.1']
    statement: >-
      To prove $\displaystyle\sum_{r=1}^{n} r = \frac{n(n+1)}{2}$ by induction, you
      assume it is true for $n = k$ and prove it for $n = k + 1$. Show that
      $\dfrac{k(k+1)}{2} + (k+1)$ simplifies to $\dfrac{(k+1)(k+2)}{2}$.
    answer_label: 'The simplified form'
    check:
      kind: evaluate
      expression: 'k*(k+1)/2 + (k+1)'
      answer: '(k+1)*(k+2)/2'
    answer_text: >-
      Take out the common factor $(k + 1)$:

      $$\frac{k(k+1)}{2} + (k+1) = (k+1)\left(\frac{k}{2} + 1\right) = (k+1)\frac{k+2}{2} = \frac{(k+1)(k+2)}{2}$$

      That is the formula with $n = k + 1$, so the inductive step is proved.

  - id: lc9-6-step-squares
    section: '9.6'
    tier: H
    refs: ['4.1']
    statement: >-
      To prove $\displaystyle\sum_{r=1}^{n} r^2 = \frac{n(n+1)(2n+1)}{6}$ by induction,
      show that $\dfrac{k(k+1)(2k+1)}{6} + (k+1)^2$ simplifies to
      $\dfrac{(k+1)(k+2)(2k+3)}{6}$.
    answer_label: 'The simplified form'
    check:
      kind: evaluate
      expression: 'k*(k+1)*(2*k+1)/6 + (k+1)**2'
      answer: '(k+1)*(k+2)*(2*k+3)/6'
    answer_text: >-
      Take out the common factor $\dfrac{k+1}{6}$:

      $$\frac{k(k+1)(2k+1)}{6} + (k+1)^2 = \frac{k+1}{6}\left(k(2k+1) + 6(k+1)\right)$$

      The bracket is $2k^2 + k + 6k + 6 = 2k^2 + 7k + 6 = (k+2)(2k+3)$. So the whole
      expression is

      $$\frac{(k+1)(k+2)(2k+3)}{6}$$

      which is the formula with $n = k + 1$. The step is proved.

  - id: lc9-6-step-odd
    section: '9.6'
    tier: H
    refs: ['4.1']
    statement: >-
      To prove that the sum of the first $n$ odd numbers is $n^2$, show that
      $k^2 + (2(k+1) - 1)$ equals $(k+1)^2$.
    answer_label: 'The simplified form'
    check:
      kind: evaluate
      expression: 'k**2 + (2*(k+1) - 1)'
      answer: '(k+1)**2'
    answer_text: >-
      The $(k+1)$th odd number is $2(k+1) - 1 = 2k + 1$, so

      $$k^2 + (2k + 1) = (k+1)^2$$

      That is the sum formula with $n = k + 1$, so the inductive step holds.

  - id: lc9-6-step-power
    section: '9.6'
    tier: H
    refs: ['4.1']
    statement: >-
      To prove $2^n > n$ for all $n \ge 1$, you assume $2^k > k$ and want $2^{k+1} > k+1$.
      Starting from $2^{k+1} = 2 \cdot 2^k$, explain how the assumption gives the result.
    answer_label: 'The argument'
    check:
      kind: structured
      requires: [assumption, subtract]
      concepts: [double, inequality]
      points:
        - id: assumption
          text: by the assumption 2^k > k, so 2 * 2^k > 2k
          concepts: [double]
        - id: subtract
          text: and 2k >= k + 1 for every k >= 1, so 2^(k+1) > 2k >= k + 1, which is the result
          concepts: [inequality]
    answer_text: >-
      $2^{k+1} = 2 \times 2^k$. By the assumption $2^k > k$, so

      $$2^{k+1} = 2 \times 2^k > 2k$$

      And for every $k \ge 1$, $2k \ge k + 1$. Putting the two together,

      $$2^{k+1} > 2k \ge k + 1$$

      so $2^{k+1} > k + 1$, which is the statement for $n = k + 1$. The step is proved.

  - id: lc9-6-base-case
    section: '9.6'
    tier: H
    refs: ['4.1']
    statement: >-
      Explain why a proof by induction needs a **base case** as well as the inductive
      step.
    answer_label: 'Why the base case is needed'
    check:
      kind: structured
      requires: [step, start]
      concepts: [step-alone-insufficient, needs-start]
      points:
        - id: step
          text: the inductive step only says that if the statement is true for one value then it is true for the next
          concepts: [step-alone-insufficient]
        - id: start
          text: without a base case there is nothing for the chain to start from, so the statement may be false for every value
          concepts: [needs-start]
    answer_text: >-
      The inductive step is conditional: **if** the statement is true for $n = k$, **then**
      it is true for $n = k + 1$. On its own it proves nothing, because it needs a true
      starting point.

      The base case supplies it. Once the statement is known true for $n = 1$, the step
      gives $n = 2$, then $n = 3$, and so on for every whole number. Without a base case
      the chain has nothing to start from: a statement false for every $n$ can still
      satisfy the step.

  - id: lc9-6-structure
    section: '9.6'
    tier: H
    refs: ['4.1']
    statement: >-
      Write down the three parts of a proof by induction, in order.
    answer_label: 'The three parts'
    check:
      kind: structured
      requires: [base, assumption, conclusion]
      concepts: [base-case, inductive-hypothesis, inductive-step-and-conclusion]
      points:
        - id: base
          text: the base case, showing the statement is true for the first value, usually n = 1
          concepts: [base-case]
        - id: assumption
          text: the inductive hypothesis, assuming the statement true for n = k
          concepts: [inductive-hypothesis]
        - id: conclusion
          text: the inductive step, proving it true for n = k + 1 from that assumption, so it is true for all n by induction
          concepts: [inductive-step-and-conclusion]
    answer_text: >-
      1. **Base case.** Show the statement is true for the first value, usually $n = 1$.
      2. **Inductive hypothesis.** Assume it is true for $n = k$, for some $k \ge 1$.
      3. **Inductive step.** Using that assumption, prove it is true for $n = k + 1$.

      Then the statement is true for every whole number $n$ from the base case onwards,
      because each value passes the truth to the next.

  - id: lc9-6-sum-odd-check
    section: '9.6'
    tier: H
    refs: ['4.1']
    statement: >-
      Check that the sum of the first $5$ odd numbers is $5^2$.
    answer_label: 'The sum'
    check: {kind: evaluate, expression: '1 + 3 + 5 + 7 + 9', answer: '25'}
    answer_text: >-
      $1 + 3 + 5 + 7 + 9 = 25 = 5^2$. The formula holds for $n = 5$.

      Checking one value is not a proof — that is what induction is for — but it is worth
      doing to be sure the formula is the right one before proving it.

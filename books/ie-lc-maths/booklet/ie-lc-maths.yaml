# Leaving Certificate Mathematics — the SEC Formulae and Tables booklet.
#
# One national booklet, not a board's own sheet: the State Examinations
# Commission publishes it and the superintendent issues it to every candidate.
# The same document serves Mathematics, Physics, Chemistry and Applied
# Mathematics, so there is no choice of board and nothing is tier-restricted —
# every item is `given` to every candidate at every level.
#
# Source and fidelity notes are in `meta` below. The extraction command is in
# research/sources/ie-lc-maths/EXTRACTION-NOTE.md, which matters: the booklet's
# CropBox clips most of every page.
meta:
  title: Leaving Certificate Mathematics — formulae and tables
  year: state examinations
  note: The State Examinations Commission publishes one booklet for the state examinations, and it is
    the same for Foundation, Ordinary and Higher level. The superintendent issues it at the start of the
    examination and collects it at the end; a candidate may not bring their own copy. Everything printed
    here is therefore given to you, which is why every item is in the `given` group.
  provenance:
    sec: Foirmlí agus Táblaí / Formulae and Tables, approved for use in the state examinations. Coimisiún
      na Scrúduithe Stáit / State Examinations Commission, SEC567/14-V5-Dec2014, ISBN 978 1 4064 2862
      9.
  basis: The booklet is published by the Stationery Office for the State Examinations Commission and is
    issued to every candidate. The mathematics sections reproduced here are pages 8 to 44 of the booklet.
    The physics, chemistry and tables sections are carried by the Physics and Chemistry books, which use
    the same document.
  boards:
    sec:
      name: SEC
      code: State Examinations Commission
  groups:
    given:
      label: In the Formulae and Tables booklet
      tone: accent

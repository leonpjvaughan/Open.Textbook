    latex: s = \sqrt{\frac{\sum (x - \bar{x})^2}{n-1}}
    symbolic: false
    why: 'A \sum with no limits: the parser only reads a sum with explicit bounds, and the sheet prints it this way.'
    provision:
      sec: given
    keywords:
    - statistics
    - sample
    - standard deviation
  - id: standard-error-mean
    name: Standard error of the mean
    latex: \sigma_{\bar{X}} = \frac{\sigma}{\sqrt{n}}
    provision:
      sec: given
    keywords:
    - statistics
    - standard error
    - mean
  - id: standard-error-proportion
    name: Standard error of the proportion
    latex: \sigma_{\hat{P}} = \sqrt{\frac{p(1-p)}{n}}
    provision:
      sec: given
    keywords:
    - statistics
    - standard error
    - proportion
  - id: one-sample-z-test
    name: One-sample z-test
    latex: z = \frac{\bar{x} - \mu}{\sigma/\sqrt{n}}
    provision:
      sec: given
    keywords:
    - statistics
    - hypothesis test
    - z-test

